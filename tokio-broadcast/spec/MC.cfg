\* ===========================================================================
\* Model Checking Configuration — Convergence Mode
\* ===========================================================================
\* Run with: java -jar tla2tools.jar -deadlock MC
\* The -deadlock flag DISABLES deadlock checking.

SPECIFICATION MCSpec

CONSTANTS
    Receiver = {r1, r2}
    Value = {v1, v2}
    Capacity = 2
    MaxPos = 8
    Nil = Nil

    \* Action bounds (convergence: generous limits)
    MaxSends = 4
    MaxSubscribes = 3
    MaxSenderDrops = 2
    MaxSenderClones = 2

\* Symmetry reduction
SYMMETRY ModelSymmetry

\* State constraint
CONSTRAINT StateConstraint

\* --- Standard safety invariants ---
INVARIANTS
    TypeOK
    RemNonNegative
    ValueLifecycle
    LagBounded

\* --- Structural invariants ---
    CloseConsistency
    RxCntConsistency
    WaitersAlive
    ClosePendingImpliesNoSenders

\* --- Extension invariants (Bug Family targets) ---
\* Uncomment during bug hunting; keep commented for convergence.
\*  NoStaleWaiter
\*  NoEmptyDuringClose
\*  NoOrphanedRem
