SPECIFICATION MCSpec

CONSTANTS
    Server = {1, 2, 3}
    Follower = Follower
    Candidate = Candidate
    Leader = Leader
    Nil = 0
    ValueEntry = ValueEntry
    ConfigEntry = ConfigEntry
    BlankEntry = BlankEntry
    VoteRequest = VoteRequest
    VoteResponse = VoteResponse
    AppendEntriesRequest = AppendEntriesRequest
    AppendEntriesResponse = AppendEntriesResponse
    InstallSnapshotRequest = InstallSnapshotRequest
    InstallSnapshotResponse = InstallSnapshotResponse
    MaxElectLimit = 3
    MaxRequestLimit = 2
    MaxCrashLimit = 2
    MaxHeartbeatLimit = 4
    MaxConfigLimit = 0
    MaxSnapshotLimit = 1
    MaxLeaseExpireLimit = 3
    MaxMsgBufferLimit = 10

CONSTRAINT
    MsgBufferConstraint

\* Standard safety invariants
\* NOTE: ElectionSafety is intentionally NOT checked — openraft allows
\* multiple leaders per term via vote ordering by (term, node_id).
\* CommitSafety is the actual safety invariant.
INVARIANTS
    MCCommitSafety
    MCLogMatching

\* Structural invariants
INVARIANTS
    MCVoteStateConsistency
    MCCommitIndexBound
    MCNoCommittedLogDeletion
    MCAtMostOneUncommittedMembership

\* Extension invariants (bug-family targeted)
\* Uncomment for targeted hunting after convergence.
\* INVARIANTS
\*     MCLeaseImpliesLeadership
\*     MCSnapshotLogConsistency
\*     MCLeaderCompleteness
\*     MCRestartedLeaderSafety
