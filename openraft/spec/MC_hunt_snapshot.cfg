\* Hunting config: Bug Family 2 — Snapshot Installation / Log Consistency
\* Targets: SnapshotLogConsistency, LeaderCompleteness, NoCommittedLogDeletion
\* Strategy: snapshot + crash + restart, minimal elections

SPECIFICATION MCSpec

CONSTANTS
    Server = {1, 2, 3}
    Follower = Follower
    Candidate = Candidate
    Leader = Leader
    Nil = 0
    ValueEntry = ValueEntry
    ConfigEntry = ConfigEntry
    BlankEntry = BlankEntry
    VoteRequest = VoteRequest
    VoteResponse = VoteResponse
    AppendEntriesRequest = AppendEntriesRequest
    AppendEntriesResponse = AppendEntriesResponse
    InstallSnapshotRequest = InstallSnapshotRequest
    InstallSnapshotResponse = InstallSnapshotResponse
    MaxElectLimit = 3
    MaxRequestLimit = 3
    MaxCrashLimit = 2
    MaxHeartbeatLimit = 2
    MaxConfigLimit = 0
    MaxSnapshotLimit = 2
    MaxLeaseExpireLimit = 1
    MaxMsgBufferLimit = 10


CONSTRAINT
    MsgBufferConstraint

INVARIANTS
    MCCommitSafety
    MCSnapshotLogConsistency
    MCLeaderCompleteness
    MCNoCommittedLogDeletion
