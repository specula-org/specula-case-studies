INIT TraceInit
NEXT TraceNext

CONSTANTS
    Server = {1, 2, 3}
    Follower = Follower
    Candidate = Candidate
    Leader = Leader
    Nil = 0
    ValueEntry = ValueEntry
    ConfigEntry = ConfigEntry
    BlankEntry = BlankEntry
    VoteRequest = VoteRequest
    VoteResponse = VoteResponse
    AppendEntriesRequest = AppendEntriesRequest
    AppendEntriesResponse = AppendEntriesResponse
    InstallSnapshotRequest = InstallSnapshotRequest
    InstallSnapshotResponse = InstallSnapshotResponse

\* Use INIT/NEXT (not SPECIFICATION) for deadlock-based completion checking.
\* TLC stops at deadlock = entire trace consumed.
\* Run with: java -jar tla2tools.jar -deadlock Trace

INVARIANTS
    VoteStateConsistency
    CommitIndexBound
