\* Hunting config: Family 4 — Publish Path Variants
\* Enable try_publish + take_inner, check safety across all variants.
\* Expected: PASS (all variants provide same safety guarantees)

SPECIFICATION MCSpec

CONSTANTS
    Reader = {R1, R2}
    MaxOps = 3

    \* Family 4: enable variant paths
    MaxTakeInner = 1
    MaxTryPublish = 2

    \* Disable fault injection
    MaxReaderFenceSkips = 0
    MaxWriterFenceSkips = 0
    MaxNonDetAbsorbs = 0
    MaxClones = 0
    MaxRegistrations = 0

CONSTRAINT MCStateConstraint

SYMMETRY MCSymmetry

INVARIANTS
    MCTypeOK
    MCEpochParity
    MCPointerDisjoint
    MCNoWriteWhileRead
    MCApplyCorrectness
    MCVariantSafety
