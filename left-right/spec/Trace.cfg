\* Trace validation config for left-right
\* Category B (concurrent/lock-free): timebox-based per-thread traces
\*
\* Uses INIT/NEXT (not SPECIFICATION) for deadlock-based completion checking.
\* TLC reports deadlock when trace is fully consumed — this is expected success.

INIT TraceInit
NEXT TraceNext

CONSTANTS
    Reader = {"r1", "r2"}
    MaxOps = 10

\* Safety invariants (should hold on every real execution)
INVARIANTS
    TraceTypeOK
    TraceEpochParity
    TracePointerDisjoint
    TraceNoWriteWhileRead
    TraceApplyCorrectness

\* Deadlock checking is ENABLED (no -deadlock flag)
\* TLC will report "deadlock" when all trace events consumed — this is success
