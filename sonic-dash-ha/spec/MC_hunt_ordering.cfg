\* MC_hunt_ordering.cfg — Bug Family 2: Message Ordering / Missing State
\* Targets: MC-3 (config before vDPU), MC-4 (vDPU drops before config),
\*          MC-5 (first config skips BFD/VNet)
\* Strategy: Enable health changes + desired state changes, check PrerequisiteRespected.

CONSTANTS
    Node = {n1, n2}
    MaxTerm = 3
    MaxRetries = 2

    \* Tight bounds: focus on ordering
    MaxCrashLimit = 0
    MaxLoseLimit = 2
    MaxDeleteLimit = 0
    MaxDesiredChangeLimit = 3
    MaxHealthChangeLimit = 4
    MaxStandaloneLimit = 1

SYMMETRY ModelSymmetry

INIT MCInit
NEXT MCNext

\* Target invariant
INVARIANT PrerequisiteRespected

\* Core safety
INVARIANT SingleDecisionMaker
INVARIANT TypeOK

CONSTRAINT MsgBufferConstraint
