\* MC.cfg — Standard model checking configuration.
\*
\* KNOWN BUGS FOUND (HLD election algorithm):
\*   1. Cross-vote race: simultaneous RequestVote → dual InitToActive → dual Active
\*   2. DPU health race: both DPUs down → dual Standalone
\*
\* Structural invariants are always checked.
\* Safety invariants that detect known bugs are commented out (use hunt configs).

CONSTANTS
    Node = {n1, n2}
    MaxTerm = 4
    MaxRetries = 3

    \* Fault injection bounds
    MaxCrashLimit = 2
    MaxLoseLimit = 3
    MaxDeleteLimit = 2
    MaxDesiredChangeLimit = 4
    MaxHealthChangeLimit = 5
    MaxStandaloneLimit = 3

SYMMETRY ModelSymmetry

INIT MCInit
NEXT MCNext

\* --- Structural invariants (always hold) ---
INVARIANT TypeOK
INVARIANT MessageWellFormed
INVARIANT TermNonNegative
INVARIANT FaultCountersOK

\* --- Safety invariants (violated by known election/health bugs) ---
\* INVARIANT SingleDecisionMaker
\* INVARIANT EffectiveSingleDecisionMaker
\* INVARIANT NoDoubleActive
\* INVARIANT NoDoubleInitActive
\* INVARIANT NoStandaloneStandalone

\* --- Extension invariants (hunt only) ---
\* INVARIANT NoOrphanActors
\* INVARIANT PrerequisiteRespected
\* INVARIANT NoPendingWhileDeciding

\* --- State space constraint ---
CONSTRAINT MsgBufferConstraint
