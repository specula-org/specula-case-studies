\* MC_hunt_lifecycle.cfg — Bug Family 1: Actor Lifecycle Deletion Gaps
\* Targets: MC-1 (DPU deletion orphans vDPU), MC-2 (HA set orphans HA scope)
\* Strategy: Enable DeleteActor, check NoOrphanActors.

CONSTANTS
    Node = {n1, n2}
    MaxTerm = 2
    MaxRetries = 1

    \* Tight bounds: focus on deletion
    MaxCrashLimit = 0
    MaxLoseLimit = 0
    MaxDeleteLimit = 3
    MaxDesiredChangeLimit = 1
    MaxHealthChangeLimit = 2
    MaxStandaloneLimit = 0

SYMMETRY ModelSymmetry

INIT MCInit
NEXT MCNext

\* Target invariant
INVARIANT NoOrphanActors

\* Core safety (always check)
INVARIANT SingleDecisionMaker
INVARIANT TypeOK

CONSTRAINT MsgBufferConstraint
