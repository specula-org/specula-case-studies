\* MC_hunt_family5_lockout_depth.cfg
\* Bug Family 5: Lockout Defense-in-Depth Gaps.
\* Brief 6.1: (no model-checkable finding numbered for Family 5, but the brief
\* asks for verification that single-site lockout + sparse depth thresholds
\* are sufficient under Byzantine pressure).
\*
\* Hunts:
\*   - LockoutSafety under Byzantine equivocation + crash + adopt.
\*   - Combined with Family 1 adoption — does an honest tower retain lockout?
\*
\* This is essentially LockoutSafety with full Byzantine adversary enabled,
\* and crash counters at 1 so the test is whether the lockout invariant holds
\* across crash boundaries (not just within steady-state).

CONSTANTS
    Server = {v1, v2, v3, v4}
    Byzantine = {v4}
    MaxSlot = 3
    Nil = Nil
    Hashes = {hA, hB}
    TwoForkRoot = hA
    MainForkHash = hA
    AltForkHash = hB
    SwitchNumer = 38
    SwitchDenom = 100
    OCNumer = 2
    OCDenom = 3
    DupNumer = 52
    DupDenom = 100
    LockoutThresholdDepths = {4, 5, 8}

    MaxCrashLimit         = 1
    MaxCrashFsyncLimit    = 1
    MaxDropLimit          = 1
    MaxAdoptLimit         = 1
    MaxByzEquivLimit      = 1
    MaxByzFakeGossipLimit = 1
    MaxByzBankCraftLimit  = 1
    MaxByzDupConfLimit    = 0
    MaxByzReuseLimit      = 0
    MaxMsgBufferLimit     = 8

SPECIFICATION MCSpec

SYMMETRY MCSymmetry

VIEW MCView

CONSTRAINT MsgBufferConstraint

CHECK_DEADLOCK FALSE

INVARIANTS
    LockoutSafety
    RootedSlotsForkConsistent
    NoEquivocatingVoteFromHonest
    \* Sanity:
    TowerLastVotedSlotInRange
    OCStakeWellFormed
    RootedHashWellFormed
    ForkTreeWellFormed
    PanicImpliesDead
