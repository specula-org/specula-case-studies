\* base.cfg — Standalone base spec configuration for spec validation.
\* The MC harness is in MC.cfg; this file is for quick sanity-check runs.

CONSTANTS
    Server = {v1, v2, v3, v4}
    Byzantine = {v4}
    MaxSlot = 3
    Nil = Nil
    Hashes = {hA, hB}
    TwoForkRoot = hA
    MainForkHash = hA
    AltForkHash = hB
    SwitchNumer = 38
    SwitchDenom = 100
    OCNumer = 2
    OCDenom = 3
    DupNumer = 52
    DupDenom = 100
    LockoutThresholdDepths = {4, 5, 8}

SPECIFICATION Spec

INVARIANTS
    LockoutSafety
    NoEquivocatingVoteFromHonest
    OCStakeIdempotent
    RootedContainsGenesis
    TowerSlotBound
    PanicImpliesDead
