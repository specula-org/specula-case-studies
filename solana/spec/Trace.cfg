\* Trace.cfg — Trace validation configuration for Solana Tower BFT.
\*
\* Replays implementation traces (recorded by the instrumented agave validator)
\* against the base spec, verifying state transitions match.
\*
\* JSON path defaults to ../traces/trace.ndjson; override with -DJSON=...
\* on the TLC command line.

CONSTANTS
    \* Server / Byzantine / Hashes use string literals because the trace
    \* harness emits JSON strings (it cannot encode TLA+ model values).  TLA+
    \* compares strings structurally, so this is equivalent to model-value
    \* enumerated constants.
    Server = {"v1", "v2", "v3", "v4"}
    Byzantine = {"v4"}
    MaxSlot = 3
    Nil = Nil
    Hashes = {"hA", "hB"}
    TwoForkRoot = "hA"
    MainForkHash = "hA"
    AltForkHash = "hB"
    SwitchNumer = 38
    SwitchDenom = 100
    OCNumer = 2
    OCDenom = 3
    DupNumer = 52
    DupDenom = 100
    LockoutThresholdDepths = {4, 5, 8}

SPECIFICATION TraceSpec

\* Trace validation must check TraceMatched temporal property — otherwise
\* TLC will report "no errors" even when the cursor never advances.
PROPERTIES TraceMatched

\* When the trace is fully consumed (l > Len(TraceLog)) no event-consuming
\* action remains enabled.  TLC reports this as a deadlock, but for trace
\* validation that is the expected terminal condition.
CHECK_DEADLOCK FALSE

\* Core safety invariants — should hold on every real execution.
\* (Fault-injection invariants like OCRollbackBounded are excluded —
\*  they only apply when fault actions fire, and trace runs without faults.)
INVARIANTS
    \* Lockout safety holds in every real execution; if a trace violates it,
    \* either the spec is wrong or the implementation has a bug.
    LockoutSafety
    \* The OC stake bookkeeping should never reach two hashes at one slot
    \* in a real (non-Byzantine) execution.
    NoEquivocatingVoteFromHonest
    \* Structural sanity:
    OCStakeIdempotent
    RootedContainsGenesis
    TowerSlotBound
    PanicImpliesDead
