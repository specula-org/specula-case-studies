\* MC.cfg — Convergence configuration for Solana Tower BFT MC spec.
\*
\* Bounds:
\*   4 validators (3 honest + 1 Byzantine), MaxSlot=3, 2 hashes per slot.
\*   With Byzantine = 1/4 stake, the threat profile is f = ceil(n/3) = 2 in
\*   stake-weighted terms.  We use uniform stake (each validator = 1 unit).
\*
\* Bug-family (extension) invariants are commented out here; they are enabled
\* in MC_hunt_<family>.cfg.  This matches the methodology in mc-spec-pattern.md
\* — `MC.cfg` is for spec convergence (state-space sanity + structural checks).

CONSTANTS
    Server = {v1, v2, v3, v4}
    Byzantine = {v4}
    MaxSlot = 3
    Nil = Nil
    Hashes = {hA, hB}
    TwoForkRoot = hA
    MainForkHash = hA
    AltForkHash = hB
    SwitchNumer = 38
    SwitchDenom = 100
    OCNumer = 2
    OCDenom = 3
    DupNumer = 52
    DupDenom = 100
    LockoutThresholdDepths = {4, 5, 8}

    \* Fault counters — conservative starting bounds.
    MaxCrashLimit         = 1
    MaxCrashFsyncLimit    = 1
    MaxDropLimit          = 2
    MaxAdoptLimit         = 1
    MaxByzEquivLimit      = 1
    MaxByzFakeGossipLimit = 1
    MaxByzBankCraftLimit  = 1
    MaxByzDupConfLimit    = 2
    MaxByzReuseLimit      = 1
    MaxMsgBufferLimit     = 8

SPECIFICATION MCSpec

SYMMETRY MCSymmetry

VIEW MCView

CONSTRAINT MsgBufferConstraint

\* When all bounded counters (crash, Byzantine, msg buffer) exhaust and vote slots
\* reach MaxSlot, no actions remain enabled.  TLC reports that as a deadlock, but
\* for a bounded BFT model that is the expected terminal state.
CHECK_DEADLOCK FALSE

\* Structural / sanity invariants (always-on; cheap, catch spec bugs).
INVARIANTS
    TowerLastVotedSlotInRange
    OCStakeWellFormed
    RootedHashWellFormed
    ForkTreeWellFormed
    OCStakeIdempotent
    RootedContainsGenesis
    TowerSlotBound
    PanicImpliesDead

\* Extension (bug-family) invariants are enabled in hunt cfgs, not here.
\* Uncomment to run a full hunt against this base configuration:
\*   LockoutSafety
\*   NoEquivocatingVoteFromHonest
\*   NoDualHashOC
\*   OCRollbackBounded
\*   NoDualHashDuplicateConfirm
\*   SwitchProofRequiresRealLockout
\*   TowerConsistentWithPersistedAfterCrash
\*   AdoptOnChainTowerNoLossOfDurableVote
\*   TowerVotesAreOnExistingForks
\*   RootedSlotsForkConsistent
\*   NoHonestPanic

\* Liveness — leave for simulation runs only.
\* PROPERTIES
\*     OCEventuallyRooted
\*     NoHonestPermanentPanic
