\* MC_hunt_family2_switch_threshold.cfg
\* Bug Family 2: Switch-Threshold Manipulability via Gossip-Originated Latest Votes.
\* Brief 6.1 findings: MC-3, MC-7.
\*
\* Hunts:
\*   - Byzantine fakes gossip latest-vote (ByzGossipFakeLatestFrozenVote) to inflate
\*     switch-threshold stake (Family 2.7 cert manipulation).
\*   - Stale gossip vote reuse (Byzantine 2.5 replay) over multi-root advances.
\*
\* Composition: 2.7 × 2.5; honest validators alive throughout.

CONSTANTS
    Server = {v1, v2, v3, v4}
    Byzantine = {v4}
    MaxSlot = 3
    Nil = Nil
    Hashes = {hA, hB}
    TwoForkRoot = hA
    MainForkHash = hA
    AltForkHash = hB
    SwitchNumer = 38
    SwitchDenom = 100
    OCNumer = 2
    OCDenom = 3
    DupNumer = 52
    DupDenom = 100
    LockoutThresholdDepths = {4, 5, 8}

    \* Tight focus on the fake-gossip + switch-vote path.
    MaxCrashLimit         = 0
    MaxCrashFsyncLimit    = 0
    MaxDropLimit          = 1
    MaxAdoptLimit         = 0
    MaxByzEquivLimit      = 1
    MaxByzFakeGossipLimit = 3
    MaxByzBankCraftLimit  = 0
    MaxByzDupConfLimit    = 0
    MaxByzReuseLimit      = 2
    MaxMsgBufferLimit     = 8

SPECIFICATION MCSpec

SYMMETRY MCSymmetry

VIEW MCView

CONSTRAINT MsgBufferConstraint

CHECK_DEADLOCK FALSE

INVARIANTS
    SwitchProofRequiresRealLockout
    LockoutSafety
    \* Sanity:
    TowerLastVotedSlotInRange
    OCStakeWellFormed
    RootedHashWellFormed
    ForkTreeWellFormed
    PanicImpliesDead
