\* MC_hunt_family1_tower_adoption.cfg
\* Bug Family 1: Tower Adoption & Crash-Recovery Hazards.
\* Brief 6.1 findings: MC-2, MC-8.
\*
\* Hunts:
\*   - Crash between RecordVote / PersistTower / BroadcastVote loses durable record
\*   - AdoptOnChainTowerIfBehind from Byzantine-influenced bank corrupts tower
\*   - persistedTower regression on non-fsync'd writes
\*
\* Composition: 5.1 Crash × 5.4 NonAtomicPersist × 2.6 Amnesia × 2.2 InvalidContent.

CONSTANTS
    Server = {v1, v2, v3, v4}
    Byzantine = {v4}
    MaxSlot = 3
    Nil = Nil
    Hashes = {hA, hB}
    TwoForkRoot = hA
    MainForkHash = hA
    AltForkHash = hB
    SwitchNumer = 38
    SwitchDenom = 100
    OCNumer = 2
    OCDenom = 3
    DupNumer = 52
    DupDenom = 100
    LockoutThresholdDepths = {4, 5, 8}

    \* Tight focus on tower-adoption + crash compositions.
    MaxCrashLimit         = 2
    MaxCrashFsyncLimit    = 2
    MaxDropLimit          = 1
    MaxAdoptLimit         = 2
    MaxByzEquivLimit      = 0
    MaxByzFakeGossipLimit = 0
    MaxByzBankCraftLimit  = 2
    MaxByzDupConfLimit    = 0
    MaxByzReuseLimit      = 0
    MaxMsgBufferLimit     = 6

SPECIFICATION MCSpec

SYMMETRY MCSymmetry

VIEW MCView

CONSTRAINT MsgBufferConstraint

CHECK_DEADLOCK FALSE

\* Family-1 invariants + foundational safety invariants.
INVARIANTS
    LockoutSafety
    TowerConsistentWithPersistedAfterCrash
    AdoptOnChainTowerNoLossOfDurableVote
    \* Sanity:
    TowerLastVotedSlotInRange
    OCStakeWellFormed
    RootedHashWellFormed
    ForkTreeWellFormed
    PanicImpliesDead
