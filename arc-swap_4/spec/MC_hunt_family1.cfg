\* MC_hunt_family1.cfg — hunt Family 1 (Memory-Ordering Bridges Across Variables)
\* Mechanism: PickRelaxSite picks one labelled atomic site to downgrade.
\* Targets: #76, #156, #198, #200, #204 — recreates pre-fix bugs by making
\*          the SC label at one site no longer participate in SC total order.
\* Findings hit (brief §6.1):
\*   MC2 — fallback `storage.load(SeqCst)` Acquire ⇒ UAF (sensitivity / robustness check)
\*   MC3 — same as MC2 explicitly framed as a sensitivity check (counterexample
\*         expected; confirms spec is faithful enough to expose pre-fix bug)
\* Also exercises FastConfirmLoad / DebtPaySuccess / DebtPayFailure / ListHeadLoad
\* downgrades — each produces a slightly different witness.

SPECIFICATION MCSpec

\* Bounded counter cfg: once counters are exhausted, no more enabled actions —
\* legitimate end-of-test state.
CHECK_DEADLOCK FALSE

CONSTANTS
    Thread = {t1, t2}
    Addr = {a1, a2, a3}
    InitAddr = a1
    NumFastSlots = 1
    MaxHelpGen = 8
    MaxGuardsPerThread = 1
    NullPtr = "NULL"
    NoneGid = "NONE"
    NoneSite = "NONE_SITE"

    \* Tight bounds.  ONE relaxation per execution; everything else minimal.
    MaxOrderingGaps = 1
    MaxSendGuards   = 0
    MaxGuardClones  = 0
    MaxArcSwapDrops = 0
    MaxCASRawStale  = 0
    MaxSwaps        = 1
    MaxCASOps       = 0

SYMMETRY MCSymmetry
VIEW     MCView

INVARIANTS
    MCTypeOK
    MCNoUseAfterFree
    MCPayAllCompleteness
    MCNoTornGuardState
    MCRefCountNonNeg
    MCInflightHelpBounded
    MCLocalNodeOwnership
    \* MCNoStaleWithoutRelax — too strong as a state predicate: the reader's
    \* rConfirmAddr is captured at ConfirmLoad and held in state until BranchHit
    \* / Resolve fires; if a writer swaps in between, this invariant trips even
    \* under SC.  Documentation only.
