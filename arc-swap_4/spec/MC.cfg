\* MC.cfg — convergence config for arc-swap base spec (round 4).
\* Tight bounds; no bug-family invariant (those are in MC_hunt_*.cfg).
\* MaxHelpGen large enough that wrap doesn't fire — Family 5's NoDanglingTransaction
\* should hold under SC + no wrap.

SPECIFICATION MCSpec

\* Bounded counter cfg: once MaxSwaps / MaxCASOps / MaxSendGuards etc. are
\* exhausted, the system has no more enabled actions.  This is a legitimate
\* end-of-test state, not a system-level deadlock.
CHECK_DEADLOCK FALSE

CONSTANTS
    Thread = {t1, t2}
    Addr = {a1, a2, a3}
    InitAddr = a1
    NumFastSlots = 1
    MaxHelpGen = 8        \* large enough that wrap doesn't fire in convergence run
    MaxGuardsPerThread = 1
    NullPtr = "NULL"
    NoneGid = "NONE"
    NoneSite = "NONE_SITE"

    \* MC counters — convergence: keep all fault-injections at 0 except the
    \* normal-operation bounds.  Hunting configs override these.
    MaxOrderingGaps = 0
    MaxSendGuards   = 0
    MaxGuardClones  = 0
    MaxArcSwapDrops = 0
    MaxCASRawStale  = 0
    MaxSwaps        = 1
    MaxCASOps       = 0

SYMMETRY MCSymmetry
VIEW     MCView

\* ----------------------------------------------------------------------------------
\* Invariants — categories
\* ----------------------------------------------------------------------------------

INVARIANTS
    \* Type / structural (always on)
    MCTypeOK
    MCRefCountNonNeg
    MCDeadRefCountZero
    MCStorageLive
    MCReaderWriterExclusive
    MCAllOccupantsAllocated
    MCNoConcurrentNodeClaim
    MCInflightHelpBounded
    MCLocalNodeOwnership

    \* MCCooldownDrainSafety — held implicitly via InflightHelpBounded
    \* (|inflightHelp[n]| ≤ activeWriters[n], so activeWriters=0 ⇒ inflightHelp={}).
    \* Enabled explicitly in MC_hunt_family4.cfg as the family-4 bug-detection invariant.

    \* Bug-family invariants — re-enabled in MC_hunt_*.cfg.  Convergence run uses
    \* SC labels (MaxOrderingGaps=0) + no wrap (MaxHelpGen=8) so these should hold;
    \* commented out only to reduce per-state validation cost.
    \* MCNoUseAfterFree              \* enabled in MC_hunt_family1.cfg, family2, family3
    \* MCPayAllCompleteness          \* enabled in MC_hunt_family1.cfg, family3
    \* MCStaleSnapshotSafety         \* enabled in MC_hunt_family3.cfg
    \* MCNoTornGuardState            \* enabled in MC_hunt_family1.cfg, family2, family3
    \* MCRefCountAccounting          \* enabled in MC_hunt_family2.cfg
    \* MCCASIntendedSemantics        \* enabled in MC_hunt_family2.cfg
    \* MCNoOrphanedDebt              \* enabled in MC_hunt_family2.cfg
    \* MCNoStaleWithoutRelax         \* enabled in MC_hunt_family1.cfg
    \* MCNoDanglingTransaction       \* enabled in MC_hunt_family5.cfg
