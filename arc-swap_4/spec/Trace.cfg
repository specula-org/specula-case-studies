\* Trace.cfg — replay implementation traces against base spec (round 4).
SPECIFICATION TraceSpec

CONSTANTS
    Thread = {"t1", "t2", "t3"}
    Addr = {"a1", "a2", "a3", "a4"}
    InitAddr = "a1"
    NumFastSlots = 8
    MaxHelpGen = 8
    MaxGuardsPerThread = 2
    NullPtr = "NULL"
    NoneGid = "NONE"
    NoneSite = "NONE_SITE"

\* TraceMatched: temporal property — entire trace must be consumed.
PROPERTIES
    TraceMatched

\* Safety invariants — checked on every reachable trace state.
\* Bug-family invariants are excluded per skill guide: traces run without fault
\* injection, so they should hold trivially on real executions and are hunted
\* with MC_hunt_*.cfg, not Trace.cfg.
\*
\* Round 4 note: NoDanglingTransaction is *expected to hold* on real executions
\* because production-scale runs do not exercise generation wrap (2^62 fallback
\* calls on 64-bit).  We do not include it here — its violation in MC_hunt_family5.cfg
\* under tight MaxHelpGen=4 is the bug detection signal, not trace replay.
INVARIANTS
    TypeOK
    RefCountNonNeg
    DeadRefCountZero
    StorageLive
    AllOccupantsAllocated
    NoConcurrentNodeClaim
    InflightHelpBounded
    LocalNodeOwnership
