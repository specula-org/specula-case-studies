\* Bug Family 1: Coordinator Recovery Under Stepdown
\* Targets: MC-1 (stepdown between config commit and persistDecision)
\*          MC-2 (w:1 forgetMigration rollback)
\*          MC-4 (recipient holds critical section after donor forgets)
\*          MC-8 (post-commit refresh failure)
\*
\* Strategy: maximize stepdown/stepup, minimize aborts

INIT MCInit
NEXT MCNext

CONSTANTS
    s1 = s1
    s2 = s2
    Shard = {s1, s2}
    k1 = k1
    Key = {k1}
    Nil = Nil

    MaxMigrations = 2
    MaxStepdowns = 3
    MaxStepUps = 3
    MaxAborts = 0
    MaxMajorityReplicates = 2

SYMMETRY ModelSymmetry

CONSTRAINT StateConstraint

INVARIANTS
    MCRecoveryConsistency
    MCCoordinatorDecisionDurability
    MCNoOrphanedCriticalSection
    MCChunkOwnershipConsistent
