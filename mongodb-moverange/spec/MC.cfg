INIT MCInit
NEXT MCNext

CONSTANTS
    s1 = s1
    s2 = s2
    Shard = {s1, s2}
    k1 = k1
    Key = {k1}
    Nil = Nil

    MaxMigrations = 2
    MaxStepdowns = 2
    MaxStepUps = 2
    MaxAborts = 1
    MaxMajorityReplicates = 1

SYMMETRY ModelSymmetry

CONSTRAINT StateConstraint

\* --- Structural invariants (always enabled) ---
INVARIANTS
    MCCoordDocWellFormed
    MCRangeDelImpliesData
    MCMigrationParticipantsDistinct

\* --- Safety invariants ---
    MCChunkOwnershipConsistent
    MCRecoveryConsistency
    MCNoOverlappingMigrations
    MCRangeDeletionSafety
    MCCoordinatorDecisionDurability
    MCNoOrphanedCriticalSection
