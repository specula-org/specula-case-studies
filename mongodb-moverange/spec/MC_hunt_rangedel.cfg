\* Bug Family 2: Range Deletion Safety
\* Targets: MC-5 (back-to-back migration before deletion completes)
\*          MC-6 (range deletion TOCTOU)
\*          MC-7 (duplicate range deletion tasks after stepdown/stepup)
\*
\* Strategy: multiple migrations, allow stepdown for dup-task scenario

INIT MCInit
NEXT MCNext

CONSTANTS
    s1 = s1
    s2 = s2
    Shard = {s1, s2}
    k1 = k1
    Key = {k1}
    Nil = Nil

    MaxMigrations = 3
    MaxStepdowns = 2
    MaxStepUps = 2
    MaxAborts = 1
    MaxMajorityReplicates = 1

SYMMETRY ModelSymmetry

CONSTRAINT StateConstraint

INVARIANTS
    MCRangeDeletionSafety
    MCNoOverlappingMigrations
    MCChunkOwnershipConsistent
    MCRangeDelImpliesData
