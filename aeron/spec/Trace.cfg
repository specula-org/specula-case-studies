\* Trace validation config for Aeron Cluster
\* Run with: java -jar tla2tools.jar -config Trace.cfg Trace.tla
\* Override trace file: java -DJSON=../traces/my_trace.ndjson -jar tla2tools.jar ...

INIT TraceInit
NEXT TraceNext

CONSTANTS
    Server = {"s1", "s2", "s3"}
    Nil = "nil"
    ES_Init = "ES_Init"
    ES_Canvass = "ES_Canvass"
    ES_Nominate = "ES_Nominate"
    ES_CandidateBallot = "ES_CandidateBallot"
    ES_FollowerBallot = "ES_FollowerBallot"
    ES_Leader = "ES_Leader"
    ES_Follower = "ES_Follower"
    CanvassPositionMsg = "CanvassPositionMsg"
    RequestVoteMsg = "RequestVoteMsg"
    RequestVoteResponseMsg = "RequestVoteResponseMsg"
    NewLeadershipTermMsg = "NewLeadershipTermMsg"
    CommitPositionMsg = "CommitPositionMsg"
    AppendPositionUpdateMsg = "AppendPositionUpdateMsg"

\* Check base spec invariants during trace validation
INVARIANTS
    ElectionSafety
    TruncationSafety
    CommitBound

\* Deadlock checking disabled — deadlock at end of trace means success
\* CHECK_DEADLOCK FALSE

\* PROPERTY TraceMatched
