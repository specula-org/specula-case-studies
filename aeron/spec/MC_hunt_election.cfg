\* Hunting config: Bug Family 2 — Election State Machine Transition Bugs
\* Targets: ElectionSafety, VoteUniqueness
\* Strategy: Multiple elections with competing candidates, message loss
\* to create split-vote and premature quorum scenarios.

SPECIFICATION MCSpec

CONSTANTS
    Server = {s1, s2, s3}
    Nil = "nil"
    ES_Init = "ES_Init"
    ES_Canvass = "ES_Canvass"
    ES_Nominate = "ES_Nominate"
    ES_CandidateBallot = "ES_CandidateBallot"
    ES_FollowerBallot = "ES_FollowerBallot"
    ES_Leader = "ES_Leader"
    ES_Follower = "ES_Follower"
    CanvassPositionMsg = "CanvassPositionMsg"
    RequestVoteMsg = "RequestVoteMsg"
    RequestVoteResponseMsg = "RequestVoteResponseMsg"
    NewLeadershipTermMsg = "NewLeadershipTermMsg"
    CommitPositionMsg = "CommitPositionMsg"
    AppendPositionUpdateMsg = "AppendPositionUpdateMsg"
    \* Tight bounds: maximize election scenarios
    MaxTimeoutLimit = 5
    MaxCrashLimit = 1
    MaxRequestLimit = 2
    MaxLoseLimit = 3
    MaxInactiveLimit = 0
    MaxSessionLimit = 0
    MaxPublishLimit = 3
    MaxTermLimit = 5

SYMMETRY MCSymmetry
CONSTRAINT StateConstraint

INVARIANTS
    MCElectionSafety
    MCVoteUniqueness
    MCLogMatching

PROPERTY CandidateTermNeverDecreases
