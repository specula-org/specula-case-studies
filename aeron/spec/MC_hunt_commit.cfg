\* Hunting config: Bug Family 1 — Commit Position Safety Violations
\* Targets: CommitBoundedByQuorum, NoUncommittedReplay, LeaderCompleteness
\* Strategy: Multiple elections + client requests to advance commit, then
\* partition (lose messages) to create commit regression opportunity.

SPECIFICATION MCSpec

CONSTANTS
    Server = {s1, s2, s3}
    Nil = "nil"
    ES_Init = "ES_Init"
    ES_Canvass = "ES_Canvass"
    ES_Nominate = "ES_Nominate"
    ES_CandidateBallot = "ES_CandidateBallot"
    ES_FollowerBallot = "ES_FollowerBallot"
    ES_Leader = "ES_Leader"
    ES_Follower = "ES_Follower"
    CanvassPositionMsg = "CanvassPositionMsg"
    RequestVoteMsg = "RequestVoteMsg"
    RequestVoteResponseMsg = "RequestVoteResponseMsg"
    NewLeadershipTermMsg = "NewLeadershipTermMsg"
    CommitPositionMsg = "CommitPositionMsg"
    AppendPositionUpdateMsg = "AppendPositionUpdateMsg"
    \* Tight bounds: focus on commit advancement
    MaxTimeoutLimit = 3
    MaxCrashLimit = 1
    MaxRequestLimit = 3
    MaxLoseLimit = 4
    MaxInactiveLimit = 0
    MaxSessionLimit = 0
    MaxPublishLimit = 8
    MaxTermLimit = 4

SYMMETRY MCSymmetry
CONSTRAINT StateConstraint

INVARIANTS
    MCElectionSafety
    MCCommitBoundedByQuorum
    MCNoUncommittedReplay
    MCLeaderCompleteness
