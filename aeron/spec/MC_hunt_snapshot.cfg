\* Hunting config: Bug Family 5 — Snapshot State Divergence
\* Targets: SnapshotConsistency
\* Strategy: Leader appends session entries, commit is advanced, then check
\* if leader and follower have same nextSessionId at same commitPosition.
\* Expected: VIOLATION — leader increments on append, follower on replay.

SPECIFICATION MCSpec

CONSTANTS
    Server = {s1, s2, s3}
    Nil = "nil"
    ES_Init = "ES_Init"
    ES_Canvass = "ES_Canvass"
    ES_Nominate = "ES_Nominate"
    ES_CandidateBallot = "ES_CandidateBallot"
    ES_FollowerBallot = "ES_FollowerBallot"
    ES_Leader = "ES_Leader"
    ES_Follower = "ES_Follower"
    CanvassPositionMsg = "CanvassPositionMsg"
    RequestVoteMsg = "RequestVoteMsg"
    RequestVoteResponseMsg = "RequestVoteResponseMsg"
    NewLeadershipTermMsg = "NewLeadershipTermMsg"
    CommitPositionMsg = "CommitPositionMsg"
    AppendPositionUpdateMsg = "AppendPositionUpdateMsg"
    \* Tight bounds: focus on session append + commit cycle
    MaxTimeoutLimit = 2
    MaxCrashLimit = 0
    MaxRequestLimit = 1
    MaxLoseLimit = 1
    MaxInactiveLimit = 0
    MaxSessionLimit = 3
    MaxPublishLimit = 6
    MaxTermLimit = 2

SYMMETRY MCSymmetry
CONSTRAINT StateConstraint

INVARIANTS
    MCElectionSafety
    MCSnapshotConsistency
