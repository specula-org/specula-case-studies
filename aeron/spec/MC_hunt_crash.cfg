\* Hunting config: Bug Family 6 — Non-Atomic Persistence / Crash Recovery
\* Targets: VoteRecovery, VoteUniqueness, ElectionSafety
\* Strategy: Crash servers during election cycles, verify no double-voting
\* or safety violation after recovery from persisted candidateTermId.

SPECIFICATION MCSpec

CONSTANTS
    Server = {s1, s2, s3}
    Nil = "nil"
    ES_Init = "ES_Init"
    ES_Canvass = "ES_Canvass"
    ES_Nominate = "ES_Nominate"
    ES_CandidateBallot = "ES_CandidateBallot"
    ES_FollowerBallot = "ES_FollowerBallot"
    ES_Leader = "ES_Leader"
    ES_Follower = "ES_Follower"
    CanvassPositionMsg = "CanvassPositionMsg"
    RequestVoteMsg = "RequestVoteMsg"
    RequestVoteResponseMsg = "RequestVoteResponseMsg"
    NewLeadershipTermMsg = "NewLeadershipTermMsg"
    CommitPositionMsg = "CommitPositionMsg"
    AppendPositionUpdateMsg = "AppendPositionUpdateMsg"
    \* Tight bounds: maximize crash-recovery cycles
    MaxTimeoutLimit = 3
    MaxCrashLimit = 3
    MaxRequestLimit = 2
    MaxLoseLimit = 2
    MaxInactiveLimit = 0
    MaxSessionLimit = 0
    MaxPublishLimit = 4
    MaxTermLimit = 5

SYMMETRY MCSymmetry
CONSTRAINT StateConstraint

INVARIANTS
    MCElectionSafety
    MCVoteRecovery
    MCVoteUniqueness

PROPERTY CandidateTermNeverDecreases
