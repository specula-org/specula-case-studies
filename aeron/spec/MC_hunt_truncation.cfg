\* Hunting config: Bug Family 3 — Log Truncation on Leadership Change
\* Targets: LeaderCompleteness, TruncationSafety, LogMatching
\* Strategy: Create divergent logs via partition, then heal and truncate.
\* Need multiple elections so different leaders create different log entries.

