INIT TraceInit
NEXT TraceNext

CONSTANTS
    t1 = t1
    t2 = t2
    t3 = t3
    t4 = t4
    Thread = {t1, t2, t3, t4}
    d1 = d1
    d2 = d2
    Data = {d1, d2}
    Capacity = 0
    NilData = NilData

\* Safety invariants (hold on every real execution)
INVARIANTS
    TraceNoDataRace
    TraceSignalSingleUse
    TraceNoDoubleFree
    TraceNoHangingSignals

\* Structural invariants (catch spec errors)
INVARIANTS
    TraceQueueDataValid
    TraceRefCountConsistency
