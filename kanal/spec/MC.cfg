SPECIFICATION MCSpec

\* Thread and Data model values with symmetry
CONSTANTS
    t1 = t1
    t2 = t2
    t3 = t3
    Thread = {t1, t2, t3}
    d1 = d1
    d2 = d2
    Data = {d1, d2}
    Capacity = 1
    NilData = NilData

\* Counter bounds (convergence: moderate)
CONSTANTS
    MaxSendLimit = 3
    MaxRecvLimit = 3
    MaxTimeoutLimit = 2
    MaxPreemptLimit = 1
    MaxDropFuture = 1
    MaxCloneLimit = 1
    MaxDropLimit = 1
    MaxCloseLimit = 1

SYMMETRY ModelSymmetry

CONSTRAINT StateConstraint

\* --- Structural invariants (always checked) ---
INVARIANTS
    NoDataRace
    SignalSingleUse
    NoDoubleFree
    NoHangingSignals
    CloseTerminatesAll
    WaitListModeConsistency
    QueueDataValid
    RefCountConsistency

\* --- Extension invariants (bug-family targets, enable during hunting) ---
\* INVARIANT WaitCorrectness
\* INVARIANT NoDataLoss
\* INVARIANT CapacityBound
\* INVARIANT HalfCloseDetection
