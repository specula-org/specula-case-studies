\* Hunting config: Family 1 — Session reaper destroys prepared txn state
\* Targets: PreparedTxnSafety, NoTornTransaction, DiskConsistency
\* Strategy: Enable ReaperBypassPreparedCheck + ReaperFailBetweenDeletes fault injection,
\*           minimize unrelated actions.

SPECIFICATION MCSpec

CONSTANTS
    Session = {s1, s2}
    Thread = {t1, t2, t3}
    NilThread = NilThread
    NilSession = NilSession

    \* Tight bounds: only what's needed for reaper + prepared txn interaction
    MaxBeginTxn = 2
    MaxPrepareTxn = 2
    MaxStepDown = 0
    MaxKillSession = 0
    MaxReaperRun = 2
    MaxEagerReap = 1
    MaxEndSession = 0

    \* Fault injection ON for reaper bugs
    MaxReaperBypass = 1
    MaxReaperFail = 1
    MaxEagerReapFail = 1
    MaxKillTimeout = 0

SYMMETRY ModelSymmetry

CONSTRAINT StateConstraint

VIEW MCView

\* Core safety + reaper-targeted invariants
INVARIANTS
    SessionCheckoutExclusive
    PreparedTxnSafety
    NoTornTransaction
    DiskConsistency
