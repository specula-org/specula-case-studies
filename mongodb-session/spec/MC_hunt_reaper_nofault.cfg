\* Hunting config: Reaper safety — no faults, no EndSession
\* Pure reaper + prepared txn interaction without fault injection or EndSession.

SPECIFICATION MCSpec

CONSTANTS
    Session = {s1, s2}
    Thread = {t1, t2, t3}
    NilThread = NilThread
    NilSession = NilSession

    MaxBeginTxn = 2
    MaxPrepareTxn = 2
    MaxStepDown = 0
    MaxKillSession = 0
    MaxReaperRun = 2
    MaxEagerReap = 2
    MaxEndSession = 0

    \* NO fault injection
    MaxReaperBypass = 0
    MaxReaperFail = 0
    MaxEagerReapFail = 0
    MaxKillTimeout = 0

SYMMETRY ModelSymmetry

CONSTRAINT StateConstraint

VIEW MCView

INVARIANTS
    SessionCheckoutExclusive
    PreparedTxnSafety
    NoTornTransaction
    DiskConsistency
