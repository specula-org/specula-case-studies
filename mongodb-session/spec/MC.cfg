SPECIFICATION MCSpec

CONSTANTS
    Session = {s1, s2}
    Thread = {t1, t2, t3}
    NilThread = NilThread
    NilSession = NilSession

    \* Counter bounds — convergence config (no fault injection)
    MaxBeginTxn = 2
    MaxPrepareTxn = 2
    MaxStepDown = 1
    MaxKillSession = 2
    MaxReaperRun = 1
    MaxEagerReap = 1
    MaxEndSession = 1

    \* Fault injection OFF for convergence
    MaxReaperBypass = 0
    MaxReaperFail = 0
    MaxEagerReapFail = 0
    MaxKillTimeout = 0

SYMMETRY ModelSymmetry

CONSTRAINT StateConstraint

VIEW MCView

\* Standard safety invariants
INVARIANTS
    SessionCheckoutExclusive
    CheckedOutExists
    KillsRequestedNonNeg
    ThreadSessionConsistency
    ReaperTargetsConsistency
    TxnStateValid

\* Extension invariants — COMMENTED OUT during convergence, enabled in hunting configs
\* INVARIANTS
\*     PreparedTxnSafety
\*     NoTornTransaction
\*     DiskConsistency
\*     NoKillsRequestedLeak
\*     EndSessionSafety
