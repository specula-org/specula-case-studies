SPECIFICATION TraceSpec

CONSTANTS
    Session = {"s1", "s2"}
    Thread = {"t1", "t2", "t3"}
    NilThread = "NilThread"
    NilSession = "NilSession"

\* Trace completion — TLC must consume entire trace
PROPERTIES
    TraceMatched

\* Safety invariants that should hold on every real execution
INVARIANTS
    SessionCheckoutExclusive
    CheckedOutExists
    KillsRequestedNonNeg
    ThreadSessionConsistency
    TxnStateValid
    PreparedTxnSafety
    NoTornTransaction
