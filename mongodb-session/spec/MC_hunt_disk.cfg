\* Hunting config: Family 1 subset — Non-atomic disk deletion (MC-4)
\* Targets: DiskConsistency
\* Strategy: ReaperFailBetweenDeletes to create torn disk state.

SPECIFICATION MCSpec

CONSTANTS
    Session = {s1, s2}
    Thread = {t1, t2, t3}
    NilThread = NilThread
    NilSession = NilSession

    \* Tight bounds: reaper with failure between deletes
    MaxBeginTxn = 1
    MaxPrepareTxn = 1
    MaxStepDown = 0
    MaxKillSession = 0
    MaxReaperRun = 2
    MaxEagerReap = 0
    MaxEndSession = 0

    \* Fault injection: failure between disk deletion steps
    MaxReaperBypass = 0
    MaxReaperFail = 2
    MaxEagerReapFail = 0
    MaxKillTimeout = 0

SYMMETRY ModelSymmetry

CONSTRAINT StateConstraint

VIEW MCView

INVARIANTS
    SessionCheckoutExclusive
    DiskConsistency
