\* Trace.cfg — replay implementation traces against base spec.
SPECIFICATION TraceSpec

CONSTANTS
    Thread = {"t1", "t2", "t3"}
    Addr = {"a1", "a2", "a3", "a4"}
    InitAddr = "a1"
    NumFastSlots = 8
    MaxHelpGen = 8
    MaxGuardsPerThread = 2
    NullPtr = "NULL"
    NoneGid = "NONE"
    NoneSite = "NONE_SITE"

\* TraceMatched: temporal property — entire trace must be consumed.
PROPERTIES
    TraceMatched

\* Safety invariants — checked on every reachable trace state.
\* Bug-family invariants are excluded per skill guide: traces run without fault
\* injection, so e.g. PayAllCompleteness and NoUseAfterFree should hold trivially
\* on real executions; they're hunted with MC_hunt_*.cfg, not Trace.cfg.
INVARIANTS
    TypeOK
    RefCountNonNeg
    DeadRefCountZero
    StorageLive
    AllOccupantsAllocated
    NoConcurrentNodeClaim
    \* CooldownReleaseObservesZero is too strong as a state invariant — see
    \* note in MC.cfg.  Disabled here for symmetry; the cooldown protocol's
    \* safety is enforced by CheckCooldown's action guard.
    \* CooldownReleaseObservesZero
