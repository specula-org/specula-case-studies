\* MC.cfg — convergence config for arc-swap base spec.
\* Tight bounds; no fault-injection invariant (those are in MC_hunt_*.cfg).

SPECIFICATION MCSpec

CONSTANTS
    Thread = {t1, t2}
    Addr = {a1, a2, a3}
    InitAddr = a1
    NumFastSlots = 1
    MaxHelpGen = 4
    MaxGuardsPerThread = 1
    NullPtr = "NULL"
    NoneGid = "NONE"
    NoneSite = "NONE_SITE"

    \* MC counters — convergence: keep all fault-injections at 0 except the
    \* normal-operation bounds.  Hunting configs override these.
    MaxOrderingGaps = 0
    MaxSendGuards   = 0
    MaxArcSwapDrops = 0
    MaxCASRawStale  = 0
    MaxSwaps        = 1
    MaxCASOps       = 0

SYMMETRY MCSymmetry
VIEW     MCView

\* ----------------------------------------------------------------------------------
\* Invariants — categories
\* ----------------------------------------------------------------------------------

INVARIANTS
    \* Type / structural
    MCTypeOK
    MCRefCountNonNeg
    MCDeadRefCountZero
    MCStorageLive
    MCReaderWriterExclusive
    MCAllOccupantsAllocated
    MCNoConcurrentNodeClaim
    \* MCCooldownReleaseObservesZero — too strong as a state invariant.  After
    \* CheckCooldown transitions a node COOLDOWN→UNUSED, a writer holding a
    \* stale wToVisit snapshot may then call WriterReserveNode on the same
    \* (now UNUSED) node, lifting activeWriters above 0.  Node::get's
    \* compare_exchange(UNUSED, USED) does not consult active_writers, so this
    \* is reachable in the implementation.  The cooldown protocol's safety is
    \* enforced by CheckCooldown's action guard (activeWriters[n] = 0 at the
    \* COOLDOWN→UNUSED transition), not as a state-level invariant.
    \* MCCooldownReleaseObservesZero

    \* Bug-family invariants — re-enabled in MC_hunt_*.cfg.  Convergence run
    \* uses SC labels (MaxOrderingGaps=0) so these should already hold; commented
    \* out only to reduce per-state validation cost.
    \* MCNoUseAfterFree
    \* MCPayAllCompleteness
    \* MCNoTornGuardState
    \* MCCASIntendedSemantics
    \* MCNoDoublePay
    \* MCGenWrapTriggersCooldown
    \* MCNoStaleWithoutRelax
