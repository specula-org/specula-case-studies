\* MC_hunt_familyD.cfg — hunt Family D (generation wraparound + cooldown + node reuse)
\* Mechanism: tight MaxHelpGen forces wrap; ClaimNode + CheckCooldown drive node
\*            transitions; observe whether NoStaleHelpAcrossWrap holds.
\* Targets: helping.rs:54-75 ABA-protection design block.
\* Finding hit: MC9 (generation wraps without cooldown).

SPECIFICATION MCSpec

CONSTANTS
    Thread = {t1, t2}
    Addr = {a1, a2}
    InitAddr = a1
    NumFastSlots = 1
    MaxHelpGen = 4              \* gen += 4 wraps to 0 on first fallback — exercises wrap
    MaxGuardsPerThread = 1
    NullPtr = "NULL"
    NoneGid = "NONE"
    NoneSite = "NONE_SITE"

    MaxOrderingGaps = 0
    MaxSendGuards   = 0
    MaxArcSwapDrops = 0
    MaxCASRawStale  = 0
    MaxSwaps        = 2
    MaxCASOps       = 0

SYMMETRY MCSymmetry
VIEW     MCView

INVARIANTS
    MCTypeOK
    MCNoUseAfterFree
    MCNoConcurrentNodeClaim
    MCRefCountNonNeg
    MCGenWrapTriggersCooldown
    \* MCCooldownReleaseObservesZero — disabled (state form too strong; safety
    \* enforced by CheckCooldown's action guard, see MC.cfg note)
