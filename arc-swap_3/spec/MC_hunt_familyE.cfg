\* MC_hunt_familyE.cfg — hunt Family E (writer-scan completeness)
\* Mechanism: per-slot WriterScanSlot already split in base; combined with one
\*            ordering relaxation forces the writer to miss a freshly-published
\*            debt slot (the "stale snapshot" pattern from brief §2 Family E).
\* Targets: PayAllCompleteness — derived from Family A (#76 family).
\*
\* This is the BUG-A-style finding the brief calls out as the same shape as
\* the left-right round's bugs — writer's snapshot of "active readers" was
\* taken before a new reader appeared, so the new reader can hold a freed pointer.
\*
\* Finding hit: MC10 (pay_all collapsed to single action — not modeled, our spec
\*                    keeps it split per-slot), MC11 (reader prepends new node mid-scan).

SPECIFICATION MCSpec

CONSTANTS
    Thread = {t1, t2}
    Addr = {a1, a2, a3}
    InitAddr = a1
    NumFastSlots = 1
    MaxHelpGen = 4
    MaxGuardsPerThread = 1
    NullPtr = "NULL"
    NoneGid = "NONE"
    NoneSite = "NONE_SITE"

    MaxOrderingGaps = 1         \* one ordering downgrade — typically ListHeadLoad
    MaxSendGuards   = 0
    MaxArcSwapDrops = 0
    MaxCASRawStale  = 0
    MaxSwaps        = 1
    MaxCASOps       = 0

SYMMETRY MCSymmetry
VIEW     MCView

INVARIANTS
    MCTypeOK
    MCPayAllCompleteness
    MCNoUseAfterFree
    MCRefCountNonNeg
