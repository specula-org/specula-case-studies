\* MC_hunt_leaseread.cfg
\* Target: Family 1 — LeaseRead serves stale data during partition (MC-2, MC-8)
\* Strategy: LeaseRead mode, CheckQuorum enabled, crash + message loss to simulate partition

SPECIFICATION MCSpec

CONSTANTS
    s1 = s1
    s2 = s2
    s3 = s3

    Server = {s1, s2, s3}

    v1 = v1
    Value = {v1}

    Nil = Nil

    Follower    = Follower
    PreCandidate = PreCandidate
    Candidate   = Candidate
    Leader      = Leader

    RequestVoteRequest      = RequestVoteRequest
    RequestVoteResponse     = RequestVoteResponse
    PreVoteRequest          = PreVoteRequest
    PreVoteResponse         = PreVoteResponse
    AppendEntriesRequest    = AppendEntriesRequest
    AppendEntriesResponse   = AppendEntriesResponse
    HeartbeatRequest        = HeartbeatRequest
    HeartbeatResponse       = HeartbeatResponse

    ReadOnlySafe        = ReadOnlySafe
    ReadOnlyLeaseBased  = ReadOnlyLeaseBased

    MaxReadCtx = 4

    \* Config parameters
    readOnlyOption = ReadOnlyLeaseBased
    checkQuorum = TRUE
    preVote = TRUE

    \* Tight bounds: maximize election/partition scenarios, minimize irrelevant actions
    MaxTermLimit        = 4
    MaxTimeoutLimit     = 5
    RequestLimit        = 2
    HeartbeatLimit      = 6
    CrashLimit          = 0         \* No crashes needed for lease stale read
    LoseLimit           = 4         \* Message loss simulates partition
    ReadRequestLimit    = 3
    CheckQuorumLimit    = 3         \* Key: CheckQuorum + lease interaction
    MaxMsgBufferLimit   = 10


SYMMETRY Symmetry

CHECK_DEADLOCK
    FALSE

CONSTRAINT
    MsgBufferConstraint

\* Core safety + target invariant only
INVARIANTS
    ElectionSafety
    VoteSafety
    LeaseImpliesLeadership
    ReadIndexLinearizability
