\* MC_hunt_lease_focused.cfg
\* Target: LeaseRead stale read after partition (MC-2)
\* Strategy: force exactly the scenario:
\*   1. s1 becomes leader term 1, commits noop
\*   2. Partition: lose messages to/from s1
\*   3. s2 or s3 becomes leader term 2, commits
\*   4. s1 (stale leader) serves lease read → stale!

SPECIFICATION MCSpec

CONSTANTS
    s1 = s1
    s2 = s2
    s3 = s3

    Server = {s1, s2, s3}

    v1 = v1
    Value = {v1}

    Nil = Nil

    Follower    = Follower
    PreCandidate = PreCandidate
    Candidate   = Candidate
    Leader      = Leader

    RequestVoteRequest      = RequestVoteRequest
    RequestVoteResponse     = RequestVoteResponse
    PreVoteRequest          = PreVoteRequest
    PreVoteResponse         = PreVoteResponse
    AppendEntriesRequest    = AppendEntriesRequest
    AppendEntriesResponse   = AppendEntriesResponse
    HeartbeatRequest        = HeartbeatRequest
    HeartbeatResponse       = HeartbeatResponse

    ReadOnlySafe        = ReadOnlySafe
    ReadOnlyLeaseBased  = ReadOnlyLeaseBased

    MaxReadCtx = 3

    \* LeaseRead mode, CheckQuorum enabled, PreVote disabled (simpler)
    readOnlyOption = ReadOnlyLeaseBased
    checkQuorum = TRUE
    preVote = FALSE

    \* Very tight bounds to force the exact scenario
    MaxTermLimit        = 3
    MaxTimeoutLimit     = 2     \* Two elections: s1 at term 1, s2/s3 at term 2
    RequestLimit        = 1     \* One client request by second leader
    HeartbeatLimit      = 4     \* Heartbeats for commit propagation
    CrashLimit          = 0     \* No crashes needed
    LoseLimit           = 6     \* Enough message loss to simulate partition
    ReadRequestLimit    = 2     \* Lease reads by stale leader
    CheckQuorumLimit    = 1     \* One CheckQuorum (should step down, but AFTER read)
    MaxMsgBufferLimit   = 10

SYMMETRY Symmetry

CHECK_DEADLOCK
    FALSE

CONSTRAINT
    MsgBufferConstraint

\* Target invariant: should be VIOLATED for LeaseRead stale read
INVARIANTS
    ElectionSafety
    ReadIndexLinearizability
