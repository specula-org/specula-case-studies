\* MC_hunt_readindex.cfg
\* Target: Family 1 — ReadIndex linearizability (MC-1)
\* Strategy: ReadOnlySafe mode, multiple reads + elections + message loss
\* to test queue batching correctness.

SPECIFICATION MCSpec

CONSTANTS
    s1 = s1
    s2 = s2
    s3 = s3

    Server = {s1, s2, s3}

    v1 = v1
    Value = {v1}

    Nil = Nil

    Follower    = Follower
    PreCandidate = PreCandidate
    Candidate   = Candidate
    Leader      = Leader

    RequestVoteRequest      = RequestVoteRequest
    RequestVoteResponse     = RequestVoteResponse
    PreVoteRequest          = PreVoteRequest
    PreVoteResponse         = PreVoteResponse
    AppendEntriesRequest    = AppendEntriesRequest
    AppendEntriesResponse   = AppendEntriesResponse
    HeartbeatRequest        = HeartbeatRequest
    HeartbeatResponse       = HeartbeatResponse

    ReadOnlySafe        = ReadOnlySafe
    ReadOnlyLeaseBased  = ReadOnlyLeaseBased

    MaxReadCtx = 5

    \* Config parameters
    readOnlyOption = ReadOnlySafe
    checkQuorum = TRUE
    preVote = TRUE

    \* Maximize reads + heartbeats (ReadIndex mechanism)
    MaxTermLimit        = 3
    MaxTimeoutLimit     = 3
    RequestLimit        = 2
    HeartbeatLimit      = 6
    CrashLimit          = 0
    LoseLimit           = 2
    ReadRequestLimit    = 4         \* Key: multiple concurrent reads
    CheckQuorumLimit    = 0
    MaxMsgBufferLimit   = 12


SYMMETRY Symmetry

CHECK_DEADLOCK
    FALSE

CONSTRAINT
    MsgBufferConstraint

\* Core safety + ReadIndex invariant
INVARIANTS
    ElectionSafety
    VoteSafety
    ReadIndexLinearizability
