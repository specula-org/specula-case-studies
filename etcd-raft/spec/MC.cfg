SPECIFICATION MCSpec

CONSTANTS
    s1 = s1
    s2 = s2
    s3 = s3

    Server = {s1, s2, s3}

    v1 = v1
    Value = {v1}

    Nil = Nil

    \* State constants
    Follower    = Follower
    PreCandidate = PreCandidate
    Candidate   = Candidate
    Leader      = Leader

    \* Message type constants
    RequestVoteRequest      = RequestVoteRequest
    RequestVoteResponse     = RequestVoteResponse
    PreVoteRequest          = PreVoteRequest
    PreVoteResponse         = PreVoteResponse
    AppendEntriesRequest    = AppendEntriesRequest
    AppendEntriesResponse   = AppendEntriesResponse
    HeartbeatRequest        = HeartbeatRequest
    HeartbeatResponse       = HeartbeatResponse

    \* ReadOnly options
    ReadOnlySafe        = ReadOnlySafe
    ReadOnlyLeaseBased  = ReadOnlyLeaseBased

    MaxReadCtx = 2

    \* Config parameters (fixed for convergence)
    readOnlyOption = ReadOnlySafe
    checkQuorum = TRUE
    preVote = TRUE

    \* ── Counter bounds (convergence config — tight) ──
    MaxTermLimit        = 3
    MaxTimeoutLimit     = 3
    RequestLimit        = 1
    HeartbeatLimit      = 3
    CrashLimit          = 1
    LoseLimit           = 1
    ReadRequestLimit    = 1
    CheckQuorumLimit    = 1
    MaxMsgBufferLimit   = 8

SYMMETRY Symmetry

CHECK_DEADLOCK
    FALSE

\* ============================================================================
\* State Space Pruning
\* ============================================================================
CONSTRAINT
    MsgBufferConstraint

\* ============================================================================
\* Core Safety Invariants (always checked)
\* ============================================================================
INVARIANTS
    ElectionSafety
    LeaderCompleteness
    VoteSafety
    StateMachineConsistency

\* ============================================================================
\* Structural Invariants
\* ============================================================================
INVARIANTS
    MCTermsPositive
    MCCommitIndexBound
    MCMessageEndpointsValid
    MCLeaderLogCommitConsistency

\* ============================================================================
\* Extension Invariants (commented out for convergence, enable for hunting)
\* ============================================================================
INVARIANTS
    ReadIndexLinearizability
    PersistBeforeSend
