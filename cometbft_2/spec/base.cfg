SPECIFICATION Spec

CONSTANTS
    Server = {s1, s2, s3, s4}
    Faulty = {s4}
    LightClient = {c1}
    MaxHeight = 2
    MaxRound = 2
    Nil = Nil
    NilVote = NilVote
    Values = {v1, v2}

    ProposalMsg = "ProposalMsg"
    PrevoteMsg = "PrevoteMsg"
    PrecommitMsg = "PrecommitMsg"
    HeaderMsg = "HeaderMsg"

    StepNewHeight = "StepNewHeight"
    StepNewRound = "StepNewRound"
    StepPropose = "StepPropose"
    StepPrevote = "StepPrevote"
    StepPrevoteWait = "StepPrevoteWait"
    StepPrecommit = "StepPrecommit"
    StepPrecommitWait = "StepPrecommitWait"
    StepCommit = "StepCommit"

    ValidVE = "ValidVE"
    InvalidVE = "InvalidVE"
    NoVE = "NoVE"

    DuplicateVoteEv = "DuplicateVoteEv"
    LightClientAttackEv = "LightClientAttackEv"
    InvalidEv = "InvalidEv"

\* Base spec doesn't run in TLC directly (no counter bounds → unbounded).
\* MC.tla wraps with bounds. This cfg exists for syntax/type validation only.
INVARIANTS
    ElectionSafety
    Validity
    RoundBound
    HeightBound
    LockedRoundBound
    ValidRoundBound
    LockConsistency
    ValidConsistency
    PrivvalConsistency
