\* Hunt config for Family 4: Light-client lunatic header fork.
\* Targets: MC-7 from brief §6.1.
\* Invariants: LightClientFollowsCanonicalChain + LunaticEvidenceVerifies.
\* The bug surface: ByzLunaticForkHeader + LightClientVerify.
\* The lunatic-attack only fires when ≥ 1/3 of validators are Byzantine
\* (TrustLevelOneThird), so this config uses Faulty = 2 of 4 to satisfy the
\* trust-threshold gate while still respecting f < n/3 for consensus safety
\* layer (actually, 2 of 4 violates BFT bound; this is the documented
\* security boundary per brief §2 Family 4).

SPECIFICATION MCSpec

CONSTANTS
    Server = {s1, s2, s3, s4}
    Faulty = {s3, s4}
    LightClient = {c1}
    MaxHeight = 2
    MaxRound = 1
    Nil = Nil
    NilVote = NilVote
    Values = {v1, v2}

    ProposalMsg = "ProposalMsg"
    PrevoteMsg = "PrevoteMsg"
    PrecommitMsg = "PrecommitMsg"
    HeaderMsg = "HeaderMsg"

    StepNewHeight = "StepNewHeight"
    StepNewRound = "StepNewRound"
    StepPropose = "StepPropose"
    StepPrevote = "StepPrevote"
    StepPrevoteWait = "StepPrevoteWait"
    StepPrecommit = "StepPrecommit"
    StepPrecommitWait = "StepPrecommitWait"
    StepCommit = "StepCommit"

    ValidVE = "ValidVE"
    InvalidVE = "InvalidVE"
    NoVE = "NoVE"

    DuplicateVoteEv = "DuplicateVoteEv"
    LightClientAttackEv = "LightClientAttackEv"
    InvalidEv = "InvalidEv"

    \* NOTE: with f=2 of n=4, f >= n/3; this exceeds the BFT bound on the
    \* consensus layer, but Family 4 explicitly examines the light-client
    \* threshold (≥ 1/3) per ADR-047. The consensus-layer Agreement invariant
    \* is NOT expected to hold here — only the light-client invariant.
    \* We disable ElectionSafety from the invariant list for this hunt.

    MaxTimeoutLimit         = 0
    MaxCrashLimit           = 0
    MaxLoseLimit            = 1
    MaxMsgBufferLimit       = 12

    MaxByzEquivocateLimit   = 0
    MaxByzSelectiveLimit    = 0

    MaxByzAmnesiaLimit      = 0
    MaxWALTruncateLimit     = 0

    MaxByzVEAttachLimit     = 0
    MaxByzVELateLimit       = 0
    MaxByzVEReplayLimit     = 0

    MaxByzLunaticLimit      = 1

    MaxByzInjectEvLimit     = 0
    MaxByzFloodEvLimit      = 0
    MaxEvidenceRaceLimit    = 0
    MaxCrashBufLimit        = 0
    MaxProposerExcludeLimit = 0
    MaxAdvanceClockLimit    = 0

    MaxByzProposeAltLimit   = 0
    MaxByzPolkaUnkLimit     = 0
    MaxByzPOLRoundLimit     = 0

SYMMETRY Symmetry
VIEW ModelView
CONSTRAINT MsgBufferConstraint

INVARIANTS
    LightClientFollowsCanonicalChain
    LunaticEvidenceVerifies
    ConflictsOnlyFromByzantine
