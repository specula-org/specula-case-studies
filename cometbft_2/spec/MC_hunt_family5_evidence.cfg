\* Hunt config for Family 5: Evidence-lifecycle adversarial races.
\* Targets: MC-2 (composes), MC-8, MC-9, MC-12 from brief §6.1.
\* Invariants: HonestPeerNotPunished + EvidenceConsistency + EvidencePoolBounded.
\* The bug surface: EvidenceExpiryRace (broadcast filter vs verify filter
\* asymmetry), CrashDuringConsensusBuffer (consensusBuffer reset every Update),
\* ByzFloodEvidence (no MaxNum cap), ByzInjectInvalidEvidence,
\* ProposerExcludeEvidence.

SPECIFICATION MCSpec

CONSTANTS
    Server = {s1, s2, s3, s4}
    Faulty = {s4}
    LightClient = {c1}
    MaxHeight = 2
    MaxRound = 1
    Nil = Nil
    NilVote = NilVote
    Values = {v1, v2}

    ProposalMsg = "ProposalMsg"
    PrevoteMsg = "PrevoteMsg"
    PrecommitMsg = "PrecommitMsg"
    HeaderMsg = "HeaderMsg"

    StepNewHeight = "StepNewHeight"
    StepNewRound = "StepNewRound"
    StepPropose = "StepPropose"
    StepPrevote = "StepPrevote"
    StepPrevoteWait = "StepPrevoteWait"
    StepPrecommit = "StepPrecommit"
    StepPrecommitWait = "StepPrecommitWait"
    StepCommit = "StepCommit"

    ValidVE = "ValidVE"
    InvalidVE = "InvalidVE"
    NoVE = "NoVE"

    DuplicateVoteEv = "DuplicateVoteEv"
    LightClientAttackEv = "LightClientAttackEv"
    InvalidEv = "InvalidEv"

    MaxTimeoutLimit         = 0
    MaxCrashLimit           = 1
    MaxLoseLimit            = 1
    MaxMsgBufferLimit       = 16

    \* Need at least one equivocation source so pendingEvidence becomes non-empty.
    MaxByzEquivocateLimit   = 1
    MaxByzSelectiveLimit    = 0

    MaxByzAmnesiaLimit      = 0
    MaxWALTruncateLimit     = 0

    MaxByzVEAttachLimit     = 0
    MaxByzVELateLimit       = 0
    MaxByzVEReplayLimit     = 0

    MaxByzLunaticLimit      = 0

    MaxByzInjectEvLimit     = 1
    MaxByzFloodEvLimit      = 1
    MaxEvidenceRaceLimit    = 1
    MaxCrashBufLimit        = 1
    MaxProposerExcludeLimit = 1
    MaxAdvanceClockLimit    = 2

    MaxByzProposeAltLimit   = 0
    MaxByzPolkaUnkLimit     = 0
    MaxByzPOLRoundLimit     = 0

SYMMETRY Symmetry
VIEW ModelView
CONSTRAINT MsgBufferConstraint

INVARIANTS
    ElectionSafety
    Validity
    EventualAccountabilityStrong
    HonestPeerNotPunished
    EvidenceConsistency
    EvidencePoolBounded
    ConflictsOnlyFromByzantine

\* PROPERTIES disabled: EventualAccountability requires fairness in
\* MCSpec; without it TLC reports trivial stuttering counterexamples and
\* terminates early. Safety surface captured by EventualAccountabilityStrong.
\* PROPERTIES
\*     EventualAccountability
