\* Hunt config for Family 2: Amnesia (Byzantine + crash + WAL truncate).
\* Targets: MC-3, MC-4, MC-9 from brief §6.1.
\* Invariants: LockSafety + PrivvalAmnesiaDetection.
\* The bug surface: ByzAmnesia (with prior precommit at r1, signs at r2 for
\* different block); WALTailTruncate composes with Crash to lose locking state.

