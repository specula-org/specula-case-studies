\* Hunt config for Family 3: Vote-extension reuse / late-commit / replay.
\* Targets: MC-5, MC-6 from brief §6.1.
\* Invariants: VEContextBound + LastCommitVECoverage.
\* The bug surface: ByzAttachSameVEToBoth + ByzLateAddPrecommitWithBadVE +
\* ByzReplaySelfVE. Compose with one equivocation to bring in the conflicting
\* precommit pair that exercises MC-5.

SPECIFICATION MCSpec

CONSTANTS
    Server = {s1, s2, s3, s4}
    Faulty = {s4}
    LightClient = {c1}
    MaxHeight = 2
    MaxRound = 1
    Nil = Nil
    NilVote = NilVote
    Values = {v1, v2}

    ProposalMsg = "ProposalMsg"
    PrevoteMsg = "PrevoteMsg"
    PrecommitMsg = "PrecommitMsg"
    HeaderMsg = "HeaderMsg"

    StepNewHeight = "StepNewHeight"
    StepNewRound = "StepNewRound"
    StepPropose = "StepPropose"
    StepPrevote = "StepPrevote"
    StepPrevoteWait = "StepPrevoteWait"
    StepPrecommit = "StepPrecommit"
    StepPrecommitWait = "StepPrecommitWait"
    StepCommit = "StepCommit"

    ValidVE = "ValidVE"
    InvalidVE = "InvalidVE"
    NoVE = "NoVE"

    DuplicateVoteEv = "DuplicateVoteEv"
    LightClientAttackEv = "LightClientAttackEv"
    InvalidEv = "InvalidEv"

    MaxTimeoutLimit         = 0
    MaxCrashLimit           = 0
    MaxLoseLimit            = 1
    MaxMsgBufferLimit       = 16

    MaxByzEquivocateLimit   = 1
    MaxByzSelectiveLimit    = 0

    MaxByzAmnesiaLimit      = 0
    MaxWALTruncateLimit     = 0

    MaxByzVEAttachLimit     = 1
    MaxByzVELateLimit       = 1
    MaxByzVEReplayLimit     = 1

    MaxByzLunaticLimit      = 0

    MaxByzInjectEvLimit     = 0
    MaxByzFloodEvLimit      = 0
    MaxEvidenceRaceLimit    = 0
    MaxCrashBufLimit        = 0
    MaxProposerExcludeLimit = 0
    MaxAdvanceClockLimit    = 0

    MaxByzProposeAltLimit   = 0
    MaxByzPolkaUnkLimit     = 0
    MaxByzPOLRoundLimit     = 0

SYMMETRY Symmetry
VIEW ModelView
CONSTRAINT MsgBufferConstraint

INVARIANTS
    ElectionSafety
    Validity
    VEContextBound
    LastCommitVECoverage
    ConflictsOnlyFromByzantine

\* PROPERTIES disabled: VELiveness requires fairness in MCSpec; without
\* it TLC reports trivial stuttering counterexamples and terminates early
\* before completing BFS. The safety projections on this family are
\* VEContextBound and LastCommitVECoverage.
\* PROPERTIES
\*     VELiveness
