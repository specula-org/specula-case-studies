\* Hunt config for Family 6: Locking-vs-relock transitions under Byzantine
\* proposer interleaving.
\* Targets: MC-10, MC-11 from brief §6.1.
\* Invariants: LockSafety + Round1ProposalValidation.
\* The bug surface: ByzProposeAlternating (alternates between blocks at
\* adjacent rounds), ByzPolkaForUnknownBlock (Byzantine subset of prevotes
\* for unknown block triggers unlock-and-nil), ByzPOLRoundGtRound (proposer
\* with POLRound >= Round passes ValidateBasic).

SPECIFICATION MCSpec

CONSTANTS
    Server = {s1, s2, s3, s4}
    Faulty = {s4}
    LightClient = {c1}
    MaxHeight = 1
    MaxRound = 2
    Nil = Nil
    NilVote = NilVote
    Values = {v1, v2}

    ProposalMsg = "ProposalMsg"
    PrevoteMsg = "PrevoteMsg"
    PrecommitMsg = "PrecommitMsg"
    HeaderMsg = "HeaderMsg"

    StepNewHeight = "StepNewHeight"
    StepNewRound = "StepNewRound"
    StepPropose = "StepPropose"
    StepPrevote = "StepPrevote"
    StepPrevoteWait = "StepPrevoteWait"
    StepPrecommit = "StepPrecommit"
    StepPrecommitWait = "StepPrecommitWait"
    StepCommit = "StepCommit"

    ValidVE = "ValidVE"
    InvalidVE = "InvalidVE"
    NoVE = "NoVE"

    DuplicateVoteEv = "DuplicateVoteEv"
    LightClientAttackEv = "LightClientAttackEv"
    InvalidEv = "InvalidEv"

    MaxTimeoutLimit         = 1
    MaxCrashLimit           = 0
    MaxLoseLimit            = 1
    MaxMsgBufferLimit       = 16

    MaxByzEquivocateLimit   = 0
    MaxByzSelectiveLimit    = 0

    MaxByzAmnesiaLimit      = 0
    MaxWALTruncateLimit     = 0

    MaxByzVEAttachLimit     = 0
    MaxByzVELateLimit       = 0
    MaxByzVEReplayLimit     = 0

    MaxByzLunaticLimit      = 0

    MaxByzInjectEvLimit     = 0
    MaxByzFloodEvLimit      = 0
    MaxEvidenceRaceLimit    = 0
    MaxCrashBufLimit        = 0
    MaxProposerExcludeLimit = 0
    MaxAdvanceClockLimit    = 0

    MaxByzProposeAltLimit   = 2
    MaxByzPolkaUnkLimit     = 1
    MaxByzPOLRoundLimit     = 1

SYMMETRY Symmetry
VIEW ModelView
CONSTRAINT MsgBufferConstraint

INVARIANTS
    ElectionSafety
    Validity
    LockSafety
    Round1ProposalValidation
    ConflictsOnlyFromByzantine
