\* Hunt config for combined scenarios:
\*   MC-4: ByzEquivocate + ByzAmnesia composition (Families 1, 2).
\*   MC-13: ByzEquivocate + ByzSelectiveDisseminate + WALTailTruncate on
\*          detector (Families 1, 2, 5) — worst-case detection-evasion.
\*
\* Tests layered safety violations: a Byzantine equivocates AND claims
\* amnesia, while selective dissemination and WAL truncation make the
\* detection path unreachable.

SPECIFICATION MCSpec

CONSTANTS
    Server = {s1, s2, s3, s4}
    Faulty = {s4}
    LightClient = {c1}
    MaxHeight = 1
    MaxRound = 2
    Nil = Nil
    NilVote = NilVote
    Values = {v1, v2}

    ProposalMsg = "ProposalMsg"
    PrevoteMsg = "PrevoteMsg"
    PrecommitMsg = "PrecommitMsg"
    HeaderMsg = "HeaderMsg"

    StepNewHeight = "StepNewHeight"
    StepNewRound = "StepNewRound"
    StepPropose = "StepPropose"
    StepPrevote = "StepPrevote"
    StepPrevoteWait = "StepPrevoteWait"
    StepPrecommit = "StepPrecommit"
    StepPrecommitWait = "StepPrecommitWait"
    StepCommit = "StepCommit"

    ValidVE = "ValidVE"
    InvalidVE = "InvalidVE"
    NoVE = "NoVE"

    DuplicateVoteEv = "DuplicateVoteEv"
    LightClientAttackEv = "LightClientAttackEv"
    InvalidEv = "InvalidEv"

    MaxTimeoutLimit         = 0
    MaxCrashLimit           = 1
    MaxLoseLimit            = 1
    MaxMsgBufferLimit       = 16

    \* Families 1 + 2 + 5 composition
    MaxByzEquivocateLimit   = 1
    MaxByzSelectiveLimit    = 1
    MaxByzAmnesiaLimit      = 1
    MaxWALTruncateLimit     = 1
    MaxByzVEAttachLimit     = 0
    MaxByzVELateLimit       = 0
    MaxByzVEReplayLimit     = 0
    MaxByzLunaticLimit      = 0
    MaxByzInjectEvLimit     = 0
    MaxByzFloodEvLimit      = 0
    MaxEvidenceRaceLimit    = 0
    MaxCrashBufLimit        = 1
    MaxProposerExcludeLimit = 0
    MaxAdvanceClockLimit    = 0
    MaxByzProposeAltLimit   = 0
    MaxByzPolkaUnkLimit     = 0
    MaxByzPOLRoundLimit     = 0

SYMMETRY Symmetry
VIEW ModelView
CONSTRAINT MsgBufferConstraint

INVARIANTS
    ElectionSafety
    Validity
    LockSafety
    PrivvalAmnesiaDetection
    EventualAccountabilityStrong
    ConflictsOnlyFromByzantine
