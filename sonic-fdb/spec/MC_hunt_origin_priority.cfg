\* Hunting config: Family 4 — FDB Origin Priority & MAC Move Conflicts
\* Target: NoOrphanFdbEntry (approximated by CounterConsistency)
\* Mechanism: origin-mismatch DEL silently discarded, entry persists forever

CONSTANTS
    Port = {p1, p2}
    VLAN = {v1}
    MAC = {m1}
    RemoteVTEP = {vtep1}
    NullOID = NullOID
    ORIGIN_LEARN = ORIGIN_LEARN
    ORIGIN_PROVISIONED = ORIGIN_PROVISIONED
    ORIGIN_VXLAN_ADVERTIZED = ORIGIN_VXLAN_ADVERTIZED
    ORIGIN_MCLAG_ADVERTIZED = ORIGIN_MCLAG_ADVERTIZED
    TYPE_DYNAMIC = TYPE_DYNAMIC
    TYPE_STATIC = TYPE_STATIC
    \* Focus on provision + learn + remove with different origins
    MaxVlanMemberOps = 3
    MaxFlushOps = 0
    MaxLearnOps = 2
    MaxProvisionOps = 2
    MaxRemoveOps = 3
    MaxTunnelOps = 1
    MaxTunnelLearnOps = 1
    MaxSetPendingOps = 0

SYMMETRY ModelSymmetry

SPECIFICATION MCSpec

VIEW MCView

INVARIANTS
    CounterConsistency
    BridgePortConsistency
    PortFdbCountNonNeg
    VlanFdbCountNonNeg
