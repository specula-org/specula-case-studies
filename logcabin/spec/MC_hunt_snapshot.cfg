\* Hunting config for Bug Family 2: Snapshot-Log Interaction
\* Target: snapshot operations break log continuity or election safety
\* MC-2: Snapshot load + stale term info in election
\* MC-3: Multi-chunk InstallSnapshot interrupted by term change

SPECIFICATION MCSpec

CONSTANTS
    Server = {s1, s2, s3}
    Follower = Follower
    Candidate = Candidate
    Leader = Leader
    Nil = Nil
    ValueEntry = ValueEntry
    ConfigEntry = ConfigEntry
    NoopEntry = NoopEntry
    ConfigBlank = ConfigBlank
    ConfigStable = ConfigStable
    ConfigStaging = ConfigStaging
    ConfigTransitional = ConfigTransitional
    RequestVoteRequest = RequestVoteRequest
    RequestVoteResponse = RequestVoteResponse
    AppendEntriesRequest = AppendEntriesRequest
    AppendEntriesResponse = AppendEntriesResponse
    InstallSnapshotRequest = InstallSnapshotRequest
    InstallSnapshotResponse = InstallSnapshotResponse

    \* Tight bounds: maximize snapshots and crashes
    MaxTimeoutLimit = 3
    RequestLimit = 3
    CrashLimit = 2
    LoseLimit = 1
    HeartbeatLimit = 4
    ConfigChangeLimit = 0
    SnapshotLimit = 3
    StepDownCheckLimit = 0
    MaxMsgBufferLimit = 8

CONSTRAINT MsgBufferConstraint
SYMMETRY ModelSymmetry
VIEW MCView
CHECK_DEADLOCK FALSE

\* Core safety
INVARIANT ElectionSafety
INVARIANT LogMatching
INVARIANT LeaderCompleteness

\* Target invariants
INVARIANT SnapshotLogContinuity
INVARIANT MCSnapshotBeforeLog
INVARIANT PersistenceConsistency
