\* Hunting config for Bug Family 4: Leader Liveness and Disk Sensitivity
\* Target: epoch-based step-down with slow disk
\* MC-7: Leader steps down despite reachable quorum (disk delay)

SPECIFICATION MCSpec

CONSTANTS
    Server = {s1, s2, s3}
    Follower = Follower
    Candidate = Candidate
    Leader = Leader
    Nil = Nil
    ValueEntry = ValueEntry
    ConfigEntry = ConfigEntry
    NoopEntry = NoopEntry
    ConfigBlank = ConfigBlank
    ConfigStable = ConfigStable
    ConfigStaging = ConfigStaging
    ConfigTransitional = ConfigTransitional
    RequestVoteRequest = RequestVoteRequest
    RequestVoteResponse = RequestVoteResponse
    AppendEntriesRequest = AppendEntriesRequest
    AppendEntriesResponse = AppendEntriesResponse
    InstallSnapshotRequest = InstallSnapshotRequest
    InstallSnapshotResponse = InstallSnapshotResponse

    \* Tight bounds: maximize step-down checks and message loss
    MaxTimeoutLimit = 3
    RequestLimit = 2
    CrashLimit = 0
    LoseLimit = 4
    HeartbeatLimit = 6
    ConfigChangeLimit = 0
    SnapshotLimit = 0
    StepDownCheckLimit = 4
    MaxMsgBufferLimit = 8

CONSTRAINT MsgBufferConstraint
SYMMETRY ModelSymmetry
VIEW MCView
CHECK_DEADLOCK FALSE

\* Core safety
INVARIANT ElectionSafety

\* Target invariant
INVARIANT StepDownCorrectness
