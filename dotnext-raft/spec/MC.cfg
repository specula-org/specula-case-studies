\* MC.cfg — Standard model checking configuration
\* Used for spec convergence. Extension invariants commented out.

CONSTANTS
    Nil = Nil
    Follower = Follower
    Candidate = Candidate
    Leader = Leader
    RequestVoteRequest = RequestVoteRequest
    RequestVoteResponse = RequestVoteResponse
    AppendEntriesRequest = AppendEntriesRequest
    AppendEntriesResponse = AppendEntriesResponse
    Server = {s1, s2, s3}
    Value = {v1}

    \* Counter bounds
    MaxTimeoutLimit = 5
    MaxCrashLimit = 2
    MaxRequestLimit = 3
    MaxLoseLimit = 3
    MaxHeartbeatLimit = 6
    MaxConfigLimit = 0
    MaxTermLimit = 4
    MaxMsgCount = 10

\* MCSpec already uses MCNext with counter-bounded wrappers.
\* No operator overrides needed (they would cause infinite recursion
\* since MCTimeout calls Timeout internally).

SPECIFICATION MCSpec

SYMMETRY ModelSymmetry
VIEW MCView

CONSTRAINT
    MsgBufferConstraint
    TermConstraint

\* ---- Standard + Structural invariants ----
INVARIANTS
    MCElectionSafety
    MCStateMachineSafety
    MCLogMatching
    MCCommitIndexBound
    MCPersistedCommitBound
    MCMatchIndexBound

\* ---- Extension invariants (commented out for convergence) ----
\* INVARIANT MCConfigCommitConsistency
\* INVARIANT MCNoStaleLeaderWithLease
\* INVARIANT MCCommitMonotonicity
