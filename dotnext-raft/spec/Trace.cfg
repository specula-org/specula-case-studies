\* Trace.cfg — Trace validation configuration
\*
\* Usage: run with JSON env var to select trace file:
\*   java -jar tla2tools.jar -config Trace.cfg \
\*     -deadlock Trace.tla \
\*     -DJSON=../traces/trace.ndjson
\*
\* TLC should report "Deadlock reached" at the final trace position.
\* If deadlock occurs before the end, a trace event could not be matched.

CONSTANTS
    Nil = Nil
    Follower = Follower
    Candidate = Candidate
    Leader = Leader
    RequestVoteRequest = RequestVoteRequest
    RequestVoteResponse = RequestVoteResponse
    AppendEntriesRequest = AppendEntriesRequest
    AppendEntriesResponse = AppendEntriesResponse
    Server = {"s1", "s2", "s3"}
    Value = {"v1", Nil}

INIT TraceInit
NEXT TraceNext

\* Use deadlock-based completion checking:
\* TLC will report "deadlock reached" when the trace is fully consumed
\* and no more actions are enabled. This is the expected outcome.
\*
\* Run with: -deadlock flag to DISABLE deadlock checking
\* (otherwise TLC would report an error on normal completion)
