INIT TraceInit
NEXT TraceNext

CONSTANTS
    Nil = 0

\* Server and ElectionQuorum derived from trace or overridden here
\* Default values for manual testing:
CONSTANTS
    Server = {1, 2, 3}
    ElectionQuorum = 3

\* Deadlock-based trace completion: trace fully matched iff
\* TLC deadlocks at l = Len(TraceLog) + 1.
\* Do NOT use -deadlock flag.

ALIAS TraceAlias

\* Check base invariants during trace replay
INVARIANTS
    ElectionSafety
    WalWriteSafety
    TermMonotonicity
