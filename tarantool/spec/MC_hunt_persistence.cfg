\* Hunting config for Bug Family 3: Non-Atomic Term/Vote Persistence
\* Targets: crash between term and vote writes → double vote in same term.
\* Tight bounds: maximize crashes and vclock advances during WAL writes.

SPECIFICATION MCSpec

CONSTANTS
    Server = {1, 2, 3}
    ElectionQuorum = 2
    Nil = 0
    MaxTerm = 3
    TimeoutLimit = 3
    CrashLimit = 3
    HeartbeatLimit = 2
    LoseLimit = 1
    PromoteLimit = 0
    VclockAdvanceLimit = 4
    ResignLimit = 0
    NotifyLimit = 2
    BroadcastLimit = 4

CONSTRAINT MaxMsgBuffer

INVARIANTS
    MCElectionSafety
    MCOneVotePerTerm
    MCNoStaleVoteAfterCrash
    MCVoteConsistency
    MCLeaderHasVotedForSelf
