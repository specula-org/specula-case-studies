\* MC_hunt_F2.cfg — Unrecognised returns-twice call (Family 1, F2).
SPECIFICATION MCSpec
CHECK_DEADLOCK FALSE

CONSTANTS
    Vals  = {1, 2}
    Points = {0, 1, 2, 3}
    Blocks = {0}
    CallPoints = {2}
    AsmPoints = {}
    ReturnsTwicePoints = {2}
    CalleeSavedRegs = {}
    CallerSavedRegs = {}
    Slots = {100, 101}
    FuncEnd  = 4
    MaxIters = 4
    DataflowCapLimit = 0

CONSTANT BlockOfPoint <- BlockOfPointF2Op
CONSTANT BlockSuccs   <- BlockSuccsF2Op
CONSTANT TrueDef      <- TrueDefF2Op
CONSTANT TrueUses     <- TrueUsesF2Op
CONSTANT AsmHasOperands <- AsmHasOperandsF2Op
CONSTANT AsmClobbers    <- AsmClobbersF2Op
CONSTANT IsRecognizedReturnsTwice <- IsRecognizedReturnsTwiceF2Op
CONSTANT Priority       <- PriorityF2Op

CONSTRAINT StateConstraint

INVARIANTS
    MCReturnsTwiceLiveExtension
    MCNoSlotCollision
