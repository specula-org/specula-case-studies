\* MC.cfg — standard model-check config.
\* Structural + safety invariants only; F-family bug invariants live in
\* the MC_hunt_F*.cfg files.

SPECIFICATION MCSpec
CHECK_DEADLOCK FALSE

CONSTANTS
    Vals  = {1, 2}
    Points = {0, 1, 2}
    Blocks = {0, 1}
    CallPoints = {2}
    AsmPoints = {}
    ReturnsTwicePoints = {}
    CalleeSavedRegs = {10, 11}
    CallerSavedRegs = {20}
    Slots = {100, 101}
    FuncEnd  = 3
    MaxIters = 4
    DataflowCapLimit = 0

CONSTANT BlockOfPoint <- BlockOfPointOp
CONSTANT BlockSuccs   <- BlockSuccsOp
CONSTANT TrueDef      <- TrueDefOp
CONSTANT TrueUses     <- TrueUsesOp
CONSTANT AsmHasOperands <- AsmHasOperandsOp
CONSTANT AsmClobbers    <- AsmClobbersOp
CONSTANT IsRecognizedReturnsTwice <- IsRecognizedReturnsTwiceOp
CONSTANT Priority       <- PriorityOp

CONSTRAINT StateConstraint

\* Structural + safety invariants.
INVARIANTS
    MCPoolDisjointness
    MCValidPhases
    MCAssignmentDomain
    MCSlotDomain
    MCRecordedCallPointsSubset
    MCIterCap
    MCNoRegisterCollision
    MCNoSlotCollision
