\* Base spec config — small concrete instance for sanity-checking.
\* This is NOT the model-checking config (see MC.cfg) — it just provides
\* enough to let TLC parse the spec and check Init.

SPECIFICATION Spec

CONSTANTS
    Vals = {1, 2}
    Points = {0, 1, 2}
    Blocks = {0}
    BlockOfPoint = [p \in {0, 1, 2} |-> 0]
    BlockSuccs   = [b \in {0} |-> {}]
    TrueDef  = (1 :> 0 @@ 2 :> 1)
    TrueUses = (1 :> {2} @@ 2 :> {2})
    CallPoints = {}
    AsmPoints = {}
    AsmHasOperands = << >>
    AsmClobbers   = << >>
    ReturnsTwicePoints = {}
    IsRecognizedReturnsTwice = << >>
    CalleeSavedRegs = {10}
    CallerSavedRegs = {20}
    Slots = {100}
    Priority = (1 :> 1 @@ 2 :> 1)
    FuncEnd = 3
    MaxIters = 4

INVARIANTS
    PoolDisjointness
    ValidPhases
    AssignmentDomain
    SlotDomain
    RecordedCallPointsSubset
    IterCap
