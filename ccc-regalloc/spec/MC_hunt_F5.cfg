\* MC_hunt_F5.cfg — Pool disjointness convention violation (Family 2, F5).
SPECIFICATION MCSpec
CHECK_DEADLOCK FALSE

CONSTANTS
    Vals  = {1, 2}
    Points = {0, 1, 2}
    Blocks = {0}
    CallPoints = {1}
    AsmPoints = {}
    ReturnsTwicePoints = {}
    CalleeSavedRegs = {10}
    CallerSavedRegs = {10}
    Slots = {}
    FuncEnd  = 3
    MaxIters = 3
    DataflowCapLimit = 0

CONSTANT BlockOfPoint <- BlockOfPointF5Op
CONSTANT BlockSuccs   <- BlockSuccsF5Op
CONSTANT TrueDef      <- TrueDefF5Op
CONSTANT TrueUses     <- TrueUsesF5Op
CONSTANT AsmHasOperands <- AsmHasOperandsF5Op
CONSTANT AsmClobbers    <- AsmClobbersF5Op
CONSTANT IsRecognizedReturnsTwice <- IsRecognizedReturnsTwiceF5Op
CONSTANT Priority       <- PriorityF5Op

CONSTRAINT StateConstraint

INVARIANTS
    MCPoolDisjointness
    MCNoRegisterCollision
