\* ============================================================================
\* MC_hunt_F1.cfg — Family 1 (Phantom Free Block).
\* Goal: expose UAF via two-thread raw_delete off-lock window (F1.1) or
\* deferred push (F1.2) interleaved with Coalesce or GC-detach.
\* Tight bounds: disable capture flips and GC except the bug surface.
\* ============================================================================

SPECIFICATION MCSpec

CONSTANTS
    Threads      = {t1, t2}
    Streams      = {s1}
    BlockIds     = {b1, b2, b3}
    PoolIds      = {p0}
    DefaultPool  = p0
    FractionLimit = 100
    MaxPoolOps   = 0
    NullBlock    = NB
    NullStream   = NS

    MaxSplitOps     = 1
    MaxCaptureOps   = 0
    MaxCaptureFlips = 1
    MaxMallocFlips  = 0
    MaxGcOps        = 1
    MaxRecordFails  = 0
    Liveness        = FALSE

SYMMETRY Perms
VIEW     View

CONSTRAINT
    QueueBound

INVARIANTS
    TypeOK
    NoDoubleFree
    NoDanglingInFlight
    NoDanglingDeferred
    NoDanglingLimbo
    NoGhostDangling
