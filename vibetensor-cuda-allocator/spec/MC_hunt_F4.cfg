\* ============================================================================
\* MC_hunt_F4.cfg — Family 4 (Graph-pool lifecycle, guard stale destruction).
\* Goal: reach the sequence [Begin1, EndFlat, Begin2, GuardDestruct1] that
\* clears routing/TLS of the fresh capture.  The invariant
\* RoutingFlagMatchesTLS should be violated mid-sequence.
\* ============================================================================

SPECIFICATION MCSpec

CONSTANTS
    Threads      = {t1, t2}
    Streams      = {s1}
    BlockIds     = {b1}
    PoolIds      = {p0, p1}
    DefaultPool  = p0
    FractionLimit = 100
    MaxPoolOps   = 4
    NullBlock    = NB
    NullStream   = NS

    MaxSplitOps     = 0
    MaxCaptureOps   = 4
    MaxCaptureFlips = 0
    MaxMallocFlips  = 0
    MaxGcOps        = 0
    MaxRecordFails  = 0
    Liveness        = FALSE

SYMMETRY Perms
VIEW     View

CONSTRAINT
    QueueBound

INVARIANTS
    TypeOK
    RoutingFlagMatchesTLS
    PoolRefcntWellFounded
