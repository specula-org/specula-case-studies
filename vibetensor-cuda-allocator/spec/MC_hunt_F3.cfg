\* ============================================================================
\* MC_hunt_F3.cfg — Family 3 (Lost stream-use fence on raw_delete rollback).
\* Goal: two-thread window: T1 RawDeleteMark, T2 RecordStream (early-returns
\* because allocated=false), T1 RecordFail -> rollback -> streamUses is
\* snapshot-only, stream T2 wanted to record is lost.  Detect via event-count
\* audit and a dedicated Family 3 invariant in MC.tla (StreamUsesPersist).
\* ============================================================================

SPECIFICATION MCSpec

CONSTANTS
    Threads      = {t1, t2}
    Streams      = {s1, s2}
    BlockIds     = {b1, b2}
    PoolIds      = {p0}
    DefaultPool  = p0
    FractionLimit = 100
    MaxPoolOps   = 0
    NullBlock    = NB
    NullStream   = NS

    MaxSplitOps     = 0
    MaxCaptureOps   = 0
    MaxCaptureFlips = 0
    MaxMallocFlips  = 0
    MaxGcOps        = 0
    MaxRecordFails  = 1
    Liveness        = FALSE

SYMMETRY Perms
VIEW     View

CONSTRAINT
    QueueBound

INVARIANTS
    TypeOK
    NoDoubleFree
