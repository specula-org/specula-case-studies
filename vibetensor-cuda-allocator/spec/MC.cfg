\* ============================================================================
\* MC.cfg — standard safety + structural invariants for spec convergence.
\* Bug-family invariants are commented out; the MC_hunt_* configs
\* (in this directory) enable them with tight bounds.
\* ============================================================================

SPECIFICATION MCSpec

CONSTANTS
    Threads      = {t1, t2}
    Streams      = {s1, s2}
    BlockIds     = {b1, b2, b3}
    PoolIds      = {p0, p1}
    DefaultPool  = p0
    FractionLimit = 4
    MaxPoolOps   = 3
    NullBlock    = NB
    NullStream   = NS

    MaxSplitOps     = 2
    MaxCaptureOps   = 2
    MaxCaptureFlips = 2
    MaxMallocFlips  = 2
    MaxGcOps        = 2
    MaxRecordFails  = 1
    Liveness        = TRUE

SYMMETRY Perms
VIEW     View

CONSTRAINT
    QueueBound
    NoGhostDangling   \* exclude F1.1 / F1.2 phantom-free paths from convergence;
                      \* they are re-enabled explicitly in MC_hunt_F1.cfg.

\* --- Standard safety ---
\* NoDoubleFree is excluded here: when F1.1 fires (GC detaches a block while a
\* raw_delete is in its off-lock window), the block id may be reallocated and
\* two threads end up with rdBlock=b in Marked. That surface is already caught
\* by NoDanglingInFlight in MC_hunt_F1.cfg, so keeping NoDoubleFree in standard
\* safety produces a duplicate (earlier) counter-example to the same F1.1 bug
\* and blocks convergence of the other structural invariants.
INVARIANTS
    TypeOK
    FreeListConsistency
    SegmentChainWellFormed

\* --- Structural ---
\*    PoolRefcntWellFounded

\* --- Extension (bug-family) invariants — enabled in MC_hunt_* configs ---
\*    NoDanglingInFlight         \* F1.1
\*    NoDanglingDeferred         \* F1.2
\*    NoDanglingLimbo            \* F1, F2
\*    NoGhostDangling            \* F1 audit
\*    EventCountConsistent       \* F2
\*    RoutingFlagMatchesTLS      \* F4
\*    ReservedLimitRespected     \* F5

\* --- Temporal / liveness ---
\*    RawDeleteEventuallyPublishes
\*    PeEventuallyDrains
