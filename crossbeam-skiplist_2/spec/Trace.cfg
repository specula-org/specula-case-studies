\* Trace.cfg — trace validation configuration for crossbeam-skiplist
\*
\* Run with: java -jar tla2tools.jar -config Trace.cfg Trace.tla -deadlock
\* Override trace file with: -DJSON=../traces/<my_trace>.json
\*
\* Trace validation MUST include the TraceMatched property — without it,
\* TLC will report "no errors" even when the cursor never advances.

SPECIFICATION TraceSpec

\* Constants accommodate the trace's thread / key / value sets.
\* The preprocessor should map raw keys/values/threads to the symbols below;
\* override per run if a particular trace needs larger bounds.
CONSTANTS
    Key = {"k1", "k2", "k3"}
    Value = {"v1", "v2", "v3"}
    Thread = {"t1", "t2", "t3"}
    MaxHeight = 2
    MaxNodes = 8
    MaxOps = 10

\* Faults disabled during trace replay (we replay real, fault-free runs).
\* Fault-injection invariants (IteratorFusion under FaultIterRewind, etc.)
\* are excluded below — they require the fault to be meaningfully checked.
CONSTANTS
    FaultInsertReorder = FALSE
    FaultIterRewind = FALSE
    FaultMarkBottomUp = FALSE
    FaultPrematureFree = FALSE
    EnableHarness = TRUE

\* Invariants that should hold on every real execution (no fault injection):
\*   - AllocBound, NodesAllocatedHaveState: structural sanity
\*   - RefcountNonNegative: fundamental refcount property
\*   - MarkMonotone, MarkTopDown: hold on real top-down mark_tower
\*   - KeysUnique: real implementation maintains it (transient F2 window
\*     is excused by the in-flight Insert carve-out in the invariant)
\*
\* Excluded (fault-only): IteratorFusion, IterNoSameKeyTwice (need rewind
\* fault), LenIsApproximatelyKeyCount (transient bound is checked under
\* fault), GetReturnsLatest (atomicity assumption that fails under
\* concurrent retry); RefcountMatchesHandlesAndInstalls is checked at
\* quiescence which is hard to spot in mid-trace.

INVARIANTS
    AllocBound
    NodesAllocatedHaveState
    RefcountNonNegative
    MarkMonotone
    MarkTopDown

PROPERTIES
    TraceMatched
