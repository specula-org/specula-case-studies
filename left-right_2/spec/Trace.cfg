\* Trace.cfg — Round-2 left-right trace validation config.
\* Used by validation-workflow with traces in ../traces/<name>.ndjson.

SPECIFICATION TraceSpec

CONSTANTS
    Reader = {"r1", "r2"}
    MaxOps = 5
    ApplyPR144Fix = FALSE

\* Properties — ensure the entire trace is consumed.  Without this TLC
\* would report "no errors" even when the cursor never advanced.
PROPERTIES
    TraceMatched

\* Always-on safety + structural invariants.  Bug-family invariants are
\* NOT included: real executions don't trigger fault-injection scenarios,
\* and including them risks false positives during trace replay.
INVARIANTS
    TypeOK
    EpochParity
    PointerCopyDisjoint
    NoWriteWhileRead
