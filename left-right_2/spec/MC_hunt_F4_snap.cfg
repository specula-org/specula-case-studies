\* MC_hunt_F4_snap.cfg — F4: per-reader snapshot in update_and_swap.
\*
\* The bulk snapshot loop (write.rs:464-466) is split per-reader in the
\* base spec.  Between two iterations of the loop, another reader's
\* epoch can transition (enter/exit).  This config exhausts those
\* interleavings and checks:
\*   - PerReaderSnapshotConsistency: per-reader snap reads a value
\*     consistent with the reader's current epoch monotonicity.
\*   - NoWriteWhileRead / NoDropWhileRead: the wait skip rule remains
\*     sound when the snap loop interleaves with reader transitions.
\*
\* Expected: invariants HOLD — this confirms the spec's split granularity
\* doesn't introduce a race the bulk-snap modeling would have hidden.
\* If they fail, that's a real bug in the per-reader snap reasoning.

SPECIFICATION MCSpec

CONSTANTS
    Reader = {R1, R2}
    MaxOps = 2
    ApplyPR144Fix = FALSE

    \* Two publishes so we exercise both the first-publish snap and a
    \* second-publish snap with non-empty oplog interleaving.
    MaxPublish      = 2
    MaxTryPublish   = 1
    MaxTakeInner    = 0
    MaxClientHolds  = 0

CONSTRAINT MCStateConstraint
SYMMETRY MCSymmetry

INVARIANTS
    MCTypeOK
    MCEpochParity
    MCPointerDisjoint
    MCNoWriteWhileRead
    MCPerReaderSnapshotConsistency
