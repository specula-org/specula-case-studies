\* MC_hunt_F3_liveness.cfg — F3: long-held guard starves writer.
\*
\* Models the documented but unenforced contract that readers must release
\* their ReadGuard promptly.  Without that contract, a reader holding the
\* guard across `await` / `thread::sleep` / arbitrary user code starves
\* WriteHandle::publish indefinitely.
\*
\* Liveness property: EventualPublish — once a write is appended in
\* first-mode, eventually first := FALSE (i.e., a publish completes).
\*
\* Spec note: we use `MCSpec` (NO ClientHoldGuardRelease fairness) here
\* so that a reader can hold the guard forever.  This is the *bug*
\* configuration; for the *contract-compliant* configuration, switch to
\* `MCSpecWithReleaseFairness` and the property holds.
\*
\* Expected: EventualPublish VIOLATED — counterexample is the starvation
\* trace.

SPECIFICATION MCSpec

CONSTANTS
    Reader = {R1, R2}
    MaxOps = 1
    ApplyPR144Fix = FALSE

    MaxPublish      = 1
    MaxTryPublish   = 0
    MaxTakeInner    = 0
    MaxClientHolds  = 1

CONSTRAINT MCStateConstraint
SYMMETRY MCSymmetry

PROPERTIES
    EventualPublish

\* Always-on safety just to catch unrelated regressions.
INVARIANTS
    MCTypeOK
    MCEpochParity
    MCPointerDisjoint
