\* MC_hunt_F2_panic.cfg — F2: reentrant enter() panic on dropped handle.
\*
\* Trigger sequence (per modeling-brief §2 F2):
\*   1. Reader r takes an outer ReadGuard (enters[r] = 1, epoch[r] odd).
\*   2. Writer's Drop runs take_inner; the NULL swap sets inner_ptr = NULL.
\*   3. Reader r calls enter() again — the reentrant branch (enters > 0)
\*      reloads inner_ptr at read.rs:126.  inner_ptr = NULL; the
\*      `unreachable!()` at read.rs:146 fires.
\*
\* The wait() inside take_inner blocks until enters[r] = 0, so step 2's
\* drop_first / drop_second don't run while r still holds — but the
\* panic in step 3 is reachable as long as inner_ptr is NULL.
\*
\* Expected: MCNoUnreachablePanic VIOLATED.

SPECIFICATION MCSpec

CONSTANTS
    Reader = {R1, R2}
    MaxOps = 1
    ApplyPR144Fix = FALSE

    MaxPublish      = 1
    MaxTryPublish   = 0
    MaxTakeInner    = 1
    MaxClientHolds  = 0

CONSTRAINT MCStateConstraint
SYMMETRY MCSymmetry

INVARIANTS
    MCTypeOK
    MCEpochParity
    MCPointerDisjoint
    MCNoUnreachablePanic
