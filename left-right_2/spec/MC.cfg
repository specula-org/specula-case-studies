\* MC.cfg — Round-2 left-right convergence config.
\* Standard structural + general safety invariants.  Bug-family invariants
\* are commented out and enabled by MC_hunt_<family>.cfg.

SPECIFICATION MCSpec

CONSTANTS
    Reader = {R1, R2}
    MaxOps = 2
    ApplyPR144Fix = FALSE

    \* Adversary counters — keep small for convergence; hunt cfgs override.
    MaxPublish      = 1
    MaxTryPublish   = 0
    MaxTakeInner    = 0
    MaxClientHolds  = 0

CONSTRAINT MCStateConstraint
SYMMETRY MCSymmetry

\* --- Structural invariants ---
INVARIANTS
    MCTypeOK
    MCEpochParity
    MCPointerDisjoint

\* --- Always-on safety (cheap, run during convergence) ---
    MCNoWriteWhileRead

\* --- Extension invariants — enabled in hunt cfgs ---
\* MCNoDropWhileRead              \* F1
\* MCStaleSnapshotIsCaught        \* F1
\* MCNoUnreachablePanic           \* F2
\* MCPerReaderSnapshotConsistency \* F4
