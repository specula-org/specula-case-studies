\* MC_hunt_F1_uaf.cfg — F1: take_inner stale-snapshot UAF (PR #144 OPEN).
\*
\* Goal: a reader's readerHolding still aliases releasedCopy or writerCopy
\* when WriterTakeInnerDropFirst / WriterTakeInnerDropSecond fires.  This
\* is the headline finding of Round 2 — TSAN-confirmed by PR #144.
\*
\* Run upstream-current code (ApplyPR144Fix = FALSE).
\* Expected: MCNoDropWhileRead VIOLATED.

SPECIFICATION MCSpec

CONSTANTS
    Reader = {R1, R2}
    MaxOps = 2
    ApplyPR144Fix = FALSE

    \* Need at least one normal publish so first=FALSE and lastEpochs is
    \* populated, then exactly one take_inner that hits the
    \* MaybePublishSkip path (oplog empty, !first).
    MaxPublish      = 2
    MaxTryPublish   = 0
    MaxTakeInner    = 1
    MaxClientHolds  = 0

CONSTRAINT MCStateConstraint
SYMMETRY MCSymmetry

INVARIANTS
    MCTypeOK
    MCEpochParity
    MCPointerDisjoint
    MCNoDropWhileRead
    MCStaleSnapshotIsCaught
