SPECIFICATION MCSpec

CONSTANTS
    MigrationId = {m1, m2}
    Nil = Nil

    MaxStepdownLimit = 2
    MaxAbortLimit = 0
    MaxConfigFailLimit = 0
    MaxConfigAsyncLimit = 0
    MaxRemoveRecipientLimit = 0
    MaxRestoreRecipientLimit = 0
    MaxForgetDurableLimit = 0
    MaxRangeDeleterLimit = 1

VIEW MCView
CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    OrphanCountBounded
