SPECIFICATION MCSpec

CONSTANTS
    MigrationId = {m1, m2}
    Nil = Nil

    \* Counter bounds — convergence config (standard safety)
    MaxStepdownLimit = 2
    MaxAbortLimit = 2
    MaxConfigFailLimit = 1
    MaxConfigAsyncLimit = 1
    MaxRemoveRecipientLimit = 0
    MaxRestoreRecipientLimit = 0
    MaxForgetDurableLimit = 2
    MaxRangeDeleterLimit = 2

VIEW MCView

CHECK_DEADLOCK FALSE

\* --- Structural invariants (always checked) ---
INVARIANTS
    TypeOK
    CleanupConsistency
    ForgetPendingConsistency
    CoordDocValidity

\* --- Extension invariants (enable for bug hunting) ---
\* INVARIANT NoPrematureRangeDeletion
\* INVARIANT ActiveMigrationHasTask
\* INVARIANT CommitPathHandlesRecipientRemoval
\* INVARIANT NoLimboCoordinatorDoc
\* INVARIANT OrphanCountBounded

\* --- Temporal properties (require fairness, use with care) ---
\* PROPERTY CommitPathCompletes
\* PROPERTY EventualCleanup
