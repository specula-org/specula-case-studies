\* Hunting config for Bug Family 4: Async Persistence Model
\* Targets: MC-7 (leader sends before persist safety)
\*          MC-8 (log truncation decreases persisted)
\*          MC-9 (max_apply_unpersisted_log_limit + leader demotion + crash)
\*
\* Tight bounds: maximize crashes + client requests, minimize elections.
SPECIFICATION MCSpec

CONSTANTS
    s1 = s1
    s2 = s2
    s3 = s3
    Server = {s1, s2, s3}

    Follower = Follower
    Candidate = Candidate
    PreCandidate = PreCandidate
    Leader = Leader
    Nil = Nil
    ValueEntry = ValueEntry
    ConfigEntry = ConfigEntry
    NoopEntry = NoopEntry

    RequestVoteRequest = RequestVoteRequest
    RequestVoteResponse = RequestVoteResponse
    RequestPreVoteRequest = RequestPreVoteRequest
    RequestPreVoteResponse = RequestPreVoteResponse
    AppendEntriesRequest = AppendEntriesRequest
    AppendEntriesResponse = AppendEntriesResponse
    HeartbeatRequest = HeartbeatRequest
    HeartbeatResponse = HeartbeatResponse
    TimeoutNowRequest = TimeoutNowRequest
    InstallSnapshotRequest = InstallSnapshotRequest
    InstallSnapshotResponse = InstallSnapshotResponse

    \* Tight bounds for persistence hunting
    MaxTermLimit       = 4
    MaxTimeoutLimit    = 4
    RequestLimit       = 4
    CrashLimit         = 3
    LoseLimit          = 2
    HeartbeatLimit     = 4
    TransferLimit      = 0
    ReadLimit          = 0
    ConfChangeLimit    = 0
    CheckQuorumLimit   = 1
    MaxMsgBufferLimit  = 10

    Timeout           <- MCTimeout
    ClientRequest     <- MCClientRequest
    SendHeartbeat     <- MCSendHeartbeat
    CheckQuorum       <- MCCheckQuorum
    TransferLeadership <- MCTransferLeadership
    ProposeReadIndex  <- MCProposeReadIndex
    ProposeConfChange <- MCProposeConfChange
    Crash             <- MCCrash
    LoseMessage       <- MCLoseMessage

SYMMETRY ModelSymmetry
VIEW ModelView
CHECK_DEADLOCK FALSE
CONSTRAINT MsgBufferConstraint

INVARIANTS
    ElectionSafety
    AsyncPersistSafety
    CrashRecoverySafety
    LeaderCompleteness
