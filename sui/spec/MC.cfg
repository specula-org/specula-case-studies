\* Standard convergence config for the Sui Mysticeti MC spec.
\* This config exists to verify that the spec converges (no deadlock,
\* type errors, or trivially unreachable states). Bug-family-specific
\* invariants are commented out — they live in MC_hunt_<family>.cfg.

SPECIFICATION MCSpec

CONSTANTS
    Server = {"s1", "s2", "s3", "s4"}
    Byzantine = {"s4"}
    \* Tight bounds for convergence: without symmetry (Server uses strings),
    \* state space is ~6x larger; tighten dag size and rounds to fit a
    \* 30-min run.
    MaxRound = 4
    MaxDigest = 2
    MaxTimestamp = 1
    Nil = "Nil"

    WaveLength = 3
    GCDepth = 2

    Commit_ = "Commit"
    Skip_ = "Skip"
    Undecided_ = "Undecided"

    DirectDecision = "Direct"
    IndirectDecision = "Indirect"

    \* MC fault bounds (convergence)
    MaxByzProposeLimit = 1
    MaxCrashLimit = 1
    MaxRecoverLimit = 1
    MaxCertCommitLimit = 1
    MaxForceProposeLimit = 1
    MaxDagSizeLimit = 10

\* SYMMETRY removed: Server uses string values to match the trace's authority
\* IDs, but TLC's Permutations only supports model values. The 6x speedup
\* from honest-permutation symmetry is sacrificed for the simpler string-
\* based representation that makes Trace.cfg and MC.cfg share base.tla
\* unchanged.
VIEW ModelView
CONSTRAINT DagSizeConstraint

INVARIANTS
    \* Standard / structural
    TypeOK
    ClockGCConsistency
    CommittedBlocksRoundOK

    \* Bug-family invariants (kept here for documentation —
    \* enabled in hunt configs):
    \* CommitAgreement              \* F1, MC_hunt_family1.cfg
    \* CommitDigestAgreement        \* F1, MC_hunt_family1.cfg
    \* LeaderCommitMonotonic        \* F1, MC_hunt_family1.cfg
    \* NoOwnEquivocation            \* F2, MC_hunt_family2.cfg
    \* CommitRecursionDecidable     \* F3, MC_hunt_family3.cfg
    \* ForcePropose2f1Parents       \* F4, MC_hunt_family4.cfg
    \* MultiLeaderCommitOrdering    \* F4, MC_hunt_family4_multileader.cfg

PROPERTIES
    DecisionPermanence
    MonotonicCommitSeq
