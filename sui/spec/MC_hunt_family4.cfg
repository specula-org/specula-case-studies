\* Hunt config for Family 4: Leader timeout / threshold clock / proposer.
\* Brief §6.1 MC4 — Core::add_certified_commits accepts a peer-certified
\* commit at high round R, advancing clockRound to R. Local DAG at peer
\* authorities has rounds < R-1. LeaderTimeout fires → ForcePropose →
\* parent_round_quorum.reached_threshold = false → assertion violation.
\*
\* Trigger: AddCertifiedCommit advances clockRound past local DAG;
\*          ForcePropose fires before DeliverBlock catches up.

SPECIFICATION MCSpec

CONSTANTS
    Server = {"s1", "s2", "s3", "s4"}
    Byzantine = {"s4"}
    MaxRound = 5
    MaxDigest = 1            \* equivocation irrelevant here
    MaxTimestamp = 1
    Nil = "Nil"

    WaveLength = 3
    GCDepth = 3

    Commit_ = "Commit"
    Skip_ = "Skip"
    Undecided_ = "Undecided"

    DirectDecision = "Direct"
    IndirectDecision = "Indirect"

    \* Tight bounds — only certified-commit + force-propose matter
    MaxByzProposeLimit = 0
    MaxCrashLimit = 0
    MaxRecoverLimit = 0
    MaxCertCommitLimit = 2   \* enough to advance clock past DAG
    MaxForceProposeLimit = 2 \* enough to fire after fast-sync
    MaxDagSizeLimit = 12

\* SYMMETRY removed — Server uses strings.
VIEW ModelView
CONSTRAINT DagSizeConstraint

INVARIANTS
    TypeOK
    \* Family 4 primary invariant
    ForcePropose2f1Parents
