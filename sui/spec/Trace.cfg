SPECIFICATION TraceSpec

CONSTANTS
    Server = {"s1", "s2", "s3", "s4"}
    Byzantine = {}
    MaxRound = 6
    MaxDigest = 2
    MaxTimestamp = 5
    Nil = "Nil"

    WaveLength = 3
    \* Higher than the trace's MaxRound (6) so gcRound stays at 0 throughout
    \* the trace — matches the impl's default gc_depth (≈ 50) for these short
    \* harness scenarios where last_commit_round - gc_depth saturates to 0.
    GCDepth = 10

    Commit_ = "Commit"
    Skip_ = "Skip"
    Undecided_ = "Undecided"

    DirectDecision = "Direct"
    IndirectDecision = "Indirect"

VIEW TraceView
ALIAS TraceAlias

INVARIANTS
    \* Standard structural sanity
    TypeOK
    ClockGCConsistency
    CommittedBlocksRoundOK

    \* Bug-family safety invariants — should hold on real (fault-free) traces
    CommitAgreement
    CommitDigestAgreement
    NoOwnEquivocation
    CommitRecursionDecidable

PROPERTIES
    TraceMatched
