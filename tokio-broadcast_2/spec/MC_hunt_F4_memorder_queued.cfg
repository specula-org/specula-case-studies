\* MC_hunt_F4_memorder_queued.cfg
\* Family 4 hunt — Memory ordering on Waiter.queued (PR #6298)
\*
\* Strategy: enable the memory-order downgrade adversary on
\* "QueuedAcquireLoad" or "QueuedReleaseStore"; tight bounds on everything
\* else.  Bug mechanism: relaxing the Acquire-load in Recv::drop produces
\* a stale FALSE that makes Recv::drop short-circuit while notify_rx is
\* still mutating the Waiter — NoUseAfterFree_Waiter then fails.

CONSTANTS
    Receiver = {r1}
    Sender = {s1}
    Capacity = 2
    Value = {v1}
    PosMod = 8
    MaxSubscribe = 1
    MaxSend = 1
    MaxDropRecv = 1
    MaxDropSend = 1
    NoneVal = "NONE"
    NoneSite = "NONESITE"

SPECIFICATION MCSpec
SYMMETRY Symmetry
VIEW View

INVARIANTS
    TypeOK
    NoUseAfterFree_Waiter
    WaiterQueuedConsistency
