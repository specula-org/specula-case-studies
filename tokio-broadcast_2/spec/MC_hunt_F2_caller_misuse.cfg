\* MC_hunt_F2_caller_misuse.cfg
\* Family 2 hunt — Adversarial caller patterns
\*
\* Strategy: maximize subscribe/drop/resubscribe interleavings; minimize
\* mem-order downgrades and minimize sends.  Bug mechanism: subscribe-
\* during-send, drop-out-of-order, mixed close+drop, resubscribe-after-
\* close producing inconsistent CloseReason / SubscribeRespectsSendBoundary.

CONSTANTS
    Receiver = {r1, r2, r3}
    Sender = {s1, s2}
    Capacity = 2
    Value = {v1}
    PosMod = 8
    MaxSubscribe = 3
    MaxSend = 1
    MaxDropRecv = 3
    MaxDropSend = 2
    NoneVal = "NONE"
    NoneSite = "NONESITE"

SPECIFICATION MCSpec
SYMMETRY Symmetry
VIEW View

INVARIANTS
    TypeOK
    CloseReopenSemantics
    RxCntPositiveImpliesNotPermanentlyClosed
    SubscribeRespectsSendBoundary
    ReceiverCountConsistency
    ConcurrentDropCloseIdempotent
