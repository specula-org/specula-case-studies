\* MC_hunt_family5.cfg — Hunt for Bug Family 5: Election Disruption & FD Dependence
\* Targets: NoPhantomLease / ElectionSafety under stale failure detector.
\* FD non-determinism can prevent leader stepdown or suppress valid elections.
\*
\* Tight bounds: enable FD updates, elections. Minimize snapshots, config changes.

CONSTANTS
    Nil = Nil
    Server = {s1, s2, s3}
    Follower = Follower
    Candidate = Candidate
    Leader = Leader
    ValueEntry = ValueEntry
    ConfigEntry = ConfigEntry
    RequestVoteRequest = RequestVoteRequest
    RequestVoteResponse = RequestVoteResponse
    AppendEntriesRequest = AppendEntriesRequest
    AppendEntriesResponse = AppendEntriesResponse
    InstallSnapshotRequest = InstallSnapshotRequest
    InstallSnapshotResponse = InstallSnapshotResponse
    ReadQuorumRequest = ReadQuorumRequest
    ReadQuorumResponse = ReadQuorumResponse

    MaxTermLimit = 4
    MaxTimeoutLimit = 5
    RequestLimit = 2
    CrashLimit = 1
    LoseLimit = 3
    SnapshotLimit = 0
    ReadBarrierLimit = 0
    ConfigChangeLimit = 0
    FDUpdateLimit = 5
    MaxMsgBufferLimit = 10

SPECIFICATION MCSpec

SYMMETRY MCSymmetry

VIEW MCView

CONSTRAINT MsgBufferConstraint

\* Target invariants: safety must hold regardless of FD accuracy
INVARIANT MCElectionSafety
INVARIANT MCLogMatching
INVARIANT MCLeaderCompleteness
INVARIANT MCCommitBound
