\* MC_hunt_family2.cfg — Hunt for Bug Family 2: Joint Consensus Quorum Miscalculation
\* Targets: JointQuorumAgreement + ReadBarrier stall via can_vote mismatch.
\* The buggy TrackerCanVote in BroadcastReadQuorum skips demoted voters.
\*
\* Tight bounds: enable config changes, read barriers. Minimize crashes.

CONSTANTS
    Nil = Nil
    Server = {s1, s2, s3}
    Follower = Follower
    Candidate = Candidate
    Leader = Leader
    ValueEntry = ValueEntry
    ConfigEntry = ConfigEntry
    RequestVoteRequest = RequestVoteRequest
    RequestVoteResponse = RequestVoteResponse
    AppendEntriesRequest = AppendEntriesRequest
    AppendEntriesResponse = AppendEntriesResponse
    InstallSnapshotRequest = InstallSnapshotRequest
    InstallSnapshotResponse = InstallSnapshotResponse
    ReadQuorumRequest = ReadQuorumRequest
    ReadQuorumResponse = ReadQuorumResponse

    MaxTermLimit = 3
    MaxTimeoutLimit = 3
    RequestLimit = 2
    CrashLimit = 0
    LoseLimit = 1
    SnapshotLimit = 0
    ReadBarrierLimit = 3
    ConfigChangeLimit = 2
    FDUpdateLimit = 0
    MaxMsgBufferLimit = 10

SPECIFICATION MCSpec

SYMMETRY MCSymmetry

VIEW MCView

CONSTRAINT MsgBufferConstraint

\* Target invariants
INVARIANT MCJointQuorumAgreement
INVARIANT MCElectionSafety
INVARIANT MCCommitBound
