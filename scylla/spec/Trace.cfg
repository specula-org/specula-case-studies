\* Trace.cfg — Trace validation configuration.
\* Run with: java -jar tla2tools.jar -config Trace.cfg Trace.tla
\* Override trace file: -DJSON=../traces/my_trace.ndjson

CONSTANTS
    Nil = Nil
    Server = {"s1", "s2", "s3"}
    Follower = Follower
    Candidate = Candidate
    Leader = Leader
    ValueEntry = ValueEntry
    ConfigEntry = ConfigEntry
    RequestVoteRequest = RequestVoteRequest
    RequestVoteResponse = RequestVoteResponse
    AppendEntriesRequest = AppendEntriesRequest
    AppendEntriesResponse = AppendEntriesResponse
    InstallSnapshotRequest = InstallSnapshotRequest
    InstallSnapshotResponse = InstallSnapshotResponse
    ReadQuorumRequest = ReadQuorumRequest
    ReadQuorumResponse = ReadQuorumResponse

INIT TraceInit
NEXT TraceNext

\* Use deadlock-based completion: TLC stops when no more actions are enabled.
\* The trace is fully consumed when l = Len(TraceLog) + 1.
\* If TLC reports deadlock at l < Len(TraceLog) + 1, the trace doesn't match.

\* PROPERTY TraceMatched

ALIAS TraceAlias
