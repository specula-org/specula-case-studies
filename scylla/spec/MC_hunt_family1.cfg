\* MC_hunt_family1.cfg — Hunt for Bug Family 1: Commit Index Over-Advancement
\* Targets: CommitIndexSafety violation via unclamped AppendEntries or ReadQuorum.
\* Uses buggy action variants to reproduce historical bugs #9965 and #10578.
\*
\* Tight bounds: minimize irrelevant actions, focus on replication + commit.

CONSTANTS
    Nil = Nil
    Server = {s1, s2, s3}
    Follower = Follower
    Candidate = Candidate
    Leader = Leader
    ValueEntry = ValueEntry
    ConfigEntry = ConfigEntry
    RequestVoteRequest = RequestVoteRequest
    RequestVoteResponse = RequestVoteResponse
    AppendEntriesRequest = AppendEntriesRequest
    AppendEntriesResponse = AppendEntriesResponse
    InstallSnapshotRequest = InstallSnapshotRequest
    InstallSnapshotResponse = InstallSnapshotResponse
    ReadQuorumRequest = ReadQuorumRequest
    ReadQuorumResponse = ReadQuorumResponse

    MaxTermLimit = 3
    MaxTimeoutLimit = 3
    RequestLimit = 3
    CrashLimit = 0
    LoseLimit = 2
    SnapshotLimit = 0
    ReadBarrierLimit = 3
    ConfigChangeLimit = 0
    FDUpdateLimit = 0
    MaxMsgBufferLimit = 10

SPECIFICATION MCSpecFamily1

SYMMETRY MCSymmetry

VIEW MCView

CONSTRAINT MsgBufferConstraint

\* Target invariant + core safety
INVARIANT MCCommitIndexSafety
INVARIANT MCElectionSafety
INVARIANT MCCommitBound
