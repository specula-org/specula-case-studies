\* Bug Family 2: Router Abort vs Commit Race
\* Targets: MC-2 (explicit abort after commit), MC-6 (two-router conflict),
\*          MC-10 (commit not reaching all shards)
\* Tight bounds: maximize router aborts, minimize other faults

SPECIFICATION MCSpec

CONSTANTS
    Shard = {s1, s2, s3}
    Router = {r1}
    Txn = {t1}
    Key = {k1}
    NilShard = NilShard
    MaxCrash = 1
    MaxMsgLoss = 1
    MaxShardStepDown = 0
    MaxShardRemove = 0
    MaxMoveKey = 0
    MaxRouterAbort = 3

SYMMETRY ModelSymmetry

CONSTRAINT MCStateConstraint

INVARIANTS
    TypeOK
    NoConflictingDecisions
    NoPartialCommit
