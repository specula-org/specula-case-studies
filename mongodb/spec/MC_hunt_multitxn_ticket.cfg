SPECIFICATION MCSpec

CONSTANTS
    Shard = {s1, s2}
    Router = {r1}
    Txn = {t1, t2}
    MaxTickets = 2
    CoordTicketExempt = TRUE

    \* Focus: 2 concurrent txns + background task competing for 2 tickets
    \* kExempt ON (post-fix), but bg task might create new deadlock pattern
    MaxPartialSend = 0
    MaxReaper = 0
    MaxBgTask = 1
    MaxSWSReadFail = 0
    MaxSWSWriteFail = 0
    MaxDelayedCommit = 0
    MaxRetry = 0

SYMMETRY MCSymmetry
CONSTRAINT MCStateConstraint

INVARIANTS
    CommitTypeConsistency
    TicketPoolNonNegative
    DecisionIrreversible
    NoTicketDeadlock
    NoTicketDeadlockWithBg
