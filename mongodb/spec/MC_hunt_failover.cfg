\* Bug Family 1: Coordinator Failover Atomicity Gaps
\* Targets: MC-1 (w:1 delete rollback), MC-5 (crash during WaitingForVotes),
\*          MC-7 (decision before majority), MC-8 (endOfTxn error)
\* Tight bounds: maximize crash, minimize irrelevant faults

SPECIFICATION MCSpec

CONSTANTS
    Shard = {s1, s2, s3}
    Router = {r1}
    Txn = {t1}
    Key = {k1}
    NilShard = NilShard
    MaxCrash = 3
    MaxMsgLoss = 1
    MaxShardStepDown = 1
    MaxShardRemove = 0
    MaxMoveKey = 0
    MaxRouterAbort = 0

SYMMETRY ModelSymmetry

CONSTRAINT MCStateConstraint

INVARIANTS
    TypeOK
    RecoveryCompleteness
    NoPartialCommit
