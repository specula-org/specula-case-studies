SPECIFICATION MCSpec

CONSTANTS
    Shard = {s1, s2}
    Router = {r1}
    Txn = {t1, t2}
    MaxTickets = 2
    CoordTicketExempt = TRUE

    \* 2 concurrent txns competing for 2 tickets
    \* Even with the kExempt fix, background tasks could still cause starvation
    MaxPartialSend = 0
    MaxReaper = 1
    MaxBgTask = 1
    MaxSWSReadFail = 0
    MaxSWSWriteFail = 0
    MaxDelayedCommit = 0
    MaxRetry = 1

SYMMETRY MCSymmetry
CONSTRAINT MCStateConstraint

INVARIANTS
    CommitTypeConsistency
    TicketPoolNonNegative
    DecisionIrreversible
    AllParticipantsReachTerminal
    NoTicketDeadlock
    NoTicketDeadlockWithBg
    NoSilentDataLoss
    ClassificationMatchesReality
