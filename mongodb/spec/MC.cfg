SPECIFICATION MCSpec

CONSTANTS
    Shard = {s1, s2, s3}
    Router = {r1}
    Txn = {t1}
    MaxTickets = 3
    CoordTicketExempt = TRUE

    \* Counter bounds
    MaxPartialSend = 1
    MaxReaper = 1
    MaxBgTask = 1
    MaxSWSReadFail = 1
    MaxSWSWriteFail = 1
    MaxDelayedCommit = 1
    MaxRetry = 2

SYMMETRY MCSymmetry

CONSTRAINT MCStateConstraint

\* --- Structural invariants (always checked) ---
INVARIANTS
    CommitTypeConsistency
    TicketPoolNonNegative
    SWSCorrectness
    DecisionIrreversible
    AllParticipantsReachTerminal

\* --- Extension invariants (checked during bug hunting, not convergence) ---
\* These are designed to find real bugs when fault injection is active.
\* INVARIANTS
\*     NoTicketDeadlock
\*     NoTicketDeadlockWithBg
\*     NoSilentDataLoss
\*     ClassificationMatchesReality
\*     RetryNeverContradictsOriginal
