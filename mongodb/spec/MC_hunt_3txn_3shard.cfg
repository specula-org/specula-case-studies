SPECIFICATION MCSpec

CONSTANTS
    Shard = {s1, s2, s3}
    Router = {r1}
    Txn = {t1, t2, t3}
    MaxTickets = 3
    CoordTicketExempt = TRUE

    \* 3 txns, 3 shards, 3 tickets — max concurrency
    MaxPartialSend = 1
    MaxReaper = 1
    MaxBgTask = 2
    MaxSWSReadFail = 1
    MaxSWSWriteFail = 1
    MaxDelayedCommit = 1
    MaxRetry = 1

SYMMETRY MCSymmetry
CONSTRAINT MCStateConstraint

INVARIANTS
    CommitTypeConsistency
    TicketPoolNonNegative
    DecisionIrreversible
    AllParticipantsReachTerminal
    NoTicketDeadlock
    NoTicketDeadlockWithBg
    RetryNeverContradictsOriginal
    SWSCorrectness
