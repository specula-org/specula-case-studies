SPECIFICATION MCSpec

CONSTANT
    RC = "snapshot"
    Keys = {k1, k2}
    TxId = {"t1", "t2"}
    NoValue = NoValue
    Shard = {s1, s2}
    Router = {r1}
    Timestamps = {1, 2, 3}
    IgnorePrepareBlocking = "false"
    IgnoreWriteConflicts = "false"
    MaxOpsPerTxn = 2

    \* Convergence: 0 faults
    MaxRestarts = 0
    MaxMoveKeys = 0
    MaxReaps = 0
    MaxRouterAborts = 0

CONSTRAINT StateConstraint

\* SYMMETRY disabled: TxId/Keys are strings not model values
\* SYMMETRY MCSymmetry

\* --- Standard safety ---
INVARIANT MCSnapshotIsolation

\* --- Structural invariants ---
INVARIANT MCNoOrphanedPrepared
INVARIANT MCCoordinatorDocConsistency

\* --- Extension invariants (bug-family specific) ---
\* Uncomment during hunting. Commented out for convergence.
\* INVARIANT MCTwoPCAtomicity
\* INVARIANT MCReaperSafety
\* INVARIANT MCRoutingConsistency
