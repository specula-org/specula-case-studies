\* Hunting config: Bug Family 2 — Stale Read / Read Before NoOp
\* Target: MC-2 (NoStaleRead) + MC-3 (NoReadBeforeNoOp)
\* Strategy: enable reads + elections + message loss (partition), minimize snapshots.

SPECIFICATION MCSpec

CONSTANTS
    s1 = s1
    s2 = s2
    s3 = s3

    Server = {s1, s2, s3}

    \* Tight bounds: focus on elections + reads + partitions
    MaxTermLimit        = 4
    MaxTimeoutLimit     = 5
    RequestLimit        = 3
    CrashLimit          = 1
    LoseLimit           = 4
    SnapshotLimit       = 0
    ConfigChangeLimit   = 0
    ReadLimit           = 4
    MaxMsgBufferLimit   = 10

    \* Action overrides
    Timeout              <- MCTimeout
    ClientRequest        <- MCClientRequest
    Crash                <- MCCrash
    LoseMessage          <- MCLoseMessage
    TakeSnapshot         <- MCTakeSnapshot
    SendInstallSnapshot  <- MCSendInstallSnapshot
    ProposeAddServer     <- MCProposeAddServer
    ProposeRemoveServer  <- MCProposeRemoveServer
    ClientNonQuorumRead  <- MCClientNonQuorumRead

    Nil = Nil
    Follower    = Follower
    Candidate   = Candidate
    Leader      = Leader
    ValueEntry  = ValueEntry
    ConfigEntry = ConfigEntry
    NoopEntry   = NoopEntry
    RequestVoteRequest      = RequestVoteRequest
    RequestVoteResponse     = RequestVoteResponse
    AppendEntriesRequest    = AppendEntriesRequest
    AppendEntriesResponse   = AppendEntriesResponse
    InstallSnapshotRequest  = InstallSnapshotRequest

SYMMETRY Symmetry

CHECK_DEADLOCK
    FALSE

CONSTRAINT
    MsgBufferConstraint

\* Target invariants + core safety
INVARIANTS
    ElectionSafety
    NoStaleRead
    NoReadBeforeNoOp
