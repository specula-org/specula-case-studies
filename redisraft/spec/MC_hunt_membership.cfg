\* Hunting config: Bug Family 3 — Membership Change Safety / Split Brain
\* Target: MC-4 (NoSplitBrain via ElectionSafety), MC-5 (ConfigChangeSafety),
\*         MC-7 (off-by-one in votingCfgChangeLogIdx)
\* Strategy: enable config changes + elections + partitions, minimize snapshots.

SPECIFICATION MCSpec

CONSTANTS
    s1 = s1
    s2 = s2
    s3 = s3

    Server = {s1, s2, s3}

    \* Tight bounds: focus on membership changes + elections
    MaxTermLimit        = 4
    MaxTimeoutLimit     = 5
    RequestLimit        = 2
    CrashLimit          = 1
    LoseLimit           = 3
    SnapshotLimit       = 0
    ConfigChangeLimit   = 4
    ReadLimit           = 0
    MaxMsgBufferLimit   = 10

    \* Action overrides
    Timeout              <- MCTimeout
    ClientRequest        <- MCClientRequest
    Crash                <- MCCrash
    LoseMessage          <- MCLoseMessage
    TakeSnapshot         <- MCTakeSnapshot
    SendInstallSnapshot  <- MCSendInstallSnapshot
    ProposeAddServer     <- MCProposeAddServer
    ProposeRemoveServer  <- MCProposeRemoveServer
    ClientNonQuorumRead  <- MCClientNonQuorumRead

    Nil = Nil
    Follower    = Follower
    Candidate   = Candidate
    Leader      = Leader
    ValueEntry  = ValueEntry
    ConfigEntry = ConfigEntry
    NoopEntry   = NoopEntry
    RequestVoteRequest      = RequestVoteRequest
    RequestVoteResponse     = RequestVoteResponse
    AppendEntriesRequest    = AppendEntriesRequest
    AppendEntriesResponse   = AppendEntriesResponse
    InstallSnapshotRequest  = InstallSnapshotRequest

SYMMETRY Symmetry

CHECK_DEADLOCK
    FALSE

CONSTRAINT
    MsgBufferConstraint

\* Target invariants + core safety
INVARIANTS
    ElectionSafety
    LeaderCompleteness
    ConfigChangeSafety
