\* Hunting config: Bug Family 4 — Log Persistence / Crash Recovery
\* Target: MC-6 — Crash between log truncation and append.
\* Strategy: enable crashes + replication, verify LeaderCompleteness holds
\*           even after crash recovery.

SPECIFICATION MCSpec

CONSTANTS
    s1 = s1
    s2 = s2
    s3 = s3

    Server = {s1, s2, s3}

    \* Tight bounds: focus on crash + replication
    MaxTermLimit        = 4
    MaxTimeoutLimit     = 5
    RequestLimit        = 3
    CrashLimit          = 3
    LoseLimit           = 2
    SnapshotLimit       = 1
    ConfigChangeLimit   = 0
    ReadLimit           = 0
    MaxMsgBufferLimit   = 10

    \* Action overrides
    Timeout              <- MCTimeout
    ClientRequest        <- MCClientRequest
    Crash                <- MCCrash
    LoseMessage          <- MCLoseMessage
    TakeSnapshot         <- MCTakeSnapshot
    SendInstallSnapshot  <- MCSendInstallSnapshot
    ProposeAddServer     <- MCProposeAddServer
    ProposeRemoveServer  <- MCProposeRemoveServer
    ClientNonQuorumRead  <- MCClientNonQuorumRead

    Nil = Nil
    Follower    = Follower
    Candidate   = Candidate
    Leader      = Leader
    ValueEntry  = ValueEntry
    ConfigEntry = ConfigEntry
    NoopEntry   = NoopEntry
    RequestVoteRequest      = RequestVoteRequest
    RequestVoteResponse     = RequestVoteResponse
    AppendEntriesRequest    = AppendEntriesRequest
    AppendEntriesResponse   = AppendEntriesResponse
    InstallSnapshotRequest  = InstallSnapshotRequest

SYMMETRY Symmetry

CHECK_DEADLOCK
    FALSE

CONSTRAINT
    MsgBufferConstraint

\* Target invariants + core safety
INVARIANTS
    ElectionSafety
    LogMatching
    LeaderCompleteness
    SnapshotLogConsistency
