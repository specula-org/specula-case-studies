SPECIFICATION MCSpec

CONSTANTS
    s1 = s1
    s2 = s2
    s3 = s3

    Server = {s1, s2, s3}

    \* Constraint limits — tuned for tractable state space with 3 servers
    MaxTermLimit        = 4
    MaxTimeoutLimit     = 5
    RequestLimit        = 3
    CrashLimit          = 2
    LoseLimit           = 3
    SnapshotLimit       = 2
    ConfigChangeLimit   = 2
    ReadLimit           = 3
    MaxMsgBufferLimit   = 10

    \* Action overrides (inject counter constraints via operator replacement)
    Timeout              <- MCTimeout
    ClientRequest        <- MCClientRequest
    Crash                <- MCCrash
    LoseMessage          <- MCLoseMessage
    TakeSnapshot         <- MCTakeSnapshot
    SendInstallSnapshot  <- MCSendInstallSnapshot
    ProposeAddServer     <- MCProposeAddServer
    ProposeRemoveServer  <- MCProposeRemoveServer
    ClientNonQuorumRead  <- MCClientNonQuorumRead

    \* Type constants
    Nil = Nil

    Follower    = Follower
    Candidate   = Candidate
    Leader      = Leader

    ValueEntry  = ValueEntry
    ConfigEntry = ConfigEntry
    NoopEntry   = NoopEntry

    RequestVoteRequest      = RequestVoteRequest
    RequestVoteResponse     = RequestVoteResponse
    AppendEntriesRequest    = AppendEntriesRequest
    AppendEntriesResponse   = AppendEntriesResponse
    InstallSnapshotRequest  = InstallSnapshotRequest

SYMMETRY Symmetry

CHECK_DEADLOCK
    FALSE

\* ============================================================================
\* State Space Pruning
\* ============================================================================
CONSTRAINT
    MsgBufferConstraint

\* ============================================================================
\* Core Raft Safety Invariants (from base spec)
\* ============================================================================
INVARIANTS
    ElectionSafety
    LogMatching
    LeaderCompleteness

\* ============================================================================
\* Structural Invariants (from MC spec)
\* ============================================================================
INVARIANTS
    CommitIndexBoundInv
    LeaderTermPositiveInv
    CandidateVotedForSelfInv
    ConfigValidInv
    LogOffsetValidInv

\* ============================================================================
\* Bug Detection Invariants
\* Enable to reproduce violations for specific bug families.
\* ============================================================================
\* INVARIANTS
\*     SnapshotLogConsistency
\*     NoStaleRead
\*     NoReadBeforeNoOp
\*     ConfigChangeSafety

\* ============================================================================
\* Temporal Properties
\* ============================================================================
PROPERTIES
    MonotonicCommitIndexProp
    MonotonicTermProp
    LeaderAppendOnlyProp
    LeaderCommitCurrentTermProp
