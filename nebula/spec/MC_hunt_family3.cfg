\* MC_hunt_family3.cfg — Hunt for Snapshot Lifecycle Race Conditions (Family 3)
\*
\* Target: Leadership change during snapshot → Host state corrupted.
\* Invariant: ElectionSafety + LogMatching (snapshot corruption can cause log divergence)
\*
\* Strategy: Enable snapshots, elections, and crash. The key scenario:
\* leader starts snapshot to follower, loses leadership, regains it or another
\* leader is elected, snapshot callback fires and updates Host state with stale data.

CONSTANTS
    Nil = Nil
    Server = {s1, s2, s3}
    Follower = Follower
    Candidate = Candidate
    Leader = Leader
    RequestVoteRequest = RequestVoteRequest
    RequestVoteResponse = RequestVoteResponse
    AppendEntriesRequest = AppendEntriesRequest
    AppendEntriesResponse = AppendEntriesResponse
    HeartbeatRequest = HeartbeatRequest
    HeartbeatResponse = HeartbeatResponse

    \* Tight bounds for Family 3
    MaxTermLimit = 4
    MaxTimeoutLimit = 4
    RequestLimit = 2
    CrashLimit = 1
    LoseLimit = 2
    HeartbeatLimit = 2
    LeaseExpiryLimit = 1
    SnapshotLimit = 2        \* Key: need snapshots
    PreVoteLimit = 3
    MaxMsgBufferLimit = 10

Timeout         <- MCTimeout
BlindFollowerTimeout <- MCBlindFollowerTimeout
SendPreVote     <- MCSendPreVote
ClientRequest   <- MCClientRequest
Crash           <- MCCrash
LoseMessage     <- MCLoseMessage
SendHeartbeat   <- MCSendHeartbeat
ExpireLease     <- MCExpireLease
StartSnapshot   <- MCStartSnapshot

SPECIFICATION MCSpec

SYMMETRY ModelSymmetry

CONSTRAINT MessageBufferConstraint

VIEW MCView

INVARIANTS
    MCElectionSafety
    MCLogMatching
    MCLeaderCompleteness
