\* MC_hunt_family2.cfg — Hunt for Leader Lease / Blind Follower bugs (Family 2)
\*
\* Target: Blind follower starts election while old leader's lease is still valid.
\* Invariant: NoStaleLeaseRead — if leader's lease valid, no other leader exists.
\*
\* Strategy: Enable lease expiry and blind follower timeout, minimize crash/snapshot.
\* Key scenario: leader has valid lease, node restarts as blind follower,
\* immediately starts election without waiting for timeout, wins, creates
\* second leader while old leader's lease is still valid.

CONSTANTS
    Nil = Nil
    Server = {s1, s2, s3}
    Follower = Follower
    Candidate = Candidate
    Leader = Leader
    RequestVoteRequest = RequestVoteRequest
    RequestVoteResponse = RequestVoteResponse
    AppendEntriesRequest = AppendEntriesRequest
    AppendEntriesResponse = AppendEntriesResponse
    HeartbeatRequest = HeartbeatRequest
    HeartbeatResponse = HeartbeatResponse

    \* Tight bounds for Family 2
    MaxTermLimit = 4
    MaxTimeoutLimit = 5
    RequestLimit = 2
    CrashLimit = 1           \* Need restart to get blind follower
    LoseLimit = 2
    HeartbeatLimit = 4       \* Need heartbeats for lease refresh
    LeaseExpiryLimit = 2     \* Key: lease can expire
    SnapshotLimit = 0        \* Not needed
    PreVoteLimit = 4
    MaxMsgBufferLimit = 10

Timeout         <- MCTimeout
BlindFollowerTimeout <- MCBlindFollowerTimeout
SendPreVote     <- MCSendPreVote
ClientRequest   <- MCClientRequest
Crash           <- MCCrash
LoseMessage     <- MCLoseMessage
SendHeartbeat   <- MCSendHeartbeat
ExpireLease     <- MCExpireLease
StartSnapshot   <- MCStartSnapshot

SPECIFICATION MCSpec

SYMMETRY ModelSymmetry

CONSTRAINT MessageBufferConstraint

VIEW MCView

INVARIANTS
    MCElectionSafety
    MCNoStaleLeaseRead
