\* MC_hunt_family4.cfg — Hunt for Log Replication Desynchronization (Family 4)
\*
\* Target: Heartbeat-only period → follower commit lags; Host ABA from term cycling.
\* Invariant: LogMatching + LeaderCompleteness
\*
\* Strategy: Enable heartbeats (which don't advance follower commit), minimize crash/snapshot.
\* Key scenarios:
\*   1. Leader sends only heartbeats → follower commitIndex never advances
\*   2. Leader loses/regains leadership → old Host response processed in new term

CONSTANTS
    Nil = Nil
    Server = {s1, s2, s3}
    Follower = Follower
    Candidate = Candidate
    Leader = Leader
    RequestVoteRequest = RequestVoteRequest
    RequestVoteResponse = RequestVoteResponse
    AppendEntriesRequest = AppendEntriesRequest
    AppendEntriesResponse = AppendEntriesResponse
    HeartbeatRequest = HeartbeatRequest
    HeartbeatResponse = HeartbeatResponse

    \* Tight bounds for Family 4
    MaxTermLimit = 4
    MaxTimeoutLimit = 4
    RequestLimit = 3         \* Need log entries for commit advancement
    CrashLimit = 0
    LoseLimit = 3            \* Lose AppendEntries to force heartbeat-only
    HeartbeatLimit = 6       \* Key: many heartbeats to show commit lag
    LeaseExpiryLimit = 1
    SnapshotLimit = 0
    PreVoteLimit = 3
    MaxMsgBufferLimit = 12

Timeout         <- MCTimeout
BlindFollowerTimeout <- MCBlindFollowerTimeout
SendPreVote     <- MCSendPreVote
ClientRequest   <- MCClientRequest
Crash           <- MCCrash
LoseMessage     <- MCLoseMessage
SendHeartbeat   <- MCSendHeartbeat
ExpireLease     <- MCExpireLease
StartSnapshot   <- MCStartSnapshot

SPECIFICATION MCSpec

SYMMETRY ModelSymmetry

CONSTRAINT MessageBufferConstraint

VIEW MCView

INVARIANTS
    MCElectionSafety
    MCLogMatching
    MCLeaderCompleteness
