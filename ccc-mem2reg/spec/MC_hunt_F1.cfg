\* MC_hunt_F1.cfg — bug-hunt for Family F1 (alloca eligibility / escape).
\*
\* Fixture (from MC.tla):
\*   - 2-block linear function with 2 allocas a1 and a2
\*   - a1 is escaped via STORE_VAL; a2 is purely STORE_PTR + LOAD
\*   - Filter must disqualify a1, promote only a2
\* Invariant: AddressTakenNeverPromoted (a1 must NOT be in promoted at DONE).

SPECIFICATION MCSpec_F1

CONSTANTS
    Blocks         <- F1Blocks
    Entry          <- DefaultEntry
    Allocas        <- F1Allocas
    AllocaInfo     <- F1AllocaInfo
    UseSites       <- F1UseSites
    TermKind       <- F1TermKind
    TermTargets    <- F1TermTargets
    MaxPhiCopyCost <- MCMaxPhiCopyCost
    MaxIdomIters   <- MCMaxIdomIters
    MaxRenameDepth <- MCMaxRenameDepth
    MaxSynId       <- MCMaxSynId

CONSTRAINT StateConstraint
CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    AddressTakenNeverPromoted
