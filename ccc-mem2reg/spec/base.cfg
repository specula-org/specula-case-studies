\* base.cfg — minimal config for syntax / convergence smoke-test of base.tla.
\* Real model checking happens via MC.cfg (constants set inside MC.tla).

CONSTANTS
    Blocks         = {b0, b1, b2, b3}
    Entry          = b0
    Allocas        = {}
    AllocaInfo     = <<>>
    UseSites       = <<>>
    TermKind       = <<>>
    TermTargets    = <<>>
    MaxPhiCopyCost = 100
    MaxIdomIters   = 5
    MaxRenameDepth = 6

SPECIFICATION Spec

INVARIANTS
    TypeOK
    DisqualifiedSubsetOfCandidates
    DefUseBlocksWellFormed
    \* Bug-family invariants are exercised in MC_hunt_*.cfg.
    \* AddressTakenNeverPromoted
    \* ParamAllocaRetained
    \* PhiIncomingMatchesPreds
    \* NoOverlappingAsmGotoTargets
    \* CostCapBounded
    \* PhiCopiesOnEveryEdge
    \* IdomTerminates
