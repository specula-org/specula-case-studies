\* MC_hunt_default_combined.cfg — run all Default-fixture invariants
\* together. Equivalent to running F2 + F3 + F5 sequentially, but lets
\* TLC enumerate the state space once.

SPECIFICATION MCSpec_Default

CONSTANTS
    Blocks         <- DefaultBlocks
    Entry          <- DefaultEntry
    Allocas        <- DefaultAllocas
    AllocaInfo     <- DefaultAllocaInfo
    UseSites       <- DefaultUseSites
    TermKind       <- DefaultTermKind
    TermTargets    <- DefaultTermTargets
    MaxPhiCopyCost <- MCMaxPhiCopyCost
    MaxIdomIters   <- MCMaxIdomIters
    MaxRenameDepth <- MCMaxRenameDepth
    MaxSynId       <- MCMaxSynId

CONSTRAINT StateConstraint
CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    AddressTakenNeverPromoted
    ParamAllocaRetained
    PhiIncomingMatchesPreds
    CostCapBounded
    IdomTerminates
