\* MC.cfg — convergence config for base spec via MC.tla fixture.
\* Bug-family invariants are commented out; enable in MC_hunt_*.cfg.

SPECIFICATION MCSpec

CONSTANTS
    Blocks         <- DefaultBlocks
    Entry          <- DefaultEntry
    Allocas        <- DefaultAllocas
    AllocaInfo     <- DefaultAllocaInfo
    UseSites       <- DefaultUseSites
    TermKind       <- DefaultTermKind
    TermTargets    <- DefaultTermTargets
    MaxPhiCopyCost <- MCMaxPhiCopyCost
    MaxIdomIters   <- MCMaxIdomIters
    MaxRenameDepth <- MCMaxRenameDepth
    MaxSynId       <- MCMaxSynId

CONSTRAINT StateConstraint

\* Sequential algorithm — DONE is a natural fixpoint (no further steps).
\* TLC would otherwise flag DONE as a deadlock.
CHECK_DEADLOCK FALSE

\* ========================================================================
\* Standard / structural invariants (always-on)
\* ========================================================================
INVARIANTS
    TypeOK
    DisqualifiedSubsetOfCandidates
    DefUseBlocksWellFormed
    IdomTerminates

\* ========================================================================
\* Bug-family extension invariants — enabled in MC_hunt_*.cfg
\* ========================================================================
\* INVARIANT AddressTakenNeverPromoted   \* F1
\* INVARIANT ParamAllocaRetained         \* F2
\* INVARIANT PhiIncomingMatchesPreds     \* F3
\* INVARIANT NoOverlappingAsmGotoTargets \* F4 / D3
\* INVARIANT CostCapBounded              \* F5
\* INVARIANT PhiCopiesOnEveryEdge        \* F6 / D2

\* ========================================================================
\* Liveness
\* ========================================================================
\* PROPERTY EventuallyDone
