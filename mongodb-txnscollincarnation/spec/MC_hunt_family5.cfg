\* MC_hunt_family5.cfg — Bug Family 5: Commit Protocol Without Placement Validation
\* Target: CommitSafeAfterStatements
\* Mechanism: DDL between last statement OK and commit is undetected



CONSTANTS
    Shards = {s1, s2}
    NameSpaces = {ns1, ns2}
    Keys = {k1, k2}
    Txns = {t1}
    TXN_STMTS = 2

    \* Tight bounds: maximize DDL between last stmt and commit
    MaxDDLFailoverLimit = 0
    MaxStaleRetryLimit = 0
    MaxDDLCreateLimit = 3
    MaxDDLDropLimit = 2
    MaxDDLRenameLimit = 1
    MaxDDLMoveLimit = 1
    MaxAnnotateDBLimit = 0

INIT MCInit

NEXT MCNext

SYMMETRY ModelSymmetry

CONSTRAINT MCStateConstraint

\* Core safety + target invariant
INVARIANTS
    CommittedTxnImpliesAllStmtsSuccessful
    CommitSafeAfterStatements
    CommittedTxnConsistentKeySet
