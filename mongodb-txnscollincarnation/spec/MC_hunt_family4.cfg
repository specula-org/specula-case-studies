\* MC_hunt_family4.cfg — Bug Family 4: Stale Error Retry and placementConflictTime Reset
\* Target: PlacementConflictTimeMonotonicity, CommittedTxnConsistentKeySet
\* Mechanism: Reset placementConflictTime on retry captures time before DDL gossip arrives



CONSTANTS
    Shards = {s1, s2}
    NameSpaces = {ns1, ns2}
    Keys = {k1, k2}
    Txns = {t1}
    TXN_STMTS = 2

    \* Tight bounds: maximize stale retry + DDL interleaving
    MaxDDLFailoverLimit = 0
    MaxStaleRetryLimit = 2
    MaxDDLCreateLimit = 2
    MaxDDLDropLimit = 2
    MaxDDLRenameLimit = 0
    MaxDDLMoveLimit = 1
    MaxAnnotateDBLimit = 0

INIT MCInit

NEXT MCNext

SYMMETRY ModelSymmetry

CONSTRAINT MCStateConstraint

\* Core safety + target invariants
INVARIANTS
    CommittedTxnImpliesAllStmtsSuccessful
    CommittedTxnConsistentKeySet
    PlacementConflictTimeMonotonicity
