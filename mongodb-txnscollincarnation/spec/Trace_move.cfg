\* Trace_move.cfg — Trace validation for move_primary_txn.ndjson
\* The move_primary trace uses a different namespace (test2.coll2) and
\* the movePrimary destination is shard0000 (while initial primary is shard0001).

CONSTANTS
    Shards = {"shard0000", "shard0001"}
    NameSpaces = {"test2.coll2"}
    Keys = {"k1", "k2"}
    Txns = {"txn0"}
    TXN_STMTS = 2

INIT TraceInit

NEXT TraceNext

INVARIANTS
    CommittedTxnImpliesAllStmtsSuccessful
    CommittedTxnImpliesConsistentKeySet
    DDLPhaseTypeConsistency
