\* MC_hunt_family1.cfg — Bug Family 1: Multi-Phase DDL Non-Atomicity Under Failover
\* Target: DDLLockHeldDuringCommit, NoOrphanedCriticalSection
\* Mechanism: DDL failover between phases leaves locks released / CS orphaned



CONSTANTS
    Shards = {s1, s2}
    NameSpaces = {ns1, ns2}
    Keys = {k1, k2}
    Txns = {t1}
    TXN_STMTS = 2

    \* Tight bounds: maximize DDL + failover, minimize irrelevant actions
    MaxDDLFailoverLimit = 2
    MaxStaleRetryLimit = 0
    MaxDDLCreateLimit = 2
    MaxDDLDropLimit = 2
    MaxDDLRenameLimit = 1
    MaxDDLMoveLimit = 1
    MaxAnnotateDBLimit = 0

INIT MCInit

NEXT MCNext

SYMMETRY ModelSymmetry

CONSTRAINT MCStateConstraint

\* Core safety + target invariants
INVARIANTS
    CommittedTxnImpliesAllStmtsSuccessful
    CommittedTxnImpliesConsistentKeySet
    DDLLockHeldDuringCommit
    NoOrphanedCriticalSection
