\* MC_hunt_config.cfg — Bug Family 4: Configuration Change Safety
\* Targets: ElectionSafety under joint consensus
\* Focus: joint consensus + election interleavings, staging state

CONSTANTS
    Nil = Nil
    Follower = Follower
    Candidate = Candidate
    Leader = Leader
    PreVote = PreVote
    Election = Election
    SUCCESS = SUCCESS
    INCONSISTENCY = INCONSISTENCY
    NOT_LEADER = NOT_LEADER
    RequestVoteRequest = RequestVoteRequest
    RequestVoteResponse = RequestVoteResponse
    AppendEntriesRequest = AppendEntriesRequest
    AppendEntriesResponse = AppendEntriesResponse
    InstallSnapshotRequest = InstallSnapshotRequest
    InstallSnapshotResponse = InstallSnapshotResponse

    Server = {s1, s2, s3}
    Value = {v1}
    MaxTerm = 3
    MaxLogLength = 5

    \* Enable config changes, minimize other noise
    MaxTimeoutLimit = 4
    MaxPreVoteLimit = 0
    MaxRequestLimit = 1
    MaxCrashLimit = 1
    MaxLoseLimit = 2
    MaxHeartbeatLimit = 4
    MaxConfigChangeLimit = 2
    MaxReadLimit = 0
    MaxSnapshotLimit = 0
    MaxCheckLeadershipLimit = 1
    MaxExpireLeaseLimit = 0
    MaxExpireLeaderValidityLimit = 2
    MaxMsgBufferLimit = 10

SYMMETRY ModelSymmetry

VIEW MCView

SPECIFICATION MCSpec

CONSTRAINT MsgBufferConstraint

INVARIANT ElectionSafety
