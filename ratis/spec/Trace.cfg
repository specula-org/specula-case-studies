\* Trace.cfg — Trace validation config for Apache Ratis
\* Uses INIT/NEXT (not SPECIFICATION) for deadlock-based completion checking

CONSTANTS
    Nil = Nil
    Follower = Follower
    Candidate = Candidate
    Leader = Leader
    PreVote = PreVote
    Election = Election
    SUCCESS = SUCCESS
    INCONSISTENCY = INCONSISTENCY
    NOT_LEADER = NOT_LEADER
    RequestVoteRequest = RequestVoteRequest
    RequestVoteResponse = RequestVoteResponse
    AppendEntriesRequest = AppendEntriesRequest
    AppendEntriesResponse = AppendEntriesResponse
    InstallSnapshotRequest = InstallSnapshotRequest
    InstallSnapshotResponse = InstallSnapshotResponse

    \* Server derived from trace (string IDs, not model values)
    Value = {v1}
    MaxTerm = 10
    MaxLogLength = 20

CONSTANT
    Server <- TraceServer

INIT TraceInit
NEXT TraceNext

\* Deadlock means trace was consumed (or stuck) — check l value
\* PROPERTY TraceMatched

ALIAS TraceAlias

\* Standard invariants still checked during trace replay
INVARIANT ElectionSafety
INVARIANT TypeOK
INVARIANT NextIndexBound
