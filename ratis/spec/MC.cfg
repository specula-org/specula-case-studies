\* MC.cfg — Standard model checking config for Apache Ratis
\* Used for convergence testing (structural + standard safety invariants)
\* Bug-family extension invariants are COMMENTED OUT — enable in hunting configs

CONSTANTS
    \* Model values
    Nil = Nil
    Follower = Follower
    Candidate = Candidate
    Leader = Leader
    PreVote = PreVote
    Election = Election
    SUCCESS = SUCCESS
    INCONSISTENCY = INCONSISTENCY
    NOT_LEADER = NOT_LEADER
    RequestVoteRequest = RequestVoteRequest
    RequestVoteResponse = RequestVoteResponse
    AppendEntriesRequest = AppendEntriesRequest
    AppendEntriesResponse = AppendEntriesResponse
    InstallSnapshotRequest = InstallSnapshotRequest
    InstallSnapshotResponse = InstallSnapshotResponse

    \* Model parameters
    Server = {s1, s2, s3}
    Value = {v1}
    MaxTerm = 3
    MaxLogLength = 4

    \* Counter bounds
    MaxTimeoutLimit = 4
    MaxPreVoteLimit = 2
    MaxRequestLimit = 2
    MaxCrashLimit = 1
    MaxLoseLimit = 2
    MaxHeartbeatLimit = 4
    MaxConfigChangeLimit = 0
    MaxReadLimit = 0
    MaxSnapshotLimit = 0
    MaxCheckLeadershipLimit = 1
    MaxExpireLeaseLimit = 0
    MaxExpireLeaderValidityLimit = 2
    MaxMsgBufferLimit = 10

SYMMETRY ModelSymmetry

VIEW MCView

SPECIFICATION MCSpec

CONSTRAINT MsgBufferConstraint

\* --- Standard safety invariants ---
INVARIANT ElectionSafety
INVARIANT TypeOK

\* --- Structural invariants ---
INVARIANT NextIndexBound
INVARIANT SnapshotLogConsistency

\* --- Extension invariants (COMMENTED OUT for convergence) ---
\* INVARIANT CommitFlushBound
\* INVARIANT LeaseImpliesLeader
\* INVARIANT ReadLinearizability
\* INVARIANT LogMatching
