SPECIFICATION TraceSpec

\* Constants — override for specific traces
CONSTANT
    Range = {"R1", "R2", "R3"}
    Migration = {"M1", "M2"}
    Task = {1, 2, 3}
    Query = {"Q1", "Q2"}
    Nil = Nil
    Overlap = {}

\* Invariants checked during trace replay
INVARIANT TypeOK
INVARIANT NoOrphanedRangeDeletion
INVARIANT QueryNotAffected
INVARIANT DrainBeforeDonate
INVARIANT OverlapSerializationTotal
INVARIANT TaskDocConsistency
INVARIANT SingleExecuting
