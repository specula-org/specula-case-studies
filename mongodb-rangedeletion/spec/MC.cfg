SPECIFICATION MCSpec

\* --- Constants (operator overrides from MC.tla) ---
CONSTANT
    Range <- MCRange
    Migration <- MCMigration
    Task <- MCTask
    Query <- MCQuery
    Nil = Nil
    Overlap <- MCOverlap
    StepDownLimit = 2
    ClearMetadataLimit = 2
    RetryDeleteLimit = 0
    TickClockLimit = 3

CONSTRAINT ClockConstraint

\* --- Standard + Structural Invariants ---
INVARIANT TypeOK
INVARIANT SingleExecuting
INVARIANT ProcessorServiceConsistency
INVARIANT ExecutingTaskHasProcessingFlag

\* --- Standard Safety Invariants ---
INVARIANT NoOrphanedRangeDeletion
INVARIANT DrainBeforeDonate
INVARIANT OverlapSerializationTotal
INVARIANT ServiceStateConsistency
INVARIANT NoTaskDeadlock

\* --- Extension Invariants (bug-family, enable for hunting) ---
\* INVARIANT QueryNotAffected
\* INVARIANT TaskDocConsistency
\* INVARIANT ResumeInProgressFirst
