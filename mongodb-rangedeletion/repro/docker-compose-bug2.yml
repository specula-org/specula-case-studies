services:
  configsvr:
    image: mongo:latest
    container_name: bug2-configsvr
    hostname: configsvr
    command: mongod --configsvr --replSet configRS --port 27017 --bind_ip_all --setParameter enableTestCommands=1
    ports:
      - "37118:27017"
    networks:
      - bug2net

  shard0a:
    image: mongo:latest
    container_name: bug2-shard0a
    hostname: shard0a
    command: mongod --shardsvr --replSet shard0RS --port 27017 --bind_ip_all --setParameter enableTestCommands=1
    ports:
      - "37119:27017"
    networks:
      - bug2net

  shard0b:
    image: mongo:latest
    container_name: bug2-shard0b
    hostname: shard0b
    command: mongod --shardsvr --replSet shard0RS --port 27017 --bind_ip_all --setParameter enableTestCommands=1
    ports:
      - "37120:27017"
    networks:
      - bug2net

  shard1:
    image: mongo:latest
    container_name: bug2-shard1
    hostname: shard1
    command: mongod --shardsvr --replSet shard1RS --port 27017 --bind_ip_all --setParameter enableTestCommands=1
    ports:
      - "37121:27017"
    networks:
      - bug2net

  mongos:
    image: mongo:latest
    container_name: bug2-mongos
    hostname: mongos
    command: mongos --configdb configRS/configsvr:27017 --bind_ip_all --setParameter enableTestCommands=1
    ports:
      - "37117:27017"
    depends_on:
      - configsvr
    networks:
      - bug2net

networks:
  bug2net:
    driver: bridge
