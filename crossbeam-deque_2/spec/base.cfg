\* Base config for crossbeam-deque (Chase-Lev work-stealing deque).
\* Used for sanity checking the base spec without MC counter bounds.
\* For exhaustive bug hunting, use MC.tla / MC.cfg / MC_hunt_*.cfg.

CONSTANTS
    Stealer       = {s1, s2}
    MaxVal        = 3
    BufferCap     = 2
    MaxBatch      = 2
    MaxResize     = 1
    MaxBatchIters = 2

SPECIFICATION Spec

INVARIANTS
    \* Standard safety
    ConsumedWasPushed
    NoDoublePop
    NoGarbageSteal
    \* Structural
    PushedDistinct
    PushCountConsistency
    DequeConsistency
    CurrentBufferAlive
    StealerDomainOK
    BatchIterBounded
    WorkerExclusive
    \* Bug-family invariants are commented out at the base level — they are
    \* exercised by the per-family hunting configs.
    \* StealReturnsValid       \* Family A
    \* NoUseAfterFree          \* Family A / F3
    \* PreCASReadIsVisible     \* Family B
    \* NoLostPopUnderStrongCAS \* Family D
    \* NoElementLoss           \* aggregate
