\* MC_hunt_familyB.cfg
\* Bug Family B — Memory Ordering across the Worker/Stealer boundary.
\*
\* Two adversaries:
\*   - relaxBackStore: worker bumps `back` before slot write becomes visible
\*     (deque.rs:418-432, models a wrong relaxation of the Release ordering).
\*   - skipStealerFence: stealer omits its conditional SeqCst fence
\*     (deque.rs:650-652, MC-3 in the brief).
\*
\* Expected violation: NoGarbageSteal or PreCASReadIsVisible (stealer reads
\* an unpublished slot) under relaxBackStore; NoDoublePop under skipStealerFence
\* (stealer + worker LIFO last-task CAS race without total order).

CONSTANTS
    Stealer            = {s1, s2}
    MaxVal             = 3
    BufferCap          = 2
    MaxBatch           = 2
    MaxResize          = 0
    MaxBatchIters      = 1

    MaxResizeLimit            = 0
    MaxReclaimLimit           = 0
    MaxCloneLimit             = 1
    MaxWorkerDropLimit        = 0
    MaxRelaxBackLimit         = 1
    MaxSkipFenceLimit         = 1
    MaxPublishLimit           = 3
    MaxWeakCASLimit           = 0
    MaxPrematureReclaimLimit  = 0
    MaxSkipRecheckLimit       = 0

SPECIFICATION MCSpec

CONSTRAINT MCStateConstraint
SYMMETRY   MCSymmetry
VIEW       MCView

INVARIANTS
    ConsumedWasPushed
    NoDoublePop
    NoGarbageSteal
    PreCASReadIsVisible
    DequeConsistency
    NoElementLoss
