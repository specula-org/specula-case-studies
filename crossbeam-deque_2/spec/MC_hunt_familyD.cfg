\* MC_hunt_familyD.cfg
\* Bug Family D — CAS_weak Spurious Failure.
\*
\* The worker LIFO last-task CAS at deque.rs:518 is strong by design.
\* This config injects a "what if it were weak" adversary (weakLIFOLastCAS):
\* spurious-fail branch in LIFOPopDecide drops the popped task. We expect
\* the model to demonstrate the resulting `NoElementLoss` violation,
\* confirming why the strong CAS is load-bearing.
\*
\* Note: the Injector weak-CAS sites (deque.rs:1415, 1506, 1658, 1861) are
\* out of scope for this base spec (Injector not modeled). When the Injector
\* model is added, parallel hunting configs should be added.

CONSTANTS
    Stealer            = {s1, s2}
    MaxVal             = 3
    BufferCap          = 2
    MaxBatch           = 1
    MaxResize          = 0
    MaxBatchIters      = 1

    MaxResizeLimit            = 0
    MaxReclaimLimit           = 0
    MaxCloneLimit             = 1
    MaxWorkerDropLimit        = 0
    MaxRelaxBackLimit         = 0
    MaxSkipFenceLimit         = 0
    MaxPublishLimit           = 1
    MaxWeakCASLimit           = 1
    MaxPrematureReclaimLimit  = 0
    MaxSkipRecheckLimit       = 0

\* The fault flag `weakLIFOLastCAS` is toggled at runtime by the
\* MCEnableWeakLIFOLastCAS adversary action (counter-bounded by
\* MaxWeakCASLimit = 1). Once set, the LIFO last-task CAS may take its
\* spurious-fail branch.

SPECIFICATION MCSpec

CONSTRAINT MCStateConstraint
SYMMETRY   MCSymmetry
VIEW       MCView

INVARIANTS
    ConsumedWasPushed
    NoDoublePop
    NoGarbageSteal
    NoLostPopUnderStrongCAS
    NoElementLoss
    DequeConsistency
