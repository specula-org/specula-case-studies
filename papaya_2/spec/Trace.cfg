CONSTANTS
    NULL = NULL
    COPYING = COPYING
    COPIED = COPIED
    BORROWED = BORROWED
    PENDING = PENDING
    ABORTED = ABORTED
    PROMOTED = PROMOTED
    META_EMPTY = META_EMPTY
    META_TOMBSTONE = META_TOMBSTONE
    MaxTables = 3
    Thread = {"t1", "t2", "t3", "t4"}
    Key = {"k1", "k2"}
    Value = {"v1", "v2"}
    Slot = {0, 1, 2, 3, 4, 5, 6, 7}

SPECIFICATION TraceSpec

\* Completion property — ensures every trace event was matched
PROPERTIES TraceMatched

\* Safety invariants (should hold on every real execution)
INVARIANTS
    NoDuplicateEntry
    ProbeChainIntegrity
    PromotionSafety

\* Structural invariants
INVARIANTS
    ResizeStatusConsistency
    CopiedCountBound
    MetaConsistency
    TagConsistency
    InsertWindowConsistency

\* Bug-family invariants are intentionally NOT included here:
\*   - NoParkedOnAborted, NoStaleMetaOnEmptySlot, IterNoDoubleYield,
\*     IterWeakSnapshot, NoUseAfterReclaim
\* These can be violated by correct executions when the bug is real;
\* they belong in MC_hunt_<family>.cfg, not in trace validation.
