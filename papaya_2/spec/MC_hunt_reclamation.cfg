\* Hunting config for Family 4: Epoch-Based Reclamation Safety (MC-5)
\*
\* Mechanism: a retired entry must not still be reachable when reclaimed.
\* The deferred-retire walk (raw/mod.rs:2884-2938) pushes onto a previous table's
\* deferred stack; if chain monotonicity is violated, an entry can be reclaimed
\* while still reachable.

CONSTANTS
    NULL = NULL
    COPYING = COPYING
    COPIED = COPIED
    BORROWED = BORROWED
    PENDING = PENDING
    ABORTED = ABORTED
    PROMOTED = PROMOTED
    META_EMPTY = META_EMPTY
    META_TOMBSTONE = META_TOMBSTONE
    Thread = {t1, t2}
    Key = {k1, k2}
    Value = {v1}
    Slot = {0, 1}
    MaxTables = 3
    InsertLimit = 2
    RemoveLimit = 2
    ResizeLimit = 1
    AbortLimit = 0
    EpochLimit = 2
    ParkLimit = 0
    IterLimit = 0
    FixupLimit = 0

SPECIFICATION MCSpec

SYMMETRY ModelSymmetry

CONSTRAINT StateConstraint

INVARIANT NoUseAfterReclaim
INVARIANT NoDuplicateEntry
