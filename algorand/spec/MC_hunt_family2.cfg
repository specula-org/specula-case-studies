\* Bug Family 2: Period 0->P>0 Carryover & Reproposal Guard Asymmetry (HIGH)
\* Brief §2 mechanism: reproposer-guard exists on softVote path (player.go:196-202)
\* but NOT on cert/next/fast paths. Combined with stale nextThresholdCache
\* populated independently (voteAuxiliary.go:71-77).
\* MC-2 finding (Brief §6.1): fast-forward via softThreshold with Cached.Bottom=false
\* AND Cached.Proposal=bottom. Subsequent issueSoftVote may vote without guard.
\* MC-5: lastConcluding/voteStepFresh after enterPeriod can accept cross-period votes.
\* MC-6: certThreshold(R,p) drives enterRound, but freshestBundleRequest may
\* trigger enterPeriod in the new round.

