\* Bug Family 3: Dynamic Filter Timeout — Cross-Round Divergence (MEDIUM)
\* Brief §2 mechanism: per-node dynamic filter timeout derived from 40-sample
\* history; not persisted; reset on enterPeriod(target /= 0). Two nodes can
\* compute different timeouts.
\* No safety violation expected. Family 3 is a LIVENESS-degradation surface.
\* The hunt cfg targets FilterTimeoutWithinBounds (structural) + tests that
\* CalculateFilterTimeoutShort/Default both reachable.

SPECIFICATION MCSpec

CONSTANTS
    Server = {n1, n2, n3}
    ByzServer = {}
    MaxRound = 1
    MaxPeriod = 1
    MaxStep = 4
    Values = {v1}
    Bottom = Bottom
    Nil = Nil

    StepPropose = 0
    StepSoft = 1
    StepCert = 2
    StepNext = 3
    StepLate = 253
    StepRedo = 254
    StepDown = 255

    PartitionStepNum = 6

    SoftThresholdT = "soft"
    CertThresholdT = "cert"
    NextThresholdT = "next"
    NoneThresholdT = "none"

    ProposalMsg = "ProposalMsg"
    VoteMsg = "VoteMsg"
    BundleMsg = "BundleMsg"

    FT_Short = "FT_Short"
    FT_Default = "FT_Default"

    \* Tight bounds: only crash (history reset) and message loss matter.
    MaxByzVoteLimit = 0
    MaxCatchupLimit = 0
    MaxCrashLimit = 2
    MaxLoseLimit = 1
    MaxForkViewLimit = 0
    MaxFastPrimerLimit = 0
    MaxMsgBufferLimit = 8

SYMMETRY Symmetry
VIEW ModelView
CONSTRAINT MsgBufferConstraint

INVARIANTS
    FilterTimeoutWithinBounds
    MCTypeOK

PROPERTIES
    \* Liveness check: per-server filter timeout cannot be stuck in any
    \* particular bucket forever — at least both buckets are reachable.
    \* (Convergence under fairness is checked by EventuallyConverge in base.)
    \* For this hunt we only check structural invariants.
