\* Bug Family 5: VRF Seed Lookback Forks (LOW safety / MEDIUM liveness)
\* Brief §2 mechanism: sortition uses Seed(R-2). Fork at R-2 produces different
\* seed -> different committee. Local ledger view drives sortition.
\* MC-4 finding (Brief §6.1): two honest servers' committees computed against
\* different ledgerView[R-2] snapshots. Can BOTH branches independently
\* produce cert thresholds for different values?

