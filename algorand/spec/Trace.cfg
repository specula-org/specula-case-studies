SPECIFICATION TraceSpec

CONSTANTS
    \* Single Trace.cfg targets the smallest scenario (short_run, 3 keys).
    \* Larger scenarios are validated via Trace_diverse.cfg / Trace_normal.cfg /
    \* Trace_committee.cfg because the committee == Server abstraction means
    \* a bigger Server raises the threshold beyond what the trace's
    \* per-key vote count can satisfy.
    Server = {"n1", "n2", "n3", "local"}
    ByzServer = {}
    MaxRound = 4
    MaxPeriod = 1
    MaxStep = 4
    Values = {"v1"}
    Bottom = "Bottom"
    Nil = "Nil"

    StepPropose = 0
    StepSoft = 1
    StepCert = 2
    StepNext = 3
    StepLate = 253
    StepRedo = 254
    StepDown = 255

    PartitionStepNum = 6

    SoftThresholdT = "soft"
    CertThresholdT = "cert"
    NextThresholdT = "next"
    NoneThresholdT = "none"

    ProposalMsg = "ProposalMsg"
    VoteMsg = "VoteMsg"
    BundleMsg = "BundleMsg"

    FT_Short = "FT_Short"
    FT_Default = "FT_Default"

VIEW TraceView

ALIAS TraceAlias

INVARIANTS
    \* Safety invariants that should hold on every real execution.
    \* Per the spec-generation skill, exclude fault-injection invariants and
    \* liveness/temporal properties from trace validation cfgs.
    AgreementSafety
    LedgerConsistency
    StagingMatchesFreshest
    ReproposalGuardEnforced
    \* PersistedBeforeBroadcast is OMITTED from trace validation because the
    \* implementation runs a single-pseudonode-with-N-keys setup: only "local"
    \* persists state, but the per-key BroadcastVote events have sender n1..nN.
    \* The invariant naturally fails here even though the protocol contract
    \* holds (local persists before any key broadcasts). Re-enabled in MC.cfg.
    \* Structural invariants — sanity checks on spec wiring.
    RoundBound
    PeriodBound
    PersistedNotAhead
    CommitteeViewSubset
    LedgerSourceValid

PROPERTIES
    TraceMatched
