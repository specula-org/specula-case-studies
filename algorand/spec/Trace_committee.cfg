SPECIFICATION TraceSpec

CONSTANTS
    \* larger_committee.ndjson uses 10 participation keys.
    Server = {"n1", "n2", "n3", "n4", "n5", "n6", "n7", "n8", "n9", "n10", "local"}
    ByzServer = {}
    MaxRound = 5
    MaxPeriod = 1
    MaxStep = 4
    Values = {"v1"}
    Bottom = "Bottom"
    Nil = "Nil"

    StepPropose = 0
    StepSoft = 1
    StepCert = 2
    StepNext = 3
    StepLate = 253
    StepRedo = 254
    StepDown = 255

    PartitionStepNum = 6

    SoftThresholdT = "soft"
    CertThresholdT = "cert"
    NextThresholdT = "next"
    NoneThresholdT = "none"

    ProposalMsg = "ProposalMsg"
    VoteMsg = "VoteMsg"
    BundleMsg = "BundleMsg"

    FT_Short = "FT_Short"
    FT_Default = "FT_Default"

VIEW TraceView
ALIAS TraceAlias

INVARIANTS
    AgreementSafety
    LedgerConsistency
    StagingMatchesFreshest
    ReproposalGuardEnforced
    RoundBound
    PeriodBound
    PersistedNotAhead
    CommitteeViewSubset
    LedgerSourceValid

PROPERTIES
    TraceMatched
