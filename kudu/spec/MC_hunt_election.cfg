\* Hunting config for Bug Family 3: Election / Leader Stability
\* Targets: ElectionSafety with vote withholding + pre-election
\* Mechanism: partitioned node inflates term, pre-election race conditions
\* Reference: KUDU-562, KUDU-2947, KUDU-2149

SPECIFICATION MCSpec

CONSTANTS
    s1 = s1
    s2 = s2
    s3 = s3

    Server = {s1, s2, s3}

    \* Tight bounds: focus on elections, step-downs, and vote withholding
    MaxTermLimit        = 5
    MaxTimeoutLimit     = 6
    RequestLimit        = 1
    HeartbeatLimit      = 0
    LoseLimit           = 3
    StepDownLimit       = 2
    PreVoteLimit        = 4
    ConfigChangeLimit   = 0
    ExpireWithholdLimit = 5
    MaxMsgBufferLimit   = 10

    Timeout             <- MCTimeout
    PreVote             <- MCPreVote
    ClientRequest       <- MCClientRequest
    LoseMessage         <- MCLoseMessage
    StepDown            <- MCStepDown
    ProposeConfigChange <- MCProposeConfigChange
    ExpireWithholdVotes <- MCExpireWithholdVotes

    Nil = Nil
    Follower    = Follower
    Candidate   = Candidate
    Leader      = Leader
    ValueEntry  = ValueEntry
    ConfigEntry = ConfigEntry
    NoOpEntry   = NoOpEntry
    RequestVoteRequest      = RequestVoteRequest
    RequestVoteResponse     = RequestVoteResponse
    AppendEntriesRequest    = AppendEntriesRequest
    AppendEntriesResponse   = AppendEntriesResponse

SYMMETRY Symmetry

CHECK_DEADLOCK FALSE

CONSTRAINT MsgBufferConstraint

\* Target invariants + core safety
INVARIANTS
    ElectionSafety
    LogMatching
    LeaderCompleteness
