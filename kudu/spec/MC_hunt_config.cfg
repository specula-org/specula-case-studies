\* Hunting config for Bug Family 2: Configuration Change Safety
\* Targets: SinglePendingConfig, ConfigChangeRequiresCommit, VoterOnlyQuorum
\* Mechanism: config change + election interleaving, pending config not cleared
\* Reference: KUDU-872, KUDU-1338, KUDU-3082

SPECIFICATION MCSpecDynamic

CONSTANTS
    s1 = s1
    s2 = s2
    s3 = s3

    Server = {s1, s2, s3}

    \* Tight bounds: focus on config changes and elections
    MaxTermLimit        = 4
    MaxTimeoutLimit     = 4
    RequestLimit        = 2
    HeartbeatLimit      = 0
    LoseLimit           = 2
    StepDownLimit       = 1
    PreVoteLimit        = 0
    ConfigChangeLimit   = 3
    ExpireWithholdLimit = 3
    MaxMsgBufferLimit   = 10

    Timeout             <- MCTimeout
    PreVote             <- MCPreVote
    ClientRequest       <- MCClientRequest
    LoseMessage         <- MCLoseMessage
    StepDown            <- MCStepDown
    ProposeConfigChange <- MCProposeConfigChange
    ExpireWithholdVotes <- MCExpireWithholdVotes

    Nil = Nil
    Follower    = Follower
    Candidate   = Candidate
    Leader      = Leader
    ValueEntry  = ValueEntry
    ConfigEntry = ConfigEntry
    NoOpEntry   = NoOpEntry
    RequestVoteRequest      = RequestVoteRequest
    RequestVoteResponse     = RequestVoteResponse
    AppendEntriesRequest    = AppendEntriesRequest
    AppendEntriesResponse   = AppendEntriesResponse

SYMMETRY Symmetry

CHECK_DEADLOCK FALSE

CONSTRAINT MsgBufferConstraint

\* Target invariants + core safety
INVARIANTS
    ElectionSafety
    LogMatching
    SinglePendingConfig
    ConfigChangeRequiresCommit
    VoterOnlyQuorum
    LeaderNOOPBeforeConfigChange
