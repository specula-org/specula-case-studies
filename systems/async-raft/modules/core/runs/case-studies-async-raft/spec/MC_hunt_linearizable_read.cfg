\* MC_hunt_linearizable_read.cfg — Bug Family 6: Read after deposition
\* Target: LinearizableRead invariant
\* Strategy: Elections + reads + message loss to cause leader change during read

SPECIFICATION MCSpec

CONSTANTS
    s1 = s1
    s2 = s2
    s3 = s3

    Server = {s1, s2, s3}

    MaxTermLimit        = 4
    MaxTimeoutLimit     = 4
    RequestLimit        = 1
    CrashLimit          = 0
    LoseLimit           = 3
    HeartbeatLimit      = 4
    SnapshotLimit       = 0
    ReadRequestLimit    = 3
    ConfigChangeLimit   = 0
    MaxMsgBufferLimit   = 10

    Timeout             <- MCTimeout
    ClientRequest       <- MCClientRequest
    Crash               <- MCCrash
    LoseMessage         <- MCLoseMessage
    SendHeartbeat       <- MCSendHeartbeat
    SendInstallSnapshot <- MCSendInstallSnapshot
    ClientReadRequest   <- MCClientReadRequest

    Nil = Nil
    Follower    = Follower
    Candidate   = Candidate
    Leader      = Leader
    ValueEntry  = ValueEntry
    ConfigEntry = ConfigEntry
    RequestVoteRequest      = RequestVoteRequest
    RequestVoteResponse     = RequestVoteResponse
    AppendEntriesRequest    = AppendEntriesRequest
    AppendEntriesResponse   = AppendEntriesResponse
    InstallSnapshotRequest  = InstallSnapshotRequest
    InstallSnapshotResponse = InstallSnapshotResponse

SYMMETRY Symmetry

CHECK_DEADLOCK
    FALSE

CONSTRAINT
    MsgBufferConstraint

INVARIANTS
    ElectionSafety
    LinearizableRead
