\* MC_hunt_quorum.cfg — Bug Family 1: Buggy quorum formula for reads
\* Target: QuorumConfirmation invariant
\* Strategy: Minimal election + reads, no crashes/snapshots/config changes

SPECIFICATION MCSpec

CONSTANTS
    s1 = s1
    s2 = s2
    s3 = s3

    Server = {s1, s2, s3}

    MaxTermLimit        = 3
    MaxTimeoutLimit     = 3
    RequestLimit        = 1
    CrashLimit          = 0
    LoseLimit           = 0
    HeartbeatLimit      = 4
    SnapshotLimit       = 0
    ReadRequestLimit    = 3
    ConfigChangeLimit   = 0
    MaxMsgBufferLimit   = 8

    Timeout             <- MCTimeout
    ClientRequest       <- MCClientRequest
    Crash               <- MCCrash
    LoseMessage         <- MCLoseMessage
    SendHeartbeat       <- MCSendHeartbeat
    SendInstallSnapshot <- MCSendInstallSnapshot
    ClientReadRequest   <- MCClientReadRequest

    Nil = Nil
    Follower    = Follower
    Candidate   = Candidate
    Leader      = Leader
    ValueEntry  = ValueEntry
    ConfigEntry = ConfigEntry
    RequestVoteRequest      = RequestVoteRequest
    RequestVoteResponse     = RequestVoteResponse
    AppendEntriesRequest    = AppendEntriesRequest
    AppendEntriesResponse   = AppendEntriesResponse
    InstallSnapshotRequest  = InstallSnapshotRequest
    InstallSnapshotResponse = InstallSnapshotResponse

SYMMETRY Symmetry

CHECK_DEADLOCK
    FALSE

CONSTRAINT
    MsgBufferConstraint

INVARIANTS
    ElectionSafety
    QuorumConfirmation
