SPECIFICATION MCSpec

CONSTANTS
    MaxRun = 2
    MaxClusterGen = 0
    MaxNoiseEpoch = 2
    MaxQueueLen = 2
    MaxRetries = 0
    MaxResultVersion = 4
    RequestIds = {req1, req2}
    NoRequest = NoRequest

    MaxRunStartLimit = 2
    MaxSubmissionLimit = 2
    MaxDuplicateLimit = 0
    MaxRetryLimit = 0
    MaxTimeoutLimit = 0
    MaxExitLimit = 0
    MaxBaselineFailureLimit = 0
    MaxMutationLimit = 0
    MaxMitigationLimit = 1
    MaxCrashLimit = 0
    MaxClusterReplaceLimit = 0
    MaxNoiseApplyLimit = 1
    MaxJoinTimeoutLimit = 1
    MaxPodRestartLimit = 1
    MaxMessageBufferLimit = 3

    StartProblem <- MCStartProblem
    SendSubmission <- MCSendSubmission
    DelayOrDuplicate <- MCDelayOrDuplicate
    RetrySubmission <- MCRetrySubmission
    AgentTimeout <- MCAgentTimeout
    AgentExit <- MCAgentExit
    AgentExitWaitTimeout <- MCAgentExitWaitTimeout
    ObserveBaseline <- MCObserveBaseline
    AgentMutate <- MCAgentMutate
    AgentMitigate <- MCAgentMitigate
    Crash <- MCCrash
    ReplaceCluster <- MCReplaceCluster
    BeginNoiseApply <- MCBeginNoiseApply
    NoiseManagerJoinTimeout <- MCNoiseManagerJoinTimeout
    RestartPod <- MCRestartPod

SYMMETRY Symmetry
VIEW ModelView
CONSTRAINT MessageBufferConstraint

INVARIANTS
    \* Core safety plus only Scenario 4 targets
    ReferenceStageOrder
    NoOverlappingRuns
    FaultBeforeDiagnosis
    NoiseQuiescentAtEvaluation
    OraclePassImpliesMitigated
