SPECIFICATION MCSpec

CONSTANTS
    MaxRun = 1
    MaxClusterGen = 0
    MaxNoiseEpoch = 1
    MaxQueueLen = 2
    MaxRetries = 0
    MaxResultVersion = 4
    RequestIds = {req1}
    NoRequest = NoRequest

    MaxRunStartLimit = 1
    MaxSubmissionLimit = 1
    MaxDuplicateLimit = 0
    MaxRetryLimit = 0
    MaxTimeoutLimit = 1
    MaxExitLimit = 1
    MaxBaselineFailureLimit = 0
    MaxMutationLimit = 0
    MaxMitigationLimit = 0
    MaxCrashLimit = 0
    MaxClusterReplaceLimit = 0
    MaxNoiseApplyLimit = 0
    MaxJoinTimeoutLimit = 0
    MaxPodRestartLimit = 0
    MaxMessageBufferLimit = 2

    StartProblem <- MCStartProblem
    SendSubmission <- MCSendSubmission
    DelayOrDuplicate <- MCDelayOrDuplicate
    RetrySubmission <- MCRetrySubmission
    AgentTimeout <- MCAgentTimeout
    AgentExit <- MCAgentExit
    AgentExitWaitTimeout <- MCAgentExitWaitTimeout
    ObserveBaseline <- MCObserveBaseline
    AgentMutate <- MCAgentMutate
    AgentMitigate <- MCAgentMitigate
    Crash <- MCCrash
    ReplaceCluster <- MCReplaceCluster
    BeginNoiseApply <- MCBeginNoiseApply
    NoiseManagerJoinTimeout <- MCNoiseManagerJoinTimeout
    RestartPod <- MCRestartPod

SYMMETRY Symmetry
VIEW ModelView
CONSTRAINT MessageBufferConstraint

INVARIANTS
    \* Core/reference safety
    ReferenceStageOrder

    \* Scenario 1: evaluation/teardown completion fence
    DoneIsTerminal
    NoEvaluationDuringTeardown
    NoOverlappingRuns
    FaultBeforeDiagnosis
