SPECIFICATION TraceSpec

CONSTANTS
    MaxRun = 2
    MaxClusterGen = 1
    MaxNoiseEpoch = 4
    MaxQueueLen = 4
    MaxRetries = 60
    MaxResultVersion = 8
    RequestIds <- TraceRequestIds
    NoRequest = "__none__"

VIEW TraceView
ALIAS TraceAlias

INVARIANTS
    \* Trace/model structural agreement
    TraceTypeOK
    CurrentStageConsistent
    NoiseLoopCountConsistent
    NoiseSetsConsistent
    EvaluationMetadataConsistent
    CleanupMetadataConsistent
    AcceptanceAccounting

    \* Safety properties meaningful on implementation executions
    ReferenceStageOrder
    OneAcceptedPerStage
    SubmissionOriginMatches
    DoneIsTerminal
    NoEvaluationDuringTeardown
    NoOverlappingRuns
    FaultBeforeDiagnosis
    BaselineMatchesCluster
    PreexistingResourcesPreserved
    CleanupDeletesOnlyRunOwned
    NoiseQuiescentAtEvaluation
    OraclePassImpliesMitigated

PROPERTIES
    TraceMatched
