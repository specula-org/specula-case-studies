    RestartPod <- MCRestartPod

SYMMETRY Symmetry
VIEW ModelView
CONSTRAINT MessageBufferConstraint

INVARIANTS
    \* Core safety plus only Scenario 2 targets
    ReferenceStageOrder
    OneAcceptedPerStage
    SubmissionOriginMatches
