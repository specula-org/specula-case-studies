SPECIFICATION MCSpec

CONSTANTS
    MaxRun = 1
    MaxClusterGen = 1
    MaxNoiseEpoch = 2
    MaxQueueLen = 3
    MaxRetries = 1
    MaxResultVersion = 4
    RequestIds = {req1, req2}
    NoRequest = NoRequest

    \* Standard convergence bounds
    MaxRunStartLimit = 1
    MaxSubmissionLimit = 2
    MaxDuplicateLimit = 1
    MaxRetryLimit = 1
    MaxTimeoutLimit = 0
    MaxExitLimit = 0
    MaxBaselineFailureLimit = 0
    MaxMutationLimit = 0
    MaxMitigationLimit = 1
    MaxCrashLimit = 0
    MaxClusterReplaceLimit = 0
    MaxNoiseApplyLimit = 0
    MaxJoinTimeoutLimit = 0
    MaxPodRestartLimit = 0
    MaxMessageBufferLimit = 4

    \* Counter-bounded operator overrides.
    StartProblem <- MCStartProblem
    SendSubmission <- MCSendSubmission
    DelayOrDuplicate <- MCDelayOrDuplicate
    RetrySubmission <- MCRetrySubmission
    AgentTimeout <- MCAgentTimeout
    AgentExit <- MCAgentExit
    AgentExitWaitTimeout <- MCAgentExitWaitTimeout
    ObserveBaseline <- MCObserveBaseline
    AgentMutate <- MCAgentMutate
    AgentMitigate <- MCAgentMitigate
    Crash <- MCCrash
    ReplaceCluster <- MCReplaceCluster
    BeginNoiseApply <- MCBeginNoiseApply
    NoiseManagerJoinTimeout <- MCNoiseManagerJoinTimeout
    RestartPod <- MCRestartPod

SYMMETRY Symmetry
VIEW ModelView
CONSTRAINT MessageBufferConstraint

INVARIANTS
    \* Core/reference safety
    ReferenceStageOrder

    \* Structural invariants used during convergence
    MCTypeOK
    CounterBounds
    CurrentStageConsistent
    NoiseLoopCountConsistent
    NoiseSetsConsistent
    EvaluationMetadataConsistent
    CleanupMetadataConsistent
    AcceptanceAccounting

    \* Scenario invariants are intentionally disabled here.
    \* OneAcceptedPerStage
    \* SubmissionOriginMatches
    \* DoneIsTerminal
    \* NoEvaluationDuringTeardown
    \* NoOverlappingRuns
    \* FaultBeforeDiagnosis
    \* BaselineMatchesCluster
    \* PreexistingResourcesPreserved
    \* CleanupDeletesOnlyRunOwned
    \* NoiseQuiescentAtEvaluation
    \* OraclePassImpliesMitigated

PROPERTIES
    RunGenerationMonotonic
    ClusterGenerationMonotonic

    \* Conditional external-call liveness properties (not convergence checks).
    \* AcceptedSubmissionTerminates
    \* TeardownEventuallyCompletes
