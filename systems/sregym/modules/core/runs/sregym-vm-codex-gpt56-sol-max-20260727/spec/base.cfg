SPECIFICATION Spec

CONSTANTS
    MaxRun = 2
    MaxClusterGen = 1
    MaxNoiseEpoch = 2
    MaxQueueLen = 3
    MaxRetries = 2
    MaxResultVersion = 4
    RequestIds = {req1, req2}
    NoRequest = NoRequest

INVARIANTS
    \* Core/reference safety
    ReferenceStageOrder

    \* Structural sanity
    TypeOK
    CurrentStageConsistent
    NoiseLoopCountConsistent
    NoiseSetsConsistent
    EvaluationMetadataConsistent
    CleanupMetadataConsistent
    AcceptanceAccounting

    \* Scenario invariants are intentionally disabled in the convergence cfg.
    \* Enable them only in the scenario hunting configs.
    \* OneAcceptedPerStage
    \* SubmissionOriginMatches
    \* DoneIsTerminal
    \* NoEvaluationDuringTeardown
    \* NoOverlappingRuns
    \* FaultBeforeDiagnosis
    \* BaselineMatchesCluster
    \* PreexistingResourcesPreserved
    \* CleanupDeletesOnlyRunOwned
    \* NoiseQuiescentAtEvaluation
    \* OraclePassImpliesMitigated

PROPERTIES
    RunGenerationMonotonic
    ClusterGenerationMonotonic

    \* These require fairness/termination assumptions on external calls.
    \* AcceptedSubmissionTerminates
    \* TeardownEventuallyCompletes
