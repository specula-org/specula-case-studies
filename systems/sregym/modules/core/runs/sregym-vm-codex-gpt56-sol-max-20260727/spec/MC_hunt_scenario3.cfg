SPECIFICATION MCSpec

CONSTANTS
    MaxRun = 2
    MaxClusterGen = 1
    MaxNoiseEpoch = 1
    MaxQueueLen = 1
    MaxRetries = 0
    MaxResultVersion = 4
    RequestIds = {req1}
    NoRequest = NoRequest

    MaxRunStartLimit = 2
    MaxSubmissionLimit = 0
    MaxDuplicateLimit = 0
    MaxRetryLimit = 0
    MaxTimeoutLimit = 1
    MaxExitLimit = 0
    MaxBaselineFailureLimit = 1
    MaxMutationLimit = 1
    MaxMitigationLimit = 0
    MaxCrashLimit = 1
    MaxClusterReplaceLimit = 1
    MaxNoiseApplyLimit = 0
    MaxJoinTimeoutLimit = 0
    MaxPodRestartLimit = 0
    MaxMessageBufferLimit = 1

    StartProblem <- MCStartProblem
    SendSubmission <- MCSendSubmission
    DelayOrDuplicate <- MCDelayOrDuplicate
    RetrySubmission <- MCRetrySubmission
    AgentTimeout <- MCAgentTimeout
    AgentExit <- MCAgentExit
    AgentExitWaitTimeout <- MCAgentExitWaitTimeout
    ObserveBaseline <- MCObserveBaseline
    AgentMutate <- MCAgentMutate
    AgentMitigate <- MCAgentMitigate
    Crash <- MCCrash
    ReplaceCluster <- MCReplaceCluster
    BeginNoiseApply <- MCBeginNoiseApply
    NoiseManagerJoinTimeout <- MCNoiseManagerJoinTimeout
    RestartPod <- MCRestartPod

SYMMETRY Symmetry
VIEW ModelView
CONSTRAINT MessageBufferConstraint

INVARIANTS
    \* Core safety plus only Scenario 3 targets
    ReferenceStageOrder
    BaselineMatchesCluster
    PreexistingResourcesPreserved
    CleanupDeletesOnlyRunOwned
