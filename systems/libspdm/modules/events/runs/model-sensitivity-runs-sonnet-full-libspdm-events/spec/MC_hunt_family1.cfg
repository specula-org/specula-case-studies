\* MC_hunt_family1.cfg — Hunt for Family 1: response_state check ordering in SEND_EVENT handler
\*
\* Bug: libspdm_rsp_event_ack.c checks version BEFORE response_state.
\* When response_state = PROCESSING_ENCAP and request version mismatches,
\* the response is VERSION_MISMATCH instead of REQUEST_IN_FLIGHT.
\*
\* Target invariants: RequestInFlightGuard, NoDualInFlightConflict
\* Setup: allow encap flow + version-mismatch SEND_EVENT to overlap.
\* Tight bounds: irrelevant actions reduced to 0-1.

SPECIFICATION MCSpec

CONSTANTS
    NOT_STARTED      = NOT_STARTED
    HANDSHAKE        = HANDSHAKE
    ESTABLISHED      = ESTABLISHED
    NORMAL           = NORMAL
    PROCESSING_ENCAP = PROCESSING_ENCAP
    SUB_NONE         = SUB_NONE
    SUB_ALL          = SUB_ALL
    SUB_LIST         = SUB_LIST
    RESP_OK                = RESP_OK
    RESP_VERSION_MISMATCH  = RESP_VERSION_MISMATCH
    RESP_REQUEST_IN_FLIGHT = RESP_REQUEST_IN_FLIGHT
    RESP_NONE              = RESP_NONE

    \* Tight bounds — keep only what is needed to trigger Family 1
    VersionMismatchLimit  = 2   \* allow version-mismatch injections
    EncapInitLimit        = 2   \* allow encap initiation (sets PROCESSING_ENCAP)
    SubscribeNoneLimit    = 0   \* irrelevant — suppress
    SessionTerminateLimit = 1
    KeyExchangeAllLimit   = 1

VIEW MCView

INVARIANTS
    TypeOK
    MCProcessingEncapImpliesEncapInFlight
    MCEncapInFlightSessionValid
    \* --- Family 1 targets ---
    MCRequestInFlightGuard
    \* MCNoDualInFlightConflict \* Case A: removed — overly-strong; direct RESP_OK then encap is valid
