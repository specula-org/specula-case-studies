SPECIFICATION MCSpec

CONSTANTS
    NOT_STARTED      = NOT_STARTED
    HANDSHAKE        = HANDSHAKE
    ESTABLISHED      = ESTABLISHED
    NORMAL           = NORMAL
    PROCESSING_ENCAP = PROCESSING_ENCAP
    SUB_NONE         = SUB_NONE
    SUB_ALL          = SUB_ALL
    SUB_LIST         = SUB_LIST
    RESP_OK                = RESP_OK
    RESP_VERSION_MISMATCH  = RESP_VERSION_MISMATCH
    RESP_REQUEST_IN_FLIGHT = RESP_REQUEST_IN_FLIGHT
    RESP_NONE              = RESP_NONE

    \* Fault injection bounds (convergence run — keep small)
    VersionMismatchLimit  = 2
    SubscribeNoneLimit    = 2
    EncapInitLimit        = 2
    SessionTerminateLimit = 1
    KeyExchangeAllLimit   = 2

VIEW MCView

INVARIANTS
    \* --- Structural invariants (always enabled) ---
    TypeOK
    MCProcessingEncapImpliesEncapInFlight
    MCEncapInFlightSessionValid
    MCEventAllPolicyImpliesSubscribeAll

    \* --- Extension invariants (bug-family specific) ---
    \* Commented out for convergence run. Enable in MC_hunt_*.cfg files.

    \* FAMILY 1
    \* MCRequestInFlightGuard
    \* MCNoDualInFlightConflict

    \* FAMILY 2
    \* MCEventAllOverriddenToNone

    \* FAMILY 2+3
    \* MCSubscribeNoneBlocksEvents
