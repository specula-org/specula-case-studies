\* MC_hunt_family2.cfg — Hunt for Family 2: SUBSCRIBE_ALL override via SUBSCRIBE_NONE
\*
\* Bug: SUBSCRIBE_EVENT_TYPES with param1=0 unconditionally sets SUBSCRIBE_NONE,
\* silently overriding EVENT_ALL_POLICY subscription set at KEY_EXCHANGE.
\* libspdm_rsp_subscribe_event_types_ack.c:121-129 has no guard for prior state.
\*
\* Target invariants: EventAllOverriddenToNone, SubscribeNoneBlocksEvents
\* Setup: KEY_EXCHANGE with EVENT_ALL_POLICY, then SUBSCRIBE_NONE message.
\* Tight bounds: encap and version-mismatch suppressed; only sub-state transitions active.

SPECIFICATION MCSpec

CONSTANTS
    NOT_STARTED      = NOT_STARTED
    HANDSHAKE        = HANDSHAKE
    ESTABLISHED      = ESTABLISHED
    NORMAL           = NORMAL
    PROCESSING_ENCAP = PROCESSING_ENCAP
    SUB_NONE         = SUB_NONE
    SUB_ALL          = SUB_ALL
    SUB_LIST         = SUB_LIST
    RESP_OK                = RESP_OK
    RESP_VERSION_MISMATCH  = RESP_VERSION_MISMATCH
    RESP_REQUEST_IN_FLIGHT = RESP_REQUEST_IN_FLIGHT
    RESP_NONE              = RESP_NONE

    \* Tight bounds — focus on subscription state transitions
    KeyExchangeAllLimit   = 2   \* allow session with EVENT_ALL_POLICY
    SubscribeNoneLimit    = 2   \* allow SUBSCRIBE_NONE override (the bug trigger)
    EncapInitLimit        = 0   \* suppress encap flow (irrelevant for Family 2)
    VersionMismatchLimit  = 0   \* suppress version mismatch (irrelevant for Family 2)
    SessionTerminateLimit = 1

VIEW MCView

INVARIANTS
    TypeOK
    MCEncapInFlightSessionValid
    MCEventAllPolicyImpliesSubscribeAll
    \* --- Family 2 targets ---
    MCEventAllOverriddenToNone
    MCSubscribeNoneBlocksEvents
