\* MC_hunt_family3.cfg — Hunt for Family 3: event delivery before subscription acknowledgment
\*
\* Bug: libspdm_init_send_event_encap_state() (libspdm_rsp_encap_response.c:246-266)
\* and libspdm_get_encap_request_send_event() (libspdm_rsp_encap_send_event.c:51-54)
\* do not check subscription_state before initiating or generating encap SEND_EVENT.
\* Scenario: session established with EVENT_ALL_POLICY, requester sends SUBSCRIBE_NONE,
\* responder is mid-flight with an encap SEND_EVENT — subscription is now NONE.
\*
\* Target invariants: SubscribeNoneBlocksEvents, EncapInFlightSessionValid
\* Setup: EVENT_ALL_POLICY + encap init → SUBSCRIBE_NONE races with encap in flight.

SPECIFICATION MCSpec

CONSTANTS
    NOT_STARTED      = NOT_STARTED
    HANDSHAKE        = HANDSHAKE
    ESTABLISHED      = ESTABLISHED
    NORMAL           = NORMAL
    PROCESSING_ENCAP = PROCESSING_ENCAP
    SUB_NONE         = SUB_NONE
    SUB_ALL          = SUB_ALL
    SUB_LIST         = SUB_LIST
    RESP_OK                = RESP_OK
    RESP_VERSION_MISMATCH  = RESP_VERSION_MISMATCH
    RESP_REQUEST_IN_FLIGHT = RESP_REQUEST_IN_FLIGHT
    RESP_NONE              = RESP_NONE

    \* Tight bounds — encap init + subscribe_none must both be reachable
    KeyExchangeAllLimit   = 2   \* session with EVENT_ALL_POLICY (required for the scenario)
    EncapInitLimit        = 2   \* encap SEND_EVENT initiation (sets PROCESSING_ENCAP)
    SubscribeNoneLimit    = 2   \* SUBSCRIBE_NONE can arrive during encap
    VersionMismatchLimit  = 0   \* suppress Family 1 noise
    SessionTerminateLimit = 1

VIEW MCView

INVARIANTS
    TypeOK
    MCProcessingEncapImpliesEncapInFlight
    MCEncapInFlightSessionValid
    MCEventAllPolicyImpliesSubscribeAll
    \* --- Family 3 targets ---
    MCSubscribeNoneBlocksEvents
