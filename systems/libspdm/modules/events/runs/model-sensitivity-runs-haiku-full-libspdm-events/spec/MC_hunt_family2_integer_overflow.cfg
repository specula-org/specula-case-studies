\* Hunting config for Family 2: Integer Overflow in Size Accumulation
\*
\* Bug mechanism: The event ack handler accumulates event sizes in a loop
\* without overflow protection. The final validation may miss intermediate overflow.
\*
\* libspdm_rsp_event_ack.c:188-190 accumulates; line 194 validates final size
\*
\* Hunting strategy:
\* - Enable SizeOverflowLimit to inject pathological sizes
\* - Keep event processing moderate (SeqLimit = 2)
\* - Constrain message loss and timeouts
\* - Target invariant: SizeAccumulationBounded

SPECIFICATION MCSpec

CONSTANTS
    MaxEvents = 4
    MaxSessions = 2
    MaxMessageSize = 65535
    Requester = "REQ"
    Responder = "RESP"
    DMTF_EVENT_TYPE = "DMTF"
    VENDOR_EVENT_TYPE = "VENDOR"
    REGISTRY_ID_DMTF = "REGISTRY_DMTF"
    REGISTRY_ID_VENDOR = "REGISTRY_VENDOR"

\* Tight bounds: focus on size accumulation
CONSTANTS
    SessionClosureLimit = 0
    SizeOverflowLimit = 2    \* Inject overflow faults
    SeqLimit = 2             \* Moderate path exploration
    MessageLossLimit = 0
    TimeoutLimit = 1
    RequestLimit = 2
    MaxMessageBufferSize = 8

INVARIANTS
    \* Type safety
    MCTypeOK
    MCMessageBound

    \* Family 2 target invariant
    MCFamily2_SizeAccumulationBounded

PROPERTIES
    \* Focused on safety, not liveness
