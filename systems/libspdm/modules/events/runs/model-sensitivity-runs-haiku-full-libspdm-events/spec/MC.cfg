\* Model Checking Configuration for libspdm-events
\* Standard bounds for convergence testing

SPECIFICATION MCSpec

CONSTANTS
    MaxEvents = 3
    MaxSessions = 2
    MaxMessageSize = 65535
    Requester = "REQ"
    Responder = "RESP"
    DMTF_EVENT_TYPE = "DMTF"
    VENDOR_EVENT_TYPE = "VENDOR"
    REGISTRY_ID_DMTF = "REGISTRY_DMTF"
    REGISTRY_ID_VENDOR = "REGISTRY_VENDOR"
    SessionClosureLimit = 2
    SizeOverflowLimit = 1
    SeqLimit = 3
    MessageLossLimit = 2
    TimeoutLimit = 2
    RequestLimit = 2
    MaxMessageBufferSize = 10

INVARIANTS
    \* Type safety - always check
    MCTypeOK
    MCMessageBound

    \* Structural invariants
    \* (commented out for convergence; enabled in hunt cfgs)
    \* MCFamily1_SequentialOrGapFree
    \* MCFamily2_SizeAccumulationBounded
    \* MCFamily3_EventsInEstablishedSession
    \* MCFamily4_DMTFEventsValidated
    \* MCFamily5_SubscriptionConsistency

PROPERTIES
    \* Liveness: eventual message delivery (deadlock freedom)
    \* (Disabled for convergence; focus on safety)
    \* EventuallyProcesses
