\* Hunting config for Family 3: Session State Validation Gap
\*
\* Bug mechanism: Session state is validated once at handler entry, but state
\* can change asynchronously before the callback is invoked. A malicious actor
\* or transient fault could close the session between the check and the callback.
\*
\* libspdm_rsp_event_ack.c:93-98 checks state; line 236+ invokes callback
\*
\* Hunting strategy:
\* - Enable SessionClosureLimit to inject session closures
\* - Keep event processing active (SeqLimit >= 2)
\* - Keep subscription activity moderate
\* - Target invariant: EventsInEstablishedSession

SPECIFICATION MCSpec

CONSTANTS
    MaxEvents = 3
    MaxSessions = 2
    MaxMessageSize = 65535
    Requester = "REQ"
    Responder = "RESP"
    DMTF_EVENT_TYPE = "DMTF"
    VENDOR_EVENT_TYPE = "VENDOR"
    REGISTRY_ID_DMTF = "REGISTRY_DMTF"
    REGISTRY_ID_VENDOR = "REGISTRY_VENDOR"

\* Tight bounds: focus on session state transitions
CONSTANTS
    SessionClosureLimit = 3  \* Inject session closure faults
    SizeOverflowLimit = 0
    SeqLimit = 2
    MessageLossLimit = 1
    TimeoutLimit = 2
    RequestLimit = 2
    MaxMessageBufferSize = 8

INVARIANTS
    \* Type safety
    MCTypeOK
    MCMessageBound

    \* Family 3 target invariant
    MCFamily3_EventsInEstablishedSession

PROPERTIES
    \* Focused on safety, not liveness
