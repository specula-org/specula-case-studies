\* Hunting config for Family 4: DMTF Event Type Validation Coupling
\*
\* Bug mechanism: DMTF event type validation is tightly coupled to event parsing
\* and only called for specific SVH IDs. If validation logic diverges across
\* code paths, invalid events could pass through.
\*
\* libspdm_rsp_event_ack.c:175-180 validates for SPDM_REGISTRY_ID_DMTF only
\* libspdm_com_event.c:11-25 validation function
\*
\* Hunting strategy:
\* - Keep event processing active (SeqLimit >= 2)
\* - Constrain size/closure faults
\* - Moderate request/timeout bounds to allow event generation
\* - Target invariant: DMTFEventsValidated

SPECIFICATION MCSpec

CONSTANTS
    MaxEvents = 4
    MaxSessions = 2
    MaxMessageSize = 65535
    Requester = "REQ"
    Responder = "RESP"
    DMTF_EVENT_TYPE = "DMTF"
    VENDOR_EVENT_TYPE = "VENDOR"
    REGISTRY_ID_DMTF = "REGISTRY_DMTF"
    REGISTRY_ID_VENDOR = "REGISTRY_VENDOR"

\* Tight bounds: focus on event validation
CONSTANTS
    SessionClosureLimit = 1
    SizeOverflowLimit = 0
    SeqLimit = 3             \* Explore both validation paths
    MessageLossLimit = 1
    TimeoutLimit = 2
    RequestLimit = 2
    MaxMessageBufferSize = 8

INVARIANTS
    \* Type safety
    MCTypeOK
    MCMessageBound

    \* Family 4 target invariant
    MCFamily4_DMTFEventsValidated

PROPERTIES
    \* Focused on safety, not liveness
