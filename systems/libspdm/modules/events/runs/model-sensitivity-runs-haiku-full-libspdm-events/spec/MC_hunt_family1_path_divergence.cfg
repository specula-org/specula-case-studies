\* Hunting config for Family 1: Path Inconsistency (Sequential vs Non-Sequential)
\*
\* Bug mechanism: Two code paths (sequential vs non-sequential) have different
\* complexity and test coverage. The non-sequential path uses O(n^2) search and
\* may harbor different bugs than the sequential path.
\*
\* libspdm_rsp_event_ack.c:222-244 splits into two branches
\*
\* Hunting strategy:
\* - Force exploration of both paths (SeqLimit >= 2)
\* - Constrain irrelevant actions (message loss, timeouts to 0)
\* - Tight session/overflow bounds
\* - Target invariant: SequentialOrGapFree

SPECIFICATION MCSpec

CONSTANTS
    MaxEvents = 3
    MaxSessions = 2
    MaxMessageSize = 65535
    Requester = "REQ"
    Responder = "RESP"
    DMTF_EVENT_TYPE = "DMTF"
    VENDOR_EVENT_TYPE = "VENDOR"
    REGISTRY_ID_DMTF = "REGISTRY_DMTF"
    REGISTRY_ID_VENDOR = "REGISTRY_VENDOR"

\* Tight bounds: focus only on path divergence
CONSTANTS
    SessionClosureLimit = 0
    SizeOverflowLimit = 0
    SeqLimit = 3          \* Must explore both paths
    MessageLossLimit = 0
    TimeoutLimit = 1
    RequestLimit = 2
    MaxMessageBufferSize = 8

INVARIANTS
    \* Type safety
    MCTypeOK
    MCMessageBound

    \* Family 1 target invariant
    MCFamily1_SequentialOrGapFree

PROPERTIES
    \* Focused on safety, not liveness
