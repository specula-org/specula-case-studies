\* Trace Validation Configuration
\*
\* This config is used to validate implementation traces against the base spec.
\* It must include TraceMatched to ensure the entire trace is consumed.

SPECIFICATION TraceSpec

CONSTANTS
    MaxEvents = 10
    MaxSessions = 4
    MaxMessageSize = 65535
    Requester = "REQ"
    Responder = "RESP"
    DMTF_EVENT_TYPE = "DMTF"
    VENDOR_EVENT_TYPE = "VENDOR"
    REGISTRY_ID_DMTF = "REGISTRY_DMTF"
    REGISTRY_ID_VENDOR = "REGISTRY_VENDOR"
    TraceLog <- Trace_baseline_json

INVARIANTS
    \* Type safety
    SessionStateOK
    MessageOK

    \* Base spec safety invariants
    TraceEventInEstablishedSession
    TraceSequentialOrGapFree
    TraceSizeAccumulationBounded
    TraceDMTFEventsValidated

PROPERTIES
    \* CRITICAL: Must check that entire trace is consumed
    TraceMatched
