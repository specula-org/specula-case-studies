\* Hunting config for Family 5: Subscription State Management
\*
\* Bug mechanism: Event subscription state is entirely delegated to integrator
\* callbacks. The library provides no consistency guarantees. If subscription
\* state diverges between requester and responder, the protocol may deliver
\* events the requester did not subscribe to.
\*
\* libspdm_rsp_subscribe_event_types_ack.c:131-137 delegates to callback
\* No library-level state machine; external callbacks manage all state
\*
\* Hunting strategy:
\* - Keep subscription activity high (RequestLimit >= 2, TimeoutLimit >= 2)
\* - Allow moderate session/event faults
\* - Constrain size/path selection
\* - Target invariant: SubscriptionConsistency

SPECIFICATION MCSpec

CONSTANTS
    MaxEvents = 3
    MaxSessions = 2
    MaxMessageSize = 65535
    Requester = "REQ"
    Responder = "RESP"
    DMTF_EVENT_TYPE = "DMTF"
    VENDOR_EVENT_TYPE = "VENDOR"
    REGISTRY_ID_DMTF = "REGISTRY_DMTF"
    REGISTRY_ID_VENDOR = "REGISTRY_VENDOR"

\* Tight bounds: focus on subscription state
CONSTANTS
    SessionClosureLimit = 1
    SizeOverflowLimit = 0
    SeqLimit = 2
    MessageLossLimit = 2     \* Allow message loss to test robustness
    TimeoutLimit = 3         \* Multiple subscription attempts
    RequestLimit = 3
    MaxMessageBufferSize = 10

INVARIANTS
    \* Type safety
    MCTypeOK
    MCMessageBound

    \* Family 5 target invariant
    MCFamily5_SubscriptionConsistency

PROPERTIES
    \* Focused on safety, not liveness
