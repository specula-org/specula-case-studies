\* Hunt config for Family 2: Mutual Auth Path Inconsistency (non-encap vs encap)
\*
\* Trigger mechanism (brief §6.1 MC2):
\*   1. KEY_EXCHANGE with mode=MUT_NON_ENCAP and req_slot_id=2 (non-default slot).
\*      RspHandleKeyExchange: peer_cert_slot[s] = NO_SLOT (omits write, F2 bug).
\*      cert_advertised[s] = 2.
\*   2. FINISH arrives: RspDeriveDataKeys reads peer_cert_slot[s] = NO_SLOT.
\*      cert_slot_verified[s] = NO_SLOT (not equal to cert_advertised[s] = 2).
\*   3. Session becomes ESTABLISHED.
\*      MutAuthUsesNegotiatedSlot: cert_slot_verified[s] != cert_advertised[s] => violated.
\*
\* Expected violation: MutAuthUsesNegotiatedSlot
\*   (brief §5, targeting MC2)
\*
\* Bounds rationale:
\*   MaxKeyExchanges=2: one KEX with non-encap + FINISH round-trip is sufficient.
\*   MaxCertSlots=2: need at least one non-default slot (slot 2) to expose the bug.
\*   MaxEncodeFailures=0, MaxInjections=0, MaxAppDataSends=0: suppress irrelevant faults.

SPECIFICATION MCSpec

CONSTANTS
    MaxSessions       = 2
    MaxCertSlots      = 2
    MaxSeqNum         = 4
    MaxKeyExchanges   = 2
    MaxEncodeFailures = 0
    MaxInjections     = 0
    MaxAppDataSends   = 0

CONSTRAINT MsgBufferConstraint

INVARIANTS
    MCTypeOK
    MCSessionStateMonotonic
    MCFinishRspConsistency
    MCMutAuthUsesNegotiatedSlot
