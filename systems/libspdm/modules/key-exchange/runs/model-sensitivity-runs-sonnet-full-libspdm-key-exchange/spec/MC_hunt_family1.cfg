\* Hunt config for Family 1: Session Identity Confusion Under HANDSHAKE_IN_THE_CLEAR
\*
\* Trigger mechanism (brief §6.1 MC1):
\*   1. Two KEY_EXCHANGEs with hitc=TRUE before any FINISH.
\*      latest_session_id is overwritten to the second session.
\*   2. Requester sends FINISH (session_id_valid=FALSE) for the first session.
\*      RspDeriveDataKeys resolves target = latest_session_id = session 2.
\*   3. RspCommitEstablished marks session 2 ESTABLISHED.
\*      finish_authenticated_for[session2] = session1 => invariant violated.
\*
\* Expected violation: SessionEstablishedOnlyAfterOwnFinish
\*   (brief §5, targeting MC1)
\*
\* Bounds rationale:
\*   MaxKeyExchanges=3: two KEX + one FINISH round-trip is sufficient.
\*   MaxEncodeFailures=0, MaxInjections=0, MaxAppDataSends=0: suppress irrelevant faults.

SPECIFICATION MCSpec

CONSTANTS
    MaxSessions       = 2
    MaxCertSlots      = 2
    MaxSeqNum         = 4
    MaxKeyExchanges   = 3
    MaxEncodeFailures = 0
    MaxInjections     = 0
    MaxAppDataSends   = 0

CONSTRAINT MsgBufferConstraint

INVARIANTS
    MCTypeOK
    MCSessionStateMonotonic
    MCFinishRspConsistency
    MCSessionEstablishedOnlyAfterOwnFinish
