\* Hunt config for Family 4: Sequence Counter Advanced Before AEAD Verification
\*
\* Trigger mechanism (brief §6.1 MC4):
\*   1. Session established (ESTABLISHED state).
\*   2. InjectBadMessage(s): attacker sends message with correct session_id and
\*      seq_num=expected_seq[s] but authentic=FALSE (invalid ciphertext).
\*   3. RspDecodeSecuredMessage(m):
\*      a. Sequence check passes (m.seq_num = expected_seq[s]).          [encode_decode:444,449]
\*      b. seq_before_advance[s] = expected_seq[s].
\*      c. expected_seq[s] incremented.                                  [encode_decode:~420]
\*      d. AEAD fails (authentic=FALSE): last_decode_rejected[s] = TRUE. [encode_decode:477]
\*   4. SeqCounterStableOnDecryptFailure:
\*      last_decode_rejected[s]=TRUE AND expected_seq[s] != seq_before_advance[s] => VIOLATED.
\*      Counter advanced despite AEAD failure — next legitimate message will fail seq check.
\*
\* Expected violation: SeqCounterStableOnDecryptFailure
\*   (brief §5, targeting MC4)
\*
\* Bounds rationale:
\*   MaxInjections=1: one injection triggers the bug.
\*   MaxAppDataSends=2: need at least one app-data send to reach ESTABLISHED + seq=0.
\*   MaxKeyExchanges=1: single session sufficient.
\*   MaxEncodeFailures=0: suppress F3 noise.

SPECIFICATION MCSpec

CONSTANTS
    MaxSessions       = 1
    MaxCertSlots      = 1
    MaxSeqNum         = 4
    MaxKeyExchanges   = 1
    MaxEncodeFailures = 0
    MaxInjections     = 1
    MaxAppDataSends   = 2

CONSTRAINT MsgBufferConstraint

INVARIANTS
    MCTypeOK
    MCSessionStateMonotonic
    MCSeqCounterStableOnDecryptFailure
