SPECIFICATION TraceSpec

CONSTANTS
    MaxSessions  = 4
    MaxCertSlots = 4
    MaxSeqNum    = 16

\* TraceMatched is a temporal property — REQUIRED.
\* Without it TLC reports "no errors" even when l never advances.
PROPERTIES
    TraceMatched

\* Safety invariants that should hold on every real execution trace
INVARIANTS
    TypeOK
    SessionStateMonotonic
    FinishRspConsistency
    SessionEstablishedOnlyAfterOwnFinish
    MutAuthUsesNegotiatedSlot

\* Fault-injection invariants are NOT checked during trace validation:
\*   SeqCounterStableOnDecryptFailure  — only triggered with injected bad messages
\*   NoDataKeysBeforeEstablished       — zombie scenario requires RspEncodeFailure
\* These require fault injection that real traces don't have.
