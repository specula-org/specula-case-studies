\* Hunt config for Family 3: Non-Atomic Session State Transition (Finish Gap)
\*
\* Trigger mechanism (brief §6.1 MC3):
\*   1. FINISH arrives; RspDeriveDataKeys runs: data_keys_live[s]=TRUE,
\*      session_state[s]=KEYS_DERIVED.
\*   2. RspEncodeFailure(s) fires: encoding fails after key derivation.
\*      CommitEstablished never runs.
\*      Session stuck in KEYS_DERIVED with data_keys_live=TRUE (zombie).
\*   3. NoDataKeysBeforeEstablished:
\*      data_keys_live[s]=TRUE and session_state[s]=KEYS_DERIVED (not ESTABLISHED).
\*      This is the zombie session state — slot leaked, no path to ESTABLISHED.
\*
\* NOTE: NoDataKeysBeforeEstablished allows KEYS_DERIVED (it is a transient intermediate).
\* To detect the zombie as a real bug, use the temporal property below (commented out).
\* The safety invariant here checks that the *structural* invariant SessionStateMonotonic
\* holds even in the zombie case — combined with SessionEstablishedOnlyAfterOwnFinish
\* to ensure no partial establishment sneaks through.
\*
\* Expected detection: RspEncodeFailure is only meaningful with MC3 enabled;
\* The structural violation is: data_keys_live without eventual ESTABLISHED.
\* Primary check: SessionEstablishedOnlyAfterOwnFinish (no partial establish),
\* Secondary check: NoDataKeysBeforeEstablished (zombie state is detectable).
\*
\* Bounds rationale:
\*   MaxEncodeFailures=1: one encode failure is sufficient to create zombie.
\*   MaxKeyExchanges=2: one session for the zombie.
\*   MaxInjections=0, MaxAppDataSends=0: suppress irrelevant faults.

SPECIFICATION MCSpec

CONSTANTS
    MaxSessions       = 2
    MaxCertSlots      = 2
    MaxSeqNum         = 4
    MaxKeyExchanges   = 2
    MaxEncodeFailures = 1
    MaxInjections     = 0
    MaxAppDataSends   = 0

CONSTRAINT MsgBufferConstraint

INVARIANTS
    MCTypeOK
    MCSessionStateMonotonic
    MCFinishRspConsistency
    MCSessionEstablishedOnlyAfterOwnFinish
    MCNoDataKeysBeforeEstablished

\* Temporal property: a zombie session is one that stays in KEYS_DERIVED forever.
\* Uncomment to check liveness (requires fairness assumptions in Spec):
\* PROPERTIES
\*     <>(~\E s \in Sessions : session_state[s] = "keys_derived")
