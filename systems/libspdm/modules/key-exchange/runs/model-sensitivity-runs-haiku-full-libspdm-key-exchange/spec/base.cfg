(* Base configuration for SPDM KEY_EXCHANGE / FINISH protocol *)

(* Constants *)
CONSTANTS
    Requester = Requester
    Responder = Responder
    NULL_SESSION_ID = 0
    MAX_SESSIONS = 4
    MAX_HEARTBEAT_PERIOD = 100
    SLOT_1 = 1
    SLOT_2 = 2
    DHE = DHE
    PSK = PSK
    PSK_DHE = PSK_DHE
    HBEAT_CAP = HBEAT_CAP
    MULTI_KEY_CAP = MULTI_KEY_CAP
    MAX_OPAQUE_LENGTH = 256
    WITH_RECORDS = "with_records"
    FAST_PATH = "fast_path"

(* Initial predicate and view *)
INIT Init
NEXT Next

(* Properties to check *)
INVARIANT TypeOK
INVARIANT AuthenticationSafety
INVARIANT TranscriptContinuity
INVARIANT NoProtocolMixing
INVARIANT CapabilityConsistency
INVARIANT SessionIDUniqueness
INVARIANT SessionIDCleanup
INVARIANT SessionIDNoBoundaryLeaks
INVARIANT NoSessionIDExhaustion
INVARIANT SlotValidation
INVARIANT PathEquivalence
INVARIANT NoDoubleFinish
