(* Model Checking configuration for SPDM KEY_EXCHANGE / FINISH *)

(* Use MC.tla as the spec *)
SPECIFICATION MCSpec

(* Symmetry reduction *)

(* Constants *)
CONSTANTS
    Requester = Requester
    Responder = Responder
    NULL_SESSION_ID = 0
    MAX_SESSIONS = 4
    MAX_HEARTBEAT_PERIOD = 100
    SLOT_1 = 1
    SLOT_2 = 2
    DHE = DHE
    PSK = PSK
    PSK_DHE = PSK_DHE
    HBEAT_CAP = HBEAT_CAP
    MULTI_KEY_CAP = MULTI_KEY_CAP
    MAX_OPAQUE_LENGTH = 256
    WITH_RECORDS = "with_records"
    FAST_PATH = "fast_path"

(* Safety Invariants (always enabled) *)
INVARIANT TypeOK
INVARIANT SessionIDUniqueness
INVARIANT NoSessionIDExhaustion

(* Standard protocol invariants (enabled) *)
INVARIANT NoDoubleFinish

(* Extension Invariants for Bug Families (commented out for standard MC.cfg)
   Uncommented in specific hunting configs below *)

\* Family 1 - Message Authentication Bypass via Protocol Mixing
\* INVARIANT AuthenticationSafety
\* INVARIANT TranscriptContinuity
\* INVARIANT NoProtocolMixing

\* Family 2 - Input Validation & Capability Mismatch
\* INVARIANT CapabilityConsistency

\* Family 3 - Session ID Lifecycle & Resource Leak
\* INVARIANT SessionIDCleanup
\* INVARIANT SessionIDNoBoundaryLeaks

\* Family 4 - Certificate/Public Key Slot Validation
\* INVARIANT SlotValidation

\* Family 5 - Transcript Hash Integrity & Reconstruction Divergence
\* INVARIANT PathEquivalence
