SPECIFICATION TraceSpec

CHECK_DEADLOCK FALSE

CONSTANTS
    MaxMeasurementExchanges = 5
    MaxSlots  = 8
    MaxSessions = 4
    Versions  = {10, 11, 12, 13}
    RAW_PUBLIC_KEY_SLOT = 15
    NULL = NULL
    \* Fault counters not used in trace validation (no fault injection)
    MaxL1L2FailLimit  = 0
    MaxRetryLimit     = 0
    MaxResyncLimit    = 0
    MaxExchangesLimit = 8

INVARIANTS
    TypeOK
    ParseOffsetInRange
    ActiveSessionsBounded
    \* Core safety invariants that should hold on every real execution
    ParseWithinBounds
    SessionConsistency
    SlotBinding

PROPERTIES
    TraceMatched
