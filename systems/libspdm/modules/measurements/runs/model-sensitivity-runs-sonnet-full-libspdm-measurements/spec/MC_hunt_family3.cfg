\* Hunting config: Family 3 — Session/Non-Session Message-M Context Selection
\*
\* Open questions targeted:
\*   MC1: Session vs non-session interleaving causing L1/L2 divergence
\*   MC4: NeedResync leaves active_sessions non-empty, stale message_m accepted
\*
\* Strategy:
\*   - Enable NeedResync (MaxResyncLimit > 0)
\*   - Keep both session and non-session paths reachable
\*   - Target SessionConsistency and L1L2Agreement

SPECIFICATION MCSpec

CONSTANTS
    MaxMeasurementExchanges = 3
    MaxSlots  = 2
    MaxSessions = 2
    Versions  = {11, 12, 13}
    RAW_PUBLIC_KEY_SLOT = 15
    NULL = NULL
    MaxL1L2FailLimit  = 1
    MaxRetryLimit     = 2   \* issue #491/#524
    MaxResyncLimit    = 2   \* key fault for family 3
    MaxExchangesLimit = 4

CONSTRAINT StateConstraint

VIEW MCView

INVARIANTS
    MCTypeOK
    MCSessionConsistency
    MCL1L2Agreement
