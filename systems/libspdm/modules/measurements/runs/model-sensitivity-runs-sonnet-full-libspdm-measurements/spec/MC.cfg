SPECIFICATION MCSpec

CONSTANTS
    MaxMeasurementExchanges = 3
    MaxSlots  = 3
    MaxSessions = 2
    Versions  = {11, 12, 13}
    RAW_PUBLIC_KEY_SLOT = 15
    MaxL1L2FailLimit  = 2
    MaxRetryLimit     = 2
    MaxResyncLimit    = 2
    MaxExchangesLimit = 4
    NULL = NULL

CONSTRAINT StateConstraint

VIEW MCView

\* ---- Standard safety + structural invariants ----
INVARIANTS
    MCTypeOK
    MCParseOffsetInRange
    MCActiveSessionsBounded

\* ---- Extension (bug-family) invariants — commented out for convergence runs ----
\* Enable one at a time in MC_hunt_*.cfg files
\* MCL1L2Agreement
\* MCTranscriptNoSigBytes
\* MCParseWithinBounds
\* MCSlotBinding
\* MCSessionConsistency
