\* Hunting config: Family 1 — L1/L2 Transcript Integrity
\*
\* Open questions targeted:
\*   MC1: Can L1/L2 diverge when session and non-session calls interleave?
\*   MC2: Does retry (issue #491/#524) cause L1/L2 divergence?
\*
\* Strategy:
\*   - Allow L1L2ComputationFailure and PartialRetryAccumulate to fire
\*   - Keep session/non-session interleaving reachable
\*   - Target L1L2Agreement and TranscriptNoSignatureBytes

SPECIFICATION MCSpec

CONSTANTS
    MaxMeasurementExchanges = 3
    MaxSlots  = 2
    MaxSessions = 2
    Versions  = {11, 12}
    RAW_PUBLIC_KEY_SLOT = 15
    NULL = NULL
    MaxL1L2FailLimit  = 2   \* allow failure to fire
    MaxRetryLimit     = 2   \* allow retry accumulation
    MaxResyncLimit    = 0   \* disable resync (not needed for this family)
    MaxExchangesLimit = 4

CONSTRAINT StateConstraint

VIEW MCView

INVARIANTS
    MCTypeOK
    MCL1L2Agreement
    MCTranscriptNoSigBytes
