\* Trace Validation Configuration
\* Validates that base spec can reproduce observed execution traces

INIT TraceInit
NEXT TraceNext

CONSTANT
    SPDM_VERSION_10 = 16
    SPDM_VERSION_11 = 17
    SPDM_VERSION_12 = 18
    SPDM_VERSION_13 = 19
    MAX_SLOT_COUNT = 8
    SESSION_ID_MAX = 65536
    NULL_SESSION_ID = 0

\* Constraint: No message queue depth (disabled for now)
\* CONSTRAINT MessageQueueBounded

\* Safety Invariants from Base Spec (disabled for now)
\* INVARIANT TypeOK
\* INVARIANT VersionNegotiated
\* INVARIANT VersionConsistency
\* INVARIANT TranscriptStateConsistent
\* INVARIANT SlotIDValid
\* INVARIANT MessageQueueConsistent

\* MANDATORY: Verify entire trace was consumed
PROPERTIES TraceMatched
