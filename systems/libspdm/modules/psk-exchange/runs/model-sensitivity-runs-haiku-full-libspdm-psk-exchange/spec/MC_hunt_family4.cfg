\* Hunting config for Family 4: Context Length Validation and Boundary Checks
\* Target: ContextLengthBounds invariant violation
\* Mechanism: No explicit upper-bound check on context_length during responder parsing

CONSTANT
    Requester = "req"
    Responder = "rsp"
    MaxOpaqueLengthSize = 200
    MaxContextLength = 40
    MaxSessionIds = 4
    PSK_EXCHANGE = "psk_exchange"
    PSK_EXCHANGE_RSP = "psk_exchange_rsp"
    PSK_FINISH = "psk_finish"
    PSK_FINISH_RSP = "psk_finish_rsp"
    OK = "ok"
    ERROR_INVALID_MSG_FIELD = "error_invalid_msg_field"
    ERROR_SESSION_EXHAUSTED = "error_session_exhausted"
    IDLE = "idle"
    HANDSHAKING = "handshaking"
    ESTABLISHED = "established"

INIT MCInit

NEXT MCNext

\* ===== CORE INVARIANTS =====
INVARIANT TypeOK

\* ===== TARGET INVARIANT (Family 4) =====
\* This should be violated when context_length exceeds bounds
INVARIANT ContextLengthBounds

\* ===== MINIMAL SUPPORTING INVARIANTS =====

\* Allow targeted context length violation injection

