\* Hunting config for Family 1: Path Inconsistency in Opaque Data Validation
\* Target: OpaqueLengthConsistency invariant violation
\* Mechanism: Requester-side explicit max-bound check vs responder-side implicit check

CONSTANT
    Requester = "req"
    Responder = "rsp"
    MaxOpaqueLengthSize = 200
    MaxContextLength = 40
    MaxSessionIds = 4
    PSK_EXCHANGE = "psk_exchange"
    PSK_EXCHANGE_RSP = "psk_exchange_rsp"
    PSK_FINISH = "psk_finish"
    PSK_FINISH_RSP = "psk_finish_rsp"
    OK = "ok"
    ERROR_INVALID_MSG_FIELD = "error_invalid_msg_field"
    ERROR_SESSION_EXHAUSTED = "error_session_exhausted"
    IDLE = "idle"
    HANDSHAKING = "handshaking"
    ESTABLISHED = "established"

INIT MCInit

NEXT MCNext

\* ===== CORE INVARIANTS =====
INVARIANT TypeOK

\* ===== TARGET INVARIANT (Family 1) =====
\* This should be violated when opaque_length is oversized on responder side
INVARIANT OpaqueLengthConsistency

\* ===== MINIMAL SUPPORTING INVARIANTS =====
\* Disable fault counters for non-target mechanisms to reduce state space

\* Allow targeted opaque length injection

