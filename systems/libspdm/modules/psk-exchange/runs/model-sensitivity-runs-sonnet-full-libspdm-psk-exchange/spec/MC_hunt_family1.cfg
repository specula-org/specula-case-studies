\* Hunting config for Family 1:
\*   "Can a PSK session reach ESTABLISHED with secured_message_version = 0
\*    in SPDM 1.2+ mode by sending PSK_EXCHANGE with zero-length opaque data?"
\*
\* MC finding MC1 from brief §6.1.
\* Trigger: SendPskExchange(FALSE) → GetResponsePskExchange → RecvPskExchangeRsp
\*          (PSK_CAP_REQUESTER_ONLY path → immediate ESTABLISHED, version = V_NONE)
\*
\* Tight bounds: no drops needed; no PSK_FINISH needed; only 1 no-opaque send needed.

SPECIFICATION MCSpec

CONSTANTS
    REQ             = REQ
    RSP             = RSP
    V_NONE          = V_NONE
    V_VALID         = V_VALID
    V_ALT           = V_ALT
    SPDM_VER_12     = SPDM_VER_12
    SpdmVersion     = SPDM_VER_12
    PSK_CAP_REQUESTER_ONLY          = PSK_CAP_REQUESTER_ONLY
    PSK_CAP_RESPONDER_WITH_CONTEXT  = PSK_CAP_RESPONDER_WITH_CONTEXT
    MSG_PSK_EXCHANGE                = MSG_PSK_EXCHANGE
    MSG_PSK_EXCHANGE_RSP            = MSG_PSK_EXCHANGE_RSP
    MSG_PSK_FINISH                  = MSG_PSK_FINISH
    MSG_PSK_FINISH_RSP              = MSG_PSK_FINISH_RSP
    MSG_ERROR                       = MSG_ERROR
    MaxDropLimit    = 0
    MaxSendLimit    = 1
    MaxMsgBuffer    = 4

CONSTRAINT MCMsgConstraint

INVARIANTS
    TypeOK
    NoEstablishWithoutHmacVerify
    ValidVersionOnEstablish
