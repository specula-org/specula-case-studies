SPECIFICATION MCSpec

CONSTANTS
    REQ             = REQ
    RSP             = RSP
    V_NONE          = V_NONE
    V_VALID         = V_VALID
    V_ALT           = V_ALT
    SPDM_VER_12     = SPDM_VER_12
    SpdmVersion     = SPDM_VER_12
    PSK_CAP_REQUESTER_ONLY          = PSK_CAP_REQUESTER_ONLY
    PSK_CAP_RESPONDER_WITH_CONTEXT  = PSK_CAP_RESPONDER_WITH_CONTEXT
    MSG_PSK_EXCHANGE                = MSG_PSK_EXCHANGE
    MSG_PSK_EXCHANGE_RSP            = MSG_PSK_EXCHANGE_RSP
    MSG_PSK_FINISH                  = MSG_PSK_FINISH
    MSG_PSK_FINISH_RSP              = MSG_PSK_FINISH_RSP
    MSG_ERROR                       = MSG_ERROR
    MaxDropLimit    = 2
    MaxSendLimit    = 2
    MaxMsgBuffer    = 6

CONSTRAINT MCMsgConstraint

INVARIANTS
    \* --- Structural invariants (always enabled) ---
    TypeOK
    SessionIdConsistency
    RspNotAheadOfReq
    \* --- Standard safety (always enabled) ---
    NoEstablishWithoutHmacVerify
    PskFinishRequiredIfContext
    \* --- Extension invariants (bug-detection) ---
    \* Disabled during convergence runs; enable in MC_hunt_*.cfg
    \* ValidVersionOnEstablish
    \* VersionAgreement

VIEW MCView
