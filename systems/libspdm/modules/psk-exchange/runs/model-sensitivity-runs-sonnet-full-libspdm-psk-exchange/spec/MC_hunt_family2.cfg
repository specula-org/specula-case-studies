\* Hunting config for Family 2:
\*   "If the integrator's opaque-data callback returns version V_a on call 2
\*    and version V_b != V_a on call 3, do requester and responder assign
\*    different versions to the same session?"
\*
\* MC finding MC2 from brief §6.1.
\* Trigger: GetResponsePskExchange with has_opaque=TRUE, callback non-deterministically
\*          returns V_VALID for call 2 (temp fetch) and V_ALT for call 3 (final write).
\*          Requester extracts V_ALT from response; responder used V_VALID internally.
\*
\* Tight bounds: no drops; with-opaque sends only; no PSK_FINISH needed to see mismatch.

SPECIFICATION MCSpec

CONSTANTS
    REQ             = REQ
    RSP             = RSP
    V_NONE          = V_NONE
    V_VALID         = V_VALID
    V_ALT           = V_ALT
    SPDM_VER_12     = SPDM_VER_12
    SpdmVersion     = SPDM_VER_12
    PSK_CAP_REQUESTER_ONLY          = PSK_CAP_REQUESTER_ONLY
    PSK_CAP_RESPONDER_WITH_CONTEXT  = PSK_CAP_RESPONDER_WITH_CONTEXT
    MSG_PSK_EXCHANGE                = MSG_PSK_EXCHANGE
    MSG_PSK_EXCHANGE_RSP            = MSG_PSK_EXCHANGE_RSP
    MSG_PSK_FINISH                  = MSG_PSK_FINISH
    MSG_PSK_FINISH_RSP              = MSG_PSK_FINISH_RSP
    MSG_ERROR                       = MSG_ERROR
    MaxDropLimit    = 0
    MaxSendLimit    = 0
    MaxMsgBuffer    = 4

CONSTRAINT MCMsgConstraint

INVARIANTS
    TypeOK
    NoEstablishWithoutHmacVerify
    VersionAgreement
