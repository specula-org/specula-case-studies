\* MC_hunt_family2.cfg — Hunt for Family 2: Capability Compatibility Asymmetry
\*
\* Target invariant: CapabilityCompatibility
\* Target findings:  MC2 (PSK_CAP==3 asymmetry; CR1 missing KEY_EX_CAP check in
\*                   responder's libspdm_check_request_flag_compatibility)
\*
\* Key insight: the spec models the ACTUAL (buggy) responder code that does NOT
\* reject PSK_CAP_1+PSK_CAP_2 (both bits set) and does NOT check KEY_EX requires
\* CERT or PUB_KEY_ID. CapabilityCompatibility checks the correct spec behavior.
\* A violation means the model reached AFTER_CAPS with a bad flag combination.
\*
\* Tight bounds: resets=0 (not relevant), rsp errors=0 (not relevant)

SPECIFICATION MCSpec

CONSTANTS
    Ver10 = "v10"
    Ver11 = "v11"
    Ver12 = "v12"
    Ver13 = "v13"
    Ver14 = "v14"

    CERT_CAP                = "CERT_CAP"
    CHAL_CAP                = "CHAL_CAP"
    ENCRYPT_CAP             = "ENCRYPT_CAP"
    MAC_CAP                 = "MAC_CAP"
    MUT_AUTH_CAP            = "MUT_AUTH_CAP"
    KEY_EX_CAP              = "KEY_EX_CAP"
    PSK_CAP_1               = "PSK_CAP_1"
    PSK_CAP_2               = "PSK_CAP_2"
    ENCAP_CAP               = "ENCAP_CAP"
    HBEAT_CAP               = "HBEAT_CAP"
    KEY_UPD_CAP             = "KEY_UPD_CAP"
    HANDSHAKE_IN_CLEAR_CAP  = "HANDSHAKE_IN_CLEAR_CAP"
    PUB_KEY_ID_CAP          = "PUB_KEY_ID_CAP"
    MEAS_CAP                = "MEAS_CAP"
    MEAS_CAP_SIG            = "MEAS_CAP_SIG"
    MEL_CAP                 = "MEL_CAP"

    ALG_DHE          = "ALG_DHE"
    ALG_AEAD         = "ALG_AEAD"
    ALG_REQ_ASYM     = "ALG_REQ_ASYM"
    ALG_KEY_SCHEDULE = "ALG_KEY_SCHEDULE"
    ALG_REQ_PQC_ASYM = "ALG_REQ_PQC_ASYM"
    ALG_KEM          = "ALG_KEM"

    ALGO_NONE = 0
    ALGO_SOME = 1

    MaxResetLimit    = 0
    MaxRspErrorLimit = 0

INVARIANTS
    TypeOK
    CapabilityCompatibility

VIEW MCView
