\* MC_hunt_family1.cfg — Hunt for Family 1: Version × Capability × Algorithm Coherence
\*
\* Target invariants: NegotiatedCoherence, VersionAlgoScope
\* Target findings:   MC1 (MEL_CAP=1, MEAS_CAP=0 → mspec set but mhash=0)
\*
\* Tight bounds: resets enabled (crash between phases is the trigger path);
\* rsp errors disabled (not relevant to F1); all other actions unbounded.
\*
\* To run:
\*   tlc MC -config MC_hunt_family1.cfg -workers auto

SPECIFICATION MCSpec

