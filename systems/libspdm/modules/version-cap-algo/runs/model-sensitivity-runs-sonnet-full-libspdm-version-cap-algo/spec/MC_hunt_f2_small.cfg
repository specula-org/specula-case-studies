    Ver14 = "v14"

    CERT_CAP                = "CERT"
    CHAL_CAP                = "CERT"
    ENCRYPT_CAP             = "MAC"
    MAC_CAP                 = "MAC"
    MUT_AUTH_CAP            = "CERT"
    KEY_EX_CAP              = "KEY_EX"
    PSK_CAP_1               = "PSK1"
    PSK_CAP_2               = "PSK2"
    ENCAP_CAP               = "CERT"
    HBEAT_CAP               = "CERT"
    KEY_UPD_CAP             = "CERT"
    HANDSHAKE_IN_CLEAR_CAP  = "CERT"
    PUB_KEY_ID_CAP          = "PUB"
    MEAS_CAP                = "CERT"
    MEAS_CAP_SIG            = "CERT"
    MEL_CAP                 = "CERT"

    ALG_DHE          = "ALG_DHE"
    ALG_AEAD         = "ALG_AEAD"
    ALG_REQ_ASYM     = "ALG_REQ_ASYM"
    ALG_KEY_SCHEDULE = "ALG_KEY_SCHEDULE"
    ALG_REQ_PQC_ASYM = "ALG_REQ_PQC_ASYM"
