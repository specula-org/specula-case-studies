\* MC_hunt_family3.cfg — Hunt for Family 3: NEGOTIATE_ALGORITHMS Struct Table Mirroring
\*
\* Target invariant: AlgTableMirroring
\* Target finding:   MC3 (rsp_alg_types ≠ req_alg_types at NEGOTIATED state)
\*
\* The spec models RspHandleNegotiateAlgorithms enforcing struct_alg_types == req_types,
\* but MC3 asks whether there is any code path that can bypass this.
\* A violation means the state can reach NEGOTIATED with mismatched sets.
\*
\* Tight bounds: no resets or error paths needed

