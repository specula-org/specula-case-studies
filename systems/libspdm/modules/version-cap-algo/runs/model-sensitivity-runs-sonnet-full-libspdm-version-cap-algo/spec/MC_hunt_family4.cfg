\* MC_hunt_family4.cfg — Hunt for Family 4: Transcript Integrity on VCA Error Paths
\*
\* Target invariant: TranscriptCoherence
\* Target finding:   MC4 (lone request appended without response; issue #524 open)
\*
\* The spec models RspErrorInCapabilities and RspErrorInAlgorithms as fault actions
\* that append the request but do NOT append the response. The invariant requires
\* that in any stable state (no in-flight message), all appended requests have
\* corresponding responses.
\*
\* Tight bounds: rsp errors enabled (these are the trigger mechanism);
\* resets disabled (not needed; the bug manifests without a crash).

SPECIFICATION MCSpec

CONSTANTS
