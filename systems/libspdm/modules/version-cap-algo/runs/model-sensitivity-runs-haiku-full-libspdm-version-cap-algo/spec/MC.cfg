SPECIFICATION MCSpec

CONSTANT
    MaxAlgorithms = 4
    SHA256 = 1
    SHA384 = 2
    SHA512 = 3
    ECDSA = 4
    FFDH = 5
    AES_128_GCM = 6
    AES_256_GCM = 7

\* Fault injection bounds (per bug family)
CONSTANT MaxFaults = 2

INVARIANT TypeOK

\* Extension invariants (bug-family specific) - COMMENTED OUT initially
\* Uncomment to hunt specific bug families
\* PROPERTY
\*     []AlgorithmIntersectionNonEmpty
\*     []PrioritizationSucceeds
\*     []VersionNegotiatedBeforeCapabilities
\*     []VersionNegotiatedBeforeAlgorithms
\*     []RequesterValidatesIfCapabilitiesEnabled
\*     []ResponderAlgoInLocalSupport
