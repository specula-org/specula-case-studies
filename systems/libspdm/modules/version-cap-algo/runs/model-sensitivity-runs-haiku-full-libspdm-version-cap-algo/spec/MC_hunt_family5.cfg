\* Hunting config for Family 5: Conditional Validation on Requester Side
\* Focus: Requester skips validation when capabilities are enabled

SPECIFICATION MCSpec

CONSTANT
    MaxAlgorithms = 4
    SHA256 = 1
    SHA384 = 2
    SHA512 = 3
    ECDSA = 4
    FFDH = 5
    AES_128_GCM = 6
    AES_256_GCM = 7

CONSTANT MaxFaults = 1

INVARIANT TypeOK

\* Core safety invariant for Family 5
PROPERTY
    []RequesterValidatesIfCapabilitiesEnabled

\* Structural invariants
PROPERTY
    []NoMessageDuplication
    []HandshakeOrdering
