\* Hunting config for Family 1: Asymmetric Algorithm Validation Gap
\* Focus: Responder accepts unsupported algorithm, creating disagreement

SPECIFICATION MCSpec

CONSTANT
    MaxAlgorithms = 4
    SHA256 = 1
    SHA384 = 2
    SHA512 = 3
    ECDSA = 4
    FFDH = 5
    AES_128_GCM = 6
    AES_256_GCM = 7

\* Tight bounds: enable fault injection, minimize unrelated actions
CONSTANT MaxFaults = 1

INVARIANT TypeOK

\* Core safety invariant for Family 1
PROPERTY
    []AlgorithmIntersectionNonEmpty
    []ResponderAlgoInLocalSupport

\* Structural invariants
PROPERTY
    []NoMessageDuplication
    []HandshakeOrdering
