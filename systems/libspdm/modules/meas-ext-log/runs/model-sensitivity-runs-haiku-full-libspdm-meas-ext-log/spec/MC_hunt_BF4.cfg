(* Hunting Config for BF4: Request Offset Continuity *)

(* Constants to test offset alignment issues *)
CONSTANT MAX_MEL_SIZE = 28
CONSTANT MAX_CHUNK_SIZE = 10

CONSTANT REQUESTER = "req"
CONSTANT RESPONDER = "resp"

(* Allow offset overflow to test misalignment *)
CONSTANT MessageLossLimit = 1
CONSTANT WrongRemainderLimit = 1
CONSTANT OffsetOverflowLimit = 2

(* Check offset consistency *)
INVARIANT NoOffsetOverflow

(* Temporal property *)
PROPERTY TransferCompletes

(* Init and Next predicates *)
INIT MCInit
NEXT MCNext
