(* Hunting Config for BF3: Loop Termination Condition Race *)

(* Tight constants to force early loop termination conditions *)
CONSTANT MAX_MEL_SIZE = 20
CONSTANT MAX_CHUNK_SIZE = 12

CONSTANT REQUESTER = "req"
CONSTANT RESPONDER = "resp"

(* Aggressive message loss to trigger partial header scenarios *)
CONSTANT MessageLossLimit = 2
CONSTANT WrongRemainderLimit = 1
CONSTANT OffsetOverflowLimit = 0

(* Check header guard and buffer bounds *)
INVARIANT HeaderGuard
INVARIANT BufferBounds

(* Temporal property *)
PROPERTY TransferCompletes

(* Init and Next predicates *)
INIT MCInit
NEXT MCNext
