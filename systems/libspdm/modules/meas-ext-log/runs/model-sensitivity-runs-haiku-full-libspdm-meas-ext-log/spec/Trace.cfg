(* Trace Validation Configuration *)

(* Base Constants *)
CONSTANT MAX_MEL_SIZE = 256
CONSTANT MAX_CHUNK_SIZE = 64

CONSTANT REQUESTER = "req"
CONSTANT RESPONDER = "resp"

(* Trace file location - set via environment or use default *)
(* When running validation on a specific trace, the tool sets JSON env var *)

(* Specification *)
SPECIFICATION TraceSpec

(* Invariants for trace validation *)
INVARIANT NoOffsetOverflow
INVARIANT RemainderConsistency
INVARIANT BufferBounds
INVARIANT HeaderGuard
INVARIANT PortionLengthValid
INVARIANT TotalSizeConsistent

(* Trace completion property - CRITICAL *)
(* Without this, TLC reports "no errors" even if trace not consumed *)
PROPERTY TraceMatched
