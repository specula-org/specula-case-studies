(* Model Checking Configuration *)

(* Base Constants *)
CONSTANT MAX_MEL_SIZE = 32
CONSTANT MAX_CHUNK_SIZE = 16

CONSTANT REQUESTER = "req"
CONSTANT RESPONDER = "resp"

(* Counter Limits - constrain fault-injection *)
CONSTANT MessageLossLimit = 2
CONSTANT WrongRemainderLimit = 2
CONSTANT OffsetOverflowLimit = 1

(* Invariants - Standard Safety Properties *)
INVARIANT NoOffsetOverflow
INVARIANT RemainderConsistency
INVARIANT BufferBounds
INVARIANT HeaderGuard
INVARIANT PortionLengthValid
INVARIANT TotalSizeConsistent

(* Bug-Family Specific Invariants (commented out until hunting) *)
(* These are enabled in MC_hunt_* configs *)
(* INVARIANT BF1_NoArithmeticOverflow *)
(* INVARIANT BF2_RemainderConsistency *)
(* INVARIANT BF3_NoLoopInfiniteLoop *)
(* INVARIANT BF4_OffsetContinuity *)
(* INVARIANT BF5_PortionLengthCorrect *)
(* INVARIANT BF6_NoUnderflow *)

(* Temporal Properties *)
PROPERTY TransferCompletes

(* Init and Next predicates *)
INIT MCInit
NEXT MCNext
