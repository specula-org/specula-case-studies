(* Hunting Config for BF2: Remainder Length Consistency *)

(* Tight constants to focus on remainder inconsistency *)
CONSTANT MAX_MEL_SIZE = 24
CONSTANT MAX_CHUNK_SIZE = 8

CONSTANT REQUESTER = "req"
CONSTANT RESPONDER = "resp"

(* Fault injection targeting remainder inconsistency *)
CONSTANT MessageLossLimit = 1
CONSTANT WrongRemainderLimit = 3  \* Allow wrong remainder responses
CONSTANT OffsetOverflowLimit = 0

(* Check remainder consistency *)
INVARIANT RemainderConsistency
INVARIANT TotalSizeConsistent

(* Temporal property *)
PROPERTY TransferCompletes

(* Init and Next predicates *)
INIT MCInit
NEXT MCNext
