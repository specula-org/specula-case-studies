\* MC_hunt_family1_header.cfg
\*
\* Hunt config for Family 1: partial-header loop termination (MC2)
\*
\* Targets MC2: "If first MEASUREMENT_EXTENSION_LOG response has portion_length < 16,
\* does the Requester loop terminate correctly?"  — expected violation: MelHeaderComplete
\*
\* Setup:
\*   - MEL_SIZES = {8}: MEL is 8 bytes, smaller than MEL_HEADER_SIZE (16)
\*     When the Responder sends 8 bytes in chunk-1, first_portion_len=8 < 16
\*   - MAX_CHUNK = 12: not the constraint here; MEL_SIZE=8 limits portion_len to 8
\*   - MelUpdateLimit = 0: not needed for this bug
\*
\* Expected counterexample:
\*   1. NegotiateAlgorithmsWithSessionCap(DMTF) → conn_state=CS_NEGOTIATED
\*   2. SendGetMelFirstChunk
\*   3. RespondGetMelFirstChunk(8)  \* 8 < MEL_HEADER_SIZE (16)
\*   4. ProcessGetMelFirstChunkResp → first_portion_len=8, mel_offset=8
\*      → MelHeaderComplete: mel_offset > 0 ∧ first_portion_len < 16 → VIOLATION

SPECIFICATION MCSpec

CONSTANTS
    MEL_SIZES        = {8}
    MAX_CHUNK        = 12
    MEL_SPEC_DMTF    = 1
    MEL_SPEC_INVALID = 3
    MelUpdateLimit   = 0
    NegotiateLimit   = 1

INVARIANTS
    MCTypeOK
    MCChannelOK
    MelHeaderComplete
