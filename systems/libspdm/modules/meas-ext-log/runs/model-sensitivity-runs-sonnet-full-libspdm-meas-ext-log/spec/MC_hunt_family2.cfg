\* MC_hunt_family2.cfg
\*
\* Hunt config for Family 2: mel_spec negotiation validation bypass (MC3)
\*
\* Targets MC3: "Can a Responder returning mel_specification_sel=0x03 (INVALID)
\* cause the Requester to proceed with GET_MEL when KEY_EX_CAP=0 && PSK_CAP=0?"
\* Expected violations: MelSpecValid (after negotiation), MelSpecPreSend (during GET_MEL)
\*
\* Setup:
\*   - has_session_cap=FALSE in Init forces the bypass path
\*     (NegotiateAlgorithmsWithoutSessionCap is the only enabled negotiation action)
\*   - Wire value MEL_SPEC_INVALID (3) flows through unvalidated
\*   - MelUpdateLimit=0: not relevant for this family
\*
\* Expected counterexample:
\*   1. Init with has_session_cap=FALSE
\*   2. NegotiateAlgorithmsWithoutSessionCap(MEL_SPEC_INVALID=3)
\*      → conn_state=CS_NEGOTIATED, mel_spec_conn=3
\*      → MelSpecValid: CS_NEGOTIATED ∧ mel_spec_conn=3 ∉ {0,1} → VIOLATION
\*   (Also: if GET_MEL proceeds with mel_spec_conn=3, MelSpecPreSend still holds since 3≠0,
\*    but MelSpecValid is violated immediately at negotiation.)

SPECIFICATION MCSpec

CONSTANTS
    MEL_SIZES        = {20}
    MAX_CHUNK        = 12
    MEL_SPEC_DMTF    = 1
    MEL_SPEC_INVALID = 3
    MelUpdateLimit   = 0
    NegotiateLimit   = 1

INVARIANTS
    MCTypeOK
    MCChannelOK
    MelSpecValid
    MelSpecPreSend
