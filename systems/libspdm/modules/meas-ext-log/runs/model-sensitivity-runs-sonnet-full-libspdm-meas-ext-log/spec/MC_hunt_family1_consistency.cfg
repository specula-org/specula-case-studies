\* MC_hunt_family1_consistency.cfg
\*
\* Hunt config for Family 1: multi-chunk MEL consistency
\*
\* Targets MC1: "If MEL changes between chunk-1 and chunk-2, can the Requester
\* assemble a chimeric log?" — expected violation: MelConsistency
\*
\* Setup:
\*   - MEL_SIZES = {20}: forces multi-chunk (MAX_CHUNK=12, so chunk-2 needed)
\*   - MelUpdateLimit = 1: one MelUpdate allowed (enough to change generation)
\*   - NegotiateLimit = 1: one negotiation, with session cap, DMTF mel_spec
\*     (Family 2 bypass not the focus; lock to valid negotiation path)
\*
\* Expected counterexample path:
\*   1. NegotiateAlgorithmsWithSessionCap(DMTF) → CS_NEGOTIATED, mel_spec_conn=1
\*   2. SendGetMelFirstChunk
\*   3. RespondGetMelFirstChunk(12) → rsp_generation=0
\*   4. ProcessGetMelFirstChunkResp  → mel_snapshot_gen=0, mel_offset=12
\*   5. MelUpdate → mel_generation=1
\*   6. SendGetMelNextChunk
\*   7. RespondGetMelNextChunk(8)  → rsp_generation=1 ≠ mel_snapshot_gen=0 → VIOLATION

SPECIFICATION MCSpec

CONSTANTS
    MEL_SIZES        = {20}
    MAX_CHUNK        = 12
    MEL_SPEC_DMTF    = 1
    MEL_SPEC_INVALID = 3
    MelUpdateLimit   = 1
    NegotiateLimit   = 1

INVARIANTS
    MCTypeOK
    MCChannelOK
    MelConsistency
