\* Hunt config for Family 1: Connection State / Transcript Desynchronization
\*
\* Targets:
\*   MC2 — premature AUTHENTICATED + encap failure leaves connection_state=AUTHENTICATED
\*         Invariant: MutAuthCompleteBeforeStayAuthenticated
\*   MC3 — session-path GET_CERTIFICATE advances state without message_b append;
\*         CHALLENGE_AUTH sig computed over incomplete transcript
\*         Invariants: CertInTranscriptOnAuthenticated, NoPartialTranscriptOnChallenge
\*   TV1 — encap mut_c not reset on sig failure
\*         Invariant: EncapMutCCleanAfterFailure
\*
\* Tight bounds: maximize fault-injection for F1 paths; zero out F2/F4 faults.

SPECIFICATION MCSpec

CONSTANTS
    Requester   = Requester
    Responder   = Responder
    SlotIDs     = {s0}
    NullSlot    = NullSlot

    NOT_STARTED        = NOT_STARTED
    AFTER_VERSION      = AFTER_VERSION
    AFTER_CAPABILITIES = AFTER_CAPABILITIES
    NEGOTIATED         = NEGOTIATED
    AFTER_DIGESTS      = AFTER_DIGESTS
    AFTER_CERTIFICATE  = AFTER_CERTIFICATE
    AUTHENTICATED      = AUTHENTICATED

    MSG_B     = MSG_B
    MSG_C     = MSG_C
    MSG_MUT_B = MSG_MUT_B
    MSG_MUT_C = MSG_MUT_C

    GET_DIGESTS_MSG          = GET_DIGESTS_MSG
    DIGESTS_MSG              = DIGESTS_MSG
    GET_CERTIFICATE_MSG      = GET_CERTIFICATE_MSG
    CERTIFICATE_MSG          = CERTIFICATE_MSG
    CHALLENGE_MSG            = CHALLENGE_MSG
    CHALLENGE_AUTH_MSG       = CHALLENGE_AUTH_MSG
    ENCAP_CHALLENGE_MSG      = ENCAP_CHALLENGE_MSG
    ENCAP_CHALLENGE_AUTH_MSG = ENCAP_CHALLENGE_AUTH_MSG

    \* F1 faults: allow each once
    MaxInSessionCertLimit     = 1   \* MC3: session-path cert without message_b
    MaxPrematureAuthLimit     = 1   \* MC2: premature AUTHENTICATED
    MaxEncapFailLimit         = 1   \* TV1: encap mut_c not reset

    \* F2/F4 faults: zeroed (not targeted here)
    MaxVerifyPassLimit        = 0
    MaxPartialTranscriptLimit = 0

VIEW MCView

CONSTRAINT MCMsgConstraint

INVARIANTS
    MCTypeOK
    MCAtMostOneInFlight
    MCCertFetchedImpliesHashValid
    \* F1 target invariants
    MCCertInTranscriptOnAuthenticated
    MCMutAuthCompleteBeforeStayAuthenticated
    MCEncapMutCCleanAfterFailure
    MCNoPartialTranscriptOnChallenge
