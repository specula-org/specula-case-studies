\* Hunt config for Family 2: CHALLENGE Precondition Guards Too Weak
\*
\* Targets:
\*   MC1 — CHALLENGE succeeds (AUTHENTICATED) without prior GET_CERTIFICATE
\*         Invariants: AuthImpliesCertFetched, ChallengeHashMatchesFetch
\*
\* Key mechanism: ReqChallenge has weak guard (>= NEGOTIATED, not >= AFTER_CERTIFICATE).
\* MCReqChallengeAuthVerifyPass models adversary providing Hash("") in RECORD_TRANSCRIPT=0 mode
\* (libspdm_com_crypto_service.c:920-921: ASSERT compiled out, zero-initialized buffer matched).
\*
\* Tight bounds: allow cert-bypass verify passes; zero out F1/F4 faults.

SPECIFICATION MCSpec

CONSTANTS
    Requester   = Requester
    Responder   = Responder
    SlotIDs     = {s0}
    NullSlot    = NullSlot

    NOT_STARTED        = NOT_STARTED
    AFTER_VERSION      = AFTER_VERSION
    AFTER_CAPABILITIES = AFTER_CAPABILITIES
    NEGOTIATED         = NEGOTIATED
    AFTER_DIGESTS      = AFTER_DIGESTS
    AFTER_CERTIFICATE  = AFTER_CERTIFICATE
    AUTHENTICATED      = AUTHENTICATED

    MSG_B     = MSG_B
    MSG_C     = MSG_C
    MSG_MUT_B = MSG_MUT_B
    MSG_MUT_C = MSG_MUT_C

    GET_DIGESTS_MSG          = GET_DIGESTS_MSG
    DIGESTS_MSG              = DIGESTS_MSG
    GET_CERTIFICATE_MSG      = GET_CERTIFICATE_MSG
    CERTIFICATE_MSG          = CERTIFICATE_MSG
    CHALLENGE_MSG            = CHALLENGE_MSG
    CHALLENGE_AUTH_MSG       = CHALLENGE_AUTH_MSG
    ENCAP_CHALLENGE_MSG      = ENCAP_CHALLENGE_MSG
    ENCAP_CHALLENGE_AUTH_MSG = ENCAP_CHALLENGE_AUTH_MSG

    \* F2 faults: allow verify-pass without cert to fire
    MaxVerifyPassLimit        = 2   \* MC1: adversarial cert hash bypass

    \* F1/F4 faults: zeroed (not targeted here)
    MaxInSessionCertLimit     = 0
    MaxPrematureAuthLimit     = 0
    MaxEncapFailLimit         = 0
    MaxPartialTranscriptLimit = 0

VIEW MCView

CONSTRAINT MCMsgConstraint

INVARIANTS
    MCTypeOK
    MCAtMostOneInFlight
    MCCertFetchedImpliesHashValid
    \* F2 target invariants
    MCAuthImpliesCertFetched
    MCChallengeHashMatchesFetch
