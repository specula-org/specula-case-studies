\* Hunt config for Family 4: Transcript Integrity Under Error Recovery
\*
\* Targets:
\*   F4 — partial transcript (request appended, response append fails) followed by CHALLENGE
\*         Invariant: NoPartialTranscriptOnChallenge
\*
\* Key mechanism: AppendResponseFail_GetDigests or AppendResponseFail_GetCertificate
\* sets transcript_partial[Responder][MSG_B]=TRUE (issue #524: cannot remove because hash extend).
\* RspChallengeAuth then computes CHALLENGE_AUTH signature over the corrupted transcript.
\*
\* Tight bounds: allow partial transcript fault; zero out F1/F2 faults.

SPECIFICATION MCSpec

CONSTANTS
    Requester   = Requester
    Responder   = Responder
    SlotIDs     = {s0}
    NullSlot    = NullSlot

    NOT_STARTED        = NOT_STARTED
    AFTER_VERSION      = AFTER_VERSION
    AFTER_CAPABILITIES = AFTER_CAPABILITIES
    NEGOTIATED         = NEGOTIATED
    AFTER_DIGESTS      = AFTER_DIGESTS
    AFTER_CERTIFICATE  = AFTER_CERTIFICATE
    AUTHENTICATED      = AUTHENTICATED

    MSG_B     = MSG_B
    MSG_C     = MSG_C
    MSG_MUT_B = MSG_MUT_B
    MSG_MUT_C = MSG_MUT_C

    GET_DIGESTS_MSG          = GET_DIGESTS_MSG
    DIGESTS_MSG              = DIGESTS_MSG
    GET_CERTIFICATE_MSG      = GET_CERTIFICATE_MSG
    CERTIFICATE_MSG          = CERTIFICATE_MSG
    CHALLENGE_MSG            = CHALLENGE_MSG
    CHALLENGE_AUTH_MSG       = CHALLENGE_AUTH_MSG
    ENCAP_CHALLENGE_MSG      = ENCAP_CHALLENGE_MSG
    ENCAP_CHALLENGE_AUTH_MSG = ENCAP_CHALLENGE_AUTH_MSG

    \* F4 faults: allow partial transcript fault to fire
    MaxPartialTranscriptLimit = 1   \* GET_DIGESTS or GET_CERTIFICATE response append fail

    \* F1/F2 faults: zeroed (not targeted here)
    MaxInSessionCertLimit     = 0
    MaxVerifyPassLimit        = 0
    MaxPrematureAuthLimit     = 0
    MaxEncapFailLimit         = 0

VIEW MCView

CONSTRAINT MCMsgConstraint

INVARIANTS
    MCTypeOK
    MCAtMostOneInFlight
    MCCertFetchedImpliesHashValid
    \* F4 target invariant
    MCNoPartialTranscriptOnChallenge
