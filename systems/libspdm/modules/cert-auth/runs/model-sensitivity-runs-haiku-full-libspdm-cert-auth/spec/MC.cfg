\* Model checking configuration for MC.tla
CONSTANT Requester = "requester"
CONSTANT Responder = "responder"

CONSTANT SPDM_VERSION_10 = 1
CONSTANT SPDM_VERSION_11 = 2
CONSTANT SPDM_VERSION_12 = 3
CONSTANT SPDM_VERSION_13 = 4

CONSTANT NULL = "null"
CONSTANT AUTHENTICATED = "authenticated"
CONSTANT CHALLENGED = "challenged"
CONSTANT ONE_WAY_AUTH = "one_way_auth"
CONSTANT MUTUAL_AUTH = "mutual_auth"
CONSTANT FULLY_AUTH = "fully_auth"

CONSTANT MAIN_TRANSCRIPT = "main"
CONSTANT MUTUAL_TRANSCRIPT = "mutual"

CONSTANT CERT_CHAIN = "cert_chain"
CONSTANT PUBLIC_KEY_ONLY = "public_key"

\* Fault injection bounds
CONSTANT MAX_TIMEOUT_LIMIT = 2
CONSTANT MAX_MESSAGE_LOSS_LIMIT = 3
CONSTANT MAX_VERSION_MISMATCH_LIMIT = 1
CONSTANT MAX_MSG_BUFFER_SIZE = 8

INIT MCInit
NEXT MCNext

\* Standard safety invariants (always enabled)
INVARIANT TypeInvariant
INVARIANT MessageBufferBounded
INVARIANT SignatureVerificationInvariant

\* Extension invariants for bug families (commented out during spec validation)
\* Uncomment individually when hunting specific families:
\* INVARIANT StateConsistency              \* Family 1
\* INVARIANT TranscriptIntegrity           \* Family 2
\* INVARIANT SlotIDMatch                   \* Family 3
\* INVARIANT NonceFreshness                \* Family 4
\* INVARIANT KeySourceConsistency          \* Family 5
\* INVARIANT ContextEcho                   \* Family 6

\* Temporal properties
\* PROPERTIES EventuallyAuthenticated
\* PROPERTIES OnceAuthenticatedAlwaysConsistent

\* SYMMETRY Permutations(<<Requester, Responder>>)
