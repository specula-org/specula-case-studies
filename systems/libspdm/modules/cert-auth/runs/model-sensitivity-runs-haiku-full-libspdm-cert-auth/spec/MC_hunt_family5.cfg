\* Hunting config for Family 5: Certificate Chain vs Public Key Slot Selection Edge Case
\* Targets cache coherency issues when switching between cert-chain and public-key modes

EXTENDS MC

CONSTANT Requester = "requester"
CONSTANT Responder = "responder"

CONSTANT SPDM_VERSION_10 = 1
CONSTANT SPDM_VERSION_11 = 2
CONSTANT SPDM_VERSION_12 = 3
CONSTANT SPDM_VERSION_13 = 4

CONSTANT NULL = "null"
CONSTANT AUTHENTICATED = "authenticated"
CONSTANT CHALLENGED = "challenged"
CONSTANT ONE_WAY_AUTH = "one_way_auth"
CONSTANT MUTUAL_AUTH = "mutual_auth"
CONSTANT FULLY_AUTH = "fully_auth"

CONSTANT MAIN_TRANSCRIPT = "main"
CONSTANT MUTUAL_TRANSCRIPT = "mutual"

CONSTANT CERT_CHAIN = "cert_chain"
CONSTANT PUBLIC_KEY_ONLY = "public_key"

\* Tight bounds with focus on slot/key selection
CONSTANT MAX_TIMEOUT_LIMIT = 1
CONSTANT MAX_MESSAGE_LOSS_LIMIT = 1
CONSTANT MAX_VERSION_MISMATCH_LIMIT = 0
CONSTANT MAX_MSG_BUFFER_SIZE = 4

INIT MCInit
NEXT MCNext

\* Core safety invariants
INVARIANT TypeInvariant
INVARIANT MessageBufferBounded

\* Target invariant for Family 5: Key Source Consistency
INVARIANT KeySourceConsistency

SYMMETRY Permutations(<<Requester, Responder>>)
