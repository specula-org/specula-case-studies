\* Trace validation configuration for Trace.tla

CONSTANT Requester = "requester"
CONSTANT Responder = "responder"

CONSTANT SPDM_VERSION_10 = 1
CONSTANT SPDM_VERSION_11 = 2
CONSTANT SPDM_VERSION_12 = 3
CONSTANT SPDM_VERSION_13 = 4

CONSTANT NULL = "null"
CONSTANT AUTHENTICATED = "authenticated"
CONSTANT CHALLENGED = "challenged"
CONSTANT ONE_WAY_AUTH = "one_way_auth"
CONSTANT MUTUAL_AUTH = "mutual_auth"
CONSTANT FULLY_AUTH = "fully_auth"

CONSTANT MAIN_TRANSCRIPT = "main"
CONSTANT MUTUAL_TRANSCRIPT = "mutual"

CONSTANT CERT_CHAIN = "cert_chain"
CONSTANT PUBLIC_KEY_ONLY = "public_key"

INIT TraceInit
NEXT TraceNext

\* Trace completion check - MANDATORY
PROPERTIES TraceMatched

\* Safety invariants for trace validation
INVARIANT TraceTypeInvariant
INVARIANT TraceStateConsistency
INVARIANT TraceTranscriptIntegrity
INVARIANT TraceNonceFreshness
INVARIANT TraceKeySourceConsistency

\* Do NOT check fault-injection invariants during trace validation
\* (they only make sense with fault injection enabled in MC)
