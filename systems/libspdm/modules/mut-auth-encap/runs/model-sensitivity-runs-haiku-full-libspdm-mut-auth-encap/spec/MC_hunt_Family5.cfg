(* Hunting Config: Family 5 - Signature Verification Before Complete Message Assembly
   Bug Mechanism: Message buffer appends occur in sequence without transactional
   semantics. If an append operation fails after the first append, the transcript
   becomes incomplete. Signature verification still proceeds on the incomplete log.

   Target Invariants:
   - TranscriptBeforeSignature: Signature verification only after full transcript appended
*)

CONSTANT
    Hash_Sha256 = "hash_sha256"
    Hash_Sha384 = "hash_sha384"
    Hash_Sha512 = "hash_sha512"
    AsymAlg_ECDSA_P256 = "ecdsa_p256"
    AsymAlg_ECDSA_P384 = "ecdsa_p384"
    AsymAlg_ECDSA_P521 = "ecdsa_p521"
    Version_11 = 11
    Version_12 = 12
    Version_13 = 13
    NONCE_SIZE = 32
    MAX_OPAQUE_DATA_SIZE = 256
    MAX_SIGNATURE_SIZE = 256
    MAX_REQ_CONTEXT_SIZE = 32

CONSTANT
    STATE_UNINITIALIZED = "uninitialized"
    STATE_CHALLENGE_SENT = "challenge_sent"
    STATE_CHALLENGE_AUTH_RESPONSE_RECEIVED = "challenge_auth_response_received"
    STATE_AUTHENTICATED = "authenticated"

(* Tight bounds: target Family 5 message append failures *)
CONSTANT
    MaxBufferResetFailures = 0
    MaxOpaqueDataFailures = 0
    MaxSignatureFailures = 3
    MaxVersionMismatches = 0
    MaxMessageAppendFailures = 3
    MaxBufferUnderflows = 0
    MaxStateTransitions = 2

SPECIFICATION MCSpec

(* Target invariants for Family 5 *)
INVARIANT TypeOK
INVARIANT TranscriptBeforeSignature
