(* Hunting Config: Family 2 - Version-Dependent Protocol Field Handling
   Bug Mechanism: Protocol version changes during message exchange lead to
   inconsistent field size calculations and message parsing errors.

   Target Invariants:
   - VersionConsistency: All message parsing uses the same negotiated version
   - RequestContextEcho: For version 1.3+, echoed context matches request
*)

CONSTANT
    Hash_Sha256 = "hash_sha256"
    Hash_Sha384 = "hash_sha384"
    Hash_Sha512 = "hash_sha512"
    AsymAlg_ECDSA_P256 = "ecdsa_p256"
    AsymAlg_ECDSA_P384 = "ecdsa_p384"
    AsymAlg_ECDSA_P521 = "ecdsa_p521"
    Version_11 = 11
    Version_12 = 12
    Version_13 = 13
    NONCE_SIZE = 32
    MAX_OPAQUE_DATA_SIZE = 256
    MAX_SIGNATURE_SIZE = 256
    MAX_REQ_CONTEXT_SIZE = 32

CONSTANT
    STATE_UNINITIALIZED = "uninitialized"
    STATE_CHALLENGE_SENT = "challenge_sent"
    STATE_CHALLENGE_AUTH_RESPONSE_RECEIVED = "challenge_auth_response_received"
    STATE_AUTHENTICATED = "authenticated"

(* Tight bounds: target Family 2 version handling *)
CONSTANT
    MaxBufferResetFailures = 0
    MaxOpaqueDataFailures = 0
    MaxSignatureFailures = 0
    MaxVersionMismatches = 2
    MaxMessageAppendFailures = 0
    MaxBufferUnderflows = 0
    MaxStateTransitions = 2

SPECIFICATION MCSpec

(* Target invariants for Family 2 *)
INVARIANT TypeOK
INVARIANT VersionConsistency
INVARIANT RequestContextEcho
