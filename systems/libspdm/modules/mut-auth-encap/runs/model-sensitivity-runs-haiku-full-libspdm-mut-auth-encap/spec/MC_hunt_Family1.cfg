(* Hunting Config: Family 1 - Non-Atomic Message State Transitions
   Bug Mechanism: State transition to AUTHENTICATED occurs without atomic guarantee
   that signature verification completed successfully.

   Target Invariants:
   - AuthenticatedImplesVerified: If AUTHENTICATED, then signature_verified = TRUE
   - NoPartialStateTransition: Partial state changes are not allowed
*)

CONSTANT
    Hash_Sha256 = "hash_sha256"
    Hash_Sha384 = "hash_sha384"
    Hash_Sha512 = "hash_sha512"
    AsymAlg_ECDSA_P256 = "ecdsa_p256"
    AsymAlg_ECDSA_P384 = "ecdsa_p384"
    AsymAlg_ECDSA_P521 = "ecdsa_p521"
    Version_11 = 11
    Version_12 = 12
    Version_13 = 13
    NONCE_SIZE = 32
    MAX_OPAQUE_DATA_SIZE = 256
    MAX_SIGNATURE_SIZE = 256
    MAX_REQ_CONTEXT_SIZE = 32

CONSTANT
    STATE_UNINITIALIZED = "uninitialized"
    STATE_CHALLENGE_SENT = "challenge_sent"
    STATE_CHALLENGE_AUTH_RESPONSE_RECEIVED = "challenge_auth_response_received"
    STATE_AUTHENTICATED = "authenticated"

(* Tight bounds: target Family 1, minimize others *)
CONSTANT
    MaxBufferResetFailures = 0
    MaxOpaqueDataFailures = 0
    MaxSignatureFailures = 3
    MaxVersionMismatches = 0
    MaxMessageAppendFailures = 0
    MaxBufferUnderflows = 0
    MaxStateTransitions = 4

SPECIFICATION MCSpec

(* Target invariants for Family 1 *)
INVARIANT TypeOK
INVARIANT AuthenticatedImplesVerified
INVARIANT NoPartialStateTransition
