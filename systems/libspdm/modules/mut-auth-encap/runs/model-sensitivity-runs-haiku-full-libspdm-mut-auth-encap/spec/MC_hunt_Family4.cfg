(* Hunting Config: Family 4 - Message Buffer Reset Race Condition
   Bug Mechanism: libspdm_reset_message_buffer_via_request_code() is called
   unconditionally with no error checking. If reset fails, message buffer
   remains in an inconsistent state with stale data from previous operations.

   Target Invariants:
   - TypeOK: Ensure buffer_reset_status tracking works
   - Core safety: Prevent use of incomplete/stale buffers
*)

CONSTANT
    Hash_Sha256 = "hash_sha256"
    Hash_Sha384 = "hash_sha384"
    Hash_Sha512 = "hash_sha512"
    AsymAlg_ECDSA_P256 = "ecdsa_p256"
    AsymAlg_ECDSA_P384 = "ecdsa_p384"
    AsymAlg_ECDSA_P521 = "ecdsa_p521"
    Version_11 = 11
    Version_12 = 12
    Version_13 = 13
    NONCE_SIZE = 32
    MAX_OPAQUE_DATA_SIZE = 256
    MAX_SIGNATURE_SIZE = 256
    MAX_REQ_CONTEXT_SIZE = 32

CONSTANT
    STATE_UNINITIALIZED = "uninitialized"
    STATE_CHALLENGE_SENT = "challenge_sent"
    STATE_CHALLENGE_AUTH_RESPONSE_RECEIVED = "challenge_auth_response_received"
    STATE_AUTHENTICATED = "authenticated"

(* Tight bounds: target Family 4 buffer reset failures *)
CONSTANT
    MaxBufferResetFailures = 3
    MaxOpaqueDataFailures = 0
    MaxSignatureFailures = 0
    MaxVersionMismatches = 0
    MaxMessageAppendFailures = 0
    MaxBufferUnderflows = 0
    MaxStateTransitions = 1

SPECIFICATION MCSpec

(* Target invariants for Family 4 *)
INVARIANT TypeOK
