\* MC_hunt_family1.cfg - Bug Family 1: Encap Op-Code Sequence State Machine
\*
\* Target: EncapSequenceTerminates, RequestIdMonotonic
\*
\* Open questions (brief §6.1 MC-2):
\*   - Does the WITH_GET_DIGESTS variant correctly use request_id=0 for the first delivery?
\*   - Can cross-variant confusion arise (another variant producing request_id=0 at GET_DIGESTS)?
\*   - Does the op-code sequence always terminate without infinite looping?
\*
\* Historical: commit 6674aa87 (GET_CERTIFICATE chunk infinite loop),
\*             commit 58bf6bff / Issue #1791 (NOT_READY not handled)
\*
\* Strategy: allow all variants; allow NOT_READY to fire (clean termination case);
\*   disable EncapError (not relevant for sequence termination); tight request_id bound.

CONSTANTS
    MAX_REQUEST_ID = 6

    OP_NONE            = OP_NONE
    OP_GET_DIGESTS     = OP_GET_DIGESTS
    OP_GET_CERTIFICATE = OP_GET_CERTIFICATE
    OP_CHALLENGE       = OP_CHALLENGE

    VAR_NO_ENCAP           = VAR_NO_ENCAP
    VAR_WITH_ENCAP_REQUEST = VAR_WITH_ENCAP_REQUEST
    VAR_WITH_GET_DIGESTS   = VAR_WITH_GET_DIGESTS
    VAR_BASIC_PK           = VAR_BASIC_PK
    VAR_BASIC_CERT         = VAR_BASIC_CERT

    RS_NORMAL           = RS_NORMAL
    RS_PROCESSING_ENCAP = RS_PROCESSING_ENCAP

    MaxNotReadyLimit = 1   \* allow clean NOT_READY termination once
    MaxEncapErrLimit = 0   \* no generic errors; focus on sequence progression

INIT MCInit
NEXT MCNext

CONSTRAINT MCStateConstraint

\* Structural
INVARIANT TypeOK
\* Family 1 targets
INVARIANT EncapSequenceTerminates
INVARIANT RequestIdMonotonic
