\* Trace.cfg - trace validation configuration

CONSTANTS
    MAX_REQUEST_ID = 16   \* relaxed: traces may have longer exchanges

    OP_NONE            = OP_NONE
    OP_GET_DIGESTS     = OP_GET_DIGESTS
    OP_GET_CERTIFICATE = OP_GET_CERTIFICATE
    OP_CHALLENGE       = OP_CHALLENGE

    VAR_NO_ENCAP           = VAR_NO_ENCAP
    VAR_WITH_ENCAP_REQUEST = VAR_WITH_ENCAP_REQUEST
    VAR_WITH_GET_DIGESTS   = VAR_WITH_GET_DIGESTS
    VAR_BASIC_PK           = VAR_BASIC_PK
    VAR_BASIC_CERT         = VAR_BASIC_CERT

    RS_NORMAL           = RS_NORMAL
    RS_PROCESSING_ENCAP = RS_PROCESSING_ENCAP

    \* Fault counters not used in trace validation
    MaxNotReadyLimit = 99
    MaxEncapErrLimit = 99

SPECIFICATION TraceSpec

\* Suppress end-of-trace deadlock: when l > Len(TraceLog), TraceNext is
\* disabled but the spec allows stuttering via [][TraceNext]_<<vars,l>>.
\* TLC still reports "Deadlock reached" for the non-stutter action being
\* disabled, which is a false positive. CHECK_DEADLOCK FALSE suppresses it.
CHECK_DEADLOCK FALSE

\* Safety invariants that must hold on every real execution
\* EncapSequenceTerminates is a bug-detecting invariant (Family 4) that the
\* real system CAN violate (trace_encap_error exercises this path). It must
\* not be checked here; it lives in the MC config only.
INVARIANT TypeOK
INVARIANT AuthStateConsistency
INVARIANT ChallengeAuthBinding

\* TraceMatched: temporal property - entire trace must be consumed
PROPERTIES TraceMatched
