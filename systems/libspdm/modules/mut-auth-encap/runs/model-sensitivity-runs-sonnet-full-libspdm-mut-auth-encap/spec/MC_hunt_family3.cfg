\* MC_hunt_family3.cfg - Bug Family 3: CHALLENGE_AUTH Validation Inconsistency
\*
\* Targets: ChallengeAuthBinding, CertChainReceivedBeforeChallenge
\*
\* Open question (brief §6.1 MC-4):
\*   Can CHALLENGE_AUTH be accepted without GET_CERTIFICATE having completed
\*   (cert_chain_received == FALSE)?
\*
\* Historical: commit 22fce3eb / Issue #1013 (slot mask bug),
\*             commit 999ed70e / Issue #2689 (cert verify called on failed cert),
\*             commit 15fc448c (measurement hash type unchecked).
\*
\* Strategy:
\*   Check that mutually_authenticated is never set without the triple check.
\*   Check that cert_chain_received=TRUE before any CHALLENGE_AUTH acceptance.
\*   For variants with GET_CERTIFICATE (BASIC_CERT, WITH_ENCAP_REQUEST, WITH_GET_DIGESTS):
\*     DeliverEncapResponseChallengeAuth requires cert_chain_received to be TRUE.
\*
\* No EncapError here: focus on the success path triple-check.

CONSTANTS
    MAX_REQUEST_ID = 6

    OP_NONE            = OP_NONE
    OP_GET_DIGESTS     = OP_GET_DIGESTS
    OP_GET_CERTIFICATE = OP_GET_CERTIFICATE
    OP_CHALLENGE       = OP_CHALLENGE

    VAR_NO_ENCAP           = VAR_NO_ENCAP
    VAR_WITH_ENCAP_REQUEST = VAR_WITH_ENCAP_REQUEST
    VAR_WITH_GET_DIGESTS   = VAR_WITH_GET_DIGESTS
    VAR_BASIC_PK           = VAR_BASIC_PK
    VAR_BASIC_CERT         = VAR_BASIC_CERT

    RS_NORMAL           = RS_NORMAL
    RS_PROCESSING_ENCAP = RS_PROCESSING_ENCAP

    MaxNotReadyLimit = 0   \* no adversarial termination; check success paths
    MaxEncapErrLimit = 0   \* no error injection; focus on triple-check invariants

INIT MCInit
NEXT MCNext

CONSTRAINT MCStateConstraint

\* Structural
INVARIANT TypeOK
\* Family 3 targets
INVARIANT ChallengeAuthBinding
INVARIANT CertChainReceivedBeforeChallenge
