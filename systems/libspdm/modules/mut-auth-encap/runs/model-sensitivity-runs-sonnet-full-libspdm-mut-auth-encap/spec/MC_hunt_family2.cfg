\* MC_hunt_family2.cfg - Bug Family 2: Authentication State Ordering
\*
\* Target: NoPhantomAuth, AuthStateConsistency
\*
\* Open question (brief §6.1 MC-1):
\*   Does encap mutual auth failure leave connection_state == AUTHENTICATED
\*   while mutually_authenticated == FALSE?
\*
\* Historical: commit b1942fee / Issue #3059 - AUTHENTICATED set before encap;
\*   if encap fails, state remains AUTHENTICATED.
\*
\* Strategy:
\*   1. VerifyResponder fires (sets resp_authenticated=TRUE)
\*   2. Encap flow starts (any variant with CHALLENGE: BASIC_PK or BASIC_CERT)
\*   3. EncapError fires on CHALLENGE op (partial reset + auth limbo)
\*   4. NoPhantomAuth should be VIOLATED in the buggy implementation
\*
\* Restrict to variants with CHALLENGE to make the bug reachable quickly.
\* MaxEncapErrLimit = 1 allows exactly one error (the CHALLENGE failure).

CONSTANTS
    MAX_REQUEST_ID = 5

    OP_NONE            = OP_NONE
    OP_GET_DIGESTS     = OP_GET_DIGESTS
    OP_GET_CERTIFICATE = OP_GET_CERTIFICATE
    OP_CHALLENGE       = OP_CHALLENGE

    VAR_NO_ENCAP           = VAR_NO_ENCAP
    VAR_WITH_ENCAP_REQUEST = VAR_WITH_ENCAP_REQUEST
    VAR_WITH_GET_DIGESTS   = VAR_WITH_GET_DIGESTS
    VAR_BASIC_PK           = VAR_BASIC_PK
    VAR_BASIC_CERT         = VAR_BASIC_CERT

    RS_NORMAL           = RS_NORMAL
    RS_PROCESSING_ENCAP = RS_PROCESSING_ENCAP

    MaxNotReadyLimit = 0   \* no NOT_READY; focus on EncapError path
    MaxEncapErrLimit = 1   \* exactly one error to trigger auth limbo

INIT MCInit
NEXT MCNext

CONSTRAINT MCStateConstraint

\* Structural
INVARIANT TypeOK
\* Family 2 targets
INVARIANT NoPhantomAuth
INVARIANT AuthStateConsistency
\* Composite (catches any path that sets mutually_authenticated without full encap)
INVARIANT FullMutualAuthRequiresEncapComplete
