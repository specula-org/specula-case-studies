\* MC.cfg - standard model checking config
\* Extension (bug-family) invariants are listed but COMMENTED OUT.
\* Run this config during spec convergence/validation.
\* Run MC_hunt_family*.cfg configs to hunt for real bugs.

CONSTANTS
    MAX_REQUEST_ID = 6

    \* Op-codes (model values)
    OP_NONE            = OP_NONE
    OP_GET_DIGESTS     = OP_GET_DIGESTS
    OP_GET_CERTIFICATE = OP_GET_CERTIFICATE
    OP_CHALLENGE       = OP_CHALLENGE

    \* Mutual auth variants (model values)
    VAR_NO_ENCAP           = VAR_NO_ENCAP
    VAR_WITH_ENCAP_REQUEST = VAR_WITH_ENCAP_REQUEST
    VAR_WITH_GET_DIGESTS   = VAR_WITH_GET_DIGESTS
    VAR_BASIC_PK           = VAR_BASIC_PK
    VAR_BASIC_CERT         = VAR_BASIC_CERT

    \* Response states (model values)
    RS_NORMAL           = RS_NORMAL
    RS_PROCESSING_ENCAP = RS_PROCESSING_ENCAP

    \* Fault injection bounds (relaxed for convergence check)
    MaxNotReadyLimit = 2
    MaxEncapErrLimit = 2

INIT MCInit
NEXT MCNext

CONSTRAINT MCStateConstraint

\* --- Structural invariants (always enabled) ---
INVARIANT TypeOK

\* --- Extension invariants (bug-family specific) ---
\* Comment these out during convergence; enable one at a time in hunt configs.
\*
\* Family 1
\*INVARIANT EncapSequenceTerminates
\*INVARIANT RequestIdMonotonic
\*
\* Family 2
\*INVARIANT AuthStateConsistency
\*INVARIANT NoPhantomAuth
\*
\* Family 3
\*INVARIANT ChallengeAuthBinding
\*INVARIANT CertChainReceivedBeforeChallenge
\*
\* Family 4
\*INVARIANT NoPartialAuthState
\*
\* Composite
\*INVARIANT FullMutualAuthRequiresEncapComplete
