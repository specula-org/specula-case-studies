\* MC_hunt_family4.cfg - Bug Family 4: Encap Error Code Path / State Reset
\*
\* Target: NoPartialAuthState
\*
\* Open question (brief §6.1 MC-3):
\*   After a non-NOT_READY error from libspdm_process_encapsulated_response,
\*   is response_state=NORMAL but cur_op!=0 (half-reset context)?
\*   Does this inconsistent state persist and affect a subsequent exchange?
\*
\* Code evidence: rsp_encap_response.c:467-470
\*   response_state = NORMAL     <- line 468
\*   current_request_op_code     <- NOT zeroed (bug)
\*
\* Strategy:
\*   EncapError fires at any active op.
\*   NoPartialAuthState should be VIOLATED: response_state=NORMAL, cur_op!=0.
\*   MaxEncapErrLimit=1: minimal fault injection; violation is immediate.

CONSTANTS
    MAX_REQUEST_ID = 4

    OP_NONE            = OP_NONE
    OP_GET_DIGESTS     = OP_GET_DIGESTS
    OP_GET_CERTIFICATE = OP_GET_CERTIFICATE
    OP_CHALLENGE       = OP_CHALLENGE

    VAR_NO_ENCAP           = VAR_NO_ENCAP
    VAR_WITH_ENCAP_REQUEST = VAR_WITH_ENCAP_REQUEST
    VAR_WITH_GET_DIGESTS   = VAR_WITH_GET_DIGESTS
    VAR_BASIC_PK           = VAR_BASIC_PK
    VAR_BASIC_CERT         = VAR_BASIC_CERT

    RS_NORMAL           = RS_NORMAL
    RS_PROCESSING_ENCAP = RS_PROCESSING_ENCAP

    MaxNotReadyLimit = 0   \* irrelevant for partial-reset check; NOT_READY terminates cleanly
    MaxEncapErrLimit = 1   \* one error is enough to expose the partial-reset state

INIT MCInit
NEXT MCNext

CONSTRAINT MCStateConstraint

\* Structural
INVARIANT TypeOK
\* Family 4 target
INVARIANT NoPartialAuthState
