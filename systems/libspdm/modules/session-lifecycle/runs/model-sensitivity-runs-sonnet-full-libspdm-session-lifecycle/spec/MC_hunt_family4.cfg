\* Hunt config for Family 4: last_key_update_request Stuck After Rollback
\* Target invariant: UpdateKeyStateMachineNotStuck
\* Target finding MC1: after DecodeWithBackupKey with non-VERIFY_NEW_KEY message,
\*   rsp_last_key_op stays non-none; subsequent UPDATE_KEY rejected as INVALID_REQUEST
\*   rsp_receive_send.c:249-263 (no reset) + rsp_key_update_ack.c:115-121
\*
\* Tight bounds: maximize decode-backup events; keep key-update flow open;
\*   minimize unrelated noise.

SPECIFICATION MCSpec

CONSTANTS
    MaxKeyGen         = 8
    MaxDropReqToRsp   = 1
    MaxDropRspToReq   = 1
    MaxDecodeBackup   = 3
    MaxWatchdogExpiry = 0
    MaxRspEncodeFail  = 0
    MaxMsgBuffer      = 6

CONSTRAINT MCMsgBufferConstraint
CONSTRAINT KeyGenBounded

INVARIANTS
    ValidSessionStates
    ValidKeyStates
    UpdateKeyStateMachineNotStuck
