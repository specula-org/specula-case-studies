\* Hunt config for Family 3: Heartbeat Liveness and Session State Consistency
\* Target invariant: WatchdogLiveness
\* Target: confirm non-HEARTBEAT messages serve as keep-alives;
\*   watchdog stops only on END_SESSION_ACK not on other termination paths
\*   rsp_receive_send.c:779-791 vs 735-736
\*
\* Keep watchdog and heartbeat bounds generous; reduce key-update noise.

SPECIFICATION MCSpec

CONSTANTS
    MaxKeyGen         = 2
    MaxDropReqToRsp   = 1
    MaxDropRspToReq   = 1
    MaxDecodeBackup   = 0
    MaxWatchdogExpiry = 3
    MaxRspEncodeFail  = 0
    MaxMsgBuffer      = 6

CONSTRAINT MCMsgBufferConstraint
CONSTRAINT KeyGenBounded

INVARIANTS
    ValidSessionStates
    ValidKeyStates
    WatchdogLiveness
