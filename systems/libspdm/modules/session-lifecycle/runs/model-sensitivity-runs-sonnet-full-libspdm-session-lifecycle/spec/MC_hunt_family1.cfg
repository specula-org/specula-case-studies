\* Hunt config for Family 1: Two-Party Key Update State Desynchronization
\* Target invariants: KeySynchronization, BackupKeyWindow
\* Target finding MC2: double create_update producing key gen N+2 on responder while
\*   requester is at N+1 (rsp_receive_send.c:255-263 + rsp_key_update_ack.c)
\*
\* Tight bounds: focus on key update flow; reduce end-session and watchdog noise.

SPECIFICATION MCSpec

CONSTANTS
    MaxKeyGen         = 7
    MaxDropReqToRsp   = 1
    MaxDropRspToReq   = 1
    MaxDecodeBackup   = 2
    MaxWatchdogExpiry = 0
    MaxRspEncodeFail  = 0
    MaxMsgBuffer      = 6

CONSTRAINT MCMsgBufferConstraint
CONSTRAINT KeyGenBounded

INVARIANTS
    ValidSessionStates
    ValidKeyStates
    KeySynchronization
    BackupKeyWindow
