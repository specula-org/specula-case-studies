SPECIFICATION MCSpec

CONSTANTS
    MaxKeyGen         = 6
    MaxDropReqToRsp   = 2
    MaxDropRspToReq   = 2
    MaxDecodeBackup   = 2
    MaxWatchdogExpiry = 2
    MaxRspEncodeFail  = 1
    MaxMsgBuffer      = 6

CONSTRAINT MCMsgBufferConstraint
CONSTRAINT KeyGenBounded

\* --- Structural invariants (always enabled) ---
INVARIANTS
    ValidSessionStates
    ValidKeyStates

\* --- Core safety invariants (always enabled) ---
\* INVARIANTS
\*     KeySynchronization
\*     BackupKeyWindow
\*     SessionTerminationConsistency
\*     SessionMonotonicity

\* --- Bug-family extension invariants (COMMENTED OUT for spec convergence; enable in hunt cfgs) ---
\* Family 4: MC_hunt_family4.cfg
\* INVARIANTS UpdateKeyStateMachineNotStuck
\* Family 1: MC_hunt_family1.cfg
\* INVARIANTS KeySynchronization
\* INVARIANTS BackupKeyWindow
\* Family 2: MC_hunt_family2.cfg
\* INVARIANTS SessionTerminationConsistency
\* INVARIANTS SessionMonotonicity
\* Family 3: MC_hunt_family3.cfg
\* INVARIANTS WatchdogLiveness
