\* Hunt config for Family 2: END_SESSION Phase Ordering and Session Cleanup
\* Target invariants: SessionTerminationConsistency, SessionMonotonicity
\* Target finding MC3: encode failure leaves rsp ESTABLISHED while req is NOT_STARTED
\*   rsp_receive_send.c:779-793: transport_encode_message failure path
\*
\* Tight bounds: maximize encode-fail injection; zero key-update and watchdog noise.

SPECIFICATION MCSpec

CONSTANTS
    MaxKeyGen         = 2
    MaxDropReqToRsp   = 1
    MaxDropRspToReq   = 1
    MaxDecodeBackup   = 0
    MaxWatchdogExpiry = 0
    MaxRspEncodeFail  = 2
    MaxMsgBuffer      = 4

CONSTRAINT MCMsgBufferConstraint
CONSTRAINT KeyGenBounded

INVARIANTS
    ValidSessionStates
    ValidKeyStates
    SessionTerminationConsistency
    SessionMonotonicity
