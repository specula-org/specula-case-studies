\* Hunting config for Family 3: First-Chunk vs. Continuation Size Asymmetry
\*
\* Bug: Maximum chunk size calculation differs between first CHUNK_SEND
\* and continuation chunks. First chunk subtracts sizeof(uint32_t) for
\* message size field, but continuation doesn't. This asymmetry could
\* cause off-by-one errors in payload boundary checking.
\*
\* Target invariants: FirstChunkBoundary, ContinuationChunkBoundary
\* Reference: libspdm_rsp_chunk_send_ack.c:115-118 vs. 162-164
\* GitHub Issue: None filed yet (medium priority)

CONSTANT MaxMessageSize = 256
CONSTANT MaxChunkSize = 64
CONSTANT MaxCapacity = 256
CONSTANT SPDMVersion = "1.3"
CONSTANT MaxSequenceNumber = 65536

INIT MCInit
NEXT MCNext

\* ============================================================================
\* TIGHT BOUNDS FOR FAMILY 3 HUNTING
\* ============================================================================
\* Exercise both first-chunk and continuation paths with boundary sizes

\* One init for first chunk
InitLimit <- 1
\* Multiple continuations to exercise size calculation inconsistency
ContLimit <- 4
\* Minimal other actions
TimeoutLimit <- 1
CrashLimit <- 0
LossLimit <- 0

\* ============================================================================
\* CORE SAFETY INVARIANTS
\* ============================================================================
INVARIANT ChunkSequenceValid
INVARIANT ReassemblyCapacity
INVARIANT ChunkContextConsistent
INVARIANT BufferConsistent

\* ============================================================================
\* TARGET INVARIANTS FOR BUG HUNTING
\* ============================================================================
\* Detect off-by-one errors in size calculations
INVARIANT FirstChunkBoundary
INVARIANT ContinuationChunkBoundary
