\* Hunting config for Family 2: Sequence Number Wrap Detection Asymmetry
\*
\* Bug: Sequence number wrapping is handled differently across SPDM versions.
\* For SPDM 1.2/1.3 (16-bit seq_no), wrap-around to 0 should be rejected as error.
\* For SPDM 1.4+ (32-bit seq_no), wrapping is not checked.
\*
\* Target invariant: SeqNoContinuity
\* Reference: libspdm_rsp_chunk_send_ack.c:125-127, 188-190
\* GitHub Issue: None filed yet (medium priority)

CONSTANT MaxMessageSize = 128
CONSTANT MaxChunkSize = 32
CONSTANT MaxCapacity = 128
\* Use SPDM 1.3 to trigger wrap detection logic
CONSTANT SPDMVersion = "1.3"
\* Set to 16-bit max to enable wrap-around scenarios
CONSTANT MaxSequenceNumber = 65536

INIT MCInit
NEXT MCNext

\* ============================================================================
\* TIGHT BOUNDS FOR FAMILY 2 HUNTING
\* ============================================================================
\* Focus on chunk continuation with sequence number progression

\* One init to start transfer
InitLimit <- 1
\* Multiple continuations to exercise seq_no progression toward wrap
ContLimit <- 8
\* Minimal other actions
TimeoutLimit <- 1
CrashLimit <- 0
LossLimit <- 0

\* ============================================================================
\* CORE SAFETY INVARIANTS
\* ============================================================================
INVARIANT ChunkSequenceValid
INVARIANT ReassemblyCapacity
INVARIANT ChunkContextConsistent
INVARIANT BufferConsistent

\* ============================================================================
\* TARGET INVARIANT FOR BUG HUNTING
\* ============================================================================
\* Detect sequence number wrap-around errors in SPDM 1.2/1.3
INVARIANT SeqNoContinuity
