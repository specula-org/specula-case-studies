\* Hunting config for Family 4: Unverified Buffer Capacity and Boundary Conditions
\*
\* Bug: The responder allocates large message in scratch buffer (line 149-152)
\* without explicit bounds check against incoming large_message_size.
\* If large_message_size exceeds allocated capacity, memcpy operations
\* (lines 156, 193) could overflow.
\*
\* Target invariant: ReassemblyCapacity, ReassemblyComplete
\* Reference: libspdm_rsp_chunk_send_ack.c:149-152, 156-158, 193-196
\* GitHub Issue: #2302 (buffer sizing concerns)

CONSTANT MaxMessageSize = 128
CONSTANT MaxChunkSize = 32
CONSTANT MaxCapacity = 128
CONSTANT SPDMVersion = "1.3"
CONSTANT MaxSequenceNumber = 65536

INIT MCInit
NEXT MCNext

\* ============================================================================
\* TIGHT BOUNDS FOR FAMILY 4 HUNTING
\* ============================================================================
\* Exercise reassembly with large messages near capacity limits

\* One init with large message size
InitLimit <- 1
\* Multiple continuations to fill buffer toward capacity
ContLimit <- 6
\* Minimal other actions
TimeoutLimit <- 0
CrashLimit <- 1
LossLimit <- 0

\* ============================================================================
\* CORE SAFETY INVARIANTS
\* ============================================================================
INVARIANT ChunkSequenceValid
INVARIANT ChunkContextConsistent
INVARIANT BufferConsistent

\* ============================================================================
\* TARGET INVARIANTS FOR BUG HUNTING
\* ============================================================================
\* Detect buffer overflow and capacity violations
INVARIANT ReassemblyCapacity
INVARIANT ReassemblyComplete
