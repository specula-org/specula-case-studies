\* Model Checking configuration for SPDM chunking
\* Standard safety properties (spec convergence)

CONSTANT MaxMessageSize = 32
CONSTANT MaxChunkSize = 4
CONSTANT MaxCapacity = 32
CONSTANT SPDMVersion = "1.3"
CONSTANT MaxSequenceNumber = 65536

INIT MCInit
NEXT MCNext

\* ============================================================================
\* CORE SAFETY INVARIANTS (always enabled)
\* ============================================================================
INVARIANT ChunkSequenceValid
INVARIANT ReassemblyCapacity
INVARIANT ChunkContextConsistent
INVARIANT BufferConsistent

\* ============================================================================
\* EXTENSION INVARIANTS - FAMILY-SPECIFIC (commented out for standard runs)
\* ============================================================================
\* Uncomment specific families during bug hunting with MC_hunt_*.cfg

\* Family 1: Improper Interruption Handling
\* INVARIANT ChunkTransferPreservation

\* Family 2: Sequence Number Wrap Detection
\* INVARIANT SeqNoContinuity

\* Family 3: First-Chunk vs. Continuation Size Asymmetry
\* INVARIANT FirstChunkBoundary
\* INVARIANT ContinuationChunkBoundary

\* Family 4: Buffer Capacity and Boundaries
\* INVARIANT ReassemblyComplete

\* Family 5: State Cleanup on Error Path
\* INVARIANT BufferValidityAfterError
\* INVARIANT StateCleanupAfterInterruption
