\* Hunting config for Family 5: State Cleanup on Error Path
\*
\* Bug: When error occurs during chunk reassembly (line 230-254), chunk
\* state is cleared but partially-reassembled message buffer is not invalidated.
\* This could lead to stale data persisting in scratch buffer and being
\* accidentally reused, or memory leaks if buffer not returned to allocator.
\*
\* Target invariants: BufferValidityAfterError, StateCleanupAfterInterruption
\* Reference: libspdm_rsp_chunk_send_ack.c:249-254
\* GitHub Issue: #524 (related cleanup gap)

CONSTANT MaxMessageSize = 128
CONSTANT MaxChunkSize = 32
CONSTANT MaxCapacity = 128
CONSTANT SPDMVersion = "1.3"
CONSTANT MaxSequenceNumber = 65536

INIT MCInit
NEXT MCNext

\* ============================================================================
\* TIGHT BOUNDS FOR FAMILY 5 HUNTING
\* ============================================================================
\* Exercise error paths and recovery with focus on cleanup

\* One init to start transfer
InitLimit <- 1
\* Continuation to get partial data into buffer
ContLimit <- 2
\* Crashes to trigger error conditions
CrashLimit <- 3
\* Timeouts to test recovery after errors
TimeoutLimit <- 2
\* Some message loss to simulate error conditions
LossLimit <- 2

\* ============================================================================
\* CORE SAFETY INVARIANTS
\* ============================================================================
INVARIANT ChunkSequenceValid
INVARIANT ChunkContextConsistent
INVARIANT BufferConsistent

\* ============================================================================
\* TARGET INVARIANTS FOR BUG HUNTING
\* ============================================================================
\* Detect stale buffer access and incomplete cleanup
INVARIANT BufferValidityAfterError
INVARIANT StateCleanupAfterInterruption
