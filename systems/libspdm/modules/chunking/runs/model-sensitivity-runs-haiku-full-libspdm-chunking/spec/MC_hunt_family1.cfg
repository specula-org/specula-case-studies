\* Hunting config for Family 1: Improper Interruption Handling
\*
\* Bug: When an interrupting command (excluding GET_VERSION, DecryptError)
\* is received during chunk transfer, the implementation clears the
\* chunk context state instead of preserving it and rejecting the command.
\*
\* Target invariant: ChunkTransferPreservation
\* Reference: libspdm_rsp_receive_send.c:558-583 (lines 561-571, 572-582)
\* GitHub Issue: #3577 (OPEN, 2026-03-31)

CONSTANT MaxMessageSize = 128
CONSTANT MaxChunkSize = 32
CONSTANT MaxCapacity = 128
CONSTANT SPDMVersion = "1.3"
CONSTANT MaxSequenceNumber = 65536

INIT MCInit
NEXT MCNext

\* ============================================================================
\* TIGHT BOUNDS FOR FAMILY 1 HUNTING
\* ============================================================================
\* Reduce irrelevant actions to trigger target bug mechanism

\* Moderate bounds: allow one chunk init
InitLimit <- 1
\* No continuation (focus on first chunk + interruption)
ContLimit <- 0
\* Multiple timeouts to trigger interruptions
TimeoutLimit <- 4
\* No crashes/losses (focus on interruption handling)
CrashLimit <- 0
LossLimit <- 0

\* ============================================================================
\* CORE SAFETY INVARIANTS (required baseline)
\* ============================================================================
INVARIANT ChunkSequenceValid
INVARIANT ReassemblyCapacity
INVARIANT ChunkContextConsistent
INVARIANT BufferConsistent

\* ============================================================================
\* TARGET INVARIANT FOR BUG HUNTING
\* ============================================================================
\* This is the bug-detection invariant that should be violated
\* if the buggy interruption handling is triggered.
INVARIANT ChunkTransferPreservation
