SPECIFICATION TraceSpec

CONSTANTS
    MaxChunks = 8
    MaxLargeSize = 65536
    HeaderOverhead = 4
    ResponseCapacity = 65536
    NULL = "null"

\* Safety invariants that hold on every correct execution (no fault injection)
INVARIANTS
    TypeOK
    SendBytesInRange
    GetBytesInRange
    RequesterBytesInRange
    LargeMessageSizeConsistent

\* Temporal property: the entire trace must be consumed
PROPERTIES
    TraceMatched
