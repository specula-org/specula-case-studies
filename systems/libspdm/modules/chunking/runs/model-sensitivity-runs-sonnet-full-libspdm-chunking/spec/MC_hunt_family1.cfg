\* MC_hunt_family1.cfg — Hunt for Family 1: Transfer Termination Condition Incompleteness
\*
\* Target invariant: TransferCompleteImpliesLastChunk
\* Open question (MC1): Can the CHUNK_GET flow return SUCCESS when all declared bytes were
\*   received but LAST_CHUNK was never set on the final fragment?
\*
\* Setup: shrink unrelated faults to 0; allow source-bound faults so the loop can finish.
\*   ResponseCapacity is set large enough that buffer-overflow does not dominate.

SPECIFICATION MCSpec

CONSTANTS
    MaxChunks = 3
    MaxLargeSize = 8
    HeaderOverhead = 2
    ResponseCapacity = 16
    NULL = "null"
    MaxSourceBoundFaults = 0
    MaxMidSendChunkGet   = 0
    MaxInvalidSeqNo      = 0
    MaxBufferOverflow    = 0
    MaxMsgBuffer = 6

CONSTRAINT MCMsgBufConstraint

INVARIANTS
    MCTypeOK
    MCSendBytesInRange
    MCGetBytesInRange
    MCRequesterBytesInRange
    \* Target: violated when loop exits on byte-count without LAST_CHUNK
    MCTransferCompleteImpliesLastChunk
