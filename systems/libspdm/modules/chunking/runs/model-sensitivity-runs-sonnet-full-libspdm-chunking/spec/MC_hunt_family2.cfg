\* MC_hunt_family2.cfg — Hunt for Family 2: Control-Flow Ordering / Seq-No Mismatch
\*
\* Target invariant: NoStateAdvanceOnSeqNoMismatch
\* Open question (MC2): When a CHUNK_SEND arrives with chunk_seq_no ≠ expected+1, can
\*   chunk_bytes_transferred and the accumulation buffer advance?
\*
\* Setup: allow exactly 2 invalid-seq-no firings (need at least 1 to expose the bug);
\*   disable all other fault types.

SPECIFICATION MCSpec

CONSTANTS
    MaxChunks = 3
    MaxLargeSize = 8
    HeaderOverhead = 2
    ResponseCapacity = 16
    NULL = "null"
    MaxSourceBoundFaults = 0
    MaxMidSendChunkGet   = 0
    MaxInvalidSeqNo      = 2
    MaxBufferOverflow    = 0
    MaxMsgBuffer = 6

CONSTRAINT MCMsgBufConstraint

INVARIANTS
    MCTypeOK
    MCSendBytesInRange
    MCRequesterBytesInRange
    \* Target: violated when state advances despite seq-no mismatch
    MCNoStateAdvanceOnSeqNoMismatch
