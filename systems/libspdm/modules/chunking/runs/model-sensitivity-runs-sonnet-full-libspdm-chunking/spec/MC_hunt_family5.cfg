\* MC_hunt_family5.cfg — Hunt for Family 5: Mutual Exclusion Asymmetry
\*
\* Target invariant: SingleDirectionAtATime
\* Open question (MC5): Can a CHUNK_GET complete successfully while send_in_use is TRUE,
\*   leaving both chunk directions simultaneously active?
\*
\* Setup: allow mid-SEND CHUNK_GET firings; start a CHUNK_SEND transfer first,
\*   then inject CHUNK_GET. Need 2 firings: one to initiate GET, one to serve it.

SPECIFICATION MCSpec

CONSTANTS
    MaxChunks = 3
    MaxLargeSize = 8
    HeaderOverhead = 2
    ResponseCapacity = 16
    NULL = "null"
    MaxSourceBoundFaults = 0
    MaxMidSendChunkGet   = 2
    MaxInvalidSeqNo      = 0
    MaxBufferOverflow    = 0
    MaxMsgBuffer = 8

CONSTRAINT MCMsgBufConstraint

INVARIANTS
    MCTypeOK
    MCSendBytesInRange
    MCGetBytesInRange
    MCRequesterBytesInRange
    \* Target: violated when send_in_use AND get_in_use simultaneously
    MCSingleDirectionAtATime
