\* MC_hunt_family4.cfg — Hunt for Family 4: Source-Length Unbounded in Reassembly Copy
\*
\* Target invariant: SourceBoundedness
\* Open question (MC4): Can a responder-controlled chunk_size field exceed
\*   received_msg_size - HeaderOverhead, making libspdm_copy_mem read past the buffer?
\*
\* Setup: allow source-bound faults; disable all other faults.
\*   Set HeaderOverhead to a concrete value that makes the over-read observable.

SPECIFICATION MCSpec

CONSTANTS
    MaxChunks = 3
    MaxLargeSize = 8
    HeaderOverhead = 4
    ResponseCapacity = 16
    NULL = "null"
    MaxSourceBoundFaults = 2
    MaxMidSendChunkGet   = 0
    MaxInvalidSeqNo      = 0
    MaxBufferOverflow    = 0
    MaxMsgBuffer = 6

CONSTRAINT MCMsgBufConstraint

INVARIANTS
    MCTypeOK
    MCRequesterBytesInRange
    \* Target: violated when chunk_size > received_msg_size - HeaderOverhead is accepted
    MCSourceBoundedness
