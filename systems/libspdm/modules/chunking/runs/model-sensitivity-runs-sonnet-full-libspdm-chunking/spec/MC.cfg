SPECIFICATION MCSpec

CONSTANTS
    MaxChunks = 4
    MaxLargeSize = 16
    HeaderOverhead = 4
    ResponseCapacity = 12
    NULL = "null"
    MaxSourceBoundFaults = 2
    MaxMidSendChunkGet = 2
    MaxInvalidSeqNo = 2
    MaxBufferOverflow = 2
    MaxMsgBuffer = 8

CONSTRAINT MCMsgBufConstraint

\* Always-on: structural + standard safety invariants
INVARIANTS
    MCTypeOK
    MCSendBytesInRange
    MCGetBytesInRange
    MCRequesterBytesInRange
    MCLargeMessageSizeConsistent

\* Extension (bug-hunting) invariants — commented out for convergence run.
\* Enable exactly one per MC_hunt_*.cfg.
\* INVARIANTS
\*     MCTransferCompleteImpliesLastChunk
\*     MCNoStateAdvanceOnSeqNoMismatch
\*     MCSuccessImpliesOutputWritten
\*     MCSourceBoundedness
\*     MCSingleDirectionAtATime
