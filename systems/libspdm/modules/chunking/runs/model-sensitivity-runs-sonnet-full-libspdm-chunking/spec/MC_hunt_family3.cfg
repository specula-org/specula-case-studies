\* MC_hunt_family3.cfg — Hunt for Family 3: Reassembly Output Validity After Completion
\*
\* Target invariant: SuccessImpliesOutputWritten
\* Open question (MC3): Can the CHUNK_GET loop return SUCCESS with *inout_response_size
\*   unchanged and inout_response unmodified (buffer too small case, missing else branch)?
\*
\* Setup: set ResponseCapacity below MaxLargeSize so buffer-overflow path is reachable;
\*   allow exactly 1 buffer-overflow firing; disable other faults.

SPECIFICATION MCSpec

CONSTANTS
    MaxChunks = 3
    MaxLargeSize = 12
    HeaderOverhead = 2
    ResponseCapacity = 8
    NULL = "null"
    MaxSourceBoundFaults = 0
    MaxMidSendChunkGet   = 0
    MaxInvalidSeqNo      = 0
    MaxBufferOverflow    = 1
    MaxMsgBuffer = 6

CONSTRAINT MCMsgBufConstraint

INVARIANTS
    MCTypeOK
    MCGetBytesInRange
    MCRequesterBytesInRange
    \* Target: violated when SUCCESS returned with output_written=FALSE
    MCSuccessImpliesOutputWritten
