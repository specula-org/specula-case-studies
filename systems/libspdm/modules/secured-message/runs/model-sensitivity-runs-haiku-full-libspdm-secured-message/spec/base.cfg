CONSTANT
    MaxSeqNum = 3
    MaxKeyUpdateOps = 2
    NumSessions = 2
    SessionIDs = {sid_0, sid_1}
    Roles = {requester, responder}

INVARIANT EndianStableAfterDetermination
INVARIANT KeyUpdateSynchronized
INVARIANT BackupValidConsistency
INVARIANT NoRollbackAfterConfirm
INVARIANT SessionStateTransitionLinear
INVARIANT SecretsZeroizedAfterTransition
INVARIANT SequenceNumberBounded
INVARIANT SequenceNumberOverflowPolicy
INVARIANT IVDeterministic
