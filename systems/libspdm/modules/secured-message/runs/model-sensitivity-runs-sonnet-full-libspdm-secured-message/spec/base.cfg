\* Base spec configuration for SecuredMessage
\* Used by MC.tla and Trace.tla via EXTENDS / INSTANCE.

CONSTANTS
    Requester     = Requester
    Responder     = Responder
    RequestDir    = RequestDir
    ResponseDir   = ResponseDir
    Idle          = Idle
    PendingAck    = PendingAck
    PendingVerify = PendingVerify
    MaxEpoch      = 3
    MaxSeq        = 8

    \* Message type constants
    MSG_DATA               = MSG_DATA
    MSG_KEY_UPDATE         = MSG_KEY_UPDATE
    MSG_KEY_UPDATE_ACK     = MSG_KEY_UPDATE_ACK
    MSG_VERIFY_NEW_KEY     = MSG_VERIFY_NEW_KEY
    MSG_VERIFY_ACK         = MSG_VERIFY_ACK
    MSG_RESPONSE_NOT_READY = MSG_RESPONSE_NOT_READY

SPECIFICATION Spec

\* Core safety invariants (always enabled)
INVARIANTS
    KeyAgreement
    SeqMonotonicity
    BackupValidConsistency
    RollbackSafety
    VerifyNewKeyCommit
