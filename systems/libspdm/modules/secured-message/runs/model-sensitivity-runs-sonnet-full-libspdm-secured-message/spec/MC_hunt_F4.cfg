\* Hunt config: Family 4 – Sequence Epoch Consistency After Key Update + Rollback
\*
\* Open question (from brief §6.1):
\*   MC2: can the RESPONSE_NOT_READY re-create loop (rollback → decode error → re-create)
\*        result in a backup_seq that does not match the remote side's next expected seq,
\*        causing a cascade of decode failures?
\*   → SeqMonotonicity and RollbackSafety invariants.
\*
\* Strategy: allow key-update initiation + RESPONSE_NOT_READY injection to force the
\*   rollback-re-create path; check that backup_seq and active_epoch remain consistent.
\*   Use MaxKeyUpdateInit=2 to allow epoch transitions where the seq-epoch consistency
\*   matters (issues appear after the first full update cycle).

CONSTANTS
    Requester     = Requester
    Responder     = Responder
    RequestDir    = RequestDir
    ResponseDir   = ResponseDir
    Idle          = Idle
    PendingAck    = PendingAck
    PendingVerify = PendingVerify
    MaxEpoch      = 3
    MaxSeq        = 8

    MSG_DATA               = MSG_DATA
    MSG_KEY_UPDATE         = MSG_KEY_UPDATE
    MSG_KEY_UPDATE_ACK     = MSG_KEY_UPDATE_ACK
    MSG_VERIFY_NEW_KEY     = MSG_VERIFY_NEW_KEY
    MSG_VERIFY_ACK         = MSG_VERIFY_ACK
    MSG_RESPONSE_NOT_READY = MSG_RESPONSE_NOT_READY

    MaxWrongSessionId   = 0    \* disabled
    MaxAEADFailure      = 1    \* allow one AEAD failure in the re-create loop
    MaxKeyUpdateInit    = 2    \* F4: need at least one full update cycle
    MaxWrongEpochVNK    = 1    \* allow TRY_DISCARD to trigger on responder
    MaxEncapInit        = 0    \* disabled
    MaxResponseNotReady = 3    \* F4: main fault; multiple NOT_READY responses
    MaxMsgBuffer        = 8

SPECIFICATION MCSpec

VIEW MCView

INVARIANTS
    SeqMonotonicity
    RollbackSafety
    MCMsgBufferBound
