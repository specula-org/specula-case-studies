\* Hunt config: Family 3 – Encap vs Non-Encap Key Update Asymmetry
\*
\* Open question (from brief §6.1, CR2):
\*   Encap VERIFY_NEW_KEY in libspdm_get_encap_request_key_update calls create+activate
\*   immediately (no backup window).  backup_valid[Requester][ResponseDir] = FALSE after
\*   this, so SESSION_TRY_DISCARD_KEY_UPDATE cannot fire if the VERIFY_NEW_KEY decode fails
\*   on the requester side.
\*   → KeyAgreement invariant: can the response-direction key permanently mismatch?
\*
\* Strategy: run encap initiations with injected AEAD failures on the encap VERIFY_NEW_KEY.
\*   Disable non-encap key update so the encap-specific path dominates.

CONSTANTS
    Requester     = Requester
    Responder     = Responder
    RequestDir    = RequestDir
    ResponseDir   = ResponseDir
    Idle          = Idle
    PendingAck    = PendingAck
    PendingVerify = PendingVerify
    MaxEpoch      = 3
    MaxSeq        = 6

    MSG_DATA               = MSG_DATA
    MSG_KEY_UPDATE         = MSG_KEY_UPDATE
    MSG_KEY_UPDATE_ACK     = MSG_KEY_UPDATE_ACK
    MSG_VERIFY_NEW_KEY     = MSG_VERIFY_NEW_KEY
    MSG_VERIFY_ACK         = MSG_VERIFY_ACK
    MSG_RESPONSE_NOT_READY = MSG_RESPONSE_NOT_READY

    MaxWrongSessionId   = 0    \* disabled
    MaxAEADFailure      = 2    \* for general decode failures on encap VERIFY_NEW_KEY
    MaxKeyUpdateInit    = 0    \* disabled: focus on encap
    MaxWrongEpochVNK    = 0    \* disabled
    MaxEncapInit        = 3    \* F3: multiple encap initiations
    MaxResponseNotReady = 0    \* disabled
    MaxMsgBuffer        = 6

SPECIFICATION MCSpec

VIEW MCView

INVARIANTS
    KeyAgreement
    MCMsgBufferBound
