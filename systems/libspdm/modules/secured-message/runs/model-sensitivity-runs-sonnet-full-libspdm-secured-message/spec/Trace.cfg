\* Trace validation config for SecuredMessage / Trace.tla

CONSTANTS
    Requester     = Requester
    Responder     = Responder
    RequestDir    = RequestDir
    ResponseDir   = ResponseDir
    Idle          = Idle
    PendingAck    = PendingAck
    PendingVerify = PendingVerify
    MaxEpoch      = 10
    MaxSeq        = 65536

    MSG_DATA               = MSG_DATA
    MSG_KEY_UPDATE         = MSG_KEY_UPDATE
    MSG_KEY_UPDATE_ACK     = MSG_KEY_UPDATE_ACK
    MSG_VERIFY_NEW_KEY     = MSG_VERIFY_NEW_KEY
    MSG_VERIFY_ACK         = MSG_VERIFY_ACK
    MSG_RESPONSE_NOT_READY = MSG_RESPONSE_NOT_READY

SPECIFICATION TraceSpec

CHECK_DEADLOCK FALSE

\* TraceMatched MUST be included; without it TLC reports "no errors" even when l never advances.
PROPERTIES
    TraceMatched

\* Safety invariants that should hold on every real execution.
INVARIANTS
    SeqMonotonicity
    BackupValidConsistency
    VerifyNewKeyCommit
