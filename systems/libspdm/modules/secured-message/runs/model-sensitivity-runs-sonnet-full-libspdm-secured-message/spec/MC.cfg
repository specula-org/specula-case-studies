\* Standard model-checking config for SecuredMessage / MC.tla
\* Run with: tlc MC -config MC.cfg
\*
\* Convention:
\*   - Core safety + structural invariants: ENABLED
\*   - Bug-family (extension) invariants: COMMENTED OUT
\*     → Enable in MC_hunt_*.cfg configs for targeted bug hunting.

CONSTANTS
    Requester     = Requester
    Responder     = Responder
    RequestDir    = RequestDir
    ResponseDir   = ResponseDir
    Idle          = Idle
    PendingAck    = PendingAck
    PendingVerify = PendingVerify
    MaxEpoch      = 3
    MaxSeq        = 6

    MSG_DATA               = MSG_DATA
    MSG_KEY_UPDATE         = MSG_KEY_UPDATE
    MSG_KEY_UPDATE_ACK     = MSG_KEY_UPDATE_ACK
    MSG_VERIFY_NEW_KEY     = MSG_VERIFY_NEW_KEY
    MSG_VERIFY_ACK         = MSG_VERIFY_ACK
    MSG_RESPONSE_NOT_READY = MSG_RESPONSE_NOT_READY

    \* Fault bounds – conservative defaults for spec convergence
    MaxWrongSessionId   = 1
    MaxAEADFailure      = 1
    MaxKeyUpdateInit    = 2
    MaxWrongEpochVNK    = 1
    MaxEncapInit        = 1
    MaxResponseNotReady = 1
    MaxMsgBuffer        = 6

SPECIFICATION MCSpec

VIEW MCView

INVARIANTS
    \* --- Structural (always enabled) ---
    MCMsgBufferBound
    BackupValidConsistency
    VerifyNewKeyCommit

    \* --- Core safety (always enabled) ---
    SeqMonotonicity
    RollbackSafety

    \* --- Extension (bug-family) invariants – COMMENTED OUT for convergence ---
    \* Enable in MC_hunt_*.cfg when hunting specific families.
    \* KeyAgreement
