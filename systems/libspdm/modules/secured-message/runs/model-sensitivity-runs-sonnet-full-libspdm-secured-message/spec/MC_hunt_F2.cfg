\* Hunt config: Family 2 – Key Update State Machine Backup/Commit/Rollback Consistency
\*
\* Open questions (from brief §6.1):
\*   MC1: after VERIFY_NEW_KEY is sent (requester committed, no rollback), can decode failure
\*        on responder cause responder to roll back to old key while requester holds new key?
\*        → KeyAgreement invariant.
\*   MC3: UPDATE_ALL_KEYS flow + concurrent encap update → both sides compute different keys?
\*        → KeyAgreement invariant.
\*   MC4: can backup_valid be TRUE on both sides simultaneously for the same direction?
\*        → BackupValidConsistency invariant.
\*
\* Strategy: multiple key-update initiations with wrong-epoch VERIFY_NEW_KEY injection to
\*   drive ResponderTryDiscardKeyUpdate while initiator_committed = TRUE.
\*   Use MaxKeyUpdateInit=3 to allow the UPDATE_ALL_KEYS + encap overlap scenario (MC3).

CONSTANTS
    Requester     = Requester
    Responder     = Responder
    RequestDir    = RequestDir
    ResponseDir   = ResponseDir
    Idle          = Idle
    PendingAck    = PendingAck
    PendingVerify = PendingVerify
    MaxEpoch      = 4
    MaxSeq        = 6

    MSG_DATA               = MSG_DATA
    MSG_KEY_UPDATE         = MSG_KEY_UPDATE
    MSG_KEY_UPDATE_ACK     = MSG_KEY_UPDATE_ACK
    MSG_VERIFY_NEW_KEY     = MSG_VERIFY_NEW_KEY
    MSG_VERIFY_ACK         = MSG_VERIFY_ACK
    MSG_RESPONSE_NOT_READY = MSG_RESPONSE_NOT_READY

    MaxWrongSessionId   = 0    \* disabled: not the target
    MaxAEADFailure      = 0    \* disabled: not the target
    MaxKeyUpdateInit    = 3    \* F2/MC3: multiple updates needed
    MaxWrongEpochVNK    = 2    \* F2/MC1: drive responder TRY_DISCARD
    MaxEncapInit        = 1    \* MC3: allow encap overlap
    MaxResponseNotReady = 0    \* disabled
    MaxMsgBuffer        = 8

SPECIFICATION MCSpec

VIEW MCView

INVARIANTS
    KeyAgreement
    BackupValidConsistency
    VerifyNewKeyCommit
    MCMsgBufferBound
