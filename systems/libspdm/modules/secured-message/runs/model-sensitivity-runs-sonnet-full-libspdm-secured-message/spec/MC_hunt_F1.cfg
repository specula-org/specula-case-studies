\* Hunt config: Family 1 – Sequence Number Advance Before AEAD / Session-ID Validation
\*
\* Open questions (from brief §6.1):
\*   MC finding: can a single injected wrong-session-id message permanently desynchronize
\*   the sequence counter, making the session unable to process subsequent correct messages?
\*
\* Strategy: allow injections, run up to 2 KEY_UPDATEs (to confirm the bug is not masked by
\*   key rotation), check SeqMonotonicity + SessionContinuity.
\*
\* Tight bounds: disable key-update-specific faults; maximize message-exchange depth.

CONSTANTS
    Requester     = Requester
    Responder     = Responder
    RequestDir    = RequestDir
    ResponseDir   = ResponseDir
    Idle          = Idle
    PendingAck    = PendingAck
    PendingVerify = PendingVerify
    MaxEpoch      = 2
    MaxSeq        = 8

    MSG_DATA               = MSG_DATA
    MSG_KEY_UPDATE         = MSG_KEY_UPDATE
    MSG_KEY_UPDATE_ACK     = MSG_KEY_UPDATE_ACK
    MSG_VERIFY_NEW_KEY     = MSG_VERIFY_NEW_KEY
    MSG_VERIFY_ACK         = MSG_VERIFY_ACK
    MSG_RESPONSE_NOT_READY = MSG_RESPONSE_NOT_READY

    MaxWrongSessionId   = 2    \* F1: main fault
    MaxAEADFailure      = 2    \* F1: main fault
    MaxKeyUpdateInit    = 1    \* reduced: not the target
    MaxWrongEpochVNK    = 0    \* disabled
    MaxEncapInit        = 0    \* disabled
    MaxResponseNotReady = 0    \* disabled
    MaxMsgBuffer        = 8

SPECIFICATION MCSpec

VIEW MCView

INVARIANTS
    SeqMonotonicity
    MCMsgBufferBound
