\* MC.cfg — convergence configuration for tokio::sync::broadcast.
\* Bug-family invariants are listed but commented out so they can be enabled
\* one at a time via MC_hunt_<family>.cfg files.

CONSTANTS
    Receiver = {r1, r2}
    Sender = {s1, s2}
    Capacity = 2
    Value = {v1, v2}
    PosMod = 8
    MaxSubscribe = 2
    MaxSend = 3
    MaxDropRecv = 2
    MaxDropSend = 2
    NoneVal = "NONE"
    NoneSite = "NONESITE"

SPECIFICATION MCSpec

SYMMETRY Symmetry
VIEW View

\* ===== Standard safety + structural invariants =====
INVARIANTS
    TypeOK
    ReceiverCountConsistency
    NotifyHoldsTailWhenDraining
    WaiterQueuedConsistency
    NoSlotLeak

\* ===== Bug-family invariants (commented out — enable in MC_hunt_*.cfg) =====
\*    NoUseAfterFree_Waiter         \* Family 1, 4
\*    CloseReopenSemantics          \* Family 2
\*    RxCntPositiveImpliesNotPermanentlyClosed  \* Family 2
\*    NoDoubleRelease               \* Family 5
\*    NoSpuriousLagged              \* Family 5
\*    SubscribeRespectsSendBoundary \* Family 2
\*    ConcurrentDropCloseIdempotent \* Family 1
