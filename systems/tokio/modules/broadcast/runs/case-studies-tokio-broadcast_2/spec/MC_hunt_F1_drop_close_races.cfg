\* MC_hunt_F1_drop_close_races.cfg
\* Family 1 hunt — Cancel / Drop / Close races (PR #2135, #5578, #5925, #6298)
\*
\* Strategy: tight bounds on Send (only need a couple); permissive on Recv,
\* RxDrop, TxDrop, RecvDrop interleavings.  The bug mechanism is the
\* lock-release window between notify_rx phases — exposed via the per-step
\* split of NotifyRx_*.

CONSTANTS
    Receiver = {r1, r2}
    Sender = {s1}
    Capacity = 2
    Value = {v1}
    PosMod = 8
    MaxSubscribe = 1
    MaxSend = 2
    MaxDropRecv = 2
    MaxDropSend = 1
    NoneVal = "NONE"
    NoneSite = "NONESITE"

SPECIFICATION MCSpec
SYMMETRY Symmetry
VIEW View

INVARIANTS
    TypeOK
    NoUseAfterFree_Waiter
    NotifyHoldsTailWhenDraining
    WaiterQueuedConsistency
    ConcurrentDropCloseIdempotent
