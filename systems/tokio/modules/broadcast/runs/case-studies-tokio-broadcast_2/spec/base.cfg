\* base.cfg — minimal config for syntax-checking base.tla.  Real model checking
\* uses MC.cfg with bounded counter-wrapped actions.

CONSTANTS
    Receiver = {r1, r2}
    Sender = {s1, s2}
    Capacity = 2
    Value = {v1, v2}
    PosMod = 8
    MaxSubscribe = 2
    MaxSend = 2
    MaxDropRecv = 2
    MaxDropSend = 2
    NoneVal = "NONE"
    NoneSite = "NONESITE"

SPECIFICATION Spec

INVARIANTS
    TypeOK
    NoUseAfterFree_Waiter
    NotifyHoldsTailWhenDraining
    WaiterQueuedConsistency
