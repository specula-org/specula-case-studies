\* Trace_C2.cfg — trace validation config for scenarios using channel(2).
\* Currently only lagged_receiver uses Capacity=2 in the harness.

CONSTANTS
    Receiver = {"r1", "r2", "r3"}
    Sender = {"s1", "s2"}
    Capacity = 2
    Value = {"1", "2", "3", "10", "20", "30", "42"}
    PosMod = 16
    MaxSubscribe = 8
    MaxSend = 8
    MaxDropRecv = 8
    MaxDropSend = 4
    NoneVal = "NONE"
    NoneSite = "NONESITE"

SPECIFICATION TraceSpec

INVARIANTS
    TraceSafety

PROPERTIES
    TraceMatched
