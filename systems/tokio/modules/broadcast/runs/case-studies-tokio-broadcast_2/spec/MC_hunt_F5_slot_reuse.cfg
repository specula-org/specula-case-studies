\* MC_hunt_F5_slot_reuse.cfg
\* Family 5 hunt — Slot reuse across send waves (PR #2448, #4867)
\*
\* Strategy: small capacity (forces overwrites); multiple sends; one slow
\* receiver to exercise the Lagged classifier.  Bug mechanism: classifier
\* off-by-one or release-twice when wave overwrites a value still owed
\* to the slow receiver.

CONSTANTS
    Receiver = {r1, r2}
    Sender = {s1}
    Capacity = 2
    Value = {v1, v2}
    PosMod = 8
    MaxSubscribe = 1
    MaxSend = 4
    MaxDropRecv = 1
    MaxDropSend = 1
    NoneVal = "NONE"
    NoneSite = "NONESITE"

SPECIFICATION MCSpec
SYMMETRY Symmetry
VIEW View

INVARIANTS
    TypeOK
    NoSlotLeak
    NoDoubleRelease
    NoSpuriousLagged
    SubscribeRespectsSendBoundary
