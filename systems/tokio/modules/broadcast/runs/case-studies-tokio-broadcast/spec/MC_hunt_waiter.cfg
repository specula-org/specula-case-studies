\* ===========================================================================
\* Bug Hunting Config — Family 2: Waiter Notification Protocol
\* ===========================================================================
\* Target: MC-3 (waker re-entrancy deadlock)
\*         MC-4 (re-registration during notification loop)
\*         MC-7 (receiver drop during notification)
\*
\* Strategy: multiple receivers waiting + sends + drops.
\*
\* Run: java -jar tla2tools.jar -deadlock MC -config MC_hunt_waiter.cfg

SPECIFICATION MCSpec

CONSTANTS
    Receiver = {r1, r2, r3}
    Value = {v1}
    Capacity = 2
    MaxPos = 8
    Nil = Nil

    \* Tight bounds: focus on waiter interactions
    MaxSends = 3
    MaxSubscribes = 3
    MaxSenderDrops = 1
    MaxSenderClones = 0

INVARIANTS
    TypeOK
    WaitersAlive
    NoStaleWaiter
    RxCntConsistency
