\* ===========================================================================
\* Bug Hunting Config — Family 4: Position Wraparound / Lag Arithmetic
\* ===========================================================================
\* Target: MC-6 (lag recovery with wrapping positions)
\*         TV-1/TV-2 (non-wrapping arithmetic in len/drop)
\*
\* Strategy: many sends to force position wraparound, then drops.
\* MaxPos intentionally small to force frequent wrapping.
\*
\* Run: java -jar tla2tools.jar -deadlock MC -config MC_hunt_wrap.cfg

SPECIFICATION MCSpec

CONSTANTS
    Receiver = {r1, r2}
    Value = {v1}
    Capacity = 2
    MaxPos = 6            \* Small! Forces wrapping after 6 sends
    Nil = Nil

    \* Tight bounds: many sends to force wrap, then cleanup
    MaxSends = 8          \* Enough to wrap around MaxPos
    MaxSubscribes = 2
    MaxSenderDrops = 1
    MaxSenderClones = 0

SYMMETRY ModelSymmetry

INVARIANTS
    TypeOK
    RemNonNegative
    LagBounded
    ValueLifecycle
    NoOrphanedRem
    RxCntConsistency
