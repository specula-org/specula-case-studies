\* ===========================================================================
\* Bug Hunting Config — Family 1: Channel Close Lifecycle
\* ===========================================================================
\* Target: MC-1 (close window: numTx=0 but closed=false)
\*         MC-2 (zombie channel after subscribe+close)
\*
\* Strategy: multiple senders dropping + subscribe interleaving.
\* Tight bounds: minimize irrelevant actions, focus on close sequence.
\*
\* Run: java -jar tla2tools.jar -deadlock MC -config MC_hunt_close.cfg

SPECIFICATION MCSpec

CONSTANTS
    Receiver = {r1, r2}
    Value = {v1}
    Capacity = 2
    MaxPos = 8
    Nil = Nil

    \* Tight bounds: focus on close interleaving
    MaxSends = 2
    MaxSubscribes = 3
    MaxSenderDrops = 2
    MaxSenderClones = 1

SYMMETRY ModelSymmetry
CONSTRAINT StateConstraint

INVARIANTS
    TypeOK
    RxCntConsistency
    \* Family 1 targets:
    NoEmptyDuringClose
    NoStaleWaiter
