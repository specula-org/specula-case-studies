\* ===========================================================================
\* Bug Hunting Config — Family 3: Slot Value Lifecycle / rem Counter
\* ===========================================================================
\* Target: MC-5 (slot reuse race: sender overwrites while receiver reads)
\*
\* Strategy: multiple sends filling buffer + concurrent reads + drops.
\*
\* Run: java -jar tla2tools.jar -deadlock MC -config MC_hunt_rem.cfg

SPECIFICATION MCSpec

CONSTANTS
    Receiver = {r1, r2}
    Value = {v1, v2}
    Capacity = 2
    MaxPos = 8
    Nil = Nil

    \* Tight bounds: focus on slot lifecycle
    MaxSends = 4
    MaxSubscribes = 2
    MaxSenderDrops = 1
    MaxSenderClones = 0

SYMMETRY ModelSymmetry

INVARIANTS
    TypeOK
    RemNonNegative
    ValueLifecycle
    NoOrphanedRem
    RxCntConsistency
