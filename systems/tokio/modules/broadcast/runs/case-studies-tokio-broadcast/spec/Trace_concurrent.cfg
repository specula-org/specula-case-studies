\* Trace config for concurrent_send_recv (3 receivers)
\* Run with: java -DJSON=../traces/concurrent_send_recv.json -jar tla2tools.jar -deadlock Trace -config Trace_concurrent.cfg

SPECIFICATION TraceSpec

CONSTANTS
    Receiver = {"r1", "r2", "r3"}
    Value = {"v1", "v2"}
    Capacity = 2
    MaxPos = 8
    Nil = "Nil"

PROPERTIES
    TraceMatched

\* Safety invariants that should hold on every real execution
INVARIANTS
    TypeOK
    RemNonNegative
    ValueLifecycle
    LagBounded
    RxCntConsistency
    WaitersAlive
