\* ===========================================================================
\* Trace Validation Configuration
\* ===========================================================================
\* Run with: java -jar tla2tools.jar -deadlock Trace
\* Override trace file: java -DJSON=../traces/my_trace.json -jar tla2tools.jar -deadlock Trace
\*
\* The -deadlock flag DISABLES deadlock checking. The trace terminates
\* naturally when all events are consumed (ThreadsWithEvents = {}).

SPECIFICATION TraceSpec

CONSTANTS
    Receiver = {"r1", "r2"}
    Value = {"v1", "v2"}
    Capacity = 2
    MaxPos = 8
    Nil = "Nil"

PROPERTIES
    TraceMatched

\* Safety invariants that should hold on every real execution
INVARIANTS
    TypeOK
    RemNonNegative
    ValueLifecycle
    LagBounded
    RxCntConsistency
    WaitersAlive
