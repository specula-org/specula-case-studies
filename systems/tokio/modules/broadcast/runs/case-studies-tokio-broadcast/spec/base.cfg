\* ===========================================================================
\* Base Configuration for tokio broadcast channel
\* ===========================================================================
\* Minimal config for syntax/type checking.
\* Use MC.cfg for model checking.

SPECIFICATION Spec

CONSTANTS
    Receiver = {r1, r2}
    Value = {v1}
    Capacity = 2
    MaxPos = 8
    Nil = Nil

INVARIANTS
    TypeOK
    RemNonNegative
    ValueLifecycle
    LagBounded
    CloseConsistency
    RxCntConsistency
    WaitersAlive
    ClosePendingImpliesNoSenders
