\* MC.cfg — Standard safety + structural invariants.
\* Used during spec convergence. Bug-family invariants commented out.

CONSTANTS
    Server = {s1, s2, s3}
    Nil = Nil
    Follower = Follower
    Candidate = Candidate
    Leader = Leader
    ValueEntry = ValueEntry
    ConfigEntry = ConfigEntry
    PreVoteRequest = PreVoteRequest
    PreVoteResponse = PreVoteResponse
    RequestVoteRequest = RequestVoteRequest
    RequestVoteResponse = RequestVoteResponse
    AppendEntriesRequest = AppendEntriesRequest
    AppendEntriesResponse = AppendEntriesResponse

    MaxTerm = 4
    MaxLogLength = 5

    \* Fault injection bounds
    TimeoutLimit = 5
    ClientReqLimit = 3
    CrashLimit = 0
    LoseLimit = 0
    ConfigChangeLimit = 0
    BypassLimit = 0
    AdjustQuorumLimit = 0
    RestoreQuorumLimit = 0
    HeartbeatLimit = 8
    PersistLimit = 5
    MaxMsgCount = 10

INIT MCInit
NEXT MCNext

CONSTRAINT StateConstraint

SYMMETRY ModelSymmetry

\* === Standard Safety Invariants ===
INVARIANTS
    ElectionSafety
    LogMatching
    PrecommitOrdering

\* === Structural Invariants ===
\*INVARIANT CommitIndexBound
\*INVARIANT LogTermPositive
\*INVARIANT CommittedEntriesMatch

\* === Extension Invariants (Bug Family Targets) ===
\* Uncomment individually during bug hunting.
\*
\* Bug Family 1: Precommit/Commit Order
\*INVARIANT PrecommitOrdering
\*
\* Bug Family 2: Non-Atomic Persistence
\*INVARIANT VoteUniqueness
\*INVARIANT CrashRecoveryConsistency
\*
\* Bug Family 3: Config Change Races
\*INVARIANT ConfigChangeAtomicity
\*
\* Bug Family 4: Split-Brain Commit
\*INVARIANT NoSplitBrainCommit
\*
\* Bug Family 5: Stale Response
\*INVARIANT NoStaleMatchIndex
\*
\* Bug Family 7: Leader Completeness
\*INVARIANT LeaderCompleteness
