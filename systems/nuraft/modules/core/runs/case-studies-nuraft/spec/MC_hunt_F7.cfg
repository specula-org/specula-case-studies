\* MC_hunt_F7.cfg — Bug Family 7: Missing Raft Figure 2 Commit Term Check
\*
\* Target: LeaderCompleteness
\* Mechanism: Without the config entry barrier from BecomeLeader,
\*            entries from previous terms can be committed based solely
\*            on quorum, potentially violating Leader Completeness.
\*
\* NOTE: To test this, use MC_noF7.tla which overrides BecomeLeader
\*       to NOT append the config entry. This tests whether the
\*       implicit mitigation is necessary.
\*
\* Tight bounds: multiple elections + client requests.

CONSTANTS
    Server = {s1, s2, s3}
    Nil = Nil
    Follower = Follower
    Candidate = Candidate
    Leader = Leader
    ValueEntry = ValueEntry
    ConfigEntry = ConfigEntry
    PreVoteRequest = PreVoteRequest
    PreVoteResponse = PreVoteResponse
    RequestVoteRequest = RequestVoteRequest
    RequestVoteResponse = RequestVoteResponse
    AppendEntriesRequest = AppendEntriesRequest
    AppendEntriesResponse = AppendEntriesResponse

    MaxTerm = 5
    MaxLogLength = 5

    TimeoutLimit = 5
    ClientReqLimit = 3
    CrashLimit = 0
    LoseLimit = 3
    ConfigChangeLimit = 0
    BypassLimit = 0
    AdjustQuorumLimit = 0
    RestoreQuorumLimit = 0
    HeartbeatLimit = 8
    PersistLimit = 5
    MaxMsgCount = 10

INIT MCInit
NEXT MCNext

CONSTRAINT StateConstraint
SYMMETRY ModelSymmetry

INVARIANTS
    ElectionSafety
    LeaderCompleteness
