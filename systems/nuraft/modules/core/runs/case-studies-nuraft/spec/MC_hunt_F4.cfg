\* MC_hunt_F4.cfg — Bug Family 4: Quorum Calculation / Split-Brain
\*
\* Target: NoSplitBrainCommit
\* Mechanism: 2-node cluster, both nodes independently adjust quorum to 1,
\*            both become leaders and commit different values.
\*
\* Tight bounds: 2-node cluster, enable AdjustQuorum + LoseMessage.

CONSTANTS
    Server = {s1, s2}
    Nil = Nil
    Follower = Follower
    Candidate = Candidate
    Leader = Leader
    ValueEntry = ValueEntry
    ConfigEntry = ConfigEntry
    PreVoteRequest = PreVoteRequest
    PreVoteResponse = PreVoteResponse
    RequestVoteRequest = RequestVoteRequest
    RequestVoteResponse = RequestVoteResponse
    AppendEntriesRequest = AppendEntriesRequest
    AppendEntriesResponse = AppendEntriesResponse

    MaxTerm = 4
    MaxLogLength = 4

    TimeoutLimit = 4
    ClientReqLimit = 2
    CrashLimit = 0
    LoseLimit = 6
    ConfigChangeLimit = 0
    BypassLimit = 0
    AdjustQuorumLimit = 2
    RestoreQuorumLimit = 1
    HeartbeatLimit = 6
    PersistLimit = 4
    MaxMsgCount = 8

INIT MCInit
NEXT MCNext

CONSTRAINT StateConstraint

\* No symmetry for 2-node cluster (too few to benefit)

INVARIANTS
    ElectionSafety
    NoSplitBrainCommit
