\* MC_hunt_F3.cfg — Bug Family 3: Config Change Races
\*
\* Target: ConfigChangeAtomicity
\* Mechanism: BypassConfigGuard (set_priority) creates second
\*            uncommitted config change while configChanging_ is set.
\*
\* Tight bounds: enable ConfigChange + Bypass, minimize elections.

CONSTANTS
    Server = {s1, s2, s3}
    Nil = Nil
    Follower = Follower
    Candidate = Candidate
    Leader = Leader
    ValueEntry = ValueEntry
    ConfigEntry = ConfigEntry
    PreVoteRequest = PreVoteRequest
    PreVoteResponse = PreVoteResponse
    RequestVoteRequest = RequestVoteRequest
    RequestVoteResponse = RequestVoteResponse
    AppendEntriesRequest = AppendEntriesRequest
    AppendEntriesResponse = AppendEntriesResponse

    MaxTerm = 3
    MaxLogLength = 5

    TimeoutLimit = 3
    ClientReqLimit = 1
    CrashLimit = 0
    LoseLimit = 0
    ConfigChangeLimit = 2
    BypassLimit = 2
    AdjustQuorumLimit = 0
    RestoreQuorumLimit = 0
    HeartbeatLimit = 6
    PersistLimit = 3
    MaxMsgCount = 8

INIT MCInit
NEXT MCNext

CONSTRAINT StateConstraint
SYMMETRY ModelSymmetry

INVARIANTS
    ElectionSafety
    ConfigChangeAtomicity
