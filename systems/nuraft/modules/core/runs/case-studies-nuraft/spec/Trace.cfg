\* Trace.cfg — Trace validation configuration for nuraft.
\*
\* Uses INIT/NEXT (not SPECIFICATION) for deadlock-based completion checking.
\* Deadlock at l > Len(TraceLog) means success (all events consumed).
\* Deadlock before that means a trace event couldn't be matched.
\*
\* Override Server constant per trace. Set JSON env var for trace file:
\*   java -jar tla2tools.jar -config Trace.cfg -deadlock \
\*        -DJSON=../traces/basic_consensus.ndjson Trace

CONSTANTS
    Server = {"s1", "s2", "s3"}
    Nil = Nil
    Follower = Follower
    Candidate = Candidate
    Leader = Leader
    ValueEntry = ValueEntry
    ConfigEntry = ConfigEntry
    PreVoteRequest = PreVoteRequest
    PreVoteResponse = PreVoteResponse
    RequestVoteRequest = RequestVoteRequest
    RequestVoteResponse = RequestVoteResponse
    AppendEntriesRequest = AppendEntriesRequest
    AppendEntriesResponse = AppendEntriesResponse

INIT TraceInit
NEXT TraceNext

\* Do NOT use -deadlock flag: deadlock at trace end is expected success.
\* Use deadlock detection to find where trace gets stuck.

INVARIANTS
    PrecommitOrdering

ALIAS TraceAlias
