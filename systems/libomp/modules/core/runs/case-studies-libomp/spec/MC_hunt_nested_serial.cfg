\* Hunting config: Nested serial parallel + parity corruption (Family 6)
\* Target: ParityConsistency, SerialExitParityConsistent, SerialTasksNotOrphaned
\*
\* Bug scenario: Thread in parallel (slot=1) enters serialized parallel (reset to slot=0),
\* creates tasks in slot 0, exits serial (restore to slot=1). Tasks orphaned in wrong slot.
\* Related open issues: #50602, #59190, #81488 (4+ years unfixed)
\*
\* NOTE: ActiveTasksImplyActiveTeam EXCLUDED — known steal-after-finish violation (Direction 2)

SPECIFICATION MCSpec

CONSTANTS
    Thread = {0, 1, 2}
    Task = {T1, T2}
    MaxBarriers = 2
    Nil = Nil
    MaxScheduleTaskLimit = 3
    MaxScheduleDetachLimit = 1
    MaxCancelLimit = 0
    MaxStealFromReapedLimit = 0
    MaxReapLimit = 0
    MaxSerialLimit = 2

VIEW ModelView

SYMMETRY ModelSymmetry

INVARIANTS
    TypeOK
    UnfinishedNonNegative
    ParityConsistency
    ChildCountNonNegative
    TaskCountNonNegative
    CompletedTasksNoOwner
    FreeTasksNoOwner
    SerialExitParityConsistent
    SerialTasksNotOrphaned
