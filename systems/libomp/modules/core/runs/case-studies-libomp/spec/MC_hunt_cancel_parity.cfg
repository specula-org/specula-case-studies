\* Hunting config: Family 5 - Barrier Cancel + Parity Interaction
\* Target: ParityRestoredAfterCancel violation
\* Focus: cancelled barrier skips task_team_sync, then next barrier
\*         finds threads with inconsistent slots
\* Tight bounds: need cancel + 2 barrier rounds, minimal tasks

SPECIFICATION MCSpec

CONSTANTS
    Thread = {0, 1, 2}
    Task = {T1}
    MaxBarriers = 3
    Nil = Nil
    MaxScheduleTaskLimit = 1
    MaxScheduleDetachLimit = 0
    MaxCancelLimit = 1
    MaxStealFromReapedLimit = 0
    MaxReapLimit = 0
    MaxSerialLimit = 0

VIEW ModelView

INVARIANTS
    TypeOK
    UnfinishedNonNegative
    ParityConsistency
    ParityRestoredAfterCancel
