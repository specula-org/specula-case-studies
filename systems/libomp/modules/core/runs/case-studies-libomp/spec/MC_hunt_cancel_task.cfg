\* Hunting config: Cancel + Task interaction (cross-path)
\* Target: Tasks executing during cancellation, stale task state across rounds
\* Focus: task scheduled → cancel fires → tasks left in queued/executing → next round

SPECIFICATION MCSpec

CONSTANTS
    Thread = {0, 1, 2}
    Task = {T1, T2}
    MaxBarriers = 3
    Nil = Nil
    MaxScheduleTaskLimit = 2
    MaxScheduleDetachLimit = 1
    MaxCancelLimit = 1
    MaxStealFromReapedLimit = 0
    MaxReapLimit = 0
    MaxSerialLimit = 0

VIEW ModelView

SYMMETRY ModelSymmetry

INVARIANTS
    TypeOK
    UnfinishedNonNegative
    ChildCountNonNegative
    TaskCountNonNegative
    CompletedTasksNoOwner
    FreeTasksNoOwner
    FinishedImpliesState
    ParityConsistency
    OwnershipExclusive
