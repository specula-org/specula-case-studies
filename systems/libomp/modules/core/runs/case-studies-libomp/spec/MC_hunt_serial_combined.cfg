\* Hunting config: Serial parallel + all families combined
\* Maximum cross-family interaction coverage
\*
\* NOTE: ActiveTasksImplyActiveTeam excluded (known Direction 2 violation)

SPECIFICATION MCSpec

CONSTANTS
    Thread = {0, 1, 2}
    Task = {T1, T2}
    MaxBarriers = 3
    Nil = Nil
    MaxScheduleTaskLimit = 3
    MaxScheduleDetachLimit = 2
    MaxCancelLimit = 1
    MaxStealFromReapedLimit = 0
    MaxReapLimit = 0
    MaxSerialLimit = 2

VIEW ModelView

SYMMETRY ModelSymmetry

INVARIANTS
    TypeOK
    UnfinishedNonNegative
    ChildCountNonNegative
    TaskCountNonNegative
    CompletedTasksNoOwner
    FreeTasksNoOwner
    FinishedImpliesState
    ParityConsistency
    OwnershipExclusive
    ParityRestoredAfterCancel
    SerialExitParityConsistent
    SerialTasksNotOrphaned
