\* Hunting config: Serial parallel + barrier cancellation (Family 6 x Family 5)
\* Target: Cancel during serial parallel — thread in serial misses cancellation,
\*         parity state diverges after cancelled barrier
\*
\* NOTE: ActiveTasksImplyActiveTeam excluded (known Direction 2 violation)

SPECIFICATION MCSpec

CONSTANTS
    Thread = {0, 1, 2}
    Task = {T1}
    MaxBarriers = 3
    Nil = Nil
    MaxScheduleTaskLimit = 1
    MaxScheduleDetachLimit = 0
    MaxCancelLimit = 1
    MaxStealFromReapedLimit = 0
    MaxReapLimit = 0
    MaxSerialLimit = 2

VIEW ModelView

INVARIANTS
    TypeOK
    UnfinishedNonNegative
    ParityConsistency
    ParityRestoredAfterCancel
    SerialExitParityConsistent
