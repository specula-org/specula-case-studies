\* Hunting config: Steal-after-finish race (D28377 / #156741 / #176451)
\* Target: ActiveTasksImplyActiveTeam violation
\*
\* The race: after all threads mark finished (unfinished=0), the primary
\* deactivates the task team. But a "finished" thread can still steal a task
\* (re-incrementing unfinished). The task executes in a deactivated task team.
\*
\* This models kmp_tasking.cpp:3296-3417 where the thread continues the
\* steal loop after thread_finished=TRUE.

SPECIFICATION MCSpec

CONSTANTS
    Thread = {0, 1, 2}
    Task = {T1, T2}
    MaxBarriers = 1
    Nil = Nil
    MaxScheduleTaskLimit = 3
    MaxScheduleDetachLimit = 0
    MaxCancelLimit = 0
    MaxStealFromReapedLimit = 0
    MaxReapLimit = 0
    MaxSerialLimit = 0

VIEW ModelView

SYMMETRY ModelSymmetry

INVARIANTS
    TypeOK
    UnfinishedNonNegative
    ActiveTasksImplyActiveTeam
