\* MC_hunt_config.cfg — Bug Family 2: Sideband Configuration
\*
\* Target: ConfigCommitConsistency + ElectionSafety
\* Mechanism: Config applied on quorum (not commit), non-member AppendEntries,
\* crash between propose and apply.
\*
\* Tuning: enable config changes, crash, minimize irrelevant actions.

CONSTANTS
    Nil = Nil
    Follower = Follower
    Candidate = Candidate
    Leader = Leader
    RequestVoteRequest = RequestVoteRequest
    RequestVoteResponse = RequestVoteResponse
    AppendEntriesRequest = AppendEntriesRequest
    AppendEntriesResponse = AppendEntriesResponse
    Server = {s1, s2, s3}
    Value = {v1}

    \* Tight bounds: focus on config changes
    MaxTimeoutLimit = 4
    MaxCrashLimit = 2
    MaxRequestLimit = 1
    MaxLoseLimit = 2
    MaxHeartbeatLimit = 6
    MaxConfigLimit = 2
    MaxTermLimit = 4
    MaxMsgCount = 10


SPECIFICATION MCSpec

SYMMETRY ModelSymmetry
VIEW MCView

CONSTRAINT
    MsgBufferConstraint
    TermConstraint

INVARIANTS
    MCElectionSafety
    MCConfigCommitConsistency
