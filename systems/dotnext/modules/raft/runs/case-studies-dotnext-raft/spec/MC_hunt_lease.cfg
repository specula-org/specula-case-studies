\* MC_hunt_lease.cfg — Bug Family 4: Leader Lease Timing
\*
\* Target: NoStaleLeaderWithLease
\* Mechanism: Lease renewed before commit completes — stale read window.
\* Lease valid while another server becomes leader with higher term.
\*
\* Tuning: multiple heartbeats for lease, allow network partition.

CONSTANTS
    Nil = Nil
    Follower = Follower
    Candidate = Candidate
    Leader = Leader
    RequestVoteRequest = RequestVoteRequest
    RequestVoteResponse = RequestVoteResponse
    AppendEntriesRequest = AppendEntriesRequest
    AppendEntriesResponse = AppendEntriesResponse
    Server = {s1, s2, s3}
    Value = {v1}

    \* Tight bounds: focus on lease + partition
    MaxTimeoutLimit = 5
    MaxCrashLimit = 0
    MaxRequestLimit = 2
    MaxLoseLimit = 4
    MaxHeartbeatLimit = 8
    MaxConfigLimit = 0
    MaxTermLimit = 4
    MaxMsgCount = 12


SPECIFICATION MCSpec

SYMMETRY ModelSymmetry
VIEW MCView

CONSTRAINT
    MsgBufferConstraint
    TermConstraint

INVARIANTS
    MCElectionSafety
    MCNoStaleLeaderWithLease
