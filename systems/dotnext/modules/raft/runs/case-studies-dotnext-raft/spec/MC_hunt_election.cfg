\* MC_hunt_election.cfg — Bug Family 1: Conjunctive Election Restriction
\*
\* Target: ElectionLiveness (temporal) + ElectionSafety
\* Mechanism: The conjunctive IsUpToDate check can prevent valid candidates
\* from being elected when they have a higher last-term but shorter log.
\*
\* Tuning: maximize timeouts, minimize irrelevant actions.

CONSTANTS
    Nil = Nil
    Follower = Follower
    Candidate = Candidate
    Leader = Leader
    RequestVoteRequest = RequestVoteRequest
    RequestVoteResponse = RequestVoteResponse
    AppendEntriesRequest = AppendEntriesRequest
    AppendEntriesResponse = AppendEntriesResponse
    Server = {s1, s2, s3}
    Value = {v1}

    \* Tight bounds: focus on elections
    MaxTimeoutLimit = 6
    MaxCrashLimit = 1
    MaxRequestLimit = 3
    MaxLoseLimit = 2
    MaxHeartbeatLimit = 6
    MaxConfigLimit = 0
    MaxTermLimit = 5
    MaxMsgCount = 10


SPECIFICATION MCSpec

SYMMETRY ModelSymmetry
VIEW MCView

CONSTRAINT
    MsgBufferConstraint
    TermConstraint

INVARIANTS
    MCElectionSafety
    MCStateMachineSafety

PROPERTY
    ElectionLiveness
