\* MC_hunt_wal.cfg — Bug Family 5: WAL Commit Ordering
\*
\* Target: CommitMonotonicity + StateMachineSafety
\* Mechanism: Crash between in-memory commit update and checkpoint persist.
\* CommitIndex can regress on recovery.
\*
\* Tuning: enable crashes, multiple commit rounds.

CONSTANTS
    Nil = Nil
    Follower = Follower
    Candidate = Candidate
    Leader = Leader
    RequestVoteRequest = RequestVoteRequest
    RequestVoteResponse = RequestVoteResponse
    AppendEntriesRequest = AppendEntriesRequest
    AppendEntriesResponse = AppendEntriesResponse
    Server = {s1, s2, s3}
    Value = {v1}

    \* Tight bounds: focus on crash recovery
    MaxTimeoutLimit = 4
    MaxCrashLimit = 3
    MaxRequestLimit = 3
    MaxLoseLimit = 1
    MaxHeartbeatLimit = 6
    MaxConfigLimit = 0
    MaxTermLimit = 4
    MaxMsgCount = 10


SPECIFICATION MCSpec

SYMMETRY ModelSymmetry
VIEW MCView

CONSTRAINT
    MsgBufferConstraint
    TermConstraint

INVARIANTS
    MCElectionSafety
    MCStateMachineSafety
    MCPersistedCommitBound
