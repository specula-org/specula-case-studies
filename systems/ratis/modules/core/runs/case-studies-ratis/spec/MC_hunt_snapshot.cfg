\* MC_hunt_snapshot.cfg — Bug Family 6: Snapshot-Log Consistency
\* Targets: SnapshotLogConsistency
\* Focus: snapshot install + log gap, matchIndex/nextIndex after snapshot

CONSTANTS
    Nil = Nil
    Follower = Follower
    Candidate = Candidate
    Leader = Leader
    PreVote = PreVote
    Election = Election
    SUCCESS = SUCCESS
    INCONSISTENCY = INCONSISTENCY
    NOT_LEADER = NOT_LEADER
    RequestVoteRequest = RequestVoteRequest
    RequestVoteResponse = RequestVoteResponse
    AppendEntriesRequest = AppendEntriesRequest
    AppendEntriesResponse = AppendEntriesResponse
    InstallSnapshotRequest = InstallSnapshotRequest
    InstallSnapshotResponse = InstallSnapshotResponse

    Server = {s1, s2, s3}
    Value = {v1}
    MaxTerm = 3
    MaxLogLength = 5

    \* Enable snapshots, minimize other noise
    MaxTimeoutLimit = 3
    MaxPreVoteLimit = 0
    MaxRequestLimit = 3
    MaxCrashLimit = 1
    MaxLoseLimit = 1
    MaxHeartbeatLimit = 4
    MaxConfigChangeLimit = 0
    MaxReadLimit = 0
    MaxSnapshotLimit = 3
    MaxCheckLeadershipLimit = 0
    MaxExpireLeaseLimit = 0
    MaxExpireLeaderValidityLimit = 1
    MaxMsgBufferLimit = 10

SYMMETRY ModelSymmetry

VIEW MCView

SPECIFICATION MCSpec

CONSTRAINT MsgBufferConstraint

INVARIANT ElectionSafety
INVARIANT SnapshotLogConsistency
INVARIANT NextIndexBound
