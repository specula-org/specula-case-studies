\* MC_hunt_election.cfg — Bug Family 2: Election and Leadership Transition
\* Targets: ElectionSafety under pre-vote + priority + stale leader
\* Focus: pre-vote bypass, priority rejection, leader step-down gaps

CONSTANTS
    Nil = Nil
    Follower = Follower
    Candidate = Candidate
    Leader = Leader
    PreVote = PreVote
    Election = Election
    SUCCESS = SUCCESS
    INCONSISTENCY = INCONSISTENCY
    NOT_LEADER = NOT_LEADER
    RequestVoteRequest = RequestVoteRequest
    RequestVoteResponse = RequestVoteResponse
    AppendEntriesRequest = AppendEntriesRequest
    AppendEntriesResponse = AppendEntriesResponse
    InstallSnapshotRequest = InstallSnapshotRequest
    InstallSnapshotResponse = InstallSnapshotResponse

    Server = {s1, s2, s3}
    Value = {v1}
    MaxTerm = 4
    MaxLogLength = 3

    \* Tight bounds: maximize election interleavings
    MaxTimeoutLimit = 6
    MaxPreVoteLimit = 4
    MaxRequestLimit = 1
    MaxCrashLimit = 2
    MaxLoseLimit = 3
    MaxHeartbeatLimit = 3
    MaxConfigChangeLimit = 0
    MaxReadLimit = 0
    MaxSnapshotLimit = 0
    MaxCheckLeadershipLimit = 3
    MaxExpireLeaseLimit = 0
    MaxExpireLeaderValidityLimit = 4
    MaxMsgBufferLimit = 12

SYMMETRY ModelSymmetry

VIEW MCView

SPECIFICATION MCSpec

CONSTRAINT MsgBufferConstraint

INVARIANT ElectionSafety
