\* MC_hunt_read.cfg — Bug Family 5: Linearizable Read Safety
\* Targets: LeaseImpliesLeader, ReadLinearizability
\* Focus: lease expiry race, stale read after leader change

CONSTANTS
    Nil = Nil
    Follower = Follower
    Candidate = Candidate
    Leader = Leader
    PreVote = PreVote
    Election = Election
    SUCCESS = SUCCESS
    INCONSISTENCY = INCONSISTENCY
    NOT_LEADER = NOT_LEADER
    RequestVoteRequest = RequestVoteRequest
    RequestVoteResponse = RequestVoteResponse
    AppendEntriesRequest = AppendEntriesRequest
    AppendEntriesResponse = AppendEntriesResponse
    InstallSnapshotRequest = InstallSnapshotRequest
    InstallSnapshotResponse = InstallSnapshotResponse

    Server = {s1, s2, s3}
    Value = {v1}
    MaxTerm = 3
    MaxLogLength = 3

    \* Enable reads and lease, minimize other noise
    MaxTimeoutLimit = 3
    MaxPreVoteLimit = 0
    MaxRequestLimit = 1
    MaxCrashLimit = 1
    MaxLoseLimit = 1
    MaxHeartbeatLimit = 4
    MaxConfigChangeLimit = 0
    MaxReadLimit = 3
    MaxSnapshotLimit = 0
    MaxCheckLeadershipLimit = 2
    MaxExpireLeaseLimit = 3
    MaxExpireLeaderValidityLimit = 2
    MaxMsgBufferLimit = 8

SYMMETRY ModelSymmetry

VIEW MCView

SPECIFICATION MCSpec

CONSTRAINT MsgBufferConstraint

INVARIANT ElectionSafety
INVARIANT LeaseImpliesLeader
INVARIANT ReadLinearizability
