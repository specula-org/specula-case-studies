    MaxTimeoutLimit = 5
    MaxPreVoteLimit = 0
    MaxRequestLimit = 3
    MaxCrashLimit = 1
    MaxLoseLimit = 2
    MaxHeartbeatLimit = 4
    MaxConfigChangeLimit = 0
    MaxReadLimit = 0
