SPECIFICATION MCSpec

CONSTANTS
    Server = {s1, s2, s3}
    BootstrapConf = {s1, s2}
    MaxIndex = 4
    MaxTerm = 4

    MaxElectionLimit = 4
    MaxAppendLimit = 4
    MaxFlushLimit = 4
    MaxAsyncFlushBugLimit = 0
    MaxCrashLimit = 1
    MaxFormatLimit = 1
    MaxMessageLimit = 6
    MaxSnapshotLimit = 3
    MaxSnapshotBugLimit = 0
    MaxReadLimit = 2
    MaxLeaseLimit = 0
    MaxConfigLimit = 3
    MaxConfigBugLimit = 0
    MaxMsgBufferLimit = 10

SYMMETRY Symmetry
VIEW ModelView
CONSTRAINT MsgBufferConstraint

INVARIANTS
    \* Core safety
    MCTypeOK
    ElectionSafety
    LeaderCompleteness
    LogMatching

    \* Structural sanity
    FlushIndexWithinPublishedWrites
    CommitMonotoneStructural
    ConfigurationSetsKnown
    SnapshotBoundariesOrdered

    \* Scenario-specific hunt invariants are intentionally disabled here.
    \* Enable them in MC_hunt_scenario*.cfg after the base spec converges.
    \* CommittedImpliesDurableFlush
    \* RecoveredCommitCovered
    \* SnapshotInstallExclusion
    \* ReadIndexRequiresCurrentLeader
    \* NoOldLeaderLeaseRead
    \* JointConfigMajorityOverlap
    \* DurableConfigMatchesRecoveredRole
