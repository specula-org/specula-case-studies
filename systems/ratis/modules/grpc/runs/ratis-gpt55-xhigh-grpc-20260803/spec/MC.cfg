\* Standard convergence configuration for ratis-grpc replication.
\* Scenario-specific invariants are defined and wired but commented out here;
\* each is enabled in at least one MC_hunt_*.cfg.

SPECIFICATION MCSpec

CONSTANTS
    Server = {L, F1, F2}
    LeaderNode = L
    MaxLogIndex = 4
    MaxCallId = 4
    MaxReplyId = 6
    MaxSnapshotChunks = 2
    StagingCatchupGap = 1
    ConfLogIndex = 1
    LeastValidLogIndex = 0

    Data = Data
    Heartbeat = Heartbeat
    Success = Success
    Inconsistency = Inconsistency
    NotLeader = NotLeader

    PendingState = PendingState
    TimedOutState = TimedOutState
    ResetState = ResetState

    SnapshotNone = SnapshotNone
    SendingChunks = SendingChunks
    FollowerInstalling = FollowerInstalling
    Installed = Installed
    Unavailable = Unavailable
    Expired = Expired

    Existing = Existing
    StagingNewPeer = StagingNewPeer
    Removed = Removed

    ConfigStable = ConfigStable
    ConfigStaging = ConfigStaging
    ConfigOldNew = ConfigOldNew

    Fresh = Fresh
    Stale = Stale

    SendLimit = 3
    HeartbeatLimit = 2
    TimeoutLimit = 2
    StreamResetLimit = 2
    ReconnectLimit = 2
    ReplyLimit = 5
    SnapshotLimit = 3
    StagingLimit = 2
    RestartLimit = 1
    BackpressureLimit = 1
    CompactLimit = 1
    MaxReplyQueueLimit = 4
    MaxPendingLimit = 3

CONSTRAINT MCQueueConstraint

SYMMETRY ModelSymmetry

VIEW MCView

CHECK_DEADLOCK FALSE

\* Structural and convergence invariants.
INVARIANT MCTypeOK
INVARIANT MCStructuralProgressBounds
INVARIANT CommitOnlyFromQuorumProof

\* Scenario-specific invariants enabled in hunt cfgs.
\* INVARIANT NextBeyondMatch
\* INVARIANT MatchOnlyFromProof
\* INVARIANT StaleReplyNoProgressRegression
\* INVARIANT SnapshotAppendBoundary
\* INVARIANT SnapshotProgressMonotonic
\* INVARIANT NoCommitFromHeartbeatTail
\* INVARIANT PendingResetDoesNotLoseSafety
\* INVARIANT AppendDuringSnapshotDoesNotCommitUnprovenEntries
\* INVARIANT SnapshotRetryPreservesCatchup
\* INVARIANT NoPrematureStagingCommit
\* INVARIANT RestartPreservesUsefulProgress
\* INVARIANT CancelledStreamNoCommitProof
\* PROPERTY NoPermanentStaging
