\* Base configuration for ratis-grpc replication spec.

SPECIFICATION Spec

CONSTANTS
    Server = {L, F1, F2}
    LeaderNode = L
    MaxLogIndex = 4
    MaxCallId = 4
    MaxReplyId = 6
    MaxSnapshotChunks = 2
    StagingCatchupGap = 1
    ConfLogIndex = 1
    LeastValidLogIndex = 0

    Data = Data
    Heartbeat = Heartbeat
    Success = Success
    Inconsistency = Inconsistency
    NotLeader = NotLeader

    PendingState = PendingState
    TimedOutState = TimedOutState
    ResetState = ResetState

    SnapshotNone = SnapshotNone
    SendingChunks = SendingChunks
    FollowerInstalling = FollowerInstalling
    Installed = Installed
    Unavailable = Unavailable
    Expired = Expired

    Existing = Existing
    StagingNewPeer = StagingNewPeer
    Removed = Removed

    ConfigStable = ConfigStable
    ConfigStaging = ConfigStaging
    ConfigOldNew = ConfigOldNew

    Fresh = Fresh
    Stale = Stale

CONSTRAINT BoundedQueues

CHECK_DEADLOCK FALSE

INVARIANT TypeOK
