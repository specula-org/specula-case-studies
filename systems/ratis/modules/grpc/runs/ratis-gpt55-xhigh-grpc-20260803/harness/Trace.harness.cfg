\* Harness replay configuration for traces collected from the real ratis-grpc tests.
\* The source Trace.cfg remains the small model-checking configuration.

SPECIFICATION TraceSpec

CONSTANTS
    Server = {"L", "F1", "F2"}
    LeaderNode = "L"
    MaxLogIndex = 40
    MaxCallId = 80
    MaxReplyId = 160
    MaxSnapshotChunks = 2
    StagingCatchupGap = 1
    ConfLogIndex = 1
    LeastValidLogIndex = 0

    Data = Data
    Heartbeat = Heartbeat
    Success = Success
    Inconsistency = Inconsistency
    NotLeader = NotLeader

    PendingState = PendingState
    TimedOutState = TimedOutState
    ResetState = ResetState

    SnapshotNone = SnapshotNone
    SendingChunks = SendingChunks
    FollowerInstalling = FollowerInstalling
    Installed = Installed
    Unavailable = Unavailable
    Expired = Expired

    Existing = Existing
    StagingNewPeer = StagingNewPeer
    Removed = Removed

    ConfigStable = ConfigStable
    ConfigStaging = ConfigStaging
    ConfigOldNew = ConfigOldNew

    Fresh = Fresh
    Stale = Stale

CHECK_DEADLOCK FALSE

INVARIANT TypeOK
INVARIANT CommitOnlyFromQuorumProof
INVARIANT MatchOnlyFromProof
INVARIANT SnapshotProgressMonotonic

PROPERTIES TraceMatched
