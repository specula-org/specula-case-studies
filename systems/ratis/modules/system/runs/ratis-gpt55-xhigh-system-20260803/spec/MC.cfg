SPECIFICATION MCSpec

CONSTANTS
    Server = {s1, s2, s3}
    EntryValue = {v1, v2}
    NoLeader = NoLeader
    NoVote = NoVote
    NoEntry = NoEntry
    NoTerm = NoTerm

    FOLLOWER = "FOLLOWER"
    CANDIDATE = "CANDIDATE"
    LEADER = "LEADER"
    LISTENER = "LISTENER"

    SUCCESS = "SUCCESS"
    INCONSISTENCY = "INCONSISTENCY"
    NOT_LEADER = "NOT_LEADER"

    CONFIG_OLD_NEW = "CONFIG_OLD_NEW"
    CONFIG_NEW = "CONFIG_NEW"

    MaxTerm = 4
    MaxIndex = 5
    MaxCallId = 8
    MaxEpoch = 4
    InitialLeaderHeartbeatCheck = TRUE

    MaxElectionLimit = 4
    MaxClientAppendLimit = 3
    MaxReadLimit = 2
    MaxSendAppendLimit = 6
    MaxPersistFailureLimit = 1
    MaxStepDownEventLimit = 3
    MaxOldReplyLimit = 2
    MaxTimeoutLimit = 2
    MaxResetLimit = 2
    MaxSnapshotLimit = 2
    MaxPurgeLimit = 2
    MaxRestartLimit = 2
    MaxConfigChangeLimit = 2
    MaxMsgBufferLimit = 8

SYMMETRY Symmetry
VIEW MCModelView
CONSTRAINT MsgBufferConstraint

INVARIANTS
    \* MC structural
    MCTypeOK
    IndexBounds
    TermMonotonicShape
    ConfigShape
    ProgressShape

    \* Standard safety
    ElectionSafety
    LogMatching
    LeaderCompleteness
    StateMachineSafety

    \* Scenario-specific bug-hunting invariants are defined and wired here
    \* but intentionally disabled in the convergence config.  Each is enabled
    \* in its corresponding MC_hunt_scenario*.cfg.
    \* AppendSuccessReflectsLog
    \* PersistedTermBeforeAccept
    \* StepDownTermNotLost
    \* SnapshotLogContinuity
    \* ConfigEntryBeforeCaughtUp
    \* LinearizableReadIndex
    \* ProgressBounds
