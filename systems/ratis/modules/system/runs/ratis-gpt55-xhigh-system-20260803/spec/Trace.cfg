SPECIFICATION TraceSpec

VIEW TraceView

PROPERTIES TraceMatched

CHECK_DEADLOCK FALSE

CONSTANTS
    Server = {"s1", "s2", "s3"}
    EntryValue = {"v1", "v2"}
    NoLeader = NoLeader
    NoVote = NoVote
    NoEntry = NoEntry
    NoTerm = NoTerm

    FOLLOWER = "FOLLOWER"
    CANDIDATE = "CANDIDATE"
    LEADER = "LEADER"
    LISTENER = "LISTENER"

    SUCCESS = "SUCCESS"
    INCONSISTENCY = "INCONSISTENCY"
    NOT_LEADER = "NOT_LEADER"

    CONFIG_OLD_NEW = "CONFIG_OLD_NEW"
    CONFIG_NEW = "CONFIG_NEW"

    MaxTerm = 4
    MaxIndex = 5
    MaxCallId = 8
    MaxEpoch = 4
    InitialLeaderHeartbeatCheck = TRUE

INVARIANTS
    TypeOK
    IndexBounds
    TermMonotonicShape
    ConfigShape
    ProgressShape
    ElectionSafety
    TraceLogMatching
    LeaderCompleteness
    StateMachineSafety
    AppendSuccessReflectsLog
    PersistedTermBeforeAccept
    StepDownTermNotLost
    SnapshotLogContinuity
    ConfigEntryBeforeCaughtUp
    LinearizableReadIndex
    ProgressBounds
