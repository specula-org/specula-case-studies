\* Hunt config -- Scenario 6: signal pending/mask/disposition/lifecycle consistency.
\* Targets MC-8 (MaskHonored) and MC-9 (NoImmortalPending).
\* MC-8: a blockable default-Terminate signal takes effect on a target whose every
\*       thread has it masked, because kill()'s default-action path bypasses the
\*       per-thread mask (manager/mod.rs:858-893).
\* MC-9: a pending caught signal whose disposition is changed to SIG_DFL/SIG_IGN is
\*       left pending forever (sigaction does not clear pending; try_deliver_signal
\*       then skips it as non-Handler).
INIT MCInit
NEXT MCNext

CONSTANTS
    Proc = {p1, p2}
    Thread = {t1, t2, t3}
    Signal = {1, 2}
    MutexAddr = {m1}
    CondAddr = {c1}
    MaxProc = 2
    MaxThread = 3
    MutexOpenMax = 1
    NoProc = NoProc
    NoThread = NoThread
    NoCond = NoCond
    NoMask = NoMask
    CreateLimit = 1
    CreateThreadLimit = 0
    SleepLimit = 1
    AlarmLimit = 0
    KillLimit = 2
    SigactLimit = 2
    MaskLimit = 1
    ExecLimit = 0
    SigsuspLimit = 0
    MarkIntrLimit = 0
    RvLimit = 0
    LockLimit = 0
    CondwaitLimit = 0
    TerminateLimit = 0
    ExitLimit = 0
    PreemptLimit = 0
    MaxOps = 8

SYMMETRY Symmetry
CONSTRAINT StateConstraint

INVARIANTS
    MCTypeOK
    MCSingleOwner
    MCMaskHonored
    MCNoImmortalPending
