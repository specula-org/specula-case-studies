\* Hunt config -- Scenario 1: incomplete "where a blocked thread lives" search set.
\* Targets MC-1 (NoLostNotify) and MC-2 (SignalReachesSafety).
\* AlarmFire parks a sleeper inside an *interrupted* process; a cross-context notify
\* (WakeDequeued via the buggy try_wakeup search that skips the interrupted list)
\* consumes the waiter without waking it -> NoLostNotify.  A caught signal posted to
\* a runnable process whose only eligible candidate is an embedded sleeper is never
\* interrupted (interrupt_signal_candidate scans only `suspended`) -> SignalReaches.
INIT MCInit
NEXT MCNext

CONSTANTS
    Proc = {p1, p2}
    Thread = {t1, t2, t3}
    Signal = {1, 2}
    MutexAddr = {m1}
    CondAddr = {c1}
    MaxProc = 2
    MaxThread = 3
    MutexOpenMax = 1
    NoProc = NoProc
    NoThread = NoThread
    NoCond = NoCond
    NoMask = NoMask
    CreateLimit = 1
    CreateThreadLimit = 1
    SleepLimit = 2
    AlarmLimit = 1
    KillLimit = 1
    SigactLimit = 1
    MaskLimit = 0
    ExecLimit = 0
    SigsuspLimit = 0
    MarkIntrLimit = 0
    RvLimit = 0
    LockLimit = 0
    CondwaitLimit = 0
    TerminateLimit = 0
    ExitLimit = 0
    PreemptLimit = 0
    MaxOps = 8

SYMMETRY Symmetry
CONSTRAINT StateConstraint

INVARIANTS
    MCTypeOK
    MCSingleOwner
    MCNoLostNotify
    MCSignalReachesSafety
