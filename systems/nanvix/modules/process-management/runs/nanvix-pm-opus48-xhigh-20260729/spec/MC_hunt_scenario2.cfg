\* Hunt config -- Scenario 2: terminate/exit does not force-kill already-interrupted
\* threads.  Targets MC-3 (TerminatedThreadsDie).
\* A process is driven Interrupted with TWO TimedOut interrupted threads; one is
\* resumed (interrupted -> ready) making the process Runnable while the other stays
\* interrupted.  RunnableProcess::terminate carries the interrupted thread forward
\* with its original TimedOut reason (killInterrupted = FALSE), so at the dispatcher
\* checkpoint it returns to user code instead of exiting.
INIT MCInit
NEXT MCNext

CONSTANTS
    Proc = {p1, p2}
    Thread = {t1, t2, t3}
    Signal = {1, 2}
    MutexAddr = {m1}
    CondAddr = {c1}
    MaxProc = 2
    MaxThread = 3
    MutexOpenMax = 1
    NoProc = NoProc
    NoThread = NoThread
    NoCond = NoCond
    NoMask = NoMask
    CreateLimit = 0
    CreateThreadLimit = 1
    SleepLimit = 2
    AlarmLimit = 2
    KillLimit = 0
    SigactLimit = 0
    MaskLimit = 0
    ExecLimit = 0
    SigsuspLimit = 0
    MarkIntrLimit = 0
    RvLimit = 0
    LockLimit = 0
    CondwaitLimit = 0
    TerminateLimit = 1
    ExitLimit = 0
    PreemptLimit = 0
    MaxOps = 7

SYMMETRY Symmetry
CONSTRAINT StateConstraint

INVARIANTS
    MCTypeOK
    MCSingleOwner
    MCTerminatedThreadsDie
