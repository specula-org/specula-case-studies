\* Hunt config -- Scenario 5: blocking-sync cancellation half-releases ownership.
\* Targets MC-6 (CondWaitReturnsLocked) and MC-7 (SyncSlotConservation).
\* MC-6: a cond_wait whose mutex reacquire is interrupted returns without the mutex
\*       held (wait_cond.rs:127 `mutex.lock(None)?`).
\* MC-7: a thread that exits holding a mutex, or a cancelled lock_mutex, leaves the
\*       mutex-map entry unreclaimed (put_mutex is never called), leaking a slot.
INIT MCInit
NEXT MCNext

CONSTANTS
    Proc = {p1, p2}
    Thread = {t1, t2, t3}
    Signal = {1, 2}
    MutexAddr = {m1}
    CondAddr = {c1}
    MaxProc = 2
    MaxThread = 3
    MutexOpenMax = 1
    NoProc = NoProc
    NoThread = NoThread
    NoCond = NoCond
    NoMask = NoMask
    CreateLimit = 0
    CreateThreadLimit = 0
    SleepLimit = 0
    AlarmLimit = 1
    KillLimit = 0
    SigactLimit = 0
    MaskLimit = 0
    ExecLimit = 0
    SigsuspLimit = 0
    MarkIntrLimit = 0
    RvLimit = 0
    LockLimit = 1
    CondwaitLimit = 1
    TerminateLimit = 0
    ExitLimit = 1
    PreemptLimit = 0
    MaxOps = 7

SYMMETRY Symmetry
CONSTRAINT StateConstraint

INVARIANTS
    MCTypeOK
    MCSingleOwner
    MCCondWaitReturnsLocked
    MCSyncSlotConservation
