\* Trace-validation config for the Nanvix PM spec.
\* Uses SPECIFICATION TraceSpec (with weak fairness on TraceNext) so that the cursor
\* is forced to advance whenever a matching event is enabled.  TraceMatched then holds
\* iff the entire recorded trace is consumed; a spec/implementation divergence disables
\* the matching wrapper, the cursor stalls, and TraceMatched is reported violated.
\*
\* RUN WITH DEADLOCK DETECTION DISABLED:  tlc -deadlock -config Trace.cfg Trace.tla
\* (the trace-consumed final state has no successor; without -deadlock TLC reports that
\* terminal state as a deadlock error before it evaluates the TraceMatched liveness
\* property).  Verified: a faithful trace yields "No error has been found"; a corrupted
\* post-state yields "Temporal property TraceMatched was violated".
\*
\* Constants are STRINGS to match the JSON object keys the harness emits; the sentinels
\* are the corresponding strings.
SPECIFICATION TraceSpec

CONSTANTS
    Proc = {"p1", "p2"}
    Thread = {"t1", "t2", "t3"}
    Signal = {1, 2}
    MutexAddr = {"m1"}
    CondAddr = {"c1"}
    MaxProc = 2
    MaxThread = 3
    MutexOpenMax = 1
    NoProc = "NoProc"
    NoThread = "NoThread"
    NoCond = "NoCond"
    NoMask = "NoMask"

\* Structural invariants that must hold on every real execution.
INVARIANTS
    TypeOK
    SingleOwner

\* Completion: the entire recorded trace must be consumed.
PROPERTIES
    TraceMatched
