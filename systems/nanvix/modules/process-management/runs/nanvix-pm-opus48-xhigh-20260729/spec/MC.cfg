\* Model-checking config for the Nanvix PM spec: convergence / structural run.
\* Extension (Scenario) invariants are intentionally COMMENTED OUT here -- the base
\* spec faithfully models the bugs, so they are violated by design and are enabled
\* only in the per-Scenario MC_hunt_*.cfg files.  This config checks that the
\* structural invariants (TypeOK, SingleOwner) hold across the bounded state space.
SPECIFICATION MCSpec

CONSTANTS
    Proc = {p1, p2}
    Thread = {t1, t2, t3}
    Signal = {1, 2}
    MutexAddr = {m1}
    CondAddr = {c1}
    MaxProc = 2
    MaxThread = 3
    MutexOpenMax = 1
    NoProc = NoProc
    NoThread = NoThread
    NoCond = NoCond
    NoMask = NoMask
    \* per-action firing bounds
    CreateLimit = 1
    CreateThreadLimit = 1
    SleepLimit = 2
    AlarmLimit = 1
    KillLimit = 1
    SigactLimit = 1
    MaskLimit = 1
    ExecLimit = 0
    SigsuspLimit = 1
    MarkIntrLimit = 1
    RvLimit = 1
    LockLimit = 1
    CondwaitLimit = 1
    TerminateLimit = 1
    ExitLimit = 1
    PreemptLimit = 1
    MaxOps = 6

SYMMETRY Symmetry
CONSTRAINT StateConstraint

\* ========================================================================
\* Structural invariants (always checked)
\* ========================================================================
INVARIANTS
    MCTypeOK
    MCSingleOwner

\* ========================================================================
\* Extension (Scenario) invariants -- enabled per-Scenario in MC_hunt_*.cfg.
\* Kept out of the convergence run because the spec models the real bugs.
\* ========================================================================
\* INVARIANT MCNoLostNotify
\* INVARIANT MCSignalReachesSafety
\* INVARIANT MCTerminatedThreadsDie
\* INVARIANT MCRunningValidAtWakeup
\* INVARIANT MCNoSpuriousOOM
\* INVARIANT MCCondWaitReturnsLocked
\* INVARIANT MCSyncSlotConservation
\* INVARIANT MCMaskHonored
\* INVARIANT MCNoImmortalPending
\* INVARIANT MCSavedMaskRestored
\* INVARIANT MCRestartAttribution  (removed: MC-10b was a spec artifact -- SA_RESTART is
\*   applied per the delivered signal, which the implementation and POSIX both guarantee)
