\* Hunt config -- Scenario 3: running == None reentrancy in do_exit -> kernel panic.
\* Targets MC-4 (RunningValidAtWakeup).
\* A thread in another process registers as a rendezvous counterpart blocked on the
\* exiting process.  do_exit's take_running() nulls `running`, then
\* cleanup_rendezvous -> do_wakeup -> try_wakeup_thread -> get_running().expect(...)
\* dereferences the empty running slot and panics.
INIT MCInit
NEXT MCNext

CONSTANTS
    Proc = {p1, p2}
    Thread = {t1, t2, t3}
    Signal = {1, 2}
    MutexAddr = {m1}
    CondAddr = {c1}
    MaxProc = 2
    MaxThread = 3
    MutexOpenMax = 1
    NoProc = NoProc
    NoThread = NoThread
    NoCond = NoCond
    NoMask = NoMask
    CreateLimit = 1
    CreateThreadLimit = 0
    SleepLimit = 0
    AlarmLimit = 0
    KillLimit = 0
    SigactLimit = 0
    MaskLimit = 0
    ExecLimit = 0
    SigsuspLimit = 0
    MarkIntrLimit = 0
    RvLimit = 1
    LockLimit = 0
    CondwaitLimit = 0
    TerminateLimit = 0
    ExitLimit = 1
    PreemptLimit = 1
    MaxOps = 7

SYMMETRY Symmetry
CONSTRAINT StateConstraint

INVARIANTS
    MCTypeOK
    MCSingleOwner
    MCRunningValidAtWakeup
