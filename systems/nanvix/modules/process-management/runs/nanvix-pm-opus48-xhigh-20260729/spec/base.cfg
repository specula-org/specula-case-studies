\* Base-spec config for the Nanvix PM specification.
\* The base spec's Next relation is unbounded (fault actions are not counter-limited
\* here); exhaustive checking is done through MC.tla / MC.cfg, which add counter
\* bounds and a StateConstraint.  This config is primarily for parsing and small
\* structural sanity checks.
SPECIFICATION Spec

CONSTANTS
    Proc = {p1, p2}
    Thread = {t1, t2, t3}
    Signal = {1, 2}
    MutexAddr = {m1}
    CondAddr = {c1}
    MaxProc = 2
    MaxThread = 3
    MutexOpenMax = 1
    NoProc = NoProc
    NoThread = NoThread
    NoCond = NoCond
    NoMask = NoMask

INVARIANTS
    TypeOK
    SingleOwner
