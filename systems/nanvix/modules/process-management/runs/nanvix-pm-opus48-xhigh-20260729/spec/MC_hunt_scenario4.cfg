\* Hunt config -- Scenario 4: reclaimable thread slots not reaped before cap rejection.
\* Targets MC-5 (NoSpuriousOOM), the safety proxy for AdmissionLiveness.
\* create_process (manager/mod.rs:1164) and do_execv (:2023) reserve their main-thread
\* slot with the NON-reaping try_next_tid, so when the thread cap is held by a terminated
\* zombie thread awaiting harvest, admission is rejected with OutOfMemory even though
\* reaping the zombie would free a slot (the reap-then-retry try_next_tid_reaping of fix
\* #2495 is used only by create_thread:421 and duplicate_process:1558).  The process cap
\* (:1139) never binds first because MAX_THREADS(32) < MAX_PROCESSES(255), so it is modeled
\* here with MaxThread < MaxProc and MaxProc above the slot count (process cap unreachable).
INIT MCInit
NEXT MCNext

CONSTANTS
    Proc = {p1, p2}
    Thread = {t1, t2, t3}
    Signal = {1, 2}
    MutexAddr = {m1}
    CondAddr = {c1}
    MaxProc = 3
    MaxThread = 2
    MutexOpenMax = 1
    NoProc = NoProc
    NoThread = NoThread
    NoCond = NoCond
    NoMask = NoMask
    CreateLimit = 1
    CreateThreadLimit = 0
    SleepLimit = 0
    AlarmLimit = 0
    KillLimit = 0
    SigactLimit = 0
    MaskLimit = 0
    ExecLimit = 0
    SigsuspLimit = 0
    MarkIntrLimit = 0
    RvLimit = 0
    LockLimit = 0
    CondwaitLimit = 0
    TerminateLimit = 1
    ExitLimit = 0
    PreemptLimit = 0
    MaxOps = 5

SYMMETRY Symmetry
CONSTRAINT StateConstraint

INVARIANTS
    MCTypeOK
    MCSingleOwner
    MCNoSpuriousOOM
