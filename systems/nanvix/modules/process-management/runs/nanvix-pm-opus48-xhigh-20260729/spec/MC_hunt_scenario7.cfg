\* Hunt config -- Scenario 7: sigsuspend/sigreturn/SA_RESTART reentrancy corruption.
\* Targets MC-10a (SavedMaskRestored).
\* SavedMaskRestored: a nested sigsuspend overwrites the single saved_blocked slot
\*   (manager/mod.rs:734), so the original pre-suspend mask is lost.
\* NOTE: the former MC-10b RestartAttribution invariant was removed as a spec artifact --
\*   the implementation applies SA_RESTART per the DELIVERED (lowest-numbered deliverable
\*   caught) signal (signal.rs:240-283), exactly as POSIX/Linux, and the signum-less
\*   KcallRestart record carries no "interrupting signal" to attribute against.
INIT MCInit
NEXT MCNext

CONSTANTS
    Proc = {p1, p2}
    Thread = {t1, t2, t3}
    Signal = {1, 2}
    MutexAddr = {m1}
    CondAddr = {c1}
    MaxProc = 2
    MaxThread = 3
    MutexOpenMax = 1
    NoProc = NoProc
    NoThread = NoThread
    NoCond = NoCond
    NoMask = NoMask
    CreateLimit = 0
    CreateThreadLimit = 0
    SleepLimit = 0
    AlarmLimit = 0
    KillLimit = 1
    SigactLimit = 1
    MaskLimit = 0
    ExecLimit = 0
    SigsuspLimit = 2
    MarkIntrLimit = 1
    RvLimit = 0
    LockLimit = 0
    CondwaitLimit = 0
    TerminateLimit = 0
    ExitLimit = 0
    PreemptLimit = 0
    MaxOps = 6

SYMMETRY Symmetry
CONSTRAINT StateConstraint

INVARIANTS
    MCTypeOK
    MCSingleOwner
    MCSavedMaskRestored
