\* Scenario 1 -- Location & State-Machine Integrity.  Confirms the structural
\* invariants hold on the lifecycle+sync+stop core (incl. the self-stop window).
\* Expected: NO violation (these invariants gate all findings).
SPECIFICATION MCSpec
CONSTANTS
    Proc = {p1, p2}  Thread = {t1, t2}  Mutex = {mx1}  Cond = {cv1}
    MaxThreads = 2   MaxProcs = 2   InitProc = p1   InitThread = t1
    Sig = {9, 19}    Unblockable = {9, 19}   StopSig = 19   NULL = NULL
    Enabled = { "sched","preempt","create","fork","exit","harvest","reapSafe",
                "reapU","kill","cont","lock","lockblk","lockres","unlock",
                "cwait","csignal","creacq","cintr","sleep","wake" }
CONSTRAINT StateBound
INVARIANT
    TypeOK
    ExactlyOneLocation
    NestedStateConsistent
    NoRunAfterZombie
    NoStoppedDispatch
    ReapedExactlyOnce
