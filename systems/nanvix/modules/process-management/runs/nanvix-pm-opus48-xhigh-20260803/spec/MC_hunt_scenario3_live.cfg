\* Scenario 3, MC3/MC10 (liveness) -- a thread parked on a mutex whose owner dies
\* holding it (release only at harvest, possibly never) never makes progress.
\* Expected: MutexProgress VIOLATED (stuck-waiter witness).
SPECIFICATION MCSpecFair
CONSTANTS
    Proc = {p1}   Thread = {t1, t2}   Mutex = {mx1}   Cond = {cv1}
    MaxThreads = 2   MaxProcs = 1   InitProc = p1   InitThread = t1
    Sig = {9}   Unblockable = {9}   StopSig = 19   NULL = NULL
    Enabled = { "sched","preempt","create","detach","exit","harvest","reapU",
                "reapSafe","lock","lockblk","lockres","unlock" }
CONSTRAINT StateBound
PROPERTY
    MutexProgress
