\* Scenario 3 -- condition-variable wait path.  Exercises park / signal / reacquire
\* / interrupt on a condvar (no put_cond, so the object is never destroyed) and
\* asserts wait_cond always returns holding the mutex.  The model follows the
\* mainline reacquire path, so this HOLDS; the reacquire-skip on get/put_cond
\* failure is test-verifiable (brief T1, section 6.2), not modelled here.
\* Expected: NO violation (documents the clean, mainline reacquire path).
SPECIFICATION MCSpec
CONSTANTS
    Proc = {p1}   Thread = {t1, t2}   Mutex = {mx1}   Cond = {cv1}
    MaxThreads = 2   MaxProcs = 1   InitProc = p1   InitThread = t1
    Sig = {9}   Unblockable = {9}   StopSig = 19   NULL = NULL
    Enabled = { "sched","preempt","create","exit","lock","lockblk","lockres",
                "unlock","cwait","csignal","creacq","cintr" }
CONSTRAINT StateBound
INVARIANT
    TypeOK
    ExactlyOneLocation
    NestedStateConsistent
    NoRunAfterZombie
    CondWaitReacquires
    NoDestroyWithWaiter
