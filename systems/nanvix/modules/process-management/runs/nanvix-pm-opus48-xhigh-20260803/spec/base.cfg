\* Base config: sanity-check that the faithful model converges under the
\* structural invariants (extension/bug-detector invariants live in the MC layer).
SPECIFICATION Spec

CONSTANTS
    Proc       = {p1}
    Thread     = {t1}
    Mutex      = {mx1}
    Cond       = {cv1}
    MaxThreads = 1
    MaxProcs   = 1
    InitProc   = p1
    InitThread = t1
    Sig         = {1, 9, 15, 19}
    Unblockable = {9, 19}
    StopSig     = 19
    NULL       = NULL

CONSTRAINT StateBound

INVARIANT
    TypeOK
    ExactlyOneLocation
    NestedStateConsistent
    NoRunAfterZombie
    NoStoppedDispatch
    ReapedExactlyOnce
