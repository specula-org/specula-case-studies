\* Scenario 3 -- put_mutex/put_cond must not destroy a sync object while a thread
\* is parked on / owns it.  Expected: NoDestroyWithWaiter VIOLATED if the model
\* admits destroying an occupied object (witness), else confirms clean.
SPECIFICATION MCSpec
CONSTANTS
    Proc = {p1}   Thread = {t1, t2}   Mutex = {mx1}   Cond = {cv1}
    MaxThreads = 2   MaxProcs = 1   InitProc = p1   InitThread = t1
    Sig = {9}   Unblockable = {9}   StopSig = 19   NULL = NULL
    Enabled = { "sched","preempt","create","exit","lock","lockblk","lockres",
                "unlock","cwait","csignal","creacq","cintr","putmutex","putcond" }
CONSTRAINT StateBound
INVARIANT
    TypeOK
    ExactlyOneLocation
    NoRunAfterZombie
    NoDestroyWithWaiter
