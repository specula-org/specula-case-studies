\* Scenario 5 -- creation / exec / duplicate rollback must restore every reserved
\* resource (ID slot, live counts, address space, capabilities).  The model
\* reserves-then-commits atomically, so this is expected to HOLD.
\* Expected: NO violation (documents the clean rollback path).
SPECIFICATION MCSpec
CONSTANTS
    Proc = {p1, p2}   Thread = {t1, t2}   Mutex = {mx1}   Cond = {cv1}
    MaxThreads = 2   MaxProcs = 2   InitProc = p1   InitThread = t1
    Sig = {9}   Unblockable = {9}   StopSig = 19   NULL = NULL
    Enabled = { "sched","preempt","create","fork","execR","exec","exit",
                "harvest","reapSafe","reapU" }
CONSTRAINT StateBound
INVARIANT
    TypeOK
    ExactlyOneLocation
    NoRunAfterZombie
    RollbackComplete
