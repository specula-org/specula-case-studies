\* MC config: concurrent STRUCTURAL check.  Enables the lifecycle + sync + stop
\* core; the signal universe is collapsed to the uncatchable {9,19} (Maskable={}),
\* which removes all mask / frame / disposition / pending churn so the concurrent
\* lifecycle model converges.  Signal-path structural coverage is provided by the
\* scenario4 / scenario5 hunts (which keep the structural invariants enabled).
\* Only STRUCTURAL invariants are checked here; every EXTENSION invariant is listed
\* but commented out -- each is enabled in its own MC_hunt_<scenario>.cfg.
SPECIFICATION MCSpec

CONSTANTS
    Proc        = {p1, p2}
    Thread      = {t1, t2}
    Mutex       = {mx1}
    Cond        = {cv1}
    MaxThreads  = 2
    MaxProcs    = 2
    InitProc    = p1
    InitThread  = t1
    Sig         = {9, 19}
    Unblockable = {9, 19}
    StopSig     = 19
    NULL        = NULL
    Enabled     = { "sched","preempt","create","fork","exec","execR","exit",
                    "join","joinres","detach","harvest","reapSafe","reapU",
                    "lock","lockblk","lockres","unlock","putmutex",
                    "cwait","csignal","creacq","cintr","putcond",
                    "sleep","wake","kill","cont" }

CONSTRAINT StateBound

INVARIANT
    TypeOK
    ExactlyOneLocation
    NestedStateConsistent
    NoRunAfterZombie
    NoStoppedDispatch
    ReapedExactlyOnce

\* ---- EXTENSION invariants (bug detectors) -- enabled only in hunt cfgs ----
\* INVARIANT LiveCountAccurate        \* MC1      -> MC_hunt_scenario1.cfg
\* INVARIANT JoinGetsStatus           \* MC2      -> MC_hunt_scenario1.cfg
\* INVARIANT ExecAdmission            \* MC9      -> MC_hunt_scenario2.cfg
\* INVARIANT RollbackComplete         \* Scen. 2  -> MC_hunt_scenario2.cfg
\* INVARIANT MutexReleasedOnDeath     \* MC3/MC10 -> MC_hunt_scenario3.cfg
\* INVARIANT NoDestroyWithWaiter      \* Scen. 3  -> MC_hunt_scenario3.cfg
\* INVARIANT CondWaitReacquires       \* Scen. 3  -> MC_hunt_scenario3.cfg
\* INVARIANT MaskedSignalDeferred     \* MC4      -> MC_hunt_scenario4.cfg
\* INVARIANT SigsuspendMaskRestored   \* MC6      -> MC_hunt_scenario4.cfg
\* INVARIANT NoSignalToZombie         \* MC8      -> MC_hunt_scenario4.cfg
\* INVARIANT NoStrandedProcPending    \* MC7      -> MC_hunt_scenario5.cfg
\* INVARIANT NoUndeliverableCaught    \* MC5      -> MC_hunt_scenario5.cfg
