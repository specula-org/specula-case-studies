\* Trace validation config for the Nanvix PM base spec.
\* Category A: single linear trace, cursor `l`, ndJsonDeserialize from
\* ../traces/trace.ndjson (override with the TRACE env var).
\* Constants are STRING-valued so recorded JSON ids map to model values by identity.
SPECIFICATION TraceSpec

CONSTANTS
    Proc = {"p1", "p2"}
    Thread = {"t1", "t2", "t3"}
    Mutex = {"mx1"}
    Cond = {"cv1"}
    MaxThreads = 3
    MaxProcs = 2
    InitProc = "p1"
    InitThread = "t1"
    Sig = {1, 9, 15, 19}
    Unblockable = {9, 19}
    StopSig = 19
    NULL = "NULL"

\* Completion: the entire recorded trace must be consumed (guards against a
\* silently-stalled cursor reporting a false pass).
PROPERTIES TraceMatched

\* Structural / observable safety invariants -- these must hold on every real
\* execution and catch spec-vs-implementation disagreement early.  Liveness
\* properties and ghost-driven finding invariants are intentionally excluded
\* (see references/trace-spec-pattern.md, "Invariant Selection").
INVARIANT
    TypeOK
    ExactlyOneLocation
    NestedStateConsistent
    NoRunAfterZombie
    ReapedExactlyOnce
