\* Scenario 4, MC5/MC7 (liveness) -- a deliverable pending handler signal that is
\* stranded (masked-only recipients / disposition change) is never delivered.
\* Expected: SignalEventuallyDelivered VIOLATED (witness).
SPECIFICATION MCSpecFair
CONSTANTS
    Proc = {p1}   Thread = {t1, t2}   Mutex = {mx1}   Cond = {cv1}
    MaxThreads = 2   MaxProcs = 1   InitProc = p1   InitThread = t1
    Sig = {1}   Unblockable = {}   StopSig = 19   NULL = NULL
    Enabled = { "sched","preempt","sigact","pmask","sleep","kill","async" }
CONSTRAINT StateBound
PROPERTY
    SignalEventuallyDelivered
