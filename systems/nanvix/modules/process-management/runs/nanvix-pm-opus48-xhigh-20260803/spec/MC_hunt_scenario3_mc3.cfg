\* Scenario 3, MC3/MC10 -- a mutex owner that exits detached is drained by the
\* UNSAFE deferred reap after burial: the guard is never dropped, so the mutex
\* stays owned by a fully-reaped thread and any waiter blocks forever.
\* Expected: MutexReleasedOnDeath VIOLATED (witness trace).
SPECIFICATION MCSpec
CONSTANTS
    Proc = {p1}   Thread = {t1, t2}   Mutex = {mx1}   Cond = {cv1}
    MaxThreads = 2   MaxProcs = 1   InitProc = p1   InitThread = t1
    Sig = {9}   Unblockable = {9}   StopSig = 19   NULL = NULL
    Enabled = { "sched","preempt","create","detach","exit","harvest","reapU",
                "reapSafe","lock","lockblk","lockres","unlock" }
CONSTRAINT StateBound
INVARIANT
    TypeOK
    ExactlyOneLocation
    NoRunAfterZombie
    MutexReleasedOnDeath
