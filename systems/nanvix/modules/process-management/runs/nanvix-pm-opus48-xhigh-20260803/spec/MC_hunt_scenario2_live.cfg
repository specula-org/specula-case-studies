\* Scenario 2 (liveness) -- every zombie thread/process must eventually be reaped
\* (join, detach-drain, or parent harvest).  Confirms the reap paths make
\* progress under fairness.  Expected: NO violation (holds).
SPECIFICATION MCSpecFair
CONSTANTS
    Proc = {p1}   Thread = {t1, t2}   Mutex = {mx1}   Cond = {cv1}
    MaxThreads = 2   MaxProcs = 1   InitProc = p1   InitThread = t1
    Sig = {9}   Unblockable = {9}   StopSig = 19   NULL = NULL
    Enabled = { "sched","preempt","create","detach","exit","join","joinres",
                "harvest","reapSafe","reapU" }
CONSTRAINT StateBound
PROPERTY
    NoUnreapableZombie
