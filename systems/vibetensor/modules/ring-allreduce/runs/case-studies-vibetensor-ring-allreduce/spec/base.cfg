\* base.cfg — config for the standalone base spec (smoke / convergence run).
\* Production model checking happens via MC.cfg / MC_hunt_*.cfg.

SPECIFICATION Spec

CONSTANTS
    Rank = {r0, r1}
    NumTiles = 1
    EpochValue = 1
    StaleEpoch = 9
    Nil = "Nil"

    kOk = "kOk"
    kInvalidParams = "kInvalidParams"
    kTimeout = "kTimeout"
    kAbortObserved = "kAbortObserved"

INVARIANTS
    \* Standard / structural
    TypeOK
    PerTileMonotonicity
    StatusMergeMonotonicity
    DrainCounterBound
    RsPublishMonotonic
    NoHostUAF
    FreshnessInvariant

    \* Bug-family invariants are commented out in base.cfg; enable in MC.cfg
    \* hunting configs.
    \* AgreementOnKOk          \* Family 1
    \* StatusCoherence         \* Family 1 (expected to fail under fault)
    \* StatusElevation         \* Family 1 (expected to fail)
    \* AgReady0ImpliesFinalOrAbort  \* Family 2 (expected to fail)
    \* OwnedChunkFinalOnKOk    \* baseline
    \* AllReduceCorrectness    \* baseline
    \* WatchdogPoisons         \* Family 5
