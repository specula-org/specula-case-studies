\* MC.cfg — standard model checking config (safety + structural).
\* Bug-family invariants are commented out; enable per-family in
\* MC_hunt_<family>.cfg for targeted hunting.

SPECIFICATION MCSpec

CONSTANTS
    Rank = {r0, r1}
    NumTiles = 1
    EpochValue = 1
    StaleEpoch = 9
    Nil = "Nil"

    kOk = "kOk"
    kInvalidParams = "kInvalidParams"
    kTimeout = "kTimeout"
    kAbortObserved = "kAbortObserved"

    \* Fault-injection bounds
    MaxWaitTimeoutLimit = 2
    MaxDrainTimeoutLimit = 1
    MaxBarrierTimeoutLimit = 2
    MaxDebugAbortLimit = 1
    MaxAbortBailLimit = 2
    MaxWatchdogLimit = 1
    MaxStaleFlagLimit = 0     \* 0 in baseline; bump for Family-6 hunting

VIEW MCView
CONSTRAINT StateConstraint

INVARIANTS
    \* Standard / structural
    TypeOK
    PerTileMonotonicity
    StatusMergeMonotonicity
    DrainCounterBound
    RsPublishMonotonic
    NoHostUAF
    FreshnessInvariant

    \* Bug-family invariants (commented out — enable in hunting configs)
    \* AgreementOnKOk
    \* StatusCoherence
    \* StatusElevation
    \* AgReady0ImpliesFinalOrAbort
    \* OwnedChunkFinalOnKOk
    \* AllReduceCorrectness
    \* WatchdogPoisons

PROPERTIES
    \* EventuallyAllFinish    \* enable in liveness hunts
