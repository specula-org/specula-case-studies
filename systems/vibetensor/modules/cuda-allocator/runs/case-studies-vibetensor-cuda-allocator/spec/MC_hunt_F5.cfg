\* ============================================================================
\* MC_hunt_F5.cfg — Family 5 (Fraction-cap TOCTOU between gate and cudaMalloc).
\* Goal: two threads both PassGate while reservedBytes+1 <= limit, then both
\* RawAllocNewBlock -> reservedBytes > FractionLimit without breach/misfire.
\* ============================================================================

SPECIFICATION MCSpec

CONSTANTS
    Threads      = {t1, t2}
    Streams      = {s1}
    BlockIds     = {b1, b2, b3}
    PoolIds      = {p0}
    DefaultPool  = p0
    FractionLimit = 2
    MaxPoolOps   = 0
    NullBlock    = NB
    NullStream   = NS

    MaxSplitOps     = 0
    MaxCaptureOps   = 0
    MaxCaptureFlips = 0
    MaxMallocFlips  = 0
    MaxGcOps        = 0
    MaxRecordFails  = 0
    Liveness        = FALSE

SYMMETRY Perms
VIEW     View

CONSTRAINT
    QueueBound

INVARIANTS
    TypeOK
    ReservedLimitRespected
