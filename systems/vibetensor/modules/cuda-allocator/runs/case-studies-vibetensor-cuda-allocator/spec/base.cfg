\* Base-only config. The MC spec overrides and bounds counter-sensitive
\* actions; this config is intentionally minimal and used for spec validation
\* (e.g. TLC ValueError checks).

SPECIFICATION Spec

CONSTANTS
    Threads      = {t1, t2}
    Streams      = {s1, s2}
    BlockIds     = {b1, b2, b3, b4}
    PoolIds      = {p0, p1}
    DefaultPool  = p0
    FractionLimit = 4
    MaxPoolOps   = 4
    NullBlock    = NB
    NullStream   = NS

\* Standard safety
INVARIANTS
    TypeOK
    FreeListConsistency
    NoDoubleFree
    SegmentChainWellFormed
    RoutingFlagMatchesTLS
    PoolRefcntWellFounded
    ReservedLimitRespected
    \* Bug-family invariants are in MC_hunt_* configs only.
