\* ============================================================================
\* MC_hunt_F2.cfg — Family 2 (Non-idempotent concurrent process_events flush).
\* Goal: two threads in PeSnapshotted, both RecordOk, both Publish — observe
\* duplicate limbo entry / double event_count increment.
\* ============================================================================

SPECIFICATION MCSpec

CONSTANTS
    Threads      = {t1, t2}
    Streams      = {s1, s2}
    BlockIds     = {b1, b2}
    PoolIds      = {p0}
    DefaultPool  = p0
    FractionLimit = 100
    MaxPoolOps   = 0
    NullBlock    = NB
    NullStream   = NS

    MaxSplitOps     = 0
    MaxCaptureOps   = 0
    MaxCaptureFlips = 2
    MaxMallocFlips  = 0
    MaxGcOps        = 0
    MaxRecordFails  = 0
    Liveness        = FALSE

SYMMETRY Perms
VIEW     View

CONSTRAINT
    QueueBound

INVARIANTS
    TypeOK
    NoDanglingLimbo
    EventCountConsistent
