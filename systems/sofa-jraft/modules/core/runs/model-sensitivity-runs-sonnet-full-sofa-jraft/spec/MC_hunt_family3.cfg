\* MC_hunt_family3.cfg — Snapshot Install / Applied-Index Notification Ordering (Family 3)
\*
\* Targets: MC-5 (shared with Family 4) — after leader step-down, pending ReadIndex
\* request with readIndex <= snapshot's lastIncludedIndex can be resolved by the
\* former leader as a follower's onApplied() callback, returning stale-read success.
\*
\* Mechanism: doSnapshotLoad sets lastAppliedIndex directly (FSMCallerImpl.java:728-731)
\* without calling notifyLastAppliedIndexUpdated(); ReadOnlyService never receives
\* the snapshot-apply notification; pendingReadIndex closures sit until periodic
\* scanner fires them; if node steps down in between, follower fires them with success.
\*
\* Expected violations: NoPendingReadAfterStepDown, ReadIndexSafety

SPECIFICATION MCSpec

CONSTANTS
    Server    = {s1, s2, s3}
    Values    = {v1}
    Nil       = nil

    Leader    = Leader
    Candidate = Candidate
    Follower  = Follower

    RequestVoteRequest      = RequestVoteRequest
    RequestVoteResponse     = RequestVoteResponse
    AppendEntriesRequest    = AppendEntriesRequest
    AppendEntriesResponse   = AppendEntriesResponse
    InstallSnapshotRequest  = InstallSnapshotRequest
    InstallSnapshotResponse = InstallSnapshotResponse

    MSubtypeNormal   = MSubtypeNormal
    MSubtypeEBUSY    = MSubtypeEBUSY
    MSubtypeSnapshot = MSubtypeSnapshot

    PersistStepNone = PersistStepNone
    PersistStepTerm = PersistStepTerm
    PersistStepVote = PersistStepVote

\* Enable reads and snapshots; enable stepDown; minimize crash (not the Family 3 mechanism)
CONSTANTS
    MaxTimeoutLimit   = 3
    MaxCrashLimit     = 0
    MaxRequestLimit   = 2
    MaxSnapshotLimit  = 2
    MaxReadLimit      = 3
    MaxStepDownLimit  = 2
    MaxTermLimit      = 3
    MaxMsgBufferLimit = 10

SYMMETRY Symmetry
CONSTRAINT MCMsgBound

\* Structural
INVARIANT TypeOK

\* Standard safety
INVARIANT ElectionSafety

\* Family 3 + 4 targets
INVARIANT NoPendingReadAfterStepDown
INVARIANT ReadIndexSafety
