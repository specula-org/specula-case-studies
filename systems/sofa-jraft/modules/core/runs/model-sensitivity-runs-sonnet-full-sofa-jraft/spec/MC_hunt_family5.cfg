\* MC_hunt_family5.cfg — Code Path Inconsistencies in Protocol Handlers (Family 5)
\*
\* Targets:
\*   Missing updateLastLeaderTimestamp in handleInstallSnapshot
\*   (NodeImpl.java:3422 vs handleAppendEntriesRequest:1994)
\*   A follower receiving ONLY InstallSnapshot RPCs never updates lastLeaderContact;
\*   isCurrentLeaderValid() returns false; handleElectionTimeout fires a spurious election.
\*
\* This is primarily a LIVENESS violation (spurious elections during snapshot catch-up),
\* but can interact with safety if the spurious election produces a leader at a higher
\* term while the original leader is still committing entries.
\*
\* Expected violations: ElectionSafety (under spurious election), StepDownOnHigherTerm

SPECIFICATION MCSpec

CONSTANTS
    Server    = {s1, s2, s3}
    Values    = {v1}
    Nil       = nil

    Leader    = Leader
    Candidate = Candidate
    Follower  = Follower

    RequestVoteRequest      = RequestVoteRequest
    RequestVoteResponse     = RequestVoteResponse
    AppendEntriesRequest    = AppendEntriesRequest
    AppendEntriesResponse   = AppendEntriesResponse
    InstallSnapshotRequest  = InstallSnapshotRequest
    InstallSnapshotResponse = InstallSnapshotResponse

    MSubtypeNormal   = MSubtypeNormal
    MSubtypeEBUSY    = MSubtypeEBUSY
    MSubtypeSnapshot = MSubtypeSnapshot

    PersistStepNone = PersistStepNone
    PersistStepTerm = PersistStepTerm
    PersistStepVote = PersistStepVote

\* Enable snapshots (exercises the buggy handleInstallSnapshot path);
\* enable elections to detect spurious ones; disable crash (not the mechanism here)
CONSTANTS
    MaxTimeoutLimit   = 4
    MaxCrashLimit     = 0
    MaxRequestLimit   = 2
    MaxSnapshotLimit  = 3
    MaxReadLimit      = 0
    MaxStepDownLimit  = 1
    MaxTermLimit      = 4
    MaxMsgBufferLimit = 10

SYMMETRY Symmetry
CONSTRAINT MCMsgBound

\* Structural
INVARIANT TypeOK

\* Standard safety
INVARIANT ElectionSafety

\* Family 5 uses StepDownOnHigherTerm as secondary indicator
INVARIANT StepDownOnHigherTerm
