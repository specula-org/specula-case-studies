SPECIFICATION MCSpec

\* ============================================================================
\* Server set and abstract values
\* ============================================================================

CONSTANTS
    Server    = {s1, s2, s3}
    Values    = {v1, v2}
    Nil       = nil

\* ============================================================================
\* Role, message type, and protocol constants
\* ============================================================================

CONSTANTS
    Leader    = Leader
    Candidate = Candidate
    Follower  = Follower

    RequestVoteRequest      = RequestVoteRequest
    RequestVoteResponse     = RequestVoteResponse
    AppendEntriesRequest    = AppendEntriesRequest
    AppendEntriesResponse   = AppendEntriesResponse
    InstallSnapshotRequest  = InstallSnapshotRequest
    InstallSnapshotResponse = InstallSnapshotResponse

    MSubtypeNormal   = MSubtypeNormal
    MSubtypeEBUSY    = MSubtypeEBUSY
    MSubtypeSnapshot = MSubtypeSnapshot

    PersistStepNone = PersistStepNone
    PersistStepTerm = PersistStepTerm
    PersistStepVote = PersistStepVote

\* ============================================================================
\* Bound constants — tune for state space vs coverage tradeoff
\* ============================================================================

CONSTANTS
    MaxTimeoutLimit   = 5
    MaxCrashLimit     = 2
    MaxRequestLimit   = 3
    MaxSnapshotLimit  = 2
    MaxReadLimit      = 3
    MaxStepDownLimit  = 2
    MaxTermLimit      = 4
    MaxMsgBufferLimit = 10

\* ============================================================================
\* Symmetry
\* ============================================================================

SYMMETRY Symmetry

\* ============================================================================
\* State space constraint
\* ============================================================================

CONSTRAINT MCMsgBound

\* ============================================================================
\* Structural invariants (always enabled during spec validation)
\* ============================================================================

INVARIANT TypeOK
INVARIANT PersistMonotone
INVARIANT CommitMonotone

\* ============================================================================
\* Standard Safety (always enabled)
\* ============================================================================

INVARIANT ElectionSafety
INVARIANT LogMatching

\* ============================================================================
\* Bug-family extension invariants (commented out — enable in hunt cfgs)
\* ============================================================================

\* Family 1 — Non-Atomic Vote Persistence
\* INVARIANT VoteOncePerTerm
\* INVARIANT PersistBeforeSend

\* Family 2 — Missing Higher-Term Check on Response Paths
\* INVARIANT StepDownOnHigherTerm

\* Families 3+4 — ReadIndex Pending Lifecycle / ReadIndex Safety Gaps
\* INVARIANT ReadIndexSafety
\* INVARIANT NoPendingReadAfterStepDown
