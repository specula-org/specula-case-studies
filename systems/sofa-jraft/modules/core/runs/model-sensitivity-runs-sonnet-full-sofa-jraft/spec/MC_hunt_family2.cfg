\* MC_hunt_family2.cfg — Missing Higher-Term Check on RPC Response Paths (Family 2)
\*
\* Targets:
\*   MC-2 — InstallSnapshot response missing term check: leader stays active after
\*           follower has seen higher term and responded to InstallSnapshot.
\*   MC-3 — EBUSY early-return bypasses term check: leader remains active when quorum
\*           has elected a new leader at higher term (follower responds EBUSY + higher term).
\*
\* Expected violations: StepDownOnHigherTerm, ElectionSafety, LeaderCompleteness
\*
\* Strategy: enable snapshot; zero crash (crash is Family 1's mechanism); enable
\* a few elections to generate a higher term at a follower; check StepDownOnHigherTerm.

SPECIFICATION MCSpec

CONSTANTS
    Server    = {s1, s2, s3}
    Values    = {v1}
    Nil       = nil

    Leader    = Leader
    Candidate = Candidate
    Follower  = Follower

    RequestVoteRequest      = RequestVoteRequest
    RequestVoteResponse     = RequestVoteResponse
    AppendEntriesRequest    = AppendEntriesRequest
    AppendEntriesResponse   = AppendEntriesResponse
    InstallSnapshotRequest  = InstallSnapshotRequest
    InstallSnapshotResponse = InstallSnapshotResponse

    MSubtypeNormal   = MSubtypeNormal
    MSubtypeEBUSY    = MSubtypeEBUSY
    MSubtypeSnapshot = MSubtypeSnapshot

    PersistStepNone = PersistStepNone
    PersistStepTerm = PersistStepTerm
    PersistStepVote = PersistStepVote

\* Tight bounds: elections create term divergence; snapshots exercise buggy path
CONSTANTS
    MaxTimeoutLimit   = 4
    MaxCrashLimit     = 0
    MaxRequestLimit   = 2
    MaxSnapshotLimit  = 2
    MaxReadLimit      = 0
    MaxStepDownLimit  = 0
    MaxTermLimit      = 4
    MaxMsgBufferLimit = 10

SYMMETRY Symmetry
CONSTRAINT MCMsgBound

\* Structural
INVARIANT TypeOK

\* Standard safety
INVARIANT ElectionSafety
INVARIANT LeaderCompleteness

\* Family 2 target
INVARIANT StepDownOnHigherTerm
