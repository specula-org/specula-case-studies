\* MC_hunt_family1.cfg — Non-Atomic Vote Persistence (Family 1)
\*
\* Targets: MC-1 — two-write window in higher-term vote grant.
\* Mechanism: crash after PersistTermEmptyVote (write 1) but before PersistActualVote
\*            (write 2) lets the server vote again after restart in the same term.
\* Expected violations: VoteOncePerTerm, PersistBeforeSend, ElectionSafety
\*
\* Strategy: 3-server cluster; enable crash; keep read/snapshot/stepdown at 0
\* to focus exploration on election + crash cycles.

SPECIFICATION MCSpec

CONSTANTS
    Server    = {s1, s2, s3}
    Values    = {v1}
    Nil       = nil

    Leader    = Leader
    Candidate = Candidate
    Follower  = Follower

    RequestVoteRequest      = RequestVoteRequest
    RequestVoteResponse     = RequestVoteResponse
    AppendEntriesRequest    = AppendEntriesRequest
    AppendEntriesResponse   = AppendEntriesResponse
    InstallSnapshotRequest  = InstallSnapshotRequest
    InstallSnapshotResponse = InstallSnapshotResponse

    MSubtypeNormal   = MSubtypeNormal
    MSubtypeEBUSY    = MSubtypeEBUSY
    MSubtypeSnapshot = MSubtypeSnapshot

    PersistStepNone = PersistStepNone
    PersistStepTerm = PersistStepTerm
    PersistStepVote = PersistStepVote

\* Tight bounds: focus on election + crash cycles only
CONSTANTS
    MaxTimeoutLimit   = 4
    MaxCrashLimit     = 2
    MaxRequestLimit   = 1
    MaxSnapshotLimit  = 0
    MaxReadLimit      = 0
    MaxStepDownLimit  = 0
    MaxTermLimit      = 4
    MaxMsgBufferLimit = 8

SYMMETRY Symmetry
CONSTRAINT MCMsgBound

\* Structural
INVARIANT TypeOK
INVARIANT PersistMonotone

\* Standard safety
INVARIANT ElectionSafety

\* Family 1 targets
INVARIANT VoteOncePerTerm
INVARIANT PersistBeforeSend
