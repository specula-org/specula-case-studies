\* MC_hunt_family4.cfg — ReadIndex Safety Gaps (Family 4)
\*
\* Targets:
\*   MC-4 — single-node cluster: freshly elected leader serves ReadIndex before
\*           committing a no-op at its term (quorum==1 fast-path skips the guard).
\*   MC-5 — pending ReadIndex after step-down: former leader's ReadOnlyService
\*           fires pending closures with success after stepping down.
\*
\* Expected violations: ReadIndexSafety, NoPendingReadAfterStepDown
\*
\* Strategy for MC-4: use a SINGLE-SERVER cluster (quorum=1 triggers the fast-path).
\* Strategy for MC-5: 3-server cluster with enabled reads + stepDown.

SPECIFICATION MCSpec

\* --- MC-4 variant: single-server ---
CONSTANTS
    Server    = {s1}
    Values    = {v1}
    Nil       = nil

    Leader    = Leader
    Candidate = Candidate
    Follower  = Follower

    RequestVoteRequest      = RequestVoteRequest
    RequestVoteResponse     = RequestVoteResponse
    AppendEntriesRequest    = AppendEntriesRequest
    AppendEntriesResponse   = AppendEntriesResponse
    InstallSnapshotRequest  = InstallSnapshotRequest
    InstallSnapshotResponse = InstallSnapshotResponse

    MSubtypeNormal   = MSubtypeNormal
    MSubtypeEBUSY    = MSubtypeEBUSY
    MSubtypeSnapshot = MSubtypeSnapshot

    PersistStepNone = PersistStepNone
    PersistStepTerm = PersistStepTerm
    PersistStepVote = PersistStepVote

CONSTANTS
    MaxTimeoutLimit   = 3
    MaxCrashLimit     = 0
    MaxRequestLimit   = 2
    MaxSnapshotLimit  = 0
    MaxReadLimit      = 3
    MaxStepDownLimit  = 2
    MaxTermLimit      = 3
    MaxMsgBufferLimit = 6

CONSTRAINT MCMsgBound

\* Structural
INVARIANT TypeOK

\* Standard safety
INVARIANT ElectionSafety

\* Family 4 targets
INVARIANT ReadIndexSafety
INVARIANT NoPendingReadAfterStepDown
