SPECIFICATION MCSpecDynamic

CONSTANTS
    s1 = s1
    s2 = s2
    s3 = s3

    Server = {s1, s2, s3}

    \* Constraint limits — tuned for tractable state space with 3 servers
    MaxTermLimit        = 4
    MaxTimeoutLimit     = 5
    RequestLimit        = 3
    HeartbeatLimit      = 0
    LoseLimit           = 3
    StepDownLimit       = 2
    PreVoteLimit        = 3
    ConfigChangeLimit   = 2
    ExpireWithholdLimit = 4
    MaxMsgBufferLimit   = 10

    \* Action overrides (inject counter constraints via operator replacement)
    Timeout             <- MCTimeout
    PreVote             <- MCPreVote
    ClientRequest       <- MCClientRequest
    LoseMessage         <- MCLoseMessage
    StepDown            <- MCStepDown
    ProposeConfigChange <- MCProposeConfigChange
    ExpireWithholdVotes <- MCExpireWithholdVotes

    \* Type constants
    Nil = Nil

    Follower    = Follower
    Candidate   = Candidate
    Leader      = Leader

    ValueEntry  = ValueEntry
    ConfigEntry = ConfigEntry
    NoOpEntry   = NoOpEntry

    RequestVoteRequest      = RequestVoteRequest
    RequestVoteResponse     = RequestVoteResponse
    AppendEntriesRequest    = AppendEntriesRequest
    AppendEntriesResponse   = AppendEntriesResponse

SYMMETRY Symmetry

CHECK_DEADLOCK
    FALSE

\* ============================================================================
\* State Space Pruning
\* ============================================================================
CONSTRAINT
    MsgBufferConstraint

\* ============================================================================
\* Core Raft Safety Invariants (from base spec)
\* ============================================================================
INVARIANTS
    ElectionSafety
    LogMatching
    LeaderCompleteness

\* ============================================================================
\* Structural Invariants (from MC spec)
\* ============================================================================
INVARIANTS
    CommitIndexBoundInv
    \* CandidateVotedForSelfInv  \* Removed: incompatible with PreVote (PreVote Candidate keeps old votedFor)
    LeaderTermPositiveInv
    ActiveConfigValidInv
    CommittedConfigValidInv
    LeaderLogCompleteness

\* ============================================================================
\* Bug Detection Invariants
\* Known bug patterns in Kudu Raft — enable to reproduce violations.
\* ============================================================================
\* INVARIANTS
\*     CommitIndexBoundedByReceived
\*     SinglePendingConfig
\*     ConfigChangeRequiresCommit
\*     VoterOnlyQuorum
\*     LeaderNOOPBeforeConfigChange

\* ============================================================================
\* Temporal Properties
\* ============================================================================
PROPERTIES
    MonotonicTermProp
    LeaderAppendOnlyProp
    LeaderCommitCurrentTermLogsProp
