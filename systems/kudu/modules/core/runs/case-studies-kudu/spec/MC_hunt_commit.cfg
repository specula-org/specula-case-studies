\* Hunting config for Bug Family 1: Commit Index / Log Matching Safety
\* Targets: CommitIndexBoundedByReceived, LogMatching, LeaderCompleteness
\* Mechanism: partial batch + high commit index causes follower to commit wrong ops
\* Reference: KUDU-639 (639d8d90d)

SPECIFICATION MCSpec

CONSTANTS
    s1 = s1
    s2 = s2
    s3 = s3

    Server = {s1, s2, s3}

    \* Tight bounds: focus on log replication and commit advancement
    MaxTermLimit        = 3
    MaxTimeoutLimit     = 3
    RequestLimit        = 3
    HeartbeatLimit      = 0
    LoseLimit           = 2
    StepDownLimit       = 0
    PreVoteLimit        = 0
    ConfigChangeLimit   = 0
    ExpireWithholdLimit = 3
    MaxMsgBufferLimit   = 8

    Timeout             <- MCTimeout
    PreVote             <- MCPreVote
    ClientRequest       <- MCClientRequest
    LoseMessage         <- MCLoseMessage
    StepDown            <- MCStepDown
    ProposeConfigChange <- MCProposeConfigChange
    ExpireWithholdVotes <- MCExpireWithholdVotes

    Nil = Nil
    Follower    = Follower
    Candidate   = Candidate
    Leader      = Leader
    ValueEntry  = ValueEntry
    ConfigEntry = ConfigEntry
    NoOpEntry   = NoOpEntry
    RequestVoteRequest      = RequestVoteRequest
    RequestVoteResponse     = RequestVoteResponse
    AppendEntriesRequest    = AppendEntriesRequest
    AppendEntriesResponse   = AppendEntriesResponse

SYMMETRY Symmetry

CHECK_DEADLOCK FALSE

CONSTRAINT MsgBufferConstraint

\* Target invariants + core safety
INVARIANTS
    ElectionSafety
    LogMatching
    LeaderCompleteness
    CommitIndexBoundedByReceived
