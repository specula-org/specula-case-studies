\* Hunting config: Family 1 — Memory Ordering Protocol
\* Enable fence skip faults, check NoWriteWhileRead violation.
\* Expected: VIOLATION (reader sees stale pointer without SeqCst fence)

SPECIFICATION MCSpec

CONSTANTS
    Reader = {R1, R2}
    MaxOps = 2

    \* Family 1: enable fence faults
    MaxReaderFenceSkips = 1
    MaxWriterFenceSkips = 1

    \* Disable other families
    MaxNonDetAbsorbs = 0
    MaxClones = 0
    MaxRegistrations = 0
    MaxTakeInner = 0
    MaxTryPublish = 0

CONSTRAINT MCStateConstraint

SYMMETRY MCSymmetry

\* Core safety + ordering extension
INVARIANTS
    MCTypeOK
    MCOrderingNoWriteWhileRead
