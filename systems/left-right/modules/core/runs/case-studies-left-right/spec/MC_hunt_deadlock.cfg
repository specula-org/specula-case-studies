\* Hunting config: Family 3 — Reader Lifecycle / Deadlock
\* Enable clone attempts, check for deadlock (TLC -deadlock disabled).
\* Expected: DEADLOCK (reader clones while holding guard + writer waiting)

SPECIFICATION MCSpec

CONSTANTS
    Reader = {R1, R2}
    MaxOps = 2

    \* Family 3: enable clones
    MaxClones = 1
    MaxRegistrations = 1

    \* Disable other families
    MaxReaderFenceSkips = 0
    MaxWriterFenceSkips = 0
    MaxNonDetAbsorbs = 0
    MaxTakeInner = 0
    MaxTryPublish = 0

CONSTRAINT MCStateConstraint

SYMMETRY MCSymmetry

\* Only structural invariants — deadlock detection is the primary check
INVARIANTS
    MCTypeOK
    MCEpochParity

\* NOTE: Run WITHOUT -deadlock flag so TLC reports deadlocks
