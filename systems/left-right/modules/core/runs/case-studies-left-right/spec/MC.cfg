\* Model checking config for left-right specification
\* Standard safety + structural invariants. Extension invariants commented out.

SPECIFICATION MCSpec

CONSTANTS
    Reader = {R1, R2}
    MaxOps = 3

    \* Counter bounds — no faults during convergence
    MaxReaderFenceSkips = 0
    MaxWriterFenceSkips = 0
    MaxNonDetAbsorbs = 0
    MaxClones = 0
    MaxRegistrations = 0
    MaxTakeInner = 0
    MaxTryPublish = 0

CONSTRAINT MCStateConstraint

SYMMETRY MCSymmetry

\* --- Structural invariants (always checked) ---
INVARIANTS
    MCTypeOK
    MCEpochParity
    MCPointerDisjoint

\* --- Safety invariants (always checked) ---
    MCNoWriteWhileRead
    MCApplyCorrectness
    MCVariantSafety

\* --- Extension invariants (uncomment for targeted bug hunting) ---
\* MCOrderingNoWriteWhileRead
\* MCAbsorbApplyCorrectness
