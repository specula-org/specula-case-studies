\* MC_hunt_F1_uaf_fixed.cfg — F1 with PR #144 fix applied.
\*
\* Same setup as MC_hunt_F1_uaf.cfg, but ApplyPR144Fix = TRUE so the
\* spec's WriterTakeInnerResnapshot action fires after the NULL swap.
\*
\* Expected: MCNoDropWhileRead HOLDS — i.e., refreshing lastEpochs after
\* the NULL swap closes the F1 race.

SPECIFICATION MCSpec

CONSTANTS
    Reader = {R1, R2}
    MaxOps = 2
    ApplyPR144Fix = TRUE

    MaxPublish      = 2
    MaxTryPublish   = 0
    MaxTakeInner    = 1
    MaxClientHolds  = 0

CONSTRAINT MCStateConstraint
SYMMETRY MCSymmetry

INVARIANTS
    MCTypeOK
    MCEpochParity
    MCPointerDisjoint
    MCNoDropWhileRead
    MCStaleSnapshotIsCaught
