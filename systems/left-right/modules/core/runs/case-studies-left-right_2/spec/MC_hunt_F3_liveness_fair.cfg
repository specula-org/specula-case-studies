\* MC_hunt_F3_liveness_fair.cfg — F3: liveness HOLDS under reader-fairness.
\*
\* Same setup as MC_hunt_F3_liveness.cfg, but with weak fairness on
\* ClientHoldGuardRelease (and on the writer's publish actions).  Models
\* the *contract-compliant* world where a reader eventually releases.
\*
\* Expected: EventualPublish HOLDS — the protocol is correct under the
\* documented contract.

SPECIFICATION MCSpecWithReleaseFairness

CONSTANTS
    Reader = {R1, R2}
    MaxOps = 1
    ApplyPR144Fix = FALSE

    MaxPublish      = 1
    MaxTryPublish   = 0
    MaxTakeInner    = 0
    MaxClientHolds  = 1

CONSTRAINT MCStateConstraint
SYMMETRY MCSymmetry

PROPERTIES
    EventualPublish

INVARIANTS
    MCTypeOK
    MCEpochParity
    MCPointerDisjoint
