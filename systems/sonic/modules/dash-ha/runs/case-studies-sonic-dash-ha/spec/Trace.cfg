\* Trace.cfg — Trace validation configuration.
\* Override JSON path via: java -jar tla2tools.jar -config Trace.cfg -DJSON=path Trace

CONSTANTS
    Node = {"n1", "n2"}
    MaxTerm = 10
    MaxRetries = 10

INIT TraceInit
NEXT TraceNext

\* Trace completion: deadlock-based checking.
\* If the trace can't be consumed, TLC reports a deadlock.
\* If fully consumed, the stuttering disjunct (l > Len) prevents deadlock.
\* (TraceMatched as PROPERTIES fails with INIT/NEXT due to trivial stuttering.)

\* Safety invariants (should hold on every real execution)
INVARIANT TraceSingleDecisionMaker
INVARIANT TraceNoDoubleActive
INVARIANT TraceNoStandaloneStandalone

\* Structural invariants (catch spec modeling errors)
INVARIANT TraceMessageWellFormed
INVARIANT TraceNoDoubleInitActive
