\* MC_hunt_switchover.cfg — Bug Family 4: Switchover Safety
\* Targets: MC-10 (switchover during concurrent DPU failure → dual decision maker)
\* Strategy: Enable switchover + health changes + message loss, check SingleDecisionMaker.

CONSTANTS
    Node = {n1, n2}
    MaxTerm = 4
    MaxRetries = 2

    \* Focus on switchover + concurrent failure
    MaxCrashLimit = 1
    MaxLoseLimit = 3
    MaxDeleteLimit = 0
    MaxDesiredChangeLimit = 3
    MaxHealthChangeLimit = 4
    MaxStandaloneLimit = 2

SYMMETRY ModelSymmetry

INIT MCInit
NEXT MCNext

\* Target invariant — the key safety property
INVARIANT SingleDecisionMaker

\* Supporting invariants
INVARIANT NoDoubleActive
INVARIANT NoStandaloneStandalone
INVARIANT TypeOK

CONSTRAINT MsgBufferConstraint
