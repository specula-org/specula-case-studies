SPECIFICATION MCSpec

CONSTANTS
    Node = {"n1", "n2"}
    Peer = {"peer-a", "peer-b"}
    PreferredNode = "n1"
    MaxEpoch = 2
    MaxGeneration = 2
    MaxRequestId = 2
    MaxOperationId = 1
    MaxMessageAge = 1
    MaxRetry = 2

    ConfigSetLimit = 0
    ConfigDeleteLimit = 0
    PeerSendLimit = 2
    AckLossLimit = 0
    MaintenanceLimit = 0
    RePairLimit = 1
    CrashLimit = 0
    CleanupLimit = 0
    PendingEdgeLimit = 0
    TransitionLimit = 1
    RouteComputeLimit = 0
    RetryEventLimit = 0
    MaxMsgBufferLimit = 2
    MaxRoleWriteLimit = 1

    ConsumerBridgeConfigSet <- MCConsumerBridgeConfigSet
    ConsumerBridgeConfigDelete <- MCConsumerBridgeConfigDelete
    OutgoingSendHaScopeState <- MCOutgoingSendHaScopeState
    NetworkLoseAck <- MCNetworkLoseAck
    OutgoingDriveMaintenanceLoop <- MCOutgoingDriveMaintenanceLoop
    NpuHandleHaSetStateUpdateRePairResolved <- MCNpuHandleHaSetStateUpdateRePairResolved
    NpuHandleHaSetStateUpdateRePairUnresolved <- MCNpuHandleHaSetStateUpdateRePairUnresolved
    Crash <- MCCrash
    ActorDriverCleanupTimeout <- MCActorDriverCleanupTimeout
    DpuHandlePendingOperation <- MCDpuHandlePendingOperation
    NpuDriveStateMachine <- MCNpuDriveStateMachine
    HaSetComputeRouteFromScope <- MCHaSetComputeRouteFromScope
    HaSetComputeRouteFromConfig <- MCHaSetComputeRouteFromConfig
    HaSetComputeRouteFromReplay <- MCHaSetComputeRouteFromReplay
    NpuHandleVoteRequestRetry <- MCNpuHandleVoteRequestRetry
    NpuHandleVoteRequestFinal <- MCNpuHandleVoteRequestFinal
    NpuHandleSwitchoverRst <- MCNpuHandleSwitchoverRst
    NpuHandleSwitchoverFin <- MCNpuHandleSwitchoverFin
    NpuCheckPeerConnectionAndRetry <- MCNpuCheckPeerConnectionAndRetry

SYMMETRY Symmetry
VIEW ModelView
CHECK_DEADLOCK FALSE
CONSTRAINT MsgBufferConstraint
CONSTRAINT RoleWriteConstraint

\* Scenario 3 / MC3: old-relationship traffic must not affect the new pair.
INVARIANTS
    TypeOK
    MessageIdsUnique
    CurrentPeerIsolation
    AckedTransitionSafety
    SingleDecisionMaker

