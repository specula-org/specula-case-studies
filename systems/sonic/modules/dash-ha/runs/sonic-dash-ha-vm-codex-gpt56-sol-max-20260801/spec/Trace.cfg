SPECIFICATION TraceSpec

CONSTANTS
    Node = {"n1", "n2"}
    Peer = {"peer-a", "peer-b"}
    PreferredNode = "n1"

    MaxEpoch       = 2
    MaxGeneration  = 2
    MaxRequestId   = 3
    MaxOperationId = 3
    MaxMessageAge  = 2
    MaxRetry       = 2

VIEW TraceView
ALIAS TraceAlias

CHECK_DEADLOCK FALSE

\* Mandatory: a prefix that cannot consume its final event is a failure.
PROPERTIES TraceMatched

\* Real executions must retain structural and protocol safety.  Temporal
\* convergence properties are intentionally excluded from finite trace replay.
INVARIANTS
    TypeOK
    MessageIdsUnique
    EffectPipelineOrdered
    ActorRouteConsistent
    PendingOperationIdsUnique
    SingleDecisionMaker
    LegalRolePair
    TermNonRegression
    AckedTransitionSafety
    ParentBeforeScope
    RouteMatchesAckedOwner
    CurrentPeerIsolation
    PendingOperationBijective
    RetryIsolation

