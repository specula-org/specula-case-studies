\* Hunting config for Bug Family 5: Warm Boot Recovery Race
\* Targets: M7 (warm_reboot_disconn_time cleared by iccp_csm_status_reset)
\* Strategy: Warm boot peer, disconnect, check FDB cleanup

SPECIFICATION MCSpec

CONSTANTS
    p1 = p1
    p2 = p2

    Peer = {p1, p2}
    MAC = {m1}
    MaxNodeId = 2
    MaxTimer = 2
    Nil = Nil

    Active = Active
    Standby = Standby

    MlacpInit = MlacpInit
    MlacpStage1 = MlacpStage1
    MlacpStage2 = MlacpStage2
    MlacpExchange = MlacpExchange
    MlacpError = MlacpError

    PortStateUp = PortStateUp
    PortStateDown = PortStateDown

    SysConfigMsg = SysConfigMsg
    SyncRequestMsg = SyncRequestMsg
    SyncDataDoneMsg = SyncDataDoneMsg
    HeartbeatMsg = HeartbeatMsg
    MacSyncAddMsg = MacSyncAddMsg
    MacSyncDelMsg = MacSyncDelMsg
    NAKSysConfigMsg = NAKSysConfigMsg
    NAKOtherMsg = NAKOtherMsg
    WarmBootMsg = WarmBootMsg

    \* Tight bounds: need warm boot + disconnect, minimize everything else
    MaxDisconnectLimit = 2  \* Need disconnect after warm boot
    MaxLoseLimit = 0
    MaxTimerTickLimit = 0
    MaxNAKLimit = 0
    MaxPortFlapLimit = 0
    MaxWarmBootLimit = 2    \* Need warm boot notification
    MaxMsgBufferLimit = 4

    TcpDisconnect  <- MCTcpDisconnect
    MessageLoss    <- MCMessageLoss
    TimerTick      <- MCTimerTick
    MlacpSendNAK   <- MCMlacpSendNAK
    PortChannelDown    <- MCPortChannelDown
    PortChannelUp      <- MCPortChannelUp
    SendWarmBoot   <- MCSendWarmBoot

VIEW ModelView
CONSTRAINT MsgBufferConstraint

CHECK_DEADLOCK
    FALSE

\* Target invariant for Family 5
INVARIANTS
    RoleConsistency
    WarmBootFdbConsistency
