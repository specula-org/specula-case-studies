\* Hunting config for Bug Family 3: Node ID Collision Livelock
\* Targets: M6 (both peers increment simultaneously, never diverging)
\* Strategy: Start with same node_id, complete handshake, check divergence

SPECIFICATION MCSpec

CONSTANTS
    p1 = p1
    p2 = p2

    Peer = {p1, p2}
    MAC = {m1}
    MaxNodeId = 4           \* Need room for multiple increments
    MaxTimer = 2
    Nil = Nil

    Active = Active
    Standby = Standby

    MlacpInit = MlacpInit
    MlacpStage1 = MlacpStage1
    MlacpStage2 = MlacpStage2
    MlacpExchange = MlacpExchange
    MlacpError = MlacpError

    PortStateUp = PortStateUp
    PortStateDown = PortStateDown

    SysConfigMsg = SysConfigMsg
    SyncRequestMsg = SyncRequestMsg
    SyncDataDoneMsg = SyncDataDoneMsg
    HeartbeatMsg = HeartbeatMsg
    MacSyncAddMsg = MacSyncAddMsg
    MacSyncDelMsg = MacSyncDelMsg
    NAKSysConfigMsg = NAKSysConfigMsg
    NAKOtherMsg = NAKOtherMsg
    WarmBootMsg = WarmBootMsg

    \* Tight bounds: only need handshake + SysConfig exchange
    MaxDisconnectLimit = 0
    MaxLoseLimit = 0
    MaxTimerTickLimit = 0
    MaxNAKLimit = 0
    MaxPortFlapLimit = 0
    MaxWarmBootLimit = 0
    MaxMsgBufferLimit = 6

    TcpDisconnect  <- MCTcpDisconnect
    MessageLoss    <- MCMessageLoss
    TimerTick      <- MCTimerTick
    MlacpSendNAK   <- MCMlacpSendNAK
    PortChannelDown    <- MCPortChannelDown
    PortChannelUp      <- MCPortChannelUp
    SendWarmBoot   <- MCSendWarmBoot

VIEW ModelView
CONSTRAINT MsgBufferConstraint

CHECK_DEADLOCK
    FALSE

\* Target invariant for Family 3
INVARIANTS
    RoleConsistency
    NodeIdCollisionDetected
