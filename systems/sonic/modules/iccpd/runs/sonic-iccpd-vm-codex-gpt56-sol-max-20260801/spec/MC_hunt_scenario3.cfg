    MaxVersion = 1
    MaxLagGen = 4
    MaxHeartbeatAge = 1
    MaxProgress = 3

    NoEpoch = NoEpoch
    NoVersion = NoVersion
    NoGen = NoGen
    NoFrame = NoFrame

    \* Scenario 3: rapid DOWN/UP ABA, no-match ACK, or one apply failure.
    MaxWarmLimit = 0
    MaxDisconnectLimit = 0
    MaxCrashLimit = 0
    MaxReconnectLimit = 0
    MaxPartialWriteLimit = 0
    MaxFailedWriteLimit = 0
    MaxResyncLimit = 0
    MaxObjectUpdateLimit = 0
