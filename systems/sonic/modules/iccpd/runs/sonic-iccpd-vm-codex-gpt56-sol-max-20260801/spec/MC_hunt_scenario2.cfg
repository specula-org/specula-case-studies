SPECIFICATION MCSpec

CONSTANTS
    Node = {n1, n2}
    MaxEpoch = 2
    MaxVersion = 2
    MaxLagGen = 2
    MaxHeartbeatAge = 1
    MaxProgress = 3

    NoEpoch = NoEpoch
    NoVersion = NoVersion
    NoGen = NoGen
    NoFrame = NoFrame

    \* Scenario 2: established resync, one data change, and fallible writes.
    MaxWarmLimit = 0
    MaxDisconnectLimit = 1
    MaxCrashLimit = 0
    MaxReconnectLimit = 0
    MaxPartialWriteLimit = 1
    MaxFailedWriteLimit = 1
    MaxResyncLimit = 2
    MaxObjectUpdateLimit = 1
    MaxLagTransitionLimit = 0
    MaxApplyFailLimit = 0
    MaxPeerTopologyLimit = 0
    MaxPartialHeaderLimit = 0
    MaxNonProgressLimit = 1
    MaxSyncdEOFLimit = 0
    MaxNetlinkLossLimit = 0
    MaxSnapshotEventLimit = 0
    MaxChannelLimit = 4

\* Symmetry is intentionally disabled: TLC cannot soundly reconstruct
\* liveness counterexamples modulo symmetry.
VIEW ModelView
CONSTRAINT ChannelConstraint
CHECK_DEADLOCK FALSE

INVARIANTS
    \* Core safety.
    MCTypeOK
    \* Scenario 2 safety targets.
    MCLegalFSMState
    MCSyncEnvelopeOrdering
    MCConfigBeforeState
    MCExchangeAgreement
    MCDirtyStateAccounted

PROPERTIES
    \* Scenario 2 / MC2.
    MCSyncEventuallyResolves
