SPECIFICATION MCSpec

CONSTANTS
    Node = {n1, n2}
    MaxEpoch = 2
    MaxVersion = 2
    MaxLagGen = 2
    MaxHeartbeatAge = 1
    MaxProgress = 2

    NoEpoch = NoEpoch
    NoVersion = NoVersion
    NoGen = NoGen
    NoFrame = NoFrame

    \* Scenario 1: warm disconnect plus one crash/restart/reconnect composition.
    MaxWarmLimit = 1
    MaxDisconnectLimit = 1
    MaxCrashLimit = 1
    MaxReconnectLimit = 1
    MaxPartialWriteLimit = 0
    MaxFailedWriteLimit = 0
    MaxResyncLimit = 0
    MaxObjectUpdateLimit = 0
    MaxLagTransitionLimit = 0
    MaxApplyFailLimit = 0
    MaxPeerTopologyLimit = 0
    MaxPartialHeaderLimit = 0
    MaxNonProgressLimit = 0
    MaxSyncdEOFLimit = 0
    MaxNetlinkLossLimit = 1
    MaxSnapshotEventLimit = 1
    MaxChannelLimit = 2

\* Symmetry is intentionally disabled: TLC cannot soundly reconstruct
\* liveness counterexamples modulo symmetry.
VIEW ModelView
CONSTRAINT ChannelConstraint
CHECK_DEADLOCK FALSE

INVARIANTS
    \* Core safety.
    MCTypeOK
    \* Scenario 1 / MC4.
    MCRecoveryBeforeAdvertise

PROPERTIES
    \* Scenario 1 / MC1.
    MCWarmRecoveryTerminates
