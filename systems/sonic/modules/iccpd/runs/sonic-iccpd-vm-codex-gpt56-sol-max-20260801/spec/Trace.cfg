SPECIFICATION TraceSpec

CONSTANTS
    Node = {"n1", "n2"}
    MaxEpoch = 8
    MaxVersion = 16
    MaxLagGen = 16
    MaxHeartbeatAge = 3
    MaxProgress = 64

    NoEpoch = NoEpoch
    NoVersion = NoVersion
    NoGen = NoGen
    NoFrame = NoFrame

    \* Empty selects Trace.tla's required ../traces/trace.ndjson default.
    \* Set to another relative/absolute path for a specific validation run.
    JSONPath = ""

VIEW TraceView
ALIAS TraceAlias

CHECK_DEADLOCK FALSE

INVARIANTS
    \* Core/structural properties that every real execution should satisfy.
    TypeOK
    TxPreparationConsistency
    IsolationGenerationConsistency

    \* Brief safety properties; a matching buggy implementation trace is
    \* expected to report the corresponding violation.
    SyncEnvelopeOrdering
    ConfigBeforeState
    RecoveryBeforeAdvertise
    CurrentIsolationBeforeTraffic
    NoPeerLinkLoop

\* Mandatory: validation fails if the entire trace cannot be consumed.
PROPERTIES
    TraceMatched
