SPECIFICATION MCSpec

CONSTANTS
    Node = {n1, n2}
    MaxEpoch = 1
    MaxVersion = 1
    MaxLagGen = 2
    MaxHeartbeatAge = 1
    MaxProgress = 2

    NoEpoch = NoEpoch
    NoVersion = NoVersion
    NoGen = NoGen
    NoFrame = NoFrame

    \* Scenario 4: one scheduler block, persistent nonprogress stream, and EOF.
    MaxWarmLimit = 0
    MaxDisconnectLimit = 0
    MaxCrashLimit = 0
    MaxReconnectLimit = 0
    MaxPartialWriteLimit = 1
    MaxFailedWriteLimit = 1
    MaxResyncLimit = 1
    MaxObjectUpdateLimit = 0
    MaxLagTransitionLimit = 0
    MaxApplyFailLimit = 0
    MaxPeerTopologyLimit = 0
    MaxPartialHeaderLimit = 1
    MaxNonProgressLimit = 1
    MaxSyncdEOFLimit = 1
    MaxNetlinkLossLimit = 0
    MaxSnapshotEventLimit = 0
    MaxChannelLimit = 2

\* Symmetry is intentionally disabled: TLC cannot soundly reconstruct
\* liveness counterexamples modulo symmetry.
VIEW ModelView
CONSTRAINT ChannelConstraint
CHECK_DEADLOCK FALSE

INVARIANTS
    \* Core safety only; the target is temporal progress.
    MCTypeOK

PROPERTIES
    \* Scenarios 2/4 and MC5.
    MCSyncEventuallyResolves
    MCStuckSessionDetected
