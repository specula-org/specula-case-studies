SPECIFICATION MCSpec

CONSTANTS
    Node = {n1, n2}
    MaxEpoch = 2
    MaxVersion = 2
    MaxLagGen = 4
    MaxHeartbeatAge = 2
    MaxProgress = 3

    NoEpoch = NoEpoch
    NoVersion = NoVersion
    NoGen = NoGen
    NoFrame = NoFrame

    MaxWarmLimit = 1
    MaxDisconnectLimit = 1
    MaxCrashLimit = 1
    MaxReconnectLimit = 1
    MaxPartialWriteLimit = 1
    MaxFailedWriteLimit = 1
    MaxResyncLimit = 1
    MaxObjectUpdateLimit = 1
    MaxLagTransitionLimit = 2
    MaxApplyFailLimit = 1
    MaxPeerTopologyLimit = 1
    MaxPartialHeaderLimit = 1
    MaxNonProgressLimit = 1
    MaxSyncdEOFLimit = 1
    MaxNetlinkLossLimit = 1
    MaxSnapshotEventLimit = 1
    MaxChannelLimit = 3

SYMMETRY Symmetry
VIEW ModelView
CONSTRAINT ChannelConstraint

CHECK_DEADLOCK FALSE

INVARIANTS
    \* Core type and structural invariants used during convergence.
    MCTypeOK
    MCTxPreparationConsistency
    MCIsolationGenerationConsistency
    PreparedFramesAreValid
    CrashedSchedulerDisabled
    SyncResponseHasEpoch
    FaultCountersWithinBounds

    \* Scenario extensions are deliberately disabled here and enabled in
    \* MC_hunt_scenario*.cfg.
    \* MCLegalFSMState
    \* MCSyncEnvelopeOrdering
    \* MCConfigBeforeState
    \* MCExchangeAgreement
    \* MCDirtyStateAccounted
    \* MCRecoveryBeforeAdvertise
    \* MCCurrentIsolationBeforeTraffic
    \* MCNoPeerLinkLoop

\* Scenario temporal properties are enabled only in targeted hunt configs.
\* PROPERTIES
\*     MCWarmRecoveryTerminates
\*     MCSyncEventuallyResolves
\*     MCStuckSessionDetected

