\* Standard convergence configuration. Scenario-specific invariants are
\* intentionally listed but commented; use MC_hunt_scenario*.cfg to hunt.
SPECIFICATION MCSpec

CONSTANTS
    Owners = {owner_1, owner_2}
    WarmRequest = warm_request
    FastRequest = fast_request
    Asics = {asic_0, asic_1}
    OrchProducer = orch_producer
    RingProducer = ring_producer
    FdbProducer = fdb_producer
    Components = {fpmsyncd_component, orchagent_component}
    FpmComponent = fpmsyncd_component
    Routes = {route_1, route_2}
    Vids = {vid_1, vid_2}
    Rids = {rid_1, rid_2}
    MaxQueue = 1
    MaxApplyOps = 2
    UseEpochCAS = FALSE
    ReplyAfterLocalDrain = FALSE
    UseDurableApplyJournal = FALSE
    KnownVid = vid_1
    KnownRid = rid_1
    UseKnownIdentityLabels = FALSE

    RequestLimit = 2
    CancellationLimit = 1
    EnqueueLimit = 2
    FreezeFailureLimit = 1
    StopFailureLimit = 1
    ModeDowngradeLimit = 1
    IdentityChoiceLimit = 2
    ApplyCrashLimit = 1
    UnsafeRecoveryLimit = 1
    EarlyInputLimit = 2
    InputCompleteLimit = 1
    RouteTimeoutLimit = 1
    LateInputLimit = 1
    ComponentFailureLimit = 1
    FinalizerTimeoutLimit = 1

    \* Operator overrides inject each bound and its atomic counter increment.
    FastReboot_Request <- MCFastRebootRequest
    ClearBoot <- MCClearBoot
    Producer_Enqueue <- MCProducerEnqueue
    PauseOrchagent_IgnoreFailure <- MCPauseOrchagentIgnoreFailure
    StopSystemdService_MaskedFailure <- MCStopSystemdServiceMaskedFailure
    Syncd_DowngradeWarmShutdown <- MCSyncdDowngradeWarmShutdown
    BestCandidateFinder_SelectRandomCandidate <- MCBestCandidateFinderSelectRandomCandidate
    Syncd_CrashDuringApply <- MCSyncdCrashDuringApply
    Syncd_AcceptDirtyWarmRecovery <- MCSyncdAcceptDirtyWarmRecovery
    WarmStartHelper_InsertRefreshMap <- MCWarmStartHelperInsertRefreshMap
    FpmSyncd_EoiuInputComplete <- MCFpmSyncdEoiuInputComplete
    FpmSyncd_WarmRestartTimerExpired <- MCFpmSyncdWarmRestartTimerExpired
    WarmStartHelper_LateInput <- MCWarmStartHelperLateInput
    Component_PublishFailure <- MCComponentPublishFailure
    FinalizeWarmboot_WaitTimeout <- MCFinalizeWarmbootWaitTimeout

SYMMETRY MCSymmetry
VIEW ModelView
CHECK_DEADLOCK FALSE

CONSTRAINT StateSpaceConstraint

\* Standard warm-reboot safety.
INVARIANTS
    InitBeforeApply
    SingleAuthoritativeView
    PhaseMonotonicity

\* Structural/model sanity.
INVARIANTS
    TypeOK
    StructuralWellFormed
    CounterTypeOK
    CounterBounds

\* Scenario extension invariants (enable only in the corresponding hunt cfg).
\* INVARIANTS
\*     AtMostOneActiveEpoch
\*     FreezeAckImpliesQuiescence
\*     CheckpointAfterQuiescence
\*     CompleteSameEpochSnapshot
\*     ApplyCommitAgreement
\*     NoWarmFromDirtyApply
\*     IdentityMapBijective
\*     ReconciledImpliesOutputsPublished
\*     WarmFlagSafeToClear

\* Standard liveness obligation; scenario hunt cfgs enable it selectively
\* because the un-fair combined convergence model permits deliberate stutter.
\* PROPERTIES EventualRecoveryDecision
