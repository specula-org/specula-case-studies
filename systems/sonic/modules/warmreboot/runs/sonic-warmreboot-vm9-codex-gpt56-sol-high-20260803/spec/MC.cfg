CONSTANTS
    Asics = {asic0, asic1}
    Components = {orchagent, xcvrd}
    MaxEpoch = 2
    MaxInFlight = 1
    AcceptLimit = 2
    LaunchFailureLimit = 1
    DbusLossLimit = 1
    BackendCrashLimit = 1
    PlatformDeadlineLimit = 1
    WarmBeginLimit = 1
    ConfigUpdateLimit = 1
    NamespaceFailureLimit = 1
    SchemaMismatchLimit = 1
    SnapshotFailureLimit = 1
    ResurrectLimit = 1
    PostCommitFailureLimit = 1
    FinalizerDeadlineLimit = 1
    ReadinessFaultLimit = 1

    AcceptRequest <- MCAcceptRequest
    LaunchFailure <- MCLaunchFailure
    LoseDbus <- MCLoseDbus
    CrashBackend <- MCCrashBackend
    ExpirePlatformTimer <- MCExpirePlatformTimer
    BeginWarmReboot <- MCBeginWarmReboot
    InjectConfigUpdate <- MCInjectConfigUpdate
    FailNamespaceCommand <- MCFailNamespaceCommand
    ChooseIncompatibleSchema <- MCChooseIncompatibleSchema
    LeavePartialSnapshot <- MCLeavePartialSnapshot
    ResurrectProducer <- MCResurrectProducer
    FailAfterCommit <- MCFailAfterCommit
    ExpireFinalizer <- MCExpireFinalizer
    MisreadReadiness <- MCMisreadReadiness

SPECIFICATION MCSpec
CHECK_DEADLOCK FALSE
SYMMETRY Symmetry
VIEW MCView

INVARIANTS
    \* Standard safety
    CoreManagerSafety

    \* Structural invariants
    MCTypeOK
    CounterShape

    \* Scenario extensions are intentionally disabled during convergence.
    \* SinglePendingReboot
    \* OwnershipRecovery
    \* EpochConsistency
    \* NoPrematureFinalization
    \* CausalFreeze
    \* ShutdownMonotonicity
    \* SnapshotSafety
    \* CrossNamespaceCoherence
    \* TimeoutIsNotReadiness
    \* FailureClassification

\* Temporal scenario properties are enabled only in targeted fair configs.
\* PROPERTIES RetryLiveness ShutdownTermination
