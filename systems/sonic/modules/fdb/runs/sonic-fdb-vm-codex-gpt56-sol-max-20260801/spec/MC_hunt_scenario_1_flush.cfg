SPECIFICATION MCSpec

CONSTANTS
    Keys = {k1}
    Ports = {p1, p2}
    Endpoints = {ep1, ep2}
    Groups = {g1}
    EventIds = {ev1, ev2, ev3}
    AckIds = {ack1, ack2, ack3}
    MaxGeneration = 4
    MaxFlushEpoch = 2

    MaxFdbEventLimit = 3
    MaxEventDuplicateLimit = 0
    MaxFlushRequestLimit = 2
    MaxFlushFailureLimit = 1
    MaxAckDuplicateLimit = 1
    MaxRepairFailureLimit = 0
    MaxMclagInputLimit = 0
    MaxIntentLimit = 0
    MaxDependencyLimit = 0
    MaxConsumeLimit = 0
    MaxTopologyLimit = 4
    MaxGraphCreateLimit = 0
    MaxFdbReferenceLimit = 0
    MaxGraphReplaceLimit = 0
    MaxGraphFailureLimit = 0
    MaxCrashLimit = 0
    MaxKernelChangeLimit = 0
    MaxLiveEventLimit = 0
    MaxEventBufferLimit = 2
    MaxAckBufferLimit = 3
    MaxTotalInputLimit = 8

SYMMETRY Symmetry
VIEW ModelView
CONSTRAINT StateSpaceConstraint

INVARIANTS
    MCTypeOK
    FaultCounterBounds
    PlaneRecordSafety
    StaleEventCannotDeleteNewer
    FlushAckMatchesRequest
    CounterAgreement
    NoDanglingTopologyReference

PROPERTIES
    CompletedFlushConverges
