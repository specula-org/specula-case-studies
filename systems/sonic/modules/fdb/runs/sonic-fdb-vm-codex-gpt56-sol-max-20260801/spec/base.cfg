SPECIFICATION Spec

CONSTANTS
    Keys = {"k1"}
    Ports = {"p1", "p2"}
    Endpoints = {"ep1", "ep2"}
    Groups = {"g1"}
    EventIds = {"ev1", "ev2", "ev3"}
    AckIds = {"ack1", "ack2", "ack3"}
    MaxGeneration = 4
    MaxFlushEpoch = 2

INVARIANTS
    \* Standard / structural convergence checks
    TypeOK
    PlaneRecordSafety
    PendingEpochIsIssued
    TransactionShape
    GraphShape
    RestartShape

    \* Scenario extensions are enabled only in focused MC_hunt_*.cfg files.
    \* UniqueEffectiveDestination
    \* DependencyBeforeReference
    \* StaleEventCannotDeleteNewer
    \* FlushAckMatchesRequest
    \* CounterAgreement
    \* LatestDesiredWins
    \* ActiveNhgHasMember
    \* TunnelRefExact
    \* NoDanglingTopologyReference
    \* FailedWorkRetainsRetryIntent

PROPERTIES
    \* RestartConverges
    \* CompletedFlushConverges
