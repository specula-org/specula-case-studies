SPECIFICATION TraceSpec

CONSTANTS
    Keys = {"k1"}
    Ports = {"p1", "p2"}
    Endpoints = {"ep1", "ep2"}
    Groups = {"g1"}
    EventIds = {"ev1", "ev2", "ev3"}
    AckIds = {"ack1", "ack2", "ack3"}
    MaxGeneration = 4
    MaxFlushEpoch = 2

VIEW TraceView

INVARIANTS
    \* Structural checks
    TraceTypeOK
    PlaneRecordSafety
    PendingEpochIsIssued
    TransactionShape
    GraphShape
    RestartShape

    \* Safety checks meaningful on real executions
    UniqueEffectiveDestination
    DependencyBeforeReference
    StaleEventCannotDeleteNewer
    FlushAckMatchesRequest
    CounterAgreement
    LatestDesiredWins
    ActiveNhgHasMember
    TunnelRefExact
    NoDanglingTopologyReference
    FailedWorkRetainsRetryIntent

PROPERTIES
    TraceMatched
