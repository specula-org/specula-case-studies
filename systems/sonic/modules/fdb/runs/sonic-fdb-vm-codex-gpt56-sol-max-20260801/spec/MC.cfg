SPECIFICATION MCSpec

CONSTANTS
    Keys = {k1}
    Ports = {p1, p2}
    Endpoints = {ep1, ep2}
    Groups = {g1}
    EventIds = {ev1, ev2, ev3}
    AckIds = {ack1, ack2, ack3}
    MaxGeneration = 4
    MaxFlushEpoch = 2

    \* Broad convergence bounds; focused configs raise only their mechanism.
    MaxFdbEventLimit = 2
    MaxEventDuplicateLimit = 0
    MaxFlushRequestLimit = 1
    MaxFlushFailureLimit = 1
    MaxAckDuplicateLimit = 0
    MaxRepairFailureLimit = 1
    MaxMclagInputLimit = 1
    MaxIntentLimit = 2
    MaxDependencyLimit = 1
    MaxConsumeLimit = 1
    MaxTopologyLimit = 2
    MaxGraphCreateLimit = 1
    MaxFdbReferenceLimit = 1
    MaxGraphReplaceLimit = 1
    MaxGraphFailureLimit = 1
    MaxCrashLimit = 1
    MaxKernelChangeLimit = 1
    MaxLiveEventLimit = 1
    MaxEventBufferLimit = 2
    MaxAckBufferLimit = 2
    MaxTotalInputLimit = 2

SYMMETRY Symmetry
VIEW ModelView
CONSTRAINT StateSpaceConstraint

INVARIANTS
    \* Standard safety / structural convergence checks
    MCTypeOK
    FaultCounterBounds
    PlaneRecordSafety
    PendingEpochIsIssued
    TransactionShape
    GraphShape
    RestartShape
    NotificationIdsUnique
    FlushRequestPrefix
    SavedQueueBound

    \* Scenario extensions are intentionally disabled in the broad run.
    \* UniqueEffectiveDestination
    \* DependencyBeforeReference
    \* StaleEventCannotDeleteNewer
    \* FlushAckMatchesRequest
    \* CounterAgreement
    \* LatestDesiredWins
    \* ActiveNhgHasMember
    \* TunnelRefExact
    \* NoDanglingTopologyReference
    \* FailedWorkRetainsRetryIntent

PROPERTIES
    GenerationNeverDecreases
    DesiredGenerationNeverDecreases
    FlushEpochNeverDecreases
    \* RestartConverges
    \* CompletedFlushConverges
