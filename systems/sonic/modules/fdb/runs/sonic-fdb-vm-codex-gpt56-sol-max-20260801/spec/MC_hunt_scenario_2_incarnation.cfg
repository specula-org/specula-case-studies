    Groups = {g1}
    EventIds = {ev1, ev2, ev3}
    AckIds = {ack1, ack2, ack3}
    MaxGeneration = 4
    MaxFlushEpoch = 1

    MaxFdbEventLimit = 3
    MaxEventDuplicateLimit = 1
    MaxFlushRequestLimit = 0
    MaxFlushFailureLimit = 0
    MaxAckDuplicateLimit = 0
    MaxRepairFailureLimit = 1
    MaxMclagInputLimit = 1
    MaxIntentLimit = 0
    MaxDependencyLimit = 0
    MaxConsumeLimit = 0
    MaxTopologyLimit = 0
    MaxGraphCreateLimit = 0
    MaxFdbReferenceLimit = 0
    MaxGraphReplaceLimit = 0
    MaxGraphFailureLimit = 0
    MaxCrashLimit = 0
    MaxKernelChangeLimit = 0
    MaxLiveEventLimit = 0
