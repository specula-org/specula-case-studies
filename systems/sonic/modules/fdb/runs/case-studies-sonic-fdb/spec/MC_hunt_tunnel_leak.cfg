\* Hunting config: Family 3 — VXLAN Tunnel Bridge Port Lifecycle Leak
\* Target: TunnelNoLeak
\* Mechanism: clearFdbEntry (flush path) does NOT call notifyTunnelOrch,
\*   so tunnelFdbCount never reaches 0 and tunnel persists forever

CONSTANTS
    Port = {p1}
    VLAN = {v1}
    MAC = {m1}
    RemoteVTEP = {vtep1}
    NullOID = NullOID
    ORIGIN_LEARN = ORIGIN_LEARN
    ORIGIN_PROVISIONED = ORIGIN_PROVISIONED
    ORIGIN_VXLAN_ADVERTIZED = ORIGIN_VXLAN_ADVERTIZED
    ORIGIN_MCLAG_ADVERTIZED = ORIGIN_MCLAG_ADVERTIZED
    TYPE_DYNAMIC = TYPE_DYNAMIC
    TYPE_STATIC = TYPE_STATIC
    \* Focus on tunnel lifecycle + flush
    MaxVlanMemberOps = 2
    MaxFlushOps = 1
    MaxLearnOps = 0
    MaxProvisionOps = 0
    MaxRemoveOps = 0
    MaxTunnelOps = 2
    MaxTunnelLearnOps = 2
    MaxSetPendingOps = 1

SPECIFICATION MCSpec

VIEW MCView

INVARIANTS
    TunnelNoLeak
    TunnelCounterConsistency
    TunnelFdbCountNonNeg
    TunnelRefCntNonNeg
