\* Hunting config: Family 2 — Phantom entries after VLAN flush
\* Target: NoPhantomAfterVlanFlush
\* Mechanism: flushFdbByVlan doesn't set is_flush_pending;
\*   HandleFlushNotificationVlan skips entries -> phantom entries in mEntries

CONSTANTS
    Port = {p1}
    VLAN = {v1}
    MAC = {m1, m2}
    RemoteVTEP = {vtep1}
    NullOID = NullOID
    ORIGIN_LEARN = ORIGIN_LEARN
    ORIGIN_PROVISIONED = ORIGIN_PROVISIONED
    ORIGIN_VXLAN_ADVERTIZED = ORIGIN_VXLAN_ADVERTIZED
    ORIGIN_MCLAG_ADVERTIZED = ORIGIN_MCLAG_ADVERTIZED
    TYPE_DYNAMIC = TYPE_DYNAMIC
    TYPE_STATIC = TYPE_STATIC
    \* Focus: learn + VLAN flush. No bridge port removal to avoid Family 1.
    MaxVlanMemberOps = 2
    MaxFlushOps = 2
    MaxLearnOps = 3
    MaxProvisionOps = 0
    MaxRemoveOps = 0
    MaxTunnelOps = 0
    MaxTunnelLearnOps = 0
    MaxSetPendingOps = 0

SPECIFICATION MCSpec

VIEW MCView

INVARIANTS
    NoPhantomAfterVlanFlush
    BridgePortConsistency
