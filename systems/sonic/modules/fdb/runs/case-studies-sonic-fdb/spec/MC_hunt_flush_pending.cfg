\* Hunting config: Family 2 — FDB Flush / is_flush_pending Race
\* Target: FdbAsicConsistency, FlushNotificationComplete
\* Mechanism: flushFdbByVlan doesn't set is_flush_pending;
\*   entries learned between flush request and notification miss the flag

CONSTANTS
    Port = {p1, p2}
    VLAN = {v1}
    MAC = {m1, m2}
    RemoteVTEP = {vtep1}
    NullOID = NullOID
    ORIGIN_LEARN = ORIGIN_LEARN
    ORIGIN_PROVISIONED = ORIGIN_PROVISIONED
    ORIGIN_VXLAN_ADVERTIZED = ORIGIN_VXLAN_ADVERTIZED
    ORIGIN_MCLAG_ADVERTIZED = ORIGIN_MCLAG_ADVERTIZED
    TYPE_DYNAMIC = TYPE_DYNAMIC
    TYPE_STATIC = TYPE_STATIC
    \* Focus on learn + vlan flush interleaving
    MaxVlanMemberOps = 3
    MaxFlushOps = 2
    MaxLearnOps = 3
    MaxProvisionOps = 0
    MaxRemoveOps = 0
    MaxTunnelOps = 0
    MaxTunnelLearnOps = 0
    MaxSetPendingOps = 0

SYMMETRY ModelSymmetry

SPECIFICATION MCSpec

VIEW MCView

INVARIANTS
    FdbAsicConsistency
    FlushNotificationComplete
    BridgePortConsistency
