SPECIFICATION MCSpec

CONSTANTS
    Server = {s1, s2, s3}
    Nil = "nil"
    ES_Init = "ES_Init"
    ES_Canvass = "ES_Canvass"
    ES_Nominate = "ES_Nominate"
    ES_CandidateBallot = "ES_CandidateBallot"
    ES_FollowerBallot = "ES_FollowerBallot"
    ES_Leader = "ES_Leader"
    ES_Follower = "ES_Follower"
    CanvassPositionMsg = "CanvassPositionMsg"
    RequestVoteMsg = "RequestVoteMsg"
    RequestVoteResponseMsg = "RequestVoteResponseMsg"
    NewLeadershipTermMsg = "NewLeadershipTermMsg"
    CommitPositionMsg = "CommitPositionMsg"
    AppendPositionUpdateMsg = "AppendPositionUpdateMsg"
    \* Counter limits
    MaxTimeoutLimit = 4
    MaxCrashLimit = 2
    MaxRequestLimit = 3
    MaxLoseLimit = 3
    MaxInactiveLimit = 2
    MaxSessionLimit = 2
    MaxPublishLimit = 6
    MaxTermLimit = 4

SYMMETRY MCSymmetry

CONSTRAINT StateConstraint

\* --- Standard safety invariants (always checked) ---
INVARIANTS
    MCElectionSafety
    MCLogMatching
    MCTruncationSafety
    MCCommitBound
    MCTermConsistency
    MCVoteRecovery
    MCNotifiedCommitBound

\* --- Extension invariants (enable selectively for hunting) ---
\* INVARIANT MCLeaderCompleteness
\* INVARIANT MCCommitBoundedByQuorum
\* INVARIANT MCNoUncommittedReplay
\* INVARIANT MCVoteUniqueness
\* INVARIANT MCSnapshotConsistency

\* --- Temporal properties ---
\* PROPERTY CommitPositionNeverDecreases
\* PROPERTY CandidateTermNeverDecreases
