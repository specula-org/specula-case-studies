\* MC_hunt_family4.cfg — hunt Family 4 (Generation Wraparound + Cooldown ABA)
\* Mechanism: tight MaxHelpGen=4 forces wrap on the first fallback path; combined
\*            with ClaimNode reuse + CheckCooldown drives node lifecycle through
\*            UNUSED → USED → COOLDOWN → UNUSED transitions; observe whether
\*            CooldownDrainSafety (and InflightHelpBounded) hold.
\* Targets: helping.rs:54-71 ABA-protection design block; commits 343d1f5 and d849a2d.
\*
\* Findings hit (brief §6.1):
\*   MC4 — cooldown lifecycle: writer's reserve_writer arrives just after
\*         start_cooldown's self-reservation Drop has decremented active_writers
\*         to 0, but before the COOLDOWN store is visible to a third thread's
\*         check_cooldown.  Can a third thread claim the node while this writer
\*         holds an inflightHelp context referring to the previous generation?
\*         Expected violation: CooldownDrainSafety.
\*
\* Note: Family 5 (NEW) interferes with this hunt — wrap (MaxHelpGen=4) triggers
\* discard which itself violates NoDanglingTransaction.  This cfg disables F5
\* by checking only F4-relevant invariants.  See MC_hunt_family5.cfg for the F5
\* hunt with the same MaxHelpGen but NoDanglingTransaction enabled.

SPECIFICATION MCSpec

\* After F5's discard fires, the discarding thread is stuck (panic surface).
\* Other threads can progress; if they too get stuck, TLC reports deadlock
\* — but for this F4 hunt we accept that as a benign end-of-test state.
CHECK_DEADLOCK FALSE

CONSTANTS
    Thread = {t1, t2}
    Addr = {a1, a2}
    InitAddr = a1
    NumFastSlots = 1
    MaxHelpGen = 4              \* gen += 4 wraps to 0 on first fallback
    MaxGuardsPerThread = 1
    NullPtr = "NULL"
    NoneGid = "NONE"
    NoneSite = "NONE_SITE"

    MaxOrderingGaps = 0
    MaxSendGuards   = 0
    MaxGuardClones  = 0
    MaxArcSwapDrops = 0
    MaxCASRawStale  = 0
    MaxSwaps        = 2
    MaxCASOps       = 0

SYMMETRY MCSymmetry
VIEW     MCView

INVARIANTS
    MCTypeOK
    MCNoUseAfterFree
    MCNoConcurrentNodeClaim
    MCRefCountNonNeg
    MCCooldownDrainSafety
    MCInflightHelpBounded
    MCLocalNodeOwnership
