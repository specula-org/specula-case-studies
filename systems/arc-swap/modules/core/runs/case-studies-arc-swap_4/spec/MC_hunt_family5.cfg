\* MC_hunt_family5.cfg — hunt Family 5 (NEW: action granularity audit on
\*                                       new_helping/confirm_helping split)
\*
\* Mechanism: tight MaxHelpGen=4 forces wrap on the first fallback path's
\*            ReaderFallbackControlSwap (helpGen.wrapping_add(4) % 5 = 0 ⇒ discard=true).
\*            ReaderFallbackDiscardNode then sets localNode[t] = NoneGid while
\*            pendingHelpingTx[t] is still non-zero — the panic surface in
\*            list.rs:312 confirm_helping's `node.get().expect()`.
\*
\* Targets: brief §2 Family 5 — modelling-brief.md MC5.
\*          helping.rs:191-217 (get_debt writes control before computing discard);
\*          list.rs:288-298 (new_helping takes node when discard is true);
\*          list.rs:312 (confirm_helping immediately re-reads self.node).
\*
\* Findings hit (brief §6.1):
\*   MC5 — Generation wrap during fallback: forced discard=true; immediate
\*         confirm_helping panics due to self.node = None.  This is a panic,
\*         not a safety violation per se — the model exposes the unreachable-
\*         state assertion via NoDanglingTransaction.
\*         Practically reachable on 32-bit machines after 2^30 fallback calls.
\*
\* Expected outcome: NoDanglingTransaction is *expected to fail* in this hunt.
\* The failure IS the bug.

SPECIFICATION MCSpec

\* After ReaderFallbackDiscardNode fires, the discarding thread is stuck at
\* "r_fb_after_candidate" with localNode = NoneGid (modelling the panic).
\* Other threads can still progress; CHECK_DEADLOCK FALSE accepts this as
\* legitimate (the panic IS the bug — the invariant violation fires before
\* deadlock and is the primary signal).
CHECK_DEADLOCK FALSE

CONSTANTS
    Thread = {t1, t2}
    Addr = {a1, a2}
    InitAddr = a1
    NumFastSlots = 1
    MaxHelpGen = 4              \* wrap on first fallback
    MaxGuardsPerThread = 1
    NullPtr = "NULL"
    NoneGid = "NONE"
    NoneSite = "NONE_SITE"

    \* Bounded counters — minimal everything except the path that triggers wrap.
    MaxOrderingGaps = 0
    MaxSendGuards   = 0
    MaxGuardClones  = 0
    MaxArcSwapDrops = 0
    MaxCASRawStale  = 0
    MaxSwaps        = 1
    MaxCASOps       = 0

SYMMETRY MCSymmetry
VIEW     MCView

INVARIANTS
    MCTypeOK
    MCNoDanglingTransaction      \* expected to fail — that IS the bug
    MCNoUseAfterFree
    MCRefCountNonNeg
    MCInflightHelpBounded
    MCLocalNodeOwnership
