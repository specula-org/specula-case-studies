\* MC_hunt_family3.cfg — hunt Family 3 (Stale Snapshot in Writer's Debt-List Traversal)
\* Mechanism: per-slot WriterScanSlot already split in base; combined with one
\*            ordering relaxation (typically ListHeadLoad or FallbackLoad),
\*            forces the writer to miss a freshly-published debt slot.
\* Targets: PayAllCompleteness, StaleSnapshotSafety — same shape as BUG-A in left-right.
\*
\* This is the headline hunting config for round 4 stale-snapshot coverage.
\* Per modeling-brief.md §2 F3: "directly mirrors the BUG-A finding from
\* left-right; the action-granularity audit (Family 5) is the lever that
\* exposes it" — Family 5's split keeps each ScanNode_i + AdvanceNext as an
\* observable interleaving point, and a new node can prepend between any two.
\*
\* Findings hit (brief §6.1):
\*   MC2 — new reader prepends a node and writes a debt on `old` between the
\*         writer's LIST_HEAD.load(SeqCst) and T::dec(old) at the end of
\*         wait_for_readers.  Expected violation: NoUseAfterFree, StaleSnapshotSafety.

SPECIFICATION MCSpec

\* Bounded counter cfg: once counters are exhausted, no more enabled actions —
\* legitimate end-of-test state.
CHECK_DEADLOCK FALSE

CONSTANTS
    Thread = {t1, t2}
    Addr = {a1, a2, a3}
    InitAddr = a1
    NumFastSlots = 1
    MaxHelpGen = 8
    MaxGuardsPerThread = 1
    NullPtr = "NULL"
    NoneGid = "NONE"
    NoneSite = "NONE_SITE"

    MaxOrderingGaps = 1         \* one ordering downgrade — typically ListHeadLoad
    MaxSendGuards   = 0
    MaxGuardClones  = 0
    MaxArcSwapDrops = 0
    MaxCASRawStale  = 0
    MaxSwaps        = 1
    MaxCASOps       = 0

SYMMETRY MCSymmetry
VIEW     MCView

INVARIANTS
    MCTypeOK
    MCPayAllCompleteness
    MCStaleSnapshotSafety
    MCNoUseAfterFree
    MCNoTornGuardState
    MCRefCountNonNeg
    MCInflightHelpBounded
    MCLocalNodeOwnership
