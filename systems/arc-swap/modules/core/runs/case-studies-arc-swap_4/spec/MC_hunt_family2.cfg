\* MC_hunt_family2.cfg — hunt Family 2 (Caller Misuse / Adversarial Client)
\* Mechanism: GuardClone (Arc::clone + Guard::from_inner fork), SendGuard,
\*            CASBegin with RAWSTALE/RAWFRESH kinds, DropArcSwap.
\* Targets: brief §2 F2 — fork via from_inner, raw-pointer CAS ABA,
\*          DropArcSwap during reader help, send guard to other thread.
\* Findings hit (brief §6.1):
\*   MC1 — adversarial caller forks Guard via from_inner, holds across multiple
\*         swaps, drops in reverse order; debt accounting sanity
\*   MC6 — concurrent compare_and_swap from N threads; pay_all walks each
\*         others' nodes; verify no double-pay or missed-pay
\*
\* This is a priority hunting config for round 4 — the explicit gap from prior
\* round (round 3 modeled basic SendGuard; this round adds GuardClone for
\* explicit Arc::clone + from_inner fork, the canonical caller-misuse pattern).

SPECIFICATION MCSpec

\* MCDropArcSwap is a terminal action: once arcSwapDropped=TRUE, all
\* loading/swapping/CAS actions are gated off, so once the bounded counters
\* are exhausted the system has no enabled action.  Legitimate end-of-test, not deadlock.
CHECK_DEADLOCK FALSE

CONSTANTS
    Thread = {t1, t2}
    Addr = {a1, a2, a3}
    InitAddr = a1
    NumFastSlots = 1
    MaxHelpGen = 8
    MaxGuardsPerThread = 2     \* allow GuardClone to coexist with parent guard
    NullPtr = "NULL"
    NoneGid = "NONE"
    NoneSite = "NONE_SITE"

    \* Caller-misuse counters: all enabled, tight bounds
    MaxOrderingGaps = 0
    MaxSendGuards   = 1
    MaxGuardClones  = 1
    MaxArcSwapDrops = 1
    MaxCASRawStale  = 1
    MaxSwaps        = 1
    MaxCASOps       = 1

SYMMETRY MCSymmetry
VIEW     MCView

INVARIANTS
    MCTypeOK
    MCNoUseAfterFree
    MCRefCountNonNeg
    MCRefCountAccounting
    MCCASIntendedSemantics
    MCNoTornGuardState
    MCNoOrphanedDebt
    MCInflightHelpBounded
    MCLocalNodeOwnership
