\* MC_hunt_familyB.cfg — hunt Family B (allocator-reuse ABA on stored pointer)
\* Mechanism: WriterSwap chooses a previously-freed address as the new allocation.
\* Base spec already does this by default (it picks any non-alive Addr).
\* Targets: pre-63fa111 fast-path provenance regression.
\* Finding hit: MC6 (allocator reuses freed pointer mid-fast-path).

SPECIFICATION MCSpec

CONSTANTS
    Thread = {t1, t2}
    Addr = {a1, a2}            \* small set forces reuse
    InitAddr = a1
    NumFastSlots = 1
    MaxHelpGen = 4
    MaxGuardsPerThread = 1
    NullPtr = "NULL"
    NoneGid = "NONE"
    NoneSite = "NONE_SITE"

    MaxOrderingGaps = 0
    MaxSendGuards   = 0
    MaxArcSwapDrops = 0
    MaxCASRawStale  = 0
    MaxSwaps        = 2         \* multiple swaps to force reuse
    MaxCASOps       = 0

SYMMETRY MCSymmetry
VIEW     MCView

INVARIANTS
    MCTypeOK
    MCNoUseAfterFree
    MCNoTornGuardState
    MCRefCountNonNeg
