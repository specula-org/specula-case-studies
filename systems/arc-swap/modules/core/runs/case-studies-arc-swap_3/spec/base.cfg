\* base.cfg — minimal config for syntactic checking of base.tla.
\* Real model checking lives in MC.cfg / MC_hunt_*.cfg.
SPECIFICATION Spec

CONSTANTS
    Thread = {t1, t2}
    Addr = {a1, a2}
    InitAddr = a1
    NumFastSlots = 1
    MaxHelpGen = 4
    MaxGuardsPerThread = 1
    NullPtr = "NULL"
    NoneGid = "NONE"
    NoneSite = "NONE_SITE"

\* Disable Family A relaxation for base spec — convergence with SC-only protocol.
CONSTRAINT
    NoRelaxation

INVARIANTS
    TypeOK
    RefCountNonNeg
    DeadRefCountZero
    ReaderWriterExclusive
    AllOccupantsAllocated
    StorageLive
    NoConcurrentNodeClaim
