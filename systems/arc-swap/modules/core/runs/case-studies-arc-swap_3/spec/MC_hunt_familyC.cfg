\* MC_hunt_familyC.cfg — hunt Family C (adversarial caller / Guard lifecycle)
\* Mechanism: SendGuard, GuardIntoInner, CASBegin with RAWSTALE/RAWFRESH kinds,
\*            DropArcSwap.
\* Targets: brief §2 C1 (fork via into_inner), C3 (CAS raw-pointer ABA),
\*          C4 (drop ArcSwap during reader help), C9 (Send guard to other thread).
\* Findings hit: MC7 (two threads share same Guard via Send),
\*               MC8 (CAS with raw stale pointer matches recycled address),
\*               MC12 (DropArcSwap reachable only when no concurrent reader).
\*
\* This is the priority hunting config for round 3 — explicit gap from prior round.

SPECIFICATION MCSpec

\* MCDropArcSwap is a terminal action: once arcSwapDropped=TRUE, all
\* loading/swapping/CAS actions are gated off, so once the bounded counters
\* (MaxCASOps, MaxSwaps, MaxSendGuards, MaxArcSwapDrops) are exhausted the
\* system has no enabled action.  This is a legitimate end-of-test state,
\* not a system deadlock.
CHECK_DEADLOCK FALSE

CONSTANTS
    Thread = {t1, t2}
    Addr = {a1, a2, a3}
    InitAddr = a1
    NumFastSlots = 1
    MaxHelpGen = 4
    MaxGuardsPerThread = 2     \* allow Guard.into_inner to coexist with another guard
    NullPtr = "NULL"
    NoneGid = "NONE"
    NoneSite = "NONE_SITE"

    \* Caller-misuse counters: all enabled, tight bounds
    MaxOrderingGaps = 0
    MaxSendGuards   = 1
    MaxArcSwapDrops = 1
    MaxCASRawStale  = 1
    MaxSwaps        = 1
    MaxCASOps       = 1

SYMMETRY MCSymmetry
VIEW     MCView

INVARIANTS
    MCTypeOK
    MCNoUseAfterFree
    MCCASIntendedSemantics
    MCRefCountNonNeg
    MCNoTornGuardState
    \* MCNoDoublePay — disabled: structural form is too strong.  After the writer
    \* pays a slot, the slot can be legitimately reclaimed for a new debt by the
    \* same reader (fast.rs:43-65 picks any NULL slot).  In that state the slot
    \* no longer equals the OLD guard's addr, even though no double T::inc
    \* occurred — DropGuard's pay-fails branch correctly does T::dec for the old
    \* guard's "writer paid" leg, and the new debt is paid by its own slot.
    \* Refcount integrity is enforced by RefCountNonNeg + NoUseAfterFree.
