\* MC_hunt_familyA.cfg — hunt Family A (cross-variable SeqCst bridge)
\* Mechanism: PickRelaxSite picks one labelled atomic site to downgrade.
\* Targets: #76, #156, #198, #200, #204 — recreates pre-fix bugs by making
\*          the SC label at one site no longer participate in the SC total order.

SPECIFICATION MCSpec

CONSTANTS
    Thread = {t1, t2}
    Addr = {a1, a2, a3}
    InitAddr = a1
    NumFastSlots = 1
    MaxHelpGen = 4
    MaxGuardsPerThread = 1
    NullPtr = "NULL"
    NoneGid = "NONE"
    NoneSite = "NONE_SITE"

    \* Tight bounds.  ONE relaxation per execution; everything else minimal.
    MaxOrderingGaps = 1
    MaxSendGuards   = 0
    MaxArcSwapDrops = 0
    MaxCASRawStale  = 0
    MaxSwaps        = 1
    MaxCASOps       = 0

SYMMETRY MCSymmetry
VIEW     MCView

INVARIANTS
    MCTypeOK
    MCNoUseAfterFree
    MCPayAllCompleteness
    MCRefCountNonNeg
