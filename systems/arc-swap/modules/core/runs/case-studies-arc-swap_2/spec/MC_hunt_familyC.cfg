\* MC_hunt_familyC.cfg — hunt Family C (adversarial caller / Guard lifecycle)
\* Mechanism: SendGuard, GuardIntoInner, CASBegin with RAWSTALE/RAWFRESH kinds,
\*            DropArcSwap.
\* Targets: brief §2 C1 (fork via into_inner), C3 (CAS raw-pointer ABA),
\*          C4 (drop ArcSwap during reader help), C9 (Send guard to other thread).

SPECIFICATION MCSpec

CONSTANTS
    Thread = {t1, t2}
    Addr = {a1, a2, a3}
    InitAddr = a1
    NumFastSlots = 1
    MaxHelpGen = 4
    MaxGuardsPerThread = 2     \* allow Guard.into_inner to exist alongside another guard
    NullPtr = "NULL"
    NoneGid = "NONE"
    NoneSite = "NONE_SITE"

    \* Caller-misuse counters: all enabled, tight bounds
    MaxOrderingGaps = 0
    MaxSendGuards   = 1
    MaxArcSwapDrops = 1
    MaxCASRawStale  = 1
    MaxSwaps        = 1
    MaxCASOps       = 1

SYMMETRY MCSymmetry
VIEW     MCView

INVARIANTS
    MCTypeOK
    MCNoUseAfterFree
    MCCASIntendedSemantics
    MCRefCountNonNeg
    MCNoTornGuardState
