\* MC_hunt_familyE.cfg — hunt Family E (writer-scan completeness)
\* Mechanism: per-slot WriterScanSlot already split in base; combined with one
\*            ordering relaxation forces the writer to miss a freshly-published
\*            debt slot.
\* Targets: PayAllCompleteness — derived from Family A (#76 family).

SPECIFICATION MCSpec

CONSTANTS
    Thread = {t1, t2}
    Addr = {a1, a2, a3}
    InitAddr = a1
    NumFastSlots = 1
    MaxHelpGen = 4
    MaxGuardsPerThread = 1
    NullPtr = "NULL"
    NoneGid = "NONE"
    NoneSite = "NONE_SITE"

    MaxOrderingGaps = 1         \* one ordering downgrade
    MaxSendGuards   = 0
    MaxArcSwapDrops = 0
    MaxCASRawStale  = 0
    MaxSwaps        = 1
    MaxCASOps       = 0

SYMMETRY MCSymmetry
VIEW     MCView

INVARIANTS
    MCTypeOK
    MCPayAllCompleteness
    MCNoUseAfterFree
    MCRefCountNonNeg
