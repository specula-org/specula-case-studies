\* ===================================================================================
\* v2 CAS Hunt: 3 threads, CAS + concurrent writer + ordering gaps
\* ===================================================================================
\* T1 does CAS (reader+writer), T2 does swap (writer), T3 reads.
\* Tests interaction between CAS thread's self-scanning and another
\* writer's scanning of CAS thread's slot.

SPECIFICATION MCSpec

CONSTANTS
    Thread = {T1, T2, T3}
    Ptr = {P1, P2, P3, P4}
    NumFastSlots = 1
    InitPtr = P1
    NullPtr = NullPtr
    GEN_MAX = 8

    MaxSwaps = 2
    MaxOrderingGaps = 1
    MaxStaleReads = 0
    MaxFallbacks = 0
    MaxHelps = 0

CONSTRAINT MCStateConstraint

SYMMETRY ModelSymmetry

INVARIANTS
    ReaderHoldsAlivePtr
    RefCountNonNeg
    StoragePtrAlive
    DeadRefCountZero
