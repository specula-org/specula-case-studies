\* Trace config for two_thread_swap_load test
\* Two threads: writer on T1, reader on T2.
\* Constants are strings (not model values) for identity mapping with trace.

SPECIFICATION TraceSpec

CONSTANTS
    Thread = {"T1", "T2"}
    Ptr = {"P1", "P2"}
    NumFastSlots = 8
    InitPtr = "P1"
    NullPtr = "NullPtr"
    GEN_MAX = 8

INVARIANTS
    TypeOK
    NoUseAfterFree
    ReaderHoldsAlivePtr
    RefCountNonNeg
    StoragePtrAlive
