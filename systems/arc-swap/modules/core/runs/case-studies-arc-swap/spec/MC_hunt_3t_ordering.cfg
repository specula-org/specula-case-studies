\* ===================================================================================
\* 3-Thread Hunting: Ordering gaps with writer-writer concurrency
\* ===================================================================================
\* 3 threads, 2 fast slots, ordering gaps enabled.
\* Tests if 2 concurrent writers can cause NoUseAfterFree or ReaderHoldsAlivePtr.

SPECIFICATION MCSpec

CONSTANTS
    Thread = {T1, T2, T3}
    Ptr = {P1, P2, P3, P4}
    NumFastSlots = 2
    InitPtr = P1
    NullPtr = NullPtr
    GEN_MAX = 8

    \* Enable ordering gaps
    MaxSwaps = 2
    MaxOrderingGaps = 1
    MaxStaleReads = 1
    MaxFallbacks = 1

CONSTRAINT MCStateConstraint

SYMMETRY ModelSymmetry

INVARIANTS
    ReaderHoldsAlivePtr
    RefCountNonNeg
    NoABAViolation
    StoragePtrAlive
    DeadRefCountZero
