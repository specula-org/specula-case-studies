\* ===================================================================================
\* v2 Mandatory Help Faithful: Writer MUST help all targets during scanning
\* ===================================================================================
\* Models the real pay_all behavior where help() is called for every node.
\* No ordering gaps (CAS reads latest), stale reads enabled.
\* Tests whether mandatory helping prevents WriterPaysAllDebts violations.

SPECIFICATION MCSpec

CONSTANTS
    Thread = {T1, T2}
    Ptr = {P1, P2, P3}
    NumFastSlots = 1
    InitPtr = P1
    NullPtr = NullPtr
    GEN_MAX = 8

    MaxSwaps = 3
    MaxOrderingGaps = 0
    MaxStaleReads = 2
    MaxFallbacks = 3
    MaxHelps = 3

CONSTRAINT MCStateConstraint

SYMMETRY ModelSymmetry

INVARIANTS
    MCTypeOK
    NoUseAfterFree
    ReaderHoldsAlivePtr
    RefCountNonNeg
    WriterPaysAllDebts
    HelpReplacementAlive
    FallbackCandidateValid
    StoragePtrAlive
    DeadRefCountZero
    ValidReaderSlot
    ValidWriterOldPtr
    ReaderWriterExclusive
