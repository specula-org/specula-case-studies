\* ===================================================================================
\* v2 Hunting: 3 threads, non-atomic helping, ordering gaps
\* ===================================================================================
\* Key scenario: 2 writers + 1 reader. Writer A helps reader, Writer B scans.
\* The reader's unused candidate in the slot can be paid by Writer B while
\* Writer A's replacement is being delivered.

SPECIFICATION MCSpec

CONSTANTS
    Thread = {T1, T2, T3}
    Ptr = {P1, P2, P3, P4}
    NumFastSlots = 1
    InitPtr = P1
    NullPtr = NullPtr
    GEN_MAX = 8

    MaxSwaps = 2
    MaxOrderingGaps = 1
    MaxStaleReads = 1
    MaxFallbacks = 1
    MaxHelps = 1

CONSTRAINT MCStateConstraint

SYMMETRY ModelSymmetry

INVARIANTS
    ReaderHoldsAlivePtr
    RefCountNonNeg
    NoABAViolation
    HelpReplacementAlive
    StoragePtrAlive
    DeadRefCountZero
