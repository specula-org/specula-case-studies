\* ===================================================================================
\* v2 Faithful Hunt: No scan gap (CAS always reads latest), only stale reads
\* ===================================================================================
\* The WriterScanSlot ordering gap models a writer missing a debt slot value.
\* But in C++, CAS (RMW) on an atomic always reads the latest value in
\* modification order of that variable. So the writer ALWAYS sees the debt.
\*
\* The REAL gap is only in ReaderFallbackLoad: storage.load(Acquire) doesn't
\* participate in the SeqCst total order, so reader may see stale ptr.
\*
\* This config tests: with no scan gaps but stale reads, are invariants safe?

SPECIFICATION MCSpec

CONSTANTS
    Thread = {T1, T2}
    Ptr = {P1, P2, P3}
    NumFastSlots = 1
    InitPtr = P1
    NullPtr = NullPtr
    GEN_MAX = 8

    MaxSwaps = 3
    MaxOrderingGaps = 0    \* KEY: no scan gaps (CAS reads latest)
    MaxStaleReads = 2      \* KEY: stale reads enabled
    MaxFallbacks = 3
    MaxHelps = 2

CONSTRAINT MCStateConstraint

SYMMETRY ModelSymmetry

INVARIANTS
    MCTypeOK
    NoUseAfterFree
    ReaderHoldsAlivePtr
    RefCountNonNeg
    WriterPaysAllDebts
    HelpReplacementAlive
    FallbackCandidateValid
    StoragePtrAlive
    DeadRefCountZero
    ValidReaderSlot
    ValidWriterOldPtr
    ReaderWriterExclusive
