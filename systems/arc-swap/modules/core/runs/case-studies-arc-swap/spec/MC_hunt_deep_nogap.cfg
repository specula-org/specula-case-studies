\* ===================================================================================
\* Hunting Config: Deep No-Gap — Large bounds, all families, no ordering gaps
\* ===================================================================================
\* Deep exploration with ordering gaps disabled (CAS reads latest value).

SPECIFICATION MCSpec

CONSTANTS
    Thread = {T1, T2}
    Ptr = {P1, P2, P3}
    NumFastSlots = 1
    InitPtr = P1
    NullPtr = NullPtr
    GEN_MAX = 4

    MaxSwaps = 3
    MaxOrderingGaps = 0
    MaxStaleReads = 1
    MaxFallbacks = 2

CONSTRAINT MCStateConstraint

SYMMETRY ModelSymmetry

INVARIANTS
    MCTypeOK
    ReaderHoldsAlivePtr
    RefCountNonNeg
    StoragePtrAlive
    DeadRefCountZero
    ValidReaderSlot
    ValidWriterOldPtr
    ReaderWriterExclusive
    NoUseAfterFree
    WriterPaysAllDebts
    NoABAViolation
    CooldownBlocksReaders
