\* ===================================================================================
\* Hunting Config: Fallback Stale Read → Reader Holds Freed Pointer
\* ===================================================================================
\* Target: ReaderHoldsAlivePtr via fallback path stale read (Bug #198)

SPECIFICATION MCSpec

CONSTANTS
    Thread = {T1, T2}
    Ptr = {P1, P2, P3}
    NumFastSlots = 1
    InitPtr = P1
    NullPtr = NullPtr
    GEN_MAX = 8

    \* Enable stale reads on fallback
    MaxSwaps = 2
    MaxOrderingGaps = 0          \* No scan gaps — focus on stale read
    MaxStaleReads = 1            \* KEY: allow stale read
    MaxFallbacks = 1

CONSTRAINT MCStateConstraint

SYMMETRY ModelSymmetry

INVARIANTS
    ReaderHoldsAlivePtr
    RefCountNonNeg
