\* ===================================================================================
\* v2 Mandatory Help, NO stale reads - Core Safety ONLY
\* ===================================================================================
\* Checks ONLY the core safety properties without WriterPaysAllDebts.
\* This reveals if the timing window leads to actual use-after-free.

SPECIFICATION MCSpec

CONSTANTS
    Thread = {T1, T2}
    Ptr = {P1, P2, P3}
    NumFastSlots = 1
    InitPtr = P1
    NullPtr = NullPtr
    GEN_MAX = 8

    MaxSwaps = 3
    MaxOrderingGaps = 0
    MaxStaleReads = 0
    MaxFallbacks = 3
    MaxHelps = 3

CONSTRAINT MCStateConstraint

SYMMETRY ModelSymmetry

INVARIANTS
    ReaderHoldsAlivePtr
    RefCountNonNeg
    StoragePtrAlive
    HelpReplacementAlive
