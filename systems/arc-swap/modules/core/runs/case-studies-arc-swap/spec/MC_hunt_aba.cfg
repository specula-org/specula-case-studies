\* ===================================================================================
\* Hunting Config: Family 2 — ABA / Pointer Reuse Races
\* ===================================================================================
\* Target: NoABAViolation
\* Mechanism: Freed address reused causes false comparison in confirm step.
\*
\* Tight bounds: multiple swaps to trigger alloc-free-realloc cycle.

SPECIFICATION MCSpec

CONSTANTS
    Thread = {T1, T2}
    Ptr = {P1, P2, P3}
    NumFastSlots = 1
    InitPtr = P1
    NullPtr = NullPtr
    GEN_MAX = 8

    \* Tight bounds for Family 2
    MaxSwaps = 3                 \* KEY: need multiple swaps for reuse
    MaxOrderingGaps = 0          \* No ordering gaps needed
    MaxStaleReads = 0            \* No stale reads needed
    MaxFallbacks = 0             \* Fast path only

CONSTRAINT MCStateConstraint

SYMMETRY ModelSymmetry

INVARIANTS
    NoUseAfterFree
    RefCountNonNeg
    NoABAViolation
