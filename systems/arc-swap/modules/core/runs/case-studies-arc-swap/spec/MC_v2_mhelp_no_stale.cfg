\* ===================================================================================
\* v2 Mandatory Help, NO stale reads, NO ordering gaps
\* ===================================================================================
\* This is the most faithful model of the C++ implementation:
\* - SeqCst CAS always reads latest (no ordering gaps)
\* - storage.load always returns current value (no stale reads)
\* - Writer must help before scanning each target's slots
\* If any invariant fails here, it's a NEW bug beyond #198/#200.

SPECIFICATION MCSpec

CONSTANTS
    Thread = {T1, T2}
    Ptr = {P1, P2, P3}
    NumFastSlots = 1
    InitPtr = P1
    NullPtr = NullPtr
    GEN_MAX = 8

    MaxSwaps = 3
    MaxOrderingGaps = 0
    MaxStaleReads = 0     \* KEY: no stale reads
    MaxFallbacks = 3
    MaxHelps = 3

CONSTRAINT MCStateConstraint

SYMMETRY ModelSymmetry

INVARIANTS
    MCTypeOK
    NoUseAfterFree
    ReaderHoldsAlivePtr
    RefCountNonNeg
    WriterPaysAllDebts
    HelpReplacementAlive
    FallbackCandidateValid
    StoragePtrAlive
    DeadRefCountZero
    ValidReaderSlot
    ValidWriterOldPtr
    ReaderWriterExclusive
