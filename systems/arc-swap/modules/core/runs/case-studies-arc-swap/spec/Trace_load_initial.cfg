\* Trace config for load_initial test
\* Single thread, no swaps, just 2 loads of the initial value.
\* Constants are strings (not model values) for identity mapping with trace.

SPECIFICATION TraceSpec

CONSTANTS
    Thread = {"T1"}
    Ptr = {"P1", "P2"}
    NumFastSlots = 8
    InitPtr = "P1"
    NullPtr = "NullPtr"
    GEN_MAX = 8

INVARIANTS
    TypeOK
    NoUseAfterFree
    ReaderHoldsAlivePtr
    RefCountNonNeg
    StoragePtrAlive
