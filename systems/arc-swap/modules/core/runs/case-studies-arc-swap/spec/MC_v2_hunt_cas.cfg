\* ===================================================================================
\* v2 CAS Hunt: compare_and_swap with ordering gaps
\* ===================================================================================
\* Models thread doing CAS: holds guard (reader) + scans slots (writer)
\* simultaneously. The thread pays its OWN slot during scanning.
\* With ordering gaps, the self-payment could be missed.

SPECIFICATION MCSpec

CONSTANTS
    Thread = {T1, T2}
    Ptr = {P1, P2, P3}
    NumFastSlots = 1
    InitPtr = P1
    NullPtr = NullPtr
    GEN_MAX = 8

    MaxSwaps = 2
    MaxOrderingGaps = 1
    MaxStaleReads = 0
    MaxFallbacks = 0
    MaxHelps = 0

CONSTRAINT MCStateConstraint

SYMMETRY ModelSymmetry

INVARIANTS
    ReaderHoldsAlivePtr
    RefCountNonNeg
    StoragePtrAlive
    DeadRefCountZero
    ValidReaderSlot
    ValidWriterOldPtr
