\* ===================================================================================
\* 3-Thread Convergence: Test writer-writer concurrency + 2 fast slots
\* ===================================================================================
\* No fault injection. 3 threads enables 2 concurrent writers + 1 reader.

SPECIFICATION MCSpec

CONSTANTS
    Thread = {T1, T2, T3}
    Ptr = {P1, P2, P3, P4}
    NumFastSlots = 2
    InitPtr = P1
    NullPtr = NullPtr
    GEN_MAX = 8

    \* Convergence: no faults
    MaxSwaps = 2
    MaxOrderingGaps = 0
    MaxStaleReads = 0
    MaxFallbacks = 1

CONSTRAINT MCStateConstraint

SYMMETRY ModelSymmetry

INVARIANTS
    MCTypeOK
    NoUseAfterFree
    ReaderHoldsAlivePtr
    RefCountNonNeg
    StoragePtrAlive
    DeadRefCountZero
    ValidReaderSlot
    ValidWriterOldPtr
    ReaderWriterExclusive
    WriterPaysAllDebts
    NoABAViolation
    CooldownBlocksReaders
