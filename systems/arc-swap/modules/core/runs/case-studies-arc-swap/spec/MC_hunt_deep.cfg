\* ===================================================================================
\* Hunting Config: Deep — Large bounds, all families, no NoUseAfterFree
\* ===================================================================================
\* Deep exploration excluding NoUseAfterFree (known to fail for unconfirmed debts).

SPECIFICATION MCSpec

CONSTANTS
    Thread = {T1, T2}
    Ptr = {P1, P2, P3}
    NumFastSlots = 1
    InitPtr = P1
    NullPtr = NullPtr
    GEN_MAX = 4

    \* Larger bounds for deep hunting
    MaxSwaps = 3
    MaxOrderingGaps = 2
    MaxStaleReads = 1
    MaxFallbacks = 2

CONSTRAINT MCStateConstraint

SYMMETRY ModelSymmetry

INVARIANTS
    MCTypeOK
    ReaderHoldsAlivePtr
    RefCountNonNeg
    StoragePtrAlive
    DeadRefCountZero
    ValidReaderSlot
    ValidWriterOldPtr
    ReaderWriterExclusive
    \* Extension invariants
    \* WriterPaysAllDebts  \* Only valid with MaxOrderingGaps=0
    NoABAViolation
    CooldownBlocksReaders
