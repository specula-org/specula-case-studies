\* ===================================================================================
\* 3-Thread Hunting: ABA with pointer reuse + writer-writer concurrency
\* ===================================================================================
\* 3 threads, 2 fast slots. With 3 threads, one writer can free a pointer
\* while another writer reallocates the same address, testing ABA detection.

SPECIFICATION MCSpec

CONSTANTS
    Thread = {T1, T2, T3}
    Ptr = {P1, P2, P3}
    NumFastSlots = 2
    InitPtr = P1
    NullPtr = NullPtr
    GEN_MAX = 8

    \* Focus on ABA: allow enough swaps for pointer reuse
    MaxSwaps = 3
    MaxOrderingGaps = 0
    MaxStaleReads = 0
    MaxFallbacks = 1

CONSTRAINT MCStateConstraint

SYMMETRY ModelSymmetry

INVARIANTS
    MCTypeOK
    NoUseAfterFree
    ReaderHoldsAlivePtr
    RefCountNonNeg
    NoABAViolation
    StoragePtrAlive
    DeadRefCountZero
