\* ===================================================================================
\* v2 Faithful UAF Hunt: Same as faithful but without WriterPaysAllDebts
\* ===================================================================================
\* Tests if the missed-help scenario leads to actual NoUseAfterFree.
\* WriterPaysAllDebts is removed so TLC explores past that violation.

SPECIFICATION MCSpec

CONSTANTS
    Thread = {T1, T2}
    Ptr = {P1, P2, P3}
    NumFastSlots = 1
    InitPtr = P1
    NullPtr = NullPtr
    GEN_MAX = 8

    MaxSwaps = 3
    MaxOrderingGaps = 0    \* No scan gaps (faithful to C++ RMW)
    MaxStaleReads = 2      \* Stale reads enabled (Acquire load gap)
    MaxFallbacks = 3
    MaxHelps = 2

CONSTRAINT MCStateConstraint

SYMMETRY ModelSymmetry

INVARIANTS
    NoUseAfterFree
    ReaderHoldsAlivePtr
    RefCountNonNeg
    StoragePtrAlive
    DeadRefCountZero
