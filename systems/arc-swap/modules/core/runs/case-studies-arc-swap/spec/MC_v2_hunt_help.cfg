\* ===================================================================================
\* v2 Hunting: Non-atomic helping + ordering gaps
\* ===================================================================================
\* Key scenario: writer helps reader during fallback while another writer scans.
\* The non-atomic helping protocol creates intermediate states where:
\* 1. Reader's candidate is in the slot but reader hasn't confirmed yet
\* 2. Writer can pay the candidate debt before reader pays it back
\* 3. With ordering gaps, refcounting could become imbalanced

SPECIFICATION MCSpec

CONSTANTS
    Thread = {T1, T2}
    Ptr = {P1, P2, P3}
    NumFastSlots = 1
    InitPtr = P1
    NullPtr = NullPtr
    GEN_MAX = 8

    MaxSwaps = 2
    MaxOrderingGaps = 1
    MaxStaleReads = 1
    MaxFallbacks = 2
    MaxHelps = 2

CONSTRAINT MCStateConstraint

SYMMETRY ModelSymmetry

INVARIANTS
    ReaderHoldsAlivePtr
    RefCountNonNeg
    NoABAViolation
    HelpReplacementAlive
    StoragePtrAlive
    DeadRefCountZero
