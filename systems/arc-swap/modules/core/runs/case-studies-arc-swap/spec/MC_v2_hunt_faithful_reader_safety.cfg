\* ===================================================================================
\* v2 NO mandatory help - Reader Safety Only
\* ===================================================================================
\* Tests ReaderHoldsAlivePtr WITHOUT mandatory helping.
\* If this fails, the OPTIONAL helping allows the reader to hold a dead pointer.

SPECIFICATION MCSpec

CONSTANTS
    Thread = {T1, T2}
    Ptr = {P1, P2, P3}
    NumFastSlots = 1
    InitPtr = P1
    NullPtr = NullPtr
    GEN_MAX = 8

    MaxSwaps = 3
    MaxOrderingGaps = 0
    MaxStaleReads = 2
    MaxFallbacks = 3
    MaxHelps = 2

CONSTRAINT MCStateConstraint

SYMMETRY ModelSymmetry

INVARIANTS
    ReaderHoldsAlivePtr
    RefCountNonNeg
    StoragePtrAlive
    HelpReplacementAlive
