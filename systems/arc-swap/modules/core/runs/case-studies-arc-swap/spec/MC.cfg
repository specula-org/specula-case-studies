\* ===================================================================================
\* MC Configuration: arc-swap debt-based reader tracking
\* ===================================================================================
\* Convergence config: all fault injection DISABLED (0 gaps, 0 stale reads).
\* With ordering gaps disabled, all invariants pass (1.36M states, 160K distinct).
\*
\* For bug hunting, use the MC_hunt_*.cfg configs:
\*   MC_hunt_ordering.cfg  — Family 1: ordering gap → WriterPaysAllDebts VIOLATED
\*   MC_hunt_uaf.cfg       — Family 1: ordering gap → NoUseAfterFree VIOLATED
\*   MC_hunt_fallback_gap.cfg — Family 1: gap → ReaderHoldsAlivePtr VIOLATED
\*   MC_hunt_aba.cfg       — Family 2: ABA → NoABAViolation (PASSES)
\*   MC_hunt_genwrap.cfg   — Family 3: gen wrap → CooldownBlocksReaders (PASSES)
\*   MC_hunt_combined.cfg  — All families → NoUseAfterFree VIOLATED

SPECIFICATION MCSpec

CONSTANTS
    Thread = {T1, T2}
    Ptr = {P1, P2, P3}
    NumFastSlots = 1
    InitPtr = P1
    NullPtr = NullPtr
    GEN_MAX = 8

    \* Counter bounds (convergence: all fault injection = 0)
    MaxSwaps = 3
    MaxOrderingGaps = 0
    MaxStaleReads = 0
    MaxFallbacks = 2

CONSTRAINT MCStateConstraint

SYMMETRY ModelSymmetry

\* --- Standard safety invariants (always checked) ---
INVARIANTS
    MCTypeOK
    NoUseAfterFree
    ReaderHoldsAlivePtr
    RefCountNonNeg

\* --- Structural invariants ---
    StoragePtrAlive
    DeadRefCountZero
    ValidReaderSlot
    ValidWriterOldPtr
    ReaderWriterExclusive

\* --- Extension invariants (bug-family specific) ---
    WriterPaysAllDebts
    NoABAViolation
    CooldownBlocksReaders
