\* ===================================================================================
\* v2 3-Thread Safety Hunt: Real invariants only, all faults
\* ===================================================================================
\* 3 threads for writer-writer concurrency + writer-reader helping.
\* Excludes NoABAViolation (known false positive).

SPECIFICATION MCSpec

CONSTANTS
    Thread = {T1, T2, T3}
    Ptr = {P1, P2, P3, P4}
    NumFastSlots = 1
    InitPtr = P1
    NullPtr = NullPtr
    GEN_MAX = 8

    MaxSwaps = 2
    MaxOrderingGaps = 1
    MaxStaleReads = 1
    MaxFallbacks = 1
    MaxHelps = 1

CONSTRAINT MCStateConstraint

SYMMETRY ModelSymmetry

INVARIANTS
    ReaderHoldsAlivePtr
    RefCountNonNeg
    HelpReplacementAlive
    FallbackCandidateValid
    StoragePtrAlive
    DeadRefCountZero
