\* ===================================================================================
\* v2 Convergence: Non-atomic helping, no faults
\* ===================================================================================

SPECIFICATION MCSpec

CONSTANTS
    Thread = {T1, T2}
    Ptr = {P1, P2, P3}
    NumFastSlots = 1
    InitPtr = P1
    NullPtr = NullPtr
    GEN_MAX = 8

    MaxSwaps = 2
    MaxOrderingGaps = 0
    MaxStaleReads = 0
    MaxFallbacks = 2
    MaxHelps = 2

CONSTRAINT MCStateConstraint

SYMMETRY ModelSymmetry

INVARIANTS
    MCTypeOK
    NoUseAfterFree
    ReaderHoldsAlivePtr
    RefCountNonNeg
    StoragePtrAlive
    DeadRefCountZero
    ValidReaderSlot
    ValidWriterOldPtr
    ReaderWriterExclusive
    WriterPaysAllDebts
    NoABAViolation
    CooldownBlocksReaders
    HelpReplacementAlive
    FallbackCandidateValid
