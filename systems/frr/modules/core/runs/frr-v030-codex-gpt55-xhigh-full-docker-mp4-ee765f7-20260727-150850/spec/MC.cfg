SPECIFICATION MCSpec

CONSTANTS
    Prefix = {p1, p2}
    Owner = {bgp0}
    MaxGen = 4
    MaxSeq = 8
    MaxCtx = 8
    MaxNotify = 8
    MaxTableId = 1
    MaxInstance = 1

    MaxBGPInstallLimit = 3
    MaxRouteAddLimit = 3
    MaxRouteDeleteLimit = 2
    MaxZapiSendFailLimit = 1
    MaxNotifySubscribeLimit = 2
    MaxMetaQueueLimit = 4
    MaxEnqueueFailLimit = 1
    MaxDplaneSuccessLimit = 3
    MaxDplaneFailureLimit = 2
    MaxProviderSkipLimit = 1
    MaxProviderPrivateLimit = 1
    MaxResultLostLimit = 1
    MaxRouteNotifyLimit = 2
    MaxNotifyDropLimit = 1
    MaxRNHRegisterLimit = 2
    MaxRNHSuppressLimit = 1
    MaxRestartLimit = 1
    MaxReconnectLimit = 1
    MaxReplayLimit = 1
    MaxProviderRestartLimit = 1
    MaxShutdownLimit = 1
    MaxCtxQueueLimit = 4
    MaxNotifyQueueLimit = 4

CONSTRAINT MCStateConstraint

SYMMETRY Symmetry

INVARIANTS
    \* Core safety / structural invariants used while converging the spec.
    MCTypeOK
    MCStructuralOK

    \* Scenario invariants are intentionally disabled in the broad convergence
    \* config. They are enabled in MC_hunt_*.cfg.
    \* OwnerInstalledImpliesCurrentFib
    \* NoStaleDplaneMutation
    \* SelectedFibNeedsTerminalResult
    \* PendingImpliesOutstandingWork
    \* NotifyAppliesToMatchingGeneration
    \* NHTResolvedImpliesConfirmedRoute
    \* MetaQSingleVisibleMembership
    \* ProviderSuccessImpliesRealizedAttrs

\* Scenario liveness properties are enabled only in targeted hunt configs.
\* PROPERTIES
\*     RNHRegistrationEventuallyAttached
\*     ReconnectEventuallyReplays

CHECK_DEADLOCK FALSE
