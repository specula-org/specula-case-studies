\* MC_hunt_family1.cfg — Family 1: Crash-window double vote with
\* Byzantine equivocating proposer.
\*
\* Targets:
\*   MC-1 — Byzantine equivocating proposer + crash between sign and
\*          persist allows the recovered honest validator to sign a
\*          second vote at the same round for a different block.
\*   MC-7 — Echo-timeout re-entry combined with safe_to_timeout admitting
\*          round == last_voted_round lets an honest node sign two
\*          distinct timeouts across a crash window.
\*
\* Mechanism that must remain enabled:
\*   - ByzEquivocateProposer (provides v1 /= v2 proposals at the same r)
\*   - Crash + Recover (drops inflight signed vote; reverts volatile)
\*   - SignVote / CompletePersistVote split (the sign-then-persist
\*     window in safety_rules_2chain.rs:88-92)
\*
\* Bounds zeroed for irrelevant fault families.

CONSTANTS
    Server = {s1, s2, s3, s4}
    Faulty = {s4}
    Honest = {s1, s2, s3}
    MaxRound = 3
    MaxEpoch = 1
    Quorum = 3
    Values = {v1, v2}
    Nil = Nil

    ProposalMsgType    = ProposalMsgType
    OptProposalMsgType = OptProposalMsgType
    VoteMsgType        = VoteMsgType
    OrderVoteMsgType   = OrderVoteMsgType
    TimeoutMsgType     = TimeoutMsgType
    CommitVoteMsgType  = CommitVoteMsgType

    Ordered    = Ordered
    Executed   = Executed
    Signed     = Signed
    Aggregated = Aggregated

    MaxTimeoutLimit            = 2       \* MC-7 needs ≥2 timeouts
    MaxCrashLimit              = 2       \* MC-1 needs ≥1 crash
    MaxDropLimit               = 0
    MaxSyncLimit               = 0
    MaxEpochChangeLimit        = 0
    MaxByzEquivProposerLimit   = 2       \* core to MC-1
    MaxByzEquivOrderVoteLimit  = 0
    MaxByzReuseCertLimit       = 0
    MaxByzForgeQCLimit         = 0
    MaxByzReplayLimit          = 0
    MaxWeakEpochRxLimit        = 0
    MaxMsgBufferLimit          = 12

SPECIFICATION MCSpec

VIEW MCView

CONSTRAINT MsgBufferConstraint

\* Family 1 invariants + core safety
\* Variant: RecoverPreservesLastVote disabled to focus the search on NoDoubleVote
INVARIANTS
    NoDoubleVote
    Agreement
    CommitSafety
    RoundPositive
    LVRBound
    HTRBound
    LastVoteShape
    PipelineMonotone
