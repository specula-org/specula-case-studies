\* MC.cfg — Convergence config.
\*
\* Used to validate the spec is well-formed and that the standard
\* invariants hold under normal-path execution + light fault injection.
\* Bug-family invariants are listed but COMMENTED OUT (re-enabled in
\* MC_hunt_*.cfg).

CONSTANTS
    Server = {s1, s2, s3, s4}
    Faulty = {s4}
    Honest = {s1, s2, s3}
    MaxRound = 3
    MaxEpoch = 2
    Quorum = 3
    Values = {v1, v2}
    Nil = Nil

    ProposalMsgType    = ProposalMsgType
    OptProposalMsgType = OptProposalMsgType
    VoteMsgType        = VoteMsgType
    OrderVoteMsgType   = OrderVoteMsgType
    TimeoutMsgType     = TimeoutMsgType
    CommitVoteMsgType  = CommitVoteMsgType

    Ordered    = Ordered
    Executed   = Executed
    Signed     = Signed
    Aggregated = Aggregated

    \* Fault-injection limits — conservative for convergence
    MaxTimeoutLimit            = 2
    MaxCrashLimit              = 1
    MaxDropLimit               = 2
    MaxSyncLimit               = 1
    MaxEpochChangeLimit        = 1
    MaxByzEquivProposerLimit   = 1
    MaxByzEquivOrderVoteLimit  = 1
    MaxByzReuseCertLimit       = 1
    MaxByzForgeQCLimit         = 1
    MaxByzReplayLimit          = 1
    MaxWeakEpochRxLimit        = 1
    MaxMsgBufferLimit          = 12

SPECIFICATION MCSpec

VIEW MCView

CONSTRAINT MsgBufferConstraint

\* Structural invariants (always-on)
INVARIANTS
    RoundPositive
    LVRBound
    HTRBound
    LastVoteShape
    PipelineMonotone
    PersistMonotone
    NoNegativeCounters

\* Standard safety invariants (always-on)
INVARIANTS
    Agreement
    CommitSafety

\* Bug-family invariants (commented out; re-enabled per hunt cfg)
\* INVARIANTS
\*     NoDoubleVote                  \* Family 1, MC-1 / MC-7
\*     NoCrossPathSign               \* Family 2, MC-2
\*     OrderVoteAggregatorDedup      \* Family 2, MC-3
\*     QCValueBound                  \* Family 3, MC-4
\*     TCQuorumPower                 \* Family 3
\*     CommitEpochBound              \* Family 3, MC-5
\*     OrderVoteEpochBound           \* Family 4, MC-6
\*     RecoverPreservesLastVote      \* Family 1, MC-1
