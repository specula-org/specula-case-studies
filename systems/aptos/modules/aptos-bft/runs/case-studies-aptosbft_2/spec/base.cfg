\* base.cfg — Convergence config for the base spec.
\*
\* This config is for SYNTAX checking + light-weight sanity invariants.
\* The MC config is what should be used for bug hunting.

CONSTANTS
    Server = {s1, s2, s3, s4}
    Faulty = {s4}
    MaxRound = 3
    MaxEpoch = 2
    Quorum = 3
    Values = {v1, v2}
    Nil = Nil

    ProposalMsgType    = ProposalMsgType
    OptProposalMsgType = OptProposalMsgType
    VoteMsgType        = VoteMsgType
    OrderVoteMsgType   = OrderVoteMsgType
    TimeoutMsgType     = TimeoutMsgType
    CommitVoteMsgType  = CommitVoteMsgType

    Ordered    = Ordered
    Executed   = Executed
    Signed     = Signed
    Aggregated = Aggregated

SPECIFICATION Spec

INVARIANTS
    RoundPositive
    LVRBound
    HTRBound
    LastVoteShape
    PipelineMonotone
