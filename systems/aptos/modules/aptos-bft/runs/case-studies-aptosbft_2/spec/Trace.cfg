\* Trace.cfg — Trace validation config.
\*
\* Validates the base spec against captured implementation traces.
\* Byzantine actions are not exercised here — those exist only in MC.
\* The invariant set is the structural and standard-safety subset.

CONSTANTS
    \* Server IDs are strings to match JSON trace values.  Values and
    \* Nil are strings for the same reason — the spec compares them
    \* against fields extracted from the trace via ndJsonDeserialize.
    Server = {"s1", "s2", "s3", "s4"}
    Faulty = {}
    Honest = {"s1", "s2", "s3", "s4"}
    MaxRound = 10
    MaxEpoch = 3
    Quorum = 3
    Values = {"v1", "v2", "v3"}
    Nil = "Nil"

    ProposalMsgType    = ProposalMsgType
    OptProposalMsgType = OptProposalMsgType
    VoteMsgType        = VoteMsgType
    OrderVoteMsgType   = OrderVoteMsgType
    TimeoutMsgType     = TimeoutMsgType
    CommitVoteMsgType  = CommitVoteMsgType

    Ordered    = Ordered
    Executed   = Executed
    Signed     = Signed
    Aggregated = Aggregated

SPECIFICATION TraceSpec

\* Reaching the end of the trace is the natural termination, not a
\* deadlock — TLC's deadlock check would otherwise misreport success.
CHECK_DEADLOCK FALSE

\* Cursor must advance to completion.  Without this property TLC will
\* report "no errors" even when l never moves; that is a silent failure.
PROPERTIES TraceMatched

\* Validate structural + standard-safety invariants on every state.
\* Bug-family invariants (NoDoubleVote etc.) are EXCLUDED here because
\* they require Byzantine actions to trigger — those don't appear in
\* honest traces.
INVARIANTS
    RoundPositive
    LVRBound
    HTRBound
    LastVoteShape
    PipelineMonotone
    Agreement
    CommitSafety
