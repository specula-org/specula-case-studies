\* MC_hunt_family5.cfg — Family 5: Pipeline race / commit-vote
\* signing-without-persist (NARROW model-checkable subset).
\*
\* The brief explicitly notes that Family 5's model-checkable subset
\* is the *commit-vote* signing-without-persist gap (safety_rules.rs
\* :372-418 — no persist for commit votes; buffer_manager.rs:861-863
\* comments "Since we don't persist the votes, nodes that crashed
\* would lose the votes even after send ack.").  The deeper persistence
\* and lock-ordering issues are best caught by integration tests
\* (modeling-brief.md §6.2 / T-1..T-9).
\*
\* What we hunt here:
\*   - SignCommitVote with NO last-committed-round dedup
\*   - Apply Crash *before* CompletePersistVote so the commit-vote
\*     state is lost on recovery; combined with a Byzantine-supplied
\*     conflicting commit proof, the node could re-emit a different
\*     commit vote.

CONSTANTS
    Server = {s1, s2, s3, s4}
    Faulty = {s4}
    Honest = {s1, s2, s3}
    MaxRound = 3
    MaxEpoch = 1
    Quorum = 3
    Values = {v1, v2}
    Nil = Nil

    ProposalMsgType    = ProposalMsgType
    OptProposalMsgType = OptProposalMsgType
    VoteMsgType        = VoteMsgType
    OrderVoteMsgType   = OrderVoteMsgType
    TimeoutMsgType     = TimeoutMsgType
    CommitVoteMsgType  = CommitVoteMsgType

    Ordered    = Ordered
    Executed   = Executed
    Signed     = Signed
    Aggregated = Aggregated

    MaxTimeoutLimit            = 1
    MaxCrashLimit              = 2     \* Family 5 commit-vote loss
    MaxDropLimit               = 1
    MaxSyncLimit               = 1
    MaxEpochChangeLimit        = 0
    MaxByzEquivProposerLimit   = 1
    MaxByzEquivOrderVoteLimit  = 1
    MaxByzReuseCertLimit       = 0
    MaxByzForgeQCLimit         = 0
    MaxByzReplayLimit          = 0
    MaxWeakEpochRxLimit        = 0
    MaxMsgBufferLimit          = 12

SPECIFICATION MCSpec

VIEW MCView

CONSTRAINT MsgBufferConstraint

\* Family 5: there is no Family-5-specific invariant in §5 of the
\* brief; commit-vote anomalies show up as Agreement / CommitEpochBound
\* violations.  We use CommitEpochBound + Agreement here.
INVARIANTS
    CommitEpochBound
    Agreement
    CommitSafety
    RoundPositive
    LVRBound
    HTRBound
    LastVoteShape
    PipelineMonotone
