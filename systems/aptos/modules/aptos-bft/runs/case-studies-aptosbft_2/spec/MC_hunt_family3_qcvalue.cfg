\* MC_hunt_family3.cfg — Family 3: Certificate / message value-binding
\* gaps.
\*
\* Targets:
\*   MC-4 — A receiver accepts a WrappedLedgerInfo whose vote_data was
\*          rebound to a different round by a Byzantine relayer (no
\*          signature on vote_data; verify_consensus_data_hash not
\*          called in WrappedLedgerInfo::verify).
\*   MC-5 — sign_commit_vote accepts a new_ledger_info whose epoch
\*          differs from safety_data.epoch (no verify_epoch in
\*          sign_commit_vote).
\*
\* Mechanism that must remain enabled:
\*   - ByzReuseRealCertificate (mutates vote_data on WrappedLedgerInfo)
\*   - ByzForgeQCInOrderVoteMsg (trust-on-first-use of li_digest)
\*   - SignCommitVote with arbitrary e \in 1..MaxEpoch (Family 3 MC-5)
\*   - Epoch must be > 1 so commit-vote epoch mismatch is reachable

CONSTANTS
    Server = {s1, s2, s3, s4}
    Faulty = {s4}
    Honest = {s1, s2, s3}
    MaxRound = 3
    MaxEpoch = 2
    Quorum = 3
    Values = {v1, v2}
    Nil = Nil

    ProposalMsgType    = ProposalMsgType
    OptProposalMsgType = OptProposalMsgType
    VoteMsgType        = VoteMsgType
    OrderVoteMsgType   = OrderVoteMsgType
    TimeoutMsgType     = TimeoutMsgType
    CommitVoteMsgType  = CommitVoteMsgType

    Ordered    = Ordered
    Executed   = Executed
    Signed     = Signed
    Aggregated = Aggregated

    MaxTimeoutLimit            = 1
    MaxCrashLimit              = 0
    MaxDropLimit               = 0
    MaxSyncLimit               = 0
    MaxEpochChangeLimit        = 1     \* need to advance an honest node
    MaxByzEquivProposerLimit   = 0
    MaxByzEquivOrderVoteLimit  = 0
    MaxByzReuseCertLimit       = 2     \* core to MC-4
    MaxByzForgeQCLimit         = 1
    MaxByzReplayLimit          = 0
    MaxWeakEpochRxLimit        = 0
    MaxMsgBufferLimit          = 12

SPECIFICATION MCSpec

VIEW MCView

CONSTRAINT MsgBufferConstraint

\* Family 3 invariants + core safety
\* Variant: CommitEpochBound disabled to focus search on QCValueBound / TCQuorumPower
INVARIANTS
    QCValueBound
    TCQuorumPower
    Agreement
    CommitSafety
    RoundPositive
    LVRBound
    HTRBound
    LastVoteShape
    PipelineMonotone
