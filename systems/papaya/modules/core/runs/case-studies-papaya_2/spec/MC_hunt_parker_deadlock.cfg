\* Hunting config for Family 3: Parker / Unpark Routing (MC-1 / D2-1)
\*
\* Mechanism: blocking-mode AbortResize unparks SOURCE table's parker (raw/mod.rs:2282-2283)
\* but threads are parked on DESTINATION (next) table's parker keyed by &next.status (raw/mod.rs:2350-2352).
\*
\* Tight bounds: only what is needed to reach the abort path while a thread is parked.
\*   - 2 threads: one parks, one aborts
\*   - 1 resize, 1 abort, 1 park
\*   - 0 inserts/removes (not needed; parker bug is independent of map mutations)

CONSTANTS
    NULL = NULL
    COPYING = COPYING
    COPIED = COPIED
    BORROWED = BORROWED
    PENDING = PENDING
    ABORTED = ABORTED
    PROMOTED = PROMOTED
    META_EMPTY = META_EMPTY
    META_TOMBSTONE = META_TOMBSTONE
    Thread = {t1, t2}
    Key = {k1}
    Value = {v1}
    Slot = {0, 1}
    MaxTables = 3
    InsertLimit = 1
    RemoveLimit = 0
    ResizeLimit = 1
    AbortLimit = 1
    EpochLimit = 0
    ParkLimit = 1
    IterLimit = 0
    FixupLimit = 0

SPECIFICATION MCSpec

SYMMETRY ModelSymmetry

CONSTRAINT StateConstraint

\* Target invariant + core safety only
INVARIANT NoParkedOnAborted
INVARIANT NoDuplicateEntry
INVARIANT PromotionSafety
