\* Hunting config for Family 7: Slot Recycling / META Overwrite (MC-2 / D2-4)
\*
\* Mechanism: between InsertCASEntry (winner CAS) and InsertStoreMeta
\* (winner Release-store at raw/mod.rs:1051), a concurrent Remove can
\* tombstone the slot. The unconditional InsertStoreMeta then overwrites
\* TOMBSTONE meta with h2(k), violating MetaTombstoneStable.
\*
\* Tight bounds:
\*   - 2 threads (one inserter, one remover)
\*   - 1 key (forces winner+remove on same slot)
\*   - small slot set (3 slots is enough to expose probe + slot reuse)
\*   - 0 resizes/aborts/iters (orthogonal to this bug)

CONSTANTS
    NULL = NULL
    COPYING = COPYING
    COPIED = COPIED
    BORROWED = BORROWED
    PENDING = PENDING
    ABORTED = ABORTED
    PROMOTED = PROMOTED
    META_EMPTY = META_EMPTY
    META_TOMBSTONE = META_TOMBSTONE
    Thread = {t1, t2}
    Key = {k1, k2}
    Value = {v1}
    Slot = {0, 1}
    MaxTables = 2
    InsertLimit = 3
    RemoveLimit = 2
    ResizeLimit = 0
    AbortLimit = 0
    EpochLimit = 0
    ParkLimit = 0
    IterLimit = 0
    FixupLimit = 1

SPECIFICATION MCSpec

SYMMETRY ModelSymmetry

CONSTRAINT StateConstraint

\* Target invariant + core safety only
INVARIANT NoStaleMetaOnEmptySlot
INVARIANT NoDuplicateEntry
