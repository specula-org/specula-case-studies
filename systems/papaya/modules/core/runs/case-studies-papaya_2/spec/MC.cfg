CONSTANTS
    NULL = NULL
    COPYING = COPYING
    COPIED = COPIED
    BORROWED = BORROWED
    PENDING = PENDING
    ABORTED = ABORTED
    PROMOTED = PROMOTED
    META_EMPTY = META_EMPTY
    META_TOMBSTONE = META_TOMBSTONE
    Thread = {t1, t2, t3}
    Key = {k1, k2}
    Value = {v1, v2}
    Slot = {0, 1, 2}
    MaxTables = 3
    InsertLimit = 4
    RemoveLimit = 2
    ResizeLimit = 2
    AbortLimit = 1
    EpochLimit = 2
    ParkLimit = 2
    IterLimit = 1
    FixupLimit = 2

SPECIFICATION MCSpec

SYMMETRY ModelSymmetry

CONSTRAINT StateConstraint

\* Standard safety invariants (held during convergence)
INVARIANTS
    NoDuplicateEntry
    ProbeChainIntegrity
    PromotionSafety

\* Structural invariants (catch spec modeling errors)
INVARIANTS
    ResizeStatusConsistency
    CopiedCountBound
    MetaConsistency
    TagConsistency
    InsertWindowConsistency

\* Extension invariants (bug-family specific) — commented out for convergence,
\* enabled in MC_hunt_<family>.cfg.
\* INVARIANT NoLostEntry             [Family 1: MC-7]
\* INVARIANT NoUseAfterReclaim       [Family 4: MC-5]
\* INVARIANT NoParkedOnAborted       [Family 3: MC-1 / D2-1]
\* INVARIANT IterNoDoubleYield       [Family 6: MC-4]
\* INVARIANT IterWeakSnapshot        [Family 6: MC-3]
\* INVARIANT NoStaleMetaOnEmptySlot  [Family 7: MC-2 / D2-4]
