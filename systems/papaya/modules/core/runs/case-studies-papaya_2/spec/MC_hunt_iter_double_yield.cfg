\* Hunting config for Family 6: Adversarial Caller — Iter+Modify+Resize (MC-4)
\*
\* Mechanism: a long-lived Iter holds a snapshot of the root table at iter-begin.
\* If the iter's traversal walks the table chain (PR #76 drain pattern), it can
\* yield the same key twice — once from the source table (BORROWED) and once
\* from the destination after copy.
\*
\* The current spec's IterAdvanceYield uses the snapshot table only; it cannot
\* double-yield by itself. The hazard is exposed when concurrent Insert into a
\* DIFFERENT slot of the SAME snapshot table races with Remove + Insert+Remove
\* on the same key — exposing the same key reachable through two slot positions
\* during a transient window.
\*
\* Tight bounds:
\*   - 2 threads (one iterator, one mutator)
\*   - small slot set (3 slots), 2 keys
\*   - 1 iter
\*   - inserts/removes generous to expose probe-chain transitions

CONSTANTS
    NULL = NULL
    COPYING = COPYING
    COPIED = COPIED
    BORROWED = BORROWED
    PENDING = PENDING
    ABORTED = ABORTED
    PROMOTED = PROMOTED
    META_EMPTY = META_EMPTY
    META_TOMBSTONE = META_TOMBSTONE
    Thread = {t1, t2}
    Key = {k1, k2}
    Value = {v1}
    Slot = {0, 1, 2}
    MaxTables = 2
    InsertLimit = 4
    RemoveLimit = 2
    ResizeLimit = 0
    AbortLimit = 0
    EpochLimit = 0
    ParkLimit = 0
    IterLimit = 1
    FixupLimit = 1

SPECIFICATION MCSpec

SYMMETRY ModelSymmetry

CONSTRAINT StateConstraint

\* Target invariant + core safety only
INVARIANT IterNoDoubleYield
INVARIANT NoDuplicateEntry
