\* Hunting config for Family 1: Resize Copy/Insert Race (MC-7)
\*
\* Mechanism: concurrent insert + remove + copy at the same slot can lose
\* an entry across tables. Spec splits copy into MarkCopying / InsertToNext /
\* MarkCopied; with concurrent Remove on a non-COPYING slot, an entry that
\* should be present in the new table after promotion is missing.

CONSTANTS
    NULL = NULL
    COPYING = COPYING
    COPIED = COPIED
    BORROWED = BORROWED
    PENDING = PENDING
    ABORTED = ABORTED
    PROMOTED = PROMOTED
    META_EMPTY = META_EMPTY
    META_TOMBSTONE = META_TOMBSTONE
    Thread = {t1, t2, t3}
    Key = {k1, k2}
    Value = {v1}
    Slot = {0, 1}
    MaxTables = 3
    InsertLimit = 3
    RemoveLimit = 2
    ResizeLimit = 2
    AbortLimit = 0
    EpochLimit = 0
    ParkLimit = 0
    IterLimit = 0
    FixupLimit = 0

SPECIFICATION MCSpec

SYMMETRY ModelSymmetry

CONSTRAINT StateConstraint

\* Target invariants for resize protocol
INVARIANT NoLostEntry
INVARIANT NoDuplicateEntry
INVARIANT PromotionSafety
INVARIANT ProbeChainIntegrity
