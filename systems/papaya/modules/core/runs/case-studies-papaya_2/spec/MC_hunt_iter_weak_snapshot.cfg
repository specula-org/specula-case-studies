\* Hunting config for Family 6: Iter Weak Snapshot — concurrent insert into NEW root (MC-3)
\*
\* Mechanism: while an iterator holds a snapshot of the OLD root table, a
\* concurrent resize promotes a new root table; subsequent inserts go into the
\* new root and are missed by the iterator (silent missed-key under weak-snapshot
\* docs). Whether that is a *correctness* problem depends on documented semantics;
\* IterWeakSnapshot pins down the formal boundary.

CONSTANTS
    NULL = NULL
    COPYING = COPYING
    COPIED = COPIED
    BORROWED = BORROWED
    PENDING = PENDING
    ABORTED = ABORTED
    PROMOTED = PROMOTED
    META_EMPTY = META_EMPTY
    META_TOMBSTONE = META_TOMBSTONE
    Thread = {t1, t2}
    Key = {k1, k2}
    Value = {v1}
    Slot = {0, 1}
    MaxTables = 3
    InsertLimit = 3
    RemoveLimit = 1
    ResizeLimit = 1
    AbortLimit = 0
    EpochLimit = 0
    ParkLimit = 0
    IterLimit = 1
    FixupLimit = 0

SPECIFICATION MCSpec

SYMMETRY ModelSymmetry

CONSTRAINT StateConstraint

\* Target invariant
INVARIANT IterWeakSnapshot
INVARIANT NoDuplicateEntry
