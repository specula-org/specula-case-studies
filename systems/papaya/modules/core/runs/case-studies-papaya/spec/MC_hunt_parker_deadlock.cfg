\* Hunting config for Family 3: Parker/Synchronization Deadlocks
\* Targets: NoParkedOnAborted (approximates NoDeadlock liveness)
\* Strategy: maximize abort + park interleavings, minimize inserts

CONSTANTS
    NULL = NULL
    COPYING = COPYING
    COPIED = COPIED
    BORROWED = BORROWED
    PENDING = PENDING
    ABORTED = ABORTED
    PROMOTED = PROMOTED
    META_EMPTY = META_EMPTY
    META_TOMBSTONE = META_TOMBSTONE
    Thread = {t1, t2, t3}
    Key = {k1}
    Value = {v1}
    Slot = {s1, s2}
    MaxTables = 3
    InsertLimit = 2
    RemoveLimit = 0
    ResizeLimit = 2
    AbortLimit = 2
    EpochLimit = 0
    ParkLimit = 3

SPECIFICATION MCSpec

SYMMETRY ModelSymmetry

CONSTRAINT StateConstraint

\* Target invariant + core safety
INVARIANTS
    NoParkedOnAborted
    NoDuplicateEntry
    PromotionSafety
