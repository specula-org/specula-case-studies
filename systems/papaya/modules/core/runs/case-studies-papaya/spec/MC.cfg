CONSTANTS
    NULL = NULL
    COPYING = COPYING
    COPIED = COPIED
    BORROWED = BORROWED
    PENDING = PENDING
    ABORTED = ABORTED
    PROMOTED = PROMOTED
    META_EMPTY = META_EMPTY
    META_TOMBSTONE = META_TOMBSTONE
    Thread = {t1, t2, t3}
    Key = {k1, k2}
    Value = {v1, v2}
    Slot = {s1, s2, s3}
    MaxTables = 3
    InsertLimit = 4
    RemoveLimit = 2
    ResizeLimit = 2
    AbortLimit = 1
    EpochLimit = 2
    ParkLimit = 2

SPECIFICATION MCSpec

SYMMETRY ModelSymmetry

CONSTRAINT StateConstraint

\* Standard safety invariants
INVARIANTS
    NoDuplicateEntry
    ProbeChainIntegrity
    PromotionSafety

\* Structural invariants
INVARIANTS
    ResizeStatusConsistency
    CopiedCountBound
    MetaConsistency
    TagConsistency

\* Extension invariants (bug-family specific) — commented out for convergence
\* INVARIANT NoLostEntry
\* INVARIANT CopyCompleteness
\* INVARIANT NoUseAfterReclaim
\* INVARIANT NoParkedOnAborted
