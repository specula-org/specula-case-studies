CONSTANTS
    NULL = NULL
    COPYING = COPYING
    COPIED = COPIED
    BORROWED = BORROWED
    PENDING = PENDING
    ABORTED = ABORTED
    PROMOTED = PROMOTED
    META_EMPTY = META_EMPTY
    META_TOMBSTONE = META_TOMBSTONE
    MaxTables = 3

\* Thread, Key, Value, Slot derived from trace at runtime
\* Override via CONSTANT assignments if needed

INIT TraceInit
NEXT TraceNext

\* Safety invariants (should hold on every real execution)
INVARIANTS
    NoDuplicateEntry
    ProbeChainIntegrity
    PromotionSafety

\* Structural invariants (catch spec modeling errors)
INVARIANTS
    ResizeStatusConsistency
    CopiedCountBound
    MetaConsistency
    TagConsistency

\* Do NOT include fault-injection invariants (NoUseAfterReclaim, NoParkedOnAborted)
\* — traces run without faults
