\* MC_hunt_familyE.cfg — Family E: Cross-epoch binding gaps in proposal
\* validation. Composes with Family A (TC replay across epochs).
\*
\* Target finding: MC5 — Byzantine proposer with mis-declared epoch satisfies
\* validate_current_epoch's one-sided check, then validate_qc_and_next_epoch_qc
\* verifies the QC against the attacker-chosen stake table.
\*
\* Trigger setup:
\*   - MCByzProposeMisdeclaredEpoch emits a proposal with claimedEpoch /=
\*     realEpoch(view)
\*   - ValidateCurrentEpoch passes (it's one-sided)
\*   - validate_qc_and_next_epoch_qc verifies justify_qc against
\*     StakeTable(claimedEpoch)
\*   - ProposalEpochMatchesView expected to fail
\*
\* Bounds: keep misdeclared-epoch fault + TC replay alive (composition with A).

SPECIFICATION MCSpec

CONSTANTS
    Server                = {s1, s2, s3}
    ByzServer             = {b1}
    MaxView               = 4
    MaxEpoch              = 1
    Leaves                = {L1, L2}
    NilLeaf               = NilLeaf
    NilQC                 = NilQC
    NoCert                = NoCert
    QcMsg                 = QcMsg
    TcMsg                 = TcMsg
    VscMsg                = VscMsg
    ProposalMsg           = ProposalMsg
    VoteMsg               = VoteMsg
    TimeoutVoteMsg        = TimeoutVoteMsg
    EvNone                = EvNone
    EvTimeout             = EvTimeout
    EvViewSync            = EvViewSync
    PhasePreCommit        = PhasePreCommit
    PhaseCommit           = PhaseCommit
    PhaseFinalize         = PhaseFinalize
    MaxCrash              = 0
    MaxTcReplay           = 1
    MaxDoubleVote         = 0
    MaxMisdeclaredEpoch   = 1
    MaxForceLockedAdvance = 0
    MaxTimeoutVote        = 1
    MaxRecover            = 0
    MaxQcs                = 3
    MaxTcs                = 2
    MaxVscs               = 0
    MaxProposals          = 3

SYMMETRY ServerSymmetry
VIEW MCView

INVARIANTS
    MCTypeOK
    ProposalEpochMatchesView
    ElectionSafety_HS2

CHECK_DEADLOCK FALSE
