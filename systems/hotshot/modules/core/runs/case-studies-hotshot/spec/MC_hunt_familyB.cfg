\* MC_hunt_familyB.cfg — Family B: Equivocation invisibility & locked-view holes.
\* Target findings:
\*   MC2 — crash recovery loses latest_voted_view; Byzantine signs two votes
\*         for the same view → two distinct same-view QCs.
\*   MC6 — Byzantine leader pushes lockedView past sibling-branch high QC.
\*
\* Trigger setup:
\*   - MCCrash + MCRecover combine to clear latest_voted_view
\*   - MCByzDoubleVote signs two different leaves at the same view
\*   - MCByzForceLockedViewAdvance proposes with a sibling-branch justify_qc
\*   - FormQC may consolidate either set into a QC; ObserveQC records both
\*   - NoEquivocationGoesUnflagged expected to fail (impl drops at debug!)
\*
\* Bounds: keep crash/recover and double-vote alive.

SPECIFICATION MCSpec

CONSTANTS
    Server                = {s1, s2, s3}
    ByzServer             = {b1}
    MaxView               = 3
    MaxEpoch              = 1
    Leaves                = {L1, L2}
    NilLeaf               = NilLeaf
    NilQC                 = NilQC
    NoCert                = NoCert
    QcMsg                 = QcMsg
    TcMsg                 = TcMsg
    VscMsg                = VscMsg
    ProposalMsg           = ProposalMsg
    VoteMsg               = VoteMsg
    TimeoutVoteMsg        = TimeoutVoteMsg
    EvNone                = EvNone
    EvTimeout             = EvTimeout
    EvViewSync            = EvViewSync
    PhasePreCommit        = PhasePreCommit
    PhaseCommit           = PhaseCommit
    PhaseFinalize         = PhaseFinalize
    MaxCrash              = 1
    MaxTcReplay           = 0
    MaxDoubleVote         = 1
    MaxMisdeclaredEpoch   = 0
    MaxForceLockedAdvance = 1
    MaxTimeoutVote        = 1
    MaxRecover            = 1
    MaxQcs                = 3
    MaxTcs                = 0
    MaxVscs               = 0
    MaxProposals          = 3

SYMMETRY ServerSymmetry
VIEW MCView

INVARIANTS
    MCTypeOK
    ElectionSafety_HS2
    NoEquivocationGoesUnflagged
    LockedViewBelowOrEqualHighQC

CHECK_DEADLOCK FALSE
