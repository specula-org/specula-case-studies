\* Trace validation configuration for eliben/raft
\*
\* Usage: java -jar tla2tools.jar -config Trace.cfg Trace.tla
\*        Override trace file: -DJSON=../traces/my_trace.ndjson

SPECIFICATION TraceSpec

\* Disable deadlock checking — trace validation ends in deadlock when
\* the trace is fully consumed (l > Len(TraceLog)), which is expected.
CHECK_DEADLOCK FALSE

\* Server set is derived from trace (TraceServer operator)
CONSTANTS
    Server = {0, 1, 2}
    Follower = Follower
    Candidate = Candidate
    Leader = Leader
    Nil = Nil
    RequestVoteRequest = RequestVoteRequest
    RequestVoteResponse = RequestVoteResponse
    AppendEntriesRequest = AppendEntriesRequest
    AppendEntriesResponse = AppendEntriesResponse

\* Core safety invariants
INVARIANTS
    ElectionSafety
    LogMatching

\* Diagnostic output
ALIAS TraceAlias
