\* Hunting config for Bug Family 1, F1c: non-atomic persistToStorage
\*
\* Target: ElectionSafety violation via partial persist + crash
\* Mechanism: persistToStorage writes term but crashes before votedFor
\*            → recover with new term but old votedFor (Nil) → double vote
\*
\* Uses PartialPersist fault injection action

SPECIFICATION MCSpec

CONSTANTS
    s1 = s1
    s2 = s2
    s3 = s3

CONSTANTS
    Server = {s1, s2, s3}
    Follower = Follower
    Candidate = Candidate
    Leader = Leader
    Nil = Nil
    RequestVoteRequest = RequestVoteRequest
    RequestVoteResponse = RequestVoteResponse
    AppendEntriesRequest = AppendEntriesRequest
    AppendEntriesResponse = AppendEntriesResponse

CONSTANTS
    MaxTermLimit = 4
    MaxTimeoutLimit = 4
    MaxRequestLimit = 1
    MaxCrashLimit = 3
    MaxLoseLimit = 2
    MaxAppendLimit = 4
    MaxMsgBufferLimit = 10

Timeout <- MCTimeout
ClientRequest <- MCClientRequest
Crash <- MCCrash
LoseMessage <- MCLoseMessage
AppendEntries <- MCAppendEntries

SYMMETRY Symmetry
CONSTRAINT MsgBufferConstraint
CHECK_DEADLOCK FALSE

INVARIANTS
    ElectionSafety
