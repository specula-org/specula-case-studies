\* Trace.cfg — Trace validation config
\* Override JSON path via: -DJSON=../traces/your_trace.ndjson

CONSTANTS
    Server <- TraceServers
    Nil = Nil
    Follower = Follower
    Candidate = Candidate
    Leader = Leader
    ValueEntry = ValueEntry
    ConfigEntry = ConfigEntry
    PreVoteRequestMsg = PreVoteRequestMsg
    PreVoteResponseMsg = PreVoteResponseMsg
    VoteRequestMsg = VoteRequestMsg
    VoteResponseMsg = VoteResponseMsg
    AppendEntriesRequestMsg = AppendEntriesRequestMsg
    AppendSuccessResponseMsg = AppendSuccessResponseMsg
    AppendFailureResponseMsg = AppendFailureResponseMsg
    AssertsDisabled = FALSE

INIT TraceInit

NEXT TraceNext

\* Use deadlock checking: trace ends when cursor reaches end + 1.
\* Deadlock = trace event couldn't be matched (no enabled action).
\* Reaching l = Len(TraceLog) + 1 without deadlock = success.

\* Invariants to check during trace replay
INVARIANTS
    ElectionSafety
    LogMatching
    CommitIndexBound
