\* MC_hunt_linearizable_read.cfg — Bug Family 5: Linearizable Read Correctness
\*
\* Targets MC-4: Linearizable read started before membership change,
\*               satisfied by acks from newly added member.
\*
\* Enables queries and membership changes together.

CONSTANTS
    Server = {s1, s2, s3}
    Nil = Nil
    Follower = Follower
    Candidate = Candidate
    Leader = Leader
    ValueEntry = ValueEntry
    ConfigEntry = ConfigEntry
    PreVoteRequestMsg = PreVoteRequestMsg
    PreVoteResponseMsg = PreVoteResponseMsg
    VoteRequestMsg = VoteRequestMsg
    VoteResponseMsg = VoteResponseMsg
    AppendEntriesRequestMsg = AppendEntriesRequestMsg
    AppendSuccessResponseMsg = AppendSuccessResponseMsg
    AppendFailureResponseMsg = AppendFailureResponseMsg
    AssertsDisabled = FALSE
    MaxTimeoutLimit = 3
    MaxElectionLimit = 3
    RequestLimit = 2
    AppendEntriesLimit = 6
    CrashLimit = 0
    LoseLimit = 2
    LeaseCheckLimit = 2
    MembershipLimit = 1
    QueryLimit = 2
    MaxTermLimit = 3
    MaxMsgBuffer = 10

SPECIFICATION MCSpec

SYMMETRY ModelSymmetry

VIEW MCView

CONSTRAINT StateConstraint

INVARIANTS
    ElectionSafety
    QuerySafety
