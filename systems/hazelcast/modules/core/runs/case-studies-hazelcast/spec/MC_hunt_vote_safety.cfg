\* MC_hunt_vote_safety.cfg — Bug Family 1: Vote Safety Violations on Leader Demotion
\*
\* Targets MC-1: Assert-only term check in AppendSuccessResponseHandler.
\* With AssertsDisabled=TRUE, a stale response with higher term bypasses demotion.
\*
\* Also tests MC-7: Leader self-demotion timing (stale leader window).

CONSTANTS
    Server = {s1, s2, s3}
    Nil = Nil
    Follower = Follower
    Candidate = Candidate
    Leader = Leader
    ValueEntry = ValueEntry
    ConfigEntry = ConfigEntry
    PreVoteRequestMsg = PreVoteRequestMsg
    PreVoteResponseMsg = PreVoteResponseMsg
    VoteRequestMsg = VoteRequestMsg
    VoteResponseMsg = VoteResponseMsg
    AppendEntriesRequestMsg = AppendEntriesRequestMsg
    AppendSuccessResponseMsg = AppendSuccessResponseMsg
    AppendFailureResponseMsg = AppendFailureResponseMsg
    AssertsDisabled = TRUE
    MaxTimeoutLimit = 5
    MaxElectionLimit = 5
    RequestLimit = 2
    AppendEntriesLimit = 8
    CrashLimit = 0
    LoseLimit = 3
    LeaseCheckLimit = 2
    MembershipLimit = 0
    QueryLimit = 0
    MaxTermLimit = 4
    MaxMsgBuffer = 12

SPECIFICATION MCSpec

SYMMETRY ModelSymmetry

VIEW MCView

CONSTRAINT StateConstraint

INVARIANTS
    ElectionSafety
    LeaderCompleteness
    LogMatching
