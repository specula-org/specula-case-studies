SPECIFICATION MCSpec

CONSTANTS
    Jobs = {"j1", "j2", "j3"}
    Workers = {w1, w2}
    Segments = {"root", "segA"}
    InputSsts = {"s0", "s1", "s2", "s3"}
    OutputSsts = {"o0", "o1", "o2"}
    GcManagedSsts = {"s0", "o0", "o1", "o2"}
    L0Ssts = {"s0", "s2"}
    RootSegment = "root"
    Nil = "Nil"

    Absent = "Absent"
    Submitted = "Submitted"
    Scheduled = "Scheduled"
    Running = "Running"
    Compacted = "Compacted"
    Completed = "Completed"
    Failed = "Failed"

    NoOrigin = "NoOrigin"
    LocalOrigin = "LocalOrigin"
    RemoteOrigin = "RemoteOrigin"

    NoRetry = "NoRetry"
    PostClaimInvalid = "PostClaimInvalid"
    ExecErrorRetry = "ExecErrorRetry"
    TimeoutRetry = "TimeoutRetry"
    RestartRetry = "RestartRetry"

    TieredKind = "TieredKind"
    DrainKind = "DrainKind"

    MaxConcurrent = 1
    MaxWorkerClaims = 1
    HeartbeatTimeout = 2
    CheckpointTTL = 3
    GcMinAge = 1

    JobSources <- Family1ConfirmedL0JobSources
    JobOutput <- Family1ConfirmedL0JobOutput
    JobSegment <- Family1ConfirmedL0JobSegment
    JobKind <- DefaultJobKind
    JobHasL0 <- Family1ConfirmedL0JobHasL0
    JobHasSR <- Family1ConfirmedL0JobHasSR
    SchedulerAllows <- DefaultSchedulerAllows
    DrainCoversWatermark <- DefaultDrainCoversWatermark
    InitialManifestRefs <- Family1ConfirmedL0InitialManifestRefs
    InputSstTs <- DefaultInputSstTs

    MaxLocalSubmitLimit = 1
    MaxRemoteSubmitLimit = 2
    MaxCrashLimit = 0
    MaxCoordClockLimit = 2
    MaxWorkerClockLimit = 2
    MaxExecErrorLimit = 0
    MaxGcSweepLimit = 0
    MaxCheckpointRefreshLimit = 0

SYMMETRY Symmetry
VIEW ModelView
CONSTRAINT CheckpointConstraint

INVARIANTS
    TypeOK
    RunningHasWorker
    NoConflictingActiveCompactions
    BoundedRunningClaims
    SinglePublishPerCompaction
