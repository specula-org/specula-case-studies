SPECIFICATION TraceSpec

CONSTANTS
    Jobs = {"j1", "j2", "j3"}
    Workers = {"w1", "w2"}
    Segments = {"root", "segA"}
    InputSsts = {"s0", "s1", "s2", "s3"}
    OutputSsts = {"o0", "o1", "o2"}
    GcManagedSsts = {"s0", "o0", "o1", "o2"}
    L0Ssts = {"s2"}
    RootSegment = "root"
    Nil = "Nil"

    Absent = "Absent"
    Submitted = "Submitted"
    Scheduled = "Scheduled"
    Running = "Running"
    Compacted = "Compacted"
    Completed = "Completed"
    Failed = "Failed"

    NoOrigin = "NoOrigin"
    LocalOrigin = "LocalOrigin"
    RemoteOrigin = "RemoteOrigin"

    NoRetry = "NoRetry"
    PostClaimInvalid = "PostClaimInvalid"
    ExecErrorRetry = "ExecErrorRetry"
    TimeoutRetry = "TimeoutRetry"
    RestartRetry = "RestartRetry"

    TieredKind = "TieredKind"
    DrainKind = "DrainKind"

    MaxConcurrent = 1
    MaxWorkerClaims = 1
    HeartbeatTimeout = 2
    CheckpointTTL = 3
    GcMinAge = 1

    JobSources <- DefaultJobSources
    JobOutput <- DefaultJobOutput
    JobSegment <- DefaultJobSegment
    JobKind <- DefaultJobKind
    JobHasL0 <- DefaultJobHasL0
    JobHasSR <- DefaultJobHasSR
    SchedulerAllows <- DefaultSchedulerAllows
    DrainCoversWatermark <- DefaultDrainCoversWatermark
    InitialManifestRefs <- DefaultInitialManifestRefs
    InputSstTs <- DefaultInputSstTs

VIEW TraceView

CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    RunningHasWorker
    EpochAlignment
    ViewVersionsMonotone
    FencedWriterCannotOverwriteFreshState
    CheckpointRefsKnown
    PublishedOutputsTracked
    NoConflictingActiveCompactions
    BoundedRunningClaims
    SinglePublishPerCompaction
    OnlyCurrentOwnerPublishes
    ManifestReferencesExistingFiles
    NoPrematureReclaim
    RecoverySafeTerminalRelation

PROPERTIES
    TraceMatched
