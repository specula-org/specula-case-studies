[package]
name = "kanal-repro"
version = "0.1.0"
edition = "2021"

[dependencies]
kanal = { path = "../artifact/kanal", features = ["async"] }
tokio = { version = "1", features = ["rt-multi-thread", "test-util", "macros", "time"] }

[features]
repro-f1-1 = ["kanal/repro-f1-1"]

[[bin]]
name = "test_k1_capacity_overflow"
path = "src/bin/test_k1_capacity_overflow.rs"

[[bin]]
name = "test_f2_2_send_many_data_loss"
path = "src/bin/test_f2_2_send_many_data_loss.rs"

[[bin]]
name = "test_f1_1_starvation_race"
path = "src/bin/test_f1_1_starvation_race.rs"
