\* ===================================================================================
\* Hunting Config: Family 2 — Future Cancellation on Rendezvous Channel
\* Target: NoDataLoss (rendezvous data loss on ReceiveFuture drop)
\* Strategy: Capacity=0, maximize future drops
\* ===================================================================================

SPECIFICATION MCSpec

CONSTANTS
    t1 = t1
    t2 = t2
    t3 = t3
    Thread = {t1, t2, t3}
    d1 = d1
    d2 = d2
    Data = {d1, d2}
    Capacity = 0
    NilData = NilData

\* Tight bounds: max future drops on rendezvous
CONSTANTS
    MaxSendLimit = 3
    MaxRecvLimit = 3
    MaxTimeoutLimit = 0
    MaxPreemptLimit = 0
    MaxDropFuture = 3
    MaxCloneLimit = 0
    MaxDropLimit = 0
    MaxCloseLimit = 0

SYMMETRY ModelSymmetry

CONSTRAINT StateConstraint

\* Target invariants
INVARIANTS
    NoDataLoss
    NoDataRace
    SignalSingleUse
