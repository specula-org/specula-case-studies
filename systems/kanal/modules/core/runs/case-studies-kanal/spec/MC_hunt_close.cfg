SPECIFICATION MCSpec

CONSTANTS
    t1 = t1
    t2 = t2
    t3 = t3
    Thread = {t1, t2, t3}
    d1 = d1
    d2 = d2
    Data = {d1, d2}
    Capacity = 1
    NilData = NilData

\* Tight bounds: max close/drop, moderate send/recv
CONSTANTS
    MaxSendLimit = 2
    MaxRecvLimit = 2
    MaxTimeoutLimit = 0
    MaxPreemptLimit = 0
    MaxDropFuture = 0
    MaxCloneLimit = 2
    MaxDropLimit = 3
    MaxCloseLimit = 1

SYMMETRY ModelSymmetry

CONSTRAINT StateConstraint

\* Target invariants + core safety
INVARIANTS
    NoDoubleFree
    NoHangingSignals
    CloseTerminatesAll
    HalfCloseDetection
    RefCountConsistency
