\* Hunting config for Bug Family 1: Log Truncation and Entry Integrity
\* Target: crash between truncateSuffix and append corrupts log
\* MC-1: Crash between truncate+append in handleAppendEntries
\* MC-8: Leader entries in memory but not persisted; crash loses committed entries

SPECIFICATION MCSpec

CONSTANTS
    Server = {s1, s2, s3}
    Follower = Follower
    Candidate = Candidate
    Leader = Leader
    Nil = Nil
    ValueEntry = ValueEntry
    ConfigEntry = ConfigEntry
    NoopEntry = NoopEntry
    ConfigBlank = ConfigBlank
    ConfigStable = ConfigStable
    ConfigStaging = ConfigStaging
    ConfigTransitional = ConfigTransitional
    RequestVoteRequest = RequestVoteRequest
    RequestVoteResponse = RequestVoteResponse
    AppendEntriesRequest = AppendEntriesRequest
    AppendEntriesResponse = AppendEntriesResponse
    InstallSnapshotRequest = InstallSnapshotRequest
    InstallSnapshotResponse = InstallSnapshotResponse

    \* Tight bounds: maximize crashes, minimize irrelevant actions
    MaxTimeoutLimit = 3
    RequestLimit = 2
    CrashLimit = 3
    LoseLimit = 1
    HeartbeatLimit = 4
    ConfigChangeLimit = 0
    SnapshotLimit = 0
    StepDownCheckLimit = 0
    MaxMsgBufferLimit = 8

CONSTRAINT MsgBufferConstraint
SYMMETRY ModelSymmetry
VIEW MCView
CHECK_DEADLOCK FALSE

\* Core safety
INVARIANT ElectionSafety
INVARIANT LogMatching
INVARIANT LeaderCompleteness

\* Target invariants
INVARIANT CommitSafety
INVARIANT PersistenceConsistency
