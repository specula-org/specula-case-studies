\* MC configuration for logcabin Raft spec — convergence testing.
\* Standard safety + structural invariants. Bug-family invariants commented out.

SPECIFICATION MCSpec

CONSTANTS
    Server = {s1, s2, s3}
    Follower = Follower
    Candidate = Candidate
    Leader = Leader
    Nil = Nil
    ValueEntry = ValueEntry
    ConfigEntry = ConfigEntry
    NoopEntry = NoopEntry
    ConfigBlank = ConfigBlank
    ConfigStable = ConfigStable
    ConfigStaging = ConfigStaging
    ConfigTransitional = ConfigTransitional
    RequestVoteRequest = RequestVoteRequest
    RequestVoteResponse = RequestVoteResponse
    AppendEntriesRequest = AppendEntriesRequest
    AppendEntriesResponse = AppendEntriesResponse
    InstallSnapshotRequest = InstallSnapshotRequest
    InstallSnapshotResponse = InstallSnapshotResponse

    \* Counter limits for convergence
    MaxTimeoutLimit = 4
    RequestLimit = 3
    CrashLimit = 2
    LoseLimit = 3
    HeartbeatLimit = 6
    ConfigChangeLimit = 0
    SnapshotLimit = 2
    StepDownCheckLimit = 3
    MaxMsgBufferLimit = 10

CONSTRAINT MsgBufferConstraint

SYMMETRY ModelSymmetry

VIEW MCView

\* Disable deadlock checking (Raft has no natural termination)
CHECK_DEADLOCK FALSE

\* --- Standard safety invariants ---
INVARIANT ElectionSafety
INVARIANT LogMatching
INVARIANT LeaderCompleteness

\* --- Structural invariants ---
INVARIANT MCCommitIndexBound
INVARIANT MCCandidateVotedForSelf
INVARIANT MCLeaderTermPositive
INVARIANT MCLogStartValid
INVARIANT MCSnapshotBeforeLog
INVARIANT MCConfigStateValid
INVARIANT PersistenceConsistency

\* --- Bug-family extension invariants (enable during hunting) ---
\* INVARIANT CommitSafety
\* INVARIANT SnapshotLogContinuity
\* INVARIANT ConfigSafety
\* INVARIANT JointQuorumAgreement
\* INVARIANT StepDownCorrectness

\* --- Temporal properties ---
PROPERTY MonotonicTerm
