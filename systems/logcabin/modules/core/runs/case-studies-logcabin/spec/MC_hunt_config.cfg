\* Hunting config for Bug Family 3: Configuration Change Safety
\* Target: joint consensus + election interaction
\* MC-4: TRANSITIONAL config + election: can server win with only one-set quorum?
\* MC-5: Leader self-exclusion bumps term, cascading step-down
\* MC-6: Removed server with stale config starts election despite withholdVotesUntil

SPECIFICATION MCSpecWithConfigChange

CONSTANTS
    Server = {s1, s2, s3}
    Follower = Follower
    Candidate = Candidate
    Leader = Leader
    Nil = Nil
    ValueEntry = ValueEntry
    ConfigEntry = ConfigEntry
    NoopEntry = NoopEntry
    ConfigBlank = ConfigBlank
    ConfigStable = ConfigStable
    ConfigStaging = ConfigStaging
    ConfigTransitional = ConfigTransitional
    RequestVoteRequest = RequestVoteRequest
    RequestVoteResponse = RequestVoteResponse
    AppendEntriesRequest = AppendEntriesRequest
    AppendEntriesResponse = AppendEntriesResponse
    InstallSnapshotRequest = InstallSnapshotRequest
    InstallSnapshotResponse = InstallSnapshotResponse

    \* Tight bounds: enable config changes, minimize irrelevant
    MaxTimeoutLimit = 4
    RequestLimit = 1
    CrashLimit = 1
    LoseLimit = 2
    HeartbeatLimit = 4
    ConfigChangeLimit = 2
    SnapshotLimit = 0
    StepDownCheckLimit = 2
    MaxMsgBufferLimit = 10

CONSTRAINT MsgBufferConstraint
SYMMETRY ModelSymmetry
VIEW MCView
CHECK_DEADLOCK FALSE

\* Core safety
INVARIANT ElectionSafety
INVARIANT LogMatching
INVARIANT LeaderCompleteness

\* Target invariants
INVARIANT ConfigSafety
INVARIANT JointQuorumAgreement
