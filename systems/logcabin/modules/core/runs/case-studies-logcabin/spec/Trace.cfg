\* Trace validation configuration for logcabin Raft spec.
\* Run with: java -jar tla2tools.jar -config Trace.cfg -DJSON=../traces/<trace>.ndjson Trace.tla

SPECIFICATION TraceSpec

VIEW TraceView

\* CHECK_DEADLOCK is intentionally omitted (defaults to TRUE).
\* Deadlock = all trace events consumed = success.

CONSTANTS
    Server = {"s1", "s2", "s3"}
    Follower = "follower"
    Candidate = "candidate"
    Leader = "leader"
    Nil = "nil"
    ValueEntry = "value"
    ConfigEntry = "config"
    NoopEntry = "noop"
    ConfigBlank = "blank"
    ConfigStable = "stable"
    ConfigStaging = "staging"
    ConfigTransitional = "transitional"
    RequestVoteRequest = "RequestVoteRequest"
    RequestVoteResponse = "RequestVoteResponse"
    AppendEntriesRequest = "AppendEntriesRequest"
    AppendEntriesResponse = "AppendEntriesResponse"
    InstallSnapshotRequest = "InstallSnapshotRequest"
    InstallSnapshotResponse = "InstallSnapshotResponse"

\* PROPERTY TraceMatched  \* Using deadlock-based checking instead

ALIAS TraceAlias

\* Core safety invariants — verified during trace replay
INVARIANT ElectionSafety
INVARIANT LogMatching
