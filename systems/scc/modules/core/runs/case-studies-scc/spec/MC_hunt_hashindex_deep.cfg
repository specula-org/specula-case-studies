\* MC_hunt_hashindex_deep.cfg — Deep simulation with 3 threads, 2 resizes
\* Uses simulation mode (random walks) for coverage beyond BFS

CONSTANTS
    Thread = {t1, t2, t3}
    Key = {k1, k2}
    MaxArrays = 4
    NullArray = 0
    MaxResizes = 2
    MaxEpochAdvances = 4
    MaxRemoves = 2
    MaxOOMFaults = 0

SYMMETRY Symmetry

INIT Init
NEXT Next

INVARIANTS
    CurrentArrayLive
    EntryReachability
    NoEntryInReclaimed
    EBRSafety
    LockFreeReadCompleteness
    NoRemovedVisible
    OOMSafety
