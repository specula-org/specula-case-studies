\* MC_hunt_F3.cfg — Incremental Resize Protocol Correctness
\* Bug Family 3: entries lost or duplicated during resize
\* Targets: MC-1 (try_lock failure), MC-2 (dedup correctness), MC-4 (concurrent rehash)


CONSTANTS
    Thread = {t1, t2, t3}
    Key = {k1, k2}
    Bucket = {1, 2}
    MaxArrays = 3
    NullArray = 0
    NullKey = 0
    MaxResizes = 1
    MaxEpochAdvances = 0
    MaxBuggyActions = 0
    MaxAsyncOps = 0

SYMMETRY MCSymmetry

INIT MCInit
NEXT MCNextNoBugs

\* Target invariant
INVARIANTS
    EntryReachability
    NoLostEntryDuringResize
    EntryUniqueness
    F3_BugDetector

\* Core safety (always)
INVARIANTS
    CurrentArrayExists
    NoCircularChain
