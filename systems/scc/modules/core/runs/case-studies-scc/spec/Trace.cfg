\* Trace.cfg — Trace validation config
\* Run with: java -jar tla2tools.jar -config Trace.cfg Trace.tla
\* Override trace file: -DJSON=../traces/my_trace.ndjson

\* Use INIT/NEXT with TraceDone self-loop at end of trace.
\* TraceDone prevents deadlock when trace is fully consumed.
\* If trace gets stuck early, TLC reports deadlock = trace mismatch.
INIT TraceInit
NEXT TraceNextOrDone

CONSTANTS
    Thread = {t1, t2, t3}
    Key = {"k1", "k2"}
    Bucket = {1, 2}
    MaxArrays = 4
    NullArray = 0
    NullKey = 0

\* Safety invariants during replay
INVARIANTS
    TraceEntryReachability
    TraceEpochSafety
    CurrentArrayExists
    NoCircularChain
