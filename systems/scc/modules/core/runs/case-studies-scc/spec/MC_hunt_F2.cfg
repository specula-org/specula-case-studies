SYMMETRY MCSymmetry

INIT MCInit
NEXT MCNextF2

\* Target invariant
INVARIANTS
    AsyncRefValidity
    F2_BugDetector
    NoAccessToReclaimed

\* Core safety (always)
INVARIANTS
    EntryReachability
    CurrentArrayExists
