\* MC_hunt_hashindex_oom.cfg — OOM fault injection during migration
\* Tests: Can OOM during extract_from cause entry loss?

CONSTANTS
    Thread = {t1, t2}
    Key = {k1, k2}
    MaxArrays = 3
    NullArray = 0
    MaxResizes = 1
    MaxEpochAdvances = 3
    MaxRemoves = 1
    MaxOOMFaults = 1

SYMMETRY Symmetry

INIT Init
NEXT Next

INVARIANTS
    CurrentArrayLive
    EntryReachability
    NoEntryInReclaimed
    LockFreeReadCompleteness
    NoRemovedVisible
    OOMSafety
