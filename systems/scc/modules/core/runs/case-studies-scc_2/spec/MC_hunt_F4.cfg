\* Hunting config: Family 4 — EBR reclamation timing under per-entry
\* tombstone. Adversary: AdvanceGlobalEpoch races a pinned-guard reader.
\* Look for a reader/iter whose cachedArray transitions to "freed".

SPECIFICATION MCSpec

CONSTANTS
    Thread = {t1, t2}
    Key = {k1}
    Value = {v1}
    BucketCount = 2
    MaxArrays = 3
    MaxEpoch = 4
    MaxResize = 1
    MaxLegacyClear = 0
    MaxSkipCheckRef = 0
    MaxEpochAdvance = 3

CONSTRAINT StateConstraint

SYMMETRY Symmetry
VIEW McView

INVARIANTS
    MCTypeOK
    MCAtMostOneLive
    MCNoUseAfterFree
