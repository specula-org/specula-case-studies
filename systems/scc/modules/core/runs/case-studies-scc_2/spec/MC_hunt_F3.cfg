\* Hunting config: Family 3 — Async reference invalidation across `.await`.
\* writer_async / optional_writer_async / reader_async DO NOT call check_ref
\* (hash_table.rs:335, 418, 263). The bucket-lock pin is supposed to be
\* sufficient. We force a check_ref skip + concurrent resize and look for
\* a writer holding a lock on a now-orphaned (currentArray-unreachable)
\* bucket.

SPECIFICATION MCSpec

CONSTANTS
    Thread = {t1, t2, t3}
    Key = {k1}
    Value = {v1}
    BucketCount = 2
    MaxArrays = 3
    MaxEpoch = 2
    MaxResize = 1
    MaxLegacyClear = 0
    MaxSkipCheckRef = 2
    MaxEpochAdvance = 0

CONSTRAINT StateConstraint

SYMMETRY Symmetry
VIEW McView

INVARIANTS
    MCTypeOK
    MCAtMostOneLive
    MCAtMostOneLinked
    MCNoOrphanedLockedBucket
