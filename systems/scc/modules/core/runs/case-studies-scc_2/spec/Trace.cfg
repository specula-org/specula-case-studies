SPECIFICATION TraceSpec

CONSTANTS
    Thread = {"t1", "t2"}
    Key = {"k1", "k2"}
    Value = {"v1"}
    BucketCount = 2
    MaxArrays = 3
    MaxEpoch = 4

\* ========================================================================
\* Safety / structural invariants — should hold on every real execution
\* ========================================================================
INVARIANTS
    TypeOK
    AtMostOneLive
    AtMostOneLinked
    CurrentLive
    LinkedConsistent
    NoOrphanedLockedBucket
    NoUseAfterFree
    NoLeakedBucketLock
    InsertedConsistency

\* ========================================================================
\* Trace must be fully consumed
\* ========================================================================
PROPERTIES TraceMatched
