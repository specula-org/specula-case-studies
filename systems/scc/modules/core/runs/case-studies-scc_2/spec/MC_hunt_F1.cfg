\* Hunting config: Family 1 — Iterator/scan + concurrent insert/remove/resize.
\* Adversarial caller: Iter + Insert + Remove + Resize interleaving.
\* Goal: catch a still-live key being skipped by a completed iter.

SPECIFICATION MCSpec

CONSTANTS
    Thread = {t1, t2, t3}
    Key = {k1}
    Value = {v1}
    BucketCount = 2
    MaxArrays = 3
    MaxEpoch = 2
    MaxResize = 1
    MaxLegacyClear = 0
    MaxSkipCheckRef = 0
    MaxEpochAdvance = 0

CONSTRAINT StateConstraint

SYMMETRY Symmetry
VIEW McView

INVARIANTS
    MCTypeOK
    MCAtMostOneLive
    MCAtMostOneLinked
    MCCurrentLive
    MCNoLiveKeyMissedByCompletedIter
