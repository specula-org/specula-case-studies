\* Hunting config: Family 2 — Per-entry migration window (publish-new vs
\* clear-old). With MaxLegacyClear=1 we enable the pre-9573fa1 Relaxed
\* clear-old ordering. Expected: a lock-free reader/iterator transiently
\* observes the entry in NEITHER array.

