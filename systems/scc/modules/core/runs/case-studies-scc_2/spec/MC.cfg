SPECIFICATION MCSpec

CONSTANTS
    Thread = {t1, t2}
    Key = {k1, k2}
    Value = {v1}
    BucketCount = 2
    MaxArrays = 3
    MaxEpoch = 3
    MaxResize = 1
    MaxLegacyClear = 0
    MaxSkipCheckRef = 1
    MaxEpochAdvance = 2

CONSTRAINT StateConstraint

SYMMETRY Symmetry
VIEW McView

\* ========================================================================
\* Standard / structural invariants (always on)
\* ========================================================================
INVARIANTS
    MCTypeOK
    MCAtMostOneLive
    MCAtMostOneLinked
    MCCurrentLive
    MCLinkedConsistent
    MCNoOrphanedLockedBucket
    MCNoUseAfterFree
    MCNoLeakedBucketLock
    MCInsertedConsistency

\* ========================================================================
\* Bug-family invariants (commented out for convergence; enabled in
\* MC_hunt_<family>.cfg for bug hunting after spec converges)
\* ========================================================================
\* INVARIANT MCNoLiveKeyMissedByCompletedIter   \* Family 1
\* INVARIANT MCMigrationVisibleEverywhere       \* Family 2
\* INVARIANT MCNoDuplicatePublication           \* Family 2 sanity
