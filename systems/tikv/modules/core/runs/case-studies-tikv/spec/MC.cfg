SPECIFICATION MCSpec

CONSTANTS
    s1 = s1
    s2 = s2
    s3 = s3
    Server = {s1, s2, s3}

    Follower = Follower
    Candidate = Candidate
    PreCandidate = PreCandidate
    Leader = Leader

    Nil = Nil

    ValueEntry = ValueEntry
    ConfigEntry = ConfigEntry
    NoopEntry = NoopEntry

    RequestVoteRequest = RequestVoteRequest
    RequestVoteResponse = RequestVoteResponse
    RequestPreVoteRequest = RequestPreVoteRequest
    RequestPreVoteResponse = RequestPreVoteResponse
    AppendEntriesRequest = AppendEntriesRequest
    AppendEntriesResponse = AppendEntriesResponse
    HeartbeatRequest = HeartbeatRequest
    HeartbeatResponse = HeartbeatResponse
    TimeoutNowRequest = TimeoutNowRequest
    InstallSnapshotRequest = InstallSnapshotRequest
    InstallSnapshotResponse = InstallSnapshotResponse

    \* Counter-bound constants (convergence configuration)
    MaxTermLimit       = 4
    MaxTimeoutLimit    = 5
    RequestLimit       = 3
    CrashLimit         = 2
    LoseLimit          = 3
    HeartbeatLimit     = 6
    TransferLimit      = 2
    ReadLimit          = 3
    ConfChangeLimit    = 0
    CheckQuorumLimit   = 3
    MaxMsgBufferLimit  = 12

    \* Action overrides (inject counter bounds)
    Timeout           <- MCTimeout
    ClientRequest     <- MCClientRequest
    SendHeartbeat     <- MCSendHeartbeat
    CheckQuorum       <- MCCheckQuorum
    TransferLeadership <- MCTransferLeadership
    ProposeReadIndex  <- MCProposeReadIndex
    ProposeConfChange <- MCProposeConfChange
    Crash             <- MCCrash
    LoseMessage       <- MCLoseMessage

SYMMETRY ModelSymmetry

VIEW ModelView

CHECK_DEADLOCK FALSE

CONSTRAINT MsgBufferConstraint

\* ===== STANDARD SAFETY INVARIANTS =====
INVARIANTS
    ElectionSafety
    LogMatching
    LeaderCompleteness

\* ===== STRUCTURAL INVARIANTS =====
    CommitIndexBoundInv
    PersistedBoundInv
    SinglePendingConfInv
    VotedForConsistencyInv

\* ===== EXTENSION INVARIANTS (enable for bug hunting) =====
\* LeaseLinearizability
\* NoStaleReadAfterTransfer
\* AsyncPersistSafety
\* CrashRecoverySafety
\* CommitByVoteSafety
\* PreVoteSafety
\* ConfChangeSafety
