\* Standard MC config for goraft/raft
\* Used during spec convergence. Extension (bug-family) invariants are commented out.

CONSTANTS
    \* 3 servers is sufficient for most Raft bugs
    Server = {s1, s2, s3}

    Nil = Nil

    Follower = Follower
    Candidate = Candidate
    Leader = Leader
    Snapshotting = Snapshotting

    ValueEntry = ValueEntry
    NOPEntry = NOPEntry

    RequestVoteRequest = RequestVoteRequest
    RequestVoteResponse = RequestVoteResponse
    AppendEntriesRequest = AppendEntriesRequest
    AppendEntriesResponse = AppendEntriesResponse
    SnapshotRequest = SnapshotRequest
    SnapshotRecoveryRequest = SnapshotRecoveryRequest

    \* Counter bounds
    MaxTimeoutLimit = 4
    MaxRequestLimit = 3
    MaxCrashLimit = 0
    MaxLoseLimit = 0
    MaxHeartbeatLimit = 0
    MaxSnapshotLimit = 0
    MaxMsgBufferLimit = 10

SPECIFICATION MCSpec

SYMMETRY MCSymmetry

VIEW MCView

\* --- Standard + structural invariants (checked during convergence) ---
INVARIANTS
    MCTypeOK
    MCElectionSafety
    MCLogMatching
    MCCommitIndexBound
    MCCounterBound

\* --- Extension invariants (bug-family specific, commented out for convergence) ---
\* INVARIANT LeaderCompleteness
\* INVARIANT CommitTermSafety
