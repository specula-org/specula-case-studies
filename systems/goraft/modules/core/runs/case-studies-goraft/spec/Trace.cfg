\* Trace validation config for goraft/raft
\* Run with: java -jar tla2tools.jar -config Trace.cfg Trace.tla
\* Override trace file: java -DJSON=../traces/my_trace.ndjson -jar ...

CONSTANTS
    Nil = Nil
    Follower = Follower
    Candidate = Candidate
    Leader = Leader
    Snapshotting = Snapshotting
    ValueEntry = ValueEntry
    NOPEntry = NOPEntry
    RequestVoteRequest = RequestVoteRequest
    RequestVoteResponse = RequestVoteResponse
    AppendEntriesRequest = AppendEntriesRequest
    AppendEntriesResponse = AppendEntriesResponse
    SnapshotRequest = SnapshotRequest
    SnapshotRecoveryRequest = SnapshotRecoveryRequest

\* Server set is derived from trace (TraceServer operator)
    Server <- TraceServer

INIT TraceInit
NEXT TraceNext

\* Use deadlock-based trace completion checking:
\* Deadlock at l = Len(TraceLog) + 1 means trace was fully matched.
\* Deadlock at l < Len(TraceLog) + 1 means spec/trace mismatch.

\* Alternatively, check temporal property:
\* PROPERTY TraceMatched
