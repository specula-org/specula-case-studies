SPECIFICATION MCSpec

CONSTANTS
    Threads = {t1, t2}
    MaxAttempts = 1
    MaxOffset = 3
    VectorLength = 2
    InitialFileSize = 4
    EnableReferenceInterruptible = FALSE

    ReadStartLimit = 1
    WriteStartLimit = 1
    PreadStartLimit = 0
    PwriteStartLimit = 0
    ReadvStartLimit = 1
    WritevStartLimit = 1
    ReadFaultZeroLimit = 0
    ReadFaultPositiveLimit = 1
    WriteFaultZeroLimit = 0
    WriteFaultPositiveLimit = 1
    DirectFaultZeroLimit = 0
    DirectFaultPositiveLimit = 0
    InterruptLimit = 0

SYMMETRY ThreadSymmetry
VIEW MCView
CONSTRAINT StateConstraint

INVARIANTS
    MCTypeOK
    MCProgressBounded
    \* This target is completion-gated on a vector call. Scalar positive-copy
    \* accounting is hunted separately in Scenario 1 and cannot preempt MC1.
    MCVectorCallLinearizable

CHECK_DEADLOCK FALSE
