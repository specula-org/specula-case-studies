SPECIFICATION MCSpec
CONSTANTS
  Backend = "exfat"
  Threads = {t0, t1}
  P = 2
  G = 2
  MaxByte = 6
  InitialSize = 2
  InitialWarm = {0}
  InitialPosition = 0
  ReadLimit = 1
  WriteLimit = 0
  ResizeLimit = 0
  FaultLimit = 1
  Serialize = TRUE
  ReadAfterMutations = FALSE
  Workload <- FailedReadWorkload
SYMMETRY ThreadSymmetry
VIEW MCView
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK LockExclusion ControlledOffsetAccounting SuccessfulTransferAccounting
