SPECIFICATION MCSpec
CONSTANTS
    WaitIds = {1, 2, 3, 4}
    CallIds = {1, 2, 3, 4}
    Controllers = {p, q}
    Keys = {"A", "B", "C"}
    Buckets = {1, 2}
    BucketOf <- DefaultBucketMap
    InitialWords <- DefaultWords
    Values = {0, 1}
    Quotas = {0, 1, 2}
    Durations <- DefaultDurations
    Mode = "quota"
    TargetKey = "B"
    WakeArgs = {0}
    MoveArgs = {0, 1}
    WaitBound = 2
    CallBound = 1
    FaultBound = 0
    StoreBound = 0
    TimedBound = 0

INVARIANTS FailureAtomicity ExactlyOnceCompletion ObjectIdentityStability WakeQuota RequeueWakeQuota
SYMMETRY Symmetry
VIEW MCView
CONSTRAINT FiniteCapacity
CHECK_DEADLOCK FALSE
