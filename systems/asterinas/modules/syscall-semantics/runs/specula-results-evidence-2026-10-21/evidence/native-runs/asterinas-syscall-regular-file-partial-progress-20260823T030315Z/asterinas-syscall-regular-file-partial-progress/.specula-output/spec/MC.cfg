SPECIFICATION MCSpec

CONSTANTS
    Threads = {t1, t2}
    MaxAttempts = 2
    MaxOffset = 4
    VectorLength = 2
    InitialFileSize = 2
    EnableReferenceInterruptible = FALSE

    ReadStartLimit = 1
    WriteStartLimit = 1
    PreadStartLimit = 1
    PwriteStartLimit = 1
    ReadvStartLimit = 1
    WritevStartLimit = 1
    ReadFaultZeroLimit = 1
    ReadFaultPositiveLimit = 1
    WriteFaultZeroLimit = 1
    WriteFaultPositiveLimit = 1
    DirectFaultZeroLimit = 1
    DirectFaultPositiveLimit = 1
    InterruptLimit = 0

VIEW MCView
CONSTRAINT StateConstraint

\* Standard safety and structural invariants used for model convergence.
INVARIANTS
    MCTypeOK
    MCStructuralOK
    MCProgressBounded
    MCBioLifecycle

PROPERTIES
    MCNoPermanentLocks

\* Scenario-specific extension invariants are enabled only in hunt cfgs.
\* INVARIANT MCReportedCoversVisibleCopy
\* INVARIANT MCReportedCoversCommittedWrite
\* INVARIANT MCMixedPageRetainedPrefixReported
\* INVARIANT MCSharedOffsetMatchesReported
\* INVARIANT MCFileSizeMatchesProgress
\* INVARIANT MCVectorCallLinearizable
\* INVARIANT MCLaterIovecFaultLinearizable
\* INVARIANT MCAppendFailureVectorLinearizable
\* INVARIANT MCPositionalOffsetStable
\* INVARIANT MCNoUnaccountedPendingEffect
\* INVARIANT MCRestartRequiresZeroProgress
\* INVARIANT MCNoEffectReplay

CHECK_DEADLOCK FALSE
