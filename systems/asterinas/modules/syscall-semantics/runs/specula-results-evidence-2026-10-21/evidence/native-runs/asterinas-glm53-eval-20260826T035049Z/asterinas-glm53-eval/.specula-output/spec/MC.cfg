SPECIFICATION MCSpec
CHECK_DEADLOCK FALSE

CONSTANTS
    Thread = {t1, t2}
    EnabledKinds = {"Read", "Write", "Pread64", "Pwrite64", "Readv", "Writev"}
    EnabledAdapters = {"Correct", "RamFs", "Exfat"}
    ExplicitOffsets = {0, 6}
    InitialSharedOffset = 0
    InitialFileSize = 6
    InitialCacheCapacity = 8
    AllowSignals = TRUE
    BeginLimit = 2
    CopyFaultLimit = 1
    RestartLimit = 1
    HistoryLimit = 8
    PositionLimit = 16
    AllowedFaultIovs = {1, 2}
    AllowedFaultProgress = {"Zero", "Prefix"}

SYMMETRY Symmetry
VIEW MCView
CONSTRAINT MCStateConstraint

\* Core safety and structural invariants used while converging the model.
INVARIANTS
    MCTypeOK
    MCOffsetOwnerWellFormed
    MCProgressWithinRequest
    MCCacheCoversFile
    MCCommitLogWellFormed

\* Scenario invariants are intentionally disabled here and enabled in the
\* corresponding MC_hunt_*.cfg files.
\* INVARIANT MCReadReturnCoversCopies
\* INVARIANT MCWriteReturnCoversCommit
\* INVARIANT MCNoReadPastEOF
\* INVARIANT MCNoNominalEOFOnFault
\* INVARIANT MCSharedOffsetTracksReport
\* INVARIANT MCVectorSingleLinearization
\* INVARIANT MCPositionalOffsetIsolation
\* INVARIANT MCRestartNoReplay

\* No liveness property is enabled: the brief asks only safety questions and
\* MCSpec deliberately has no scheduler fairness assumption.
\* PROPERTY MCEventuallyQuiescent
