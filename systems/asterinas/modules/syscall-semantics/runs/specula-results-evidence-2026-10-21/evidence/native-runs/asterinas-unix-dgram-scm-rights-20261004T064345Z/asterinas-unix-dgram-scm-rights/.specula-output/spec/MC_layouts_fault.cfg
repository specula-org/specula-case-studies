\* Convergence checks retain all fault paths. Scenario properties are disabled here.
SPECIFICATION MCSpec
CONSTANTS
    Threads = {r1, r2}
    AttemptSlots = 2
    RightsCount = 4
    ObjectA = fileA
    ObjectB = fileB
    SharedTable = TRUE
    SetupFDCount = 5
    MaxFD = 22
    PayloadSize = 1
    AllowedLayouts = {"FirstFault", "LaterFault", "PartialFault", "HeaderFault", "HeaderPartial"}
    SendFaultLimit = 1
    PayloadFaultLimit = 1
    OutputFaultLimit = 1
    PeekLimit = 2
    RecvLimit = 2
    ReuseLimit = 1
SYMMETRY Symmetry
VIEW MCView
CONSTRAINT MessageBufferConstraint
INVARIANTS
    MCTypeOK
    OwnershipConserved
    QueueStructure
    PublicationStructure

\* Scenario invariants are enabled in their named hunt cfgs.
\* INVARIANT CapturedObjectIdentity
\* INVARIANT OrdinaryConsumeAtMostOnce
\* INVARIANT PeekPreservesQueueRights
\* INVARIANT DeliveredPrefixSurvives
\* INVARIANT OperationOwnersDrained
\* INVARIANT NoFailedNumberInstalled
\* INVARIANT ReportedPrefixMatchesLinux
\* INVARIANT PayloadFaultConsumptionMatchesLinux
\* PROPERTY BoundedCleanupProgress  (MC_cleanup.cfg uses fairness.)
CHECK_DEADLOCK FALSE
