\* One-field negative Trace: wrong in-domain FD->OFD capture audit.
SPECIFICATION TraceSpec
CONSTANTS
    Threads = {"t1", "t2"}
    FDs = {"fd0", "fd1", "fd2"}
    OFDs = {"timer", "signal", "event"}
    Epolls = {"ep0", "ep1"}
    FD0 = "fd0"
    FD1 = "fd1"
    FD2 = "fd2"
    TimerOFD = "timer"
    SignalOFD = "signal"
    EventOFD = "event"
    NoThread = "no_thread"
    NoFD = "no_fd"
    NoOFD = "no_ofd"
    NoEpoll = "no_epoll"
    NoKey = NoKey
    MaxTimerTicks = 64
    MaxEventCounter = 64
    TraceFile = "../traces/remediation-poll-snapshot-field-negative.json"
INVARIANTS
    TypeOK
    NoPhantomLiveOFD
    PollSnapshotOwnershipStable
    PollSnapshotReleasedOnTerminal
PROPERTIES
    TraceMatched
    OFDsNeverResurrect
CHECK_DEADLOCK FALSE
