\* Lifetime oracle: captured epoll_ctl Arcs and exec/close completion cannot
\* leave a phantom-live OFD or resurrect a retired allocation identity.
SPECIFICATION MCSpec
CONSTANTS
    Threads = {t1, t2}
    FDs = {"fd0", "fd1", "fd2"}
    OFDs = {"timer", "signal", "event"}
    Epolls = {"ep0", "ep1"}
    FD0 = "fd0"
    FD1 = "fd1"
    FD2 = "fd2"
    TimerOFD = "timer"
    SignalOFD = "signal"
    EventOFD = "event"
    NoThread = NoThread
    NoFD = "no_fd"
    NoOFD = "no_ofd"
    NoEpoll = "no_epoll"
    NoKey = NoKey
    MaxTimerTicks = 1
    MaxEventCounter = 1
    FdActionLimit = 1
    EpollCtlLimit = 2
    CopyFaultLimit = 0
    PollLimit = 0
    SourceLimit = 0
    SignalLimit = 0
    WaitStartLimit = 0
    TimeoutLimit = 0
    InterruptLimit = 0
    ExecLimit = 0
    TopologyLimit = 0
    MaxInterestLimit = 1
    EnabledActions = {"SysCloseRemove", "ClosedFileDrop",
                      "EpollControlCaptureTarget", "EntryUpdatePoll",
                      "EpollAddInterest", "EpollControlPushReady",
                      "EpollDelInterest", "EpollControlError"}
    ActionFDs = {"fd0"}
    ActionOFDs = {"timer"}
    ActionEpolls = {"ep0"}
    ActionTriggerModes = {"LT"}
VIEW MCView
CONSTRAINT MCStateConstraint
INVARIANTS
    MCTypeOK
    MCNoPhantomLiveOFD
    MCNoDeadOFDReference
PROPERTIES
    MCOFDsNeverResurrect
CHECK_DEADLOCK FALSE
