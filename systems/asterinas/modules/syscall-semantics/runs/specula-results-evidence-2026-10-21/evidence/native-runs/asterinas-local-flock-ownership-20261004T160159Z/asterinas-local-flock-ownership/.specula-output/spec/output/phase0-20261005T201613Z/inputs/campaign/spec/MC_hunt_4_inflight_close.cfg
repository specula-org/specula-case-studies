SPECIFICATION FairMCSpec
CONSTANTS
    Threads = {t1, t2, t3}
    OFDs = {a, b, c}
    FDs = {1, 2, 3, 4}
    Tokens = {1, 2, 3, 4, 5, 6, 7, 8}
    SharedTable = TRUE
    T1 = t1
    T2 = t2
    T3 = t3
    A = a
    Bof = b
    C = c
    Fixture = "c10"
    MaxOpen = 3
    MaxDup = 0
    MaxClose = 1
    MaxFlock = 4
INVARIANTS
    ControlResults
    CompatibleOwners
    UniqueOwnerItem
    CapturedOwnerStable
    ReferenceAccounting
    NoOrphanedRetry
PROPERTIES
    FinalReleaseCompletes
    FixtureCompletes
CHECK_DEADLOCK FALSE
\* Named fixture roles prohibit symmetry. No reactive action is budgeted.
\* C10 adds C open and EX probe after B returns and finishes its last put.
