\* Scenario 1 oracle: duplicate one OFD, mutate shared status, then mutate one
\* descriptor's CLOEXEC flag without changing its aliased peer.
SPECIFICATION MCSpec
CONSTANTS
    Threads = {t1, t2}
    FDs = {"fd0", "fd1", "fd2"}
    OFDs = {"timer", "signal", "event"}
    Epolls = {"ep0", "ep1"}
    FD0 = "fd0"
    FD1 = "fd1"
    FD2 = "fd2"
    TimerOFD = "timer"
    SignalOFD = "signal"
    EventOFD = "event"
    NoThread = NoThread
    NoFD = "no_fd"
    NoOFD = "no_ofd"
    NoEpoll = "no_epoll"
    NoKey = NoKey
    MaxTimerTicks = 1
    MaxEventCounter = 1
    FdActionLimit = 4
    EpollCtlLimit = 0
    CopyFaultLimit = 0
    PollLimit = 0
    SourceLimit = 0
    SignalLimit = 0
    WaitStartLimit = 0
    TimeoutLimit = 0
    InterruptLimit = 0
    ExecLimit = 0
    TopologyLimit = 0
    MaxInterestLimit = 0
    EnabledActions = {"SysCloseRemove", "ClosedFileDrop",
                      "FileTableDupCeil", "FcntlSetFlCapture",
                      "FcntlSetFlUse", "FcntlSetFd"}
    ActionFDs = {"fd0", "fd1"}
    ActionOFDs = {"timer", "signal"}
    ActionEpolls = {"ep0"}
    ActionTriggerModes = {"LT"}
SYMMETRY Symmetry
VIEW MCView
CONSTRAINT MCStateConstraint
INVARIANTS
    MCTypeOK
    MCFdFlagsPerSlot
CHECK_DEADLOCK FALSE
