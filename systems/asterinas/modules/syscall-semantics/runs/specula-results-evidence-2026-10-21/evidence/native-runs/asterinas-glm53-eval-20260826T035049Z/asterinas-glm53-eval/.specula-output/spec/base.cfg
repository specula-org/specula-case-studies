SPECIFICATION Spec
CHECK_DEADLOCK FALSE

CONSTANTS
    Thread = {t1, t2}
    EnabledKinds = {"Read", "Write", "Pread64", "Pwrite64", "Readv", "Writev"}
    EnabledAdapters = {"Correct", "RamFs", "Exfat"}
    ExplicitOffsets = {0, 6}
    InitialSharedOffset = 0
    InitialFileSize = 6
    InitialCacheCapacity = 8
    AllowSignals = FALSE

CONSTRAINT BaseStateConstraint

INVARIANTS
    TypeOK
    OffsetOwnerWellFormed
    ProgressWithinRequest
    CacheCoversFile
    CommitLogWellFormed

\* Scenario invariants are enabled in MC_hunt_*.cfg after convergence.
\* INVARIANT ReadReturnCoversCopies
\* INVARIANT WriteReturnCoversCommit
\* INVARIANT NoReadPastEOF
\* INVARIANT NoNominalEOFOnFault
\* INVARIANT SharedOffsetTracksReport
\* INVARIANT VectorSingleLinearization
\* INVARIANT PositionalOffsetIsolation
\* INVARIANT RestartNoReplay
