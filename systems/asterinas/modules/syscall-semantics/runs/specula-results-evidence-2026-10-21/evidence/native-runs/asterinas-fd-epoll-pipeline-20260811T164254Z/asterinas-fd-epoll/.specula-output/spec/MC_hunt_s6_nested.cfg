\* Scenario 6 oracle: the bounded outer->inner readiness epoch propagates.
SPECIFICATION MCSpec
CONSTANTS
    Threads = {t1, t2}
    FDs = {"fd0", "fd1", "fd2"}
    OFDs = {"timer", "signal", "event"}
    Epolls = {"ep0", "ep1"}
    FD0 = "fd0"
    FD1 = "fd1"
    FD2 = "fd2"
    TimerOFD = "timer"
    SignalOFD = "signal"
    EventOFD = "event"
    NoThread = NoThread
    NoFD = "no_fd"
    NoOFD = "no_ofd"
    NoEpoll = "no_epoll"
    NoKey = NoKey
    MaxTimerTicks = 2
    MaxEventCounter = 1
    FdActionLimit = 0
    EpollCtlLimit = 1
    CopyFaultLimit = 0
    PollLimit = 0
    SourceLimit = 1
    SignalLimit = 0
    WaitStartLimit = 0
    TimeoutLimit = 0
    InterruptLimit = 0
    ExecLimit = 0
    TopologyLimit = 1
    MaxInterestLimit = 1
    EnabledActions = {"EpollAddNestedInterest",
                      "EpollControlCaptureTarget", "EpollAddInterest",
                      "EntryUpdatePoll", "EpollControlPushReady",
                      "TimerfdExpired", "TimerfdNotify",
                      "ReadySetPushAcquire", "ReadySetPush",
                      "ReadySetPushNotifySubject",
                      "SyncSubjectCallbackReadySet",
                      "ObserverCallbackRelease"}
    ActionFDs = {"fd0"}
    ActionOFDs = {"timer"}
    ActionEpolls = {"ep0", "ep1"}
    ActionTriggerModes = {"LT"}
VIEW MCView
CONSTRAINT MCStateConstraint
INVARIANTS
    MCTypeOK
    MCLockOwnershipConsistent
    MCAcyclicEpollGraph
    MCNestedEpochNeverRegresses
PROPERTIES
    MCNestedReadyEpochPropagates
CHECK_DEADLOCK FALSE
