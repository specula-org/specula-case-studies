SPECIFICATION MCSpec
CONSTANTS
  Backend = "exfat"
  Threads = {t0, t1}
  P = 2
  G = 4
  MaxByte = 8
  InitialSize = 0
  InitialWarm = {}
  InitialPosition = 0
  ReadLimit = 1
  WriteLimit = 0
  ResizeLimit = 1
  FaultLimit = 0
  Serialize = TRUE
  ReadAfterMutations = FALSE
  Workload <- ResizeAndHolesWorkload
SYMMETRY ThreadSymmetry
VIEW MCView
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK LockExclusion SuccessfulResizeContract
