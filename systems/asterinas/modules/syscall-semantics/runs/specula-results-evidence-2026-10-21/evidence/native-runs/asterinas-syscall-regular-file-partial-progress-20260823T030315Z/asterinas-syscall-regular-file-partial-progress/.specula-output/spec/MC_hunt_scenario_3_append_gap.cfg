SPECIFICATION MCSpec

CONSTANTS
    Threads = {t1, t2}
    MaxAttempts = 1
    MaxOffset = 3
    VectorLength = 2
    InitialFileSize = 4
    EnableReferenceInterruptible = FALSE

    \* One vector and one shared append competitor.  A zero-prefix backend
    \* fault leaves the append EOF assignment in f_pos while reporting no
    \* progress; all unrelated operations and fault classes are disabled.
    ReadStartLimit = 0
    WriteStartLimit = 1
    PreadStartLimit = 0
    PwriteStartLimit = 0
    ReadvStartLimit = 1
    WritevStartLimit = 0
    ReadFaultZeroLimit = 0
    ReadFaultPositiveLimit = 0
    WriteFaultZeroLimit = 1
    WriteFaultPositiveLimit = 0
    DirectFaultZeroLimit = 0
    DirectFaultPositiveLimit = 0
    InterruptLimit = 0

SYMMETRY ThreadSymmetry
VIEW MCView
CONSTRAINT StateConstraint

INVARIANTS
    MCTypeOK
    MCProgressBounded
    MCAppendFailureVectorLinearizable

CHECK_DEADLOCK FALSE
