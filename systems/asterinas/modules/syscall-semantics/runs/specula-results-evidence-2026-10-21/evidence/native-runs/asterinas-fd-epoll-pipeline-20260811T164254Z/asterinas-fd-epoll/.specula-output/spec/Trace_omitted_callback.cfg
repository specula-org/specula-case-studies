\* Category B timebox trace-validation configuration.

SPECIFICATION TraceSpec

CONSTANTS
    Threads = {"t1", "t2"}
    FDs = {"fd0", "fd1", "fd2"}
    OFDs = {"timer", "signal", "event"}
    Epolls = {"ep0", "ep1"}
    FD0 = "fd0"
    FD1 = "fd1"
    FD2 = "fd2"
    TimerOFD = "timer"
    SignalOFD = "signal"
    EventOFD = "event"
    NoThread = "no_thread"
    NoFD = "no_fd"
    NoOFD = "no_ofd"
    NoEpoll = "no_epoll"
    NoKey = NoKey
    MaxTimerTicks = 64
    MaxEventCounter = 64
    TraceFile = "../traces/remediation-omitted-callback-negative.json"

INVARIANTS
    TypeOK
    OccupiedSlotsReferToAliveOFDs
    ReadyQueueKeysRemainIdentityTyped
    LockOwnershipConsistent
    ReadyCallbacksHaveProducerCause
    ReadinessWakesHaveProducerCause
    NestedEpochNeverRegresses
    NoPhantomLiveOFD
    NoDeadOFDReference
    EventfdMutexExclusive
    AcyclicEpollGraph
    SlotMapsOneOFD
    CapturedReferenceStable
    ReplacementExactlyOnce
    FdFlagsPerSlot
    ExecClosesExactlySnapshotMarked
    EpollKeyIdentity
    NoCrossReuseDelivery
    NoDeadInterest
    DeliveryCommitOnCopyout
    OneShotDisabledIffDelivered
    CachedReadinessSound
    SignalfdRegistrationHasBinding
    VisibleReadyWinsTerminalRace
    SignalNotifyOrdering
    TerminalScanMatchesLiveSnapshot
    TemporaryMaskRestored

PROPERTIES
    TraceMatched
    OFDsNeverResurrect

CHECK_DEADLOCK FALSE
