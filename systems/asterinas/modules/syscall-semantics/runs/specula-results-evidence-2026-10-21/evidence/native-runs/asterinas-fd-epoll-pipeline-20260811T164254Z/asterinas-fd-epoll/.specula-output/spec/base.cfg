\* Base Asterinas FD/epoll model configuration.

SPECIFICATION Spec

CONSTANTS
    Threads = {"t1", "t2"}
    FDs = {"fd0", "fd1", "fd2"}
    OFDs = {"timer", "signal", "event"}
    Epolls = {"ep0", "ep1"}
    FD0 = "fd0"
    FD1 = "fd1"
    FD2 = "fd2"
    TimerOFD = "timer"
    SignalOFD = "signal"
    EventOFD = "event"
    NoThread = "no_thread"
    NoFD = "no_fd"
    NoOFD = "no_ofd"
    NoEpoll = "no_epoll"
    NoKey = NoKey
    MaxTimerTicks = 2
    MaxEventCounter = 2

INVARIANTS
    TypeOK
    OccupiedSlotsReferToAliveOFDs
    ReadyQueueKeysRemainIdentityTyped
    LockOwnershipConsistent
    ReadyCallbacksHaveProducerCause
    ReadinessWakesHaveProducerCause
    NestedEpochNeverRegresses
    NoPhantomLiveOFD
    NoDeadOFDReference
    EventfdMutexExclusive
    AcyclicEpollGraph
    SlotMapsOneOFD
    SignalNotifyOrdering
    TerminalScanMatchesLiveSnapshot
    TemporaryMaskRestored
    ExecCutoverIsolation
    PollSnapshotOwnershipStable
    PollSnapshotReleasedOnTerminal
    FreshWaitInvocation

PROPERTIES
    OFDsNeverResurrect

CHECK_DEADLOCK FALSE
