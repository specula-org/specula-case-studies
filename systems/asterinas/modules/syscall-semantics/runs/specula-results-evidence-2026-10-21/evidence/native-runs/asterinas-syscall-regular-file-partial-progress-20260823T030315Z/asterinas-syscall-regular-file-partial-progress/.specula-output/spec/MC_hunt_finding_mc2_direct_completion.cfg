SPECIFICATION MCSpec

CONSTANTS
    Threads = {t1, t2}
    MaxAttempts = 1
    MaxOffset = 4
    VectorLength = 2
    InitialFileSize = 2
    EnableReferenceInterruptible = FALSE

    \* One direct-write candidate and one subsequent shared competitor.
    ReadStartLimit = 0
    WriteStartLimit = 1
    PreadStartLimit = 0
    PwriteStartLimit = 1
    ReadvStartLimit = 0
    WritevStartLimit = 0
    ReadFaultZeroLimit = 0
    ReadFaultPositiveLimit = 0
    WriteFaultZeroLimit = 0
    WriteFaultPositiveLimit = 0
    DirectFaultZeroLimit = 1
    DirectFaultPositiveLimit = 1
    InterruptLimit = 0

SYMMETRY ThreadSymmetry
VIEW MCView
CONSTRAINT StateConstraint

INVARIANTS
    MCTypeOK
    MCProgressBounded
    \* Cover both a still-pending BIO at return and a BIO that completed after
    \* the fault but before return, leaving committed progress unreported.
    MCNoUnaccountedPendingEffect
    MCReportedCoversCommittedWrite

CHECK_DEADLOCK FALSE
