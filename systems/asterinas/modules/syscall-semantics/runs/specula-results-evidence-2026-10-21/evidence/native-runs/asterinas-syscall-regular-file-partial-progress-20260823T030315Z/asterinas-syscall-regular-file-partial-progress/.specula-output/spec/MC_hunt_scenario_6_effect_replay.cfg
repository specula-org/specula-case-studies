SPECIFICATION MCSpec

CONSTANTS
    Threads = {t1, t2}
    MaxAttempts = 2
    MaxOffset = 2
    VectorLength = 2
    InitialFileSize = 2
    \* Reference-only: pinned ext2/ramfs keep this capability disabled.
    EnableReferenceInterruptible = TRUE

    \* One write is interrupted after publication, then TaskRestartSyscall
    \* re-enters it without consuming another fresh-start counter.
    ReadStartLimit = 0
    WriteStartLimit = 1
    PreadStartLimit = 0
    PwriteStartLimit = 0
    ReadvStartLimit = 0
    WritevStartLimit = 0
    ReadFaultZeroLimit = 0
    ReadFaultPositiveLimit = 0
    WriteFaultZeroLimit = 0
    WriteFaultPositiveLimit = 0
    DirectFaultZeroLimit = 0
    DirectFaultPositiveLimit = 0
    InterruptLimit = 1

SYMMETRY ThreadSymmetry
VIEW MCView
CONSTRAINT StateConstraint

INVARIANTS
    MCTypeOK
    MCProgressBounded
    MCNoEffectReplay

CHECK_DEADLOCK FALSE
