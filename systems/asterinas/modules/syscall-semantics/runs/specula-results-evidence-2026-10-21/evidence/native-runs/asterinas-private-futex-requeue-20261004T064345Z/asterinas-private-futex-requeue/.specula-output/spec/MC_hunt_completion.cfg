SPECIFICATION MCFairSpec
CONSTANTS
    WaitIds = {1, 2, 3, 4}
    CallIds = {1, 2, 3, 4}
    Controllers = {p, q}
    Keys = {"A", "B", "C"}
    Buckets = {1, 2}
    BucketOf <- DefaultBucketMap
    InitialWords <- DefaultWords
    Values = {0, 1}
    Quotas = {0, 1, 2}
    Durations <- DefaultDurations
    Mode = "free"
    TargetKey = "B"
    WakeArgs = {1}
    MoveArgs = {1}
    WaitBound = 2
    CallBound = 2
    FaultBound = 1
    StoreBound = 0
    TimedBound = 2

INVARIANTS FailureAtomicity ExactlyOnceCompletion ObjectIdentityStability WakeQuota PermittedWaitResult
PROPERTIES ConditionalCompletion ControlCompletion TimedCompletion
\* TLC liveness runs must not enable symmetry reduction.
VIEW MCView
CONSTRAINT FiniteCapacity
CHECK_DEADLOCK FALSE
