SPECIFICATION MCSpec

CONSTANTS
    Threads = {t1, t2}
    MaxAttempts = 2
    MaxOffset = 2
    VectorLength = 2
    InitialFileSize = 2
    \* The pinned MC.cfg keeps this FALSE.  This hunt enables the brief's
    \* reference-only backend capability at the progress-blind errno seam.
    EnableReferenceInterruptible = TRUE

    ReadStartLimit = 1
    WriteStartLimit = 0
    PreadStartLimit = 0
    PwriteStartLimit = 0
    ReadvStartLimit = 0
    WritevStartLimit = 0
    ReadFaultZeroLimit = 0
    ReadFaultPositiveLimit = 0
    WriteFaultZeroLimit = 0
    WriteFaultPositiveLimit = 0
    DirectFaultZeroLimit = 0
    DirectFaultPositiveLimit = 0
    InterruptLimit = 1

SYMMETRY ThreadSymmetry
VIEW MCView
CONSTRAINT StateConstraint

INVARIANTS
    MCTypeOK
    MCProgressBounded
    MCRestartRequiresZeroProgress

CHECK_DEADLOCK FALSE
