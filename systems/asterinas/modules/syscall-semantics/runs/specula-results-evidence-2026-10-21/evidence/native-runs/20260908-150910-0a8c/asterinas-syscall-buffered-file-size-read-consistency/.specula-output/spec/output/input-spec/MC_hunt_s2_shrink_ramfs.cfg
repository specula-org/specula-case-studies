SPECIFICATION MCSpec
CONSTANTS
  Backend = "ramfs"
  Threads = {t0, t1}
  P = 2
  G = 2
  MaxByte = 6
  InitialSize = 2
  InitialWarm = {0}
  InitialPosition = 0
  ReadLimit = 1
  WriteLimit = 1
  ResizeLimit = 1
  FaultLimit = 0
  Serialize = FALSE
  ReadAfterMutations = TRUE
  Workload <- PreparedShrinkWorkload
SYMMETRY ThreadSymmetry
VIEW MCView
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK LockExclusion SuccessfulTransferAccounting SettledReadableExtent
