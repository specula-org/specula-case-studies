SPECIFICATION MCSpec
CHECK_DEADLOCK FALSE

CONSTANTS
    Thread = {t1, t2}
    EnabledKinds = {"Readv", "Writev"}
    EnabledAdapters = {"Correct"}
    ExplicitOffsets = {0}
    InitialSharedOffset = 0
    InitialFileSize = 6
    InitialCacheCapacity = 8
    AllowSignals = TRUE
    BeginLimit = 1
    CopyFaultLimit = 1
    RestartLimit = 1
    HistoryLimit = 4
    PositionLimit = 12
    \* Guard MC-1: iovec 1 must complete; only iovec 2 may fault.
    AllowedFaultIovs = {2}
    \* Guard MC-1: the later fault must have a positive copied prefix.
    AllowedFaultProgress = {"Prefix"}

SYMMETRY Symmetry
VIEW MCView
CONSTRAINT MCStateConstraint

INVARIANTS
    MCTypeOK
    MCOffsetOwnerWellFormed
    MCProgressWithinRequest
    MCReadReturnCoversCopies
    MCWriteReturnCoversCommit
    MCSharedOffsetTracksReport
    MCRestartNoReplay
