SPECIFICATION MCSpec
CONSTANTS
  Backend = "ramfs"
  Threads = {t0, t1}
  P = 2
  G = 4
  MaxByte = 8
  InitialSize = 6
  InitialWarm = {0, 1, 2}
  InitialPosition = 0
  ReadLimit = 1
  WriteLimit = 0
  ResizeLimit = 2
  FaultLimit = 0
  Serialize = TRUE
  ReadAfterMutations = TRUE
  Workload <- RegrowTailWorkload
SYMMETRY ThreadSymmetry
VIEW MCView
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK LockExclusion HoleZeros SuccessfulResizeContract
