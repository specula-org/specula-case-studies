SPECIFICATION TraceSpec
CONSTANTS
    Threads = {"t1", "t2"}
    NumPages = 3
    OwnerSlots = 6
    AllowSealing = TRUE
INVARIANTS
    TypeAndIdentity
    TrackedOwnershipConservation
    SealPublicationAndFreeze
    RetainedWriteEligibility
    RevocationBeforeOwnerRelease
    ProtectionPrefixEffects
PROPERTIES TraceMatched
CHECK_DEADLOCK FALSE
\* Compatibility predicates are excluded: an authentic known-failure trace
