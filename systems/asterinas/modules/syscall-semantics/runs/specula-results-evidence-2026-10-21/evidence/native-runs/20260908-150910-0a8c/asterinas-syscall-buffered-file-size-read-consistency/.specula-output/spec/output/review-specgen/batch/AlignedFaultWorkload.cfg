SPECIFICATION MCSpec
CONSTANTS
  Backend = "ramfs"
  Threads = {t0}
  P = 2
  G = 2
  MaxByte = 6
  InitialSize = 2
  InitialWarm = {0}
  InitialPosition = 0
  Workload <- AlignedFaultWorkload
  ReadLimit = 0
  WriteLimit = 1
  ResizeLimit = 0
  FaultLimit = 1
  Serialize = TRUE
  ReadAfterMutations = FALSE
INVARIANTS TypeOK LockExclusion NativeWriteBatchCapacity
CHECK_DEADLOCK FALSE
