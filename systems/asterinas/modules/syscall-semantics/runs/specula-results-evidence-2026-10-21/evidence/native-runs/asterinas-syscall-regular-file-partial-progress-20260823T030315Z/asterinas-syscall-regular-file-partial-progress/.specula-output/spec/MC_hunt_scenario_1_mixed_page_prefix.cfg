SPECIFICATION MCSpec

CONSTANTS
    Threads = {t1}
    MaxAttempts = 1
    MaxOffset = 2
    VectorLength = 2
    InitialFileSize = 4
    EnableReferenceInterruptible = FALSE

    \* One buffered write and one positive fault are enough.  The target
    \* invariant becomes relevant only when the aggregate observation records
    \* an earlier dirty page plus a later Uninit faulting page.
    ReadStartLimit = 0
    WriteStartLimit = 1
    PreadStartLimit = 0
    PwriteStartLimit = 0
    ReadvStartLimit = 0
    WritevStartLimit = 0
    ReadFaultZeroLimit = 0
    ReadFaultPositiveLimit = 0
    WriteFaultZeroLimit = 0
    WriteFaultPositiveLimit = 1
    DirectFaultZeroLimit = 0
    DirectFaultPositiveLimit = 0
    InterruptLimit = 0

VIEW MCView
CONSTRAINT StateConstraint

INVARIANTS
    MCTypeOK
    MCProgressBounded
    MCMixedPageRetainedPrefixReported

CHECK_DEADLOCK FALSE
