SPECIFICATION MCSpec

CONSTANTS
    \* One logical task is intentional: only an older asynchronous BIO from
    \* that task can intervene with its later vector call.
    Threads = {t1}
    MaxAttempts = 2
    MaxOffset = 3
    VectorLength = 2
    InitialFileSize = 4
    EnableReferenceInterruptible = FALSE

    \* A direct write leaves its first BIO pending, then the same logical
    \* thread starts a vector before that older attempt completes.
    ReadStartLimit = 0
    WriteStartLimit = 1
    PreadStartLimit = 0
    PwriteStartLimit = 0
    ReadvStartLimit = 0
    WritevStartLimit = 1
    ReadFaultZeroLimit = 0
    ReadFaultPositiveLimit = 0
    WriteFaultZeroLimit = 0
    WriteFaultPositiveLimit = 0
    DirectFaultZeroLimit = 1
    DirectFaultPositiveLimit = 0
    InterruptLimit = 0

VIEW MCView
CONSTRAINT StateConstraint

INVARIANTS
    MCTypeOK
    MCProgressBounded
    MCVectorCallLinearizable

CHECK_DEADLOCK FALSE
