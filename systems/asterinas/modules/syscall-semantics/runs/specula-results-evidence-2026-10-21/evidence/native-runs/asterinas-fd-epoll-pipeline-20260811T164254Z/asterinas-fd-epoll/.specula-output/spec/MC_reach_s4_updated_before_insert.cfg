\* Intentional reachability witness for ADD update-before-insert ordering.
SPECIFICATION MCSpec
CONSTANTS
    Threads = {t1, t2}
    FDs = {"fd0", "fd1", "fd2"}
    OFDs = {"timer", "signal", "event"}
    Epolls = {"ep0", "ep1"}
    FD0 = "fd0"
    FD1 = "fd1"
    FD2 = "fd2"
    TimerOFD = "timer"
    SignalOFD = "signal"
    EventOFD = "event"
    NoThread = NoThread
    NoFD = "no_fd"
    NoOFD = "no_ofd"
    NoEpoll = "no_epoll"
    NoKey = NoKey
    MaxTimerTicks = 1
    MaxEventCounter = 1
    FdActionLimit = 0
    EpollCtlLimit = 1
    CopyFaultLimit = 0
    PollLimit = 0
    SourceLimit = 0
    SignalLimit = 2
    WaitStartLimit = 1
    TimeoutLimit = 0
    InterruptLimit = 0
    ExecLimit = 0
    TopologyLimit = 0
    MaxInterestLimit = 1
    EnabledActions = {"SigQueuesEnqueueProcess", "SignalfdUpdateMask",
                      "EpollWaitRegisterConsumer",
                      "EpollControlCaptureTarget", "EntryUpdatePoll",
                      "EpollAddInterest", "EpollControlPushReady"}
    ActionFDs = {"fd1"}
    ActionOFDs = {"signal"}
    ActionEpolls = {"ep0"}
    ActionTriggerModes = {"LT"}
VIEW MCReachView
CONSTRAINT MCStateConstraint
INVARIANTS
    MCSignalfdRegistrationHasBinding
    MCNoAddUpdatedBeforeInterestInsert
CHECK_DEADLOCK FALSE
