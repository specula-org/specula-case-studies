CONSTANTS
    Threads <- TraceThreads
    ChildPid <- TraceChildPid
    ChildUid <- TraceChildUid
    ExitValues <- TraceExitValues
SPECIFICATION TraceSpec
CHECK_DEADLOCK FALSE
PROPERTIES TraceMatched
INVARIANTS TypeOK LockExclusion UniqueConsume QueueEntriesValid
