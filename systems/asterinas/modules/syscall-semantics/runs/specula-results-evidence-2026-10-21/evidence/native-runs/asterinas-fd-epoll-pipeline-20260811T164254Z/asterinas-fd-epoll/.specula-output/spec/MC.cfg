\* Neutral FD-lifecycle smoke check. Its FD-only action set non-vacuously
\* exercises capture/use, close/drop, and slot reuse. Epoll, callback, signal,
\* wait, and topology oracles are mapped to focused configs in
\* brief-coverage.md and are deliberately absent here.

SPECIFICATION MCSpec

CONSTANTS
    Threads = {t1, t2}
    FDs = {"fd0", "fd1", "fd2"}
    OFDs = {"timer", "signal", "event"}
    Epolls = {"ep0", "ep1"}
    FD0 = "fd0"
    FD1 = "fd1"
    FD2 = "fd2"
    TimerOFD = "timer"
    SignalOFD = "signal"
    EventOFD = "event"
    NoThread = NoThread
    NoFD = "no_fd"
    NoOFD = "no_ofd"
    NoEpoll = "no_epoll"
    NoKey = NoKey
    MaxTimerTicks = 2
    MaxEventCounter = 2
    FdActionLimit = 3
    EpollCtlLimit = 0
    CopyFaultLimit = 0
    PollLimit = 0
    SourceLimit = 0
    SignalLimit = 0
    WaitStartLimit = 0
    TimeoutLimit = 0
    InterruptLimit = 0
    ExecLimit = 0
    TopologyLimit = 0
    MaxInterestLimit = 0
    EnabledActions = {"FcntlSetFlCapture", "FcntlSetFlUse",
                      "SysCloseRemove", "ClosedFileDrop",
                      "FileTableInsert"}
    ActionFDs = {"fd0"}
    ActionOFDs = {"timer", "event"}
    ActionEpolls = {"ep0"}
    ActionTriggerModes = {"LT"}

VIEW MCView
CONSTRAINT MCStateConstraint

INVARIANTS
    MCTypeOK
    MCOccupiedSlotsReferToAliveOFDs
    MCNoPhantomLiveOFD
    MCNoDeadOFDReference
    MCSlotMapsOneOFD
    MCCapturedReferenceStable

PROPERTIES
    MCOFDsNeverResurrect

\* Scenario invariants are enabled only in focused hunting configs.
\* MCCapturedReferenceStable
\* MCReplacementExactlyOnce
\* MCExecClosesExactlySnapshotMarked
\* MCNoCrossReuseDelivery
\* MCNoDeadInterest
\* MCDeliveryCommitOnCopyout
\* MCOneShotDisabledIffDelivered
\* MCCachedReadinessSound
\* MCSignalfdRegistrationHasBinding
\* MCVisibleReadyWinsTerminalRace
\* MCTemporaryMaskRestored

\* Scenario temporal properties are enabled only in focused hunts.
\* MCLevelReadyEventuallyRedelivered
\* MCRegisteredTransitionNotLost
\* MCNestedReadyEpochPropagates

CHECK_DEADLOCK FALSE
