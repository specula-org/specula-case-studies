\* REACH: old-table duplication before atomic cutover appears in the clone.
SPECIFICATION MCSpec
CONSTANTS
    Threads = {t1, t2}
    FDs = {"fd0", "fd1", "fd2"}
    OFDs = {"timer", "signal", "event"}
    Epolls = {"ep0", "ep1"}
    FD0 = "fd0"
    FD1 = "fd1"
    FD2 = "fd2"
    TimerOFD = "timer"
    SignalOFD = "signal"
    EventOFD = "event"
    NoThread = NoThread
    NoFD = "no_fd"
    NoOFD = "no_ofd"
    NoEpoll = "no_epoll"
    NoKey = NoKey
    MaxTimerTicks = 1
    MaxEventCounter = 1
    FdActionLimit = 2
    EpollCtlLimit = 0
    CopyFaultLimit = 0
    PollLimit = 0
    SourceLimit = 0
    SignalLimit = 0
    WaitStartLimit = 0
    TimeoutLimit = 0
    InterruptLimit = 0
    ExecLimit = 1
    TopologyLimit = 0
    MaxInterestLimit = 0
    EnabledActions = {"SysCloseRemove", "ClosedFileDrop",
                      "FileTableDupCeil", "ExecveWaitOtherThreadsExit",
                      "ContextUnshareFiles"}
    ActionFDs = {"fd0", "fd2"}
    ActionOFDs = {"timer", "event"}
    ActionEpolls = {"ep0"}
    ActionTriggerModes = {"LT"}
VIEW MCReachView
CONSTRAINT MCStateConstraint
INVARIANTS
    MCTypeOK
    MCSlotMapsOneOFD
    MCExecCutoverIsolation
    MCNoExecBeforeCutoverDupCaptured
CHECK_DEADLOCK FALSE
