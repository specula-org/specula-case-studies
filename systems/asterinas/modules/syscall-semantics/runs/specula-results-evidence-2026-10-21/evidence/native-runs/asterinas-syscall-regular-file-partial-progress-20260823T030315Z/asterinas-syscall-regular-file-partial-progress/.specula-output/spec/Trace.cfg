SPECIFICATION TraceSpec

CONSTANTS
    \* Harness preprocessing normalizes cooperating task IDs to "0"/"1".
    Threads = {"0", "1"}
    MaxAttempts = 4
    MaxOffset = 8
    VectorLength = 2
    InitialFileSize = 2
    EnableReferenceInterruptible = FALSE

INVARIANTS
    TraceTypeOK
    StructuralOK

\* Trace replay establishes implementation conformance by consuming every
\* event and checking its complete post-state.  Linux-contract invariants are
\* kept for the focused MC_hunt_*.cfg runs; enabling them here would stop
\* replay at the first observed contract violation before TraceMatched can
\* establish coverage of the remaining events.
\* INVARIANT ReportedCoversVisibleCopy
\* INVARIANT ReportedCoversCommittedWrite
\* INVARIANT MixedPageRetainedPrefixReported
\* INVARIANT SharedOffsetMatchesReported
\* INVARIANT FileSizeMatchesProgress
\* INVARIANT VectorCallLinearizable
\* INVARIANT LaterIovecFaultLinearizable
\* INVARIANT PositionalOffsetStable
\* INVARIANT NoUnaccountedPendingEffect
\* INVARIANT RestartRequiresZeroProgress
\* INVARIANT NoEffectReplay

PROPERTIES
    TraceMatched

CHECK_DEADLOCK FALSE
