\* Residual check derived from MC_hunt_s2_quotas.cfg: the same constants and spec without RequeueQuotaAndResult,
\* whose counterexample is already classified. It searches the remaining checks.
SPECIFICATION MCSpec
CONSTANTS
    WaitIds = {1, 2, 3, 4}
    CallIds = {1, 2, 3, 4}
    Controllers = {p, q}
    Keys = {"A", "B", "C"}
    Buckets = {1, 2}
    BucketOf <- DefaultBucketMap
    InitialWords <- DefaultWords
    Values = {0, 1}
    Quotas = {0, 1, 2}
    Durations <- DefaultDurations
    Mode = "quota"
    TargetKey = "C"
    WakeArgs = {0, 1, 2}
    MoveArgs = {0, 1, 2}
    WaitBound = 2
    CallBound = 1
    FaultBound = 0
    StoreBound = 0
    TimedBound = 0

INVARIANTS FailureAtomicity ExactlyOnceCompletion ObjectIdentityStability WakeQuota
SYMMETRY Symmetry
VIEW MCView
CONSTRAINT FiniteCapacity
CHECK_DEADLOCK FALSE
