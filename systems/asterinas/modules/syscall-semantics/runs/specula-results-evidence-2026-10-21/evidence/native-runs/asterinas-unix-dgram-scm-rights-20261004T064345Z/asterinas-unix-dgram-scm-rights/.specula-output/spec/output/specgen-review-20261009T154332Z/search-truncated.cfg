\* A TraceNoCompleteMatch violation is a complete witness, not a safety failure.
SPECIFICATION TraceSpec
CONSTANTS
    JsonFile <- TruncatedFile
    Threads <- TraceThreads
    AttemptSlots <- TraceAttemptSlots
    RightsCount <- TraceRightsCount
    ObjectA <- TraceObjectA
    ObjectB <- TraceObjectB
    SharedTable <- TraceSharedTable
    SetupFDCount <- TraceSetupFDCount
    MaxFD <- TraceMaxFD
    PayloadSize <- TracePayloadSize
INVARIANTS
    TypeOK
    OwnershipConserved
    CapturedObjectIdentity
    OrdinaryConsumeAtMostOnce
    PeekPreservesQueueRights
    DeliveredPrefixSurvives
    OperationOwnersDrained
    QueueStructure
    PublicationStructure
    TraceEndComplete
INVARIANT TraceNoCompleteMatch
CHECK_DEADLOCK FALSE
