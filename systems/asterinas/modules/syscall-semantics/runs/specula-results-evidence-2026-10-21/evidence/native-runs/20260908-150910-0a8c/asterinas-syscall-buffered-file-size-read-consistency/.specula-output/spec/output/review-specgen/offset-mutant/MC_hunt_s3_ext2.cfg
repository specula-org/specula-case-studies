SPECIFICATION MCSpec
CONSTANTS
  Backend = "ext2"
  Threads = {t0, t1}
  P = 2
  G = 4
  MaxByte = 8
  InitialSize = 6
  InitialWarm = {0, 1, 2}
  InitialPosition = 0
  ReadLimit = 1
  WriteLimit = 1
  ResizeLimit = 1
  FaultLimit = 0
  Serialize = TRUE
  ReadAfterMutations = TRUE
  Workload <- ResizeAndHolesWorkload
SYMMETRY ThreadSymmetry
VIEW MCView
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK LockExclusion SuccessfulResizeContract HoleZeros SettledReadableExtent
