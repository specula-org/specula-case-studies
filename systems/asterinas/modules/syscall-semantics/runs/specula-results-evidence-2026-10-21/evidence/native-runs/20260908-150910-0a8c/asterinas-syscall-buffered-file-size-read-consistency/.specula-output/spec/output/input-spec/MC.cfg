SPECIFICATION MCSpec
CONSTANTS
  Backend = "ramfs"
  Threads = {t0, t1}
  P = 2
  G = 2
  MaxByte = 6
  InitialSize = 2
  InitialWarm = {0}
  InitialPosition = 0
  Workload <- ConvergenceWorkload
  ReadLimit = 1
  WriteLimit = 1
  ResizeLimit = 1
  FaultLimit = 0
  Serialize = FALSE
  ReadAfterMutations = FALSE
SYMMETRY ThreadSymmetry
VIEW MCView
CHECK_DEADLOCK FALSE
\* Core safety and structural checks for convergence.
INVARIANTS TypeOK LockExclusion CopyAcceptanceStructure OffsetLockStructure MCBounds
\* Scenario properties are deliberately disabled for convergence.
\* INVARIANT SuccessfulTransferAccounting
\* INVARIANT UnreportedReadSuffixUnchanged
\* INVARIANT ControlledOffsetAccounting
\* INVARIANT SettledReadableExtent
\* INVARIANT ExtendersPreserveExtent
\* INVARIANT SuccessfulResizeContract
\* INVARIANT HoleZeros
\* INVARIANT EmptyWriteNoEffect
\* INVARIANT AcceptedExtent
