SPECIFICATION MCSpec
CONSTANTS
    WaitIds = {1, 2, 3, 4}
    CallIds = {1, 2, 3, 4}
    Controllers = {p, q}
    Keys = {"A", "B", "C"}
    Buckets = {1, 2}
    BucketOf <- DefaultBucketMap
    InitialWords <- DefaultWords
    Values = {0, 1}
    Quotas = {0, 1, 2}
    Durations <- DefaultDurations
    Mode = "free"
    TargetKey = "B"
    WakeArgs = {0, 1, 2}
    MoveArgs = {0, 1, 2}
    WaitBound = 4
    CallBound = 4
    FaultBound = 1
    StoreBound = 1
    TimedBound = 2

\* Core safety and structural convergence checks.
INVARIANTS MCTypeOK OrderedLocks FailureAtomicity ExactlyOnceCompletion ObjectIdentityStability WakeQuota
\* Scenario properties are enabled in the targeted hunt configurations.
\* INVARIANT ResourceAccountingBalance
\* INVARIANT NoMissedOrderedWake
\* INVARIANT RequeueQuotaAndResult
\* INVARIANT LiveMigrationExhaustion
\* INVARIANT PermittedWaitResult
SYMMETRY Symmetry
VIEW MCView
CONSTRAINT FiniteCapacity
CHECK_DEADLOCK FALSE
