    Threads = {r1, r2}
    AttemptSlots = 2
    RightsCount = 4
    ObjectA = fileA
    ObjectB = fileB
    SharedTable = TRUE
    SetupFDCount = 5
    MaxFD = 22
    PayloadSize = 1
    AllowedLayouts = {"Full"}
    SendFaultLimit = 1
    PayloadFaultLimit = 1
    OutputFaultLimit = 1
    PeekLimit = 0
    RecvLimit = 1
    ReuseLimit = 1
VIEW MCView
