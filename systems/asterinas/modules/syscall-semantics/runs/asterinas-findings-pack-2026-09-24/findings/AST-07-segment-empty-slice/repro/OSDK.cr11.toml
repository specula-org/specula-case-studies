# scratch-only: explicit QEMU args for ostd ktest runs (AST-07 / CR-11)
[boot]
method = "qemu-direct"

[test.qemu]
args = """
    -machine q35,kernel-irqchip=split
    -cpu Icelake-Server,+x2apic
    -smp ${SMP:-2}
    -m 8G
    --no-reboot
    -nographic
    -display none
    -serial stdio
    -monitor none
    -device isa-debug-exit,iobase=0xf4,iosize=0x04
    -d int,cpu_reset,guest_errors
    -D ${KTEST_QEMU_LOG:-/tmp/ktest-qemu.log}
"""
