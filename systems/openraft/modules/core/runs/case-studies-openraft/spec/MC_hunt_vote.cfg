    InstallSnapshotResponse = InstallSnapshotResponse
    MaxElectLimit = 4
    MaxRequestLimit = 1
    MaxCrashLimit = 1
    MaxHeartbeatLimit = 3
    MaxConfigLimit = 0
    MaxSnapshotLimit = 0
