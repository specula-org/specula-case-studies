SPECIFICATION MCSpec
CHECK_DEADLOCK FALSE

CONSTANTS
    NodeCount = 3
    MaxIndex = 4
    MaxTerm = 2
    MaxClock = 3
    RequestCount = 2
    Payload = {p1, p2}
    PersistCommitted = TRUE

    StandardMode = StandardMode
    AdvancedMode = AdvancedMode
    LeaderMode = AdvancedMode
    Nil = Nil
    NoRequest = NoRequest
    NoMembership = NoMembership
    NoopValue = NoopValue
    Follower = Follower
    Candidate = Candidate
    Leader = Leader
    Down = Down
    Running = Running
    RecoverLoad = RecoverLoad
    RecoverSnapshot = RecoverSnapshot
    RecoverReplay = RecoverReplay
    RecoverReady = RecoverReady
    NormalEntry = NormalEntry
    BlankEntry = BlankEntry
    MembershipEntry = MembershipEntry
    AppendRequest = AppendRequest
    AppendResponse = AppendResponse
    HeartbeatRequest = HeartbeatRequest
    HeartbeatResponse = HeartbeatResponse
    ReadIndexRequest = ReadIndexRequest
    ReadIndexResponse = ReadIndexResponse
    VoteResponseKind = VoteResponseKind
    AppendResponseKind = AppendResponseKind
    HeartbeatResponseKind = HeartbeatResponseKind
    ReadIndexResponseKind = ReadIndexResponseKind
    ClientResponseKind = ClientResponseKind
    ReadIndexPolicy = ReadIndexPolicy
    LeaseReadPolicy = LeaseReadPolicy
    ReadIdle = ReadIdle
    ReadWaitQuorum = ReadWaitQuorum
    ReadWaitApply = ReadWaitApply
    ReadDone = ReadDone
    RequestIdle = RequestIdle
    RequestStarted = RequestStarted
    RequestJointSubmitted = RequestJointSubmitted
    RequestJointCommitted = RequestJointCommitted
    RequestUniformSubmitted = RequestUniformSubmitted
    RequestDone = RequestDone
    BuildIdle = BuildIdle
    BuildQueued = BuildQueued
    BuildRunning = BuildRunning

    MaxElectionLimit = 3
    MaxClientWriteLimit = 2
    MaxMembershipLimit = 2
    MaxSnapshotTriggerLimit = 2
    MaxSnapshotSendLimit = 1
    MaxHeartbeatLimit = 3
    MaxReadLimit = 2
    MaxCrashLimit = 2
    MaxLoseLimit = 2
    MaxClockAdvanceLimit = 3
    MaxNetworkLimit = 7
    MaxPendingResponseLimit = 7

SYMMETRY Symmetry
VIEW MCView
CONSTRAINT StateConstraint

INVARIANTS
    \* Standard protocol safety
    StandardElectionSafety
    LogMatching
    LeaderCompleteness
    StateMachineSafety

    \* Structural/model sanity
    MCTypeOK
    NoPhantomCommitted
    MCProgressStructure

    \* Scenario invariants are enabled in MC_hunt_*.cfg after convergence.
    \* OrderedVoteSafety
    \* DurableBeforeAck
    \* CursorOrder
    \* RecoveryReadSafety
    \* MembershipAgreement
    \* EffectiveMembershipBacked
    \* SessionFence
    \* SnapshotPurgeSafety

\* Liveness needs fairness/tuned runs and is intentionally not part of the
\* default safety-convergence pass.
\* PROPERTIES RecoveryEventuallyReady ReadEventuallyCompletes
