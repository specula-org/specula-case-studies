\* MC.cfg — spec-convergence config (run BEFORE bug hunting).
\* Checks structural + standard-safety invariants only; the Family B
\* (bug-family) invariants are listed but commented out (enabled in
\* MC_hunt_familyB.cfg).
\*
\* The Byzantine proposer future-dates (FaultyProposeLimit=1) but casts no
\* votes here: with f=1, N=4 the three correct validators already form a
\* quorum, so commits are reachable and the PBTS timely gate is fully
\* exercised, while the faulty-vote message-set blow-up is removed.
\*
\* NOTE: explicit-state BFS of this timed BFT model is large even at these
\* tight bounds (tens of millions of states; the diameter is deep — rounds x
\* phases x clock steps). BFS passes explored so far show NO invariant
\* violation, but full termination is slow; for a quick exhaustive sanity use
\* MC_small.cfg, and for the bug hunt use random simulation
\* (MC_hunt_familyB.cfg). The system's own PBTS spec uses symbolic Apalache for
\* the same reason. Reduce MaxRound/MaxTime here if you need BFS to terminate.

CONSTANTS
    s1 = s1
    s2 = s2
    s3 = s3
    s4 = s4
    MaxRound = 2
    MaxTime = 2
    Precision = 1
    BaseMessageDelay = 1
    MaxMessageDelay = 2
    LastBlockTime = 1
    FaultyProposeLimit = 1
    FaultyPrevoteLimit = 0
    FaultyPrecommitLimit = 0

INIT MCInit
NEXT MCNext
SYMMETRY MCSymmetry

INVARIANTS
    \* --- structural ---
    MCTypeOK
    ClocksSynchronized
    \* --- standard safety (regression) ---
    Agreement
    \* --- Family B extension invariants: enabled in MC_hunt_familyB.cfg ---
    \* BlockTimeWithinPrecision
    \* ProposerWaitBounded
    \* TimelyExemptionSound
