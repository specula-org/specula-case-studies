\* base.cfg — smoke test for base.tla on a tiny instance.
\* Faulty actions are unbounded here (the base spec describes adversary
\* capability); the domain is kept tiny so TLC converges. Real bug hunting
\* uses MC.cfg / MC_hunt_*.cfg with counter-bounded faults.

CONSTANTS
    s1 = s1
    s2 = s2
    s3 = s3
    s4 = s4
    MaxRound = 1
    MaxTime = 2
    Precision = 1
    BaseMessageDelay = 1
    MaxMessageDelay = 2
    LastBlockTime = 1

INIT Init
NEXT Next
SYMMETRY Symmetry

INVARIANTS
    TypeOK
    ClocksSynchronized
    Agreement
    BlockTimeWithinPrecision
    ProposerWaitBounded
    TimelyExemptionSound
