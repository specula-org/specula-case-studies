\* MC_live.cfg — Family B liveness (brief §5 PBTSProgress, #2184).
\* Under bounded clock skew + adaptive MessageDelay back-off, some round's
\* proposal is eventually timely and commits. Requires fairness (MCSpecFair:
\* weak fairness on honest steps; Byzantine actions are NOT forced) and BFS.
\* Bounds kept small — liveness checking is more expensive than safety.

CONSTANTS
    s1 = s1
    s2 = s2
    s3 = s3
    s4 = s4
    MaxRound = 2
    MaxTime = 3
    Precision = 1
    BaseMessageDelay = 2
    MaxMessageDelay = 3
    LastBlockTime = 2
    FaultyProposeLimit = 1
    FaultyPrevoteLimit = 1
    FaultyPrecommitLimit = 1

SPECIFICATION MCSpecFair

PROPERTIES
    PBTSProgress

INVARIANTS
    Agreement
