\* MC_hunt_familyB.cfg — Family B (PBTS block-time / clock liveness) bug hunt.
\* Finding MC-1 (brief §6.1): across all committable interleavings — a faulty
\* proposer maximally future-dating, POLRound>=0 re-proposal over multiple
\* rounds, adaptive MessageDelay growth (InRound), per-validator skew <=
\* Precision — does any committed block's Time exceed the committing honest
\* quorum's clocks by more than Precision?
\*   Confirm  => BlockTimeWithinPrecision / ProposerWaitBounded / TimelyExemptionSound hold
\*               (first formal bound on the #2521 halt, internally).
\*   Refute   => a novel internal unbounded-halt vector (distinct from #2521).
\*
\* Bounds give the adversary room: enough rounds for a POLRound>=0 re-proposal,
\* the InRound cap reachable (MD(0)=2, MD(1)=3=cap), extra Byzantine vote budget
\* to attempt manufacturing a polka/commit for an untimely block.
\*
\* RUN MODE: with full Byzantine voting enabled, exhaustive BFS at these bounds
\* does not terminate quickly (timed BFT explicit-state blow-up). Run this cfg
\* with random simulation, which samples deep adversarial interleavings:
\*   tlc2.TLC -deadlock -simulate num=2000000 -depth 120 -config MC_hunt_familyB.cfg MC.tla
\* (-deadlock disables the spurious "deadlock" report on terminal/committed
\* states.) For an exhaustive (but faulty-vote-free) BFS pass, use MC.cfg.

CONSTANTS
    s1 = s1
    s2 = s2
    s3 = s3
    s4 = s4
    MaxRound = 2
    MaxTime = 5
    Precision = 1
    BaseMessageDelay = 2
    MaxMessageDelay = 3
    LastBlockTime = 2
    FaultyProposeLimit = 1
    FaultyPrevoteLimit = 3
    FaultyPrecommitLimit = 3

INIT MCInit
NEXT MCNext
SYMMETRY MCSymmetry

INVARIANTS
    MCTypeOK
    \* --- Family B / MC-1 (the targets) ---
    BlockTimeWithinPrecision
    ProposerWaitBounded
    TimelyExemptionSound
    \* --- core safety (must not regress while hunting) ---
    Agreement
