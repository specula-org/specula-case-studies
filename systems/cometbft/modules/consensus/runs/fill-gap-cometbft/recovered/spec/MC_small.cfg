\* MC_small.cfg — tiny instance to confirm the spec converges (no spurious
\* violations) on a fully-enumerable model. Not a hunt config.
CONSTANTS
    s1 = s1
    s2 = s2
    s3 = s3
    s4 = s4
    MaxRound = 1
    MaxTime = 2
    Precision = 1
    BaseMessageDelay = 1
    MaxMessageDelay = 2
    LastBlockTime = 1
    FaultyProposeLimit = 1
    FaultyPrevoteLimit = 1
    FaultyPrecommitLimit = 1
INIT MCInit
NEXT MCNext
SYMMETRY MCSymmetry
INVARIANTS
    MCTypeOK
    ClocksSynchronized
    Agreement
    BlockTimeWithinPrecision
    ProposerWaitBounded
    TimelyExemptionSound
