\* Trace.cfg — trace validation against a recorded CometBFT run.
\*
\* Constants must match the discrete mapping the preprocessor used (see
\* instrumentation-spec.md): MaxTime >= the largest compressed clock tick in the
\* trace; Precision / BaseMessageDelay / MaxMessageDelay are the discrete
\* synchrony parameters chosen so that each IsTimely inequality keeps the same
\* truth value as on the real wall-clock times. Tune per trace.

CONSTANTS
    s1 = s1
    s2 = s2
    s3 = s3
    s4 = s4
    MaxRound = 5
    MaxTime = 20
    Precision = 1
    BaseMessageDelay = 2
    MaxMessageDelay = 4
    LastBlockTime = 0

INIT TraceInit
NEXT TraceNext

\* Whole-trace consumption (mandatory — guards against the l-never-advances
\* false positive).
PROPERTIES
    TraceMatched

\* Logic-level safety that must hold on every real execution. Clock-magnitude
\* invariants (BlockTimeWithinPrecision, ProposerWaitBounded, ClocksSynchronized)
\* are intentionally NOT checked here: they depend on the discrete clock model /
\* preprocessing rather than on protocol logic, and belong to the MC hunt.
INVARIANTS
    TypeOK
    Agreement
    TimelyExemptionSound
