\* MC_conv.cfg — full-BFS convergence milestone. Byzantine proposer future-dates
\* (FaultyProposeLimit=1) but casts no votes; with f=1, N=4 the 3 correct
\* validators already form a quorum, so commits are reachable and the timely
\* gate is fully exercised, while the (faulty-vote) message-set blow-up is
\* removed so TLC enumerates the whole reachable space. Confirms no spurious
\* invariant violations. (Full-fault hunting uses simulation; see MC_hunt_familyB.cfg.)
CONSTANTS
    s1 = s1
    s2 = s2
    s3 = s3
    s4 = s4
    MaxRound = 2
    MaxTime = 3
    Precision = 1
    BaseMessageDelay = 2
    MaxMessageDelay = 3
    LastBlockTime = 2
    FaultyProposeLimit = 1
    FaultyPrevoteLimit = 0
    FaultyPrecommitLimit = 0
INIT MCInit
NEXT MCNext
SYMMETRY MCSymmetry
INVARIANTS
    MCTypeOK
    ClocksSynchronized
    Agreement
    BlockTimeWithinPrecision
    ProposerWaitBounded
    TimelyExemptionSound
