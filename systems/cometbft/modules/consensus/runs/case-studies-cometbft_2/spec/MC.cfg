SPECIFICATION MCSpec

CONSTANTS
    Server = {s1, s2, s3, s4}
    Faulty = {s4}
    LightClient = {c1}
    MaxHeight = 2
    MaxRound = 2
    Nil = Nil
    NilVote = NilVote
    Values = {v1, v2}

    ProposalMsg = "ProposalMsg"
    PrevoteMsg = "PrevoteMsg"
    PrecommitMsg = "PrecommitMsg"
    HeaderMsg = "HeaderMsg"

    StepNewHeight = "StepNewHeight"
    StepNewRound = "StepNewRound"
    StepPropose = "StepPropose"
    StepPrevote = "StepPrevote"
    StepPrevoteWait = "StepPrevoteWait"
    StepPrecommit = "StepPrecommit"
    StepPrecommitWait = "StepPrecommitWait"
    StepCommit = "StepCommit"

    ValidVE = "ValidVE"
    InvalidVE = "InvalidVE"
    NoVE = "NoVE"

    DuplicateVoteEv = "DuplicateVoteEv"
    LightClientAttackEv = "LightClientAttackEv"
    InvalidEv = "InvalidEv"

    \* Convergence bounds: small but non-zero across families.
    MaxTimeoutLimit         = 3
    MaxCrashLimit           = 1
    MaxLoseLimit            = 2
    MaxMsgBufferLimit       = 16

    MaxByzEquivocateLimit   = 1
    MaxByzSelectiveLimit    = 1

    MaxByzAmnesiaLimit      = 1
    MaxWALTruncateLimit     = 1

    MaxByzVEAttachLimit     = 1
    MaxByzVELateLimit       = 1
    MaxByzVEReplayLimit     = 1

    MaxByzLunaticLimit      = 1

    MaxByzInjectEvLimit     = 1
    MaxByzFloodEvLimit      = 1
    MaxEvidenceRaceLimit    = 1
    MaxCrashBufLimit        = 1
    MaxProposerExcludeLimit = 1
    MaxAdvanceClockLimit    = 2

    MaxByzProposeAltLimit   = 2
    MaxByzPolkaUnkLimit     = 1
    MaxByzPOLRoundLimit     = 1

SYMMETRY Symmetry
VIEW ModelView
CONSTRAINT MsgBufferConstraint

INVARIANTS
    \* --- Standard safety ---
    ElectionSafety
    Validity

    \* --- Structural / sanity ---
    RoundBound
    HeightBound
    LockedRoundBound
    ValidRoundBound
    LockConsistency
    ValidConsistency
    PrivvalConsistency
    VoteCountBound
    DecisionStability
    CrashedNoTimeouts
    ConflictsOnlyFromByzantine

    \* --- Bug-family invariants (commented out — enabled in hunt cfgs) ---
    \* LockSafety
    \* EventualAccountabilityStrong
    \* PrivvalAmnesiaDetection
    \* VEContextBound
    \* LastCommitVECoverage
    \* LightClientFollowsCanonicalChain
    \* LunaticEvidenceVerifies
    \* HonestPeerNotPunished
    \* EvidenceConsistency
    \* EvidencePoolBounded
    \* Round1ProposalValidation

PROPERTIES
    MonotonicHeight
    MonotonicRound
    DecisionPermanenceTemporal
