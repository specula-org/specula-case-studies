\* Hunt config for Family 1: Equivocation production + selective dissemination.
\* Targets: MC-1, MC-2, MC-13 from brief §6.1.
\* Invariants: ElectionSafety + EventualAccountability(Strong)
\* The bug surface: ByzEquivocate + ByzSelectiveDisseminate composed; we test
\* that no honest sees both votes when partition is split → eventual
\* accountability is broken (the invariant should be violated).

SPECIFICATION MCSpec

CONSTANTS
    Server = {s1, s2, s3, s4}
    Faulty = {s4}
    LightClient = {c1}
    MaxHeight = 2
    MaxRound = 1
    Nil = Nil
    NilVote = NilVote
    Values = {v1, v2}

    ProposalMsg = "ProposalMsg"
    PrevoteMsg = "PrevoteMsg"
    PrecommitMsg = "PrecommitMsg"
    HeaderMsg = "HeaderMsg"

    StepNewHeight = "StepNewHeight"
    StepNewRound = "StepNewRound"
    StepPropose = "StepPropose"
    StepPrevote = "StepPrevote"
    StepPrevoteWait = "StepPrevoteWait"
    StepPrecommit = "StepPrecommit"
    StepPrecommitWait = "StepPrecommitWait"
    StepCommit = "StepCommit"

    ValidVE = "ValidVE"
    InvalidVE = "InvalidVE"
    NoVE = "NoVE"

    DuplicateVoteEv = "DuplicateVoteEv"
    LightClientAttackEv = "LightClientAttackEv"
    InvalidEv = "InvalidEv"

    \* Tight bounds: ONLY equivocation + selective dissemination active.
    MaxTimeoutLimit         = 0
    MaxCrashLimit           = 0
    MaxLoseLimit            = 1
    MaxMsgBufferLimit       = 12

    MaxByzEquivocateLimit   = 1
    MaxByzSelectiveLimit    = 1

    MaxByzAmnesiaLimit      = 0
    MaxWALTruncateLimit     = 0

    MaxByzVEAttachLimit     = 0
    MaxByzVELateLimit       = 0
    MaxByzVEReplayLimit     = 0

    MaxByzLunaticLimit      = 0

    MaxByzInjectEvLimit     = 0
    MaxByzFloodEvLimit      = 0
    MaxEvidenceRaceLimit    = 0
    MaxCrashBufLimit        = 0
    MaxProposerExcludeLimit = 0
    MaxAdvanceClockLimit    = 0

    MaxByzProposeAltLimit   = 0
    MaxByzPolkaUnkLimit     = 0
    MaxByzPOLRoundLimit     = 0

SYMMETRY Symmetry
VIEW ModelView
CONSTRAINT MsgBufferConstraint

INVARIANTS
    ElectionSafety
    Validity
    EventualAccountabilityStrong
    ConflictsOnlyFromByzantine

\* PROPERTIES disabled: EventualAccountability requires fairness in
\* MCSpec; without it TLC reports trivial stuttering counterexamples and
\* terminates early before completing BFS. Safety surface is captured by
\* the EventualAccountabilityStrong invariant.
\* PROPERTIES
\*     EventualAccountability
