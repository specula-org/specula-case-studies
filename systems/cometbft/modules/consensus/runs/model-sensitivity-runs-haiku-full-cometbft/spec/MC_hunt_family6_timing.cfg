SPECIFICATION Spec

\* Hunting config for Family 6: Independent Control Loops and Timing
\* Targets: Timeout interactions with high-round votes, message queue buffering,
\*          race between timeout and vote delivery
\* Expected violations: ElectionSafety (secondary), structural consistency
                                        messageVars, timerVars, mcVars>>

\* Model parameters
CONSTANT Validators = {v1, v2, v3, v4}
CONSTANT MaxHeight = 2
CONSTANT MaxRound = 3
CONSTANT Faulty = {v4}

CONSTANT NULL_BLOCK = null
CONSTANT NULL_PROOF = nullProof

CONSTANT PrevoteType = "prevote"
CONSTANT PrecommitType = "precommit"
CONSTANT RoundStepNewHeight = "newheight"
CONSTANT RoundStepPropose = "propose"
CONSTANT RoundStepPrevote = "prevote"
CONSTANT RoundStepPrecommit = "precommit"

\* Bounds - emphasize timeout interactions
CONSTANT MCTimeoutLimit = 5
CONSTANT MCCrashLimit = 0
CONSTANT MCMessageLossLimit = 1
CONSTANT MCBlockAssemblyLimit = 0
CONSTANT MCByzantineEquivocationLimit = 0

INVARIANT MCTypeOK
INVARIANT MCStructural

\* Family 6 targeted invariants
INVARIANT ElectionSafety

\* Symmetry and constraints
SYMMETRY Symmetry
CONSTRAINT MaxMessages

