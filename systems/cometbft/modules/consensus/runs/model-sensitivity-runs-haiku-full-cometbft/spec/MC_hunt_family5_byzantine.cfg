SPECIFICATION Spec

\* Hunting config for Family 5: Byzantine Behavior Under Message Loss and Asynchrony
\* Targets: Equivocation detection, selective withholding, conflicting commits
\* Expected violations: NoForkingWithQuorum, ElectionSafety


\* Model parameters - allow Byzantine behavior
CONSTANT Validators = {v1, v2, v3, v4}
CONSTANT MaxHeight = 2
CONSTANT MaxRound = 2
CONSTANT Faulty = {v4}

CONSTANT NULL_BLOCK = null
CONSTANT NULL_PROOF = nullProof

CONSTANT PrevoteType = "prevote"
CONSTANT PrecommitType = "precommit"
CONSTANT RoundStepNewHeight = "newheight"
CONSTANT RoundStepPropose = "propose"
CONSTANT RoundStepPrevote = "prevote"
CONSTANT RoundStepPrecommit = "precommit"

\* Bounds - focus on Byzantine equivocation and message loss
CONSTANT MCTimeoutLimit = 2
CONSTANT MCCrashLimit = 0
CONSTANT MCMessageLossLimit = 2
CONSTANT MCBlockAssemblyLimit = 0
CONSTANT MCByzantineEquivocationLimit = 3

INVARIANT MCTypeOK

\* Family 5 targeted invariants
INVARIANT NoForkingWithQuorum     \* BFT safety under Byzantine conditions
INVARIANT ElectionSafety

\* Symmetry and constraints
SYMMETRY Symmetry
CONSTRAINT MaxMessages

