SPECIFICATION Init /\ [][Next]_<<serverVars, voteVars, blockVars, lockVars,
                            recoveryVars, byzantineVars, extensionVars,
                            messageVars, timerVars>>

\* Model parameters
CONSTANT Validators = {v1, v2, v3, v4}
CONSTANT MaxHeight = 3
CONSTANT MaxRound = 2
CONSTANT Faulty = {v4}

CONSTANT NULL_BLOCK = null
CONSTANT NULL_PROOF = nullProof

CONSTANT PrevoteType = prevote
CONSTANT PrecommitType = precommit
CONSTANT RoundStepNewHeight = newheight
CONSTANT RoundStepPropose = propose
CONSTANT RoundStepPrevote = prevote
CONSTANT RoundStepPrecommit = precommit

\* Model checking constraints
CHECK DeadlockFree

\* Safety invariants (enabled by default for convergence testing)
INVARIANT ElectionSafety
INVARIANT NoForkingWithQuorum
INVARIANT NoDuplicateVotes

\* Extension invariants (commented out for convergence, enabled in hunting configs)
\* INVARIANT LockedSafety
\* INVARIANT ValidBlockConsistency
\* INVARIANT VoteExtensionPresence
\* INVARIANT ProposalBlockIntegrity
\* INVARIANT CommitConsistency
