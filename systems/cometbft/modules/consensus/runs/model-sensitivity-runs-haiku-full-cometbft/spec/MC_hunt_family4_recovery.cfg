SPECIFICATION Spec

\* Hunting config for Family 4: Recovery and State Reconstruction Consistency
\* Targets: LastCommit reconstruction paths, offlineStateSyncHeight divergence,
\*          extended commit vs seen commit mismatch
\* Expected violations: CommitConsistency, ElectionSafety
                                        messageVars, timerVars, mcVars>>

\* Model parameters
CONSTANT Validators = {v1, v2, v3, v4}
CONSTANT MaxHeight = 2
CONSTANT MaxRound = 2
CONSTANT Faulty = {v4}

CONSTANT NULL_BLOCK = null
CONSTANT NULL_PROOF = nullProof

CONSTANT PrevoteType = "prevote"
CONSTANT PrecommitType = "precommit"
CONSTANT RoundStepNewHeight = "newheight"
CONSTANT RoundStepPropose = "propose"
CONSTANT RoundStepPrevote = "prevote"
CONSTANT RoundStepPrecommit = "precommit"

\* Bounds - allow crashes to trigger recovery logic
CONSTANT MCTimeoutLimit = 1
CONSTANT MCCrashLimit = 2
CONSTANT MCMessageLossLimit = 0
CONSTANT MCBlockAssemblyLimit = 0
CONSTANT MCByzantineEquivocationLimit = 0

INVARIANT MCTypeOK

\* Family 4 targeted invariants
INVARIANT CommitConsistency        \* consensus/state.go:186-192, 592-631
INVARIANT ElectionSafety

\* Symmetry and constraints
SYMMETRY Symmetry
CONSTRAINT MaxMessages

