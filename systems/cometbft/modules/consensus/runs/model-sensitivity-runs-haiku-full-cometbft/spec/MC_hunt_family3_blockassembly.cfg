SPECIFICATION Spec

\* Hunting config for Family 3: Non-Atomic Proposal and Block Assembly
\* Targets: Race between proposal receipt and block part assembly,
\*          interaction with unlock/lock events
\* Expected violations: ProposalBlockIntegrity, ElectionSafety
                                        messageVars, timerVars, mcVars>>

\* Model parameters
CONSTANT Validators = {v1, v2, v3, v4}
CONSTANT MaxHeight = 2
CONSTANT MaxRound = 2
CONSTANT Faulty = {v4}

CONSTANT NULL_BLOCK = null
CONSTANT NULL_PROOF = nullProof

CONSTANT PrevoteType = "prevote"
CONSTANT PrecommitType = "precommit"
CONSTANT RoundStepNewHeight = "newheight"
CONSTANT RoundStepPropose = "propose"
CONSTANT RoundStepPrevote = "prevote"
CONSTANT RoundStepPrecommit = "precommit"

\* Bounds - focus on block assembly race conditions
CONSTANT MCTimeoutLimit = 2
CONSTANT MCCrashLimit = 0
CONSTANT MCMessageLossLimit = 1
CONSTANT MCBlockAssemblyLimit = 3
CONSTANT MCByzantineEquivocationLimit = 0

INVARIANT MCTypeOK

\* Family 3 targeted invariants
INVARIANT ProposalBlockIntegrity   \* consensus/state.go:2073-2184
INVARIANT ElectionSafety

\* Symmetry and constraints
SYMMETRY Symmetry
CONSTRAINT MaxMessages

