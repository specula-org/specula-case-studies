SPECIFICATION TraceInit /\ [][TraceNext]_<<serverVars, voteVars, blockVars, lockVars,
                                        recoveryVars, byzantineVars, extensionVars,
                                        messageVars, timerVars, traceVars>>

\* Model parameters
CONSTANT Validators = {v1, v2, v3, v4}
CONSTANT MaxHeight = 10
CONSTANT MaxRound = 5
CONSTANT Faulty = {v4}

CONSTANT NULL_BLOCK = null
CONSTANT NULL_PROOF = nullProof

CONSTANT PrevoteType = prevote
CONSTANT PrecommitType = precommit
CONSTANT RoundStepNewHeight = newheight
CONSTANT RoundStepPropose = propose
CONSTANT RoundStepPrevote = prevote
CONSTANT RoundStepPrecommit = precommit

\* Safety invariants during trace validation
INVARIANT ElectionSafety
INVARIANT NoDuplicateVotes
INVARIANT NoForkingWithQuorum

\* CRITICAL: Must include TraceMatched property
\* Without this, TLC reports "no errors" even when l never advances
PROPERTIES TraceMatched

DEPTH 100
