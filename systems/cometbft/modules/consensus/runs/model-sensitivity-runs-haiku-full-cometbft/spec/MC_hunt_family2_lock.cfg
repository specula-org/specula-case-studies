SPECIFICATION Spec

\* Hunting config for Family 2: Lock/Unlock Logic Consistency
\* Targets: POL-based unlock, ValidBlock/ValidRound tracking, LockedRound invariants
\* Expected violations: LockedSafety, ValidBlockConsistency, ElectionSafety


\* Model parameters
CONSTANT Validators = {v1, v2, v3, v4}
CONSTANT MaxHeight = 2
CONSTANT MaxRound = 3
CONSTANT Faulty = {v4}

CONSTANT NULL_BLOCK = null
CONSTANT NULL_PROOF = nullProof

CONSTANT PrevoteType = "prevote"
CONSTANT PrecommitType = "precommit"
CONSTANT RoundStepNewHeight = "newheight"
CONSTANT RoundStepPropose = "propose"
CONSTANT RoundStepPrevote = "prevote"
CONSTANT RoundStepPrecommit = "precommit"

\* Bounds - allow multiple rounds to test POL unlock logic
CONSTANT MCTimeoutLimit = 4
CONSTANT MCCrashLimit = 0
CONSTANT MCMessageLossLimit = 0
CONSTANT MCBlockAssemblyLimit = 0
CONSTANT MCByzantineEquivocationLimit = 1

INVARIANT MCTypeOK

\* Family 2 targeted invariants
INVARIANT LockedSafety              \* consensus/state.go:1604-1621, 2409-2423
INVARIANT ValidBlockConsistency     \* consensus/state.go:2427-2432
INVARIANT ElectionSafety

\* Symmetry and constraints
SYMMETRY Symmetry
CONSTRAINT MaxMessages

