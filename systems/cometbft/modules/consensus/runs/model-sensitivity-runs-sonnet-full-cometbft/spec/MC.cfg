SPECIFICATION MCSpec

CONSTANTS
    Server    = {s1, s2, s3}
    Faulty    = {s3}
    MaxHeight = 2
    MaxRound  = 2
    Nil       = Nil
    NilVote   = NilVote
    Values    = {v1, v2}

    ProposalMsg   = "ProposalMsg"
    PrevoteMsg    = "PrevoteMsg"
    PrecommitMsg  = "PrecommitMsg"

    StepNewHeight     = "NewHeight"
    StepNewRound      = "NewRound"
    StepPropose       = "Propose"
    StepPrevote       = "Prevote"
    StepPrevoteWait   = "PrevoteWait"
    StepPrecommit     = "Precommit"
    StepPrecommitWait = "PrecommitWait"
    StepCommit        = "Commit"

    ValidExt   = "ValidExt"
    InvalidExt = "InvalidExt"
    NoExt      = "NoExt"

    DoubleSignCheckHeight = 1

    BlockHash   = {bh1, bh2, bh3}
    HashAliases <- MCHashAliasesAll
    NoEvidence  = NoEvidence

    SyncPeers  = {s1, s2, s3}
    AbsentPeer = AbsentPeer

    \* Fault-injection bounds (start conservative; increase to find bugs)
    MaxTimeoutLimit        = 4
    MaxCrashLimit          = 1
    MaxLoseLimit           = 2
    MaxInvalidVELimit      = 1
    MaxRestartLimit        = 1
    MaxInjectEvidenceLimit = 1
    MaxByzPeerReportLimit  = 2
    MaxMsgBufferLimit      = 8

SYMMETRY Symmetry
VIEW ModelView
CONSTRAINT MsgBufferConstraint

INVARIANTS
    \* --- Standard safety (always enabled) ---
    ConsensusAgreement
    Validity
    LockSafety
    POLRoundValidity

    \* --- Structural (always enabled) ---
    RoundBound
    HeightBound
    LockedRoundBound
    LockConsistency
    ValidConsistency
    VoteCountBound
    DecisionStability
    CrashedNotInConsensus
    EvidencePoolKeyBound
    PrivvalConsistency
    LocalSyncBound
    MaxPeerHeightNonNegative
    LocalSyncHeightNonNegative

    \* --- Bug-family invariants (COMMENTED OUT for spec convergence) ---
    \* Enable in MC_hunt_family*.cfg for bug hunting
    \*ExtensionInCommitVerified       \* Family 1: MC1
    \*LightClientExtensionConsistency \* Family 1: MC2
    \*NoDoubleSignAtHeight1           \* Family 2: MC3
    \*EvidenceDeduplicationSound      \* Family 3: MC4
    \*MaxPeerHeightBoundedOnDisconnect \* Family 4: MC5

PROPERTIES
    DecisionPermanence
    MonotonicHeight
    MonotonicRound
