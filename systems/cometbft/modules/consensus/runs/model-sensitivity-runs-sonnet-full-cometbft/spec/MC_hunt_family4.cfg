\* MC_hunt_family4.cfg — Hunt config for Family 4: Blocksync Peer State Manipulation
\*
\* Target question (from modeling-brief.md §6.1):
\*   MC5: If a Byzantine peer reports an inflated height then a lower height,
\*        then disconnects — does removePeer fail to recalculate maxPeerHeight,
\*        leaving the node stuck in blocksync?
\*        → MaxPeerHeightBoundedOnDisconnect
\*
\* Tight bounds: one Byzantine peer performs two SetPeerRange calls (inflate, then lower),
\* then RemovePeer. Check that maxPeerHeight is bounded by remaining honest peers.
\* No consensus/VE/evidence noise.

SPECIFICATION MCSpec

CONSTANTS
    Server    = {s1, s2, s3}
    Faulty    = {s3}
    MaxHeight = 3
    MaxRound  = 1
    Nil       = Nil
    NilVote   = NilVote
    Values    = {v1}

    ProposalMsg   = "ProposalMsg"
    PrevoteMsg    = "PrevoteMsg"
    PrecommitMsg  = "PrecommitMsg"

    StepNewHeight     = "NewHeight"
    StepNewRound      = "NewRound"
    StepPropose       = "Propose"
    StepPrevote       = "Prevote"
    StepPrevoteWait   = "PrevoteWait"
    StepPrecommit     = "Precommit"
    StepPrecommitWait = "PrecommitWait"
    StepCommit        = "Commit"

    ValidExt   = "ValidExt"
    InvalidExt = "InvalidExt"
    NoExt      = "NoExt"

    DoubleSignCheckHeight = 0

    BlockHash   = {bh1}
    HashAliases <- MCHashAliasesAll
    NoEvidence  = NoEvidence

    SyncPeers  = {s1, s2, s3}
    AbsentPeer = AbsentPeer

    \* Tight bounds: Byzantine peer reports only, then removes itself
    \* MaxHeight = 3 so Byzantine peer can report height 3 (inflated vs local height 1)
    MaxTimeoutLimit        = 0
    MaxCrashLimit          = 0
    MaxLoseLimit           = 0
    MaxInvalidVELimit      = 0
    MaxRestartLimit        = 0
    MaxInjectEvidenceLimit = 0
    MaxByzPeerReportLimit  = 2   \* Two reports: first inflated (3), then lower (1)
    MaxMsgBufferLimit      = 0

SYMMETRY Symmetry
VIEW ModelView

INVARIANTS
    \* Structural
    MaxPeerHeightNonNegative
    LocalSyncHeightNonNegative
    LocalSyncBound
    \* Family 4 target (enabled for hunting)
    MaxPeerHeightBoundedOnDisconnect

PROPERTIES
    \* Family 4 liveness: node should eventually transition to consensus
    BlockSyncLiveness
