\* MC_hunt_family2.cfg — Hunt config for Family 2: Double-Sign Protection Off-by-One
\*
\* Target question (from modeling-brief.md §6.1):
\*   MC3: At height=1, DoubleSignCheckHeight > 0, validator restarts without WAL —
\*        does the loop off-by-one (for i:=1; i<1) allow double-signing if privval
\*        LastSignBytes is also absent?
\*        → NoDoubleSignAtHeight1
\*
\* Tight bounds: one crash+restart scenario at height=1, no VE or evidence noise.
\* Two values needed to expose potential double-sign (two different block IDs).

SPECIFICATION MCSpec

CONSTANTS
    Server    = {s1, s2, s3}
    Faulty    = {s3}
    MaxHeight = 2
    MaxRound  = 2
    Nil       = Nil
    NilVote   = NilVote
    Values    = {v1, v2}

    ProposalMsg   = "ProposalMsg"
    PrevoteMsg    = "PrevoteMsg"
    PrecommitMsg  = "PrecommitMsg"

    StepNewHeight     = "NewHeight"
    StepNewRound      = "NewRound"
    StepPropose       = "Propose"
    StepPrevote       = "Prevote"
    StepPrevoteWait   = "PrevoteWait"
    StepPrecommit     = "Precommit"
    StepPrecommitWait = "PrecommitWait"
    StepCommit        = "Commit"

    ValidExt   = "ValidExt"
    InvalidExt = "InvalidExt"
    NoExt      = "NoExt"

    \* Bug condition: DoubleSignCheckHeight = 1 triggers the off-by-one
    \* min(1, 1) = 1; loop: for i:=1; i<1 → 0 iterations
    DoubleSignCheckHeight = 1

    BlockHash   = {bh1}
    HashAliases <- MCHashAliasesAll
    NoEvidence  = NoEvidence

    SyncPeers  = {s1, s2, s3}
    AbsentPeer = AbsentPeer

    \* Tight bounds: crash+restart is the mechanism; minimize other noise
    MaxTimeoutLimit        = 3
    MaxCrashLimit          = 1   \* One crash (to lose WAL)
    MaxLoseLimit           = 1
    MaxInvalidVELimit      = 0
    MaxRestartLimit        = 1   \* One WAL-absent restart at height=1 (the bug scenario)
    MaxInjectEvidenceLimit = 0
    MaxByzPeerReportLimit  = 0
    MaxMsgBufferLimit      = 8

SYMMETRY Symmetry
VIEW ModelView
CONSTRAINT MsgBufferConstraint

INVARIANTS
    \* Core safety always checked
    ConsensusAgreement
    Validity
    LockSafety
    \* Structural
    RoundBound
    HeightBound
    DecisionStability
    PrivvalConsistency
    \* Family 2 target (enabled for hunting)
    NoDoubleSignAtHeight1

PROPERTIES
    DecisionPermanence
