\* MC_hunt_family1.cfg — Hunt config for Family 1: Vote Extension Verification Asymmetry
\*
\* Target questions (from modeling-brief.md §6.1):
\*   MC1: Can a Byzantine proposer's extension bypass ABCI VerifyVoteExtension
\*        (via self-address skip) and still appear in a committed ExtendedCommit?
\*        → ExtensionInCommitVerified
\*   MC2: Does the light client's acceptance of a commit with unverified extension
\*        signatures constitute a safety divergence from the full-node predicate?
\*        → LightClientExtensionConsistency
\*
\* Tight bounds: one Byzantine validator with invalid VE, minimal rounds/heights.
\* Blocksync/crash/evidence actions minimized (not the target mechanism).

SPECIFICATION MCSpec

CONSTANTS
    Server    = {s1, s2, s3}
    Faulty    = {s3}
    MaxHeight = 2
    MaxRound  = 1
    Nil       = Nil
    NilVote   = NilVote
    Values    = {v1}

    ProposalMsg   = "ProposalMsg"
    PrevoteMsg    = "PrevoteMsg"
    PrecommitMsg  = "PrecommitMsg"

    StepNewHeight     = "NewHeight"
    StepNewRound      = "NewRound"
    StepPropose       = "Propose"
    StepPrevote       = "Prevote"
    StepPrevoteWait   = "PrevoteWait"
    StepPrecommit     = "Precommit"
    StepPrecommitWait = "PrecommitWait"
    StepCommit        = "Commit"

    ValidExt   = "ValidExt"
    InvalidExt = "InvalidExt"
    NoExt      = "NoExt"

    DoubleSignCheckHeight = 0

    BlockHash   = {bh1}
    HashAliases <- MCHashAliasesAll
    NoEvidence  = NoEvidence

    SyncPeers  = {s1, s2, s3}
    AbsentPeer = AbsentPeer

    \* Tight bounds: focus on VE injection, minimal everything else
    MaxTimeoutLimit        = 3
    MaxCrashLimit          = 0
    MaxLoseLimit           = 1
    MaxInvalidVELimit      = 1   \* One invalid VE injection (s3 = Byzantine proposer)
    MaxRestartLimit        = 0
    MaxInjectEvidenceLimit = 0
    MaxByzPeerReportLimit  = 0
    MaxMsgBufferLimit      = 8

SYMMETRY Symmetry
VIEW ModelView
CONSTRAINT MsgBufferConstraint

INVARIANTS
    \* Core safety always checked
    ConsensusAgreement
    Validity
    \* Structural
    RoundBound
    HeightBound
    LockConsistency
    DecisionStability
    \* Family 1 targets (enabled for hunting)
    ExtensionInCommitVerified
    LightClientExtensionConsistency

PROPERTIES
    DecisionPermanence
