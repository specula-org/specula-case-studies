SPECIFICATION TraceSpec

CONSTANTS
    Server    <- TraceServerConst
    Faulty    <- TraceFaultyConst
    MaxHeight = 3
    MaxRound  = 2
    Nil       = Nil
    NilVote   = NilVote
    Values    <- TraceValuesConst

    ProposalMsg   = "ProposalMsg"
    PrevoteMsg    = "PrevoteMsg"
    PrecommitMsg  = "PrecommitMsg"

    StepNewHeight     = "NewHeight"
    StepNewRound      = "NewRound"
    StepPropose       = "Propose"
    StepPrevote       = "Prevote"
    StepPrevoteWait   = "PrevoteWait"
    StepPrecommit     = "Precommit"
    StepPrecommitWait = "PrecommitWait"
    StepCommit        = "Commit"

    ValidExt   = "ValidExt"
    InvalidExt = "InvalidExt"
    NoExt      = "NoExt"

    DoubleSignCheckHeight = 1

    BlockHash   <- TraceBlockHashConst
    HashAliases <- TraceHashAliases
    NoEvidence  = NoEvidence

    SyncPeers  <- TraceSyncPeersConst
    AbsentPeer = AbsentPeer

    \* Overrides for trace-driven proposer selection and value choice
    Proposer    <- TraceProposer
    ChooseValue <- TraceChooseValue

VIEW TraceView
ALIAS TraceAlias

INVARIANTS
    \* Safety invariants that should hold on every real execution
    ConsensusAgreement
    Validity
    LockSafety
    POLRoundValidity
    \* Structural
    RoundBound
    HeightBound
    LockConsistency
    DecisionStability
    EvidencePoolKeyBound
    MaxPeerHeightNonNegative

    \* Fault-injection invariants: NOT checked during trace validation
    \* (only valid when fault injection is active; traces run normally)
    \*ExtensionInCommitVerified
    \*EvidenceDeduplicationSound
    \*MaxPeerHeightBoundedOnDisconnect

PROPERTIES
    \* TraceMatched must be enabled: TLC reports no errors if l never advances
    TraceMatched
    DecisionPermanence
