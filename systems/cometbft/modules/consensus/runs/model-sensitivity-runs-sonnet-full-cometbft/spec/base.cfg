SPECIFICATION Spec

CONSTANTS
    Server      = {s1, s2, s3}
    Faulty      = {s3}
    MaxHeight   = 2
    MaxRound    = 2
    Nil         = Nil
    NilVote     = NilVote
    Values      = {v1, v2}

    ProposalMsg   = "ProposalMsg"
    PrevoteMsg    = "PrevoteMsg"
    PrecommitMsg  = "PrecommitMsg"

    StepNewHeight    = "NewHeight"
    StepNewRound     = "NewRound"
    StepPropose      = "Propose"
    StepPrevote      = "Prevote"
    StepPrevoteWait  = "PrevoteWait"
    StepPrecommit    = "Precommit"
    StepPrecommitWait = "PrecommitWait"
    StepCommit       = "Commit"

    \* Family 1: Vote extensions
    ValidExt   = "ValidExt"
    InvalidExt = "InvalidExt"
    NoExt      = "NoExt"

    \* Family 2: Double-sign protection
    DoubleSignCheckHeight = 1

    \* Family 3: Evidence hash
    BlockHash    = {bh1, bh2, bh3}
    \* bh1 and bh2 collide (same 31-byte truncated hash); bh3 is unique
    HashAliases  = (bh1 :> "k1" @@ bh2 :> "k1" @@ bh3 :> "k3")
    NoEvidence   = NoEvidence

    \* Family 4: Blocksync
    SyncPeers   = {s1, s2, s3}
    AbsentPeer  = AbsentPeer

INVARIANTS
    ConsensusAgreement
    Validity
    LockSafety
    POLRoundValidity
    RoundBound
    HeightBound
    LockedRoundBound
    LockConsistency
    ValidConsistency
    VoteCountBound
    DecisionStability
    MaxPeerHeightNonNegative
    LocalSyncHeightNonNegative

PROPERTIES
    DecisionPermanence
    MonotonicHeight
