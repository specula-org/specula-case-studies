\* MC_hunt_family3.cfg — Hunt config for Family 3: Evidence Hash Collision
\*
\* Target question (from modeling-brief.md §6.1):
\*   MC4: If a Byzantine node submits LightClientAttackEvidence whose conflicting
\*        block hash differs from an honest pending entry only in the last byte,
\*        does the hash collision in Hash() cause honest evidence to be suppressed?
\*        → EvidenceDeduplicationSound
\*
\* Tight bounds: two colliding block hashes (bh1, bh2 map to same key),
\* one Byzantine injection followed by honest submission.
\* No consensus/VE noise.

SPECIFICATION MCSpec

CONSTANTS
    Server    = {s1, s2, s3}
    Faulty    = {s3}
    MaxHeight = 2
    MaxRound  = 1
    Nil       = Nil
    NilVote   = NilVote
    Values    = {v1}

    ProposalMsg   = "ProposalMsg"
    PrevoteMsg    = "PrevoteMsg"
    PrecommitMsg  = "PrecommitMsg"

    StepNewHeight     = "NewHeight"
    StepNewRound      = "NewRound"
    StepPropose       = "Propose"
    StepPrevote       = "Prevote"
    StepPrevoteWait   = "PrevoteWait"
    StepPrecommit     = "Precommit"
    StepPrecommitWait = "PrecommitWait"
    StepCommit        = "Commit"

    ValidExt   = "ValidExt"
    InvalidExt = "InvalidExt"
    NoExt      = "NoExt"

    DoubleSignCheckHeight = 0

    \* Two hashes that produce the same truncated key (the bug):
    \*   HashAliases[bh1] = "k1" = HashAliases[bh2]  (collision — differ only in byte 32)
    \*   HashAliases[bh3] = "k3"                       (no collision)
    BlockHash   = {bh1, bh2, bh3}
    HashAliases <- MCHashAliasesOneCollision
    NoEvidence  = NoEvidence

    SyncPeers  = {s1, s2, s3}
    AbsentPeer = AbsentPeer

    \* Tight bounds: focus on evidence injection collision
    MaxTimeoutLimit        = 1
    MaxCrashLimit          = 0
    MaxLoseLimit           = 0
    MaxInvalidVELimit      = 0
    MaxRestartLimit        = 0
    MaxInjectEvidenceLimit = 1   \* One Byzantine evidence injection (pre-populates key)
    MaxByzPeerReportLimit  = 0
    MaxMsgBufferLimit      = 4

SYMMETRY Symmetry
VIEW ModelView
CONSTRAINT MsgBufferConstraint

INVARIANTS
    \* Core safety always checked
    ConsensusAgreement
    Validity
    \* Structural
    RoundBound
    HeightBound
    EvidencePoolKeyBound
    \* Family 3 target (enabled for hunting)
    EvidenceDeduplicationSound

PROPERTIES
    DecisionPermanence
