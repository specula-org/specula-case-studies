\* MC_hunt_f5_statesync.cfg — Family 5 (state-sync trust gap).
\*
\* Goal: under the operator-collusion model (BOTH RPC slots map to a Malicious
\* identity AND the p2p chunk peer is also Malicious), show that verifyApp
\* passes (rpcAppHash == appComputedHash) while the actual state is wrong
\* (appComputedHash /= honestAppHash). Issue #5801 trust pattern.
\*
\* Hunt invariant: MCStateSyncSoundness — expected VIOLATED.
\*
\* Setup: 1 honest sync target. PBTS/consensus actions zeroed; we exercise only
\* the sync surface. Both RPC slots are Malicious.

SPECIFICATION MCSpec

CONSTANTS
    Servers             = {s1, s2, s3, s4}
    Faulty              = {s4}
    MaxHeight           = 2
    MaxRound            = 0
    MaxTime             = 1
    Precision           = 1
    MessageDelay        = 1
    MaxClockSkew        = 1
    Blocks              = {b1}
    Extensions          = {e1}
    NoExtension         = noExt
    Identities          = {id1, id2}     \* two slots
    MaliciousIdentities = {id1, id2}     \* both Malicious — the collusion case
    ChunkValues         = {c1, c2}
    AppHashes           = {ah1, ah2}     \* honest vs attacker
    Nil                 = nilV

    ProposeNewBlockLimit       = 1
    ProposeValidBlockLimit     = 0
    AdvanceRoundLimit          = 0
    DeliverLatePrecommitLimit  = 0
    DeliverInRoundLimit        = 0
    AppRejectLimit             = 0
    SyncFetchAppHashLimit      = 2
    SyncChunkLimit             = 2
    TickValidatorLimit         = 1
    TickRealTimeLimit          = 1

CONSTANTS
    AppAcceptsPP <- AppAcceptsPPAll
    AppAcceptsVE <- AppAcceptsVEAll

CONSTRAINT MCStateConstraint
SYMMETRY  MCSymmetry

INVARIANTS
    MCTypeOK
    MCStateSyncSoundness

CHECK_DEADLOCK FALSE
