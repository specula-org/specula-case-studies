\* MC_hunt_f4_proposer_self_reject.cfg — Family 4 (proposer-self PP-reject).
\*
\* Goal: count rounds-to-decide when the adversarial app rejects ProcessProposal
\* on the proposer's own block (state.go:1484-1497, the prevote-nil branch).
\* Issue #1430.
\*
\* Hunt invariant: there is no specific "violated" invariant from §5 for F4 (it
\* is a liveness-quantification family). The MEDIUM-priority finding MC4 asks
\* the bounded question "does the chain ever fail to decide for unbounded k?"
\* We encode this as: under k rejections, eventually some validator's
\* appAcceptsPP is TRUE somewhere — checked via SomeAppAccepts as a guardrail.
\* The real MC value here is the counterexample's round-count.
\*
\* Use this cfg as a SIM run to gather distributions of rounds-to-decide as a
\* function of AppRejectLimit. The exhaustive search confirms no deadlock when
\* SomeAppAccepts holds and disproves it when no validator can accept.

SPECIFICATION MCSpec

CONSTANTS
    Servers             = {s1, s2, s3, s4}
    Faulty              = {s4}
    MaxHeight           = 1          \* single height — count rounds to decide
    MaxRound            = 3
    MaxTime             = 4
    Precision           = 1
    MessageDelay        = 1
    MaxClockSkew        = 1
    Blocks              = {b1, b2}
    Extensions          = {e1}
    NoExtension         = noExt
    Identities          = {id1}
    MaliciousIdentities = {}
    ChunkValues         = {c1}
    AppHashes           = {ah1}
    Nil                 = nilV

    ProposeNewBlockLimit       = 3
    ProposeValidBlockLimit     = 1
    AdvanceRoundLimit          = 3
    DeliverLatePrecommitLimit  = 0
    DeliverInRoundLimit        = 0
    AppRejectLimit             = 3   \* the mechanism we're sweeping
    SyncFetchAppHashLimit      = 0
    SyncChunkLimit             = 0
    TickValidatorLimit         = 4
    TickRealTimeLimit          = 4

CONSTANTS
    AppAcceptsPP <- AppAcceptsPPF4
    AppAcceptsVE <- AppAcceptsVEAll

CONSTRAINT MCStateConstraint
SYMMETRY  MCSymmetry

INVARIANTS
    MCTypeOK
    MCValidBlockRoundConsistency
    MCDecidedTimestampInRange
    SomeAppAccepts

CHECK_DEADLOCK FALSE
