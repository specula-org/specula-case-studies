\* Trace.cfg — replay an instrumented CometBFT log against base.tla.

SPECIFICATION TraceSpec

CONSTANTS
    Servers             = {"s1", "s2", "s3", "s4"}
    Faulty              = {"s4"}
    MaxHeight           = 3
    MaxRound            = 3
    MaxTime             = 30
    Precision           = 1
    MessageDelay        = 1
    MaxClockSkew        = 1
    Blocks              = {"b1", "b2", "b3"}
    Extensions          = {"e1"}
    NoExtension         = "noExt"
    Identities          = {"id1", "id2"}
    MaliciousIdentities = {}
    ChunkValues         = {"c1"}
    AppHashes           = {"ah1"}
    \* Nil is declared as a TLA+ model value (no quotes) so TLC treats it as
    \* polymorphic — equality with any concrete type returns FALSE rather
    \* than raising a type error. This is required because the spec uses Nil
    \* for both numeric (timestamp) and string (block, app hash) slots.
    Nil                 = nilV

CONSTANTS
    AppAcceptsPP <- AppAcceptsPPAll
    \* AppAcceptsVE replaced with the wider-domain version defined in
    \* Trace.tla so vote.extension = NoExtension does not fault.
    AppAcceptsVE <- AppAcceptsVEAllWithNoExt

\* TraceTypeOK is intentionally omitted: TypeOK in base.tla checks
\* `decidedTimestamp \in [Heights -> Times \cup {Nil}]` which TLC cannot
\* evaluate on a heterogeneous int/string union when Nil is a string.
\* The operational invariants below cover the structural properties we care
\* about for trace replay.

INVARIANTS
    TraceValidBlockRoundConsistency
    TraceDecidedTimestampInRange
    TraceMonotonicHeaderTime

\* Disable the deadlock check: trace replay legitimately ends when the trace
\* is exhausted, which TLC otherwise reports as a deadlock. The TraceMatched
\* temporal property below is the real success criterion.
CHECK_DEADLOCK FALSE

PROPERTIES
    TraceMatched
