\* base.cfg — convergence-shaped sanity only. The real model checking runs are in MC.cfg / MC_hunt_*.cfg.
\* AppAcceptsPP / AppAcceptsVE are CONSTANTS in base.tla, so this cfg has to
\* bind them somehow even for the base profile. We bind them to the always-accept
\* operators defined in MC.tla — but that means we have to EXTEND MC, not base.
\* Simpler: define them inline here as full functions.
SPECIFICATION Spec

CONSTANTS
    Servers           = {s1, s2, s3, s4}
    Faulty            = {s4}
    MaxHeight         = 2
    MaxRound          = 1
    MaxTime           = 6
    Precision         = 1
    MessageDelay      = 1
    MaxClockSkew      = 1
    Blocks            = {b1, b2}
    Extensions        = {e1}
    NoExtension       = noExt
    Identities        = {id1, id2}
    MaliciousIdentities = {id2}
    ChunkValues       = {c1}
    AppHashes         = {ah1, ah2}
    Nil               = nilV

CONSTANTS
    AppAcceptsPP <- AppAcceptsPPAll
    AppAcceptsVE <- AppAcceptsVEAll

INVARIANTS
    TypeOK
    ValidBlockRoundConsistency
    DecidedTimestampInRange
    MonotonicHeaderTime

CHECK_DEADLOCK FALSE
