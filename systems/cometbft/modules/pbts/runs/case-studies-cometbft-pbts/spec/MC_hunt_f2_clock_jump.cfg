\* MC_hunt_f2_clock_jump.cfg — Family 2 (clock-jump halt).
\*
\* Goal: after a Byzantine streak that pushes block.Time forward by Δ, measure
\* whether honest validators recover within Δ + ε real-time. The bug surface
\* is state/state.go:255 (no clamp at MakeBlock) + state/validation.go:122
\* (strict After). Issue #2521.
\*
\* Hunt invariant: MCBoundedHaltGap — expected VIOLATED when MaxRound * Precision
\* is too small; the counterexample tells us the required ε.

SPECIFICATION MCSpec

CONSTANTS
    Servers             = {s1, s2, s3, s4}
    Faulty              = {s4}
    MaxHeight           = 2
    MaxRound            = 2
    MaxTime             = 8         \* enough room for halt-then-recovery
    Precision           = 1
    MessageDelay        = 1
    MaxClockSkew        = 1
    Blocks              = {b1}
    Extensions          = {e1}
    NoExtension         = noExt
    Identities          = {id1}
    MaliciousIdentities = {}
    ChunkValues         = {c1}
    AppHashes           = {ah1}
    Nil                 = nilV

    ProposeNewBlockLimit       = 2   \* one Byzantine push + one honest follow-up
    ProposeValidBlockLimit     = 1
    AdvanceRoundLimit          = 4
    DeliverLatePrecommitLimit  = 0
    DeliverInRoundLimit        = 0
    AppRejectLimit             = 0
    SyncFetchAppHashLimit      = 0
    SyncChunkLimit             = 0
    TickValidatorLimit         = 8
    TickRealTimeLimit          = 8

CONSTANTS
    AppAcceptsPP <- AppAcceptsPPAll
    AppAcceptsVE <- AppAcceptsVEAll

CONSTRAINT MCStateConstraint
SYMMETRY  MCSymmetry

INVARIANTS
    MCTypeOK
    MCValidBlockRoundConsistency
    MCDecidedTimestampInRange
    MCBoundedHaltGap

CHECK_DEADLOCK FALSE
