\* MC.cfg — standard convergence run.
\*
\* This config exercises the full Next relation with structural invariants only.
\* Bug-family invariants are commented out below; per-family hunt cfgs (one per
\* family) re-enable them with tighter scenario bounds.

SPECIFICATION MCSpec

CONSTANTS
    Servers             = {s1, s2, s3, s4}
    Faulty              = {s4}
    MaxHeight           = 2
    MaxRound            = 1
    MaxTime             = 4
    Precision           = 1
    MessageDelay        = 1
    MaxClockSkew        = 1
    Blocks              = {b1, b2}
    Extensions          = {e1, e2}
    NoExtension         = noExt
    Identities          = {id1, id2, id3}
    MaliciousIdentities = {id2}
    ChunkValues         = {c1, c2}
    AppHashes           = {ah1, ah2}
    Nil                 = nilV

    ProposeNewBlockLimit       = 2
    ProposeValidBlockLimit     = 1
    AdvanceRoundLimit          = 2
    DeliverLatePrecommitLimit  = 2
    DeliverInRoundLimit        = 4
    AppRejectLimit             = 2
    SyncFetchAppHashLimit      = 1
    SyncChunkLimit             = 2
    TickValidatorLimit         = 4
    TickRealTimeLimit          = 4

CONSTANTS
    AppAcceptsPP <- AppAcceptsPPAll
    AppAcceptsVE <- AppAcceptsVEAll

CONSTRAINT MCStateConstraint
SYMMETRY  MCSymmetry

INVARIANTS
    \* Structural / sanity — always checked.
    MCTypeOK
    MCValidBlockRoundConsistency
    MCDecidedTimestampInRange
    MCMonotonicHeaderTime
    \* Bug-family invariants (re-enabled in MC_hunt_*.cfg):
    \* MCTimestampBoundedByCommitTime   \* F1
    \* MCBoundedHaltGap                 \* F2
    \* MCExtensionVerifyCoverage        \* F3
    \* MCLocalLastCommitConsistency     \* F3
    \* MCStateSyncSoundness             \* F5

CHECK_DEADLOCK FALSE
