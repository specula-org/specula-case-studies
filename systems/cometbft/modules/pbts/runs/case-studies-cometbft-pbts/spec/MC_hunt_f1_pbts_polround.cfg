\* MC_hunt_f1_pbts_polround.cfg — Family 1 (PBTS POLRound-bypass).
\*
\* Goal: quantify the achievable |block.Time - realTime| drift when a Byzantine
\* round-0 proposer crafts an edge-of-timely timestamp, gets a polka, and F9
\* reproposes with POLRound=0 carrying the same timestamp through subsequent
\* rounds (state.go:1515-1571 skip path).
\*
\* Hunt invariant: MCTimestampBoundedByCommitTime — expected VIOLATED, with the
\* counterexample showing the maximum achievable drift as a function of
\* (f, Precision, MessageDelay).
\*
\* Setup: 4 validators, 1 Byzantine; 2 heights so we exercise the reproposal
\* across at least one boundary. State-sync and straggler-VE actions zeroed.

SPECIFICATION MCSpec

CONSTANTS
    Servers             = {s1, s2, s3, s4}
    Faulty              = {s4}
    MaxHeight           = 2
    MaxRound            = 2          \* allow a reproposal in round 1
    MaxTime             = 6
    Precision           = 1
    MessageDelay        = 1
    MaxClockSkew        = 1
    Blocks              = {b1}
    Extensions          = {e1}       \* unused here, kept non-empty for TLC
    NoExtension         = noExt
    Identities          = {id1}      \* state-sync zeroed
    MaliciousIdentities = {}
    ChunkValues         = {c1}
    AppHashes           = {ah1}
    Nil                 = nilV

    ProposeNewBlockLimit       = 1   \* exactly one Byzantine pick window
    ProposeValidBlockLimit     = 2   \* F9 reproposals in subsequent rounds
    AdvanceRoundLimit          = 3
    DeliverLatePrecommitLimit  = 0
    DeliverInRoundLimit        = 0
    AppRejectLimit             = 0
    SyncFetchAppHashLimit      = 0
    SyncChunkLimit             = 0
    TickValidatorLimit         = 6
    TickRealTimeLimit          = 6

CONSTANTS
    AppAcceptsPP <- AppAcceptsPPAll
    AppAcceptsVE <- AppAcceptsVEAll

CONSTRAINT MCStateConstraint
SYMMETRY  MCSymmetry

INVARIANTS
    MCTypeOK
    MCValidBlockRoundConsistency
    MCDecidedTimestampInRange
    MCMonotonicHeaderTime
    MCTimestampBoundedByCommitTime

CHECK_DEADLOCK FALSE
