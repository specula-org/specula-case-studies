\* MC_hunt_f3_straggler_ve.cfg — Family 3 (straggler VE app-verification gap).
\*
\* Goal: a Byzantine-crafted precommit-extension arrives via the late path
\* (state.go:2316-2350) which skips the app's VerifyVoteExtension. Different
\* honest H+1 proposers thus see different lastCommitVotes sets, producing
\* divergent PrepareProposal outputs — issue #2523.
\*
\* Hunt invariants:
\*   - MCExtensionVerifyCoverage: expected VIOLATED — that IS the bug.
\*   - MCLocalLastCommitConsistency: expected VIOLATED — divergence between
\*     two honest validators' lastCommitVotes sets.
\*
\* Setup: 4 validators, 1 Byzantine. PBTS/clock dimensions zeroed; we only
\* exercise the precommit-delivery split.

SPECIFICATION MCSpec

CONSTANTS
    Servers             = {s1, s2, s3, s4}
    Faulty              = {s4}
    MaxHeight           = 2          \* need a prior height to have late precommits
    MaxRound            = 1
    MaxTime             = 2
    Precision           = 1
    MessageDelay        = 1
    MaxClockSkew        = 1
    Blocks              = {b1}
    Extensions          = {e1, e2}   \* one app-accepted, one app-rejected
    NoExtension         = noExt
    Identities          = {id1}
    MaliciousIdentities = {}
    ChunkValues         = {c1}
    AppHashes           = {ah1}
    Nil                 = nilV

    ProposeNewBlockLimit       = 1
    ProposeValidBlockLimit     = 0
    AdvanceRoundLimit          = 1
    DeliverLatePrecommitLimit  = 4   \* the mechanism we're hunting
    DeliverInRoundLimit        = 2
    AppRejectLimit             = 0
    SyncFetchAppHashLimit      = 0
    SyncChunkLimit             = 0
    TickValidatorLimit         = 2
    TickRealTimeLimit          = 2

CONSTANTS
    AppAcceptsPP <- AppAcceptsPPF3
    AppAcceptsVE <- AppAcceptsVEF3

CONSTRAINT MCStateConstraint
SYMMETRY  MCSymmetry

INVARIANTS
    MCTypeOK
    MCValidBlockRoundConsistency
    MCExtensionVerifyCoverage
    \* MCLocalLastCommitConsistency intentionally omitted — its current
    \* state-shaped form (\A v1, v2 \in Honest : lastCommitVotes[v1] =
    \* lastCommitVotes[v2]) is over-strict: it trips on the normal,
    \* protocol-legal asynchrony where one honest validator received a
    \* precommit before another. The F3 bug (straggler VE feeding an
    \* H+1 proposer's PrepareProposal with an app-unverified extension)
    \* is captured by ExtensionVerifyCoverage. Reinstating
    \* LocalLastCommitConsistency would require a stronger formulation
    \* that pins it to the proposer-preparation moment at H+1.

CHECK_DEADLOCK FALSE
