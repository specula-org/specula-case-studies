\* MC_hunt_family4_caller_misuse.cfg
\* F4 — Caller misuse: concurrent iter + insert + remove + pop_front (MEDIUM)
\*
\* Bug class: refcount leaks, premature finalize, lost entries under
\* adversarial caller patterns. Past regressions: #672, #671, #1143, #1178
\* — all closed but the class persists. PR #1217 fixed `clone_from`'s missing
\* RefEntry decrement (#1178 was a regression of #673's fix for #671).
\*
\* Hunt: with EnableHarness = TRUE and 2-3 threads issuing arbitrary
\* operations, expect:
\*   - RefcountMatchesHandlesAndInstalls to hold at quiescence
\*   - GetReturnsLatest to hold (post-Insert without intervening Remove)
\*   - NoUseAfterFree to hold (no thread holds a target ref to a freed node)
\*
\* Targets brief §6.1 findings: MC6, MC8.

SPECIFICATION MCSpec

CONSTANTS
    Key = {k1}
    Value = {v1}
    Thread = {t1, t2}
    MaxHeight = 1
    MaxNodes = 3
    MaxOps = 2

CONSTANTS
    MaxFinalizeLimit = 1
    MaxHelpUnlinkLimit = 1

\* No bug-injection fault — pure interleaving + UAF probe via reclamation.
CONSTANTS
    FaultInsertReorder = FALSE
    FaultIterRewind = FALSE
    FaultMarkBottomUp = FALSE
    FaultPrematureFree = FALSE
    EnableHarness = TRUE

SYMMETRY MCSymmetry
CONSTRAINT MCStateConstraint

INVARIANTS
    AllocBound
    NodesAllocatedHaveState
    RefcountNonNegative
    MCTypeOK
    RefcountMatchesHandlesAndInstalls
    GetReturnsLatest
    NoUseAfterFree
