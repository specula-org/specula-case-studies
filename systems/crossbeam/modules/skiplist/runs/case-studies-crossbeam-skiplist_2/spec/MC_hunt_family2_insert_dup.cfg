\* MC_hunt_family2_insert_dup.cfg
\* F2 — Insert install-then-mark transient duplicate (MEDIUM; #1023, PR #1101)
\*
\* Bug mechanism: between level-0 CAS-install of new node (base.rs:1095-1104)
\* and mark_tower of the old node (base.rs:1126), both are level-0 unmarked.
\* An iter / get / range traversal can observe two unmarked level-0 nodes for
\* the same key. PR #1101 narrowed but did not eliminate this window.
\*
\* Hunt: even with the canonical (PR #1101) order, model checking finds a
\* state where KeysUnique is briefly violated outside the protected
\* "thread mid-Insert" predicate. Also hunts the #1023 regression by setting
\* FaultInsertReorder = TRUE — that cuts a wider window where Get observes
\* "key absent" briefly.
\*
\* Targets brief §6.1 findings: MC4, MC5.

SPECIFICATION MCSpec

CONSTANTS
    Key = {k1}
    Value = {v1, v2}
    Thread = {t1, t2}
    MaxHeight = 1
    MaxNodes = 3
    MaxOps = 2

CONSTANTS
    MaxFinalizeLimit = 1
    MaxHelpUnlinkLimit = 0

\* F2 (#1023) regression on — exposes wider window
CONSTANTS
    FaultInsertReorder = TRUE
    FaultIterRewind = FALSE
    FaultMarkBottomUp = FALSE
    FaultPrematureFree = FALSE
    EnableHarness = TRUE

SYMMETRY MCSymmetry
CONSTRAINT MCStateConstraint

INVARIANTS
    AllocBound
    NodesAllocatedHaveState
    RefcountNonNegative
    MCTypeOK
    KeysUnique
    LenIsApproximatelyKeyCount
    IterNoSameKeyTwice
    MarkMonotone
    MarkTopDown
