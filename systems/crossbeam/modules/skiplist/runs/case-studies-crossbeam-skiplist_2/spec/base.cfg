\* base.cfg — sanity config for the unwrapped base spec.
\* Smoke-checks Init/Next/Spec compile and standard invariants hold on a
\* tiny instance. Real model checking happens via MC.cfg / MC_hunt_*.cfg.

SPECIFICATION Spec

CONSTANTS
    Key = {k1, k2}
    Value = {v1}
    Thread = {t1}
    MaxHeight = 2
    MaxNodes = 2
    MaxOps = 1

CONSTANTS
    FaultInsertReorder = FALSE
    FaultIterRewind = FALSE
    FaultMarkBottomUp = FALSE
    FaultPrematureFree = FALSE
    EnableHarness = FALSE

INVARIANTS
    AllocBound
    NodesAllocatedHaveState
    RefcountNonNegative
