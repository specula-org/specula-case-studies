\* MC_hunt_family1_iter_rewind.cfg
\* F1 — Iterator rewind after exhaustion (HIGH; #1142, PR #1252)
\*
\* Bug mechanism: Iter::next / Iter::next_back / Range::next / Range::next_back
\* set head=tail=None on cross-over; the next call re-enters the None arm and
\* RE-SEARCHES from the start/end of the list, violating FusedIterator.
\*
\* Hunt: with FaultIterRewind = TRUE, expect IteratorFusion to fail and
\* IterNoSameKeyTwice to fail when the rewind yields a previously-yielded key.
\*
\* Targets brief §6.1 findings: MC1, MC2, MC3.

SPECIFICATION MCSpec

CONSTANTS
    Key = {k1, k2}
    Value = {v1}
    Thread = {t1}
    MaxHeight = 1
    MaxNodes = 2
    MaxOps = 4

CONSTANTS
    MaxFinalizeLimit = 1
    MaxHelpUnlinkLimit = 0

\* F1 fault on; only iterator paths needed.
CONSTANTS
    FaultInsertReorder = FALSE
    FaultIterRewind = TRUE
    FaultMarkBottomUp = FALSE
    FaultPrematureFree = FALSE
    EnableHarness = TRUE

SYMMETRY MCSymmetry
CONSTRAINT MCStateConstraint

INVARIANTS
    AllocBound
    NodesAllocatedHaveState
    RefcountNonNegative
    MCTypeOK
    IteratorFusion
    IterNoSameKeyTwice
