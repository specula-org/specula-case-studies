\* MC.cfg — convergence config for crossbeam-skiplist.
\* Standard + structural invariants only. Bug-family invariants are
\* commented out so the spec can converge on a clean (no-fault) baseline.
\* Enable them in MC_hunt_<family>.cfg to hunt the corresponding bug.

SPECIFICATION MCSpec

CONSTANTS
    Key = {k1, k2}
    Value = {v1}
    Thread = {t1, t2}
    MaxHeight = 2
    MaxNodes = 4
    MaxOps = 2

\* Counter bounds for ambient actions
CONSTANTS
    MaxFinalizeLimit = 2
    MaxHelpUnlinkLimit = 2

\* Default: no fault injected (clean baseline)
CONSTANTS
    FaultInsertReorder = FALSE
    FaultIterRewind = FALSE
    FaultMarkBottomUp = FALSE
    FaultPrematureFree = FALSE
    EnableHarness = TRUE

SYMMETRY MCSymmetry
CONSTRAINT MCStateConstraint

\* --- Standard / structural invariants (always enabled) ---
INVARIANTS
    AllocBound
    NodesAllocatedHaveState
    RefcountNonNegative
    MCTypeOK

\* --- Extension invariants (enabled per-family in MC_hunt_*.cfg) ---
\* INVARIANTS
\*     KeysUnique
\*     MarkMonotone
\*     MarkTopDown
\*     LenIsApproximatelyKeyCount
\*     IteratorFusion
\*     IterNoSameKeyTwice
\*     RefcountMatchesHandlesAndInstalls
\*     GetReturnsLatest
\*     NoUseAfterFree
