\* MC_hunt_family3_memorder.cfg
\* F3 — Tower-CAS memory ordering / SeqCst sensitivity (LOW)
\*
\* Five `TODO(Amanieu): can we use release ordering here?` sites in base.rs
\* (lines 339, 1100, 1217, 1273, 1288, 1356). PostBuildCheck (base.rs:1355-1359)
\* reads ONLY the top-level pointer; it depends on mark_tower's top-down
\* ordering (base.rs:333). A refactor that flipped mark_tower to bottom-up
\* would silently break this assumption: the level-0 mark (the LP) could be
\* set BEFORE the top-level mark, and PostBuildCheck (which reads only top)
\* would miss the mark, leaving a partially-installed tower live.
\*
\* This is a sensitivity / robustness check, not an active bug:
\*   - FaultMarkBottomUp = TRUE flips the mark direction in spec.
\*   - Expect MarkTopDown invariant to be preserved at quiescence (because
\*     mark_tower still marks every level), but PostBuildCheck no longer
\*     observes the mark before the inserter publishes the partial tower.
\*   - The visible failure surface is KeysUnique violations that persist
\*     past the "thread mid-Insert" carve-out (i.e. not transient).
\*
\* Targets brief §6.1 finding: MC7.

SPECIFICATION MCSpec

CONSTANTS
    Key = {k1, k2}
    Value = {v1}
    Thread = {t1, t2}
    MaxHeight = 3
    MaxNodes = 3
    MaxOps = 2

CONSTANTS
    MaxFinalizeLimit = 1
    MaxHelpUnlinkLimit = 1

\* F3 sensitivity on — bottom-up mark_tower
CONSTANTS
    FaultInsertReorder = FALSE
    FaultIterRewind = FALSE
    FaultMarkBottomUp = TRUE
    FaultPrematureFree = FALSE
    EnableHarness = FALSE

SYMMETRY MCSymmetry
CONSTRAINT MCStateConstraint

INVARIANTS
    AllocBound
    NodesAllocatedHaveState
    RefcountNonNegative
    MCTypeOK
    KeysUnique
    MarkTopDown
    MarkMonotone
