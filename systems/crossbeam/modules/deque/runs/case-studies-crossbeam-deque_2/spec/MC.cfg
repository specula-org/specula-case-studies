\* MC.cfg — convergence config for the crossbeam-deque MC spec.
\* Tight bounds on fault-injection actions; bug-family invariants commented
\* out so that this config converges on the unfaulted system.
\*
\* For per-family bug hunting, run MC_hunt_<family>.cfg.

CONSTANTS
    Stealer            = {s1, s2}
    MaxVal             = 3
    BufferCap          = 2
    MaxBatch           = 2
    MaxResize          = 1
    MaxBatchIters      = 1

    \* Counter bounds — minimal, enough to expose interleavings without
    \* state explosion. Increase per-family in hunting configs.
    MaxResizeLimit            = 1
    MaxReclaimLimit           = 1
    MaxCloneLimit             = 1
    MaxWorkerDropLimit        = 0
    MaxRelaxBackLimit         = 0
    MaxSkipFenceLimit         = 0
    MaxPublishLimit           = 2
    MaxWeakCASLimit           = 0
    MaxPrematureReclaimLimit  = 0
    MaxSkipRecheckLimit       = 0

SPECIFICATION MCSpec

CONSTRAINT MCStateConstraint
SYMMETRY   MCSymmetry
VIEW       MCView

INVARIANTS
    \* Standard safety
    ConsumedWasPushed
    NoDoublePop
    NoGarbageSteal
    \* Structural
    PushedDistinct
    PushCountConsistency
    DequeConsistency
    CurrentBufferAlive
    StealerDomainOK
    BatchIterBounded
    WorkerExclusive
    \* Bug-family invariants — commented out for convergence run.
    \* Enable per-family hunting configs to check these.
    \* StealReturnsValid       \* Family A
    \* NoUseAfterFree          \* Family A / F3
    \* PreCASReadIsVisible     \* Family B
    \* NoLostPopUnderStrongCAS \* Family D
    \* NoElementLoss           \* aggregate
