\* MC_hunt_familyA.cfg
\* Bug Family A — Buffer-Resize / Generation Race (CVE-2021-32810 family).
\*
\* Hypothesis: stealer commits a value from a stale generation when:
\*   - re-check is omitted (skipRecheck[site] = TRUE), AND
\*   - resize swaps buffer between StealReadSlot and StealRecheckCAS, AND
\*   - the slot at the same modular index in the new generation is different.
\*
\* The default Init already sets skipRecheck["batchLIFOFirst"] = TRUE
\* (modeling the asymmetric absence of re-check at deque.rs:1083). This
\* config exercises the LIFO batch first-CAS path with resize and reclaim
\* enabled, with no other fault families active.

CONSTANTS
    Stealer            = {s1, s2}
    MaxVal             = 3
    BufferCap          = 2
    MaxBatch           = 2
    MaxResize          = 2
    MaxBatchIters      = 2

    MaxResizeLimit            = 2
    MaxReclaimLimit           = 2
    MaxCloneLimit             = 1
    MaxWorkerDropLimit        = 0
    MaxRelaxBackLimit         = 0
    MaxSkipFenceLimit         = 0
    MaxPublishLimit           = 2
    MaxWeakCASLimit           = 0
    MaxPrematureReclaimLimit  = 1
    MaxSkipRecheckLimit       = 1

SPECIFICATION MCSpec

CONSTRAINT MCStateConstraint
SYMMETRY   MCSymmetry
VIEW       MCView

INVARIANTS
    ConsumedWasPushed
    NoDoublePop
    NoGarbageSteal
    StealReturnsValid
    NoUseAfterFree
    CurrentBufferAlive
    DequeConsistency
    NoElementLoss
