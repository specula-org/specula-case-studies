\* MC_hunt_familyF.cfg
\* Bug Family F — Empty / Non-Empty Race in Steal-Batch LIFO Loop.
\*
\* Per-iteration interleaving in `steal_batch_with_limit_and_pop` Lifo loop
\* (deque.rs:1100-1146). Each iteration re-fences SeqCst, re-loads back,
\* re-reads slot, re-checks buffer, and CASes front. The buffer pointer is
\* captured ONCE outside the loop. Two prior bugs lived in this loop
\* (commits 4d574d40, 89828aac).
\*
\* This config exercises the LIFO batch loop with multiple iterations and
\* concurrent worker actions (push, pop, resize) interleaved between iterations.

CONSTANTS
    Stealer            = {s1, s2}
    MaxVal             = 3
    BufferCap          = 2
    MaxBatch           = 2
    MaxResize          = 1
    MaxBatchIters      = 2

    MaxResizeLimit            = 1
    MaxReclaimLimit           = 1
    MaxCloneLimit             = 1
    MaxWorkerDropLimit        = 0
    MaxRelaxBackLimit         = 0
    MaxSkipFenceLimit         = 0
    MaxPublishLimit           = 2
    MaxWeakCASLimit           = 0
    MaxPrematureReclaimLimit  = 0
    MaxSkipRecheckLimit       = 0

SPECIFICATION MCSpec

CONSTRAINT MCStateConstraint
SYMMETRY   MCSymmetry
VIEW       MCView

INVARIANTS
    ConsumedWasPushed
    NoDoublePop
    NoGarbageSteal
    StealReturnsValid
    BatchIterBounded
    DequeConsistency
    NoElementLoss
