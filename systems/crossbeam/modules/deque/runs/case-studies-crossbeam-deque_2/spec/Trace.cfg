\* Trace.cfg — trace validation against per-thread NDJSON traces.

CONSTANTS
    Stealer            = {"s1", "s2", "s3", "s4"}
    MaxVal             = 32
    BufferCap          = 64
    MaxBatch           = 4
    MaxResize          = 4
    MaxBatchIters      = 4

SPECIFICATION TraceSpec

\* Invariants meaningful for trace validation: safety + structural.
\* Excluded: bug-family invariants that require fault injection
\* (PreCASReadIsVisible, NoLostPopUnderStrongCAS) — traces are unfaulted.
INVARIANTS
    ConsumedWasPushed
    NoDoublePop
    NoGarbageSteal
    PushedDistinct
    PushCountConsistency
    DequeConsistency
    CurrentBufferAlive
    NoUseAfterFree
    StealerDomainOK
    BatchIterBounded
    WorkerExclusive

\* Liveness: trace must be fully consumed. This is a temporal property and so
\* requires a fairness assumption — without it, TLC reports a trivial stutter
\* counterexample. We add WF in TraceSpec; if you only need invariant
\* validation, comment out the PROPERTIES block.
PROPERTIES
    TraceMatched
