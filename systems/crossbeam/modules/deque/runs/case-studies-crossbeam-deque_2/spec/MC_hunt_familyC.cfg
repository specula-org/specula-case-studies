\* MC_hunt_familyC.cfg
\* Bug Family C — Adversarial Caller Harness (Stealer::clone, Worker drop).
\*
\* Multiple stealers spawned via Stealer::clone, racing against worker; worker
\* may also drop while stealers are mid-operation. Inner is reclaimed only at
\* refcount==0, so stealers keep operating after worker drop.
\*
\* Expected violation candidates:
\*   - NoDoublePop (two stealers race on same front index, both succeed)
\*   - StealerDomainOK / WorkerExclusive (sanity)
\*   - ConsumedWasPushed (stealer continues reading after worker drop)

CONSTANTS
    Stealer            = {s1, s2}
    MaxVal             = 3
    BufferCap          = 2
    MaxBatch           = 1
    MaxResize          = 1
    MaxBatchIters      = 1

    MaxResizeLimit            = 1
    MaxReclaimLimit            = 1
    MaxCloneLimit              = 2
    MaxWorkerDropLimit         = 1
    MaxRelaxBackLimit          = 0
    MaxSkipFenceLimit          = 0
    MaxPublishLimit            = 2
    MaxWeakCASLimit            = 0
    MaxPrematureReclaimLimit   = 0
    MaxSkipRecheckLimit        = 0

SPECIFICATION MCSpec

CONSTRAINT MCStateConstraint
SYMMETRY   MCSymmetry
VIEW       MCView

INVARIANTS
    ConsumedWasPushed
    NoDoublePop
    NoGarbageSteal
    NoUseAfterFree
    StealerDomainOK
    WorkerExclusive
    DequeConsistency
