\* MC_hunt_family3.cfg — Epoch-Deque Lifecycle Coupling
\* Enable premature reclaim with normal re-checks. Tests whether
\* epoch bugs alone (without re-check removal) can cause UAF.

SPECIFICATION MCSpec

CONSTANTS
    Stealer = {s1, s2}
    MaxVal = 4
    BufferCap = 2
    MaxBatch = 2
    MaxResize = 2

CONSTANTS
    MaxResizeLimit = 2
    MaxEpochReclaimLimit = 3

\* Normal re-checks, but premature reclaim enabled
CONSTANTS
    SkipRecheckSingle = FALSE
    SkipRecheckBatchFIFO = FALSE
    SkipRecheckBatchLIFO = TRUE
    PrematureReclaimFlag = TRUE

SYMMETRY MCSymmetry
CONSTRAINT MCStateConstraint

\* Target invariants
INVARIANTS
    NoUseAfterFree
    ConsumedWasPushed
    NoDoublePop
    CurrentBufferAlive
