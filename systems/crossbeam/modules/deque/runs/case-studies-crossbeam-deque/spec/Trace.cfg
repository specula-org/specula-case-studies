\* Trace validation configuration for crossbeam-deque
\* Run with: java -jar tla2tools.jar -config Trace.cfg Trace.tla -deadlock
\* Override trace file with: -DJSON=../traces/my_trace.json

SPECIFICATION TraceSpec

\* Thread IDs must match trace file.
\* Override these per-trace as needed.
CONSTANTS
    Stealer = {"s1", "s2"}
    MaxVal = 100
    BufferCap = 64
    MaxBatch = 32
    MaxResize = 10

\* Trace completion check
\* When TLC reports deadlock, check if TraceFullyConsumed is TRUE.
\* If TRUE: trace validated successfully.
\* If FALSE: trace validation failed at the current event.

\* Invariants to check during trace replay
INVARIANTS
    ConsumedWasPushed
    NoDoublePop
    CurrentBufferAlive
