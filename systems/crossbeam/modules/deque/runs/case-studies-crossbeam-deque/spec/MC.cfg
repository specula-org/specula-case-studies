SPECIFICATION MCSpec

\* Model values
CONSTANTS
    Stealer = {s1, s2}
    MaxVal = 4
    BufferCap = 3
    MaxBatch = 2
    MaxResize = 2

\* MC bounds
CONSTANTS
    MaxResizeLimit = 2
    MaxEpochReclaimLimit = 2

\* Fault injection: match implementation defaults
\* "single" and "batchFIFO" have re-check (FALSE = not skipped)
\* "batchLIFOFirst" lacks re-check (TRUE = skipped, MC-1 finding)
CONSTANTS
    SkipRecheckSingle = FALSE
    SkipRecheckBatchFIFO = FALSE
    SkipRecheckBatchLIFO = TRUE
    PrematureReclaimFlag = FALSE

SYMMETRY MCSymmetry
CONSTRAINT MCStateConstraint

\* --- Standard + Structural invariants ---
INVARIANTS
    ConsumedWasPushed
    NoDoublePop
    DequeConsistency
    PushedDistinct
    PushCountConsistency
    CurrentBufferAlive

\* --- Extension invariants (commented out for convergence) ---
\* StealReturnsValid
\* NoUseAfterFree
\* NoElementLoss
