\* MC_hunt_family1_cve.cfg — Reproduce CVE-2021-32810
\* Skip buffer re-check at ALL sites. With resize, stale buffer reads
\* may commit. Combined with premature reclaim → UAF.

SPECIFICATION MCSpec

CONSTANTS
    Stealer = {s1, s2}
    MaxVal = 4
    BufferCap = 2
    MaxBatch = 2
    MaxResize = 2

CONSTANTS
    MaxResizeLimit = 2
    MaxEpochReclaimLimit = 2

\* Fault injection: skip ALL re-checks (reproduce CVE)
CONSTANTS
    SkipRecheckSingle = TRUE
    SkipRecheckBatchFIFO = TRUE
    SkipRecheckBatchLIFO = TRUE
    PrematureReclaimFlag = TRUE

SYMMETRY MCSymmetry
CONSTRAINT MCStateConstraint

\* Target invariants
INVARIANTS
    ConsumedWasPushed
    NoDoublePop
    NoUseAfterFree
    StealReturnsValid
