SPECIFICATION MCSpec

\* --- Constants ---
CONSTANTS
    Nil = Nil
    Sentinel = N0

    T1 = T1
    T2 = T2
    T3 = T3
    Thread = {T1, T2, T3}

    N0 = N0
    N1 = N1
    N2 = N2
    N3 = N3
    Node = {N0, N1, N2, N3}

    \* Counter bounds — normal operations (tuned for tractable BFS)
    MaxPushes = 2
    MaxPops = 2
    MaxPins = 3
    MaxNestedPins = 1
    MaxUnpins = 3
    MaxHandleReleases = 1
    MaxBagPushes = 2

    \* Buggy actions — DISABLED for standard checking
    MaxBuggyPops = 0
    MaxNestedCollects = 0

    \* Hunt extensions — DISABLED for standard checking
    MaxRepins = 0
    MaxRepinsUnsafe = 0
    MaxStaleBagPushes = 0
    MaxNonAtomicScans = 0
    MaxNonAtomicFinalizes = 0

\* --- Symmetry ---
SYMMETRY MCSymmetry

\* --- State Constraint ---
CONSTRAINT MCConstraint

\* --- Invariants: Safety (always on) ---
INVARIANTS
    TypeOK
    SafeReclamation
    NoDoubleFree

\* --- Invariants: Structural (always on) ---
    PinnedConsistency
    QueueStructure
    AccessRequiresPin
    NoOrphanedBags
    DeletedInactive

\* --- Invariants: Extension ---
    EpochMonotonicity
    TailReachability
    FinalizeOnce
