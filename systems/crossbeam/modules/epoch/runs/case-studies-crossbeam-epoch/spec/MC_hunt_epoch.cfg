    N0 = N0
    N1 = N1
    N2 = N2
    N3 = N3
    Node = {N0, N1, N2, N3}

    \* Focus: pin/advance — moderate limits for tractable BFS
    MaxPins = 4
    MaxNestedPins = 1
    MaxUnpins = 4
    MaxBagPushes = 2

    \* Reduce: queue ops — minimal
    MaxPushes = 1
    MaxPops = 1
    MaxHandleReleases = 0

    \* Buggy: disabled (testing correct impl)
    MaxBuggyPops = 0
    MaxNestedCollects = 0

SYMMETRY MCSymmetry

CONSTRAINT MCConstraint

\* Target invariants
INVARIANTS
    SafeReclamation
    EpochMonotonicity
    NoDoubleFree
    PinnedConsistency
