\* Also checks SafeReclamation for the pin TOCTOU (MC-1)
\*
\* Strategy: maximize pin/advance interleavings, minimize queue ops.

SPECIFICATION MCSpec

CONSTANTS
    Nil = Nil
    Sentinel = N0

    T1 = T1
    T2 = T2
    T3 = T3
