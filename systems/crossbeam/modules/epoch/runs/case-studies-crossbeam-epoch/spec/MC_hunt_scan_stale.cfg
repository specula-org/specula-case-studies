SPECIFICATION MCSpec

\* Combined hunt: H1 (non-atomic scan) + H3 (stale bag sealing)
\* Most dangerous combo: non-atomic scan may allow premature advancement
\* while stale bag sealing makes bags expire one epoch early.
\* Together they could cause use-after-free even with correct implementation.

\* --- Constants ---
CONSTANTS
    Nil = Nil
    Sentinel = N0

    T1 = T1
    T2 = T2
    T3 = T3
    Thread = {T1, T2, T3}

    N0 = N0
    N1 = N1
    N2 = N2
    N3 = N3
    Node = {N0, N1, N2, N3}

    \* Counter bounds
    MaxPushes = 2
    MaxPops = 2
    MaxPins = 3
    MaxNestedPins = 1
    MaxUnpins = 3
    MaxHandleReleases = 1
    MaxBagPushes = 2

    \* Buggy actions — DISABLED
    MaxBuggyPops = 0
    MaxNestedCollects = 0

    \* H1 + H3 — ENABLED
    MaxNonAtomicScans = 2
    MaxStaleBagPushes = 1
    \* Others DISABLED
    MaxRepins = 0
    MaxRepinsUnsafe = 0
    MaxNonAtomicFinalizes = 0

\* --- Symmetry ---
SYMMETRY MCSymmetry

\* --- State Constraint ---
CONSTRAINT MCConstraint

\* --- Invariants ---
INVARIANTS
    TypeOK
    SafeReclamation
    NoDoubleFree
    PinnedConsistency
    QueueStructure
    AccessRequiresPin
    NoOrphanedBags
    DeletedInactive
    EpochMonotonicity
    TailReachability
    FinalizeOnce
