SPECIFICATION MCSpec

\* Combined hunt: H1 (non-atomic scan) + H2 (safe repin) + H4 (non-atomic finalize)
\* Target: cross-cutting races between scan iteration and repin/finalize
\* Scenario: thread repins between another thread's scan steps, or
\*           finalize's transient pin is observed during non-atomic scan

\* --- Constants ---
CONSTANTS
    Nil = Nil
    Sentinel = N0

    T1 = T1
    T2 = T2
    T3 = T3
    Thread = {T1, T2, T3}

    N0 = N0
    N1 = N1
    N2 = N2
    N3 = N3
    Node = {N0, N1, N2, N3}

    \* Counter bounds — tighter for combo BFS
    MaxPushes = 2
    MaxPops = 2
    MaxPins = 2
    MaxNestedPins = 1
    MaxUnpins = 2
    MaxHandleReleases = 1
    MaxBagPushes = 2

    \* Buggy actions — DISABLED
    MaxBuggyPops = 0
    MaxNestedCollects = 0

    \* Hunt: H1 + H2 (safe) + H4 — ENABLED
    MaxNonAtomicScans = 1
    MaxRepins = 1
    MaxNonAtomicFinalizes = 1
    \* Hunt H2 unsafe, H3: DISABLED
    MaxRepinsUnsafe = 0
    MaxStaleBagPushes = 0

\* --- Symmetry ---
SYMMETRY MCSymmetry

\* --- State Constraint ---
CONSTRAINT MCConstraint

\* --- Invariants ---
INVARIANTS
    TypeOK
    SafeReclamation
    NoDoubleFree
    PinnedConsistency
    QueueStructure
    AccessRequiresPin
    NoOrphanedBags
    DeletedInactive
    EpochMonotonicity
    TailReachability
    FinalizeOnce
