\* MC_hunt_F3_sc_fence.cfg
\* Family 3 — SC fence pair across pin / try_advance.
\* Hunts: LocalEpochBoundedByGlobal + AdvanceRequiresAllPinnedAtCurrent
\* under a one-shot fence-skip adversary.

SPECIFICATION MCSpec

CONSTANTS
    Thread = {t1, t2}
    Object = {o1}
    BagCapacity = 2
    MaxEpoch = 3
    PinLimit = 4
    AdvanceLimit = 2
    BuggyRetireLimit = 0
    SkipFenceLimit = 1       \* enable adversarial fence drop
    DeferLimit = 1
    RepinAfterLimit = 0
    UnprotectedDeferLimit = 0
    SlotReuseLimit = 0
    StalledIterLimit = 0

CONSTRAINT StateConstraint
SYMMETRY Symmetry
VIEW View

INVARIANTS
    MCGuardCountNonNegative
    MCLocalEpochBoundedByGlobal
    MCAdvanceRequiresAllPinnedAtCurrent
    MCNoUseAfterRetire

CHECK_DEADLOCK FALSE
