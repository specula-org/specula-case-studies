\* MC_hunt_F2_retire_contract.cfg
\* Family 2 — Retire-before-unlink lifetime mismatch (Issue #238).
\* Hunts: RetireImpliesUnreachable + NoUseAfterRetire when caller
\* defers a still-reachable object.

SPECIFICATION MCSpec

CONSTANTS
    Thread = {t1, t2}
    Object = {o1, o2}
    BagCapacity = 2
    MaxEpoch = 4
    PinLimit = 4
    AdvanceLimit = 2
    BuggyRetireLimit = 1     \* enable adversarial retire
    SkipFenceLimit = 0
    DeferLimit = 1
    RepinAfterLimit = 0
    UnprotectedDeferLimit = 0
    SlotReuseLimit = 0
    StalledIterLimit = 0

CONSTRAINT StateConstraint
SYMMETRY Symmetry
VIEW View

INVARIANTS
    MCGuardCountNonNegative
    MCRetireImpliesUnreachable
    MCNoUseAfterRetire

CHECK_DEADLOCK FALSE
