SPECIFICATION TraceSpec

CONSTANTS
    Thread = {"t1", "t2"}
    Object = {"o1", "o2"}
    BagCapacity = 4
    MaxEpoch = 8

PROPERTIES
    TraceMatched

\* ====================================================================
\* Safety + structural invariants checked during trace replay.
\* Fault-injection-only invariants (RetireImpliesUnreachable,
\* IsExpiredImpliesGap2 against buggy retire) are excluded — traces
\* run on the real implementation without injected faults.
\* ====================================================================
INVARIANTS
    GuardCountNonNegative
    HandleCountNonNegative
    ValidPC
    ValidLocalState
    SealedBagsMonotone
    LocalPinnedWhenGuarded
    AdvanceRequiresAllPinnedAtCurrent
    LocalEpochBoundedByGlobal
    NoUseAfterRetire
    FinalizeDoesNotRecurse
