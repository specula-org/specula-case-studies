SPECIFICATION MCSpec

CONSTANTS
    Thread = {t1, t2}
    Object = {o1, o2}
    BagCapacity = 2
    MaxEpoch = 4
    PinLimit = 4
    AdvanceLimit = 2
    BuggyRetireLimit = 0
    SkipFenceLimit = 0
    DeferLimit = 2
    RepinAfterLimit = 1
    UnprotectedDeferLimit = 1
    SlotReuseLimit = 1
    StalledIterLimit = 1

CONSTRAINT StateConstraint

SYMMETRY Symmetry
VIEW View

\* ====================================================================
\* Standard safety + structural invariants (always checked)
\* ====================================================================
INVARIANTS
    MCGuardCountNonNegative
    MCHandleCountNonNegative
    MCValidPC
    MCValidLocalState
    MCSealedBagsMonotone
    MCLocalPinnedWhenGuarded
    MCAdvanceRequiresAllPinnedAtCurrent

\* ====================================================================
\* Bug-family extension invariants (enable per hunt config)
\* ====================================================================
\* INVARIANT MCRetireImpliesUnreachable      \* Family 2
\* INVARIANT MCNoUseAfterRetire              \* Family 2
\* INVARIANT MCLocalEpochBoundedByGlobal     \* Family 3
\* INVARIANT MCFinalizeDoesNotRecurse        \* Family 1
\* INVARIANT MCIsExpiredImpliesGap2          \* Family 5

CHECK_DEADLOCK FALSE
