SPECIFICATION Spec

CONSTANTS
    Thread = {t1, t2}
    Object = {o1}
    BagCapacity = 2
    MaxEpoch = 3

CONSTRAINT BaseConstraint

\* Structural-only invariants — base.cfg is a smoke test that the unbounded
\* spec is internally consistent.  Bug-family invariants (which the
\* adversarial actions like SkipFence and BuggyRetire deliberately break)
\* live in the hunt configs, not here.
INVARIANTS
    GuardCountNonNegative
    HandleCountNonNegative
    ValidPC
    ValidLocalState
    SealedBagsMonotone

CHECK_DEADLOCK FALSE
