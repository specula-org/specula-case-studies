\* MC_hunt_F5_stalled_advance.cfg
\* Family 5 — try_advance returns stale cached global on Stalled (Issue #566).
\* Hunts: IsExpiredImpliesGap2 (safety), and (separately) liveness under
\* fairness — but liveness is NOT in this safety-only config.

SPECIFICATION MCSpec

CONSTANTS
    Thread = {t1, t2}
    Object = {o1, o2}
    BagCapacity = 2
    MaxEpoch = 5
    PinLimit = 5
    AdvanceLimit = 3
    BuggyRetireLimit = 0
    SkipFenceLimit = 0
    DeferLimit = 2
    RepinAfterLimit = 0
    UnprotectedDeferLimit = 0
    SlotReuseLimit = 0
    StalledIterLimit = 2

CONSTRAINT StateConstraint
SYMMETRY Symmetry
VIEW View

INVARIANTS
    MCGuardCountNonNegative
    MCIsExpiredImpliesGap2
    MCNoUseAfterRetire

CHECK_DEADLOCK FALSE
