\* MC_hunt_F1_nested_pin.cfg
\* Family 1 — Reentrant pin / nested-protection epoch advance (Issue #105).
\* Hunts: NoEpochAdvanceDuringNestedPin via LocalPinnedWhenGuarded +
\*        FinalizeDoesNotRecurse + LocalEpochBoundedByGlobal.

SPECIFICATION MCSpec

CONSTANTS
    Thread = {t1, t2}
    Object = {o1}
    BagCapacity = 2
    MaxEpoch = 3
    PinLimit = 4
    AdvanceLimit = 2
    BuggyRetireLimit = 0
    SkipFenceLimit = 0
    DeferLimit = 2          \* allow defer-with-Pin body (re-entry)
    RepinAfterLimit = 0
    UnprotectedDeferLimit = 0
    SlotReuseLimit = 0
    StalledIterLimit = 0

CONSTRAINT StateConstraint
SYMMETRY Symmetry
VIEW View

INVARIANTS
    MCGuardCountNonNegative
    MCHandleCountNonNegative
    MCValidPC
    MCLocalPinnedWhenGuarded
    MCFinalizeDoesNotRecurse
    MCLocalEpochBoundedByGlobal

CHECK_DEADLOCK FALSE
