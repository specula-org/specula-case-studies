    MaxWAL = 2
    InitialSyncNumber = 1
    LeaseProfiles <- DefaultLeaseProfiles
    ManagerGrace = 30
    SmartDelay = 3
    FastDelay = 35
    TimerCap = 70
    FailoverQuorumEnabled = TRUE
    ArchiveEnabled = TRUE
    MaxMsgBuffer = 3
    ApiLimit = 2
    CancellationLimit = 1
    CrashesLimit = 2
    EvictionsLimit = 1
    HttpLimit = 1
    IoLimit = 1
    LeaseUpdatesLimit = 1
    OperatorAPILimit = 1
    OperatorCrashesLimit = 1
    PeerLimit = 1
    PlannedLimit = 1
    ProbeLimit = 1
    RequestsLimit = 2
    SignalsLimit = 1
    SqlLimit = 1
    SyncUpdatesLimit = 1
    UpgradesLimit = 1
    WalLimit = 2

\* Exported overrides also make base Next usable with the same budgets.
GenerateWAL <- MCGenerateWAL
RequestPlannedSwitchover <- MCRequestPlannedSwitchover
ManagerCancellation <- MCManagerCancellation
TerminationSignal <- MCTerminationSignal
OnlineUpgrade <- MCOnlineUpgrade
PodCrash <- MCPodCrash
PodEviction <- MCPodEviction
APIFailure <- MCAPIFailure
HTTPFailure <- MCHTTPFailure
ProbeFailure <- MCProbeFailure
ReplicationDisconnect <- MCReplicationDisconnect
PeerFailure <- MCPeerFailure
StorageStall <- MCStorageStall
SQLUnavailable <- MCSQLUnavailable
OperatorCrash <- MCOperatorCrash
OperatorAPIFailure <- MCOperatorAPIFailure
UpdateLeaseConfiguration <- MCUpdateLeaseConfiguration
UpdateSynchronousConfiguration <- MCUpdateSynchronousConfiguration
CHECK_DEADLOCK FALSE
CONSTRAINT MsgBufferConstraint
SYMMETRY Symmetry

