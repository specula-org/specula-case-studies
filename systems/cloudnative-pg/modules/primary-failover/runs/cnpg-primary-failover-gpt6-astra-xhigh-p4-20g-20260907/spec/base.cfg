SPECIFICATION Spec
CONSTANTS
    Server = {p1, p2, p3}
    MaxWAL = 2
    InitialSyncNumber = 1
    LeaseProfiles <- DefaultLeaseProfiles
    ManagerGrace = 30
    SmartDelay = 3
    FastDelay = 35
    TimerCap = 70
    FailoverQuorumEnabled = TRUE
    ArchiveEnabled = TRUE
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    DurableAcknowledgmentEvidence
    PhysicalStateCoherent
    AcquisitionStateCoherent
\* Extension checks are enabled by the corresponding MC_hunt_*.cfg files.
\* SingleWriter
\* AcknowledgedPrefixPreserved
\* CleanHandoffComplete
\* ConsistentPrimaryHistory
\* EventualUsablePrimary requires the recovery/fairness harness in MC.tla.
