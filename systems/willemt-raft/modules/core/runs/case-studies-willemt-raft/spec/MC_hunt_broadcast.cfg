\* MC_hunt_broadcast.cfg — Bug Family 6: Broadcast Starvation
\*
\* Targets:
\*   MC-6: send_appendentries_all early abort → follower starved
\*
\* Strategy: one node needs snapshot, leader broadcast aborts early,
\* remaining followers miss heartbeats and start unnecessary elections.
\* This is primarily a liveness issue but can cascade to safety.

CONSTANTS
    Nil = Nil
    Follower = Follower
    Candidate = Candidate
    Leader = Leader
    RequestVoteRequest = RequestVoteRequest
    RequestVoteResponse = RequestVoteResponse
    AppendEntriesRequest = AppendEntriesRequest
    AppendEntriesResponse = AppendEntriesResponse
    InstallSnapshotRequest = InstallSnapshotRequest
    NormalEntry = NormalEntry

    Server = {s1, s2, s3}
    Value = {v1}
    MaxLogLength = 4

    \* Tight bounds for broadcast starvation
    MaxTimeoutLimit = 5   \* Need follower timeout
    RequestLimit = 3      \* Create log divergence
    CrashLimit = 0
    LoseLimit = 3         \* Prevent AE from reaching lagging node
    DuplicateLimit = 0
    SnapshotLimit = 2     \* Create needs-snapshot condition
    BroadcastLimit = 6    \* Multiple broadcasts to show starvation pattern
    MaxMsgCount = 12

SYMMETRY ModelSymmetry

SPECIFICATION MCSpec

CONSTRAINT MsgBufferConstraint

INVARIANTS
    ElectionSafety
    NoCommittedEntryDeletion
