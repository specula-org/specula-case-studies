\* MC_hunt_vote.cfg — Bug Family 3: Vote Safety Violations
\*
\* Targets:
\*   MC-3: LoadSnapshot with term decrease → two leaders same term
\*   MC-4: LoadSnapshot bypasses vote persistence → double voting
\*   MC-9: Vote re-grant denial + message loss
\*
\* Strategy: snapshot load + crash-recovery to exploit persistence bypass.

CONSTANTS
    Nil = Nil
    Follower = Follower
    Candidate = Candidate
    Leader = Leader
    RequestVoteRequest = RequestVoteRequest
    RequestVoteResponse = RequestVoteResponse
    AppendEntriesRequest = AppendEntriesRequest
    AppendEntriesResponse = AppendEntriesResponse
    InstallSnapshotRequest = InstallSnapshotRequest
    NormalEntry = NormalEntry

    Server = {s1, s2, s3}
    Value = {v1}
    MaxLogLength = 3

    \* Tight bounds for vote safety hunting
    MaxTimeoutLimit = 5   \* Multiple elections for double-vote scenarios
    RequestLimit = 2
    CrashLimit = 2        \* Need crash-recovery for persistence bugs
    LoseLimit = 2
    DuplicateLimit = 1    \* Duplicate RV for re-grant denial test
    SnapshotLimit = 1     \* Need snapshot for term decrease bug
    BroadcastLimit = 4
    MaxMsgCount = 10

SYMMETRY ModelSymmetry

SPECIFICATION MCSpec

CONSTRAINT MsgBufferConstraint

INVARIANTS
    ElectionSafety
    VoteSafety

PROPERTIES
    TermNeverDecreases
