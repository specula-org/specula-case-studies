\* MC_hunt_snapshot.cfg — Bug Family 4: Snapshot/Compaction Lifecycle
\*
\* Targets:
\*   MC-7: Compacted entries re-appended via AE with prev_log_idx==0
\*   MC-8: last_log_term returns 0 after full compaction → no leader elected
\*   PR #118 Bugs 1-4, 8-9
\*
\* Strategy: snapshot + AE interaction. Need entries, compaction,
\* then election/AE to trigger the boundary bugs.

CONSTANTS
    Nil = Nil
    Follower = Follower
    Candidate = Candidate
    Leader = Leader
    RequestVoteRequest = RequestVoteRequest
    RequestVoteResponse = RequestVoteResponse
    AppendEntriesRequest = AppendEntriesRequest
    AppendEntriesResponse = AppendEntriesResponse
    InstallSnapshotRequest = InstallSnapshotRequest
    NormalEntry = NormalEntry

    Server = {s1, s2, s3}
    Value = {v1}
    MaxLogLength = 4

    \* Tight bounds for snapshot hunting
    MaxTimeoutLimit = 4
    RequestLimit = 3      \* Need entries to compact
    CrashLimit = 1
    LoseLimit = 2
    DuplicateLimit = 0
    SnapshotLimit = 2     \* Multiple snapshots for boundary exploration
    BroadcastLimit = 5
    MaxMsgCount = 10

SYMMETRY ModelSymmetry

SPECIFICATION MCSpec

CONSTRAINT MsgBufferConstraint

INVARIANTS
    ElectionSafety
    LogMatching
    NoCommittedEntryDeletion
    LogConsistency
