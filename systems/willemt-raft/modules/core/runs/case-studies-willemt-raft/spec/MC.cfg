\* MC.cfg — Standard convergence config for willemt/raft
\* Used to validate the spec (structural + standard invariants).
\* Bug-family extension invariants are COMMENTED OUT.

CONSTANTS
    \* Model values
    Nil = Nil
    Follower = Follower
    Candidate = Candidate
    Leader = Leader
    RequestVoteRequest = RequestVoteRequest
    RequestVoteResponse = RequestVoteResponse
    AppendEntriesRequest = AppendEntriesRequest
    AppendEntriesResponse = AppendEntriesResponse
    InstallSnapshotRequest = InstallSnapshotRequest
    NormalEntry = NormalEntry

    \* Server set: 3 servers for basic model checking
    Server = {s1, s2, s3}
    Value = {v1}
    MaxLogLength = 3

    \* Counter bounds (convergence BFS — completed in 74s, 18.9M states)
    MaxTimeoutLimit = 2
    RequestLimit = 1
    CrashLimit = 0
    LoseLimit = 0
    DuplicateLimit = 0
    SnapshotLimit = 0
    BroadcastLimit = 0
    MaxMsgCount = 4

SYMMETRY ModelSymmetry

SPECIFICATION MCSpec

CONSTRAINT MsgBufferConstraint

\* --- Standard protocol invariants ---
INVARIANTS
    TypeOK
    ElectionSafety
    LogConsistency
    CountersOK

\* --- Structural invariants ---
\*    CommitBound

\* --- Extension invariants (commented out for convergence) ---
\* Uncomment these one at a time for targeted bug hunting:
\*    LogMatching
\*    LeaderCompleteness
\*    VoteSafety
\*    NoCommittedEntryDeletion
\*    CommitMonotonicity

\* --- Temporal properties (expensive, enable selectively) ---
\* PROPERTIES
\*    TermNeverDecreases
\*    CommitNeverDecreases
