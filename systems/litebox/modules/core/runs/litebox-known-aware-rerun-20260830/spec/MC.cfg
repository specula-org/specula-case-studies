\* Convergence configuration: standard + structural invariants only.
\* Scenario/extension invariants are intentionally listed but commented out;
\* each is enabled in a dedicated MC_hunt_*.cfg.

CONSTANTS
    Thread = {t0, t1, t2}
    Node = {root_node, parent_node, cwd_node, node3, node4, node5}
    Path = {root_path, parent_path, cwd_path, child_path}
    Fd = {fd0, fd1}
    OFD = {ofd0, ofd1}
    MapAddr = {addr0}
    RootNode = root_node
    InitialParentNode = parent_node
    InitialCwdNode = cwd_node
    NoNode = no_node
    RootPath = root_path
    ParentPath = parent_path
    CwdPath = cwd_path
    ChildPath = child_path
    NoPath = no_path
    InitialFd = fd0
    InitialOFD = ofd0
    NoFd = no_fd
    NoOFD = no_ofd
    InitialMapAddr = addr0
    NoAddr = no_addr
    MainThread = t0
    NoThread = no_thread
    MaxGeneration = 4
    MaxOffset = 3
    MaxChunks = 2

    FSRequestLimit = 1
    FSMutationLimit = 1
    FDOperationLimit = 1
    FDReuseLimit = 1
    VMOperationLimit = 1
    VMMutationLimit = 1
    CloneStartLimit = 1
    SpawnFailureLimit = 1
    FutexWaitLimit = 1
    FutexWakeLimit = 1
    FutexChangeLimit = 1

SPECIFICATION MCSpec
CHECK_DEADLOCK FALSE

CONSTANTS
    ResolverParentDirAndName <- MCResolverParentDirAndName
    TaskSysChdirValidate <- MCTaskSysChdirValidate
    TaskResolvePathRelative <- MCTaskResolvePathRelative
    InMemRmdirAt <- MCInMemRmdirAt
    InMemRecreateAt <- MCInMemRecreateAt
    TaskChunkedReadBegin <- MCTaskChunkedReadBegin
    DescriptorsDuplicate <- MCDescriptorsDuplicate
    TaskSysGetdirent64Load <- MCTaskSysGetdirent64Load
    EpollFileAddInterest <- MCEpollFileAddInterest
    FilesStateCloseSlot <- MCFilesStateCloseSlot
    FilesStateReuseSlot <- MCFilesStateReuseSlot
    TaskDoMmapFileHost <- MCTaskDoMmapFileHost
    TaskMaybePatchOnMprotectExecCollect <- MCTaskMaybePatchOnMprotectExecCollect
    TaskSysMprotectRaw <- MCTaskSysMprotectRaw
    TaskSysMunmap <- MCTaskSysMunmap
    TaskDoClonePrepare <- MCTaskDoClonePrepare
    SnpLinuxKernelSpawnThreadFailure <- MCSnpLinuxKernelSpawnThreadFailure
    FutexManagerWaitInsert <- MCFutexManagerWaitInsert
    FutexManagerWakeBegin <- MCFutexManagerWakeBegin
    FutexSetValue <- MCFutexSetValue

SYMMETRY Symmetry
VIEW MCView

INVARIANTS
    MCTypeOK
    NamespaceIsATree
    SingleBindingPerFdSlot
    OFDRefCountsCorrect
    MappingRangesDisjoint
    WaitQueueDistinct

\* Scenario 1 extensions (enabled in MC_hunt_scenario_1_namespace.cfg)
\* INVARIANT ReachableCreate
\* INVARIANT CwdIdentityStable
\* Scenario 2 extensions (split across the three scenario_2 hunt cfgs)
\* INVARIANT OperationBindsOneOFD
\* INVARIANT AliasOffsetsShared
\* INVARIANT NoStaleEpollInterests
\* Scenario 3 extensions (enabled in MC_hunt_scenario_3_mapping_generation.cfg)
\* INVARIANT HostVmemAgreement
\* INVARIANT NoStalePatchPlan
\* Scenario 4 extensions (enabled in MC_hunt_scenario_4_clone_transaction.cfg)
\* INVARIANT ThreadCountMatchesAttachments
\* INVARIANT CloneFailureAtomic
\* Scenario 5 extension (enabled in MC_hunt_scenario_5_futex_quota.cfg)
\* INVARIANT WakeCountsValidatedWaiters
\* PROPERTY ValidWaiterEventuallyReturns
