\* Trace validation uses string-valued IDs emitted by the Rust harness.
CONSTANTS
    Thread = {"t0", "t1", "t2"}
    Node = {"root_node", "parent_node", "cwd_node", "node3", "node4", "node5"}
    Path = {"root_path", "parent_path", "cwd_path", "child_path"}
    Fd = {"fd0", "fd1"}
    OFD = {"ofd0", "ofd1"}
    MapAddr = {"addr0"}
    RootNode = "root_node"
    InitialParentNode = "parent_node"
    InitialCwdNode = "cwd_node"
    NoNode = "no_node"
    RootPath = "root_path"
    ParentPath = "parent_path"
    CwdPath = "cwd_path"
    ChildPath = "child_path"
    NoPath = "no_path"
    InitialFd = "fd0"
    InitialOFD = "ofd0"
    NoFd = "no_fd"
    NoOFD = "no_ofd"
    InitialMapAddr = "addr0"
    NoAddr = "no_addr"
    MainThread = "t0"
    NoThread = "no_thread"
    MaxGeneration = 4
    MaxOffset = 3
    MaxChunks = 2

SPECIFICATION TraceSpec
CHECK_DEADLOCK FALSE

INVARIANTS
    TraceTypeOK
    TraceStructuralSafety

PROPERTIES
    TraceMatched
