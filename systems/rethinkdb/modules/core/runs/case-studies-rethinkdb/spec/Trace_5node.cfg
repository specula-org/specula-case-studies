\* Trace_5node.cfg — Trace validation for 5-server traces
\* Used for basic_consensus.ndjson which has servers s1-s5

CONSTANTS
    Server = {"s1", "s2", "s3", "s4", "s5"}
    Value = {"v1"}
    Nil = "nil"
    MaxTerm = 100
    MaxLogLen = 100

INIT TraceInit

NEXT TraceNext

\* Standard safety invariants
INVARIANT ElectionSafety
INVARIANT LogTermMonotonicity
INVARIANT CommitIndexBound

\* Post-state validation
INVARIANT TracePostStateValid
