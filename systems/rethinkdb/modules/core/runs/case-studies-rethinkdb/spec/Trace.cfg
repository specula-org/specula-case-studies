\* Trace.cfg — Trace validation configuration for RethinkDB Raft
\* Uses INIT/NEXT for deadlock-based completion checking.
\* Deadlock at traceIdx = Len(TraceLog) + 1 means trace was fully consumed.
\* Deadlock at any other traceIdx indicates a mismatch.
\*
\* Override JSON file at runtime:
\*   java -jar tla2tools.jar -config Trace.cfg Trace \
\*        -DJSON=../traces/my_trace.ndjson

CONSTANTS
    Server = {"s1", "s2", "s3"}
    Value = {"v1"}
    Nil = "nil"
    MaxTerm = 100
    MaxLogLen = 100

INIT TraceInit

NEXT TraceNext

\* Standard safety invariants (validated during trace replay)
INVARIANT ElectionSafety
INVARIANT LogTermMonotonicity
INVARIANT CommitIndexBound

\* Post-state validation (deferred invariant approach)
INVARIANT TracePostStateValid
