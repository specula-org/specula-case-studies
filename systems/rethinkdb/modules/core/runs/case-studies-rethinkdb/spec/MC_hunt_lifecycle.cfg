\* MC_hunt_lifecycle.cfg — Hunting config for Bug Family 4: Raft Lifecycle Management
\* Target: MemberIdUniqueness, LeaderCompleteness
\* Mechanism: external erasure + re-enrollment with same ID creates false quorum

CONSTANTS
    Server = {s1, s2, s3}
    Value = {v1}
    Nil = Nil
    MaxTerm = 3
    MaxLogLen = 4

    \* Tight bounds: enable erase/reenroll, enough elections + replication
    MaxTimeoutCount = 3
    MaxCrashCount = 0
    MaxClientRequestCount = 2
    MaxLoseCount = 1
    MaxHeartbeatCount = 3
    MaxStopHeartbeatCount = 1
    MaxConfigChangeCount = 0
    MaxEraseCount = 2
    MaxReenrollCount = 2
    MaxDuplicateCount = 0
    MaxSnapshotCount = 0
    MaxMsgBuffer = 8

SPECIFICATION MCSpec

SYMMETRY MCSymmetry

CONSTRAINT MCStateConstraint

\* Core safety
INVARIANT ElectionSafety
INVARIANT StateMachineSafety

\* Target invariant
INVARIANT MemberIdUniqueness
