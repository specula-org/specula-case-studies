\* MC_hunt_snapshot.cfg — Hunting config for Bug Family 5: Snapshot-Log Consistency
\* Target: SnapshotLogConsistency, LogMatching
\* Mechanism: InstallSnapshot at boundary overlaps with existing log entries
\* Also tests MC-5 and MC-6 from modeling brief

CONSTANTS
    Server = {s1, s2, s3}
    Value = {v1}
    Nil = Nil
    MaxTerm = 4
    MaxLogLen = 5

    \* Tight bounds: enable snapshots + crash, minimize irrelevant actions
    MaxTimeoutCount = 4
    MaxCrashCount = 2
    MaxClientRequestCount = 3
    MaxLoseCount = 1
    MaxHeartbeatCount = 2
    MaxStopHeartbeatCount = 1
    MaxConfigChangeCount = 0
    MaxEraseCount = 0
    MaxReenrollCount = 0
    MaxDuplicateCount = 0
    MaxSnapshotCount = 3
    MaxMsgBuffer = 10

SPECIFICATION MCSpec

SYMMETRY MCSymmetry

CONSTRAINT MCStateConstraint

\* Core safety
INVARIANT ElectionSafety
INVARIANT StateMachineSafety
INVARIANT LogMatching

\* Target invariants
INVARIANT SnapshotLogConsistency
INVARIANT CommitIndexMonotonicity
INVARIANT SnapshotBound
INVARIANT CommitIndexBound
