\* MC_hunt_vhb.cfg — Hunting config for Bug Family 1: Virtual Heartbeat / Election Interaction
\* Target: VirtualHeartbeatTermConsistency, NoStaleLeaderCommit
\* Mechanism: stale VHBs from old term suppress elections, leader can't discover higher terms

CONSTANTS
    Server = {s1, s2, s3}
    Value = {v1}
    Nil = Nil
    MaxTerm = 4
    MaxLogLen = 4

    \* Tight bounds: maximize heartbeat/stop interactions, minimize irrelevant actions
    MaxTimeoutCount = 4
    MaxCrashCount = 1
    MaxClientRequestCount = 1
    MaxLoseCount = 2
    MaxHeartbeatCount = 8
    MaxStopHeartbeatCount = 5
    MaxConfigChangeCount = 0
    MaxEraseCount = 0
    MaxReenrollCount = 0
    MaxDuplicateCount = 0
    MaxSnapshotCount = 0
    MaxMsgBuffer = 8

SPECIFICATION MCSpec

SYMMETRY MCSymmetry

CONSTRAINT MCStateConstraint

\* Core safety
INVARIANT ElectionSafety

\* Target invariants
INVARIANT VirtualHeartbeatTermConsistency
INVARIANT NoStaleLeaderCommit
