\* Target: LeaseRead stale read WITH CheckQuorum enabled
\* Scenario: CheckQuorum passes (peers still active), then partition, then stale read

SPECIFICATION MCSpec

CONSTANTS
    s1 = s1
    s2 = s2
    s3 = s3
    Server = {s1, s2, s3}
    v1 = v1
    Value = {v1}
    Nil = Nil
    Follower = Follower
    PreCandidate = PreCandidate
    Candidate = Candidate
    Leader = Leader
    RequestVoteRequest = RequestVoteRequest
    RequestVoteResponse = RequestVoteResponse
    PreVoteRequest = PreVoteRequest
    PreVoteResponse = PreVoteResponse
    AppendEntriesRequest = AppendEntriesRequest
    AppendEntriesResponse = AppendEntriesResponse
    HeartbeatRequest = HeartbeatRequest
    HeartbeatResponse = HeartbeatResponse
    ReadOnlySafe = ReadOnlySafe
    ReadOnlyLeaseBased = ReadOnlyLeaseBased
    MaxReadCtx = 2

    \* LeaseRead + CheckQuorum (the realistic config)
    readOnlyOption = ReadOnlyLeaseBased
    checkQuorum = TRUE
    preVote = FALSE

    MaxTermLimit        = 3
    MaxTimeoutLimit     = 2
    RequestLimit        = 0
    HeartbeatLimit      = 3     \* Need heartbeats to set recentActive
    CrashLimit          = 0
    LoseLimit           = 2     \* Partition actions
    ReadRequestLimit    = 1
    CheckQuorumLimit    = 1     \* CheckQuorum passes once, then no more
    MaxMsgBufferLimit   = 8

SYMMETRY Symmetry
CHECK_DEADLOCK FALSE
CONSTRAINT MsgBufferConstraint

INVARIANTS
    ElectionSafety
    ReadIndexLinearizability
