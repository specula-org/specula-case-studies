\* MC_hunt_lease_ultra.cfg
\* Ultra-tight config for LeaseRead stale read.
\* Eliminates ALL irrelevant actions to minimize state space.

SPECIFICATION MCSpec

CONSTANTS
    s1 = s1
    s2 = s2
    s3 = s3

    Server = {s1, s2, s3}

    v1 = v1
    Value = {v1}

    Nil = Nil

    Follower    = Follower
    PreCandidate = PreCandidate
    Candidate   = Candidate
    Leader      = Leader

    RequestVoteRequest      = RequestVoteRequest
    RequestVoteResponse     = RequestVoteResponse
    PreVoteRequest          = PreVoteRequest
    PreVoteResponse         = PreVoteResponse
    AppendEntriesRequest    = AppendEntriesRequest
    AppendEntriesResponse   = AppendEntriesResponse
    HeartbeatRequest        = HeartbeatRequest
    HeartbeatResponse       = HeartbeatResponse

    ReadOnlySafe        = ReadOnlySafe
    ReadOnlyLeaseBased  = ReadOnlyLeaseBased

    MaxReadCtx = 2

    \* LeaseRead mode, NO CheckQuorum (so stale leader stays leader forever)
    readOnlyOption = ReadOnlyLeaseBased
    checkQuorum = FALSE
    preVote = FALSE

    \* Ultra-tight: exactly the minimum needed
    MaxTermLimit        = 3
    MaxTimeoutLimit     = 2     \* Two elections only
    RequestLimit        = 0     \* No client requests (noop-only commits)
    HeartbeatLimit      = 0     \* No heartbeats needed
    CrashLimit          = 0     \* No crashes
    LoseLimit           = 2     \* 1-2 partition actions
    ReadRequestLimit    = 1     \* One lease read
    CheckQuorumLimit    = 0     \* No CheckQuorum — key for stale leader
    MaxMsgBufferLimit   = 8

SYMMETRY Symmetry

CHECK_DEADLOCK
    FALSE

CONSTRAINT
    MsgBufferConstraint

INVARIANTS
    ElectionSafety
    ReadIndexLinearizability
