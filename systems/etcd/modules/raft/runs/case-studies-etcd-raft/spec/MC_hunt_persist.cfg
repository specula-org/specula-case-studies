\* MC_hunt_persist.cfg
\* Target: Family 2 — Persist-before-send (MC-3)
\* Strategy: Crash between action and persist to expose safety violations.
\* Tests whether deferred rejected responses are necessary for safety.

SPECIFICATION MCSpec

CONSTANTS
    s1 = s1
    s2 = s2
    s3 = s3

    Server = {s1, s2, s3}

    v1 = v1
    Value = {v1}

    Nil = Nil

    Follower    = Follower
    PreCandidate = PreCandidate
    Candidate   = Candidate
    Leader      = Leader

    RequestVoteRequest      = RequestVoteRequest
    RequestVoteResponse     = RequestVoteResponse
    PreVoteRequest          = PreVoteRequest
    PreVoteResponse         = PreVoteResponse
    AppendEntriesRequest    = AppendEntriesRequest
    AppendEntriesResponse   = AppendEntriesResponse
    HeartbeatRequest        = HeartbeatRequest
    HeartbeatResponse       = HeartbeatResponse

    ReadOnlySafe        = ReadOnlySafe
    ReadOnlyLeaseBased  = ReadOnlyLeaseBased

    MaxReadCtx = 2

    \* Config parameters
    readOnlyOption = ReadOnlySafe
    checkQuorum = TRUE
    preVote = TRUE

    \* Tight bounds: maximize crash/election, minimize reads
    MaxTermLimit        = 4
    MaxTimeoutLimit     = 5
    RequestLimit        = 2
    HeartbeatLimit      = 3
    CrashLimit          = 3         \* Key: multiple crashes to expose persist gaps
    LoseLimit           = 2
    ReadRequestLimit    = 0         \* No reads needed
    CheckQuorumLimit    = 0         \* No CheckQuorum needed
    MaxMsgBufferLimit   = 10


SYMMETRY Symmetry

CHECK_DEADLOCK
    FALSE

CONSTRAINT
    MsgBufferConstraint

\* Core safety + persist-before-send invariant
INVARIANTS
    ElectionSafety
    VoteSafety
    LeaderCompleteness
    StateMachineConsistency
    PersistBeforeSend
