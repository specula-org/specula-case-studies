SPECIFICATION MCSpec
CONSTANTS
    s1 = s1
    s2 = s2
    s3 = s3
    Server = {s1, s2, s3}
    v1 = v1
    Value = {v1}
    Nil = Nil
    Follower = Follower
    PreCandidate = PreCandidate
    Candidate = Candidate
    Leader = Leader
    RequestVoteRequest = RequestVoteRequest
    RequestVoteResponse = RequestVoteResponse
    PreVoteRequest = PreVoteRequest
    PreVoteResponse = PreVoteResponse
    AppendEntriesRequest = AppendEntriesRequest
    AppendEntriesResponse = AppendEntriesResponse
    HeartbeatRequest = HeartbeatRequest
    HeartbeatResponse = HeartbeatResponse
    ReadOnlySafe = ReadOnlySafe
    ReadOnlyLeaseBased = ReadOnlyLeaseBased
    MaxReadCtx = 1
    readOnlyOption = ReadOnlySafe
    checkQuorum = FALSE
    preVote = FALSE
    MaxTermLimit        = 4
    MaxTimeoutLimit     = 3
    RequestLimit        = 1
    HeartbeatLimit      = 0
    CrashLimit          = 2
    LoseLimit           = 1
    ReadRequestLimit    = 0
    CheckQuorumLimit    = 0
    MaxMsgBufferLimit   = 8
SYMMETRY Symmetry
CHECK_DEADLOCK FALSE
CONSTRAINT MsgBufferConstraint
INVARIANTS
    ElectionSafety
    VoteSafety
    LeaderCompleteness
    StateMachineConsistency
    PersistBeforeSend
