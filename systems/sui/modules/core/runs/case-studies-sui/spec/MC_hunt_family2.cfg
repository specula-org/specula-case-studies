\* Hunt config for Family 2: Amnesia recovery — f+1 vs 2f+1 threshold.
\* Brief §6.1 MC2 — recovering validator polls only f+1 stake of peers,
\* receives Byzantine + un-informed-honest reports, sets
\* lastKnownProposed below true highest signed round, then re-signs at
\* an already-signed round → own-equivocation.
\*
\* Trigger: HonestPropose at round r; Crash; RecoverAmnesia (responders
\*          underreport); HonestPropose at same round r again with new digest.
\*
\* Note: HonestPropose currently uses digest=1 always. To exercise this
\*       we need the post-recovery propose to legitimately want a NEW
\*       digest at the same round. Modeled by allowing the propose action
\*       to choose any digest; the spec uses digest=1, so the bug shows
\*       up only when the SAME (round, digest=1) is signed twice — which
\*       happens when after recovery the validator's lastKnownProposed
\*       allows it to re-issue at round r.

SPECIFICATION MCSpec

CONSTANTS
    Server = {"s1", "s2", "s3", "s4"}
    Byzantine = {"s4"}
    MaxRound = 4
    MaxDigest = 2
    MaxTimestamp = 1
    Nil = "Nil"

    WaveLength = 3
    GCDepth = 3

    Commit_ = "Commit"
    Skip_ = "Skip"
    Undecided_ = "Undecided"

    DirectDecision = "Direct"
    IndirectDecision = "Indirect"

    \* Tight bounds — only crash + recovery + Byzantine reports matter
    MaxByzProposeLimit = 1
    MaxCrashLimit = 1        \* one crash of an honest validator
    MaxRecoverLimit = 1      \* one recovery firing
    MaxCertCommitLimit = 0
    MaxForceProposeLimit = 0
    MaxDagSizeLimit = 14

\* SYMMETRY removed — Server uses strings.
VIEW ModelView
CONSTRAINT DagSizeConstraint

INVARIANTS
    TypeOK
    \* Family 2 primary invariant
    NoOwnEquivocation
