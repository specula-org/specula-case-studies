\* Hunt config for Family 3: GC × Commit Rule interactions.
\* Brief §6.1 MC3 — find_supported_block recurses through a weak-link
\* ancestor at round between leader_slot.round and gcRound[s], where
\* gcRound[s] differs across honest validators.
\*
\* Trigger: validators commit at different rates (different gcRound[s]);
\*          Byzantine block carries fabricated ancestor digests;
\*          recursive lookup hits missing block → CommitRecursionDecidable
\*          violated.

SPECIFICATION MCSpec

CONSTANTS
    Server = {"s1", "s2", "s3", "s4"}
    Byzantine = {"s4"}
    MaxRound = 5
    MaxDigest = 2
    MaxTimestamp = 1
    Nil = "Nil"

    WaveLength = 3
    GCDepth = 1            \* aggressive GC to surface divergent gc rounds

    Commit_ = "Commit"
    Skip_ = "Skip"
    Undecided_ = "Undecided"

    DirectDecision = "Direct"
    IndirectDecision = "Indirect"

    \* Tight bounds — Byzantine block production + multiple commits
    MaxByzProposeLimit = 3   \* enough for fabricated-ancestor blocks
    MaxCrashLimit = 0
    MaxRecoverLimit = 0
    MaxCertCommitLimit = 0
    MaxForceProposeLimit = 0
    MaxDagSizeLimit = 18

\* SYMMETRY removed — Server uses strings.
VIEW ModelView
CONSTRAINT DagSizeConstraint

INVARIANTS
    TypeOK
    \* Family 3 primary invariant
    CommitRecursionDecidable
