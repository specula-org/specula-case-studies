\* Hunt config for Family 1: Equivocation handling at (round, author) slot.
\* Brief §6.1 MC1 — two honest validators commit equivocating blocks in
\* different DFS-discovery order, producing different commit digests.
\*
\* Trigger: Byzantine validator produces 2 distinct digests at same slot;
\*          two honest validators receive them in different orders;
\*          both commit the leader; linearization includes both.

SPECIFICATION MCSpec

CONSTANTS
    Server = {"s1", "s2", "s3", "s4"}
    Byzantine = {"s4"}
    MaxRound = 5
    MaxDigest = 2          \* 2 digests per slot enables equivocation
    MaxTimestamp = 1
    Nil = "Nil"

    WaveLength = 3
    GCDepth = 3

    Commit_ = "Commit"
    Skip_ = "Skip"
    Undecided_ = "Undecided"

    DirectDecision = "Direct"
    IndirectDecision = "Indirect"

    \* Tight bounds — only Byzantine equivocation matters here
    \* Disk-budget constraints (no symmetry): keep state space < 30M states.
    MaxByzProposeLimit = 2   \* one equivocation pair at a single slot
    MaxCrashLimit = 0        \* disabled — F2 hunt
    MaxRecoverLimit = 0      \* disabled — F2 hunt
    MaxCertCommitLimit = 0   \* disabled — F4 hunt
    MaxForceProposeLimit = 0 \* disabled — F4 hunt
    MaxDagSizeLimit = 12

\* SYMMETRY removed — Server uses strings to match harness convention.
VIEW ModelView
CONSTRAINT DagSizeConstraint

INVARIANTS
    TypeOK
    \* Family 1 invariants
    CommitAgreement
    CommitDigestAgreement
    LeaderCommitMonotonic
