CONSTANT
    CoordinatorNode = {c1, c2}
    ShardNode = {s1, s2}
    DtxId = {d1, d2}
    UhsId = {u1, u2, u3}
    TxId = {t1, t2}
    BatchSize = 3
    IOEnv = [JSON |-> "../traces/trace.ndjson"]

INIT TraceInit
NEXT TraceNext

CHECK_DEADLOCK TRUE

INVARIANTS
    base!TypeOK
    base!InvUhsConsistent
    base!InvShardStateConsistent
    base!InvRSMDoneImpliesShardsDiscarded

PROPERTIES
    TraceMatched
