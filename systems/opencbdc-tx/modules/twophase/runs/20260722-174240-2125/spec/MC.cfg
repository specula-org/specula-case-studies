    MCUhsConsistent
    MCShardStateConsistent
    MCBatchConsistency

    \* Bug family invariants — commented out by default
    \* Activate per hunt cfg.
    \*
    \* Family 1 — Leader/Follower Asymmetry
    \* MCLeaderHasHandler
    \* MCHandlerOnlyWhenLeader
    \*
    \* Family 2 — Non-Atomic RSM Transitions
    \* MCRSMCommitImpliesShardsLocked
    \*
    \* Family 3 — Sentinel Communication Gaps
    \* MCNonLeaderRejectsRequest
    \*
    \* Family 6 — In-Memory Shard State Loss
    \* MCLockedNotInUhs
