\* MC.cfg — convergence config for round-2 spec.
\* Standard safety + structural invariants enabled; bug-family invariants
\* are listed but commented out.  Use MC_hunt_<family>.cfg for hunting.

CONSTANTS
    Thread = {t1, t2}
    Capacity = 2
    Mode = "MT"
    MaxBatch = 1
    HTDMax = 2
    NbStage = 1
    PosWrap = 4
    CntWrap = 2

    MaxStaleHeadRTS    = 0
    MaxStaleConsTail   = 0
    MaxStaleHeadSORing = 0
    MaxStaleTailSORing = 0
    MaxWrongReleaseN   = 0
    MaxFtokenWrap      = 0
    MaxMisuseAPI       = 0
    MaxMisuseFinishN   = 0

SPECIFICATION MCSpec

\* State constraint: prevent counter wraparound (Family D.4 is a known
\* "do not model" case per the modeling brief — real DPDK uses a 32-bit
\* counter where wrap requires 2^32 ops, which is impractical to model).
\* nextVal is monotonic; capping it here keeps prodHead / consHead well
\* below PosWrap so the CAS uniqueness invariant holds during convergence.
CONSTRAINT
    BoundedRun

INVARIANTS
    \* Standard safety
    MC_ConsumedWasPushed
    MC_NoDoublePop
    \* Structural
    TypeOK
    ThreadAtomic
    \* Bug-family invariants — commented out for convergence run.
    \* MC_RTSPosCntConsistent
    \* MC_APIContractConsistent
    \* MC_DefaultPartialOrder
    \* MC_SORingStageOrdered
    \* MC_SORingNoStuckFinalize
    \* MC_SORingReleaseExact
    \* MC_SORingFtokenUnique
    \* MC_PeekRollbackAtomic

\* PROPERTIES
    \* EventuallyQuiescent
    \* EventuallyFinalized

SYMMETRY Symmetry
VIEW View
