\* Trace.cfg — drives TLC to replay a recorded NDJSON trace through the
\* base spec.

CONSTANTS
    \* Use string identifiers so they match JSON keys emitted by the
    \* harness's merge_traces.py preprocessor.  TLC bare identifiers are
    \* model values that don't equate to JSON strings.
    Thread = {"t1", "t2"}
    Capacity = 2
    Mode = "RTS"
    MaxBatch = 1
    HTDMax = 2
    NbStage = 1
    PosWrap = 4
    CntWrap = 2

SPECIFICATION TraceSpec

INVARIANTS
    T_ConsumedWasPushed
    T_NoDoublePop
    T_DefaultPartialOrder
    T_SORingStageOrdered
    T_SORingFtokenUnique
    T_TypeOK
    T_ThreadAtomic

PROPERTIES
    TraceMatched
