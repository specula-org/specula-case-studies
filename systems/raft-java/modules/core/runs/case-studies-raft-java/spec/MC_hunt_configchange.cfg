\* MC_hunt_configchange.cfg — Bug Family 5: Config change safety
\* Target: multi-server add without joint consensus allows split brain.
\* Expected violation: ElectionSafety (two leaders in same term from disjoint majorities)
SPECIFICATION MCSpecDynamic

CONSTANTS
    s1 = s1
    s2 = s2
    s3 = s3

    Server = {s1, s2, s3}

    \* Tight bounds: maximize config changes + elections
    MaxTermLimit        = 4
    MaxPreVoteLimit     = 4
    MaxTimeoutLimit     = 4
    RequestLimit        = 1
    CrashLimit          = 0
    LoseLimit           = 2
    AppendEntriesLimit  = 4
    SnapshotLimit       = 0
    TakeSnapshotLimit   = 0
    ConfigChangeLimit   = 2
    MaxMsgBufferLimit   = 10

    StartPreVote         <- MCStartPreVote
    StartVote            <- MCStartVote
    ClientRequest        <- MCClientRequest
    Crash                <- MCCrash
    LoseMessage          <- MCLoseMessage
    AppendEntries        <- MCAppendEntries
    SendInstallSnapshot  <- MCSendInstallSnapshot
    TakeSnapshot         <- MCTakeSnapshot
    ProposeConfigChange  <- MCProposeConfigChange

    Nil = Nil
    Follower      = Follower
    PreCandidate  = PreCandidate
    Candidate     = Candidate
    Leader        = Leader
    ValueEntry  = ValueEntry
    ConfigEntry = ConfigEntry
    PreVoteRequest          = PreVoteRequest
    PreVoteResponse         = PreVoteResponse
    RequestVoteRequest      = RequestVoteRequest
    RequestVoteResponse     = RequestVoteResponse
    AppendEntriesRequest    = AppendEntriesRequest
    AppendEntriesResponse   = AppendEntriesResponse
    InstallSnapshotRequest  = InstallSnapshotRequest
    InstallSnapshotResponse = InstallSnapshotResponse

SYMMETRY Symmetry

CHECK_DEADLOCK FALSE

CONSTRAINT MsgBufferConstraint

INVARIANTS
    ElectionSafety
    ConfigChangeSafety
