\* MC_hunt_persist.cfg — Bug Family 1: Non-atomic persistence in startVote
\* Target: crash between startVote (no persist) and stepDown (persist).
\* Expected violation: NoDualVoteFromCrashInv, ElectionSafety, NoOrphanedElectionRPCs
SPECIFICATION MCSpec

CONSTANTS
    s1 = s1
    s2 = s2
    s3 = s3

    Server = {s1, s2, s3}

    \* Tight bounds: maximize elections + crashes, minimize everything else
    MaxTermLimit        = 3
    MaxPreVoteLimit     = 4
    MaxTimeoutLimit     = 4
    RequestLimit        = 1
    CrashLimit          = 2
    LoseLimit           = 1
    AppendEntriesLimit  = 2
    SnapshotLimit       = 0
    TakeSnapshotLimit   = 0
    ConfigChangeLimit   = 0
    MaxMsgBufferLimit   = 8

    StartPreVote         <- MCStartPreVote
    StartVote            <- MCStartVote
    ClientRequest        <- MCClientRequest
    Crash                <- MCCrash
    LoseMessage          <- MCLoseMessage
    AppendEntries        <- MCAppendEntries
    SendInstallSnapshot  <- MCSendInstallSnapshot
    TakeSnapshot         <- MCTakeSnapshot
    ProposeConfigChange  <- MCProposeConfigChange

    Nil = Nil
    Follower      = Follower
    PreCandidate  = PreCandidate
    Candidate     = Candidate
    Leader        = Leader
    ValueEntry  = ValueEntry
    ConfigEntry = ConfigEntry
    PreVoteRequest          = PreVoteRequest
    PreVoteResponse         = PreVoteResponse
    RequestVoteRequest      = RequestVoteRequest
    RequestVoteResponse     = RequestVoteResponse
    AppendEntriesRequest    = AppendEntriesRequest
    AppendEntriesResponse   = AppendEntriesResponse
    InstallSnapshotRequest  = InstallSnapshotRequest
    InstallSnapshotResponse = InstallSnapshotResponse

SYMMETRY Symmetry

CHECK_DEADLOCK FALSE

CONSTRAINT MsgBufferConstraint

INVARIANTS
    ElectionSafety
    NoDualVoteFromCrashInv
    NoOrphanedElectionRPCs
