SPECIFICATION MCSpec

CONSTANTS
    s1 = s1
    s2 = s2
    s3 = s3

    Server = {s1, s2, s3}

    \* Constraint limits — tuned for tractable state space with 3 servers
    MaxTermLimit        = 4
    MaxPreVoteLimit     = 5
    MaxTimeoutLimit     = 5
    RequestLimit        = 3
    CrashLimit          = 2
    LoseLimit           = 3
    AppendEntriesLimit  = 6
    SnapshotLimit       = 2
    TakeSnapshotLimit   = 2
    ConfigChangeLimit   = 0
    MaxMsgBufferLimit   = 10

    \* Action overrides (inject counter constraints via operator replacement)
    StartPreVote         <- MCStartPreVote
    StartVote            <- MCStartVote
    ClientRequest        <- MCClientRequest
    Crash                <- MCCrash
    LoseMessage          <- MCLoseMessage
    AppendEntries        <- MCAppendEntries
    SendInstallSnapshot  <- MCSendInstallSnapshot
    TakeSnapshot         <- MCTakeSnapshot
    ProposeConfigChange  <- MCProposeConfigChange

    \* Type constants
    Nil = Nil

    Follower      = Follower
    PreCandidate  = PreCandidate
    Candidate     = Candidate
    Leader        = Leader

    ValueEntry  = ValueEntry
    ConfigEntry = ConfigEntry

    PreVoteRequest          = PreVoteRequest
    PreVoteResponse         = PreVoteResponse
    RequestVoteRequest      = RequestVoteRequest
    RequestVoteResponse     = RequestVoteResponse
    AppendEntriesRequest    = AppendEntriesRequest
    AppendEntriesResponse   = AppendEntriesResponse
    InstallSnapshotRequest  = InstallSnapshotRequest
    InstallSnapshotResponse = InstallSnapshotResponse

SYMMETRY Symmetry

CHECK_DEADLOCK
    FALSE

\* ============================================================================
\* State Space Pruning
\* ============================================================================
CONSTRAINT
    MsgBufferConstraint

\* ============================================================================
\* Core Raft Safety Invariants
\* ============================================================================
INVARIANTS
    ElectionSafety
    LogMatching
\*  LeaderCompleteness  \* Violated downstream from Bug Family 2 (inflated commitIndex)

\* ============================================================================
\* Structural Invariants
\* ============================================================================
INVARIANTS
    PersistedTermConsistencyInv
\*  CommitIndexBoundInv           \* Violated downstream from Bug Family 2
    CandidateVotedForSelfInv
    LeaderTermPositiveInv
    VotePhaseSeparationInv
    ConfigValidInv

\* ============================================================================
\* Bug Detection Invariants
\* Enable to reproduce violations for specific bug families.
\* ============================================================================
\* INVARIANTS
\*     NoOrphanedElectionRPCs
\*     NoDualVoteFromCrashInv
\*     SnapshotConfigConsistencyInv

\* ============================================================================
\* Temporal Properties (core, not bug-detection)
\* ============================================================================
PROPERTIES
    MonotonicTermProp
    LeaderAppendOnlyProp
    LeaderCommitCurrentTermLogsProp

\* Bug-detection properties (moved to hunting configs):
\*     MonotonicCommitIndexProp   — Bug Family 2
\*     MonotonicMatchIndexProp    — Bug Family 2
