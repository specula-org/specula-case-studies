\* Small exhaustive calibration: one Activity/one attempt, finite timers, one worker result.
SPECIFICATION MCSpec
CHECK_DEADLOCK FALSE
CONSTANTS
 ActivityCount = 1
 Workers = {w1,w2}
 NamespaceVersion = 0
 IncrementRetryStamp = FALSE
 HasRetryPolicy = TRUE
 MaximumAttempts = 1
 InitialInterval = 1
 BackoffCoefficient = 2
 MaximumInterval = 2
 ScheduleToStart = 1
 StartToClose = 1
 ScheduleToClose = 2
 Heartbeat = 1
 WorkflowExpiration = 0
 KeepInitialWFT = FALSE
 InitialDBVersion = 1
 TimeLimit = 2
 RequestLimit = 1
 HeartbeatLimit = 0
 CancelLimit = 0
 CloseLimit = 0
 CacheLossLimit = 0
 ShardLossLimit = 0
 StorageFaultLimit = 0
 ResponseLossLimit = 0
 DuplicateDispatchLimit = 0
 DuplicateStartLimit = 0
 RedeliveryLimit = 0
 MaxMessageBuffer = 3

TaskKeyFloors <- MCTaskKeyFloors
AdvanceTime <- MCAdvanceTime
ClearWorkflowCache <- MCClearWorkflowCache
LoseShardContext <- MCLoseShardContext
PersistenceTimeoutBeforeWrite <- MCPersistenceTimeoutBeforeWrite
PersistenceResponseTimeout <- MCPersistenceResponseTimeout
RetryPersistenceAfterUnavailable <- MCRetryPersistenceAfterUnavailable
RejectPersistenceWrite <- MCRejectPersistenceWrite
LoseAPIResponse <- MCLoseAPIResponse
RedeliverTask <- MCRedeliverTask
LoseAddActivityTaskResponse <- MCLoseAddActivityTaskResponse
RetryRecordActivityTaskStarted <- MCRetryRecordActivityTaskStarted
SendActivityRequest <- MCSendActivityRequest
HandleCommandRequestCancelActivity <- MCHandleCommandRequestCancelActivity
HandleCommandCancelBufferedActivity <- MCHandleCommandCancelBufferedActivity
HandleCommandCancelAndCompleteWorkflow <- MCHandleCommandCancelAndCompleteWorkflow
HandleCommandCompleteWorkflow <- MCHandleCommandCompleteWorkflow
HandleCommandCompleteWorkflowRejected <- MCHandleCommandCompleteWorkflowRejected
TimeSuccessors <- MCTimeSuccessors
CONSTRAINT MessageBound
SYMMETRY Symmetry
VIEW MCSafetyView

INVARIANTS
 MCTypeOK
 SingleTerminalOutcome
 CacheMatchesDurableWhenIdle
 TerminalActivityInfoDeleted
 TaskIDsUnique
 StaleTokenDoesNotMutateCurrentAttempt
 AcknowledgedOutcomeSurvivesFencedReload
 TimerAndRetryWorkCovered
 TerminalResultHasWorkflowResponsibility
 FencedReadbackAgrees

