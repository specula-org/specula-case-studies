\* MC.cfg: explicit finite capacities; no deterministic action counters.
SPECIFICATION MCSpec
CONSTANTS
  TaskCount = 3
  OwnerCount = 2
  Groups = {g1, g2}
  SliceSlots = 10
  ExecSlots = 6
  SnapshotSlots = 2
  BatchSize = 1
  MaxEpoch = 2
  MoveThreshold = 2
  PredicateLimit = 0
  ShrinkKeys = 2
  UnexpectedLimit = 2
  DLQEnabled = TRUE
  BufferLimit = 11
  RequestLimit = 3
  WriteFailLimit = 1
  PubTimeoutLimit = 1
  NoticeLossLimit = 1
  TakeoverLimit = 1
  StopLimit = 1
  DeleteFailLimit = 1
  DeleteLossLimit = 1
  ShardFailLimit = 1
  ShardLossLimit = 1
  RetryLimit = 1
  UnexpectedFaultLimit = 2
  TerminalErrorLimit = 1
  TerminalDropLimit = 0
  MatchingLossLimit = 1
  DlqLossLimit = 1
\* Overrides only inject scenario fault/client initiations; Base! bypasses overrides.
SetAndTrackTaskKeys <- MCSetAndTrackTaskKeys
UpdateWorkflowExecutionFail <- MCUpdateWorkflowExecutionFail
TaskRequestTimeout <- MCTaskRequestTimeout
DropNotification <- MCDropNotification
AcquireShardBegin <- MCAcquireShardBegin
StopReaderGroup <- MCStopReaderGroup
RangeCompleteTasksFail <- MCRangeCompleteTasksFail
RangeCompleteTasksLostReply <- MCRangeCompleteTasksLostReply
UpdateShardFail <- MCUpdateShardFail
UpdateShardLostReply <- MCUpdateShardLostReply
ExecuteRetryableError <- MCExecuteRetryableError
ExecuteUnexpectedError <- MCExecuteUnexpectedError
ExecuteTerminalError <- MCExecuteTerminalError
MatchingTerminalDiscard <- MCMatchingTerminalDiscard
MatchingLostReply <- MCMatchingLostReply
EnqueueTaskLostReply <- MCEnqueueTaskLostReply
CHECK_DEADLOCK FALSE
SYMMETRY Symmetry
CONSTRAINT BufferConstraint
INVARIANTS
  MCTypeOK
  ReaderStructure
  NoPhantomEffect
  CompletedWasStarted
  AckDisposition
\* Scenario invariants stay off during convergence.
\* INVARIANT AtomicPublication
\* INVARIANT SafeReadFrontier
\* INVARIANT UnfinishedObligationCovered
\* INVARIANT SafeImmediateDeletion
\* INVARIANT CurrentEpochWrites
\* INVARIANT LiveCursorSoundness
\* INVARIANT RecoverableScopeCoverage
