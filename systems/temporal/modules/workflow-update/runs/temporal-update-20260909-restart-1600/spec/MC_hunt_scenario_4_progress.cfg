\* MC-2 / S4 progress companion; same explicit fair-service assumptions; finite ignore/dispatch faults.
SPECIFICATION MCProgressSpec
CONSTANTS
    Updates = {u1}
    Values = {v1,v2}
    Clients = {c1,c2}
    Hosts = {h1}
    InitialHost = h1
    NamespaceID = "namespace"
    WorkflowID = "workflow"
    RunID = "run"
    EventVersion = 1
    HostCacheEnabled = TRUE
    FaultLimits <- MC_hunt_scenario_4_progressLimits
    MaxNextEvent = 22
    MaxGeneration = 5
    MaxObjects = 8
    MaxTimers = 8
    MaxWorkerMessages = 6
    MaxMessageBuffer = 4
    MaxRecordVersion = 9
CHECK_DEADLOCK FALSE
INVARIANTS
    DurableMetadataReferencesCommittedHistory
    NoSpeculativeTaskPersisted
    CurrentTaskOwnsAcceptedCompletion
PROPERTIES
    CommittedResultRemainsQueryable
    RetriedEligibleUpdateMakesProgress
