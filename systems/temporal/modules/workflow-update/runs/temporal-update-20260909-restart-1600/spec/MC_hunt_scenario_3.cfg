\* S3 / MC-1 and MC-3: mixed ordered effects, final closure and independently delayed waiters.
SPECIFICATION MCSpec
CONSTANTS
    Updates = {u1,u2}
    Values = {v1,v2}
    Clients = {c1,c2,c3,c4}
    Hosts = {h1}
    InitialHost = h1
    NamespaceID = "namespace"
    WorkflowID = "workflow"
    RunID = "run"
    EventVersion = 1
    HostCacheEnabled = TRUE
    FaultLimits <- MC_hunt_scenario_3Limits
    MaxNextEvent = 22
    MaxGeneration = 5
    MaxObjects = 8
    MaxTimers = 8
    MaxWorkerMessages = 6
    MaxMessageBuffer = 4
    MaxRecordVersion = 9
SYMMETRY MCSymmetry
CONSTRAINT MCConstraint
CHECK_DEADLOCK FALSE
INVARIANTS
    DurableMetadataReferencesCommittedHistory
    NoSpeculativeTaskPersisted
    AcceptedReceiptHasDurableAcceptance
    SuccessfulOutcomeMatchesCommittedResult
    SuccessfulOutcomesAgree
    DurableOutcomeMatchesCommittedResult
    DurableOutcomesAgree
