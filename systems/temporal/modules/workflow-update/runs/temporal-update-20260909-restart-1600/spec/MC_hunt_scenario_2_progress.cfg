\* MC-2 progress companion: no search-frontier constraints or symmetry; eligible timers, service, capable workers and client retries are fair.
SPECIFICATION MCProgressSpec
CONSTANTS
    Updates = {u1}
    Values = {v1,v2}
    Clients = {c1,c2}
    Hosts = {h1}
    InitialHost = h1
    NamespaceID = "namespace"
    WorkflowID = "workflow"
    RunID = "run"
    EventVersion = 1
    HostCacheEnabled = TRUE
    FaultLimits <- MC_hunt_scenario_2_progressLimits
    MaxNextEvent = 22
    MaxGeneration = 5
    MaxObjects = 8
    MaxTimers = 8
    MaxWorkerMessages = 6
    MaxMessageBuffer = 4
    MaxRecordVersion = 9
CHECK_DEADLOCK FALSE
INVARIANTS
    DurableMetadataReferencesCommittedHistory
    NoSpeculativeTaskPersisted
    CurrentTaskOwnsAcceptedCompletion
PROPERTIES
    CommittedResultRemainsQueryable
    RetriedEligibleUpdateMakesProgress
