\* MC-4 focused: A cache insertion + known noncommit; H1->H2 commit B at reused ID ->H1 lookup. No restart/eviction fault is required.
SPECIFICATION MCSpec
CONSTANTS
    Updates = {u1,u2}
    Values = {v1,v2}
    Clients = {c1,c2}
    Hosts = {h1,h2}
    InitialHost = h1
    NamespaceID = "namespace"
    WorkflowID = "workflow"
    RunID = "run"
    EventVersion = 1
    HostCacheEnabled = TRUE
    FaultLimits <- MC_hunt_MC_4_cacheLimits
    MaxNextEvent = 22
    MaxGeneration = 7
    MaxObjects = 10
    MaxTimers = 8
    MaxWorkerMessages = 6
    MaxMessageBuffer = 4
    MaxRecordVersion = 9
SYMMETRY MCSymmetry
CONSTRAINT MCConstraint
CHECK_DEADLOCK FALSE
INVARIANTS
    DurableMetadataReferencesCommittedHistory
    NoSpeculativeTaskPersisted
    SuccessfulOutcomeMatchesCommittedResult
    DurableOutcomeMatchesCommittedResult
