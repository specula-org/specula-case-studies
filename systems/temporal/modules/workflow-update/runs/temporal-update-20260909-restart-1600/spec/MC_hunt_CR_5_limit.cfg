\* CR-5 semantic control: early closing failure, failed limit termination, explicit RestoreHistoryLimit, later success. No durable-close invariant.
SPECIFICATION MCSpec
CONSTANTS
    Updates = {u1}
    Values = {v1,v2}
    Clients = {c1,c2}
    Hosts = {h1}
    InitialHost = h1
    NamespaceID = "namespace"
    WorkflowID = "workflow"
    RunID = "run"
    EventVersion = 1
    HostCacheEnabled = TRUE
    FaultLimits <- MC_hunt_CR_5_limitLimits
    MaxNextEvent = 22
    MaxGeneration = 5
    MaxObjects = 8
    MaxTimers = 8
    MaxWorkerMessages = 6
    MaxMessageBuffer = 4
    MaxRecordVersion = 9
SYMMETRY MCSymmetry
CONSTRAINT MCConstraint
CHECK_DEADLOCK FALSE
INVARIANTS
    DurableMetadataReferencesCommittedHistory
    NoSpeculativeTaskPersisted
    AcceptedReceiptHasDurableAcceptance
    SuccessfulOutcomeMatchesCommittedResult
    SuccessfulOutcomesAgree
    DurableOutcomeMatchesCommittedResult
    DurableOutcomesAgree
