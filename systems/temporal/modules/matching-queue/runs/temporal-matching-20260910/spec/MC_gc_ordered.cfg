\* MC.cfg; SQL TaskStore V1 / SQLite, priority 3, write batch size 1.
SPECIFICATION OrderedSpec
CHECK_DEADLOCK FALSE
CONSTANTS
 Owners = {1, 2}
 InitialOwner = 1
 Work = {w1, w2}
 CallIds = {1, 2}
 Pollers = {1, 2}
 StartIds = {1, 2, 3, 4}
 RangeSize = 2
 BatchSize = 3
 ReloadAt = 1
 DeleteBatchSize = 2
 RangeLimit = 3
 RecordLimit = 3
 BufferLimit = 10
 AddLimit = 2
 CrashLimit = 0
 ExpiryLimit = 0
 HistoryFailLimit = 0
 LossLimit = 0
 ObsoleteLimit = 0
 ReadFailLimit = 0
 StopLimit = 0
 StoreFailLimit = 0
 SyncLimit = 1
 TakeoverLimit = 1
 UncertainLimit = 0
CONSTRAINT StateConstraint
VIEW ScenarioView
INVARIANTS TypeOK MCTypeOK RecordIdentity ReaderAccounting CursorOrder RangeConditionalWrite AcceptedWorkCovered AckPrefixSound DeletionSound ReplacementBeforeRelease PerOwnerCursorMonotonic
CONSTANTS w1 = w1 w2 = w2
