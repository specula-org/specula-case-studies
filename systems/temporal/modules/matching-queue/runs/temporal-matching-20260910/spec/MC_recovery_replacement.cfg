 RecordLimit = 3
 BufferLimit = 10
 AddLimit = 1
 CrashLimit = 0
 ExpiryLimit = 0
 HistoryFailLimit = 1
 LossLimit = 0
 ObsoleteLimit = 0
 ReadFailLimit = 0
 StopLimit = 0
 StoreFailLimit = 0
 SyncLimit = 1
