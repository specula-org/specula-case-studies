\* Small complete generation-time sanity check, not a protocol hunt.
SPECIFICATION MCSpec
CONSTANTS
  N = 3
  Clients = {c1}
  Operations = {1, 2}
  PrimaryTimeout = 2
  RequestLimit = 1
  IdleLimit = 1
  ClientIdleLimit = 0
  CrashLimit = 0
  LoseLimit = 0
  DuplicateLimit = 0
  MaxView = 1
  MaxMessages = 10
ClientOnRequest <- MCClientOnRequest
OnIdle <- MCOnIdle
ClientOnIdle <- MCClientOnIdle
Crash <- MCCrash
Lose <- MCLose
Duplicate <- MCDuplicate
VIEW MCView
CONSTRAINT MCConstraint
CHECK_DEADLOCK FALSE
INVARIANTS MCTypeOK DurableViewConsistent CommittedPrefixAgreement CommitBounded AppliedPrefix AtMostOnce ReplyCorrect
