SPECIFICATION MCSpec
CONSTANTS
  N = 3
  Clients = {c1, c2}
  Operations = {1, 2}
  PrimaryTimeout = 2
  RequestLimit = 2
  IdleLimit = 4
  ClientIdleLimit = 1
  CrashLimit = 1
  LoseLimit = 1
  DuplicateLimit = 1
  MaxView = 2
  MaxMessages = 12
ClientOnRequest <- MCClientOnRequest
OnIdle <- MCOnIdle
ClientOnIdle <- MCClientOnIdle
Crash <- MCCrash
Lose <- MCLose
Duplicate <- MCDuplicate
SYMMETRY MCSymmetry
VIEW MCView
CONSTRAINT MCConstraint
CHECK_DEADLOCK FALSE
\* Standard safety.
INVARIANTS CommittedPrefixAgreement CommitBounded AppliedPrefix AtMostOnce ReplyCorrect
\* Structural/convergence checks.
INVARIANTS MCTypeOK DurableViewConsistent
\* Scenario extensions: NONE SELECTED by brief 3.2/4/6.1.
\* RestartMustRecover: EX-START direct test handoff (not modeled).
\* PublishedViewDurable: EX-FSYNC filesystem contract handoff (not modeled).
\* RecoveryNonceFresh: EX-NONCE allocator/transport handoff (not modeled).
\* PROPERTY ClientProgress -- not enabled; no stabilization/fairness witness.
