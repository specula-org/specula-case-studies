SPECIFICATION MCSpec
CONSTANTS
  Server = {0,1,2}
  Clients = {c0,c1}
  Values = {"A","AA","B"}
  FullValue = "AA"
  PrefixValue = "A"
  PrimaryTimeout = 3
  FailureBudget = 1
  IntegrationMode = FALSE
  TickLimit = 0
  RequestLimit = 3
  CrashLimit = 1
  LossLimit = 0
  DuplicateLimit = 0
  RetryLimit = 0
  PartialLimit = 0
  ReadErrorLimit = 0
  MaxView = 6
  MaxLog = 5
  MaxNetwork = 24
  LiveMode = TRUE
  StableHealthy = {1,2}

OnIdle <- MCOnIdle
Crash <- MCCrash
LoseMessage <- MCLoseMessage
ClientOnRequest <- MCClientOnRequest
ClientOnIdle <- MCClientOnIdle
RunSenderBeginPartial <- MCPartial
RunPeerAcceptorReadError <- MCReadError
CONSTRAINT StateConstraint
VIEW MCView
CHECK_DEADLOCK FALSE

INVARIANTS
  CommittedPrefixAgreement
  DistinctQuorumAndPrimary
  NoAssertionFailure
  LivenessBoundsNotReached

PROPERTIES
  StableMajorityServesNewWork
  RecoveryCompletesUnderStability
  BoundedNewWorkIsAdmitted
