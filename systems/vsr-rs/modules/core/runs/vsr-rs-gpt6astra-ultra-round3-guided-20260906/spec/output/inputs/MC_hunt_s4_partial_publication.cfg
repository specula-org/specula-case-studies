SPECIFICATION MCSpec
CONSTANTS
  Server = {0,1,2}
  Clients = {c0,c1}
  Values = {"A","AA","B"}
  FullValue = "AA"
  PrefixValue = "A"
  PrimaryTimeout = 3
  FailureBudget = 1
  IntegrationMode = FALSE
  TickLimit = 22
  RequestLimit = 3
  CrashLimit = 2
  LossLimit = 0
  DuplicateLimit = 1
  RetryLimit = 4
  PartialLimit = 0
  ReadErrorLimit = 0
  MaxView = 5
  MaxLog = 4
  MaxNetwork = 20
  LiveMode = FALSE
  StableHealthy = {0,1,2}

OnIdle <- MCOnIdle
Crash <- MCCrash
LoseMessage <- MCLoseMessage
ClientOnRequest <- MCClientOnRequest
ClientOnIdle <- MCClientOnIdle
RunSenderBeginPartial <- MCPartial
RunPeerAcceptorReadError <- MCReadError
CONSTRAINT StateConstraint
VIEW MCView
CHECK_DEADLOCK FALSE
SYMMETRY Symmetry

INVARIANTS
  CommittedPrefixAgreement
  DistinctQuorumAndPrimary
  NoAssertionFailure
  CommittedHistorySurvives
  ClientLinearizability
  DurableViewFloor
  NoDuplicateExecution
