SPECIFICATION TraceSpec
CONSTANTS
  Server <- TraceServers
  Clients <- TraceClients
  Values <- TraceValues
  PrimaryTimeout <- TraceTimeout
  FailureBudget <- TraceFailureBudget
  IntegrationMode <- TraceIntegration
  FullValue <- TraceFullValue
  PrefixValue <- TracePrefixValue
INVARIANTS TypeOK NoAssertionFailure DistinctQuorumAndPrimary DurableViewFloor
PROPERTIES TraceMatched
CHECK_DEADLOCK FALSE
\* Agreement/linearizability are hunt properties. Trace replay of the known
\* integration defect must match implementation behavior through its failure.
