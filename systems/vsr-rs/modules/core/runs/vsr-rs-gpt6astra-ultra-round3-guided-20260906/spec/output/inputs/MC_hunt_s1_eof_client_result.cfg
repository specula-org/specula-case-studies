SPECIFICATION MCSpec
CONSTANTS
  Server = {0,1,2}
  Clients = {c0,c1}
  Values = {"A","AA","B"}
  FullValue = "AA"
  PrefixValue = "A"
  PrimaryTimeout = 3
  FailureBudget = 1
  IntegrationMode = TRUE
  TickLimit = 16
  RequestLimit = 2
  CrashLimit = 1
  LossLimit = 0
  DuplicateLimit = 0
  RetryLimit = 3
  PartialLimit = 1
  ReadErrorLimit = 0
  MaxView = 4
  MaxLog = 4
  MaxNetwork = 16
  LiveMode = FALSE
  StableHealthy = {0,1,2}

OnIdle <- MCOnIdle
Crash <- MCCrash
LoseMessage <- MCLoseMessage
ClientOnRequest <- MCClientOnRequest
ClientOnIdle <- MCClientOnIdle
RunSenderBeginPartial <- MCPartial
RunPeerAcceptorReadError <- MCReadError
CONSTRAINT StateConstraint
VIEW MCView
CHECK_DEADLOCK FALSE
SYMMETRY Symmetry

INVARIANTS
  DistinctQuorumAndPrimary
  NoAssertionFailure
  ClientLinearizability
