SPECIFICATION MCSpec

CONSTANTS
    Nodes = {n0, n1, n2}
    TargetNode = n2

    \* Version skew: default to a version that DOES support BALANCE_REPLICAS.
    \* Hunt cfgs flip SolrVersion below BalanceMinVersion to exercise S2.
    SolrVersion = 93
    BalanceMinVersion = 93

    ReqBalance = "balance"
    ReqMove = "move"
    ReqBackup = "backup"

    AStateNone = "none"
    AStateSubmitted = "submitted"
    AStateRunning = "running"
    AStateCompleted = "completed"
    AStateFailed = "failed"

    OpNone = "OpNone"
    OpScaleDown = "OpScaleDown"
    OpBalance = "OpBalance"

    \* Fault bounds
    MaxEvictLimit = 2
    MaxNodeChurnLimit = 2
    MaxPodReadyLimit = 2
    MaxFailLimit = 2
    MaxRestartLimit = 1
    MaxStaleFetchLimit = 1

VIEW ModelView

INVARIANTS
    \* --- Structural / sanity (used during convergence) ---
    TypeOK
    LockConsistency
    BackupStatusConsistency
    ReplicaNonNegative
    FaultCountersBounded

    \* --- Extension (scenario) invariants: enabled in MC_hunt_*.cfg, not here ---
    \* NoSuccessWithoutAction     \* S2  (MC_hunt_s2.cfg)
    \* VersionGuardSound          \* S2  (MC_hunt_s2.cfg)
    \* NoDeleteNonEmptyPod        \* S3  (MC_hunt_s3.cfg)
    \* NoStaleAuthorizedDestroy   \* S3  (MC_hunt_s3.cfg)
    \* PreconditionBeforeCall     \* S4  (MC_hunt_s4.cfg)
    \* AsyncTerminalConsumed      \* S1  (MC_hunt_s1.cfg)
