\* ===========================================================================
\* base.cfg -- standalone config for the base module (all extensions present).
\* Runs base!Spec directly. The base module's fault actions are unbounded but the
\* underlying state space is finite (membership/boolean/bounded-replica variables),
\* so this doubles as a structural convergence check of the base spec.
\* The scenario (extension) invariants are DESIGNED to be violated by the buggy
\* operator paths encoded here; they are exercised under bounded faults by the
\* MC_hunt_*.cfg files. This config asserts only the structural invariants.
\* ===========================================================================
SPECIFICATION Spec

CONSTANTS
    Nodes = {n0, n1, n2}
    TargetNode = n2

    SolrVersion = 93
    BalanceMinVersion = 93

    ReqBalance = "balance"
    ReqMove = "move"
    ReqBackup = "backup"

    AStateNone = "none"
    AStateSubmitted = "submitted"
    AStateRunning = "running"
    AStateCompleted = "completed"
    AStateFailed = "failed"

    OpNone = "OpNone"
    OpScaleDown = "OpScaleDown"
    OpBalance = "OpBalance"

INVARIANTS
    TypeOK
    LockConsistency
    BackupStatusConsistency
    ReplicaNonNegative
