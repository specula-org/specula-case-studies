\* ===========================================================================
\* HUNT S4 -- Admin call issued before its Solr-side precondition holds
\* Brief: Scenario 4 (MC4); invariant PreconditionBeforeCall.
\* Adversary: node churn brings the cluster down to a single live node (TargetNode),
\* so |liveNodes \ {source}| = 0. During scale-down the operator still issues
\* REPLACENODE (solr_update_util.go:574-582) with no live-target check; Solr's handler
\* refuses it (ReplaceNodeCmd.java:62-67 => 400) and the v1 client swallows the opaque
\* error (api.go:173-182), so eviction retries forever. Requires 2 node-down firings.
\* ===========================================================================
SPECIFICATION MCSpec

CONSTANTS
    Nodes = {n0, n1, n2}
    TargetNode = n2

    SolrVersion = 93
    BalanceMinVersion = 93

    ReqBalance = "balance"
    ReqMove = "move"
    ReqBackup = "backup"

    AStateNone = "none"
    AStateSubmitted = "submitted"
    AStateRunning = "running"
    AStateCompleted = "completed"
    AStateFailed = "failed"

    OpNone = "OpNone"
    OpScaleDown = "OpScaleDown"
    OpBalance = "OpBalance"

    MaxEvictLimit = 0
    MaxNodeChurnLimit = 2
    MaxPodReadyLimit = 0
    MaxFailLimit = 0
    MaxRestartLimit = 0
    MaxStaleFetchLimit = 0

VIEW ModelView

INVARIANTS
    TypeOK
    LockConsistency
    BackupStatusConsistency
    ReplicaNonNegative
    FaultCountersBounded
    PreconditionBeforeCall
