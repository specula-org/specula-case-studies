SPECIFICATION MCSpec

CONSTANTS
    UpdatePod = "update-pod"
    PullPod = "pull-pod"
    NRTReplica = "nrt-replica"
    PullReplica = "pull-replica"
    TargetShard = "collection1|shard1"
    CollectionA = "collection-a"
    CollectionB = "collection-b"
    MaxShardReplicasUnavailable = 1

    MaxManagedUpdateStarts = 1
    MaxRollingStarts = 1
    MaxBalanceStarts = 1
    MaxRollingApiFailures = 1
    MaxBalanceCheckFailures = 1
    MaxBalanceSubmitFailures = 1
    MaxBackupStarts = 1
    MaxCollectionDeletes = 1
    MaxCollectionAdds = 1
    MaxStatusPatchConflicts = 1
    MaxBasicAuthRequests = 1
    MaxBootstrapCreateFailures = 1
    MaxExternalZKChanges = 1
    MaxManualBootstrapRepairs = 1

    StartManagedUpdate <- MCStartManagedUpdate
    StartRollingClusterOp <- MCStartRollingClusterOp
    StartBalanceClusterOp <- MCStartBalanceClusterOp
    HandleManagedCloudRollingUpdateClusterStateFailure <- MCHandleManagedCloudRollingUpdateClusterStateFailure
    BalanceReplicasForClusterCheckFailure <- MCBalanceReplicasForClusterCheckFailure
    BalanceReplicasForClusterSubmitFailure <- MCBalanceReplicasForClusterSubmitFailure
    StartBackupRun <- MCStartBackupRun
    DeleteCollectionDuringBackup <- MCDeleteCollectionDuringBackup
    AddCollectionDuringBackup <- MCAddCollectionDuringBackup
    PatchSolrBackupStatusConflict <- MCPatchSolrBackupStatusConflict
    RequestBasicAuth <- MCRequestBasicAuth
    FailBootstrapSecretCreate <- MCFailBootstrapSecretCreate
    ExternalModifyZKSecurity <- MCExternalModifyZKSecurity
    ManualCreateBootstrapSecret <- MCManualCreateBootstrapSecret

CHECK_DEADLOCK FALSE
VIEW ModelView

INVARIANTS
    \* Core/structural invariants used while converging the model.
    TypeOK
    FaultCounterTypeOK
    OneActiveClusterOp
    ClusterOpOwnershipConsistency
    BackupCohortWithinUniverse

    \* Scenario invariants are intentionally enabled only in hunt cfgs.
    \* WriteAvailabilityBudget
    \* NonterminalOpHasFuture
    \* BackupCohortStable
    \* BackupEventuallyTerminal
    \* CleanupAfterDurableTerminal
    \* ReadyBasicAuthIsInstalled

\* Temporal companions require fairness tuning before broad runs.
\* PROPERTIES NonterminalOpEventuallyTerminal BackupTerminationLiveness
