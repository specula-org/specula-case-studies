\* Hunting config: Bug Family 1 — Snapshot Loading Crash Window
\* Target: MC-1 — Crash during snapshot load leaves inconsistent state.
\* Strategy: enable snapshots + crashes, minimize unrelated actions.

SPECIFICATION MCSpec

CONSTANTS
    s1 = s1
    s2 = s2
    s3 = s3

    Server = {s1, s2, s3}

    \* Tight bounds: focus on snapshot + crash interaction
    MaxTermLimit        = 3
    MaxTimeoutLimit     = 3
    RequestLimit        = 2
    CrashLimit          = 2
    LoseLimit           = 1
    SnapshotLimit       = 3
    ConfigChangeLimit   = 0
    ReadLimit           = 0
    MaxMsgBufferLimit   = 8

    \* Action overrides
    Timeout              <- MCTimeout
    ClientRequest        <- MCClientRequest
    Crash                <- MCCrash
    LoseMessage          <- MCLoseMessage
    TakeSnapshot         <- MCTakeSnapshot
    SendInstallSnapshot  <- MCSendInstallSnapshot
    ProposeAddServer     <- MCProposeAddServer
    ProposeRemoveServer  <- MCProposeRemoveServer
    ClientNonQuorumRead  <- MCClientNonQuorumRead

    Nil = Nil
    Follower    = Follower
    Candidate   = Candidate
    Leader      = Leader
    ValueEntry  = ValueEntry
    ConfigEntry = ConfigEntry
    NoopEntry   = NoopEntry
    RequestVoteRequest      = RequestVoteRequest
    RequestVoteResponse     = RequestVoteResponse
    AppendEntriesRequest    = AppendEntriesRequest
    AppendEntriesResponse   = AppendEntriesResponse
    InstallSnapshotRequest  = InstallSnapshotRequest

SYMMETRY Symmetry

CHECK_DEADLOCK
    FALSE

CONSTRAINT
    MsgBufferConstraint

\* Target invariant + core safety
INVARIANTS
    ElectionSafety
    SnapshotLogConsistency
