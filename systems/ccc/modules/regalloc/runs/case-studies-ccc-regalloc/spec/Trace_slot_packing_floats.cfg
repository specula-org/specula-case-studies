\* Trace config for slot_packing_floats. Structural invariants only (MC.cfg parity).
SPECIFICATION TraceSpec
CHECK_DEADLOCK FALSE

CONSTANTS
    Vals  = {1,2,3,4,5,6,7}
    Points = {0,1,2,3,4,5,6,7,8}
    Blocks = {0,1}
    CallPoints = {}
    AsmPoints = {}
    ReturnsTwicePoints = {}
    CalleeSavedRegs = {1,2,3,4,5}
    CallerSavedRegs = {10,11,12,13,14,15}
    FuncEnd  = 9
    MaxIters = 50

CONSTANT BlockOfPoint <- BlockOfPointOp
CONSTANT BlockSuccs   <- BlockSuccsOp
CONSTANT TrueDef      <- TrueDefOp
CONSTANT TrueUses     <- TrueUsesOp
CONSTANT AsmHasOperands <- AsmHasOperandsOp
CONSTANT AsmClobbers    <- AsmClobbersOp
CONSTANT IsRecognizedReturnsTwice <- IsRecognizedReturnsTwiceOp
CONSTANT Priority       <- PriorityOp
CONSTANT Slots          <- SlotsOp

INVARIANTS
    ValidPhases
    AssignmentDomain
    SlotDomain
    RecordedCallPointsSubset
    IterCap
    NoRegisterCollision
    NoSlotCollision

PROPERTIES
    TraceMatched
