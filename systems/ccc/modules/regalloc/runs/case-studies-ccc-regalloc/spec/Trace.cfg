\* Trace validation config for the CCC regalloc + liveness spec.
\* INIT/NEXT for deadlock-based trace completion checking.
\*
\* Constants here must match the specific function shape captured by the
\* trace. Per-trace overrides are passed via -DJSON=... and a matching
\* CONSTANTS file (or by re-rendering Trace.cfg from a template).

INIT TraceInit
NEXT TraceNext

CONSTANTS
    \* Default constants — will need to be regenerated to match the
    \* function instance whose execution produced the trace file.
    Vals  = {1, 2}
    Points = {0, 1, 2}
    Blocks = {0, 1}
    BlockOfPoint = (0 :> 0 @@ 1 :> 0 @@ 2 :> 1)
    BlockSuccs   = (0 :> {1} @@ 1 :> {})

    TrueDef  = (1 :> 0 @@ 2 :> 1)
    TrueUses = (1 :> {2} @@ 2 :> {2})

    CallPoints = {2}
    AsmPoints = {}
    AsmHasOperands = << >>
    AsmClobbers   = << >>
    ReturnsTwicePoints = {}
    IsRecognizedReturnsTwice = << >>

    CalleeSavedRegs = {10}
    CallerSavedRegs = {20}
    Slots = {100}

    Priority = (1 :> 1 @@ 2 :> 1)
    FuncEnd  = 3
    MaxIters = 4

\* Bug-family invariants that must hold on every real execution.
INVARIANTS
    PoolDisjointness
    ValidPhases
    AssignmentDomain
    SlotDomain
    RecordedCallPointsSubset
    IterCap
    NoRegisterCollision
    NoSlotCollision
    CallerSavedDeadAcrossCall
    CallerSavedDeadAcrossAsmClobber
    ReturnsTwiceLiveExtension
    IntervalSoundness

\* TraceMatched ensures TLC reports failure if the trace is not fully
\* consumed (rather than silently saying "no errors" when l never advances).
PROPERTIES
    TraceMatched
