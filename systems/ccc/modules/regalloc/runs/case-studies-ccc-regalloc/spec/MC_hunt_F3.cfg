\* MC_hunt_F3.cfg — Dataflow cap hit under non-convergent CFG (Family 1, F3).
SPECIFICATION MCSpec
CHECK_DEADLOCK FALSE

CONSTANTS
    Vals  = {1, 2}
    Points = {0, 1, 2}
    Blocks = {0, 1}
    CallPoints = {}
    AsmPoints = {}
    ReturnsTwicePoints = {}
    CalleeSavedRegs = {10, 11}
    CallerSavedRegs = {}
    Slots = {100, 101}
    FuncEnd  = 3
    MaxIters = 1
    DataflowCapLimit = 1

CONSTANT BlockOfPoint <- BlockOfPointF3Op
CONSTANT BlockSuccs   <- BlockSuccsF3Op
CONSTANT TrueDef      <- TrueDefF3Op
CONSTANT TrueUses     <- TrueUsesF3Op
CONSTANT AsmHasOperands <- AsmHasOperandsF3Op
CONSTANT AsmClobbers    <- AsmClobbersF3Op
CONSTANT IsRecognizedReturnsTwice <- IsRecognizedReturnsTwiceF3Op
CONSTANT Priority       <- PriorityF3Op

CONSTRAINT StateConstraint

INVARIANTS
    MCFixpointReachedBeforeUse
    MCNoRegisterCollision
    MCNoSlotCollision
