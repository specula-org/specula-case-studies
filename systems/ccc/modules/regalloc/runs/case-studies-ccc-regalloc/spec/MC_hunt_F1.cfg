\* MC_hunt_F1.cfg — Asm-no-operands caller-saved clobber drop (Family 1, F1).
SPECIFICATION MCSpec
CHECK_DEADLOCK FALSE

CONSTANTS
    Vals  = {1}
    Points = {0, 1, 2}
    Blocks = {0}
    CallPoints = {}
    AsmPoints = {1}
    ReturnsTwicePoints = {}
    CalleeSavedRegs = {10}
    CallerSavedRegs = {20}
    Slots = {100}
    FuncEnd  = 3
    MaxIters = 3
    DataflowCapLimit = 0

CONSTANT BlockOfPoint <- BlockOfPointF1Op
CONSTANT BlockSuccs   <- BlockSuccsF1Op
CONSTANT TrueDef      <- TrueDefF1Op
CONSTANT TrueUses     <- TrueUsesF1Op
CONSTANT AsmHasOperands <- AsmHasOperandsF1Op
CONSTANT AsmClobbers    <- AsmClobbersF1Op
CONSTANT IsRecognizedReturnsTwice <- IsRecognizedReturnsTwiceF1Op
CONSTANT Priority       <- PriorityF1Op

CONSTRAINT StateConstraint

INVARIANTS
    MCCallerSavedDeadAcrossAsmClobber
    MCNoRegisterCollision
