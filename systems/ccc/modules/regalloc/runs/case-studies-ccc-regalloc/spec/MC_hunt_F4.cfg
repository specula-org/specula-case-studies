\* MC_hunt_F4.cfg — Tier-2 packer slot collision on under-approximated interval (Family 2, F4).
SPECIFICATION MCSpec
CHECK_DEADLOCK FALSE

CONSTANTS
    Vals  = {1, 2}
    Points = {0, 1, 2, 3}
    Blocks = {0}
    CallPoints = {1}
    AsmPoints = {}
    ReturnsTwicePoints = {1}
    CalleeSavedRegs = {}
    CallerSavedRegs = {}
    Slots = {100}
    FuncEnd  = 4
    MaxIters = 4
    DataflowCapLimit = 0

CONSTANT BlockOfPoint <- BlockOfPointF4Op
CONSTANT BlockSuccs   <- BlockSuccsF4Op
CONSTANT TrueDef      <- TrueDefF4Op
CONSTANT TrueUses     <- TrueUsesF4Op
CONSTANT AsmHasOperands <- AsmHasOperandsF4Op
CONSTANT AsmClobbers    <- AsmClobbersF4Op
CONSTANT IsRecognizedReturnsTwice <- IsRecognizedReturnsTwiceF4Op
CONSTANT Priority       <- PriorityF4Op

CONSTRAINT StateConstraint

INVARIANTS
    MCNoSlotCollision
    MCIntervalSoundness
