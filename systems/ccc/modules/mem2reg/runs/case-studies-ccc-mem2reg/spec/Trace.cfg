\* Trace.cfg — trace validation against base spec.
\* Run with `JSON=../traces/<file>.ndjson` to select a specific trace.

SPECIFICATION TraceSpec

CONSTANTS
    Blocks         <- DefaultBlocks
    Entry          <- DefaultEntry
    Allocas        <- DefaultAllocas
    AllocaInfo     <- DefaultAllocaInfo
    UseSites       <- DefaultUseSites
    TermKind       <- DefaultTermKind
    TermTargets    <- DefaultTermTargets
    MaxPhiCopyCost <- MCMaxPhiCopyCost
    MaxIdomIters   <- MCMaxIdomIters
    MaxRenameDepth <- MCMaxRenameDepth
    MaxSynId       <- MCMaxSynId

\* Reuse fixture operators from MC.tla via INSTANCE.
\* (TLC will look for these in the imported modules.)

CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    DisqualifiedSubsetOfCandidates
    DefUseBlocksWellFormed
    PhiIncomingMatchesPreds
    AddressTakenNeverPromoted
    ParamAllocaRetained
    CostCapBounded

PROPERTIES
    TraceMatched
