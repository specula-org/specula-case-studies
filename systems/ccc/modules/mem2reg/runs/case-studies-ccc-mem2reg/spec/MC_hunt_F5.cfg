\* MC_hunt_F5.cfg — bug-hunt for F5 (cost cap correctness).
\* Uses default fixture; verifies that after COST_DROP, TotalPhiCost
\* never exceeds MaxPhiCopyCost.

SPECIFICATION MCSpec_Default

CONSTANTS
    Blocks         <- DefaultBlocks
    Entry          <- DefaultEntry
    Allocas        <- DefaultAllocas
    AllocaInfo     <- DefaultAllocaInfo
    UseSites       <- DefaultUseSites
    TermKind       <- DefaultTermKind
    TermTargets    <- DefaultTermTargets
    MaxPhiCopyCost <- MCMaxPhiCopyCost
    MaxIdomIters   <- MCMaxIdomIters
    MaxRenameDepth <- MCMaxRenameDepth
    MaxSynId       <- MCMaxSynId

CONSTRAINT StateConstraint
CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    CostCapBounded
    IdomTerminates
