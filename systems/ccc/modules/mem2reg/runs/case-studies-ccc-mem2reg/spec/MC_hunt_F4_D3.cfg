\* MC_hunt_F4_D3.cfg — bug-hunt for D3: two asm-goto instructions in
\* the same block targeting the SAME label. The later snapshot overwrites
\* the earlier one in gotoSnapByLabel; phi values on the first asm-goto's
\* edge see the wrong (later) snapshot.
\*
\* Fixture: block 0 has STORE_PTR a1, ASM_GOTO -> {1}, STORE_PTR a1,
\*          ASM_GOTO -> {1}. Block 1 has LOAD a1.
\*
\* Invariant: NoOverlappingAsmGotoTargets (counterexample = D3 confirmed).

SPECIFICATION MCSpec_D3

CONSTANTS
    Blocks         <- D3Blocks
    Entry          <- DefaultEntry
    Allocas        <- D3Allocas
    AllocaInfo     <- D3AllocaInfo
    UseSites       <- D3UseSites
    TermKind       <- D3TermKind
    TermTargets    <- D3TermTargets
    MaxPhiCopyCost <- MCMaxPhiCopyCost
    MaxIdomIters   <- MCMaxIdomIters
    MaxRenameDepth <- MCMaxRenameDepth
    MaxSynId       <- MCMaxSynId

CONSTRAINT StateConstraint
CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    NoOverlappingAsmGotoTargets
