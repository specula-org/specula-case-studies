\* MC_hunt_F6_D2.cfg — bug-hunt for D2: switch with duplicate target.
\*
\* Fixture: block 0 has SWITCH with default=3, case 1=3, case 2=4.
\* Block 3 has phi for a1 (after IDF). retarget_block_edge_once at
\* phi_eliminate.rs:105-157 returns after the FIRST matching syntactic
\* edge — only one of the two (b0 -> b3) edges is rewritten to the
\* trampoline. The other syntactic edge bypasses the phi copies.
\*
\* Invariant: PhiCopiesOnEveryEdge (counterexample = D2 confirmed).

SPECIFICATION MCSpec_D2Real

CONSTANTS
    Blocks         <- D2BlocksReal
    Entry          <- DefaultEntry
    Allocas        <- D2AllocasReal
    AllocaInfo     <- D2AllocaInfoReal
    UseSites       <- D2UseSitesReal
    TermKind       <- D2TermKindReal
    TermTargets    <- D2TermTargetsReal
    MaxPhiCopyCost <- MCMaxPhiCopyCost
    MaxIdomIters   <- MCMaxIdomIters
    MaxRenameDepth <- MCMaxRenameDepth
    MaxSynId       <- MCMaxSynId

CONSTRAINT StateConstraint
CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    PhiCopiesOnEveryEdge
