\* MC.cfg — Standard model checking configuration for convergence.
\* Use this during spec validation. Extension (bug-family) invariants are commented out.
\* After convergence, use MC_hunt_*.cfg configs for bug hunting.

CONSTANTS
    Nil = Nil
    Server = {s1, s2, s3}
    Follower = Follower
    Candidate = Candidate
    Leader = Leader
    RequestVoteRequest = RequestVoteRequest
    RequestVoteResponse = RequestVoteResponse
    AppendEntriesRequest = AppendEntriesRequest
    AppendEntriesResponse = AppendEntriesResponse
    HeartbeatRequest = HeartbeatRequest
    HeartbeatResponse = HeartbeatResponse

    \* Counter bounds
    MaxTermLimit = 4
    MaxTimeoutLimit = 5
    RequestLimit = 3
    CrashLimit = 2
    LoseLimit = 3
    HeartbeatLimit = 6
    LeaseExpiryLimit = 2
    SnapshotLimit = 2
    PreVoteLimit = 4
    MaxMsgBufferLimit = 10

\* Override fault-injection actions with MC-bounded versions
Timeout         <- MCTimeout
BlindFollowerTimeout <- MCBlindFollowerTimeout
SendPreVote     <- MCSendPreVote
ClientRequest   <- MCClientRequest
Crash           <- MCCrash
LoseMessage     <- MCLoseMessage
SendHeartbeat   <- MCSendHeartbeat
ExpireLease     <- MCExpireLease
StartSnapshot   <- MCStartSnapshot

SPECIFICATION MCSpec

SYMMETRY ModelSymmetry

CONSTRAINT MessageBufferConstraint

VIEW MCView

\* === Structural Invariants (always on) ===
INVARIANTS
    MCTermsNonNegative
    MCCommitIndexBound
    MCAliveLeaders
    MCMessageInvariant

\* === Core Safety Invariants (always on) ===
    MCElectionSafety
    MCLogMatching

\* === Extension Invariants (commented out for convergence) ===
\* MCNoStaleLeaseRead
\* MCLeaderCompleteness
