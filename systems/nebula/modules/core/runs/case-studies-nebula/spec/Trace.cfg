\* Trace.cfg — Trace validation configuration.
\*
\* Run with: java -jar tla2tools.jar -config Trace.cfg Trace
\* Override trace file: -DJSON=../traces/my_trace.ndjson

CONSTANTS
    Nil = "Nil"
    Server = {"s1", "s2", "s3"}
    Follower = "Follower"
    Candidate = "Candidate"
    Leader = "Leader"
    RequestVoteRequest = "RequestVoteRequest"
    RequestVoteResponse = "RequestVoteResponse"
    AppendEntriesRequest = "AppendEntriesRequest"
    AppendEntriesResponse = "AppendEntriesResponse"
    HeartbeatRequest = "HeartbeatRequest"
    HeartbeatResponse = "HeartbeatResponse"

INIT TraceInit

NEXT TraceNext

\* Check that the entire trace was consumed (use -deadlock flag to disable deadlock checking)
\* PROPERTY TraceMatched

\* Alias for debugging
ALIAS TraceAlias

\* View: exclude message bag from state fingerprint for faster trace validation
VIEW TraceView
