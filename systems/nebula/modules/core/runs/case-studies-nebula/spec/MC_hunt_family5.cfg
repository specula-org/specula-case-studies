\* MC_hunt_family5.cfg — Hunt for Pre-Vote Step-Down bugs (Family 5)
\*
\* Target: Partitioned node rejoins → pre-vote causes leader step-down.
\* Invariant: ElectionSafety (verify if pre-vote disruption leads to safety violation)
\*
\* Strategy: Enable pre-votes, multiple elections, message loss (partition simulation).
\* Key scenario: node is partitioned (messages lost), accumulates high term,
\* reconnects and sends pre-votes that cause the current leader to step down
\* (RaftPart.cpp:1522-1528), triggering unnecessary election.

CONSTANTS
    Nil = Nil
    Server = {s1, s2, s3}
    Follower = Follower
    Candidate = Candidate
    Leader = Leader
    RequestVoteRequest = RequestVoteRequest
    RequestVoteResponse = RequestVoteResponse
    AppendEntriesRequest = AppendEntriesRequest
    AppendEntriesResponse = AppendEntriesResponse
    HeartbeatRequest = HeartbeatRequest
    HeartbeatResponse = HeartbeatResponse

    \* Tight bounds for Family 5
    MaxTermLimit = 5         \* Need term escalation
    MaxTimeoutLimit = 6      \* Multiple elections for term buildup
    RequestLimit = 2
    CrashLimit = 0
    LoseLimit = 4            \* Key: simulate partition by losing messages
    HeartbeatLimit = 3
    LeaseExpiryLimit = 1
    SnapshotLimit = 0
    PreVoteLimit = 5         \* Key: many pre-votes
    MaxMsgBufferLimit = 10

Timeout         <- MCTimeout
BlindFollowerTimeout <- MCBlindFollowerTimeout
SendPreVote     <- MCSendPreVote
ClientRequest   <- MCClientRequest
Crash           <- MCCrash
LoseMessage     <- MCLoseMessage
SendHeartbeat   <- MCSendHeartbeat
ExpireLease     <- MCExpireLease
StartSnapshot   <- MCStartSnapshot

SPECIFICATION MCSpec

SYMMETRY ModelSymmetry

CONSTRAINT MessageBufferConstraint

VIEW MCView

INVARIANTS
    MCElectionSafety
    MCNoStaleLeaseRead
