\* MC_hunt_family1.cfg — Hunt for Non-Persisted Term/Vote bugs (Family 1)
\*
\* Target: Crash + restart → node votes twice in same term → two leaders
\* Invariant: ElectionSafety (at most one leader per term)
\*
\* Strategy: Enable crash/restart, minimize irrelevant actions.
\* The key scenario: node votes, crashes, restarts (term from WAL lastLogTerm,
\* votedFor lost), votes again for different candidate in same term.

CONSTANTS
    Nil = Nil
    Server = {s1, s2, s3}
    Follower = Follower
    Candidate = Candidate
    Leader = Leader
    RequestVoteRequest = RequestVoteRequest
    RequestVoteResponse = RequestVoteResponse
    AppendEntriesRequest = AppendEntriesRequest
    AppendEntriesResponse = AppendEntriesResponse
    HeartbeatRequest = HeartbeatRequest
    HeartbeatResponse = HeartbeatResponse

    \* Tight bounds for Family 1
    MaxTermLimit = 4
    MaxTimeoutLimit = 5
    RequestLimit = 2
    CrashLimit = 2          \* Key: need crash + restart
    LoseLimit = 2
    HeartbeatLimit = 2       \* Minimal
    LeaseExpiryLimit = 0     \* Not needed
    SnapshotLimit = 0        \* Not needed
    PreVoteLimit = 4
    MaxMsgBufferLimit = 10

Timeout         <- MCTimeout
BlindFollowerTimeout <- MCBlindFollowerTimeout
SendPreVote     <- MCSendPreVote
ClientRequest   <- MCClientRequest
Crash           <- MCCrash
LoseMessage     <- MCLoseMessage
SendHeartbeat   <- MCSendHeartbeat
ExpireLease     <- MCExpireLease
StartSnapshot   <- MCStartSnapshot

SPECIFICATION MCSpec

SYMMETRY ModelSymmetry

CONSTRAINT MessageBufferConstraint

VIEW MCView

INVARIANTS
    MCElectionSafety
