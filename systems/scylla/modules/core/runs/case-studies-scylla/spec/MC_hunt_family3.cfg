\* MC_hunt_family3.cfg — Hunt for Bug Family 3: Snapshot Lifecycle & Persistence
\* Targets: CrashRecoveryConsistency, SnapshotLogContinuity violations.
\* Uses buggy snapshot variant (non-zero trailing for remote snapshots).
\*
\* Tight bounds: enable snapshots, crashes. Minimize config changes, read barriers.

CONSTANTS
    Nil = Nil
    Server = {s1, s2, s3}
    Follower = Follower
    Candidate = Candidate
    Leader = Leader
    ValueEntry = ValueEntry
    ConfigEntry = ConfigEntry
    RequestVoteRequest = RequestVoteRequest
    RequestVoteResponse = RequestVoteResponse
    AppendEntriesRequest = AppendEntriesRequest
    AppendEntriesResponse = AppendEntriesResponse
    InstallSnapshotRequest = InstallSnapshotRequest
    InstallSnapshotResponse = InstallSnapshotResponse
    ReadQuorumRequest = ReadQuorumRequest
    ReadQuorumResponse = ReadQuorumResponse

    MaxTermLimit = 3
    MaxTimeoutLimit = 3
    RequestLimit = 3
    CrashLimit = 2
    LoseLimit = 2
    SnapshotLimit = 3
    ReadBarrierLimit = 0
    ConfigChangeLimit = 0
    FDUpdateLimit = 0
    MaxMsgBufferLimit = 10

SPECIFICATION MCSpecFamily3

SYMMETRY MCSymmetry

VIEW MCView

CONSTRAINT MsgBufferConstraint

\* Target invariants
INVARIANT MCCrashRecoveryConsistency
INVARIANT MCSnapshotLogContinuity
INVARIANT MCElectionSafety
INVARIANT MCCommitBound
