\* MC.cfg — Standard safety + structural invariants.
\* Used during spec convergence. Extension invariants commented out.

CONSTANTS
    Nil = Nil
    Server = {s1, s2, s3}
    Follower = Follower
    Candidate = Candidate
    Leader = Leader
    ValueEntry = ValueEntry
    ConfigEntry = ConfigEntry
    RequestVoteRequest = RequestVoteRequest
    RequestVoteResponse = RequestVoteResponse
    AppendEntriesRequest = AppendEntriesRequest
    AppendEntriesResponse = AppendEntriesResponse
    InstallSnapshotRequest = InstallSnapshotRequest
    InstallSnapshotResponse = InstallSnapshotResponse
    ReadQuorumRequest = ReadQuorumRequest
    ReadQuorumResponse = ReadQuorumResponse

    \* Counter bounds
    MaxTermLimit = 4
    MaxTimeoutLimit = 5
    RequestLimit = 3
    CrashLimit = 2
    LoseLimit = 3
    SnapshotLimit = 2
    ReadBarrierLimit = 3
    ConfigChangeLimit = 2
    FDUpdateLimit = 3
    MaxMsgBufferLimit = 10

SPECIFICATION MCSpec

SYMMETRY MCSymmetry

VIEW MCView

CONSTRAINT MsgBufferConstraint

\* --- Standard safety invariants ---
INVARIANT MCElectionSafety
INVARIANT MCLogMatching
INVARIANT MCLeaderCompleteness

\* --- Structural invariants ---
INVARIANT MCCommitBound
INVARIANT MCVoteValid
INVARIANT MCReadIdMonotonic
INVARIANT MCSnapshotLogContinuity

\* --- Extension invariants (commented out during convergence) ---
\* INVARIANT MCCommitIndexSafety
\* INVARIANT MCJointQuorumAgreement
\* INVARIANT MCCrashRecoveryConsistency
\* INVARIANT MCSnapshotBound
