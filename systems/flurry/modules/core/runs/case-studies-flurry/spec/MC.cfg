\* MC configuration for flurry ConcurrentHashMap
\* Standard safety + structural invariants for convergence testing

CONSTANTS
    Thread = {t1, t2}
    NumBins = 4
    MaxKey = 8
    MaxTableMultiplier = 4
    MaxPuts = 6
    MaxResizes = 1
    MaxEpochAdvances = 2
    MaxTreeLockOps = 4

SPECIFICATION MCSpec

SYMMETRY ModelSymmetry

VIEW MCView

CONSTRAINT StateConstraint

\* --- Structural invariants (always check) ---
INVARIANTS
    ResizeCoordination
    BinTypeConsistency
    CountNonNeg
    EmptyBinNoKeys
    MovedBinNoKeys
    LockStateNonNeg

\* --- Extension invariants (uncomment for targeted hunting) ---
\* INVARIANT NoSkippedBins
\* INVARIANT AllBinsTransferred
\* INVARIANT NoUseAfterFree
\* INVARIANT ReaderWriterMutex
\* INVARIANT WaiterSafety
\* INVARIANT TreeifyNoPanic
