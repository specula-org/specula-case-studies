\* Hunting config for Family 2: Memory Reclamation Safety
\* Tight bounds: allow epoch advances and puts, minimize resize/tree lock

CONSTANTS
    Thread = {t1, t2}
    NumBins = 4
    MaxKey = 4
    MaxTableMultiplier = 4
    MaxPuts = 4
    MaxResizes = 1
    MaxEpochAdvances = 4
    MaxTreeLockOps = 0

SPECIFICATION MCSpec

SYMMETRY ModelSymmetry

VIEW MCView

CONSTRAINT StateConstraint

\* Core safety + Family 2 target
INVARIANTS
    CountNonNeg
    ResizeCoordination
    NoUseAfterFree
