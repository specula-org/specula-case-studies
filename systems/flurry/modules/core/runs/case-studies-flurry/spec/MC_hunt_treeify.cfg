\* Hunting config for Family 4: Bin Lock + Treeify Race Window
\* Tight bounds: allow puts + resize to create race, minimize epoch/tree lock

CONSTANTS
    Thread = {t1, t2}
    NumBins = 4
    MaxKey = 8
    MaxTableMultiplier = 4
    MaxPuts = 8
    MaxResizes = 1
    MaxEpochAdvances = 0
    MaxTreeLockOps = 0

SPECIFICATION MCSpec

SYMMETRY ModelSymmetry

VIEW MCView

CONSTRAINT StateConstraint

\* Core safety + Family 4 targets
INVARIANTS
    CountNonNeg
    BinTypeConsistency
    TreeifyNoPanic
