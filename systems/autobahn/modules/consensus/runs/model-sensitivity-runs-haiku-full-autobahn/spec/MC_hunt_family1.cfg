(*
   Hunting config for Family 1: Unsafe Vote Safety State - Persistent Storage

   Bug mechanism: Vote safety state is in-memory only, crashes can enable double-voting.

   Tight bounds:
   - Focus on crash/recovery cycles: crashCounter = 2
   - Minimal timeout/loss to reduce irrelevant state space
   - 3-4 nodes minimum for quorum (f+1 = 2)
*)

CONSTANT NumNodes = 3
CONSTANT MaxRound = 4
CONSTANT MaxView = 2
CONSTANT NIL = NIL
CONSTANT NULL_MSG = NULL_MSG

INIT MCInit
NEXT MCNext
(* SYMMETRY Symmetry *)

(* Core safety invariants *)
INVARIANT MCNoDoubleVote
(* INVARIANT MCQCSafety *)

(* Structural invariants *)
INVARIANT MCVoteStatusConsistency
INVARIANT MCPersistentVotedMonotonic
INVARIANT MCRoundMonotonic

(* FAMILY 1 TARGET: Vote safety after crash/recovery *)
INVARIANT MCNVoteSafetyAfterCrash
