(*
   Hunting config for Family 3: TC Round Validation

   Bug mechanism: TC validation happens after QC processing.
                  Can assemble TC for round r with high_qc_rounds that violate ordering.
                  Leader election for TC.round+1 must be correct.

   Tight bounds:
   - Focus on TC assembly: timeoutCounter = 4
   - Message loss = 3 to trigger invalid TC acceptance
   - Minimal crashes
   - 4 nodes for proper quorum
*)

CONSTANT NumNodes = 4
CONSTANT MaxRound = 5
CONSTANT MaxView = 3
CONSTANT NIL = NIL
CONSTANT NULL_MSG = NULL_MSG

INIT MCInit
NEXT MCNext
(* SYMMETRY Symmetry *)

(* Core safety invariants *)
INVARIANT MCNoDoubleVote
(* INVARIANT MCQCSafety *)
(* INVARIANT MCTCRoundValidity *)

(* Structural invariants *)
INVARIANT MCVoteStatusConsistency
INVARIANT MCPersistentVotedMonotonic
INVARIANT MCRoundMonotonic

(* FAMILY 3 TARGET: TC assembly correctness *)
INVARIANT MCTCAssemblyCorrect
