(*
   Hunting config for Family 2 & 3: Non-Atomic State Transitions and View-Change Handling

   Bug mechanism: QC/TC processing is non-atomic, can race causing state divergence.
                  TC validation happens after QC processing, race window.

   Tight bounds:
   - Focus on concurrent QC/TC arrival: timeoutCounter = 3
   - Minimal crashes to reduce unrelated state space
   - Message loss = 2 to trigger race conditions
   - 4 nodes to allow proper quorum (f=1, quorum=3)
*)

CONSTANT NumNodes = 4
CONSTANT MaxRound = 4
CONSTANT MaxView = 2
CONSTANT NIL = NIL
CONSTANT NULL_MSG = NULL_MSG

INIT MCInit
NEXT MCNext
(* SYMMETRY Symmetry *)

(* Core safety invariants *)
INVARIANT MCNoDoubleVote
(* INVARIANT MCQCSafety *)
(* INVARIANT MCTCRoundValidity *)

(* Structural invariants *)
INVARIANT MCVoteStatusConsistency
INVARIANT MCRoundMonotonic

(* FAMILY 2 & 3 TARGET: Atomic round advance with QC/TC processing *)
INVARIANT MCRoundAdvanceAtomic
