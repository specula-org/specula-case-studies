(*
   Hunting config for Family 5: Proposal Generation Race

   Bug mechanism: Multiple paths (handle_vote, handle_timeout, handle_tc) can trigger
                  generate_proposal() for same round, causing duplicate proposals.

   Tight bounds:
   - Focus on proposal generation races: proposeCounter = 3
   - Multiple timeouts to trigger concurrent proposal requests
   - Minimal crashes/losses
   - 4 nodes
*)

CONSTANT NumNodes = 4
CONSTANT MaxRound = 4
CONSTANT MaxView = 2
CONSTANT NIL = NIL
CONSTANT NULL_MSG = NULL_MSG

INIT MCInit
NEXT MCNext
(* SYMMETRY Symmetry *)

(* Core safety invariants *)
INVARIANT MCNoDoubleVote
(* INVARIANT MCQCSafety *)

(* Structural invariants *)
INVARIANT MCVoteStatusConsistency
INVARIANT MCRoundMonotonic

(* FAMILY 5 TARGET: Proposal idempotency *)
INVARIANT MCProposalIdempotent
