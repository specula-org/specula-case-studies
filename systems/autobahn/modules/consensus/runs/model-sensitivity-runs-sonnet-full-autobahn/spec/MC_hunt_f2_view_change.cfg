\* MC_hunt_f2_view_change.cfg
\* Target: Family 2 — View-Change Safety Rules
\* Mechanisms:
\*   (a) Empty Timeout digest (messages.rs:1349-1358): Byzantine node sets arbitrary high_qc.
\*   (b) Wrong winning_view assignment (messages.rs:1454-1455): TC picks stale proposal.
\*   (c) TC::verify does not validate embedded QCs (messages.rs:1518-1546).
\* Target invariants: ViewChangeSafety, TimeoutAuthenticityBound
\*
\* Tight bounds: 1 slot, 3 views (need view change to trigger), 1 Byzantine timeout.
\* Need at least 1 TC to form; allow 2 view advances.

SPECIFICATION MCSpec

CONSTANTS
    Nodes      = {n1, n2, n3, n4}
    ByzNodes   = {n4}
    HonestNodes = {n1, n2, n3}

    Slots      = {1}
    Views      = {1, 2, 3}
    HSRounds   = {1, 2}
    K          = 1
    Proposals  = {P1, P2}
    None       = None

    \* F2: allow Byzantine timeouts to steer TC
    MaxByzEquivocate  = 0
    MaxByzTimeout     = 2
    MaxTimeoutPerView = 3
    MaxFormTC         = 2
    MaxHSCrash        = 0
    MaxViewAdvance    = 3

    MaxMsgBuf = 18

SYMMETRY Perms
CONSTRAINT MsgBufOK

INVARIANTS
    TypeOK
    ViewChangeSafety
    TimeoutAuthenticityBound
