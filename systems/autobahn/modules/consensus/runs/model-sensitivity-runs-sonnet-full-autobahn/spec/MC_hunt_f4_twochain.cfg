\* MC_hunt_f4_twochain.cfg
\* Target: Family 4 — Incomplete 2-Chain Commit Rule + Non-Persistent Voted Round
\* Mechanism (a): hotstuff/core.rs:327 only checks b0.round+1==b1.round;
\*                missing second link b1.round+1==block.round allows premature commit.
\* Mechanism (b): hotstuff/core.rs:118 TODO — last_voted_round not persisted;
\*                after crash+recovery node re-votes in old rounds.
\* Target invariants: TwoChainCommitRule, VoteSafety
\*
\* Need round gap to trigger (a): publish block r2 with parent r1, but r2 /= r1+1.
\* Need crash to trigger (b): 1 crash event sufficient.

SPECIFICATION MCSpec

CONSTANTS
    Nodes      = {n1, n2, n3, n4}
    ByzNodes   = {n4}
    HonestNodes = {n1, n2, n3}

    Slots      = {1}
    Views      = {1, 2}
    HSRounds   = {1, 2, 3, 4}
    K          = 1
    Proposals  = {P1, P2}
    None       = None

    \* F4: need crash events; disable Autobahn noise
    MaxByzEquivocate  = 0
    MaxByzTimeout     = 0
    MaxTimeoutPerView = 0
    MaxFormTC         = 0
    MaxHSCrash        = 2
    MaxViewAdvance    = 0

    MaxMsgBuf = 15

SYMMETRY Perms
CONSTRAINT MsgBufOK

INVARIANTS
    TypeOK
    TwoChainCommitRule
    VoteSafety
