\* Trace.cfg — Trace validation configuration.

SPECIFICATION TraceSpec

CONSTANTS
    Nodes      = {n1, n2, n3, n4}
    ByzNodes   = {n4}
    HonestNodes = {n1, n2, n3}

    Slots      = {1, 2}
    Views      = {1, 2, 3}
    HSRounds   = {1, 2, 3, 4}
    K          = 2
    Proposals  = {P1, P2}
    None       = None

    \* Not used during trace validation (no fault bounds needed)
    MaxByzEquivocate  = 0
    MaxByzTimeout     = 0
    MaxTimeoutPerView = 0
    MaxFormTC         = 0
    MaxHSCrash        = 0
    MaxViewAdvance    = 0
    MaxMsgBuf         = 100

\* Check that the full trace was consumed
PROPERTIES
    TraceMatched

\* Structural invariants (should hold on every real execution)
INVARIANTS
    TypeOK
    CommitOnce

\* Safety invariants — include those that should hold on real (non-fault-injected) runs
INVARIANTS
    NoConfirmEquivocation
