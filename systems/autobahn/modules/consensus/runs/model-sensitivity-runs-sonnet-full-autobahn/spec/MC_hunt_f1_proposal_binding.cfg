\* MC_hunt_f1_proposal_binding.cfg
\* Target: Family 1 — Proposal-Binding Failure
\* Mechanism: Byzantine leader sends two Prepares for (slot, view) with different proposals;
\*            vote digests exclude proposals (messages.rs:237-279); two PrepareQCs form.
\* Target invariant: UniqueCommit (AgreementOnProposals)
\*
\* Tight bounds: 2 slots, 1 view, 1 Byz equivocation event.
\* Disable view-change noise (no timeouts, no TC).

SPECIFICATION MCSpec

CONSTANTS
    Nodes      = {n1, n2, n3, n4}
    ByzNodes   = {n4}
    HonestNodes = {n1, n2, n3}

    Slots      = {1}
    Views      = {1}
    HSRounds   = {1, 2}
    K          = 1
    Proposals  = {P1, P2}
    None       = None

    \* F1: allow 1 equivocation event
    MaxByzEquivocate  = 1
    \* Zero out irrelevant noise
    MaxByzTimeout     = 0
    MaxTimeoutPerView = 0
    MaxFormTC         = 0
    MaxHSCrash        = 0
    MaxViewAdvance    = 0

    MaxMsgBuf = 15

SYMMETRY Perms
CONSTRAINT MsgBufOK

INVARIANTS
    TypeOK
    UniqueCommit
