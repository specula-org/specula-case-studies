\* MC_hunt_f5_gc.cfg
\* Target: Family 5 — Inverted GC Predicate
\* Mechanism: clean_slot_periods (core.rs:1612-1617) uses retain predicate
\*            s2 % K != slot_period && s2 <= s  (De Morgan complement of intended)
\*            which drops future active slots s2 > s in other lanes.
\* Target invariant: GCPreservesActive
\*
\* Need K=2 (pipeline) and 2 slots in the same lane to trigger.
\* Slot 1 commits, GC runs, slot 3 (same lane: 3%2=1%2=1) should survive.

SPECIFICATION MCSpec

CONSTANTS
    Nodes      = {n1, n2, n3, n4}
    ByzNodes   = {n4}
    HonestNodes = {n1, n2, n3}

    Slots      = {1, 2, 3}
    Views      = {1}
    HSRounds   = {1, 2}
    K          = 2
    Proposals  = {P1}
    None       = None

    \* F5: no Byzantine actions needed; bug is in honest GC path
    MaxByzEquivocate  = 0
    MaxByzTimeout     = 0
    MaxTimeoutPerView = 0
    MaxFormTC         = 0
    MaxHSCrash        = 0
    MaxViewAdvance    = 0

    MaxMsgBuf = 15

SYMMETRY Perms
CONSTRAINT MsgBufOK

INVARIANTS
    TypeOK
    GCPreservesActive
