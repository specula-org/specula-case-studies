\* MC_hunt_f3_confirm_equivocation.cfg
\* Target: Family 3 — Confirm Equivocation Guard Missing
\* Mechanism: is_valid for Confirm (core.rs:1167-1183) lacks the last_voted_consensus
\*            guard. Honest node can cast ConfirmVote twice for same (slot, view).
\*            Byzantine aggregator forms two conflicting ConfirmQCs.
\* Target invariant: NoConfirmEquivocation
\*
\* Setup: 1 slot, 1 view, replayed/duplicate Confirm messages, no view-change noise.

SPECIFICATION MCSpec

CONSTANTS
    Nodes      = {n1, n2, n3, n4}
    ByzNodes   = {n4}
    HonestNodes = {n1, n2, n3}

    Slots      = {1}
    Views      = {1}
    HSRounds   = {1, 2}
    K          = 1
    Proposals  = {P1}
    None       = None

    \* F3: disable noise; the bug triggers on duplicate Confirm delivery
    MaxByzEquivocate  = 0
    MaxByzTimeout     = 0
    MaxTimeoutPerView = 0
    MaxFormTC         = 0
    MaxHSCrash        = 0
    MaxViewAdvance    = 0

    MaxMsgBuf = 12

SYMMETRY Perms
CONSTRAINT MsgBufOK

INVARIANTS
    TypeOK
    NoConfirmEquivocation
