\* MC.cfg — Standard model checking config.
\* Used for spec convergence (structural invariants only).
\* Bug-family invariants are listed but COMMENTED OUT.
\* Use MC_hunt_*.cfg files after spec converges.

SPECIFICATION MCSpec

CONSTANTS
    \* Node set: 4 nodes, 1 Byzantine (f=1, n=3f+1=4)
    Nodes      = {n1, n2, n3, n4}
    ByzNodes   = {n4}
    HonestNodes = {n1, n2, n3}

    \* Protocol parameters
    Slots      = {1, 2}
    Views      = {1, 2, 3}
    HSRounds   = {1, 2, 3, 4}
    K          = 2
    Proposals  = {P1, P2}
    None       = None

    \* Fault injection bounds (moderate; tighten in hunt configs)
    MaxByzEquivocate  = 2
    MaxByzTimeout     = 2
    MaxTimeoutPerView = 3
    MaxFormTC         = 3
    MaxHSCrash        = 1
    MaxViewAdvance    = 4

    MaxMsgBuf = 20

SYMMETRY Perms

\* State constraint: message buffer size
CONSTRAINT MsgBufOK

\* --- Structural invariants (always enabled) ---
INVARIANTS
    TypeOK
    CommitOnce

\* --- Safety invariants (bug-family hunting) ---
\* COMMENT THESE OUT during spec convergence; use hunt configs after.
\* INVARIANTS
\*     UniqueCommit
\*     AgreementOnProposals
\*     ViewChangeSafety
\*     TimeoutAuthenticityBound
\*     NoConfirmEquivocation
\*     TwoChainCommitRule
\*     VoteSafety
\*     GCPreservesActive
