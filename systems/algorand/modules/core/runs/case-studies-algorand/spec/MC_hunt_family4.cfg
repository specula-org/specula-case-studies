\* Bug Family 4: Freshest Bundle / fresherThan Edge Cases (MEDIUM)
\* Brief §2 mechanism: (1) none.fresherThan(none) == true (events.go:746-748);
\* (2) certThreshold.fresherThan(certThreshold) == false (events.go:777
\* short-circuit). Combined with proposalStore.softThreshold/certThreshold
\* blindly setting Staging, can create inconsistency between Freshest and Staging.
\* MC-3 finding (Brief §6.1): certThreshold(R, P1) cached as Freshest; later
\* certThreshold(R, P2) for different value arrives. Cache is NOT replaced
\* (short-circuit). partitionPolicy rebroadcasts the stale P1 cert.

