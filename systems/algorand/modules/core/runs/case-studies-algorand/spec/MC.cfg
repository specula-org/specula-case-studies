SPECIFICATION MCSpec

CONSTANTS
    Server = {n1, n2, n3, n4}
    ByzServer = {n4}
    MaxRound = 2
    MaxPeriod = 2
    MaxStep = 6
    Values = {v1, v2}
    Bottom = Bottom
    Nil = Nil

    StepPropose = 0
    StepSoft = 1
    StepCert = 2
    StepNext = 3
    StepLate = 253
    StepRedo = 254
    StepDown = 255

    PartitionStepNum = 6

    SoftThresholdT = "soft"
    CertThresholdT = "cert"
    NextThresholdT = "next"
    NoneThresholdT = "none"

    ProposalMsg = "ProposalMsg"
    VoteMsg = "VoteMsg"
    BundleMsg = "BundleMsg"

    FT_Short = "FT_Short"
    FT_Default = "FT_Default"

    \* MC bounds — small but exploratory
    MaxByzVoteLimit = 3
    MaxCatchupLimit = 1
    MaxCrashLimit = 1
    MaxLoseLimit = 2
    MaxForkViewLimit = 1
    MaxFastPrimerLimit = 2
    MaxMsgBufferLimit = 12

SYMMETRY Symmetry
VIEW ModelView
CONSTRAINT MsgBufferConstraint

INVARIANTS
    \* --- Standard safety (always on) ---
    AgreementSafety
    LedgerConsistency

    \* --- Structural (always on) ---
    MCTypeOK
    RoundBound
    PeriodBound
    PersistedNotAhead
    CommitteeViewSubset
    LedgerSourceValid
    InFlightOnlyOwn
    HonestVoteInCommittee

    \* --- Bug-family invariants: defined in base.tla, ENABLED in MC.cfg
    \* during spec validation. Hunt cfgs zero unrelated bounds and may
    \* select a subset. Listed here so MC.cfg passes a smoke check.
    StagingMatchesFreshest
    ReproposalGuardEnforced
    CertImpliesStartingValue
    NoCrossRoundEquivocation
    PersistedBeforeBroadcast
    FilterTimeoutWithinBounds

PROPERTIES
    DecisionMonotone
    LedgerStable
    RoundMonotone
    PersistedMonotone
