\* Bug Family 1: Catchup vs Live Agreement Race (HIGH)
\* Brief §2 mechanism: pseudonode votes broadcast AFTER an external catchup
\* install for the same round. Targets: AgreementSafety, LedgerConsistency,
\* NoCrossRoundEquivocation.
\* MC-1 finding (Brief §6.1): CatchupInstall(R, V_c) then BroadcastVote
\* (R, P, cert, V_l) for V_l /= V_c. Can CertCommitteeThreshold form for V_l?

