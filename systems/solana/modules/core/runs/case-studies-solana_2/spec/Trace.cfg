\* === Trace.cfg ===
\* Trace validation config. The constants here are placeholders that the
\* harness will rewrite per-trace; concrete pubkeys and stakes come from
\* the trace's bootstrap event.

CONSTANTS
    Honest = {"h1", "h2"}
    Byzantine = {"b1"}
    NullSlot = 999
    NullHash = "null"
    Hashes = {"H1", "H2", "H3", "H4", "H5", "H6", "H7", "H8", "H9", "H10"}
    MaxSlot = 8
    MaxLockoutHistory = 8
    SwitchThresholdNum = 38
    SwitchThresholdDen = 100
    SuperMajorityNum = 2
    SuperMajorityDen = 3
    OptimisticThresholdNum = 2
    OptimisticThresholdDen = 3

\* TLC's config parser does not accept the @@ function-merge operator
\* inline, so we override Stake to the StakeImpl operator defined in Trace.tla.
CONSTANT
    Stake <- StakeImpl

SPECIFICATION TraceSpec

\* TraceMatched (<>(l > Len(TraceLog))) verified by relying on TLC's
\* deadlock detection: if the trace can be fully consumed, the
\* TraceFinished stutter loop fires and TLC terminates cleanly; if not,
\* TLC reports deadlock at the first non-consumable line.
\* (Following the pattern used by case-studies/arc-swap_2.)
\* PROPERTIES TraceMatched

\* Trace validation invariants — only those that should hold on every real
\* execution. Bug-family invariants (OCSingleHash, etc.) are excluded
\* because real traces run without fault injection and would not exercise
\* the conditions the invariant guards against.
INVARIANTS
    TypeOK
    BlockstoreRootMonotonic
    FrozenBlocksHaveValidParents
    LockoutSafety
    TowerSyncConsistency
    PostCrashNoDoubleVote
