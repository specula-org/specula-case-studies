\* === MC_hunt_family3.cfg — Crash Window Across Tower / Blockstore / Voting Channel ===
\* Brief §2 Family 3, §6.1 MC4.
\*
\* Hunting strategy: allow Crash + Recover to interleave between the four
\* persistence-pipeline steps (SetBlockstoreRoot, EnqueueVoteOp,
\* VotingServiceStore, VotingServiceSendTx). The bug fires when a vote tx
\* has been broadcast pre-crash but tower_on_disk wasn't yet updated;
\* recovered tower allows a double-vote at a slot already broadcast.
\*
\* Counter strategy:
\*   * MaxCrash = 2           — multiple crash windows
\*   * MaxBlocks = 4          — enough slots for two votes
\*   * MaxByzGossip = 0       — Family 5 not load-bearing here
\*   * MaxByzEquivocate = 0   — Family 4 not load-bearing here
\*   * MaxAdopt = 0           — Family 1 not load-bearing here

CONSTANTS
    Honest = {h1, h2}
    Byzantine = {b1}
    NullSlot = 99
    NullHash = "null"
    Hashes = {"H1", "H2"}
    MaxSlot = 4
    MaxLockoutHistory = 2
    SwitchThresholdNum = 38
    SwitchThresholdDen = 100
    SuperMajorityNum = 2
    SuperMajorityDen = 3
    OptimisticThresholdNum = 2
    OptimisticThresholdDen = 3
    MaxBlocks = 4
    MaxAdopt = 0
    MaxStraySet = 0
    MaxSwitchNormal = 0
    MaxSwitchStray = 0
    MaxSwitchDup = 0
    MaxCrash = 2
    MaxByzGossip = 0
    MaxByzEquivocate = 0
    MaxOCNotify = 0

CONSTANT Stake <- MCStakeAllOne

INIT MCInit
NEXT MCNext

SYMMETRY SymmetryHonest
VIEW View
CONSTRAINT StateConstraint

\* Family 3 invariants
INVARIANTS
    TypeOK
    PostCrashNoDoubleVote
    RPCRootIntegrity
    ReconcileNonPanic
    LockoutSafety
