\* === MC_hunt_family4.cfg — Optimistic Confirmation Under Byzantine Equivocation ===
\* Brief §2 Family 4, §6.1 MC5.
\*
\* Hunting strategy: allow Byzantine validator to equivocate (sign two
\* (slot, hash) tower-syncs) and let TrackOptimisticVote distribute its
\* stake into BOTH per-hash buckets. With ≥1/3 Byzantine stake, two
\* OC notifications can fire for the same slot.
\*
\* Stake setup: b1 has 2 of 4 total = 50% — well over 1/3. The OCSingleHash
\* invariant is INTENDED to be violated here (brief §6.1 MC5: "the answer
\* is yes-by-design"); this cfg quantifies the Byzantine-stake threshold.
\*
\* Counter strategy:
\*   * MaxByzEquivocate = 2   — multiple equivocations
\*   * MaxOCNotify = 3        — let multiple OCs fire
\*   * Block + freeze enough for two distinct hashes per slot

CONSTANTS
    Honest = {h1, h2}
    Byzantine = {b1}
    NullSlot = 99
    NullHash = "null"
    Hashes = {"H1", "H2"}
    MaxSlot = 2
    MaxLockoutHistory = 2
    SwitchThresholdNum = 38
    SwitchThresholdDen = 100
    SuperMajorityNum = 2
    SuperMajorityDen = 3
    OptimisticThresholdNum = 2
    OptimisticThresholdDen = 3
    MaxBlocks = 3
    MaxAdopt = 0
    MaxStraySet = 0
    MaxSwitchNormal = 0
    MaxSwitchStray = 0
    MaxSwitchDup = 0
    MaxCrash = 0
    MaxByzGossip = 0
    MaxByzEquivocate = 2
    MaxOCNotify = 3

CONSTANT Stake <- MCStakeByz2

INIT MCInit
NEXT MCNext

SYMMETRY SymmetryHonest
VIEW View
CONSTRAINT StateConstraint

\* Family 4 invariants — OCSingleHash is EXPECTED to be violated
\* when ByzantineStake * 3 >= TotalStake; the invariant itself encodes
\* this threshold so a violation means stake share is below 1/3.
INVARIANTS
    TypeOK
    OCSingleHash
    OCImpliesNoRollback
