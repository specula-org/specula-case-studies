\* === MC_hunt_family2.cfg — Switch-Threshold Soundness (Stray + Duplicate-Freebie) ===
\* Brief §2 Family 2, §6.1 MC2 / MC3.
\*
\* Hunting strategy: enable both the stray-branch attack (gossip-fed
\* switch) and the duplicate-freebie attack (zero-stake SwitchProof when
\* last_vote was rooted normally). Combined with Byzantine gossip injection.
\*
\* Counter strategy:
\*   * MaxByzGossip = 3        — Byzantine fakes multiple stray gossip claims
\*   * MaxStraySet = 1         — one stray set-up
\*   * MaxSwitchStray = 1      — run the stray-relaxation branch
\*   * MaxSwitchDup = 1        — run the duplicate-freebie branch
\*   * MaxSwitchNormal = 0     — irrelevant
\*   * MaxCrash = 0            — composing with Family 3 is in family3 cfg

CONSTANTS
    Honest = {h1, h2}
    Byzantine = {b1}
    NullSlot = 99
    NullHash = "null"
    Hashes = {"H1", "H2"}
    MaxSlot = 3
    MaxLockoutHistory = 2
    SwitchThresholdNum = 38
    SwitchThresholdDen = 100
    SuperMajorityNum = 2
    SuperMajorityDen = 3
    OptimisticThresholdNum = 2
    OptimisticThresholdDen = 3
    MaxBlocks = 3
    MaxAdopt = 0
    MaxStraySet = 1
    MaxSwitchNormal = 0
    MaxSwitchStray = 1
    MaxSwitchDup = 1
    MaxCrash = 0
    MaxByzGossip = 3
    MaxByzEquivocate = 0
    MaxOCNotify = 0

CONSTANT Stake <- MCStakeByz2

INIT MCInit
NEXT MCNext

SYMMETRY SymmetryHonest
VIEW View
CONSTRAINT StateConstraint

\* Family 2 invariants
INVARIANTS
    TypeOK
    SwitchProofSoundness
    StrayBranchSwitchProofGuard
    LockoutSafety
