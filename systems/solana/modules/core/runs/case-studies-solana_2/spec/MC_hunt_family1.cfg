\* === MC_hunt_family1.cfg — Tower State Bifurcation (vote_state vs last_vote) ===
\* Brief §2 Family 1, §6.1 MC1.
\*
\* Hunting strategy: force AdoptOnChainVoteState to fire WITHOUT the
\* corresponding UpdateLastVoteFromVoteState. The bug fires when the
\* validator subsequently calls CheckSwitch* (which reads last_vote view)
\* while vote_state remains populated — exposing TowerSyncConsistency
\* and downstream LockoutSafety failures.
\*
\* Counter strategy:
\*   * MaxAdopt = 1            — minimal: one adoption is enough
\*   * MaxSwitchNormal = 1     — let the validator try a switch decision
\*   * MaxByzGossip / MaxByzEquivocate = 0 — irrelevant
\*   * MaxCrash = 0            — Family 3 not load-bearing here
\*   * Small hash/block counts — minimal forks

CONSTANTS
    Honest = {h1, h2}
    Byzantine = {b1}
    NullSlot = 99
    NullHash = "null"
    Hashes = {"H1", "H2"}
    MaxSlot = 3
    MaxLockoutHistory = 2
    SwitchThresholdNum = 38
    SwitchThresholdDen = 100
    SuperMajorityNum = 2
    SuperMajorityDen = 3
    OptimisticThresholdNum = 2
    OptimisticThresholdDen = 3
    MaxBlocks = 3
    MaxAdopt = 1
    MaxStraySet = 0
    MaxSwitchNormal = 1
    MaxSwitchStray = 0
    MaxSwitchDup = 0
    MaxCrash = 0
    MaxByzGossip = 0
    MaxByzEquivocate = 0
    MaxOCNotify = 0

CONSTANT Stake <- MCStakeAllOne

INIT MCInit
NEXT MCNext

SYMMETRY SymmetryHonest
VIEW View
CONSTRAINT StateConstraint

\* Family 1 invariants
INVARIANTS
    TypeOK
    TowerSyncConsistency
    LockoutSafety
