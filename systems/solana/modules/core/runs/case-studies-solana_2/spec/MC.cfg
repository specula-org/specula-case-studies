\* === MC.cfg — convergence config ===
\* Standard safety + structural invariants. Bug-family invariants are
\* defined in base.tla and listed here for visibility but commented out;
\* the per-family hunt cfgs (MC_hunt_*.cfg) re-enable them with tighter
\* bounds.

CONSTANTS
    Honest = {h1, h2}
    Byzantine = {b1}
    NullSlot = 99
    NullHash = "null"
    Hashes = {"H1", "H2"}
    MaxSlot = 3
    MaxLockoutHistory = 2
    SwitchThresholdNum = 38
    SwitchThresholdDen = 100
    SuperMajorityNum = 2
    SuperMajorityDen = 3
    OptimisticThresholdNum = 2
    OptimisticThresholdDen = 3
    MaxBlocks = 4
    MaxAdopt = 1
    MaxStraySet = 1
    MaxSwitchNormal = 2
    MaxSwitchStray = 1
    MaxSwitchDup = 1
    MaxCrash = 1
    MaxByzGossip = 2
    MaxByzEquivocate = 1
    MaxOCNotify = 2

CONSTANT Stake <- MCStakeAllOne

SPECIFICATION MCSpec

SYMMETRY SymmetryHonest
VIEW View
CONSTRAINT StateConstraint

\* === Standard structural invariants ===
INVARIANTS
    TypeOK
    BlockstoreRootMonotonic
    FrozenBlocksHaveValidParents
    CountersOK

\* === Bug-family invariants (commented out — re-enabled in hunt cfgs) ===
\* INVARIANTS
\*     TowerSyncConsistency        \* F1 (brief §5)
\*     LockoutSafety               \* F1, F2 baseline (brief §5)
\*     SwitchProofSoundness        \* F2 (brief §5)
\*     StrayBranchSwitchProofGuard \* F2 (brief §5)
\*     PostCrashNoDoubleVote       \* F3 (brief §5)
\*     RPCRootIntegrity            \* F3 (brief §5)
\*     ReconcileNonPanic           \* F3 (brief §5)
\*     OCSingleHash                \* F4 (brief §5)
\*     OCImpliesNoRollback         \* F4 (brief §5)
\*     GossipReplayConsistency     \* F5 (brief §5)
