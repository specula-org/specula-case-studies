\* === MC_hunt_family5.cfg — Gossip vs Replay Vote Inconsistency ===
\* Brief §2 Family 5, §6.1 MC6.
\*
\* Hunting strategy: Byzantine validator gossips (slot, hash) claims that
\* never land as transactions (ByzGossipFakeVote). The honest validator's
\* CheckSwitchNormal reads max_gossip_frozen_votes and adds the Byzantine
\* contribution to locked-out stake — flipping a FailedSwitchThreshold
\* into a SwitchProof.
\*
\* Counter strategy:
\*   * MaxByzGossip = 3       — multiple fake gossip injections
\*   * MaxSwitchNormal = 2    — let the honest validator make decisions
\*   * MaxStraySet = 0        — focus on the normal branch (gossip path
\*                              via line 1218-1268)
\*   * No crash / equivocation — keep the bug surface clean

CONSTANTS
    Honest = {h1, h2}
    Byzantine = {b1}
    NullSlot = 99
    NullHash = "null"
    Hashes = {"H1", "H2"}
    MaxSlot = 3
    MaxLockoutHistory = 2
    SwitchThresholdNum = 38
    SwitchThresholdDen = 100
    SuperMajorityNum = 2
    SuperMajorityDen = 3
    OptimisticThresholdNum = 2
    OptimisticThresholdDen = 3
    MaxBlocks = 3
    MaxAdopt = 0
    MaxStraySet = 0
    MaxSwitchNormal = 2
    MaxSwitchStray = 0
    MaxSwitchDup = 0
    MaxCrash = 0
    MaxByzGossip = 3
    MaxByzEquivocate = 0
    MaxOCNotify = 0

CONSTANT Stake <- MCStakeByz2

INIT MCInit
NEXT MCNext

SYMMETRY SymmetryHonest
VIEW View
CONSTRAINT StateConstraint

\* Family 5 invariants
INVARIANTS
    TypeOK
    GossipReplayConsistency
    SwitchProofSoundness
