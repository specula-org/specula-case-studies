\* MC_hunt_family3_oc_equivocation.cfg
\* Bug Family 3: Optimistic Confirmation Equivocation Accounting.
\* Brief 6.1 findings: MC-1, MC-4.
\*
\* Hunts:
\*   - Dual-hash OC for the same slot under Byzantine equivocation.
\*   - OC rollback under Byzantine influence (the "bound" the brief asks about).
\*
\* Composition: 2.1 Equivocation × 5.2 Partition (drop).
\*
\* Threat profile: with 4 validators and ~1/3 Byzantine, the model can probe the
\* boundary at f = 1.  To search the exact OC rollback bound, the operator can
\* increase MaxByzEquivLimit and add a second Byzantine validator.

CONSTANTS
    Server = {v1, v2, v3, v4}
    Byzantine = {v4}
    MaxSlot = 3
    Nil = Nil
    Hashes = {hA, hB}
    TwoForkRoot = hA
    MainForkHash = hA
    AltForkHash = hB
    SwitchNumer = 38
    SwitchDenom = 100
    OCNumer = 2
    OCDenom = 3
    DupNumer = 52
    DupDenom = 100
    LockoutThresholdDepths = {4, 5, 8}

    MaxCrashLimit         = 0
    MaxCrashFsyncLimit    = 0
    MaxDropLimit          = 2
    MaxAdoptLimit         = 0
    MaxByzEquivLimit      = 3
    MaxByzFakeGossipLimit = 0
    MaxByzBankCraftLimit  = 0
    MaxByzDupConfLimit    = 0
    MaxByzReuseLimit      = 0
    MaxMsgBufferLimit     = 10

SPECIFICATION MCSpec

SYMMETRY MCSymmetry

VIEW MCView

CONSTRAINT MsgBufferConstraint

CHECK_DEADLOCK FALSE

INVARIANTS
    NoDualHashOC
    OCRollbackBounded
    NoEquivocatingVoteFromHonest
    \* Sanity:
    TowerLastVotedSlotInRange
    OCStakeWellFormed
    RootedHashWellFormed
    ForkTreeWellFormed
    PanicImpliesDead
