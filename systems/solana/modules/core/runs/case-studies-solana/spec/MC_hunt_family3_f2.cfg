\* MC_hunt_family3_f2.cfg
\* Family 3 with f = ceil(n/3) = 2 Byzantine validators.
\* Tests the brief's MC-1 / MC-4 hypothesis at the theoretical boundary.
\*
\* With 2 honest + 2 Byzantine equivocating across two forks, both (slot, hA)
\* and (slot, hB) can reach 2/3 stake simultaneously (3 each, sharing the
\* 2 Byzantine voters). The NoDualHashOC invariant is expected to fail.

CONSTANTS
    Server = {v1, v2, v3, v4}
    Byzantine = {v3, v4}
    MaxSlot = 3
    Nil = Nil
    Hashes = {hA, hB}
    TwoForkRoot = hA
    MainForkHash = hA
    AltForkHash = hB
    SwitchNumer = 38
    SwitchDenom = 100
    OCNumer = 2
    OCDenom = 3
    DupNumer = 52
    DupDenom = 100
    LockoutThresholdDepths = {4, 5, 8}

    MaxCrashLimit         = 0
    MaxCrashFsyncLimit    = 0
    MaxDropLimit          = 2
    MaxAdoptLimit         = 0
    MaxByzEquivLimit      = 4
    MaxByzFakeGossipLimit = 0
    MaxByzBankCraftLimit  = 0
    MaxByzDupConfLimit    = 0
    MaxByzReuseLimit      = 0
    MaxMsgBufferLimit     = 12

SPECIFICATION MCSpec

SYMMETRY MCSymmetry

VIEW MCView

CONSTRAINT MsgBufferConstraint

CHECK_DEADLOCK FALSE

INVARIANTS
    NoDualHashOC
    OCRollbackBounded
    \* Sanity:
    TowerLastVotedSlotInRange
    OCStakeWellFormed
    RootedHashWellFormed
    ForkTreeWellFormed
    PanicImpliesDead
