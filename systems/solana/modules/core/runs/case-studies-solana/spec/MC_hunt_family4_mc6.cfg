\* MC_hunt_family4_mc6.cfg
\* Family 4 / MC-6 probe: tower-stranding via purge.
\* NoDualHashDuplicateConfirm is intentionally OMITTED so the search isn't
\* preempted by MC-5 (which always fires first under the dual-hash equivocation).
\* Goal: drive Byzantine-injected non-canonical dup-conf with an honest vote
\* on the slot, then PurgeUnconfirmedSlot, leaving the tower stranded.

CONSTANTS
    Server = {v1, v2, v3, v4}
    Byzantine = {v4}
    MaxSlot = 3
    Nil = Nil
    Hashes = {hA, hB}
    TwoForkRoot = hA
    MainForkHash = hA
    AltForkHash = hB
    SwitchNumer = 38
    SwitchDenom = 100
    OCNumer = 2
    OCDenom = 3
    DupNumer = 52
    DupDenom = 100
    LockoutThresholdDepths = {4, 5, 8}

    MaxCrashLimit         = 0
    MaxCrashFsyncLimit    = 0
    MaxDropLimit          = 1
    MaxAdoptLimit         = 0
    MaxByzEquivLimit      = 1
    MaxByzFakeGossipLimit = 0
    MaxByzBankCraftLimit  = 0
    MaxByzDupConfLimit    = 2
    MaxByzReuseLimit      = 0
    MaxMsgBufferLimit     = 8

SPECIFICATION MCSpec

SYMMETRY MCSymmetry

VIEW MCView

CONSTRAINT MsgBufferConstraint

CHECK_DEADLOCK FALSE

INVARIANTS
    TowerVotesAreOnExistingForks
    NoHonestPanic
    \* Sanity:
    TowerLastVotedSlotInRange
    OCStakeWellFormed
    RootedHashWellFormed
    ForkTreeWellFormed
    PanicImpliesDead
