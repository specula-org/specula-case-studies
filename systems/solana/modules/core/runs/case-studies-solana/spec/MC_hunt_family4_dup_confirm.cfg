\* MC_hunt_family4_dup_confirm.cfg
\* Bug Family 4: Duplicate-Slot Reconciliation & Fork-Choice State Hazards.
\* Brief 6.1 findings: MC-5, MC-6.
\*
\* Hunts:
\*   - Dual-hash duplicate-confirm assertion panic (replay_stage.rs:2226-2230)
\*   - Tower stranded after purge_unconfirmed_slot
\*
\* Composition: 2.1 Equivocation × the duplicate-confirm dual-hash injector.

CONSTANTS
    Server = {v1, v2, v3, v4}
    Byzantine = {v4}
    MaxSlot = 3
    Nil = Nil
    Hashes = {hA, hB}
    TwoForkRoot = hA
    MainForkHash = hA
    AltForkHash = hB
    SwitchNumer = 38
    SwitchDenom = 100
    OCNumer = 2
    OCDenom = 3
    DupNumer = 52
    DupDenom = 100
    LockoutThresholdDepths = {4, 5, 8}

    MaxCrashLimit         = 0
    MaxCrashFsyncLimit    = 0
    MaxDropLimit          = 1
    MaxAdoptLimit         = 0
    MaxByzEquivLimit      = 1
    MaxByzFakeGossipLimit = 0
    MaxByzBankCraftLimit  = 0
    MaxByzDupConfLimit    = 3
    MaxByzReuseLimit      = 0
    MaxMsgBufferLimit     = 8

SPECIFICATION MCSpec

SYMMETRY MCSymmetry

VIEW MCView

CONSTRAINT MsgBufferConstraint

CHECK_DEADLOCK FALSE

INVARIANTS
    NoDualHashDuplicateConfirm
    TowerVotesAreOnExistingForks
    NoHonestPanic
    \* Sanity:
    TowerLastVotedSlotInRange
    OCStakeWellFormed
    RootedHashWellFormed
    ForkTreeWellFormed
    PanicImpliesDead
