\* ============================================================================
\* MC_hunt_config_safety.cfg — Bug Family 2: Configuration Change Safety
\* ============================================================================
\* Target: ElectionSafety and ConfigSafety violations during config changes
\* Mechanism: quorumSize/checkLeaderLease/electSelf use latestConfig (uncommitted)
\*            while leader step-down uses committedConfig. Inconsistent quorum
\*            decisions during config changes.
\*
\* Tight bounds: maximize config changes and elections, minimize irrelevant.
\* ============================================================================

SPECIFICATION MCSpecDynamic

CONSTANTS
    s1 = s1
    s2 = s2
    s3 = s3

    Server = {s1, s2, s3}

    \* Tight bounds for config safety hunting
    MaxTermLimit        = 4      \* Need multiple terms with config changes
    MaxTimeoutLimit     = 5      \* Elections during config transitions
    RequestLimit        = 2      \* Some entries needed for commit advancement
    CrashLimit          = 1      \* Crash during config change may expose bugs
    LoseLimit           = 2      \* Partition during config change
    HeartbeatLimit      = 2      \* Minimal heartbeats
    DiskBlockLimit      = 0      \* Not needed for this family
    ConfigChangeLimit   = 3      \* HIGH: config changes are the bug trigger
    MaxMsgBufferLimit   = 10

    Timeout             <- MCTimeout
    ClientRequest       <- MCClientRequest
    Crash               <- MCCrash
    LoseMessage         <- MCLoseMessage
    SendHeartbeat       <- MCSendHeartbeat
    DiskBlock           <- MCDiskBlock
    ProposeConfigChange <- MCProposeConfigChange

    Nil = Nil
    Follower    = Follower
    Candidate   = Candidate
    Leader      = Leader
    ValueEntry  = ValueEntry
    ConfigEntry = ConfigEntry
    RequestVoteRequest      = RequestVoteRequest
    RequestVoteResponse     = RequestVoteResponse
    AppendEntriesRequest    = AppendEntriesRequest
    AppendEntriesResponse   = AppendEntriesResponse

SYMMETRY Symmetry

CHECK_DEADLOCK FALSE

CONSTRAINT MsgBufferConstraint

\* Core safety + targeted bug-family invariants
INVARIANTS
    ElectionSafety
    LogMatching
    LeaderCompleteness
    ConfigSafety
