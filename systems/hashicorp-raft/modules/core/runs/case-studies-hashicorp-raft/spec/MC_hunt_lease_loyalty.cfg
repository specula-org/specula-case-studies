\* MC_hunt_lease_loyalty.cfg — Bug Family 1: LeaseImpliesLoyalty only
\* Same config as phantom_lease but only checking LeaseImpliesLoyalty

SPECIFICATION MCSpecDynamic

CONSTANTS
    s1 = s1
    s2 = s2
    s3 = s3

    Server = {s1, s2, s3}

    MaxTermLimit        = 3
    MaxTimeoutLimit     = 3
    RequestLimit        = 1
    CrashLimit          = 0
    LoseLimit           = 2
    HeartbeatLimit      = 8
    DiskBlockLimit      = 2
    ConfigChangeLimit   = 0
    MaxMsgBufferLimit   = 10

    Timeout             <- MCTimeout
    ClientRequest       <- MCClientRequest
    Crash               <- MCCrash
    LoseMessage         <- MCLoseMessage
    SendHeartbeat       <- MCSendHeartbeat
    DiskBlock           <- MCDiskBlock
    ProposeConfigChange <- MCProposeConfigChange

    Nil = Nil
    Follower    = Follower
    Candidate   = Candidate
    Leader      = Leader
    ValueEntry  = ValueEntry
    ConfigEntry = ConfigEntry
    RequestVoteRequest      = RequestVoteRequest
    RequestVoteResponse     = RequestVoteResponse
    AppendEntriesRequest    = AppendEntriesRequest
    AppendEntriesResponse   = AppendEntriesResponse

SYMMETRY Symmetry

CHECK_DEADLOCK FALSE

CONSTRAINT MsgBufferConstraint

INVARIANTS
    ElectionSafety
    LogMatching
    LeaseImpliesLoyalty
