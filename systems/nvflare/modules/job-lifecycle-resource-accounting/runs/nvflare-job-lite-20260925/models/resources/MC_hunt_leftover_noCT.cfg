\* Resource ownership: two jobs, two clients, one unit per client, max_jobs 2, all faults <= 1.
CONSTANTS
    Jobs = {j1, j2}
    Clients = {c1, c2}
    K = 1
    MinSites = 1
    MaxAttempts = 2
    MaxJobs = 2
    NoJob = NoJob
    MaxCheckTimeout = 0
    MaxSkip = 1
    MaxDeployFail = 1
    MaxSJLaunchFail = 1
    MaxStartTimeout = 1
    MaxExpireInUse = 1
    MaxLaunchFail = 1
INIT MCInit
NEXT MCNext
SYMMETRY ClientSymmetry
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    ResourceConservation
    NoOverAllocation
    AllocationOwned
    \* diagnostics (enabled in hunt configs):
    \* ReservationTracked
    NoRejectionByLeftoverReservation
