\* Hunt S4 / MC-4: completion loop, fail_run (client failure reports / missing outcomes) and admin
\* abort overlapping the start path. One job, two clients. Uses the explicit prompt-RUNNING timing
\* assumption so that candidate MC-4a does not mask other paths.
CONSTANTS
    Jobs = {j1}
    Clients = {c1, c2}
    MaxJobs = 1
    MinSites = 1
    NoJob = NoJob
    AbortSet = {j1}
    DeleteSet = {}
    MaxNoResource = 0
    MaxServerDeployFail = 0
    MaxClientDeployFail = 1
    MaxSJLaunchFail = 0
    MaxStartErr = 1
    MaxStartTimeout = 1
    MaxSJExitFail = 1
    MaxCJExitFail = 1
    MaxReportLost = 1
    MaxOutcomeDeadline = 1
    AbortOnlyRunning = TRUE
INIT MCInit
NEXT MCNext
SYMMETRY ClientSymmetry
CHECK_DEADLOCK FALSE
ACTION_CONSTRAINT AssumeBoth
INVARIANTS
    TypeOK
    TerminalStatusStable
    NoStaleAdmission
    AbortOfLiveRunEndsAborted
