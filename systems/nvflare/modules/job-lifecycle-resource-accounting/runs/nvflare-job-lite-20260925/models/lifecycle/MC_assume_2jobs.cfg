\* Two concurrent jobs (max_jobs=2), one client, all faults at 1, admin aborts of RUNNING jobs only,
\* no deletes. Timing assumptions AssumeBoth (see MC.tla) to look past MC-4a/MC-4b.
CONSTANTS
    Jobs = {j1, j2}
    Clients = {c1}
    MaxJobs = 2
    MinSites = 1
    NoJob = NoJob
    AbortSet = {j1, j2}
    DeleteSet = {}
    MaxNoResource = 1
    MaxServerDeployFail = 1
    MaxClientDeployFail = 1
    MaxSJLaunchFail = 1
    MaxStartErr = 1
    MaxStartTimeout = 1
    MaxSJExitFail = 1
    MaxCJExitFail = 1
    MaxReportLost = 1
    MaxOutcomeDeadline = 1
    AbortOnlyRunning = TRUE
INIT MCInit
NEXT MCNext
CHECK_DEADLOCK FALSE
ACTION_CONSTRAINT AssumeBoth
INVARIANTS
    TypeOK
    RunnerAlive
    TerminalStatusStable
    NoStaleAdmission
    AbortOfLiveRunEndsAborted
