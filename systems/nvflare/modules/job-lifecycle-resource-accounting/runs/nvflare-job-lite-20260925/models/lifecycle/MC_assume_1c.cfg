\* Standard configuration: structural + core invariants, no admin abort/delete,
\* faults enabled at small bounds. Scenario invariants are enabled in MC_hunt_*.cfg.
CONSTANTS
    Jobs = {j1, j2}
    Clients = {c1}
    MaxJobs = 1
    MinSites = 1
    NoJob = NoJob
    AbortSet = {}
    DeleteSet = {}
    MaxNoResource = 1
    MaxServerDeployFail = 1
    MaxClientDeployFail = 1
    MaxSJLaunchFail = 1
    MaxStartErr = 1
    MaxStartTimeout = 1
    MaxSJExitFail = 1
    MaxCJExitFail = 1
    MaxReportLost = 1
    MaxOutcomeDeadline = 1
    AbortOnlyRunning = FALSE

INIT MCInit
NEXT MCNext
SYMMETRY ClientSymmetry
CHECK_DEADLOCK FALSE
ACTION_CONSTRAINT AssumePromptRunningWrite

INVARIANTS
    TypeOK
    RunnerAlive
    TerminalStatusStable
    NoStaleAdmission
    \* Scenario invariants (enabled in hunt configs):
    \* AbortHonored
    AbortOfLiveRunEndsAborted
