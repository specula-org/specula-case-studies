\* Scenario 3-5 liveness (MC-5): after a terminal status every live client eventually runs no process of the
\* job and holds none of its units (heartbeat cleanup, expiry, waiter free).
SPECIFICATION MCLiveSpec

CONSTANTS
    Jobs = {"j1"}
    Clients = {c1}
    Units = {u1}
    Need = 1
    MaxJobs = 1
    MaxScheduleCount = 1
    Expiry = 1
    EnableUnsupported = FALSE
    None = None
    JobOrder <- MCJobOrder1
    DeploySites <- MCDeployAll
    MinSites <- MCMinOne
    Required <- MCReqNone
    PoisonAt <- MCPoisonNone

    \* fault / input bounds
    MaxLose = 1
    MaxCheckTimeout = 1
    MaxStartTimeout = 0
    MaxDeployFail = 0
    MaxSjLaunchFail = 0
    MaxBackoff = 0
    MaxSjError = 0
    MaxSjCrash = 0
    MaxCjError = 0
    MaxCjUnsafe = 0
    MaxCjDesc = 0
    MaxCpLaunchFail = 0
    MaxClientCrash = 0
    MaxAbort = 1
    MaxDelete = 0
    MaxDisable = 0
    MaxHeartbeat = 0
    MaxAppMissing = 0
    MaxAttempts = 3

\* no state CONSTRAINT: a truncated graph would make the fairness assumption vacuous;
\* attempts are naturally bounded by |Jobs| * MaxScheduleCount here.
CHECK_DEADLOCK FALSE

PROPERTIES
    EventualCleanup
