\* Focused historical MC-U1 probe; use MC_OutcomeProbes.tla.
\* Exact s4_outcome constants and fault bounds; only the oracle differs.
\* Scenario 4 (MC-4): terminal status composed from racing signals: lossy UPDATE_RUN_STATUS, client failure
\* reports, _remove_run_processes popping before the rc is captured, admin abort racing the latch.
\* Target: FinalMatchesOutcomeNovel (tolerates the F5 seed outcome); UNSAFE rc off so the RS-5 seed
\* (MC_hunt_s4_unsafe.cfg) does not mask new paths.
SPECIFICATION MCSpec

CONSTANTS
    Jobs = {"j1"}
    Clients = {c1}
    Units = {}
    Need = 0
    MaxJobs = 1
    MaxScheduleCount = 1
    Expiry = 1
    EnableUnsupported = FALSE
    None = None
    JobOrder <- MCJobOrder1
    DeploySites <- MCDeployAll
    MinSites <- MCMinOne
    Required <- MCReqNone
    PoisonAt <- MCPoisonNone

    \* fault / input bounds
    MaxLose = 1
    MaxCheckTimeout = 0
    MaxStartTimeout = 0
    MaxDeployFail = 0
    MaxSjLaunchFail = 0
    MaxBackoff = 0
    MaxSjError = 1
    MaxSjCrash = 1
    MaxCjError = 1
    MaxCjUnsafe = 0
    MaxCjDesc = 0
    MaxCpLaunchFail = 0
    MaxClientCrash = 0
    MaxAbort = 1
    MaxDelete = 0
    MaxDisable = 0
    MaxHeartbeat = 1
    MaxAppMissing = 0
    MaxAttempts = 3

SYMMETRY SymClientsUnits
VIEW ViewS4
\* No artificial cap on normal CHECK attempts.
CHECK_DEADLOCK FALSE

INVARIANTS
    NoInactiveFailureSuccess
