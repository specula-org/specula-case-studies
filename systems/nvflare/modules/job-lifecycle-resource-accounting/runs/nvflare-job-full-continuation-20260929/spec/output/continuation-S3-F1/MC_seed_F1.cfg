\* Seed F1 (fidelity): an acknowledged admin abort landing in the deploy/start window is overwritten by
\* DISPATCHED (job_runner.py:670) / RUNNING (:711) and the job runs.  Expect AbortHonored violation.
SPECIFICATION MCSpec

CONSTANTS
    Jobs = {"j1"}
    Clients = {c1}
    Units = {}
    Need = 0
    MaxJobs = 1
    MaxScheduleCount = 1
    Expiry = 1
    EnableUnsupported = FALSE
    None = None
    JobOrder <- MCJobOrder1
    DeploySites <- MCDeployAll
    MinSites <- MCMinOne
    Required <- MCReqNone
    PoisonAt <- MCPoisonNone

    \* fault / input bounds
    MaxLose = 0
    MaxCheckTimeout = 0
    MaxStartTimeout = 0
    MaxDeployFail = 0
    MaxSjLaunchFail = 0
    MaxBackoff = 0
    MaxSjError = 0
    MaxSjCrash = 0
    MaxCjError = 0
    MaxCjUnsafe = 0
    MaxCjDesc = 0
    MaxCpLaunchFail = 0
    MaxClientCrash = 0
    MaxAbort = 1
    MaxDelete = 0
    MaxDisable = 0
    MaxHeartbeat = 0
    MaxAppMissing = 0
    MaxAttempts = 3

SYMMETRY SymClientsUnits
VIEW ViewS1
\* No artificial cap on normal CHECK attempts.
CHECK_DEADLOCK FALSE

INVARIANTS
    AbortHonored
