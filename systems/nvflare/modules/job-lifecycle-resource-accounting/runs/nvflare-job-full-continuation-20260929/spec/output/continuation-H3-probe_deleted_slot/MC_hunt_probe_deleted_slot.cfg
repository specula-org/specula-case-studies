\* Continuation strict mechanism probe; same constants/fault bounds as MC_hunt_s2_slots.cfg.
\* Scenario 2 (MC-2): admission-slot balance on every exit path (start exceptions, KeyError path, fail_run
\* after SJ exit, stop_run of an exited SJ, publication retries).  Target: leaked or double-released slots and
\* a dead completion thread.  Orphans left by a dead runner (F2 / RS-8 seed) are tolerated by
\* NoOrphanSlotNovel; MC_seed_F2.cfg reproduces the seed.  Resources irrelevant (Need = 0).
SPECIFICATION MCSpec

CONSTANTS
    Jobs = {"j1", "j2"}
    Clients = {c1}
    Units = {}
    Need = 0
    MaxJobs = 1
    MaxScheduleCount = 2
    Expiry = 1
    EnableUnsupported = FALSE
    None = None
    JobOrder <- MCJobOrder
    DeploySites <- MCDeployAll
    MinSites <- MCMinOne
    Required <- MCReqNone
    PoisonAt <- MCPoisonNone

    \* fault / input bounds
    MaxLose = 0
    MaxCheckTimeout = 0
    MaxStartTimeout = 0
    MaxDeployFail = 0
    MaxSjLaunchFail = 0
    MaxBackoff = 0
    MaxSjError = 1
    MaxSjCrash = 1
    MaxCjError = 1
    MaxCjUnsafe = 0
    MaxCjDesc = 0
    MaxCpLaunchFail = 0
    MaxClientCrash = 0
    MaxAbort = 1
    MaxDelete = 1
    MaxDisable = 0
    MaxHeartbeat = 1
    MaxAppMissing = 0
    MaxAttempts = 3

SYMMETRY SymClientsUnits
\* No artificial cap on normal CHECK attempts.
CHECK_DEADLOCK FALSE

INVARIANTS
    NoDeletedTrackedSlot
