\* Scenario 5: partial deploy/start lifecycle under default non-strict policy.
\* C6 Case A correction: missing targets or explicit START errors are fatal even
\* if min_sites is met. Cross-phase StartFailureMatchesPolicy is not applicable.
\* Same topology/fault bounds retained for tracking, publication and slot checks;
\* these are not counted as independent min_sites/required_sites policy coverage.
SPECIFICATION MCSpec

CONSTANTS
    Jobs = {"j1"}
    Clients = {c1, c2}
    Units = {}
    Need = 0
    MaxJobs = 1
    MaxScheduleCount = 1
    Expiry = 1
    EnableUnsupported = FALSE
    None = None
    JobOrder <- MCJobOrder1
    DeploySites <- MCDeployAll
    MinSites <- MCMinOne
    Required <- MCReqNone
    PoisonAt <- MCPoisonNone

    \* fault / input bounds
    MaxLose = 0
    MaxCheckTimeout = 0
    MaxStartTimeout = 1
    MaxDeployFail = 1
    MaxSjLaunchFail = 0
    MaxBackoff = 0
    MaxSjError = 0
    MaxSjCrash = 0
    MaxCjError = 0
    MaxCjUnsafe = 0
    MaxCjDesc = 0
    MaxCpLaunchFail = 1
    MaxClientCrash = 0
    MaxAbort = 0
    MaxDelete = 0
    MaxDisable = 1
    MaxHeartbeat = 0
    MaxAppMissing = 0
    MaxAttempts = 3

\* No artificial cap on normal CHECK attempts.
CHECK_DEADLOCK FALSE

INVARIANTS
    RunningWasStarted
    PublishHasLatch
    SlotBalance
    NoOrphanSlot
