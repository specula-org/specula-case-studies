\* Scenario 2/4 liveness (MC-5 / F12): with disable_clients (no notify_dead_client) and dead clients, a running
\* job whose SJ exited is still finalized (only after the 900 s outcome deadline, modeled as a fair timer).
SPECIFICATION MCLiveSpec

CONSTANTS
    Jobs = {"j1"}
    Clients = {c1, c2}
    Units = {}
    Need = 0
    MaxJobs = 1
    MaxScheduleCount = 1
    Expiry = 1
    EnableUnsupported = FALSE
    None = None
    JobOrder <- MCJobOrder1
    DeploySites <- MCDeployAll
    MinSites <- MCMinOne
    Required <- MCReqNone
    PoisonAt <- MCPoisonNone

    \* fault / input bounds
    MaxLose = 0
    MaxCheckTimeout = 0
    MaxStartTimeout = 0
    MaxDeployFail = 0
    MaxSjLaunchFail = 0
    MaxBackoff = 0
    MaxSjError = 0
    MaxSjCrash = 0
    MaxCjError = 0
    MaxCjUnsafe = 0
    MaxCjDesc = 0
    MaxCpLaunchFail = 0
    MaxClientCrash = 1
    MaxAbort = 0
    MaxDelete = 0
    MaxDisable = 1
    MaxHeartbeat = 0
    MaxAppMissing = 0
    MaxAttempts = 3

\* no state CONSTRAINT: a truncated graph would make the fairness assumption vacuous;
\* attempts are naturally bounded by |Jobs| * MaxScheduleCount here.
CHECK_DEADLOCK FALSE

PROPERTIES
    BoundedFinalization
