\* Continuation strict mechanism probe; same constants/fault bounds as MC_hunt_s1_status.cfg.
\* Scenario 1 (MC-1): unguarded job-status writes / check-then-act.
\* Target: NEW terminal-overwrite paths, abort loss not explained by a seed overwrite, double launch.
\* Seeds F1/F3/F16/RS-3/I4/I5 are tolerated by the residuals (KnownOverwrite); TerminalStable/AbortHonored
\* themselves are reproduced by MC_seed_F1/F3/F16.cfg.  Resources: 1 unit so the 2nd job gets NO_RESOURCE
\* (refresh_meta RMW path) while MaxJobs = 2 lets both be in flight.
SPECIFICATION MCSpec

CONSTANTS
    Jobs = {"j1", "j2"}
    Clients = {c1}
    Units = {u1}
    Need = 1
    MaxJobs = 2
    MaxScheduleCount = 2
    Expiry = 1
    EnableUnsupported = FALSE
    None = None
    JobOrder <- MCJobOrder
    DeploySites <- MCDeployAll
    MinSites <- MCMinOne
    Required <- MCReqNone
    PoisonAt <- MCPoisonNone

    \* fault / input bounds
    MaxLose = 0
    MaxCheckTimeout = 0
    MaxStartTimeout = 0
    MaxDeployFail = 0
    MaxSjLaunchFail = 0
    MaxBackoff = 0
    MaxSjError = 1
    MaxSjCrash = 0
    MaxCjError = 1
    MaxCjUnsafe = 0
    MaxCjDesc = 0
    MaxCpLaunchFail = 0
    MaxClientCrash = 0
    MaxAbort = 2
    MaxDelete = 1
    MaxDisable = 0
    MaxHeartbeat = 1
    MaxAppMissing = 0
    MaxAttempts = 3

SYMMETRY SymClientsUnits
\* No artificial cap on normal CHECK attempts.
CHECK_DEADLOCK FALSE

INVARIANTS
    NoCantSchedOverwrite
