\* Continuation coverage: ordinary default SJ launch failure.
\* Same topology and all original MC.cfg bounds, with MaxSjLaunchFail increased to 1.
\* No bound is reduced; strict slot/thread checks supplement standard residual checks.
SPECIFICATION MCSpec

CONSTANTS
    Jobs = {"j1", "j2"}
    Clients = {c1, c2}
    Units = {u1}
    Need = 1
    MaxJobs = 1
    MaxScheduleCount = 2
    Expiry = 1
    EnableUnsupported = FALSE
    None = None
    JobOrder <- MCJobOrder
    DeploySites <- MCDeployAll
    MinSites <- MCMinOne
    Required <- MCReqNone
    PoisonAt <- MCPoisonNone

    \* fault / input bounds
    MaxLose = 1
    MaxCheckTimeout = 1
    MaxStartTimeout = 1
    MaxDeployFail = 1
    MaxSjLaunchFail = 1
    MaxBackoff = 0
    MaxSjError = 1
    MaxSjCrash = 0
    MaxCjError = 1
    MaxCjUnsafe = 0
    MaxCjDesc = 0
    MaxCpLaunchFail = 0
    MaxClientCrash = 0
    MaxAbort = 1
    MaxDelete = 0
    MaxDisable = 0
    MaxHeartbeat = 1
    MaxAppMissing = 0
    MaxAttempts = 3

SYMMETRY SymClientsUnits
\* No artificial cap on normal CHECK attempts.
CHECK_DEADLOCK FALSE

\* ---- Structural ----
INVARIANTS
    TypeOK
    RunningWasStarted
    PublishHasLatch
    ReservationBounded

\* ---- Standard safety (documented contracts) ----
INVARIANTS
    NoNovelTerminalOverwrite
    OneShot
    SlotBalance
    ResourceConservation
    ExclusiveOwnership


INVARIANTS
    NoOrphanSlot
    CompletionAlive
