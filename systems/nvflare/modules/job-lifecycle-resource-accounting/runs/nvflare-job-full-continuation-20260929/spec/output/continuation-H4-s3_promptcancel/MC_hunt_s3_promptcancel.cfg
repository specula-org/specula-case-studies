\* Case A revision: immediate cancellation is not promised; source RM :28-35/101-116
\* guarantees eventual reservation expiry under its running cleanup loop.
\* Check finite-batch reservation drain with fair reactive actions. Original
\* diagnostic counterexample/config retained in output/continuation-H-s3_promptcancel/.
SPECIFICATION MCLiveSpec

CONSTANTS
    Jobs = {"j1", "j2"}
    Clients = {c1}
    Units = {u1}
    Need = 1
    MaxJobs = 2
    MaxScheduleCount = 2
    Expiry = 2
    EnableUnsupported = FALSE
    None = None
    JobOrder <- MCJobOrder
    DeploySites <- MCDeployAll
    MinSites <- MCMinOne
    Required <- MCReqNone
    PoisonAt <- MCPoisonNone

    \* fault / input bounds
    MaxLose = 0
    MaxCheckTimeout = 1
    MaxStartTimeout = 0
    MaxDeployFail = 1
    MaxSjLaunchFail = 0
    MaxBackoff = 0
    MaxSjError = 0
    MaxSjCrash = 0
    MaxCjError = 0
    MaxCjUnsafe = 0
    MaxCjDesc = 0
    MaxCpLaunchFail = 0
    MaxClientCrash = 0
    MaxAbort = 1
    MaxDelete = 0
    MaxDisable = 0
    MaxHeartbeat = 0
    MaxAppMissing = 0
    MaxAttempts = 3

\* No artificial cap on normal CHECK attempts.
CHECK_DEADLOCK FALSE

INVARIANTS
    ResourceConservation
    ReservationBounded

PROPERTIES
    ReservationDrain
