\* Scenario 3 (MC-3): reservation / allocation / free ownership through every supported path: late CHECK
\* processing, dropped CANCEL / START, abort in each CJ state, heartbeat cleanup, launch failure, expiry.
\* Descendants off here (F10 is MC_hunt_s3_groups.cfg); unsupported F9 trigger off (MC_seed_F9.cfg).
SPECIFICATION MCSpec

CONSTANTS
    Jobs = {"j1", "j2"}
    Clients = {c1}
    Units = {u1, u2}
    Need = 1
    MaxJobs = 2
    MaxScheduleCount = 2
    Expiry = 1
    EnableUnsupported = FALSE
    None = None
    JobOrder <- MCJobOrder
    DeploySites <- MCDeployAll
    MinSites <- MCMinOne
    Required <- MCReqNone
    PoisonAt <- MCPoisonNone

    \* fault / input bounds
    MaxLose = 1
    MaxCheckTimeout = 1
    MaxStartTimeout = 1
    MaxDeployFail = 0
    MaxSjLaunchFail = 0
    MaxBackoff = 0
    MaxSjError = 0
    MaxSjCrash = 0
    MaxCjError = 1
    MaxCjUnsafe = 0
    MaxCjDesc = 0
    MaxCpLaunchFail = 1
    MaxClientCrash = 0
    MaxAbort = 1
    MaxDelete = 0
    MaxDisable = 0
    MaxHeartbeat = 2
    MaxAppMissing = 0
    MaxAttempts = 3

SYMMETRY SymClientsUnits
VIEW ViewS3
CONSTRAINT AttemptBound
CHECK_DEADLOCK FALSE

INVARIANTS
    ResourceConservation
    ExclusiveOwnership
    NoFreeWhileGroupAlive
    ReservationBounded
