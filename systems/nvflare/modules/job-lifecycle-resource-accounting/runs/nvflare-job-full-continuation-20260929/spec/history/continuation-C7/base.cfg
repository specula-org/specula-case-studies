\* ============================================================================
\* base.cfg -- plain Spec (no fault counters) with tiny constants.
\* Sanity configuration: structural invariants only.  The unbounded environment actions make exhaustive BFS
\* impractical here: run with TLC -simulate (e.g. -simulate num=20000 -depth 120).
\* Contract checks and scenario hunts use MC.tla with MC.cfg / MC_seed_*.cfg / MC_hunt_*.cfg.
\* ============================================================================
SPECIFICATION Spec

CONSTANTS
    Jobs = {j1, j2}
    Clients = {c1}
    Units = {u1}
    Need = 1
    MaxJobs = 1
    MaxScheduleCount = 2
    Expiry = 2
    EnableUnsupported = FALSE
    None = None
    JobOrder <- DefaultJobOrder
    DeploySites <- DefaultDeploySites
    MinSites <- DefaultMinSites
    Required <- DefaultRequired
    PoisonAt <- DefaultPoisonAt

CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    RunningWasStarted
    PublishHasLatch
    ReservationBounded
