\* Scenario 3 informational (F6, code-review-only): tokens dispatched to the runner are never cancelled on its
\* skip / failure paths nor for late CHECK replies; only expiry reclaims them.  PromptCancel is EXPECTED to be
\* violated by design; the counterexamples are evidence for the brief's contract question (job.rst:284-286).
SPECIFICATION MCSpec

CONSTANTS
    Jobs = {"j1", "j2"}
    Clients = {c1}
    Units = {u1}
    Need = 1
    MaxJobs = 2
    MaxScheduleCount = 2
    Expiry = 2
    EnableUnsupported = FALSE
    None = None
    JobOrder <- MCJobOrder
    DeploySites <- MCDeployAll
    MinSites <- MCMinOne
    Required <- MCReqNone
    PoisonAt <- MCPoisonNone

    \* fault / input bounds
    MaxLose = 0
    MaxCheckTimeout = 1
    MaxStartTimeout = 0
    MaxDeployFail = 1
    MaxSjLaunchFail = 0
    MaxBackoff = 0
    MaxSjError = 0
    MaxSjCrash = 0
    MaxCjError = 0
    MaxCjUnsafe = 0
    MaxCjDesc = 0
    MaxCpLaunchFail = 0
    MaxClientCrash = 0
    MaxAbort = 1
    MaxDelete = 0
    MaxDisable = 0
    MaxHeartbeat = 0
    MaxAppMissing = 0
    MaxAttempts = 3

SYMMETRY SymClientsUnits
VIEW ViewS3
CONSTRAINT AttemptBound
CHECK_DEADLOCK FALSE

INVARIANTS
    PromptCancel
