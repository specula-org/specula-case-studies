\* Scenario 3 (F10): units are freed at CJ LEADER exit; same-group descendants may still use them and a later
\* job can be given the same unit.  Target: NoFreeWhileGroupAlive, ExclusiveOwnership (user job code that
\* leaves same-group descendants; the in-tree Client API trainer uses its own session).
SPECIFICATION MCSpec

CONSTANTS
    Jobs = {"j1", "j2"}
    Clients = {c1}
    Units = {u1}
    Need = 1
    MaxJobs = 2
    MaxScheduleCount = 2
    Expiry = 1
    EnableUnsupported = FALSE
    None = None
    JobOrder <- MCJobOrder
    DeploySites <- MCDeployAll
    MinSites <- MCMinOne
    Required <- MCReqNone
    PoisonAt <- MCPoisonNone

    \* fault / input bounds
    MaxLose = 0
    MaxCheckTimeout = 0
    MaxStartTimeout = 0
    MaxDeployFail = 0
    MaxSjLaunchFail = 0
    MaxBackoff = 0
    MaxSjError = 0
    MaxSjCrash = 0
    MaxCjError = 0
    MaxCjUnsafe = 0
    MaxCjDesc = 1
    MaxCpLaunchFail = 0
    MaxClientCrash = 0
    MaxAbort = 1
    MaxDelete = 0
    MaxDisable = 0
    MaxHeartbeat = 1
    MaxAppMissing = 0
    MaxAttempts = 3

SYMMETRY SymClientsUnits
VIEW ViewS3
CONSTRAINT AttemptBound
CHECK_DEADLOCK FALSE

INVARIANTS
    NoFreeWhileGroupAlive
    ExclusiveOwnership
    ResourceConservation
