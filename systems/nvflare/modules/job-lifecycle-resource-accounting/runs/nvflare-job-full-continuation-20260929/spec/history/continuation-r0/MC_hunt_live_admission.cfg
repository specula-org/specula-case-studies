\* Scenario 2 liveness (MC-5 / F4): a well-formed SUBMITTED job eventually leaves SUBMITTED.  j1 carries a
\* validator-accepted numeric-string min_clients (PoisonAt "pre", TypeError at job_scheduler.py:166): the
\* scheduler raises before its history update on every pass, so j2 is expected to starve (F4 seed).  The
\* "pre" shape keeps the graph finite (no CHECK, no new token per pass); flip to MCPoisonNone for a clean run.
SPECIFICATION MCLiveSpec

CONSTANTS
    Jobs = {"j1", "j2"}
    Clients = {c1}
    Units = {u1}
    Need = 1
    MaxJobs = 1
    MaxScheduleCount = 2
    Expiry = 1
    EnableUnsupported = FALSE
    None = None
    JobOrder <- MCJobOrder
    DeploySites <- MCDeployAll
    MinSites <- MCMinOne
    Required <- MCReqNone
    PoisonAt <- MCPoisonFirstPre

    \* fault / input bounds
    MaxLose = 0
    MaxCheckTimeout = 0
    MaxStartTimeout = 0
    MaxDeployFail = 0
    MaxSjLaunchFail = 0
    MaxBackoff = 0
    MaxSjError = 0
    MaxSjCrash = 0
    MaxCjError = 0
    MaxCjUnsafe = 0
    MaxCjDesc = 0
    MaxCpLaunchFail = 0
    MaxClientCrash = 0
    MaxAbort = 0
    MaxDelete = 0
    MaxDisable = 0
    MaxHeartbeat = 0
    MaxAppMissing = 0
    MaxAttempts = 4

\* no state CONSTRAINT: a truncated graph would make the fairness assumption vacuous;
\* attempts are naturally bounded by |Jobs| * MaxScheduleCount here.
CHECK_DEADLOCK FALSE

PROPERTIES
