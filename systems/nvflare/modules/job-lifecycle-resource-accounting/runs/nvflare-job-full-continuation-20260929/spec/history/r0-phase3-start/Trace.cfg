\* Trace validation configuration.  Scenario constants come from the trace's "config" line.
\* Run from the spec/ directory with:  JSON=../traces/<name>.ndjson  (IOEnv override).
SPECIFICATION TraceSpec

CONSTANTS
    Jobs <- TraceJobs
    JobOrder <- TraceJobOrder
    Clients <- TraceClients
    Units <- TraceUnits
    Need <- TraceNeed
    DeploySites <- TraceDeploySites
    MinSites <- TraceMinSites
    Required <- TraceRequired
    MaxJobs <- TraceMaxJobs
    MaxScheduleCount <- TraceMaxScheduleCount
    Expiry <- TraceExpiry
    PoisonAt <- TracePoisonAt
    EnableUnsupported = FALSE
    None = None

VIEW TraceView
ALIAS TraceAlias
CHECK_DEADLOCK FALSE

\* Trace completeness: the whole trace must be consumed.
PROPERTIES
    TraceMatched

\* Structural invariants: must hold on every real execution.
INVARIANTS
    TypeOK
    RunningWasStarted
    PublishHasLatch
    ReservationBounded

\* Contract invariants are NOT checked during trace validation: harness traces may deliberately exhibit
\* the confirmed seeds (F1, F3, F5, F16, ...), which violate them.  Check them with MC / hunt configs.
\* INVARIANTS
\*     TerminalStable
\*     OneShot
\*     ResourceConservation
