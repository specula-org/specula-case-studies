\* ============================================================================
\* MC.cfg -- spec validation (convergence) configuration.
\* Standard safety + structural invariants enabled; scenario (extension) invariants listed but commented
\* out (they are enabled in MC_hunt_*.cfg).  Seeds confirmed in code (brief section 6.1) are fidelity checks
\* and are EXPECTED here: with MaxAbort = 1 the first TerminalStable violation is F1 (abort acknowledged during
\* deploy, overwritten by DISPATCHED at job_runner.py:670); with MaxAbort = 0 it is F3 (SJ exits during
\* _start_run, completion publishes before :711).  Each seed has its own MC_seed_*.cfg.
\* ============================================================================
SPECIFICATION MCSpec

CONSTANTS
    Jobs = {"j1", "j2"}
    Clients = {c1, c2}
    Units = {u1}
    Need = 1
    MaxJobs = 1
    MaxScheduleCount = 2
    Expiry = 1
    EnableUnsupported = FALSE
    None = None
    JobOrder <- MCJobOrder
    DeploySites <- MCDeployAll
    MinSites <- MCMinOne
    Required <- MCReqNone
    PoisonAt <- MCPoisonNone

    \* fault / input bounds
    MaxLose = 1
    MaxCheckTimeout = 1
    MaxStartTimeout = 1
    MaxDeployFail = 1
    MaxSjLaunchFail = 0
    MaxBackoff = 0
    MaxSjError = 1
    MaxSjCrash = 0
    MaxCjError = 1
    MaxCjUnsafe = 0
    MaxCjDesc = 0
    MaxCpLaunchFail = 0
    MaxClientCrash = 0
    MaxAbort = 1
    MaxDelete = 0
    MaxDisable = 0
    MaxHeartbeat = 1
    MaxAppMissing = 0
    MaxAttempts = 3

SYMMETRY SymClientsUnits
CONSTRAINT AttemptBound
CHECK_DEADLOCK FALSE

\* ---- Structural ----
INVARIANTS
    TypeOK
    RunningWasStarted
    PublishHasLatch
    ReservationBounded

\* ---- Standard safety (documented contracts) ----
INVARIANTS
    TerminalStable
    OneShot
    SlotBalance
    ResourceConservation
    ExclusiveOwnership

\* ---- Scenario (extension) invariants: enabled in MC_hunt_*.cfg ----
\* INVARIANTS
\*     AbortHonored
\*     RunningIsTracked
\*     NoOrphanSlot
\*     RunnerAliveInv
\*     CompletionAlive
\*     SweeperAlive
\*     NoFreeWhileGroupAlive
\*     FinalMatchesOutcome
\*     NoNovelTerminalOverwrite
\* ---- Informational (expected to fail by design / policy; evidence only) ----
\*     PromptCancel
\*     SjErrorNotMasked
\* PROPERTIES
\*     StartFailureMatchesPolicy
