    Jobs = {"j1", "j2"}
    Clients = {c1, c2}
    Units = {}
    Need = 0
    MaxJobs = 2
    MaxScheduleCount = 1
    Expiry = 1
    EnableUnsupported = FALSE
    None = None
    JobOrder <- MCJobOrder
    DeploySites <- MCDeployAll
    MinSites <- MCMinOne
    Required <- MCReqNone
    PoisonAt <- MCPoisonNone

    \* fault / input bounds
    MaxLose = 0
    MaxCheckTimeout = 0
    MaxStartTimeout = 0
    MaxDeployFail = 0
    MaxSjLaunchFail = 0
    MaxBackoff = 0
    MaxSjError = 1
    MaxSjCrash = 0
    MaxCjError = 0
    MaxCjUnsafe = 0
    MaxCjDesc = 0
    MaxCpLaunchFail = 0
    MaxClientCrash = 1
    MaxAbort = 0
    MaxDelete = 0
    MaxDisable = 0
    MaxHeartbeat = 0
    MaxAppMissing = 0
    MaxAttempts = 3

SYMMETRY SymClientsUnits
VIEW ViewS3
CONSTRAINT AttemptBound
CHECK_DEADLOCK FALSE

