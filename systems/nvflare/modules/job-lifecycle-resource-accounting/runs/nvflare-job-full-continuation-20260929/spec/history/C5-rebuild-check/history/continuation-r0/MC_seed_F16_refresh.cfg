\* Seed F16 (fidelity): the scheduler's refresh_meta RMW (job_scheduler.py:303 -> fs_storage.py:251-275)
\* writes SUBMITTED back over an abort of a queued job.  j1 holds the only unit, j2 gets NO_RESOURCE.
\* Phase 3 variant: invariant NoRefreshWriteOverwrite isolates the F16 writer (F1 is shallower under TerminalStable).
SPECIFICATION MCSpec

CONSTANTS
    Jobs = {"j1", "j2"}
    Clients = {c1}
    Units = {u1}
    Need = 1
    MaxJobs = 2
    MaxScheduleCount = 2
    Expiry = 1
    EnableUnsupported = FALSE
    None = None
    JobOrder <- MCJobOrder
    DeploySites <- MCDeployAll
    MinSites <- MCMinOne
    Required <- MCReqNone
    PoisonAt <- MCPoisonNone

    \* fault / input bounds
    MaxLose = 0
    MaxCheckTimeout = 0
    MaxStartTimeout = 0
    MaxDeployFail = 0
    MaxSjLaunchFail = 0
    MaxBackoff = 0
    MaxSjError = 0
    MaxSjCrash = 0
    MaxCjError = 0
    MaxCjUnsafe = 0
    MaxCjDesc = 0
    MaxCpLaunchFail = 0
    MaxClientCrash = 0
    MaxAbort = 1
    MaxDelete = 0
    MaxDisable = 0
    MaxHeartbeat = 0
    MaxAppMissing = 0
    MaxAttempts = 3

SYMMETRY SymClientsUnits
VIEW ViewS1
CONSTRAINT AttemptBound
CHECK_DEADLOCK FALSE

INVARIANTS
    NoRefreshWriteOverwrite
