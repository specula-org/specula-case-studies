\* F9 (UNSUPPORTED trigger, fidelity only): the deployed app dir is removed before START (disabled
\* delete_workspace command or manual deletion); ClientEngine.start_app returns an ERROR string after allocation
\* and the units are never freed.  Any violation here is outside the supported envelope.
