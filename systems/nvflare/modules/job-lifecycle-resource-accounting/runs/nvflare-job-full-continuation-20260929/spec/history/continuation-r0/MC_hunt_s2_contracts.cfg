\* Scenario 2 contract set (MC-2): RunnerAliveInv, NoOrphanSlot, SlotBalance, CompletionAlive.  First hits are
\* the F2 / RS-1 / RS-8 seeds (runner death); run with TLC -continue and classify against
\* MC_hunt_s2_slots.cfg (NoOrphanSlotNovel).
SPECIFICATION MCSpec

CONSTANTS
    Jobs = {"j1", "j2"}
    Clients = {c1}
    Units = {}
    Need = 0
    MaxJobs = 1
    MaxScheduleCount = 2
    Expiry = 1
    EnableUnsupported = FALSE
    None = None
    JobOrder <- MCJobOrder
    DeploySites <- MCDeployAll
    MinSites <- MCMinOne
    Required <- MCReqNone
    PoisonAt <- MCPoisonNone

    \* fault / input bounds
    MaxLose = 0
    MaxCheckTimeout = 0
    MaxStartTimeout = 0
    MaxDeployFail = 0
    MaxSjLaunchFail = 0
    MaxBackoff = 0
    MaxSjError = 1
    MaxSjCrash = 1
    MaxCjError = 1
    MaxCjUnsafe = 0
    MaxCjDesc = 0
    MaxCpLaunchFail = 0
    MaxClientCrash = 0
    MaxAbort = 1
    MaxDelete = 1
    MaxDisable = 0
    MaxHeartbeat = 1
    MaxAppMissing = 0
    MaxAttempts = 3

SYMMETRY SymClientsUnits
VIEW ViewS2
CONSTRAINT AttemptBound
CHECK_DEADLOCK FALSE

INVARIANTS
    RunnerAliveInv
    NoOrphanSlot
    SlotBalance
    CompletionAlive
