\* ============================================================================
\* MC_conv.cfg -- Phase 3 convergence continuation of MC.cfg (MC control only, NOT a property change).
\* Identical to MC.cfg (constants, bounds, symmetry, constraint, every other invariant) except that the contract
\* TerminalStable is replaced by its hunting residual NoNovelTerminalOverwrite, which tolerates exactly the
\* confirmed seed writers (F1 SetDispatched/MetaWrite over ABORTED, F1/F3 SetRunning over a terminal status,
\* F16 RefreshWrite, RS-3 SetCantSched, I5 ExceptSetFailed over ABORTED).  Reason: BFS on MC.cfg always stops at
\* the confirmed F1 counterexample (depth 10), recorded as [bug] in changelog.md; this config lets the
\* convergence round keep checking the rest of the state space.  TerminalStable remains enabled in MC.cfg.
\* ============================================================================
SPECIFICATION MCSpec

CONSTANTS
    Jobs = {"j1", "j2"}
    Clients = {c1, c2}
    Units = {u1}
    Need = 1
    MaxJobs = 1
    MaxScheduleCount = 2
    Expiry = 1
    EnableUnsupported = FALSE
    None = None
    JobOrder <- MCJobOrder
    DeploySites <- MCDeployAll
    MinSites <- MCMinOne
    Required <- MCReqNone
    PoisonAt <- MCPoisonNone

    \* fault / input bounds
    MaxLose = 1
    MaxCheckTimeout = 1
    MaxStartTimeout = 1
    MaxDeployFail = 1
    MaxSjLaunchFail = 0
    MaxBackoff = 0
    MaxSjError = 1
    MaxSjCrash = 0
    MaxCjError = 1
    MaxCjUnsafe = 0
    MaxCjDesc = 0
    MaxCpLaunchFail = 0
    MaxClientCrash = 0
    MaxAbort = 1
    MaxDelete = 0
    MaxDisable = 0
    MaxHeartbeat = 1
    MaxAppMissing = 0
    MaxAttempts = 3

SYMMETRY SymClientsUnits
CONSTRAINT AttemptBound
CHECK_DEADLOCK FALSE

\* ---- Structural ----
INVARIANTS
    TypeOK
    RunningWasStarted
    PublishHasLatch
    ReservationBounded

\* ---- Standard safety (documented contracts) ----
INVARIANTS
    NoNovelTerminalOverwrite
    OneShot
    SlotBalance
    ResourceConservation
    ExclusiveOwnership

\* ---- Scenario (extension) invariants: enabled in MC_hunt_*.cfg ----
\* INVARIANTS
\*     AbortHonored
\*     RunningIsTracked
\*     NoOrphanSlot
\*     RunnerAliveInv
\*     CompletionAlive
\*     SweeperAlive
\*     NoFreeWhileGroupAlive
\*     FinalMatchesOutcome
\*     NoNovelTerminalOverwrite
\* ---- Informational (expected to fail by design / policy; evidence only) ----
\*     PromptCancel
\*     SjErrorNotMasked
\* PROPERTIES
\*     StartFailureMatchesPolicy
