\* Scenario 4 (RS-5 seed + UNSAFE_COMPONENT paths): a client UNSAFE report during _start_run aborts SJ and CJs
\* but mark_run_aborted is a no-op, so the job can be published COMPLETED.
\* FinalMatchesOutcomeNovel tolerates the separately retained F5 START KeyError,
\* which C7 ordinary sync timeout otherwise finds before the typed-102 path.
SPECIFICATION MCSpec

CONSTANTS
    Jobs = {"j1"}
    Clients = {c1, c2}
    Units = {}
    Need = 0
    MaxJobs = 1
    MaxScheduleCount = 1
    Expiry = 1
    EnableUnsupported = FALSE
    None = None
    JobOrder <- MCJobOrder1
    DeploySites <- MCDeployAll
    MinSites <- MCMinOne
    Required <- MCReqNone
    PoisonAt <- MCPoisonNone

    \* fault / input bounds
    MaxLose = 0
    MaxCheckTimeout = 0
    MaxStartTimeout = 0
    MaxDeployFail = 0
    MaxSjLaunchFail = 0
    MaxBackoff = 0
    MaxSjError = 0
    MaxSjCrash = 0
    MaxCjError = 0
    MaxCjUnsafe = 1
    MaxCjDesc = 0
    MaxCpLaunchFail = 0
    MaxClientCrash = 0
    MaxAbort = 0
    MaxDelete = 0
    MaxDisable = 0
    MaxHeartbeat = 1
    MaxAppMissing = 0
    MaxAttempts = 3

SYMMETRY SymClientsUnits
VIEW ViewS4
\* No artificial cap on normal CHECK attempts.
CHECK_DEADLOCK FALSE

INVARIANTS
    FinalMatchesOutcomeNovel
