\* MC.cfg; pinned valid one-unit jobs. Hunt after trace convergence.
SPECIFICATION MCSpec
CONSTANTS
 Jobs = {"job-1", "job-2"}
 JobOrder <- ConfigJobOrder
 Sites = {s1, s2}
 Pool <- ConfigPool
 RequiredSites = {s1}
 MinSites = 1
 StrictStart = FALSE
 MaxJobs = 2
 MaxScheduleCount = 10
 MinScheduleInterval = 10
 MaxScheduleInterval = 600
 AttemptSlots = 11
 ReservationTTL = 30
 OutcomeGrace = 900
 ArchiveGrace = 60
 MaxMessageBuffer = 64
 AdminAbortLimit = 1
 AdmissionErrorLimit = 1
 ArchiveErrorLimit = 1
 CancelTimeoutLimit = 1
 CheckTimeoutLimit = 1
 ChildErrorLimit = 1
 DeployErrorLimit = 1
 DeployTimeoutLimit = 1
 LossLimit = 1
 OutcomeTimeoutLimit = 1
 PreLaunchErrorLimit = 1
 ReportErrorLimit = 1
 ServerAbortErrorLimit = 1
 SpawnErrorLimit = 1
 StartTimeoutLimit = 1
 StoreErrorLimit = 1
 WaiterErrorLimit = 1

\* Fault overrides; wrappers call the original Base instance.
AdminCheckTimeout <- MCAdminCheckTimeout
AdminDeployTimeout <- MCAdminDeployTimeout
AdminStartTimeout <- MCAdminStartTimeout
AdminCancelTimeout <- MCAdminCancelTimeout
DefaultJobSchedulerAdmissionException <- MCDefaultJobSchedulerAdmissionException
JobRunnerDeploymentException <- MCJobRunnerDeploymentException
ClientDeployError <- MCClientDeployError
JobRunnerStartupStoreError <- MCJobRunnerStartupStoreError
ServerEngineStartupError <- MCServerEngineStartupError
JobExecutorPrepareException <- MCJobExecutorPrepareException
ProcessJobLauncherSpawnException <- MCProcessJobLauncherSpawnException
JobExecutorWaiterInstallationException <- MCJobExecutorWaiterInstallationException
ClientChildFailure <- MCClientChildFailure
JobExecutorOutcomeReportException <- MCJobExecutorOutcomeReportException
ServerChildFailure <- MCServerChildFailure
JobCommandAbortRead <- MCJobCommandAbortRead
JobRunnerOutcomeGraceExpired <- MCJobRunnerOutcomeGraceExpired
JobRunnerArchiveException <- MCJobRunnerArchiveException
JobRunnerTerminalStoreException <- MCJobRunnerTerminalStoreException
TransportLoseMessage <- MCTransportLoseMessage
ServerEngineTerminateAfterAbortCommandError <- MCServerEngineTerminateAfterAbortCommandError

INVARIANTS
 MCTypeOK
 ResourceConservation
 SchedulerCapacity
 RetryHistoryMatchesCount
 SingleSupportedStart
 WaitBeforeNormalFree

\* Scenario-specific invariants are intentionally enabled in hunt cfgs.
\* INVARIANT ProcessBindingMatchesOwnership
\* INVARIANT NoFreeWhileInUse
\* INVARIANT CleanupOwnerOrCompleted
\* INVARIANT AcceptedPreRunAbortPersists
\* INVARIANT NoTerminalResurrection

SYMMETRY MCSymmetry
CONSTRAINT MessageBound
CHECK_DEADLOCK FALSE
