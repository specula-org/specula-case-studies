\* S5: default all-selected policy; response errors, dead reports and direct cancellation; fair terminating callbacks/monitor; no symmetry in temporal checking.
SPECIFICATION MCLiveSpec
CHECK_DEADLOCK FALSE
CONSTRAINT MessageBufferBound
CONSTANTS
    Clients = {c1, c2}
    Selected = {c1, c2}
    NumRounds = 1
    NumKeys = 1
    HistoryLimit = 4
    ErrorMode = "dynamic"
    OutboundFilter = FALSE
    LazyOffload = FALSE
    AllocationFailure = FALSE
    ConversionFailure = FALSE
    BeforeSendFailure = FALSE
    AllowEmpty = TRUE
    MetricKinds = {"present", "none", "empty"}
    MinSites = 2
    RequiredSites = {}
    AllowPartialCompletion = FALSE
    MaxMessages = 6
    FilterAfterContribution = FALSE
    CancelAfterContribution = FALSE
    FaultLimits <- Limits_s5_progress

\* Standard core safety; targeted Scenario assertions follow.
INVARIANTS
    TypeOK
    CommittedRoundProvenance
    ReceiptAfterDecision
    DynamicErrorSignalsAbort
PROPERTY EligibleTaskEventuallyDrains
