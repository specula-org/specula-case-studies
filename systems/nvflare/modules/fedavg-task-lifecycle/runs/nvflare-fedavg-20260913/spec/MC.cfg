\* Default Recipe path: no optional filters/offload; ordinary retries, result-code errors and direct cancellation enabled.
INIT MCInit
NEXT MCNext
CHECK_DEADLOCK FALSE
CONSTRAINT MessageBufferBound
SYMMETRY ClientSymmetry
CONSTANTS
    Clients = {c1, c2}
    Selected = {c1, c2}
    NumRounds = 2
    NumKeys = 2
    HistoryLimit = 4
    ErrorMode = "dynamic"
    OutboundFilter = FALSE
    LazyOffload = FALSE
    AllocationFailure = FALSE
    ConversionFailure = FALSE
    BeforeSendFailure = FALSE
    AllowEmpty = TRUE
    MetricKinds = {"present"}
    MinSites = 2
    RequiredSites = {}
    AllowPartialCompletion = FALSE
    MaxMessages = 6
    FilterAfterContribution = FALSE
    CancelAfterContribution = FALSE
    FaultLimits <- Limits_standard

\* Standard core safety and structural checks.
INVARIANTS
    MCTypeOK
    ProtectedBroadcastInput
    AtMostOneConsumer
    ReceiptAfterDecision
    CommittedRoundProvenance
    OneStandingTask
    CompletedHistoryBound
    CallbackRoundIsolation
    CallerLockDiscipline
    SavedWasCommitted
    CountMatchesSuccessfulReturns
\* Candidate assertions disabled during convergence; enabled in hunting cfgs.
\* CommittedAcceptanceConsistency
\* AbnormalTerminationVisible
