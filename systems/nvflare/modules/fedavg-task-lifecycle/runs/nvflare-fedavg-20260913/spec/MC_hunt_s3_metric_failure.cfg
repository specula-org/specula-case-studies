\* S3 / MC-1: ordinary metric preparation allocation failure after completed parameter history; in-memory payloads.
INIT MCInit
NEXT MCNext
CHECK_DEADLOCK FALSE
CONSTRAINT MessageBufferBound
SYMMETRY ClientSymmetry
CONSTANTS
    Clients = {c1, c2}
    Selected = {c1, c2}
    NumRounds = 2
    NumKeys = 2
    HistoryLimit = 4
    ErrorMode = "dynamic"
    OutboundFilter = FALSE
    LazyOffload = FALSE
    AllocationFailure = TRUE
    ConversionFailure = FALSE
    BeforeSendFailure = FALSE
    AllowEmpty = FALSE
    MetricKinds = {"present"}
    MinSites = 2
    RequiredSites = {}
    AllowPartialCompletion = FALSE
    MaxMessages = 6
    FilterAfterContribution = FALSE
    CancelAfterContribution = FALSE
    FaultLimits <- Limits_s3_metric_failure

\* Standard core safety; targeted Scenario assertions follow.
INVARIANTS
    TypeOK
    CommittedRoundProvenance
    CommittedAcceptanceConsistency
