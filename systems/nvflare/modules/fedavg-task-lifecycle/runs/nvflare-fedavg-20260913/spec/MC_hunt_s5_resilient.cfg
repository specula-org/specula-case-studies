\* S5: explicit ignore_result_error=True variant; non-OK result rejected without panic; responses still count toward task drain.
INIT MCInit
NEXT MCNext
CHECK_DEADLOCK FALSE
CONSTRAINT MessageBufferBound
SYMMETRY ClientSymmetry
CONSTANTS
    Clients = {c1, c2}
    Selected = {c1, c2}
    NumRounds = 2
    NumKeys = 2
    HistoryLimit = 4
    ErrorMode = "resilient"
    OutboundFilter = FALSE
    LazyOffload = FALSE
    AllocationFailure = FALSE
    ConversionFailure = FALSE
    BeforeSendFailure = FALSE
    AllowEmpty = TRUE
    MetricKinds = {"present"}
    MinSites = 2
    RequiredSites = {}
    AllowPartialCompletion = FALSE
    MaxMessages = 6
    FilterAfterContribution = FALSE
    CancelAfterContribution = FALSE
    FaultLimits <- Limits_s5_resilient

\* Standard core safety; targeted Scenario assertions follow.
INVARIANTS
    TypeOK
    CommittedRoundProvenance
    CommittedAcceptanceConsistency
    ReceiptAfterDecision
