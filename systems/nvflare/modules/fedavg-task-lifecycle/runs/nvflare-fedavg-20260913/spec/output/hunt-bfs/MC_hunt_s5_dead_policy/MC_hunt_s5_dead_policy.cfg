\* S5 / MC-2: two selected clients plus one unselected live site; min_sites=1 permits monitor to reach CLIENT_DEAD; no filters/cancellation.
INIT MCInit
NEXT MCNext
CHECK_DEADLOCK FALSE
CONSTRAINT MessageBufferBound
SYMMETRY ClientSymmetry
CONSTANTS
    Clients = {c1, c2, c3}
    Selected = {c1, c2}
    NumRounds = 2
    NumKeys = 2
    HistoryLimit = 4
    ErrorMode = "dynamic"
    OutboundFilter = FALSE
    LazyOffload = FALSE
    AllocationFailure = FALSE
    ConversionFailure = FALSE
    BeforeSendFailure = FALSE
    AllowEmpty = FALSE
    MetricKinds = {"present"}
    MinSites = 1
    RequiredSites = {}
    AllowPartialCompletion = FALSE
    MaxMessages = 6
    FilterAfterContribution = FALSE
    CancelAfterContribution = FALSE
    FaultLimits <- Limits_s5_dead_policy

\* Standard core safety; targeted Scenario assertions follow.
INVARIANTS
    TypeOK
    CommittedRoundProvenance
    AbnormalTerminationVisible
