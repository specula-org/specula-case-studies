\* Supplemental value-only oracle; original full-consistency hunt is retained.
\* S3 / MC-1: active-Cell streamed PyTorch disk offload; one per-key materialization failure; no outbound filter or cancellation.
INIT MCInit
NEXT MCNext
CHECK_DEADLOCK FALSE
CONSTRAINT MessageBufferBound
SYMMETRY ClientSymmetry
CONSTANTS
    Clients = {c1, c2}
    Selected = {c1, c2}
    NumRounds = 2
    NumKeys = 2
    HistoryLimit = 4
    ErrorMode = "dynamic"
    OutboundFilter = FALSE
    LazyOffload = TRUE
    AllocationFailure = FALSE
    ConversionFailure = FALSE
    BeforeSendFailure = FALSE
    AllowEmpty = FALSE
    MetricKinds = {"present"}
    MinSites = 2
    RequiredSites = {}
    AllowPartialCompletion = FALSE
    MaxMessages = 6
    FilterAfterContribution = FALSE
    CancelAfterContribution = FALSE
    FaultLimits <- Limits_s3_partial_parameters

\* Standard core safety; targeted Scenario assertions follow.
INVARIANTS
    TypeOK
    CommittedRoundProvenance
    CommittedValuesAccepted
