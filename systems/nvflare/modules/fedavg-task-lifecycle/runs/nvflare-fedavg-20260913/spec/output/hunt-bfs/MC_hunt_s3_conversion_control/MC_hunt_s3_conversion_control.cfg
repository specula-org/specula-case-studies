\* S3 negative control: conversion fails BEFORE consumer mutation; empty results and absent/empty metrics also supported.
INIT MCInit
NEXT MCNext
CHECK_DEADLOCK FALSE
CONSTRAINT MessageBufferBound
SYMMETRY ClientSymmetry
CONSTANTS
    Clients = {c1, c2}
    Selected = {c1, c2}
    NumRounds = 2
    NumKeys = 2
    HistoryLimit = 4
    ErrorMode = "dynamic"
    OutboundFilter = FALSE
    LazyOffload = FALSE
    AllocationFailure = FALSE
    ConversionFailure = TRUE
    BeforeSendFailure = FALSE
    AllowEmpty = TRUE
    MetricKinds = {"present", "none", "empty"}
    MinSites = 2
    RequiredSites = {}
    AllowPartialCompletion = FALSE
    MaxMessages = 6
    FilterAfterContribution = FALSE
    CancelAfterContribution = FALSE
    FaultLimits <- Limits_s3_conversion_control

\* Standard core safety; targeted Scenario assertions follow.
INVARIANTS
    TypeOK
    CommittedRoundProvenance
    CommittedAcceptanceConsistency
