\* S4 with S2/S5: current clock/aggregation/drain contracts, not a reverted-fix hunt.
\* Receiver budgets exceed sliding transaction inactivity; healthy requests can still keep it live.
\* Fixed fully registered payload, explicit identities, confirmation enabled.
SPECIFICATION MCSpec
CONSTANTS
  Refs = {ref1, ref2}
  FirstRegisteredRef = ref1
  RefOrder <- TwoRefOrder
  Receivers = {receiver1, receiver2}
  ChunkCount = 1
  AcquireTimeout = 3
  IdleTimeout = 3
  TxTimeout = 2
  DrainTimeout = 2
  ReceiptTTL = 4
  FinishedRefsTTL = 9
  MinReceivers = 1
  CallbackLimit = 1
  ComputeLimit = 1
  ConsumerLimit = 1
  DeleteLimit = 1
  ExecutorStopLimit = 0
  LossLimit = 1
  ProduceLimit = 1
  ShutdownLimit = 1
  SubmitLimit = 0
  TimeLimit = 6
  MessageLimit = 18

\* Counter wrappers retain the unmodified base actions via Original!Name.
HandleDownloadProduceException <- MCHandleDownloadProduceException
ConsumerConsumeException <- MCConsumerConsumeException
ConsumerDownloadCompletedException <- MCConsumerDownloadCompletedException
LoseConfirmation <- MCLoseConfirmation
DeleteTransaction <- MCDeleteTransaction
Shutdown <- MCShutdown
CheckedExecutorSubmitRuntimeError <- MCCheckedExecutorSubmitRuntimeError
CheckedExecutorSubmitStopped <- MCCheckedExecutorSubmitStopped
TransactionDoneComputeException <- MCTransactionDoneComputeException
CallbackException <- MCCallbackException
AdvanceTime <- MCAdvanceTime
HandleDownloadProduceError <- MCHandleDownloadProduceError

SYMMETRY Symmetry
CONSTRAINT MessageConstraint
CHECK_DEADLOCK FALSE

\* Core safety
INVARIANTS
  TypeOK
  SingleReceipt
  ConfirmedSuccess
  OutcomeAggregation
  ReceiptFollowsOwnCleanup
  CallerRequiresCompleted
