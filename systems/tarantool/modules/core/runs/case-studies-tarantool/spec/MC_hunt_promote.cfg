\* Hunting config for Bug Family 4: Promote/Demote Race Conditions
\* Targets: promote during WAL write, concurrent promotes causing term spiral.
\* Tight bounds: maximize promotes, minimize unrelated.

SPECIFICATION MCSpec

CONSTANTS
    Server = {1, 2, 3}
    ElectionQuorum = 2
    Nil = 0
    MaxTerm = 5
    TimeoutLimit = 2
    CrashLimit = 1
    HeartbeatLimit = 2
    LoseLimit = 1
    PromoteLimit = 4
    VclockAdvanceLimit = 0
    ResignLimit = 2
    NotifyLimit = 2
    BroadcastLimit = 3

CONSTRAINT MaxMsgBuffer

INVARIANTS
    MCElectionSafety
    MCWalWriteSafety
    MCPromoteNotDuringWrite
