\* Hunting config for Bug Family 1: Leader Witness Map Election Blocking
\* Targets: stale witness bits blocking elections after leader death/resign.
\* Tight bounds: minimize unrelated actions, maximize election/resign.

SPECIFICATION MCSpec

CONSTANTS
    Server = {1, 2, 3}
    ElectionQuorum = 2
    Nil = 0
    MaxTerm = 4
    TimeoutLimit = 5
    CrashLimit = 1
    HeartbeatLimit = 4
    LoseLimit = 1
    PromoteLimit = 0
    VclockAdvanceLimit = 0
    ResignLimit = 2
    NotifyLimit = 4
    BroadcastLimit = 4

CONSTRAINT MaxMsgBuffer

INVARIANTS
    MCElectionSafety
    MCWitnessMapAccuracy
