SPECIFICATION MCSpec

CONSTANTS
    Server = {1, 2, 3}
    ElectionQuorum = 2
    Nil = 0
    MaxTerm = 3
    TimeoutLimit = 3
    CrashLimit = 1
    HeartbeatLimit = 2
    LoseLimit = 1
    PromoteLimit = 1
    VclockAdvanceLimit = 1
    ResignLimit = 1
    NotifyLimit = 3
    BroadcastLimit = 4

CONSTRAINT MaxMsgBuffer

\* --- Standard safety invariants ---
INVARIANTS
    MCElectionSafety
    MCWalWriteSafety
    MCTermMonotonicity
    MCLeaderKnowsSelf
    MCNotWritingWhenLeader
    MCWitnessMapBounded
    MCCandidateVotedForSelf
    MCLeaderHasVotedForSelf

\* --- Extension invariants (enable for bug hunting) ---
\* INVARIANT MCOneVotePerTerm
\* INVARIANT MCNoStaleVoteAfterCrash
\* INVARIANT MCWitnessMapAccuracy
\* INVARIANT MCPromoteNotDuringWrite
\* INVARIANT MCVoteConsistency
