\* Hunting config for Bug Family 2: WAL Write In-Progress State Machine Fragility
\* Targets: state machine violations during WAL write window.
\* Tight bounds: maximize heartbeats/messages during writes, minimize unrelated.

SPECIFICATION MCSpec

CONSTANTS
    Server = {1, 2, 3}
    ElectionQuorum = 2
    Nil = 0
    MaxTerm = 3
    TimeoutLimit = 3
    CrashLimit = 1
    HeartbeatLimit = 6
    LoseLimit = 1
    PromoteLimit = 1
    VclockAdvanceLimit = 1
    ResignLimit = 1
    NotifyLimit = 3
    BroadcastLimit = 4

CONSTRAINT MaxMsgBuffer

INVARIANTS
    MCElectionSafety
    MCWalWriteSafety
    MCNotWritingWhenLeader
    MCPromoteNotDuringWrite
