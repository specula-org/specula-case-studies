    MaxCrashCount   = 2

    MaxRecreateLimit    = 0
    MaxMetaErrorLimit   = 0
    MaxMetaPartialLimit = 0
    MaxLoadMissingLimit = 0
    MaxResizeLimit      = 0
    MaxEvictLimit       = 0
    MaxSecretDelLimit   = 0
    MaxCrashLimit       = 2

VIEW MCView
CHECK_DEADLOCK FALSE

INVARIANTS
    AtMostOnceRemoteOp
    MCTypeOK
