\* MC2 — Scenario 2: premature decommission completion -> data loss.
\* Target invariant: NoDataLossOnDecommission.
\* Reachability: an empty/partial metadata observation makes observed=Absent
\* while the real ring is still Normal/Leaving; IsDoneDecommissioning authorises
\* cleanup and DeletePodPvcs deletes the PVC before the node authoritatively left.
SPECIFICATION MCSpec

CONSTANTS
    ActiveScenarios = {2}
    Scen3OpKind     = "Startup"
    MaxCrashCount   = 0

    MaxRecreateLimit    = 0
    MaxMetaErrorLimit   = 1
    MaxMetaPartialLimit = 1
    MaxLoadMissingLimit = 0
    MaxResizeLimit      = 0
    MaxEvictLimit       = 0
    MaxSecretDelLimit   = 0
    MaxCrashLimit       = 0

VIEW MCView
CHECK_DEADLOCK FALSE

INVARIANTS
    NoDataLossOnDecommission
    MCTypeOK
