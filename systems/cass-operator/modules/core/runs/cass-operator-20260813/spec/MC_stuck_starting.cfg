\* Node startup can remain stuck after a lost request across controller recovery.
\* Target invariant: NoStuckStarting.
SPECIFICATION MCSpec

CONSTANTS
    ActiveScenarios = {3}
    Scen3OpKind     = "Startup"
    MaxCrashCount   = 2

    MaxRecreateLimit    = 0
    MaxMetaErrorLimit   = 0
    MaxMetaPartialLimit = 0
    MaxLoadMissingLimit = 0
    MaxResizeLimit      = 0
    MaxEvictLimit       = 0
    MaxSecretDelLimit   = 0
    MaxCrashLimit       = 2

VIEW MCView
CHECK_DEADLOCK FALSE

INVARIANTS
    NoStuckStarting
    MCTypeOK
