\* MC6 — Scenario 5: finalizer deadlock / premature finalizer removal.
\* Target invariants: NoFinalizerDeadlock (liveness safety-proxy), FinalizerAfterCleanup.
\* Reachability: DeleteDependencySecret removes the superuser secret first, so
\* IsValid can never pass (TerminalError, no requeue) and the operator finalizer
\* is never removed while the DC is Terminating (permanent deadlock).
SPECIFICATION MCSpec

CONSTANTS
    ActiveScenarios = {5}
    Scen3OpKind     = "Startup"
    MaxCrashCount   = 1

    MaxRecreateLimit    = 0
    MaxMetaErrorLimit   = 0
    MaxMetaPartialLimit = 0
    MaxLoadMissingLimit = 0
    MaxResizeLimit      = 0
    MaxEvictLimit       = 0
    MaxSecretDelLimit   = 1
    MaxCrashLimit       = 1

VIEW MCView
CHECK_DEADLOCK FALSE

INVARIANTS
    NoFinalizerDeadlock
    FinalizerAfterCleanup
    MCTypeOK
