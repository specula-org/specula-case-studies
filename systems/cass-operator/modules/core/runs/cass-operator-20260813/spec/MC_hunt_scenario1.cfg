\* MC1 — Scenario 1: cross-epoch PVC delete via name-based matching + stale cache.
\* Target invariant: NoCrossEpochPVCDelete.
\* Reachability: same-name recreation (recreate=1) creates an epoch-b PVC while
\* the operator keeps its epoch-a view; ProcessDeletionDeletePVC then deletes the
\* epoch-b PVC under the epoch-a deletion (no epoch guard, only isBeingUsed).
SPECIFICATION MCSpec

CONSTANTS
    ActiveScenarios = {1}
    Scen3OpKind     = "Startup"
    MaxCrashCount   = 1

    MaxRecreateLimit    = 1
    MaxMetaErrorLimit   = 0
    MaxMetaPartialLimit = 0
    MaxLoadMissingLimit = 0
    MaxResizeLimit      = 0
    MaxEvictLimit       = 0
    MaxSecretDelLimit   = 0
    MaxCrashLimit       = 0

VIEW MCView
CHECK_DEADLOCK FALSE

INVARIANTS
    NoCrossEpochPVCDelete
    MCTypeOK
