\* ===========================================================================
\* MC.cfg — convergence config.  Enables ALL five Scenarios with small bounds.
\* Used to validate that the spec has no type/structural errors.  The Scenario
\* (extension) invariants are listed but COMMENTED OUT here; they are enabled in
\* the per-Scenario MC_hunt_*.cfg files for bug hunting.
\*
\* NOTE ON CONVERGENCE: the five Scenarios are INDEPENDENT state machines, so
\* running them together produces a large product space (millions of states).
\* Full structural convergence is obtained per Scenario by narrowing
\* ActiveScenarios to a single value, e.g. ActiveScenarios = {1}; each such run
\* exhausts in <2000 distinct states with the structural invariants holding.
\* This all-Scenarios config is the cross-Scenario structural soak.
\* ===========================================================================
SPECIFICATION MCSpec

CONSTANTS
    ActiveScenarios = {1, 2, 3, 4, 5}
    Scen3OpKind     = "Startup"
    MaxCrashCount   = 3

    MaxRecreateLimit    = 1
    MaxMetaErrorLimit   = 1
    MaxMetaPartialLimit = 1
    MaxLoadMissingLimit = 1
    MaxResizeLimit      = 1
    MaxEvictLimit       = 2
    MaxSecretDelLimit   = 1
    MaxCrashLimit       = 2

VIEW MCView

CHECK_DEADLOCK FALSE

\* --- Structural invariants (should always hold) ---
INVARIANTS
    EpochTypeOK
    RolloutSane
    DecommissionPhaseOK
    ObservedGenerationSanity
    MCTypeOK
    ControllerUpConsistent
    JobIdDisjoint

\* --- Scenario (extension) invariants — enabled in the MC_hunt_*.cfg files ---
\* INVARIANTS
\*     NoCrossEpochPVCDelete       \* Scenario 1  (MC_hunt_scenario1.cfg)
\*     NoDataLossOnDecommission    \* Scenario 2  (MC_hunt_scenario2_dataloss.cfg)
\*     CapacityRespected           \* Scenario 2  (MC_hunt_scenario2_capacity.cfg)
\*     AtMostOnceRemoteOp          \* Scenario 3  (MC_hunt_scenario3.cfg)
\*     NoStuckStarting             \* Scenario 3  (MC_hunt_scenario3.cfg)
\*     AvailabilityFloor           \* Scenario 4  (MC_hunt_scenario4.cfg)
\*     FinalizerAfterCleanup       \* Scenario 5  (MC_hunt_scenario5.cfg)
\*     NoFinalizerDeadlock         \* Scenario 5  (MC_hunt_scenario5.cfg)
