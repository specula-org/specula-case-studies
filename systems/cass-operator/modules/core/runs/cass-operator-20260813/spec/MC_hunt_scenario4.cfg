\* MC5 — Scenario 4: availability floor during scale-up / PDB recreate window.
\* Target invariant: AvailabilityFloor.
\* Reachability: ChangeDatacenterSize raises the floor to Size-1=2; the PDB is
\* deleted before being recreated (or is stale), and evictions during that window
\* drop (ready-evicted) below the floor.
SPECIFICATION MCSpec

CONSTANTS
    ActiveScenarios = {4}
    Scen3OpKind     = "Startup"
    MaxCrashCount   = 0

    MaxRecreateLimit    = 0
    MaxMetaErrorLimit   = 0
    MaxMetaPartialLimit = 0
    MaxLoadMissingLimit = 0
    MaxResizeLimit      = 1
    MaxEvictLimit       = 2
    MaxSecretDelLimit   = 0
    MaxCrashLimit       = 0

VIEW MCView
CHECK_DEADLOCK FALSE

INVARIANTS
    AvailabilityFloor
    MCTypeOK
