\* MC3 — Scenario 2: capacity bypass with missing per-pod load.
\* Target invariant: CapacityRespected.
\* Reachability: GetUsedStorageForPodsMissing sets load_known=FALSE, yet
\* EnsurePodsCanAbsorbDecommData approves the scale-down (missing load defaults
\* to 0 -> free<needed never true).
SPECIFICATION MCSpec

CONSTANTS
    ActiveScenarios = {2}
    Scen3OpKind     = "Startup"
    MaxCrashCount   = 0

    MaxRecreateLimit    = 0
    MaxMetaErrorLimit   = 0
    MaxMetaPartialLimit = 0
    MaxLoadMissingLimit = 1
    MaxResizeLimit      = 0
    MaxEvictLimit       = 0
    MaxSecretDelLimit   = 0
    MaxCrashLimit       = 0

VIEW MCView
CHECK_DEADLOCK FALSE

INVARIANTS
    CapacityRespected
    MCTypeOK
