\* Bug Family 2: Router Abort vs Commit Race — full exploration
\* Enable NoPartialCommit AND NoConflictingDecisions together

SPECIFICATION MCSpec

CONSTANTS
    Shard = {s1, s2, s3}
    Router = {r1}
    Txn = {t1}
    Key = {k1}
    NilShard = NilShard
    MaxCrash = 2
    MaxMsgLoss = 2
    MaxShardStepDown = 1
    MaxShardRemove = 0
    MaxMoveKey = 0
    MaxRouterAbort = 3

SYMMETRY ModelSymmetry

CONSTRAINT MCStateConstraint

INVARIANTS
    TypeOK
    NoConflictingDecisions
    NoPartialCommit
    RecoveryCompleteness
