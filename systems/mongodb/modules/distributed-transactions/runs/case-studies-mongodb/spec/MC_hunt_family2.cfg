\* MC_hunt_family2.cfg — Ticket Starvation Deadlock
\* Targets: SERVER-60682, SERVER-65821, SERVER-82883
\* Focus: CoordTicketExempt = FALSE to expose pre-fix deadlock

SPECIFICATION MCSpec

CONSTANTS
    Shard = {s1, s2}
    Router = {r1}
    Txn = {t1}
    MaxTickets = 2
    CoordTicketExempt = FALSE

    \* Tight bounds: maximize background task, minimize irrelevant faults
    MaxPartialSend = 0
    MaxReaper = 0
    MaxBgTask = 1
    MaxSWSReadFail = 0
    MaxSWSWriteFail = 0
    MaxDelayedCommit = 0
    MaxRetry = 0

SYMMETRY MCSymmetry

CONSTRAINT MCStateConstraint

INVARIANTS
    NoTicketDeadlock
    TicketPoolNonNegative
