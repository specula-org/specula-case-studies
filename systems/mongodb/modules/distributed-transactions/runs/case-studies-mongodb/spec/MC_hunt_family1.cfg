\* MC_hunt_family1.cfg — Router Commit Type Selection
\* Targets: SERVER-40201, SERVER-39973, SERVER-116284, SERVER-84796
\* Focus: DirectCommitPartial (partial commit send)

SPECIFICATION MCSpec

CONSTANTS
    Shard = {s1, s2, s3}
    Router = {r1}
    Txn = {t1}
    MaxTickets = 3
    CoordTicketExempt = TRUE

    \* Tight bounds: maximize partial send, minimize irrelevant faults
    MaxPartialSend = 2
    MaxReaper = 0
    MaxBgTask = 0
    MaxSWSReadFail = 0
    MaxSWSWriteFail = 0
    MaxDelayedCommit = 0
    MaxRetry = 1

SYMMETRY MCSymmetry

CONSTRAINT MCStateConstraint

INVARIANTS
    CommitTypeConsistency
    AllParticipantsReachTerminal
    TicketPoolNonNegative
