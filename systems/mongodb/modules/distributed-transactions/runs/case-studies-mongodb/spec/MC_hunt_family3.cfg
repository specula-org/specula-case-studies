\* MC_hunt_family3.cfg — Error Code Misclassification
\* Targets: SERVER-105751, SERVER-106075
\* Focus: SessionReaperFire + coordinator error classification

SPECIFICATION MCSpec

CONSTANTS
    Shard = {s1, s2}
    Router = {r1}
    Txn = {t1}
    MaxTickets = 3
    CoordTicketExempt = TRUE

    \* Tight bounds: maximize reaper, minimize irrelevant faults
    MaxPartialSend = 0
    MaxReaper = 1
    MaxBgTask = 0
    MaxSWSReadFail = 0
    MaxSWSWriteFail = 0
    MaxDelayedCommit = 0
    MaxRetry = 0

SYMMETRY MCSymmetry

CONSTRAINT MCStateConstraint

INVARIANTS
    NoSilentDataLoss
    ClassificationMatchesReality
    TicketPoolNonNegative
