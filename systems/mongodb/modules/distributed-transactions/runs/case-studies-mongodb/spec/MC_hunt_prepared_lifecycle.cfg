\* Bug Family 5: Prepared Transaction Lifecycle Races
\* Targets: MC-9 (session reaper destroys prepared txn)
\* Tight bounds: maximize shard step-downs, minimize other faults

SPECIFICATION MCSpec

CONSTANTS
    Shard = {s1, s2, s3}
    Router = {r1}
    Txn = {t1}
    Key = {k1}
    NilShard = NilShard
    MaxCrash = 1
    MaxMsgLoss = 1
    MaxShardStepDown = 3
    MaxShardRemove = 0
    MaxMoveKey = 0
    MaxRouterAbort = 1

SYMMETRY ModelSymmetry

CONSTRAINT MCStateConstraint

INVARIANTS
    TypeOK
    PreparedTxnPersistence
    NoPartialCommit
