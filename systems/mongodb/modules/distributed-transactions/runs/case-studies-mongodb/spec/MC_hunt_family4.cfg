\* MC_hunt_family4.cfg — Single-Write-Shard Retry Safety
\* Targets: SERVER-48307, SERVER-84796, SERVER-102481
\* Focus: SWS write failure + retry with recovery token

SPECIFICATION MCSpec

CONSTANTS
    Shard = {s1, s2, s3}
    Router = {r1}
    Txn = {t1}
    MaxTickets = 3
    CoordTicketExempt = TRUE

    \* Tight bounds: maximize SWS failures and retries
    MaxPartialSend = 0
    MaxReaper = 0
    MaxBgTask = 0
    MaxSWSReadFail = 1
    MaxSWSWriteFail = 1
    MaxDelayedCommit = 1
    MaxRetry = 2

SYMMETRY MCSymmetry

CONSTRAINT MCStateConstraint

INVARIANTS
    RetryNeverContradictsOriginal
    SWSCorrectness
    TicketPoolNonNegative
