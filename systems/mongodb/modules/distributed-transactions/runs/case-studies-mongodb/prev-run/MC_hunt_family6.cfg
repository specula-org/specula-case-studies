SPECIFICATION MCSpec

CONSTANT
    RC = "snapshot"
    Keys = {k1, k2}
    TxId = {"t1", "t2"}
    NoValue = NoValue
    Shard = {s1, s2}
    Router = {r1}
    Timestamps = {1, 2, 3}
    IgnorePrepareBlocking = "false"
    IgnoreWriteConflicts = "false"
    MaxOpsPerTxn = 2

    \* Hunt Family 6: Abort path gaps
    MaxRestarts = 0
    MaxMoveKeys = 0
    MaxReaps = 0
    MaxRouterAborts = 1

CONSTRAINT StateConstraint

\* Target: abort path completeness, missing abort decision
INVARIANT MCSnapshotIsolation
INVARIANT MCTwoPCAtomicity
INVARIANT MCCoordinatorDocConsistency
