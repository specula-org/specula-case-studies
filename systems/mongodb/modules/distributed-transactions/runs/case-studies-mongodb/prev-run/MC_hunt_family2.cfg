SPECIFICATION MCSpec

CONSTANT
    RC = "snapshot"
    Keys = {k1, k2}
    TxId = {"t1", "t2"}
    NoValue = NoValue
    Shard = {s1, s2}
    Router = {r1}
    Timestamps = {1, 2, 3}
    IgnorePrepareBlocking = "false"
    IgnoreWriteConflicts = "false"
    MaxOpsPerTxn = 2

    \* Hunt Family 2: Session reaper vs. prepared txn
    MaxRestarts = 0
    MaxMoveKeys = 0
    MaxReaps = 1
    MaxRouterAborts = 0

CONSTRAINT StateConstraint

\* Target: reaper destroys prepared session -> torn commit
INVARIANT MCSnapshotIsolation
INVARIANT MCTwoPCAtomicity
INVARIANT MCReaperSafety
