SPECIFICATION MCSpec

CONSTANT
    RC = "snapshot"
    Keys = {k1, k2}
    TxId = {"t1", "t2"}
    NoValue = NoValue
    Shard = {s1, s2}
    Router = {r1}
    Timestamps = {1, 2, 3}
    IgnorePrepareBlocking = "false"
    IgnoreWriteConflicts = "false"
    MaxOpsPerTxn = 2

    \* Hunt: combined faults (restart + migration + reaper)
    MaxRestarts = 1
    MaxMoveKeys = 1
    MaxReaps = 1
    MaxRouterAborts = 1

CONSTRAINT StateConstraint

\* All invariants for comprehensive hunting
INVARIANT MCSnapshotIsolation
INVARIANT MCTwoPCAtomicity
INVARIANT MCNoOrphanedPrepared
INVARIANT MCCoordinatorDocConsistency
INVARIANT MCRoutingConsistency
