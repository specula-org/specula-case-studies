SPECIFICATION MCSpec

CONSTANT
    RC = "snapshot"
    Keys = {k1, k2}
    TxId = {"t1", "t2"}
    NoValue = NoValue
    Shard = {s1, s2}
    Router = {r1}
    Timestamps = {1, 2, 3}
    IgnorePrepareBlocking = "false"
    IgnoreWriteConflicts = "false"
    MaxOpsPerTxn = 2

    \* Hunt Family 4: Chunk migration during active transaction
    MaxRestarts = 0
    MaxMoveKeys = 1
    MaxReaps = 0
    MaxRouterAborts = 0

CONSTRAINT StateConstraint

\* Target: stale router cache after migration -> writes to wrong shard
INVARIANT MCSnapshotIsolation
INVARIANT MCRoutingConsistency
