SPECIFICATION MCSpec

CONSTANT
    RC = "snapshot"
    Keys = {k1, k2}
    TxId = {"t1", "t2"}
    NoValue = NoValue
    Shard = {s1, s2}
    Router = {r1}
    Timestamps = {1, 2, 3}
    IgnorePrepareBlocking = "false"
    IgnoreWriteConflicts = "false"
    MaxOpsPerTxn = 2

    \* Hunt Family 1: Coordinator crash during 2PC
    MaxRestarts = 2
    MaxMoveKeys = 0
    MaxReaps = 0
    MaxRouterAborts = 0

CONSTRAINT StateConstraint

\* Target: coordinator crash window between decide and send
INVARIANT MCSnapshotIsolation
INVARIANT MCTwoPCAtomicity
INVARIANT MCNoOrphanedPrepared
INVARIANT MCCoordinatorDocConsistency
