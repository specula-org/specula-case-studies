\* MC_hunt_family1.cfg — Family 1: Non-atomic migration (critical section windows)
\* Targets: NoPrematureCSRelease, CriticalSectionCoversCommit
\* Tight bounds: maximize migration + config fail, minimize other faults.

SPECIFICATION MCSpec

CONSTANTS
    Shards = {s1, s2}
    Keys = {k1, k2}
    NameSpaces = {ns1}
    Txns = {t1}
    MIGRATIONS = 2
    TXN_STMTS = 2

    \* Tight bounds for Family 1
    MaxMigrations = 2
    MaxConfigFails = 2       \* Focus: config commit failure
    MaxStepDowns = 0         \* Disable failover
    MaxStepUps = 0
    MaxRetries = 1
    MaxCreateDbs = 0
    MaxExecErrors = 0
    MaxWrongInferences = 0

SYMMETRY MCSymmetry
CONSTRAINT MsgBufferConstraint

INVARIANTS
    CommittedTxnImpliesAllStmtsSuccessful
    CommittedTxnImpliesKeysAreVisible
    NoPrematureCSRelease
    CriticalSectionCoversCommit
    MigrationPhaseConsistency
