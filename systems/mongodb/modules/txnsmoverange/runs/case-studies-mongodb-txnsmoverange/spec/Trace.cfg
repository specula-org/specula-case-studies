\* Trace.cfg — Trace validation configuration.
\* Run with: java -jar tla2tools.jar -deadlock Trace
\* Override trace file: -config Trace.cfg -DJSON=../traces/mytest.ndjson

INIT TraceInit
NEXT TraceNext

CONSTANTS
    Shards = {s1, s2}
    Keys = {k1, k2}
    NameSpaces = {ns1}
    Txns = {t1}
    MIGRATIONS = 10
    TXN_STMTS = 2

INVARIANTS
    TypeOK
    CommittedTxnImpliesAllStmtsSuccessful
    CommittedTxnImpliesKeysAreVisible
    MigrationPhaseConsistency

\* Check trace was fully consumed (alternative to TraceMatched temporal)
\* Use -deadlock flag; TLC should terminate at l = Len(TraceLog) + 1
