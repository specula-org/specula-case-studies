\* MC_hunt_all.cfg — All fault types enabled, simulation mode.
\* Comprehensive search across all bug families.

SPECIFICATION MCSpec

CONSTANTS
    Shards = {s1, s2}
    Keys = {k1, k2}
    NameSpaces = {ns1}
    Txns = {t1}
    MIGRATIONS = 3
    TXN_STMTS = 2

    \* All faults enabled
    MaxMigrations = 3
    MaxConfigFails = 2
    MaxStepDowns = 2
    MaxStepUps = 2
    MaxRetries = 3
    MaxCreateDbs = 1
    MaxExecErrors = 1
    MaxWrongInferences = 1

SYMMETRY MCSymmetry
CONSTRAINT MsgBufferConstraint

INVARIANTS
    TypeOK
    CommittedTxnImpliesAllStmtsSuccessful
    CommittedTxnImpliesKeysAreVisible
    NoPrematureCSRelease
    CriticalSectionCoversCommit
    AllParticipantsSameTimestamp
    RecoveryPreservesDecision
    MigrationPhaseConsistency
    AtMostOnceExecution
