\* MC_hunt_2txn.cfg — Two concurrent transactions during migration.
\* Tests multi-transaction interactions with migration and failover.

SPECIFICATION MCSpec

CONSTANTS
    Shards = {s1, s2}
    Keys = {k1, k2}
    NameSpaces = {ns1}
    Txns = {t1, t2}
    MIGRATIONS = 3
    TXN_STMTS = 2

    \* Moderate fault injection
    MaxMigrations = 3
    MaxConfigFails = 1
    MaxStepDowns = 1
    MaxStepUps = 1
    MaxRetries = 2
    MaxCreateDbs = 1
    MaxExecErrors = 0
    MaxWrongInferences = 1

SYMMETRY MCSymmetry
CONSTRAINT MsgBufferConstraint

INVARIANTS
    TypeOK
    CommittedTxnImpliesAllStmtsSuccessful
    CommittedTxnImpliesKeysAreVisible
    NoPrematureCSRelease
    CriticalSectionCoversCommit
    AllParticipantsSameTimestamp
    RecoveryPreservesDecision
    MigrationPhaseConsistency
