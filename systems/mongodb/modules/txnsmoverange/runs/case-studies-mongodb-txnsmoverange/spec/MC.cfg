\* MC.cfg — Standard safety + structural invariants for convergence.
\* Extension (bug-family) invariants are commented out.
\* Use MC_hunt_*.cfg for targeted bug hunting after convergence.

SPECIFICATION MCSpec

CONSTANTS
    Shards = {s1, s2}
    Keys = {k1, k2}
    NameSpaces = {ns1}
    Txns = {t1}
    MIGRATIONS = 2
    TXN_STMTS = 2

    \* Counter bounds — moderate for convergence
    MaxMigrations = 2
    MaxConfigFails = 1
    MaxStepDowns = 1
    MaxStepUps = 1
    MaxRetries = 2
    MaxCreateDbs = 1
    MaxExecErrors = 0      \* Disable write-then-error during convergence
    MaxWrongInferences = 0 \* Disable wrong inference during convergence

SYMMETRY MCSymmetry

CONSTRAINT MsgBufferConstraint

\* --- Standard safety invariants ---
INVARIANTS
    TypeOK
    CommittedTxnImpliesAllStmtsSuccessful
    CommittedTxnImpliesKeysAreVisible

\* --- Structural invariants ---
    MigrationPhaseConsistency
    CriticalSectionCoversCommit

\* --- Extension invariants (commented out for convergence) ---
\* INVARIANTS
\*   NoPrematureCSRelease
\*   AllParticipantsSameTimestamp
\*   RecoveryPreservesDecision
\*   AtMostOnceExecution
