\* MC_hunt_deep.cfg — Deep simulation: all families except Family 4 ExecErrors.
\* Larger state space for thorough bug hunting.

SPECIFICATION MCSpec

CONSTANTS
    Shards = {s1, s2}
    Keys = {k1, k2}
    NameSpaces = {ns1}
    Txns = {t1}
    MIGRATIONS = 4
    TXN_STMTS = 2

    \* All faults enabled except write-then-error
    MaxMigrations = 4
    MaxConfigFails = 2
    MaxStepDowns = 2
    MaxStepUps = 2
    MaxRetries = 3
    MaxCreateDbs = 1
    MaxExecErrors = 0
    MaxWrongInferences = 1

SYMMETRY MCSymmetry
CONSTRAINT MsgBufferConstraint

INVARIANTS
    TypeOK
    CommittedTxnImpliesAllStmtsSuccessful
    CommittedTxnImpliesKeysAreVisible
    NoPrematureCSRelease
    CriticalSectionCoversCommit
    AllParticipantsSameTimestamp
    RecoveryPreservesDecision
    MigrationPhaseConsistency
