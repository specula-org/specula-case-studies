\* MC_hunt_family3.cfg — Family 3: Failover during migration
\* Targets: RecoveryPreservesDecision, CommittedTxnImpliesKeysAreVisible
\* Focus: donor stepdown during config commit + recovery.

SPECIFICATION MCSpec

CONSTANTS
    Shards = {s1, s2}
    Keys = {k1, k2}
    NameSpaces = {ns1}
    Txns = {t1}
    MIGRATIONS = 2
    TXN_STMTS = 2

    \* Tight bounds for Family 3
    MaxMigrations = 2
    MaxConfigFails = 1
    MaxStepDowns = 2         \* Focus: stepdown during migration
    MaxStepUps = 2           \* Must be able to recover
    MaxRetries = 1
    MaxCreateDbs = 0
    MaxExecErrors = 0
    MaxWrongInferences = 1   \* Enable wrong inference fault injection

SYMMETRY MCSymmetry
CONSTRAINT MsgBufferConstraint

INVARIANTS
    CommittedTxnImpliesAllStmtsSuccessful
    CommittedTxnImpliesKeysAreVisible
    RecoveryPreservesDecision
    MigrationPhaseConsistency
