\* MC_hunt_family4.cfg — Family 4: Stale-routing error propagation
\* Targets: AtMostOnceExecution
\* Focus: write-then-error (ShardRespondAfterExec) + router retry.

SPECIFICATION MCSpec

CONSTANTS
    Shards = {s1, s2}
    Keys = {k1, k2}
    NameSpaces = {ns1}
    Txns = {t1}
    MIGRATIONS = 2
    TXN_STMTS = 2

    \* Tight bounds for Family 4
    MaxMigrations = 1
    MaxConfigFails = 0
    MaxStepDowns = 0
    MaxStepUps = 0
    MaxRetries = 2           \* Router must retry for double exec
    MaxCreateDbs = 0
    MaxExecErrors = 2        \* Focus: write-then-error fault injection
    MaxWrongInferences = 0

SYMMETRY MCSymmetry
CONSTRAINT MsgBufferConstraint

INVARIANTS
    CommittedTxnImpliesAllStmtsSuccessful
    AtMostOnceExecution
    MigrationPhaseConsistency
