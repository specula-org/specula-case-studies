\* MC.cfg — Standard model checking config for convergence testing.
\* Extension (bug-family) invariants are commented out.
\* Use MC_hunt_*.cfg for targeted bug hunting after convergence.

CONSTANTS
    Shards = {s1, s2}
    NameSpaces = {ns1, ns2}
    Keys = {k1, k2}
    Txns = {t1}
    TXN_STMTS = 2

    \* Counter bounds
    MaxDDLFailoverLimit = 0
    MaxStaleRetryLimit = 0
    MaxDDLCreateLimit = 2
    MaxDDLDropLimit = 1
    MaxDDLRenameLimit = 1
    MaxDDLMoveLimit = 1
    MaxAnnotateDBLimit = 0

INIT MCInit

NEXT MCNext

SYMMETRY ModelSymmetry

CONSTRAINT MCStateConstraint

\* --- Structural invariants ---
INVARIANTS
    DDLPhaseTypeConsistency
    CriticalSectionPhaseConsistency
    FaultCountersBounded
    CommittedTxnImpliesAllStmtsSuccessful
    RouterSendsOneStmtRequestPerShard

\* --- Safety invariants — COMMENTED OUT for convergence ---
\* Enable in hunting configs after structural convergence.
\* CommittedTxnImpliesConsistentKeySet
\* ShardDataConsistentWithUUID
\* DDLLockHeldDuringCommit
\* NoOrphanedCriticalSection
\* CommitSafeAfterStatements
\* NoCrossDatabaseBypassLeak
\* PlacementConflictTimeMonotonicity
\* CommittedTxnConsistentKeySet
