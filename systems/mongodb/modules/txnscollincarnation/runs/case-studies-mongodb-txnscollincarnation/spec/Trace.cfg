\* Trace.cfg — Trace validation config.
\* Run with: JSON=../traces/basic_create_txn.ndjson java -cp tla2tools.jar:CommunityModules.jar tlc2.TLC -deadlock Trace
\* Use -deadlock flag to DISABLE deadlock checking (trace ends at deadlock = success).
\* String constants match implementation IDs (no mapping layer needed).

CONSTANTS
    Shards = {"shard0000", "shard0001"}
    NameSpaces = {"test.coll1", "test.coll2"}
    Keys = {"k1", "k2"}
    Txns = {"txn0"}
    TXN_STMTS = 2

INIT TraceInit

NEXT TraceNext

\* Standard invariants validated during trace replay
INVARIANTS
    CommittedTxnImpliesAllStmtsSuccessful
    CommittedTxnImpliesConsistentKeySet
    DDLPhaseTypeConsistency

