\* MC_hunt_family2.cfg — Bug Family 2: Transaction Statement Interleaving with DDL
\* Target: CommittedTxnConsistentKeySet
\* Mechanism: DDL completes between transaction statements or between parallel dispatches



CONSTANTS
    Shards = {s1, s2}
    NameSpaces = {ns1, ns2}
    Keys = {k1, k2}
    Txns = {t1}
    TXN_STMTS = 2

    \* Tight bounds: maximize DDL interleaving with txn
    MaxDDLFailoverLimit = 0
    MaxStaleRetryLimit = 0
    MaxDDLCreateLimit = 3
    MaxDDLDropLimit = 2
    MaxDDLRenameLimit = 1
    MaxDDLMoveLimit = 1
    MaxAnnotateDBLimit = 0

INIT MCInit

NEXT MCNext

SYMMETRY ModelSymmetry

CONSTRAINT MCStateConstraint

\* Core safety + target invariant
INVARIANTS
    CommittedTxnImpliesAllStmtsSuccessful
    CommittedTxnConsistentKeySet
    CommitSafeAfterStatements
