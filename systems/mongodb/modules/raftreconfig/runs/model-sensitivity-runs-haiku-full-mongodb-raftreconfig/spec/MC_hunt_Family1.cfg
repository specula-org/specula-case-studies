SPECIFICATION MC

\* Hunt config for Family 1: Config Version/Term Comparison Asymmetry
\* Mechanism: Asymmetric comparison when either term is -1 (force reconfig)
\* Expected violation: ConfigVersionTermTransitivity or ConfigVersionMonotonicity

CONSTANT
  UninitTerm = 0
  Server = {n1, n2}
  MaxCrashLimit = 2
  MaxQuorumCheckLimit = 3
  MaxDiskBlockLimit = 0
  MaxResponseLossLimit = 0
  MaxConfigChangeLimit = 3



INIT MCInit

NEXT MCNext

* CONSTRAINT configChangeCount <= MaxConfigChangeLimit

SYMMETRY Symmetry

VIEW MCView

\* Target invariants for Family 1
INVARIANT MCTypeOK_MC
INVARIANT ConfigVersionTermTransitivity_MC
INVARIANT ConfigVersionMonotonicity_MC
