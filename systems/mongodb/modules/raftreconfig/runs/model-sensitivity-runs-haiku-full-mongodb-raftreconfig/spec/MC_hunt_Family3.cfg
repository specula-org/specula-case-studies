SPECIFICATION MC

\* Hunt config for Family 3: Quorum Check Response Accumulation Race
\* Mechanism: Responses arrive out-of-order, quorum check could succeed with insufficient actual responses
\* Expected violation: QuorumBasedOnActualResponses (quorum success without sufficient responses)

CONSTANT
  UninitTerm = 0
  Server = {n1, n2, n3}
  MaxCrashLimit = 1
  MaxQuorumCheckLimit = 4
  MaxDiskBlockLimit = 0
  MaxResponseLossLimit = 3
  MaxConfigChangeLimit = 2



INIT MCInit

NEXT MCNext

* CONSTRAINT configChangeCount <= MaxConfigChangeLimit

SYMMETRY Symmetry

VIEW MCView

\* Target invariants for Family 3
INVARIANT MCTypeOK_MC
INVARIANT QuorumBasedOnActualResponses_MC
INVARIANT ConfigStateConsistency_MC
