SPECIFICATION MC

\* Hunt config for Family 5: Commit Point Tracking Across Config Changes
\* Mechanism: Oplog entries committed in previous config must stay committed in new config
\*           Force-reconfig (term=-1) has special handling that could lose safety
\* Expected violation: CommittedEntriesPreserved (optime visible in old config, lost in new)

CONSTANT
  UninitTerm = 0
  Server = {n1, n2, n3}
  MaxCrashLimit = 1
  MaxQuorumCheckLimit = 2
  MaxDiskBlockLimit = 1
  MaxResponseLossLimit = 0
  MaxConfigChangeLimit = 3



INIT MCInit

NEXT MCNext

* CONSTRAINT configChangeCount <= MaxConfigChangeLimit

SYMMETRY Symmetry

VIEW MCView

\* Target invariants for Family 5
INVARIANT MCTypeOK_MC
INVARIANT CommittedEntriesPreserved_MC
INVARIANT ConfigVersionMonotonicity_MC
