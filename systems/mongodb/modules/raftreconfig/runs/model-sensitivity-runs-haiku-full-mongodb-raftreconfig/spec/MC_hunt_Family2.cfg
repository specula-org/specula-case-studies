SPECIFICATION MC

\* Hunt config for Family 2: Non-Atomic Configuration Commit
\* Mechanism: Multi-step commit with crash windows between persistence and installation
\* Expected violation: PersistentConfigValidity (in-memory > persisted after restart)

CONSTANT
  UninitTerm = 0
  Server = {n1, n2}
  MaxCrashLimit = 3
  MaxQuorumCheckLimit = 2
  MaxDiskBlockLimit = 2
  MaxResponseLossLimit = 0
  MaxConfigChangeLimit = 2



INIT MCInit

NEXT MCNext

* CONSTRAINT configChangeCount <= MaxConfigChangeLimit

SYMMETRY Symmetry

VIEW MCView

\* Target invariants for Family 2
INVARIANT MCTypeOK_MC
INVARIANT ConfigVersionMonotonicity_MC
INVARIANT PersistentConfigValidity_MC
INVARIANT ConfigStateConsistency_MC
