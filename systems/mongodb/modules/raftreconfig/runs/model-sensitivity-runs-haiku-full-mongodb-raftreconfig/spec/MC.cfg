INIT MCInit

NEXT MCNext

CONSTANT
  Server = {n1, n2, n3}
  UninitTerm = 0
  MaxCrashLimit = 2
  MaxQuorumCheckLimit = 5
  MaxDiskBlockLimit = 3
  MaxResponseLossLimit = 3
  MaxConfigChangeLimit = 3

\* CONSTRAINT configChangeCount <= MaxConfigChangeLimit

SYMMETRY Symmetry

VIEW MCView

\* Standard safety invariants
INVARIANT MCTypeOK_MC
INVARIANT ConfigVersionTermTransitivity_MC
INVARIANT ConfigVersionMonotonicity_MC
INVARIANT PersistentConfigValidity_MC
INVARIANT QuorumBasedOnActualResponses_MC
INVARIANT ConfigStateConsistency_MC

\* Extension invariants (Family-specific) - commented out for MC.cfg, enabled in hunt configs
\* INVARIANT CommittedEntriesPreserved_MC
\* INVARIANT OneConfigurationInTransition_MC
\* INVARIANT ConfigStateValidity_MC

\* Temporal properties
PROPERTIES EventuallyInstalled
