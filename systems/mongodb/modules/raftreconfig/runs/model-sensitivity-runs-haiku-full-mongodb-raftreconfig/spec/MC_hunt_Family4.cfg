SPECIFICATION MC

\* Hunt config for Family 4: Config Installation and Member State Synchronization
\* Mechanism: Multiple interdependent state updates (_topCoord, _termShadow, _rsConfig, _selfIndex)
\*           can be torn by concurrent reads or crashes
\* Expected violation: ConfigStateConsistency (observed mixed old/new state)

CONSTANT
  UninitTerm = 0
  Server = {n1, n2, n3}
  MaxCrashLimit = 2
  MaxQuorumCheckLimit = 2
  MaxDiskBlockLimit = 1
  MaxResponseLossLimit = 1
  MaxConfigChangeLimit = 3



INIT MCInit

NEXT MCNext

* CONSTRAINT configChangeCount <= MaxConfigChangeLimit

SYMMETRY Symmetry

VIEW MCView

\* Target invariants for Family 4
INVARIANT MCTypeOK_MC
INVARIANT ConfigStateConsistency_MC
INVARIANT ConfigVersionMonotonicity_MC
