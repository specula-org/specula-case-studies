SPECIFICATION MC

\* Hunt config for Family 6: Config State Machine State Consistency
\* Mechanism: State transitions guarded by conditions; scope guard reverts state on error
\*           Multiple concurrent reconfigs could violate "at most one in progress"
\* Expected violation: OneConfigurationInTransition (multiple nodes reconfiguring simultaneously)

CONSTANT
  UninitTerm = 0
  Server = {n1, n2, n3}
  MaxCrashLimit = 2
  MaxQuorumCheckLimit = 2
  MaxDiskBlockLimit = 0
  MaxResponseLossLimit = 0
  MaxConfigChangeLimit = 4



INIT MCInit

NEXT MCNext

* CONSTRAINT configChangeCount <= MaxConfigChangeLimit

SYMMETRY Symmetry

VIEW MCView

\* Target invariants for Family 6
INVARIANT MCTypeOK_MC
INVARIANT OneConfigurationInTransition_MC
INVARIANT ConfigStateValidity_MC
