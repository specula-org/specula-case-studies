\* Base config for MongoRaftReconfig spec.
\* Use MC.cfg for model checking — this is the raw spec config.

CONSTANTS
    Server = {s1, s2, s3}
    Leader = Leader
    Follower = Follower
    Down = Down
    Arbiter = {}

SPECIFICATION Spec

INVARIANTS
    ElectionSafety
    ConfigTermValid
    LeaderInOwnConfig
    DrainModeOnlyForLeaders
    ConfigVersionNonNeg

PROPERTIES
    NeverRollbackCommitted
