\* Trace.cfg — Trace validation config for MongoRaftReconfig.
\* Override trace file via: JSON=../traces/my_trace.ndjson

\* Server IDs are strings to match JSON trace values.
CONSTANT Server <- TraceServers
CONSTANT Leader = Leader
CONSTANT Follower = Follower
CONSTANT Down = Down
CONSTANT Arbiter <- TraceArbiter

INIT TraceInit
NEXT TraceNext

\* Use deadlock-based completion checking.
\* TLC reports "deadlock" when trace is fully consumed — that is success.

\* Invariants during trace replay.
INVARIANT ElectionSafety
INVARIANT TraceBounds
INVARIANT ConfigTermValid
INVARIANT DrainModeOnlyForLeaders
