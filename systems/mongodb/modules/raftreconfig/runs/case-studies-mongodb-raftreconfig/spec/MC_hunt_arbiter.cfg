\* MC_hunt_arbiter.cfg — Family 4: Config Quorum Calculation Errors
\* Target: ArbiterQuorumOverlap
\* Mechanism: arbiter-heavy config allows config commitment without data nodes.
\*
\* NOTE: Uses non-empty Arbiter set. SYMMETRY disabled (Arbiter breaks it).

CONSTANTS
    Server = {s1, s2, s3, s4, s5}
    Leader = Leader
    Follower = Follower
    Down = Down
    \* 2 data nodes (s1, s2), 3 arbiters (s3, s4, s5)
    Arbiter = {s3, s4, s5}

    MaxTermLimit = 3
    ForceReconfigLimit = 1
    ReconfigLimit = 2
    ShutDownLimit = 1
    ClientRequestLimit = 2
    RemoveNewlyAddedLimit = 0

SPECIFICATION MCSpec

CONSTRAINT StateConstraint

\* NO SYMMETRY — Arbiter breaks server symmetry.

\* Core safety
INVARIANT ElectionSafety

\* Family 4 target
INVARIANT ArbiterQuorumOverlap

\* Temporal
PROPERTY NeverRollbackCommitted
