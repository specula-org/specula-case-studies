CONSTANTS
    Server = {s1, s2, s3}
    Leader = Leader
    Follower = Follower
    Down = Down
    Arbiter = {}

    MaxTermLimit = 3
    ForceReconfigLimit = 2
    ReconfigLimit = 1
    ShutDownLimit = 1
    ClientRequestLimit = 2
    RemoveNewlyAddedLimit = 0

SPECIFICATION MCSpec

CONSTRAINT StateConstraint

SYMMETRY ModelSymmetry

