\* MC_hunt_drain.cfg — Family 2: Reconfig vs Election/Drain Races
\* Target: DrainModeReconfigSafety
\* Mechanism: interleave reconfig/force-reconfig between WinElection and CompleteDrain.
\*
\* Tight bounds: multiple elections, reconfigs during drain window.

CONSTANTS
    Server = {s1, s2, s3}
    Leader = Leader
    Follower = Follower
    Down = Down
    Arbiter = {}

    MaxTermLimit = 4
    ForceReconfigLimit = 2
    ReconfigLimit = 2
    ShutDownLimit = 0
    ClientRequestLimit = 1
    RemoveNewlyAddedLimit = 0

SPECIFICATION MCSpec

CONSTRAINT StateConstraint

SYMMETRY ModelSymmetry

\* Family 2 target (ElectionSafety removed — known to fail with force reconfig)
INVARIANT DrainModeReconfigSafety

\* Structural
INVARIANT DrainModeOnlyForLeaders

\* Temporal
PROPERTY NeverRollbackCommitted
