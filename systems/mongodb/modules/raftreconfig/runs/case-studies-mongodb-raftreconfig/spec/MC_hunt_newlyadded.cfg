\* MC_hunt_newlyadded.cfg — Family 5: newlyAdded Two-Phase Voter Addition
\* Target: NewlyAddedSafety + ForceReconfigQuorumOverlap
\* Mechanism: force reconfig skips newlyAdded, voter counts immediately.
\* Combined with force reconfig (Family 1+5 interaction).
\*
\* Tight bounds: force reconfigs + newlyAdded removal interleaving.

CONSTANTS
    Server = {s1, s2, s3}
    Leader = Leader
    Follower = Follower
    Down = Down
    Arbiter = {}

    MaxTermLimit = 3
    ForceReconfigLimit = 2
    ReconfigLimit = 2
    ShutDownLimit = 0
    ClientRequestLimit = 2
    RemoveNewlyAddedLimit = 3

SPECIFICATION MCSpec

CONSTRAINT StateConstraint

SYMMETRY ModelSymmetry

\* Core safety
INVARIANT ElectionSafety

\* Family 5 targets
INVARIANT NewlyAddedSafety
INVARIANT ForceReconfigQuorumOverlap

\* Temporal
PROPERTY NeverRollbackCommitted
