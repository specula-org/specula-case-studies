\* MC.cfg — Standard model checking config for convergence.
\* Extension (bug-family) invariants are commented out.
\* Use MC_hunt_*.cfg for targeted bug hunting after convergence.

CONSTANTS
    Server = {s1, s2, s3}
    Leader = Leader
    Follower = Follower
    Down = Down
    Arbiter = {}

    MaxTermLimit = 4
    ForceReconfigLimit = 0
    ReconfigLimit = 2
    ShutDownLimit = 1
    ClientRequestLimit = 2
    RemoveNewlyAddedLimit = 2

SPECIFICATION MCSpec

CONSTRAINT StateConstraint

\* Symmetry reduction (only when Arbiter = {}).
SYMMETRY ModelSymmetry

\* --- Standard safety invariants ---
INVARIANT ElectionSafety

\* --- Structural invariants ---
INVARIANT ConfigTermValid
INVARIANT LeaderInOwnConfig
INVARIANT DrainModeOnlyForLeaders
INVARIANT ConfigVersionNonNeg
INVARIANT NewlyAddedSafety

\* --- Extension invariants (commented out for convergence) ---
\* INVARIANT ActiveConfigsOverlap
\* INVARIANT ForceReconfigQuorumOverlap
\* INVARIANT DrainModeReconfigSafety
\* INVARIANT ConfigPropagationSafety
\* INVARIANT ArbiterQuorumOverlap

\* --- Temporal properties ---
PROPERTY NeverRollbackCommitted
