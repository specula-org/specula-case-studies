\* Small/fast convergence smoke test (soundness check, not a hunt).
SPECIFICATION MCSpec
CONSTANTS
    Server = {n1, n2, n3}
    MaxTerm = 2
    MaxLogLen = 2
    MaxConfigVersion = 2
    RequestLimit = 1
    ElectionLimit = 2
    ReconfigLimit = 1
    CrashLimit = 0
SYMMETRY Symmetry
VIEW ModelView
CONSTRAINT StateConstraint
INVARIANTS
    ElectionSafety
    LeaderCompleteness
    CommittedConsistency
    MCTypeOK
    RolePrimaryStateConsistent
    ConfigWellFormed
    PendingStepDownConsistent
    CommitWithinLog
    ConfigProvenance
    CommitTermLeqTerm
    OplogCommitmentAcrossReconfig
    ConfigQuorumOverlap
    ConfigTotalOrder
PROPERTIES
    TermMonotonic
    CommitIndexMonotonic
    ConfigVersionTermMonotonic
    StaleConfigNoProgress
