\* ============================================================================
\* MC.cfg — convergence / spec-validation config.
\* Standard safety + structural invariants only. Bug-family extension invariants
\* are listed but COMMENTED OUT; they are enabled in the MC_hunt_*.cfg files.
\* ============================================================================

SPECIFICATION MCSpec

CONSTANTS
    Server = {n1, n2, n3}
    MaxTerm = 3
    MaxLogLen = 3
    MaxConfigVersion = 3
    RequestLimit = 2
    ElectionLimit = 2
    ReconfigLimit = 2
    CrashLimit = 1

SYMMETRY Symmetry
VIEW ModelView
CONSTRAINT StateConstraint

INVARIANTS
    \* --- Standard protocol safety ---
    ElectionSafety
    LeaderCompleteness
    CommittedConsistency
    \* --- Structural sanity ---
    MCTypeOK
    RolePrimaryStateConsistent
    ConfigWellFormed
    PendingStepDownConsistent
    CommitWithinLog
    ConfigProvenance
    CommitTermLeqTerm
    \* --- Extension invariants (bug-family): enabled in MC_hunt_*.cfg, not here ---
    \* ConfigTermLeqElectionTerm        (Family 1 — MC_hunt_family1.cfg)
    \* OplogCommitmentAcrossReconfig    (Family 2 — MC_hunt_family2.cfg)
    \* ConfigQuorumOverlap              (Family 3 — MC_hunt_family3.cfg)
    \* ConfigTotalOrder                 (Family 3 — MC_hunt_family3.cfg)

PROPERTIES
    \* Sanity transition properties (should hold; validate the model)
    TermMonotonic
    CommitIndexMonotonic
    ConfigVersionTermMonotonic
