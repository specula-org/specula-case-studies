\* ============================================================================
\* MC_hunt_family3.cfg — Family 3: arbiter / PSA dual-quorum + config total-order
\* fidelity (modeling-brief §2 Family 3, §6.1 MC4).
\*
\* Mechanism hunted: config commitment uses $configMajority (majority of ALL
\* voters incl. arbiters) while oplog/data commitment uses $majority (majority of
\* WRITABLE voters, excl. arbiters). With arbiters present, does the single
\* voting-member-change rule still guarantee election-quorum / data-quorum overlap
\* across a reconfig (a dimension the proof never modeled)? And do configs stay
\* totally ordered (no two distinct configs at the same (version,term))?
\*
\* Setup: maximize command reconfigs so the search reaches arbiter (PSA) configs
\* (genesis is all-voters; reaching {2 voters + 1 arbiter} needs remove-then-readd,
\* i.e. >= 2 reconfigs). Minimize elections / writes / crashes.
\* ============================================================================

SPECIFICATION MCSpec

CONSTANTS
    Server = {n1, n2, n3}
    MaxTerm = 3
    MaxLogLen = 2
    MaxConfigVersion = 4
    RequestLimit = 1
    ElectionLimit = 1
    ReconfigLimit = 3
    CrashLimit = 0

SYMMETRY Symmetry
VIEW ModelView
CONSTRAINT StateConstraint

INVARIANTS
    \* Core safety
    ElectionSafety
    LeaderCompleteness
    \* Family 3 targets
    ConfigQuorumOverlap
    ConfigTotalOrder

PROPERTIES
    \* Configs stay monotone in (term, version) per node
    ConfigVersionTermMonotonic
