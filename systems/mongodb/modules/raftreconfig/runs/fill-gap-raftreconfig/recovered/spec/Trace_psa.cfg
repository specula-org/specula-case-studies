\* ============================================================================
\* Trace_psa.cfg — trace validation for family3_arbiter, whose genesis config has
\* an arbiter (n5). Uses TraceSpecPSA (TraceInitPSA: GenesisCfgPSA arbiters={n5}).
\* Otherwise identical to Trace.cfg.
\* ============================================================================

SPECIFICATION TraceSpecPSA

CONSTANTS
    Server = {"n1", "n2", "n3", "n4", "n5"}
    MaxTerm = 10
    MaxLogLen = 30
    MaxConfigVersion = 15

INVARIANTS
    ElectionSafety
    LeaderCompleteness
    CommittedConsistency
    ConfigTotalOrder
    ConfigQuorumOverlap
    OplogCommitmentAcrossReconfig
    RolePrimaryStateConsistent
    ConfigWellFormed
    PendingStepDownConsistent
    CommitWithinLog

PROPERTIES
    TraceMatched

ALIAS TraceAlias
