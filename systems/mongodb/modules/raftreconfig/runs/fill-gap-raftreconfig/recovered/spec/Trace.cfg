\* ============================================================================
\* Trace.cfg — trace validation against a recorded 5-node replica-set execution.
\* Bounds are sized to exceed what any single trace reaches (validation follows
\* the trace, it is not an exhaustive search).
\* ============================================================================

SPECIFICATION TraceSpec

CONSTANTS
    Server = {"n1", "n2", "n3", "n4", "n5"}
    MaxTerm = 10
    MaxLogLen = 30
    MaxConfigVersion = 15

INVARIANTS
    \* Safety properties that must hold on every real execution.
    ElectionSafety
    LeaderCompleteness
    CommittedConsistency
    ConfigTotalOrder
    ConfigQuorumOverlap
    OplogCommitmentAcrossReconfig
    \* Structural sanity
    RolePrimaryStateConsistent
    ConfigWellFormed
    PendingStepDownConsistent
    CommitWithinLog
    \* NOTE: ConfigTermLeqElectionTerm is intentionally NOT checked here — a correct
    \* execution can transiently have configTerm > _term (benign heartbeat-install
    \* decoupling window), so it is a hunt-only tripwire, not a trace invariant.

PROPERTIES
    TraceMatched

ALIAS TraceAlias
