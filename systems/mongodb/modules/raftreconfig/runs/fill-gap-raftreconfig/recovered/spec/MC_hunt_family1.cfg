\* ============================================================================
\* MC_hunt_family1.cfg — Family 1: configTerm / election-term decoupling during
\* a reconfig install racing an election / term change (modeling-brief §2 Family 1,
\* §6.1 MC1 & MC2).
\*
\* Mechanism hunted: InstallConfigViaHeartbeat installs a config with
\* configTerm = T' WITHOUT bumping _term, and lacks the command path's term guard;
\* combined with BecomeLeader / StepUpBumpConfigTerm / LearnHigherTerm this can
\* drive configTerm > _term and a stale primary acting in an old term.
\*
\* Setup: maximize elections + heartbeat config installs + term learning; minimize
\* client writes and command reconfigs; no crashes.
\* ============================================================================

SPECIFICATION MCSpec

CONSTANTS
    Server = {n1, n2, n3}
    MaxTerm = 4
    MaxLogLen = 3
    MaxConfigVersion = 3
    RequestLimit = 2
    ElectionLimit = 3
    ReconfigLimit = 1
    CrashLimit = 0

SYMMETRY Symmetry
VIEW ModelView
CONSTRAINT StateConstraint

INVARIANTS
    \* Core safety (real-bug detectors)
    ElectionSafety
    LeaderCompleteness
    CommittedConsistency
    \* Family 1 tripwire (the decoupling itself)
    ConfigTermLeqElectionTerm

PROPERTIES
    \* Family 1b: the kSteppingDown commit-freeze must hold across all interleavings
    StaleConfigNoProgress
