\* ============================================================================
\* MC_hunt_family2.cfg — Family 2: commit-point / oplog-commitment (Q2)
\* bookkeeping across the de-atomized install window (modeling-brief §2 Family 2,
\* §6.1 MC3).
\*
\* Mechanism hunted: Q1/Q2 are checked at ReconfigCheck (gate), the mutex is
\* dropped, and the config is installed later by ReconfigInstall with NO Q2
\* re-check and the commit point recomputed under the NEW config before the prev-
\* config snapshot. With a w:majority write acked in the gate->install window plus a
\* single voting-member change and a concurrent election, is the acked write durable?
\*
\* Setup: maximize client writes + commit advancement + command reconfigs;
\* allow a crash; keep elections modest. Longer log to exercise commit/rollback.
\* ============================================================================

SPECIFICATION MCSpec

CONSTANTS
    Server = {n1, n2, n3}
    MaxTerm = 3
    MaxLogLen = 4
    MaxConfigVersion = 3
    RequestLimit = 3
    ElectionLimit = 2
    ReconfigLimit = 2
    CrashLimit = 1

SYMMETRY Symmetry
VIEW ModelView
CONSTRAINT StateConstraint

INVARIANTS
    \* Core safety (real-bug detectors)
    LeaderCompleteness
    CommittedConsistency
    ElectionSafety
    \* Family 2 target: Q2 still holds at install, not just at the gate
    OplogCommitmentAcrossReconfig

PROPERTIES
    \* A committed write must never be lost from the commit high-water mark
    CommitIndexMonotonic
