# 5-node MongoDB replica set for MongoRaftReconfig trace capture.
#
# No source patching / recompilation: MongoDB's LOGV2 structured logs (replication
# verbosity 3) already record every config/term/role transition we need. We parse
# those logs (see parse_logs.py) and join a periodic self-status poll (poller.js)
# for the full per-node state snapshot.
#
# Nodes rcfg1..rcfg5 map to TLA+ servers n1..n5 (by member _id order). All five are
# voting, non-arbiter, data-bearing members in the genesis config (version 1) so the
# real bootstrap state matches Trace.tla's TraceInit / GenesisCfg.

services:
  rcfg1:
    image: mongo:8
    container_name: rcfg1
    hostname: rcfg1
    command: >
      mongod --replSet rs0 --port 27017 --bind_ip_all
      --setParameter enableTestCommands=1
      --setParameter logComponentVerbosity={replication:{verbosity:3}}
    networks: [rcfg-net]

  rcfg2:
    image: mongo:8
    container_name: rcfg2
    hostname: rcfg2
    command: >
      mongod --replSet rs0 --port 27017 --bind_ip_all
      --setParameter enableTestCommands=1
      --setParameter logComponentVerbosity={replication:{verbosity:3}}
    networks: [rcfg-net]

  rcfg3:
    image: mongo:8
    container_name: rcfg3
    hostname: rcfg3
    command: >
      mongod --replSet rs0 --port 27017 --bind_ip_all
      --setParameter enableTestCommands=1
      --setParameter logComponentVerbosity={replication:{verbosity:3}}
    networks: [rcfg-net]

  rcfg4:
    image: mongo:8
    container_name: rcfg4
    hostname: rcfg4
    command: >
      mongod --replSet rs0 --port 27017 --bind_ip_all
      --setParameter enableTestCommands=1
      --setParameter logComponentVerbosity={replication:{verbosity:3}}
    networks: [rcfg-net]

  rcfg5:
    image: mongo:8
    container_name: rcfg5
    hostname: rcfg5
    command: >
      mongod --replSet rs0 --port 27017 --bind_ip_all
      --setParameter enableTestCommands=1
      --setParameter logComponentVerbosity={replication:{verbosity:3}}
    networks: [rcfg-net]

networks:
  rcfg-net:
    driver: bridge
