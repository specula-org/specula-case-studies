\* base.cfg — used for syntax-checking and quick spec validation
\* Not for full model checking (use MC.cfg or MC_hunt_*.cfg for that)

SPECIFICATION Spec

CONSTANTS
    Server    = {n1, n2, n3}
    Follower  = "Follower"
    Candidate = "Candidate"
    Leader    = "Leader"
    Steady          = "Steady"
    Reconfiguring   = "Reconfiguring"
    PostSwap        = "PostSwap"
    HBReconfiguring = "HBReconfiguring"
    UNINITIALIZED   = UNINITIALIZED  \* model value (sentinel for configTerm=-1)
    Nil             = Nil            \* model value
    M_RequestVote      = "RequestVote"
    M_RequestVoteReply = "RequestVoteReply"
    M_Heartbeat        = "Heartbeat"
    M_HeartbeatReply   = "HeartbeatReply"
    M_AppendEntries    = "AppendEntries"
    M_AppendEntriesReply = "AppendEntriesReply"
    MaxTerm         = 3
    MaxLogLen       = 2
    MaxConfigVersion = 4
    MaxCrash        = 2

INVARIANTS
    ElectionSafety
    LogMatching
    ConfigVersionPositive
    ReconfigOnlyByLeader
    VoteTermMonotone
    ConfigStateValid
    HBConfigStateConsistency
    ConfigTermBelowElectionTerm
    CommitBarrierConsistency
