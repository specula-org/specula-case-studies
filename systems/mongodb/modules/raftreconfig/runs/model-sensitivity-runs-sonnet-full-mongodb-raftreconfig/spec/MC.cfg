\* MC.cfg — Standard model checking configuration
\* For bug hunting, use MC_hunt_<family>.cfg instead.
\* Start with this config to validate spec convergence.

SPECIFICATION MCSpec

CONSTANTS
    Server    = {n1, n2, n3}
    Follower  = "Follower"
    Candidate = "Candidate"
    Leader    = "Leader"
    Steady          = "Steady"
    Reconfiguring   = "Reconfiguring"
    PostSwap        = "PostSwap"
    HBReconfiguring = "HBReconfiguring"
    UNINITIALIZED   = UNINITIALIZED
    Nil             = Nil
    M_RequestVote        = "RequestVote"
    M_RequestVoteReply   = "RequestVoteReply"
    M_Heartbeat          = "Heartbeat"
    M_HeartbeatReply     = "HeartbeatReply"
    M_AppendEntries      = "AppendEntries"
    M_AppendEntriesReply = "AppendEntriesReply"

    \* Fault bounds (increase one at a time to expand coverage)
    MaxTerm             = 3
    MaxLogLen           = 2
    MaxConfigVersion    = 4
    MaxCrash            = 2
    MaxTimeoutLimit     = 4
    MaxCrashLimit       = 2
    MaxForceReconfigLimit = 2
    MaxHBReconfigLimit  = 3
    MaxLostMsgLimit     = 2
    MaxAppendLimit      = 3
    MaxMsgBufferLimit   = 10

SYMMETRY Symmetry

VIEW StateView

CONSTRAINT MsgBufferBound

INVARIANTS
    \* Standard safety invariants (always enabled)
    MCElectionSafety
    MCLogMatching
    MCConfigVersionPositive
    MCReconfigOnlyByLeader
    MCVoteTermMonotone
    MCConfigStateValid
    MCHBConfigStateConsistency
    MCConfigTermBelowElectionTerm
    MCCommitBarrierConsistency
    \* Extension (bug-family) invariants — commented out; enable in hunt configs
    \* MCVoteOnce
    \* MCCommitPointSafety
