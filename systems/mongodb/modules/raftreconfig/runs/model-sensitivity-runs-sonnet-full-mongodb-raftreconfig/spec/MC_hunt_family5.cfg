\* MC_hunt_family5.cfg — Hunt: Non-Atomic Vote Persistence (Family 5)
\*
\* Target bug: topology_coordinator.cpp:3789 updates _lastVote (in-memory) before the
\* caller (replication_coordinator_impl.cpp:5340) calls storeLocalLastVoteDocument (durable).
\* If the node crashes between these two operations, inMemVote reverts to durableVote on
\* restart, allowing the node to grant a second vote in the same term.
\*
\* VoteOnce invariant checks: no node sends two "granted" vote replies in the same term.
\*
\* References: replication_coordinator_impl.cpp:5325-5340
\*             topology_coordinator.cpp:3789-3791

SPECIFICATION MCSpec

CONSTANTS
    Server    = {n1, n2, n3}
    Follower  = "Follower"
    Candidate = "Candidate"
    Leader    = "Leader"
    Steady          = "Steady"
    Reconfiguring   = "Reconfiguring"
    PostSwap        = "PostSwap"
    HBReconfiguring = "HBReconfiguring"
    UNINITIALIZED   = UNINITIALIZED
    Nil             = Nil
    M_RequestVote        = "RequestVote"
    M_RequestVoteReply   = "RequestVoteReply"
    M_Heartbeat          = "Heartbeat"
    M_HeartbeatReply     = "HeartbeatReply"
    M_AppendEntries      = "AppendEntries"
    M_AppendEntriesReply = "AppendEntriesReply"

    MaxTerm             = 3
    MaxLogLen           = 1
    MaxConfigVersion    = 3
    MaxCrash            = 2

    \* PRIMARY: crash between inMemVote update and PersistVote is the key scenario
    MaxTimeoutLimit     = 4
    MaxCrashLimit       = 3    \* PRIMARY: multiple crashes needed to expose double-vote window
    MaxForceReconfigLimit = 0
    MaxHBReconfigLimit  = 0
    MaxLostMsgLimit     = 2    \* need message loss to force retries
    MaxAppendLimit      = 0
    MaxMsgBufferLimit   = 6

SYMMETRY Symmetry
VIEW StateView
CONSTRAINT MsgBufferBound

INVARIANTS
    MCElectionSafety
    MCConfigVersionPositive
    MCVoteTermMonotone
    MCConfigStateValid
    \* --- PRIMARY TARGET: No double-vote after crash (Family 5) ---
    MCVoteOnce
