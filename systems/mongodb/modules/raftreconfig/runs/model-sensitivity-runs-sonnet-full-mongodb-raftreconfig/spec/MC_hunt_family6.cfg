\* MC_hunt_family6.cfg — Hunt: Step-Up Auto-Reconfig Race (Family 6)
\*
\* Target bug: When a node wins an election, it schedules an async AutoReconfig to bump
\* configTerm to its election term. This auto-reconfig can be preempted by a concurrent
\* HBReconfig or ForceReconfig, leaving the primary with configTerm != electionTerm.
\*
\* Open question MC4: Can auto-reconfig preemption by concurrent HBReconfig leave the
\* system permanently in a state where primary exists with configTerm != electionTerm?
\* (Liveness failure — LeaderConfigCurrentness)
\*
\* Combines with Family 1: preemption may leave configTerm=UNINITIALIZED on primary.
\*
\* References: SERVER-47119, SERVER-47949, SERVER-47636
\*             replication_coordinator_impl.cpp:1468-1514

SPECIFICATION MCSpec

CONSTANTS
    Server    = {n1, n2, n3}
    Follower  = "Follower"
    Candidate = "Candidate"
    Leader    = "Leader"
    Steady          = "Steady"
    Reconfiguring   = "Reconfiguring"
    PostSwap        = "PostSwap"
    HBReconfiguring = "HBReconfiguring"
    UNINITIALIZED   = UNINITIALIZED
    Nil             = Nil
    M_RequestVote        = "RequestVote"
    M_RequestVoteReply   = "RequestVoteReply"
    M_Heartbeat          = "Heartbeat"
    M_HeartbeatReply     = "HeartbeatReply"
    M_AppendEntries      = "AppendEntries"
    M_AppendEntriesReply = "AppendEntriesReply"

    MaxTerm             = 4
    MaxLogLen           = 1
    MaxConfigVersion    = 5
    MaxCrash            = 1

    \* PRIMARY: need election + preempting HBReconfig/ForceReconfig + another election
    MaxTimeoutLimit     = 5
    MaxCrashLimit       = 1
    MaxForceReconfigLimit = 2   \* force reconfig can preempt auto-reconfig
    MaxHBReconfigLimit  = 3     \* PRIMARY: HB reconfig preemption of auto-reconfig
    MaxLostMsgLimit     = 1
    MaxAppendLimit      = 0
    MaxMsgBufferLimit   = 8

SYMMETRY Symmetry
VIEW StateView
CONSTRAINT MsgBufferBound

INVARIANTS
    MCElectionSafety
    MCConfigVersionPositive
    MCConfigStateValid
    MCConfigTermBelowElectionTerm
    MCHBConfigStateConsistency
    \* --- PRIMARY TARGET: Leader configTerm <= election term (safety side of MC4) ---
    \* LeaderConfigCurrentness is a liveness property; check via TLC temporal properties
    \* The safety proxy: if autoReconfigPending is cleared without updating configTerm,
    \* ConfigTermBelowElectionTerm and ElectionSafety must still hold.

PROPERTIES
    \* Temporal: every primary eventually has configTerm = electionTerm (MC4 liveness)
    \* LeaderConfigCurrentness
    \* Uncomment after confirming FairSpec is used and fairness conditions hold
