\* MC_hunt_family1.cfg — Hunt: ConfigVersionAndTerm Non-Total Ordering (Family 1)
\*
\* Target bug: Force reconfig sets configTerm=UNINITIALIZED, making ConfigLess non-transitive.
\* Open question MC2: Can two primaries be elected in the same term when a force-reconfigured
\* node (configTerm=-1) participates in both elections?
\*
\* References: SERVER-47119, SERVER-47636, SERVER-47636
\*             repl_set_config.h:76-129, replication_coordinator_impl.cpp:3425

SPECIFICATION MCSpec

CONSTANTS
    Server    = {n1, n2, n3}
    Follower  = "Follower"
    Candidate = "Candidate"
    Leader    = "Leader"
    Steady          = "Steady"
    Reconfiguring   = "Reconfiguring"
    PostSwap        = "PostSwap"
    HBReconfiguring = "HBReconfiguring"
    UNINITIALIZED   = UNINITIALIZED
    Nil             = Nil
    M_RequestVote        = "RequestVote"
    M_RequestVoteReply   = "RequestVoteReply"
    M_Heartbeat          = "Heartbeat"
    M_HeartbeatReply     = "HeartbeatReply"
    M_AppendEntries      = "AppendEntries"
    M_AppendEntriesReply = "AppendEntriesReply"

    MaxTerm             = 4
    MaxLogLen           = 1
    MaxConfigVersion    = 6
    MaxCrash            = 1

    \* Tight bounds: keep force reconfig and elections; reduce everything else
    MaxTimeoutLimit     = 5   \* need multiple elections
    MaxCrashLimit       = 1
    MaxForceReconfigLimit = 3 \* PRIMARY: force reconfig must fire multiple times
    MaxHBReconfigLimit  = 0   \* not the focus; disable
    MaxLostMsgLimit     = 1
    MaxAppendLimit      = 0   \* no log growth needed
    MaxMsgBufferLimit   = 8

SYMMETRY Symmetry
VIEW StateView
CONSTRAINT MsgBufferBound

INVARIANTS
    \* Core safety — must hold under all conditions
    MCElectionSafety
    MCConfigVersionPositive
    MCVoteTermMonotone
    MCConfigStateValid
    MCConfigTermBelowElectionTerm
    \* --- PRIMARY TARGET: Election safety under force-reconfig non-total ordering ---
    \* ElectionSafety is above; this is the primary invariant to hunt violations of
    \* under mixed force/normal config scenarios (MC2)
