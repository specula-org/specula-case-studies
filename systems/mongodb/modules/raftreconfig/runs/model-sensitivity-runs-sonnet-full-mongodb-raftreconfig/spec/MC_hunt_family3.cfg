\* MC_hunt_family3.cfg — Hunt: Single-Phase Membership Cutover (Family 3)
\*
\* Target bug: _setCurrentRSConfig (line 3997) called BEFORE updateLastCommittedInPrevConfig
\* (line 4003). AdvanceCommitIndex fires under the NEW config in the PostSwap window,
\* meaning the barrier captured afterward may not cover entries committed under the old config.
\*
\* Open question MC3: If CaptureBarrier runs after SwapConfig (wrong order = real code),
\* can a new majority form that lacks an entry committed under the old config?
\*
\* References: SERVER-45086, SERVER-55376
