\* MC_hunt_family2.cfg — Hunt: Dual Reconfig Paths (Family 2)
\*
\* Target bug: HBReconfig skips all safety gates (single-node-change, PSA, oplog commitment).
\* A config that would be rejected by SafeReconfig can be installed via HBReconfig once
\* it exists anywhere in the cluster.
\* Open question MC1: Can HBReconfig install a config that excludes a member whose writes
\* were committed under the old config, bypassing the CommitPointSafety barrier?
\*
\* Also covers TV1: HBReconfig callback fires after state reset by concurrent user reconfig.
\*
\* References: SERVER-47949, SERVER-46897, SERVER-48776
\*             replication_coordinator_impl_heartbeat.cpp:689-698
\*             repl_set_config_checks.cpp:588-615

SPECIFICATION MCSpec

CONSTANTS
    Server    = {n1, n2, n3}
    Follower  = "Follower"
    Candidate = "Candidate"
    Leader    = "Leader"
    Steady          = "Steady"
    Reconfiguring   = "Reconfiguring"
    PostSwap        = "PostSwap"
    HBReconfiguring = "HBReconfiguring"
    UNINITIALIZED   = UNINITIALIZED
    Nil             = Nil
    M_RequestVote        = "RequestVote"
    M_RequestVoteReply   = "RequestVoteReply"
    M_Heartbeat          = "Heartbeat"
    M_HeartbeatReply     = "HeartbeatReply"
    M_AppendEntries      = "AppendEntries"
    M_AppendEntriesReply = "AppendEntriesReply"

    MaxTerm             = 3
    MaxLogLen           = 2
    MaxConfigVersion    = 5
    MaxCrash            = 1

    \* PRIMARY: HBReconfig must fire; SafeReconfig race also needed
    MaxTimeoutLimit     = 3
    MaxCrashLimit       = 1
    MaxForceReconfigLimit = 1
    MaxHBReconfigLimit  = 4   \* PRIMARY: multiple HB reconfigs needed to cover race
    MaxLostMsgLimit     = 1
    MaxAppendLimit      = 2   \* need some log entries for CommitPointSafety check
    MaxMsgBufferLimit   = 10

SYMMETRY Symmetry
VIEW StateView
CONSTRAINT MsgBufferBound

INVARIANTS
    MCElectionSafety
    MCLogMatching
    MCConfigVersionPositive
    MCConfigStateValid
    MCHBConfigStateConsistency
    MCCommitBarrierConsistency
    \* --- PRIMARY TARGET: Commits must reach quorum of new config (MC1) ---
    MCCommitPointSafety
