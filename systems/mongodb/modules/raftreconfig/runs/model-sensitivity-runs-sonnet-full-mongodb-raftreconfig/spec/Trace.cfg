\* Trace.cfg — TLC configuration for trace validation
\* Run: TLC -config Trace.cfg Trace.tla

SPECIFICATION FairTraceSpec

CONSTANTS
    Server    = {"n1", "n2", "n3"}  \* must match node IDs used in trace files
    Follower  = "Follower"
    Candidate = "Candidate"
    Leader    = "Leader"
    Steady          = "Steady"
    Reconfiguring   = "Reconfiguring"
    PostSwap        = "PostSwap"
    HBReconfiguring = "HBReconfiguring"
    UNINITIALIZED   = UNINITIALIZED
    Nil             = Nil
    M_RequestVote        = "RequestVote"
    M_RequestVoteReply   = "RequestVoteReply"
    M_Heartbeat          = "Heartbeat"
    M_HeartbeatReply     = "HeartbeatReply"
    M_AppendEntries      = "AppendEntries"
    M_AppendEntriesReply = "AppendEntriesReply"
    MaxTerm             = 4    \* term stays at 1-2 in traces; 4 gives headroom
    MaxLogLen           = 20
    MaxConfigVersion    = 6    \* max version in traces is 5 (force_reconfig); 6 gives headroom
    MaxCrash            = 0    \* no fault injection during trace validation

PROPERTIES
    \* MANDATORY: verifies entire trace was consumed; without this TLC reports false success
    TraceMatched

INVARIANTS
    TraceElectionSafety
    TraceLogMatching
    TraceConfigVersionPositive
    TraceConfigStateValid
    TraceVoteTermMonotone
    TraceConfigTermBelowElectionTerm
    TraceCommitBarrierConsistency
