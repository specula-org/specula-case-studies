\* MC_hunt_family4.cfg — Hunt: Voting Eligibility Under Config Constraints (Family 4)
\*
\* Target bug: Relaxed ">= configVAT" voting rule (SERVER-57262) combined with
\* force-reconfig non-total ordering (Family 1). A voter with force-config (configTerm=-1)
\* can vote for a candidate whose configVAT is ">" in a non-total ordering sense.
\*
\* Open question MC2: Under relaxed ">= configVAT" rule, can two primaries be elected
\* in the same term when a force-reconfigured node is involved in both elections?
\* Open question MC5: Can a voter with old config version grant vote to candidate whose
\* new config excludes a node with committed writes?
\*
\* References: SERVER-46387, SERVER-57262, SERVER-47613
\*             topology_coordinator.cpp:3747-3752, vote_requester.cpp:97-112

SPECIFICATION MCSpec

CONSTANTS
    Server    = {n1, n2, n3}
    Follower  = "Follower"
    Candidate = "Candidate"
    Leader    = "Leader"
    Steady          = "Steady"
    Reconfiguring   = "Reconfiguring"
    PostSwap        = "PostSwap"
    HBReconfiguring = "HBReconfiguring"
    UNINITIALIZED   = UNINITIALIZED
    Nil             = Nil
    M_RequestVote        = "RequestVote"
    M_RequestVoteReply   = "RequestVoteReply"
    M_Heartbeat          = "Heartbeat"
    M_HeartbeatReply     = "HeartbeatReply"
    M_AppendEntries      = "AppendEntries"
    M_AppendEntriesReply = "AppendEntriesReply"

    MaxTerm             = 4
    MaxLogLen           = 2
    MaxConfigVersion    = 5
    MaxCrash            = 1

    \* PRIMARY: force reconfig + elections needed; log entries for MC5
    MaxTimeoutLimit     = 5
    MaxCrashLimit       = 1
    MaxForceReconfigLimit = 3   \* PRIMARY: force configs create UNINITIALIZED terms
    MaxHBReconfigLimit  = 1
    MaxLostMsgLimit     = 1
    MaxAppendLimit      = 2
    MaxMsgBufferLimit   = 8

SYMMETRY Symmetry
VIEW StateView
CONSTRAINT MsgBufferBound

INVARIANTS
    \* PRIMARY TARGET: ElectionSafety under force-config + relaxed voting (MC2, MC5)
    MCElectionSafety
    MCLogMatching
    MCConfigVersionPositive
    MCVoteTermMonotone
    MCConfigStateValid
    MCConfigTermBelowElectionTerm
    MCCommitPointSafety
