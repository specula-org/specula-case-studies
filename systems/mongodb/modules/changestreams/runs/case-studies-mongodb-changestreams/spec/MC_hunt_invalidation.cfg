\* MC_hunt_invalidation.cfg
\* Bug Family 2: Invalidation Event Sequencing (MC-2)
\* Target: InvalidationCompleteness + InvalidationIdempotency violations
\*         from drop-recreate-drop sequences and sequential invalidations.
\* Strategy: Enable invalidations + recreates. Minimize transactions, topology.

SPECIFICATION MCSpec

CONSTANTS
    Shard = {s1, s2}
    MaxClusterTime = 4
    MaxTxnOps = 2
    Nil = "Nil"
    V1 = "V1"
    V2 = "V2"
    HWMTokenType = 0
    EventTokenType = 128
    InsertOp = "insert"
    UpdateOp = "update"
    DeleteOp = "delete"
    DropOp = "drop"
    RenameOp = "rename"
    InvalidateOp = "invalidate"
    Active = "Active"
    InvalidatedState = "Invalidated"
    ClosedState = "Closed"
    NormalMode = "Normal"
    DegradedMode = "Degraded"
    DefaultTokenVersion = "V2"

\* Tight bounds: focus on invalidation sequences
CONSTANTS
    MaxEvents = 3
    MaxClockAdvance = 3
    MaxVersionSwitch = 0
    MaxInvalidations = 3
    MaxTopoChanges = 0
    MaxTransactions = 0
    MaxResumes = 2
    MaxRecreates = 2
    MaxDelivered = 12

SYMMETRY ModelSymmetry
CONSTRAINT StateConstraint

\* Target invariants
INVARIANTS
    TotalOrder
    InvalidationCompleteness
    InvalidationIdempotency
    CursorPositionsValid
