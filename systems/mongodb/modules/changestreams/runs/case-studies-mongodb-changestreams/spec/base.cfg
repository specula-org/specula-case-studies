SPECIFICATION Spec

\* Shard identifiers
CONSTANTS
    Shard = {s1, s2, s3}
    MaxClusterTime = 5
    MaxTxnOps = 3
    Nil = "Nil"

\* Token versions
CONSTANTS
    V1 = "V1"
    V2 = "V2"

\* Token types (resume_token.h:68-71)
CONSTANTS
    HWMTokenType = 0
    EventTokenType = 128

\* Operation types
CONSTANTS
    InsertOp = "insert"
    UpdateOp = "update"
    DeleteOp = "delete"
    DropOp = "drop"
    RenameOp = "rename"
    InvalidateOp = "invalidate"

\* Stream states
CONSTANTS
    Active = "Active"
    InvalidatedState = "Invalidated"
    ClosedState = "Closed"

\* Topology modes
CONSTANTS
    NormalMode = "Normal"
    DegradedMode = "Degraded"

\* Default token version
CONSTANTS
    DefaultTokenVersion = "V2"

\* Invariants
INVARIANTS
    TotalOrder
    CursorPositionsValid
    ActiveCursorsSubset
    StreamStateConsistency
    TokenVersionsValid
    DeliveredEventsHaveTokens
