\* Hunting config: Bug Family 3 — Metadata Lifecycle / Query Safety
\* Targets: QueryNotAffected
\* Strategy: maximize metadata clears during active queries

SPECIFICATION MCSpec

CONSTANT
    Range <- MCRange
    Migration <- MCMigration
    Task <- MCTask
    Query <- MCQuery
    Nil = Nil
    Overlap <- MCOverlap
    StepDownLimit = 1
    ClearMetadataLimit = 3
    RetryDeleteLimit = 0
    TickClockLimit = 2

CONSTRAINT ClockConstraint

INVARIANT TypeOK
INVARIANT QueryNotAffected
INVARIANT NoOrphanedRangeDeletion
