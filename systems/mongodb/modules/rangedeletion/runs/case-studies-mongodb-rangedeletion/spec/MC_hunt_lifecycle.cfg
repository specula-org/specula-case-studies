\* Hunting config: Bug Family 1 — Service Lifecycle / Step-Up/Step-Down Races
\* Targets: NoTaskDeadlock, ServiceStateConsistency
\* Strategy: maximize step-down events, minimize others

SPECIFICATION MCSpec

CONSTANT
    Range <- MCRange
    Migration <- MCMigration
    Task <- MCTask
    Query <- MCQuery
    Nil = Nil
    Overlap <- MCOverlap
    StepDownLimit = 3
    ClearMetadataLimit = 0
    RetryDeleteLimit = 0
    TickClockLimit = 2

CONSTRAINT ClockConstraint

INVARIANT TypeOK
INVARIANT NoTaskDeadlock
INVARIANT ServiceStateConsistency
INVARIANT NoOrphanedRangeDeletion
INVARIANT OverlapSerializationTotal
