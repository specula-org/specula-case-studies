\* MC_hunt_family3.cfg — Family 3: Overlapping range deletion TOCTOU gap
\*
\* Target invariant: MCNoSimultaneousDonorProcessing
\*
\* Mechanism: GetOverlapSnapshot takes snapshot; RegisterTaskPostSnapshot adds a new
\* task after the snapshot; new migration proceeds without waiting for post-snapshot task;
\* two deletions for the same range execute concurrently.
\*
\* range_deleter_service.h:153-158 — explicit NB: TOCTOU warning
\* range_deleter_service.cpp:506-528 — snapshot implementation
\*
\* Tight bounds: no crashes needed; no shard removal needed.
\* Two migration IDs needed to trigger concurrent processing scenario.

SPECIFICATION MCSpec

CONSTANTS
    MigrationId    = {"m1", "m2"}
    Range          = {"r1"}
    Shard          = {"donor", "recipient"}
    DonorShard     = "donor"
    RecipientShard = "recipient"

    MaxCrashCount        = 0
    MaxRemoveShardCount  = 0
    MaxRollbackCount     = 0

INVARIANTS
    MCTypeOK
    \* -- Target invariant for Family 3 --
    MCNoSimultaneousDonorProcessing
