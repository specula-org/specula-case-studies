\* MC_hunt_family4.cfg — Family 4: Recovery scan non-atomicity (two-pass miss)
\*
\* Target invariant: MCRecoveryCompleteness
\*
\* Mechanism: Recovery scan runs two separate find() calls. A task that transitions
\* from non-processing to processing between Pass 1 and Pass 2 could be missed by both.
\* (Partially protected by shared AutoGetCollection lock in real code, but modeled
\* here as a spec-coverage target — range_deleter_service.cpp:220-254.)
\*
\* The Recovery action in base.tla atomically re-registers all ready/processing tasks.
\* This config verifies that RecoveryCompleteness holds across crash/step-up cycles.
\*
\* Tight bounds: enable crashes (needed to trigger recovery); minimal other faults.

SPECIFICATION MCSpec

CONSTANTS
    MigrationId    = {"m1"}
    Range          = {"r1"}
    Shard          = {"donor", "recipient"}
    DonorShard     = "donor"
    RecipientShard = "recipient"

    MaxCrashCount        = 3
    MaxRemoveShardCount  = 0
    MaxRollbackCount     = 0

INVARIANTS
    MCTypeOK
    \* -- Target invariant for Family 4 --
    MCRecoveryCompleteness
    \* Also verify structural invariant holds post-crash
    MCProcessingImpliesInMemory
