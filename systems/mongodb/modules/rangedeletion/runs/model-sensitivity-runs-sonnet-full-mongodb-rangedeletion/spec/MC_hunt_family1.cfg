\* MC_hunt_family1.cfg — Family 1: Non-atomic coordinator + range deletion task init
\*
\* Target invariant: NoOrphanOnCommit
\* Mechanism: crash between WriteCoordDoc and WriteRangeDeletionTask, then commit
\* recovery path hits CommitSilentSkip (donorTask absent, returns makeReady())
\*
\* Tight bounds: maximize crashes, minimize shard-removal and rollback noise.
\* migration_coordinator.cpp:289-294 — silent-skip early return on absent donorTask

SPECIFICATION MCSpec

CONSTANTS
    MigrationId    = {"m1"}
    Range          = {"r1"}
    Shard          = {"donor", "recipient"}
    DonorShard     = "donor"
    RecipientShard = "recipient"

    MaxCrashCount        = 3
    MaxRemoveShardCount  = 0
    MaxRollbackCount     = 0

INVARIANTS
    MCTypeOK
    MCProcessingImpliesInMemory
    \* -- Target invariant for Family 1 --
    MCNoOrphanOnCommit
