SPECIFICATION MCSpec

CONSTANTS
    MigrationId    = {"m1"}
    Range          = {"r1"}
    Shard          = {"donor", "recipient"}
    DonorShard     = "donor"
    RecipientShard = "recipient"

    \* Fault bounds — start conservative, increase one at a time
    MaxCrashCount        = 2
    MaxRemoveShardCount  = 1
    MaxRollbackCount     = 1

VIEW MCView

INVARIANTS
    \* -- Structural invariants (always on) --
    MCTypeOK
    MCProcessingImpliesInMemory
    MCRecoveryCompleteness
    \* -- Core safety invariants (always on) --
    MCNoSimultaneousDonorProcessing
    \* -- Extension invariants (bug-family specific — commented out here) --
    \* Enable only in MC_hunt_*.cfg for targeted bug-hunting runs
    \* MCNoOrphanOnCommit
    \* MCNoAbortedCoordWithStuckPendingRecipient
