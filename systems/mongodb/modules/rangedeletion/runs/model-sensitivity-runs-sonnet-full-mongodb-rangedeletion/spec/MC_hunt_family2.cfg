\* MC_hunt_family2.cfg — Family 2: Pending-flag activation gaps (stuck pending tasks)
\*
\* Target invariants:
\*   MCNoAbortedCoordWithStuckPendingRecipient
\*
\* Mechanisms modeled:
\*   (a) markAsReadyRangeDeletionTaskOnRecipient outside try/catch (line 382)
\*       -> MarkRecipientTaskReadyFails fires when recipientShardAlive=FALSE
\*   (b) forgetMigration w:1 + stepdown -> RollbackForgetMigration resets coordDoc
\*       -> recovery re-runs completeMigration with donorTask absent
\*
\* Tight bounds: enable shard removal and rollback; limit crash noise.
\* migration_coordinator.cpp:352-387 — abort path ShardNotFound scope

SPECIFICATION MCSpec

CONSTANTS
    MigrationId    = {"m1"}
    Range          = {"r1"}
    Shard          = {"donor", "recipient"}
    DonorShard     = "donor"
    RecipientShard = "recipient"

    MaxCrashCount        = 1
    MaxRemoveShardCount  = 2
    MaxRollbackCount     = 2

INVARIANTS
    MCTypeOK
    MCProcessingImpliesInMemory
    \* -- Target invariants for Family 2 --
    MCNoAbortedCoordWithStuckPendingRecipient
    \* Also check Family 1 invariant since RollbackForgetMigration re-enables
    \* CommitSilentSkip path (recovery with absent donorTask)
    MCNoOrphanOnCommit
