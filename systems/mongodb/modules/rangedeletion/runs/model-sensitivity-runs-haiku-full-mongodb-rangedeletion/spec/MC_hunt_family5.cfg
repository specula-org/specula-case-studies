(* Hunting config for Family 5: Recovery Task Scan and Concurrent Writes

   Bug mechanism: Recovery scans config.rangeDeletions in two passes. Concurrent
   migrations can insert new tasks between first and second scan, causing them to
   be missed in the current recovery and only picked up on next step-up.

   Targeted at invariant: PersistentStateRecoveredCompletely

   Tight bounds: Focus on recovery scan timing and migration inserts, minimize other actions.
*)

SPECIFICATION MCSpec

CONSTANT
    Node = {n1}
    TaskId = {t1, t2, t3}
    MaxTerm = 2
    MaxStepUpLimit = 2
    MaxStepDownLimit = 1
    MaxRecoveryDelay = 2
    MaxPendingClearDelay = 0
    MaxTaskRegisterLimit = 0
    MaxTaskExecuteLimit = 0
    MaxMigrationInsertLimit = 3
    MaxCrashLimit = 0

INVARIANT
    \* Structural invariants
    StateTransitionsAreMonotone
    InMemorySubsetOfPersistent

    \* Target invariant
    PersistentStateRecoveredCompletely

SYMMETRY Permute(Node)

VIEW SymmetryView
