(* Hunting config for Family 3: Overlapping Task Detection and Registration Order Races

   Bug mechanism: Task registration queries overlapping tasks under lock, but iteration
   order is non-deterministic. Concurrent registrations could cause circular waits or
   out-of-order execution if ordering tie-breaker fails.

   Targeted at invariant: OverlappingTasksSerialize

   Tight bounds: Focus on task registration interleaving, minimize other actions.
*)

SPECIFICATION MCSpec

CONSTANT
    Node = {n1}
    TaskId = {t1, t2, t3}
    MaxTerm = 2
    MaxStepUpLimit = 1
    MaxStepDownLimit = 0
    MaxRecoveryDelay = 1
    MaxPendingClearDelay = 0
    MaxTaskRegisterLimit = 3
    MaxTaskExecuteLimit = 0
    MaxMigrationInsertLimit = 0
    MaxCrashLimit = 0

INVARIANT
    \* Structural invariants
    StateTransitionsAreMonotone
    InMemorySubsetOfPersistent
    AllTasksHaveValidState

    \* Target invariant
    OverlappingTasksSerialize

SYMMETRY Permute(Node)

VIEW SymmetryView
