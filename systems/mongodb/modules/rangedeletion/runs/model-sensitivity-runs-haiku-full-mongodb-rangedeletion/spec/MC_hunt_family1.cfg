(* Hunting config for Family 1: Service State and Recovery Completion Ordering

   Bug mechanism: Recovery completes asynchronously. If step-down occurs during recovery,
   recovery will not transition to UP, leaving pending tasks in limbo.

   Targeted at invariant: ServiceUPImpliesRecoveryComplete

   Tight bounds: Minimize unrelated actions, maximize recovery/state-change interleavings.
*)

SPECIFICATION MCSpec

CONSTANT
    Node = {n1}
    TaskId = {t1}
    MaxTerm = 3
    MaxStepUpLimit = 2
    MaxStepDownLimit = 2
    MaxRecoveryDelay = 2
    MaxPendingClearDelay = 0
    MaxTaskRegisterLimit = 0
    MaxTaskExecuteLimit = 0
    MaxMigrationInsertLimit = 0
    MaxCrashLimit = 1

INVARIANT
    \* Structural invariants
    StateTransitionsAreMonotone
    InMemorySubsetOfPersistent

    \* Target invariant
    ServiceUPImpliesRecoveryComplete

SYMMETRY Permute(Node)

VIEW SymmetryView
