(* Hunting config for Family 4: Task Completion and Service State Check Race

   Bug mechanism: completeTask() requires service to be UP. If service steps down
   while task is executing, completeTask raises NotYetInitialized and the task future
   is never marked complete, leaving callers hanging.

   Targeted at invariant: TaskExecutingOnlyWhenServiceUp

   Tight bounds: Focus on task execution and step-down races, minimize other actions.
*)

SPECIFICATION MCSpec

CONSTANT
    Node = {n1}
    TaskId = {t1, t2}
    MaxTerm = 3
    MaxStepUpLimit = 2
    MaxStepDownLimit = 2
    MaxRecoveryDelay = 1
    MaxPendingClearDelay = 1
    MaxTaskRegisterLimit = 2
    MaxTaskExecuteLimit = 3
    MaxMigrationInsertLimit = 0
    MaxCrashLimit = 1

INVARIANT
    \* Structural invariants
    StateTransitionsAreMonotone
    InMemorySubsetOfPersistent

    \* Target invariant
    TaskExecutingOnlyWhenServiceUp

SYMMETRY Permute(Node)

VIEW SymmetryView
