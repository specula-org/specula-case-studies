(* Hunting config for Family 2: Pending Task Unblocking and Persistent State Inconsistency

   Bug mechanism: In-memory pending promise is resolved asynchronously by observer pattern.
   If service steps down before observer fires, the promise is never resolved, leaving
   futures hanging.

   Targeted at invariant: PendingTasksNeverScheduleUnpending

   Tight bounds: Focus on pending flag clearing timing and step-down races.
*)

SPECIFICATION MCSpec

CONSTANT
    Node = {n1}
    TaskId = {t1, t2}
    MaxTerm = 3
    MaxStepUpLimit = 2
    MaxStepDownLimit = 2
    MaxRecoveryDelay = 1
    MaxPendingClearDelay = 2
    MaxTaskRegisterLimit = 2
    MaxTaskExecuteLimit = 0
    MaxMigrationInsertLimit = 0
    MaxCrashLimit = 1

INVARIANT
    \* Structural invariants
    StateTransitionsAreMonotone
    InMemorySubsetOfPersistent

    \* Target invariant
    PendingTasksNeverScheduleUnpending

SYMMETRY Permute(Node)

VIEW SymmetryView
