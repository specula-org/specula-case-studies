SPECIFICATION MCSpec

CONSTANT
    Node = {n1, n2}
    TaskId = {t1, t2, t3}
    MaxTerm = 4
    MaxStepUpLimit = 4
    MaxStepDownLimit = 4
    MaxRecoveryDelay = 2
    MaxPendingClearDelay = 3
    MaxTaskRegisterLimit = 5
    MaxTaskExecuteLimit = 6
    MaxMigrationInsertLimit = 4
    MaxCrashLimit = 2

INVARIANT
    \* Structural invariants - always checked
    StateTransitionsAreMonotone
    InMemorySubsetOfPersistent
    AllTasksHaveValidState

    \* Bug-family safety invariants - enabled during convergence
    ServiceUPImpliesRecoveryComplete
    PendingTasksNeverScheduleUnpending
    OverlappingTasksSerialize
    TaskExecutingOnlyWhenServiceUp
    PersistentStateRecoveredCompletely

\* PROPERTY (disabled for model checking; checked via trace validation)
\* AllTasksEventuallyComplete

SYMMETRY ModelSymmetry

VIEW SymmetryView
