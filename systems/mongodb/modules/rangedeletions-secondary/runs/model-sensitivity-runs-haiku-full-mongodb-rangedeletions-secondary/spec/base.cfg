\* Configuration for base.tla

CONSTANTS
    MaxTerms = 3
    MaxTasks = 2
    MaxRecoveryTime = 2
    Nodes = {primary, secondary}
    PrimaryNode = primary
    NULL = null

INVARIANT
    TypeInvariant
    ValidTaskId
    ValidProcessorState
    ValidRecoveryOutcome
    ConsistentTaskStates
    TaskDocumentExistenceConsistency
    DeletedTaskNotTracked
    RecoveryCompletenessOnRoleChange
    IncompleteRecoveryTracked
    OverlapSerializationOrder
    OrphansDeletion
