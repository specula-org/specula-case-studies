\* Trace Validation Configuration for Trace.tla

CONSTANTS
    MaxTerms = 4
    MaxTasks = 3
    MaxRecoveryTime = 2
    Nodes = {primary, secondary}
    PrimaryNode = primary
    NULL = null

INIT TraceInit
NEXT TraceNext

\* ============================================================================
\* TRACE FILE LOCATION
\* ============================================================================

\* Configure JSON trace file path via IOEnv.JSON or use default
\* IOEnv.JSON <- "../traces/trace.ndjson"

\* ============================================================================
\* SAFETY INVARIANTS
\* ============================================================================

INVARIANT
    TypeInvariant
    ConsistentTaskStates

\* Core safety invariants — must hold on every real execution
INVARIANT
    TaskDocumentExistenceConsistency
    DeletedTaskNotTracked
    OrphansDeletion

\* ============================================================================
\* TEMPORAL PROPERTIES
\* ============================================================================

\* Mandatory: trace must be fully consumed
PROPERTIES
    TraceMatched
