\* Hunt config: Family 2 — Recovery Scan Completeness (Two-Phase Scan)
\*
\* Target: Can a task whose pending->ready transition commits between recovery
\* phase 1 and phase 2, with the op_observer firing before _termInitializationPromise
\* is set, be permanently missed across step-up/step-down cycles?
\* Finding MC2 from brief §6.1.
\*
\* Strategy:
\*   - MaxStepDowns=3 to allow multiple step-up/step-down cycles
\*   - MaxInterrupts=0 (not the focus; keep off to reduce state space)
\*   - MaxMigrations=2 to allow pending->ready at various points in recovery
\*   - 2 nodes, 2 tasks to expose the gap between phase 1 and phase 2
\*   - Enable NoLostReadyTasks

SPECIFICATION MCSpec

CONSTANTS
    Nodes = {n1, n2}
    Tasks = {t1, t2}
    MaxTerm = 4
    Primary = Primary
    Secondary = Secondary
    TaskPending = TaskPending
    TaskReady = TaskReady
    TaskProcessing = TaskProcessing
    TaskDeleted = TaskDeleted
    MajoritySuccess = MajoritySuccess
    MajorityInterrupted = MajorityInterrupted
    RecoveryIdle = RecoveryIdle
    RecoveryPhase1 = RecoveryPhase1
    RecoveryPhase2 = RecoveryPhase2
    RecoveryDone = RecoveryDone
    MaxStepDowns = 3
    MaxInterrupts = 0
    MaxMigrations = 2

SYMMETRY Symmetry

VIEW MCView

INVARIANTS
    TypeOK
    ElectionSafety
    NoLostReadyTasks
    InMemoryImpliesDisk
