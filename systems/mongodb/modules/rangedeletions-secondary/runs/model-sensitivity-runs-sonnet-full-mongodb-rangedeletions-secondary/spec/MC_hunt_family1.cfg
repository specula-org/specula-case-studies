\* Hunt config: Family 1 — Orphan-Deletion-Before-Task-Removal Ordering
\*
\* Target: Can step-down mid-majority-wait cause a secondary to see TaskDeleted
\* (task doc removed) before orphan deletions are majority committed?
\* Finding MC1 from brief §6.1.
\*
\* Strategy:
\*   - Keep MaxInterrupts=2 to allow mid-majority-wait step-downs
\*   - Keep MaxStepDowns=2 to allow step-up/step-down cycling
\*   - Set MaxMigrations=1 (only need one task to go pending->ready)
\*   - Use 2 nodes, 1 task to keep state space tight
\*   - Enable OrphanDeletionBeforeTaskDocRemoval and CompletionFutureImpliesMajorityOrphans

SPECIFICATION MCSpec

CONSTANTS
    Nodes = {n1, n2}
    Tasks = {t1}
    MaxTerm = 3
    Primary = Primary
    Secondary = Secondary
    TaskPending = TaskPending
    TaskReady = TaskReady
    TaskProcessing = TaskProcessing
    TaskDeleted = TaskDeleted
    MajoritySuccess = MajoritySuccess
    MajorityInterrupted = MajorityInterrupted
    RecoveryIdle = RecoveryIdle
    RecoveryPhase1 = RecoveryPhase1
    RecoveryPhase2 = RecoveryPhase2
    RecoveryDone = RecoveryDone
    MaxStepDowns = 2
    MaxInterrupts = 2
    MaxMigrations = 1

SYMMETRY Symmetry

VIEW MCView

INVARIANTS
    TypeOK
    ElectionSafety
    OrphanDeletionBeforeTaskDocRemoval
    CompletionFutureImpliesMajorityOrphans
    NoDiskDeleteBeforeMajority
