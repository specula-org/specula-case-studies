\* Hunt config: Family 3 — Non-Atomic Task Completion
\*
\* Target: If process crashes (step-down) between completeTask (fulfills future) and
\* removePersistentTask (removes disk doc), callers receive fulfilled completion future
\* while the disk document survives and re-execution will happen on the next primary.
\* Does this violate CompletionFutureImpliesMajorityOrphans?
\* Finding MC3 from brief §6.1.
\*
\* Strategy:
\*   - MaxStepDowns=2 (need at least one crash in the completeTask/removePersistentTask window)
\*   - MaxInterrupts=0 (not the focus)
\*   - MaxMigrations=1 (one task is enough to expose the window)
\*   - 2 nodes, 1 task: tight state space
\*   - Enable CompletionFutureImpliesMajorityOrphans + OrphanDeletionBeforeTaskDocRemoval

SPECIFICATION MCSpec

CONSTANTS
    Nodes = {n1, n2}
    Tasks = {t1}
    MaxTerm = 3
    Primary = Primary
    Secondary = Secondary
    TaskPending = TaskPending
    TaskReady = TaskReady
    TaskProcessing = TaskProcessing
    TaskDeleted = TaskDeleted
    MajoritySuccess = MajoritySuccess
    MajorityInterrupted = MajorityInterrupted
    RecoveryIdle = RecoveryIdle
    RecoveryPhase1 = RecoveryPhase1
    RecoveryPhase2 = RecoveryPhase2
    RecoveryDone = RecoveryDone
    MaxStepDowns = 2
    MaxInterrupts = 0
    MaxMigrations = 1

SYMMETRY Symmetry

VIEW MCView

INVARIANTS
    TypeOK
    ElectionSafety
    CompletionFutureImpliesMajorityOrphans
    OrphanDeletionBeforeTaskDocRemoval
    CompletingImpliesFulfilled
