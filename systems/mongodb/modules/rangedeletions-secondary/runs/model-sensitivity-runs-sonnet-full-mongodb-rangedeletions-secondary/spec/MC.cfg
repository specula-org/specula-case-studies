SPECIFICATION MCSpec

CONSTANTS
    Nodes = {n1, n2, n3}
    Tasks = {t1, t2}
    MaxTerm = 3
    Primary = Primary
    Secondary = Secondary
    TaskPending = TaskPending
    TaskReady = TaskReady
    TaskProcessing = TaskProcessing
    TaskDeleted = TaskDeleted
    MajoritySuccess = MajoritySuccess
    MajorityInterrupted = MajorityInterrupted
    RecoveryIdle = RecoveryIdle
    RecoveryPhase1 = RecoveryPhase1
    RecoveryPhase2 = RecoveryPhase2
    RecoveryDone = RecoveryDone
    \* Fault-injection bounds (default: enough to trigger bugs without explosion)
    MaxStepDowns = 2
    MaxInterrupts = 2
    MaxMigrations = 2

SYMMETRY Symmetry

VIEW MCView

INVARIANTS
    TypeOK
    MCTypeOK
    \* --- Core structural invariants (always enabled) ---
    ElectionSafety
    CompletingImpliesFulfilled
    PrimaryOnlyExecution
    InMemoryImpliesDisk
    \* --- Extension invariants (bug-family specific — enabled in hunt configs) ---
    \* OrphanDeletionBeforeTaskDocRemoval
    \* CompletionFutureImpliesMajorityOrphans
    \* NoDiskDeleteBeforeMajority
    \* NoLostReadyTasks
