\* MC_hunt_concurrent.cfg — Family 4: Multiple Concurrent Queries + Range Deletions
\*
\* The existing TLA+ spec models ONE query and ONE range deletion. With 2 queries
\* on different trackers and 2 range deletions with different preMigShardVersions,
\* the invalidation logic can expose cross-invalidation bugs.
\*
\* Expected: QueryShouldReadAllDocs or InvalidationBeforeVisibility VIOLATED
\* when version orderings interact across multiple RDs.

SPECIFICATION MCSpec

CONSTANT
    NumTrackers = 3
    MaxVersion = 3
    FeatureEnabled = TRUE
    Doc = {d1, d2}
    Query = {q1, q2}
    RangeDeletion = {rd1, rd2}
    MaxStepUpLimit = 0
    RDDocs <- MCRDDocs

INVARIANT
    TypeOK
    QueryShouldReadAllDocs
    InvalidationBeforeVisibility
