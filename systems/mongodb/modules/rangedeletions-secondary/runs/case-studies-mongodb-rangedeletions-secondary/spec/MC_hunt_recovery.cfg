\* MC_hunt_recovery.cfg — Family 2: Recovery Without Re-Invalidation After Step-Up
\*
\* When secondary steps up to primary, recovery re-registers range deletion tasks
\* with SemiFuture::makeReady() (range_deleter_service.cpp:229) but does NOT call
\* invalidateRangePreservers. Queries with valid trackers from pre-step-up can
\* proceed to DONE_OK while orphans are being deleted.
\*
\* Expected: QueryShouldReadAllDocs VIOLATED, InvalidationBeforeVisibility VIOLATED

SPECIFICATION MCSpec

CONSTANT
    NumTrackers = 2
    MaxVersion = 2
    FeatureEnabled = TRUE
    Doc = {d1, d2}
    Query = {q1}
    RangeDeletion = {rd1}
    MaxStepUpLimit = 1
    RDDocs <- MCRDDocs

INVARIANT
    TypeOK
    QueryShouldReadAllDocs
    InvalidationBeforeVisibility
