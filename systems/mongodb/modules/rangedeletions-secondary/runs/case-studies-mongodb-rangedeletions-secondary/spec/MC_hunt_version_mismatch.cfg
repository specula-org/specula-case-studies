\* MC_hunt_version_mismatch.cfg — Family 1: Version Comparison Mismatch
\*
\* The invalidation loop iterates _metadata sorted by collPlacementVersion
\* but compares by shardPlacementVersion. With 3 trackers, the model checker
\* explores all shardVersion assignments including non-monotonic orderings
\* where the early-break (metadata_manager.cpp:291) skips trackers.
\*
\* Expected: QueryShouldReadAllDocs VIOLATED
\* Example violation: trackerShardV = <<3, 1, 2>>, preMigShardV = 2
\*   → tracker 1 (shardV=3 > 2) causes break → tracker 2 (shardV=1) never invalidated

SPECIFICATION MCSpec

CONSTANT
    NumTrackers = 3
    MaxVersion = 3
    FeatureEnabled = TRUE
    Doc = {d1, d2}
    Query = {q1}
    RangeDeletion = {rd1}
    MaxStepUpLimit = 0
    RDDocs <- MCRDDocs

INVARIANT
    TypeOK
    QueryShouldReadAllDocs
