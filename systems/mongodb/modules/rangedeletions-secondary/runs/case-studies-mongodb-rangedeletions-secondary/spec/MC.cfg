SPECIFICATION MCSpec

CONSTANT
    NumTrackers = 2
    MaxVersion = 3
    FeatureEnabled = TRUE
    Doc = {d1, d2}
    Query = {q1}
    RangeDeletion = {rd1}
    MaxStepUpLimit = 1
    RDDocs <- MCRDDocs

\* Structural invariants (always checked)
INVARIANT
    TypeOK
    StepUpBound
    BatchRequiresBothCommitted
    RecoveryOnlyOnPrimary

\* Extension invariants (uncomment for bug hunting after convergence)
\* INVARIANT QueryShouldReadAllDocs
\* INVARIANT InvalidationBeforeVisibility
