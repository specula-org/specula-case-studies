\* MC_hunt_holes.cfg — Bug Family 1: Oplog holes stall stable timestamp.
\* Targets: StableNeverExceedsAllDurable, HolesBlockAllDurable, PreparedTxnPinsStable
\* Strategy: maximize prepared txns, minimize irrelevant actions.

CONSTANT Server = {n1, n2, n3}
CONSTANT MaxClientWriteSize = 1
CONSTANT MaxTerm = 2
CONSTANT MaxLogLen = 3
CONSTANT MaxRestartTimes = 0
CONSTANT MaxFailoverTimes = 1
CONSTANT MaxPrepareCount = 2
CONSTANT MaxFlusherCount = 0
CONSTANT MaxWCWriteCount = 0
CONSTANT MaxRecoveryCrashCount = 0

SPECIFICATION MCSpec
CONSTRAINT StateConstraint
SYMMETRY ServerSymmetry
VIEW View

INVARIANT NoTwoPrimariesInSameTerm
INVARIANT StableNeverExceedsAllDurable
INVARIANT HolesBlockAllDurable
INVARIANT PreparedTxnPinsStable
