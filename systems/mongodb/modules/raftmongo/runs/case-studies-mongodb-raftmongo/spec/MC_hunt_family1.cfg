\* MC_hunt_family1.cfg — Hunt for SERVER-39626 at larger bounds.
\* Family 1: Commit Point Propagation Protocol Bugs
\*
\* Key insight: SERVER-39626 requires 5 servers, 3 terms, 4+ log entries.
\* The existing MongoDB spec acknowledges this but uses bounds too small to trigger.
\* We use 5 servers with symmetry to reach the required state space.

\* ---- Constants ----

CONSTANT Server = {s1, s2, s3, s4, s5}
CONSTANT MaxClientWriteSize = 1
CONSTANT Nil = Nil
CONSTANT WriteConcernMajorityShouldJournal = TRUE
CONSTANT InfOpTime <- MCInfOpTime

\* Bounds tuned for Family 1 — need 3+ terms and 4+ log entries
CONSTANT MaxTerm = 3
CONSTANT MaxLogLen = 4

\* Minimize irrelevant actions
CONSTANT MaxElections = 4
CONSTANT MaxCrashes = 0
CONSTANT MaxClientWrites = 5

\* ---- Spec ----

SPECIFICATION MCSpec
CONSTRAINT StateConstraint
SYMMETRY ServerSymmetry

\* ---- Target Invariants ----

INVARIANT NeverRollbackCommitted
INVARIANT NeverRollbackBeforeCommitPoint
INVARIANT NoTwoPrimariesInSameTerm
