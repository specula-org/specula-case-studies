\* MC_hunt_family2.cfg — Hunt for lastWritten / non-journal commit point bugs.
\* Family 2: lastWritten / lastApplied / lastDurable Confusion
\*
\* Key insight: When WriteConcernMajorityShouldJournal = FALSE, Agree() uses
\* lastWritten instead of lastDurable. This path is entirely unverified by any
\* existing TLA+ spec. 4 bug-fix commits in 2024 on this mechanism.
\*
\* We test BOTH configurations to find divergences.

\* ---- Constants ----

CONSTANT Server = {s1, s2, s3}
CONSTANT MaxClientWriteSize = 1
CONSTANT Nil = Nil
\* KEY: Test the non-journal path where Agree() uses lastWritten
CONSTANT WriteConcernMajorityShouldJournal = FALSE
CONSTANT InfOpTime <- MCInfOpTime

\* Moderate bounds — pipeline bugs manifest with few entries
CONSTANT MaxTerm = 3
CONSTANT MaxLogLen = 3

CONSTANT MaxElections = 3
CONSTANT MaxCrashes = 1
CONSTANT MaxClientWrites = 4

\* ---- Spec ----

SPECIFICATION MCSpec
CONSTRAINT StateConstraint
SYMMETRY ServerSymmetry

\* ---- Target Invariants ----

INVARIANT CommitPointNeverExceedsLastWritten
INVARIANT WriteApplyOrdering
INVARIANT DurableWriteOrdering
INVARIANT NeverRollbackCommitted
INVARIANT NoTwoPrimariesInSameTerm
