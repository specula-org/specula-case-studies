\* Trace.cfg — Trace validation configuration.
\* Uses INIT/NEXT (not SPECIFICATION) for deadlock-based completion checking.
\* Set JSON env var to select trace file: JSON=../traces/mytest.ndjson

CONSTANTS
    Nil = Nil
    WriteConcernMajorityShouldJournal = TRUE
    MaxClientWriteSize = 1
    InfOpTime <- TraceInfOpTime
    Server = {"s1", "s2", "s3"}

\* Use INIT/NEXT for deadlock-based trace completion
INIT TraceInit
NEXT TraceNext

\* Check safety invariants during trace replay
INVARIANT NoTwoPrimariesInSameTerm
INVARIANT WriteApplyOrdering
INVARIANT DurableWriteOrdering
INVARIANT CommitPointNeverExceedsLastWritten

\* Deadlock signals trace completion (all events consumed, no more enabled actions)
\* Use -deadlock flag to DISABLE deadlock checking if needed
