\* MC_hunt_server39626.cfg — Hunt for SERVER-39626
\* NeverRollbackCommitted violated at 5 servers, 3 terms, 4+ log entries
\* The existing MongoDB spec documents this bug but cannot trigger it at small bounds.

CONSTANT Server = {s1, s2, s3, s4, s5}
CONSTANT MaxClientWriteSize = 1
CONSTANT Nil = Nil
CONSTANT WriteConcernMajorityShouldJournal = TRUE
CONSTANT InfOpTime <- MCInfOpTime

\* Larger bounds to trigger SERVER-39626
CONSTANT MaxTerm = 3
CONSTANT MaxLogLen = 4

\* Counter bounds
CONSTANT MaxElections = 5
CONSTANT MaxCrashes = 0
CONSTANT MaxClientWrites = 6

SPECIFICATION MCSpec
CONSTRAINT StateConstraint

SYMMETRY ServerSymmetry

\* Target invariant
INVARIANT NeverRollbackCommitted

\* Structural invariants
INVARIANT WriteApplyOrdering
INVARIANT DurableWriteOrdering
INVARIANT CountersValid
