\* MC_hunt_family2_nojournal.cfg — Hunt for bugs specific to non-journal commit path.
\* Family 2 variant: WriteConcernMajorityShouldJournal = FALSE with larger bounds
\*
\* The non-journal path uses lastWritten in Agree() instead of lastDurable.
\* With 5 servers (to match SERVER-39626 bounds) and no-journal config,
\* this explores entirely unverified territory.

\* ---- Constants ----

CONSTANT Server = {s1, s2, s3, s4, s5}
CONSTANT MaxClientWriteSize = 1
CONSTANT Nil = Nil
\* KEY: Non-journal path — Agree() uses lastWritten
CONSTANT WriteConcernMajorityShouldJournal = FALSE
CONSTANT InfOpTime <- MCInfOpTime

\* Match SERVER-39626 bounds
CONSTANT MaxTerm = 3
CONSTANT MaxLogLen = 4

CONSTANT MaxElections = 4
CONSTANT MaxCrashes = 0
CONSTANT MaxClientWrites = 5

\* ---- Spec ----

SPECIFICATION MCSpec
CONSTRAINT StateConstraint
SYMMETRY ServerSymmetry

\* ---- Target Invariants ----

INVARIANT NeverRollbackCommitted
INVARIANT NeverRollbackBeforeCommitPoint
INVARIANT CommitPointNeverExceedsLastWritten
INVARIANT NoTwoPrimariesInSameTerm
