# 3-node MongoDB replica set for RaftMongo replication protocol trace capture.
# Verbosity 3 on replication enables commit point update logs (21826) and vote logs (5972100).

services:
  mongo1:
    image: mongo:8
    container_name: rm-mongo1
    hostname: mongo1
    command: >
      mongod --replSet raftrs --port 27017
      --setParameter enableTestCommands=1
      --setParameter logComponentVerbosity='{replication: {verbosity: 3}}'
      --bind_ip_all
    ports:
      - "27017:27017"
    volumes:
      - mongo1-data:/data/db
    networks:
      - rm-net

  mongo2:
    image: mongo:8
    container_name: rm-mongo2
    hostname: mongo2
    command: >
      mongod --replSet raftrs --port 27017
      --setParameter enableTestCommands=1
      --setParameter logComponentVerbosity='{replication: {verbosity: 3}}'
      --bind_ip_all
    ports:
      - "27018:27017"
    volumes:
      - mongo2-data:/data/db
    networks:
      - rm-net

  mongo3:
    image: mongo:8
    container_name: rm-mongo3
    hostname: mongo3
    command: >
      mongod --replSet raftrs --port 27017
      --setParameter enableTestCommands=1
      --setParameter logComponentVerbosity='{replication: {verbosity: 3}}'
      --bind_ip_all
    ports:
      - "27019:27017"
    volumes:
      - mongo3-data:/data/db
    networks:
      - rm-net

volumes:
  mongo1-data:
  mongo2-data:
  mongo3-data:

networks:
  rm-net:
    driver: bridge
