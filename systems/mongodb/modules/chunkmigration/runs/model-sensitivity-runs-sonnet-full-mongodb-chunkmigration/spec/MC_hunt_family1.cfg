\* Hunt config for Family 1: Commit Decision Durability vs Critical Section Release Ordering
\* Targets MC-1: crash between LaunchReleaseRecipientCritSec and PersistCommitDecision
\* leaves recipient crit sec released with no durable commit decision.
\*
\* Tight bounds: allow crashes; zeroed out concAborts (not relevant here).
\* Targeted invariants: CommitDecisionDurabilityBeforeRelease + NoOrphanAfterCommit + structural.

SPECIFICATION MCSpec

CONSTANTS
    Donor    = Donor
    Recipient = Recipient
    Config   = Config
    NONE      = "none"
    COMMITTED = "committed"
    ABORTED   = "aborted"
    kInit          = "kInit"
    kCloning       = "kCloning"
    kEnteredCritSec = "kEnteredCritSec"
    kDone          = "kDone"
    kFail          = "kFail"
    kAbort         = "kAbort"
    RD_ABSENT  = "absent"
    RD_PENDING = "pending"
    RD_READY   = "ready"
    D_INIT       = "d_init"
    D_CLONING    = "d_cloning"
    D_CRITSEC    = "d_critsec"
    D_COMMITTED  = "d_committed"
    D_ABORTED    = "d_aborted"
    MaxCrashLimit     = 2
    MaxConcAbortLimit = 0

VIEW MCView

INVARIANTS
    CoordDocConsistency
    ConfigCommitOrdering
    DonorRDTaskRequiresCoordDoc
    CommitDecisionDurabilityBeforeRelease
    NoOrphanAfterCommit
