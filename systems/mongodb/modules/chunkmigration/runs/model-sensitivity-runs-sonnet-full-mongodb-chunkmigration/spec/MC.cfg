SPECIFICATION MCSpec

CONSTANTS
    Donor    = Donor
    Recipient = Recipient
    Config   = Config
    NONE      = "none"
    COMMITTED = "committed"
    ABORTED   = "aborted"
    kInit          = "kInit"
    kCloning       = "kCloning"
    kEnteredCritSec = "kEnteredCritSec"
    kDone          = "kDone"
    kFail          = "kFail"
    kAbort         = "kAbort"
    RD_ABSENT  = "absent"
    RD_PENDING = "pending"
    RD_READY   = "ready"
    D_INIT       = "d_init"
    D_CLONING    = "d_cloning"
    D_CRITSEC    = "d_critsec"
    D_COMMITTED  = "d_committed"
    D_ABORTED    = "d_aborted"
    MaxCrashLimit     = 2
    MaxConcAbortLimit = 1

\* Exclude fault counters from state fingerprint (speeds up TLC)
VIEW MCView

INVARIANTS
    \* --- Structural invariants (always enabled) ---
    CoordDocConsistency
    ConfigCommitOrdering
    DonorRDTaskRequiresCoordDoc

    \* --- Extension invariants (bug-family-specific) ---
    \* Comment out during spec convergence; enable in hunt configs.
    \* CommitDecisionDurabilityBeforeRelease
    \* RangeDeletionConsistency
    \* RangeDeletionConsistencyFinal
    \* RecoveryHonorsAbort
    \* NoOrphanAfterCommit
