\* Hunt config for Family 3: Range Deletion Task Lifecycle Inconsistency
\* Targets MC-2: crash between PersistCommitDecision and DeleteRecipientRangeDeletionTask
\* leaves recipient task alive after commit (triggers data loss when range deleter fires).
\* Also targets MC-4: early-exit at coordinator.cpp:285-294 (missing donor RD task on recovery)
\* leaves recipient task permanently alive after commit.
\*
\* Tight bounds: allow crashes (task lifecycle bugs require crash); zero out concAborts.
\* Targeted invariants: RangeDeletionConsistency + RangeDeletionConsistencyFinal + NoOrphanAfterCommit.

SPECIFICATION MCSpec

CONSTANTS
    Donor    = Donor
    Recipient = Recipient
    Config   = Config
    NONE      = "none"
    COMMITTED = "committed"
    ABORTED   = "aborted"
    kInit          = "kInit"
    kCloning       = "kCloning"
    kEnteredCritSec = "kEnteredCritSec"
    kDone          = "kDone"
    kFail          = "kFail"
    kAbort         = "kAbort"
    RD_ABSENT  = "absent"
    RD_PENDING = "pending"
    RD_READY   = "ready"
    D_INIT       = "d_init"
    D_CLONING    = "d_cloning"
    D_CRITSEC    = "d_critsec"
    D_COMMITTED  = "d_committed"
    D_ABORTED    = "d_aborted"
    MaxCrashLimit     = 2
    MaxConcAbortLimit = 0

VIEW MCView

INVARIANTS
    CoordDocConsistency
    ConfigCommitOrdering
    DonorRDTaskRequiresCoordDoc
    RangeDeletionConsistency
    RangeDeletionConsistencyFinal
    NoOrphanAfterCommit
