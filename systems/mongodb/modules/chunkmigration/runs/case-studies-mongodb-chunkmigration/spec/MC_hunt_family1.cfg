\* Hunting config for Bug Family 1: Missing migrationId in local range deletion ops
\* Target: NoPrematureRangeDeletion, ActiveMigrationHasTask
\* Scenario: M1 cleanup replays after stepdown, hits M2's task
\* Needs: stepdown (to rollback w:1 forget), range deleter (to clean M1's task),
\*         abort OR commit for M1, then M2 starts on same range

SPECIFICATION MCSpec

CONSTANTS
    MigrationId = {m1, m2}
    Nil = Nil

    MaxStepdownLimit = 2
    MaxAbortLimit = 2
    MaxConfigFailLimit = 0
    MaxConfigAsyncLimit = 0
    MaxRemoveRecipientLimit = 0
    MaxRestoreRecipientLimit = 0
    MaxForgetDurableLimit = 0
    MaxRangeDeleterLimit = 2

VIEW MCView
CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    NoPrematureRangeDeletion
    ActiveMigrationHasTask
