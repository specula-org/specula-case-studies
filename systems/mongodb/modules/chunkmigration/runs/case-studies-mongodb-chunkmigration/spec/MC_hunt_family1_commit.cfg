\* Hunting config for Bug Family 1 (commit path variant): markReady hits wrong task
\* Target: NoPrematureRangeDeletion
\* Scenario: M1 commits, cleanup completes (w:1 forget), M2 starts,
\*           stepdown rolls back M1's forget, recovery replays M1 commit,
\*           markReadyLocally marks M2's task as ready

SPECIFICATION MCSpec

CONSTANTS
    MigrationId = {m1, m2}
    Nil = Nil

    MaxStepdownLimit = 2
    MaxAbortLimit = 0
    MaxConfigFailLimit = 0
    MaxConfigAsyncLimit = 0
    MaxRemoveRecipientLimit = 0
    MaxRestoreRecipientLimit = 0
    MaxForgetDurableLimit = 0
    MaxRangeDeleterLimit = 2

VIEW MCView
CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    NoPrematureRangeDeletion
