version: "3.8"

# Sharded MongoDB cluster for chunk migration trace capture.
# Topology: 1 config server RS + 2 single-node shard RSs + 1 mongos router.
# Verbosity 3 captures all migration coordinator DEBUG logs.

services:
  configsvr:
    image: mongo:8
    container_name: cm-configsvr
    hostname: configsvr
    command: >
      mongod --configsvr --replSet configrs --port 27019
      --setParameter logComponentVerbosity='{sharding: {verbosity: 3}}'
      --bind_ip_all
    ports:
      - "27119:27019"
    volumes:
      - configsvr-data:/data/db
    networks:
      - cm-net

  shard0:
    image: mongo:8
    container_name: cm-shard0
    hostname: shard0
    command: >
      mongod --shardsvr --replSet shard0rs --port 27018
      --setParameter logComponentVerbosity='{sharding: {verbosity: 3}}'
      --setParameter orphanCleanupDelaySecs=0
      --bind_ip_all
    ports:
      - "27118:27018"
    volumes:
      - shard0-data:/data/db
    networks:
      - cm-net

  shard1:
    image: mongo:8
    container_name: cm-shard1
    hostname: shard1
    command: >
      mongod --shardsvr --replSet shard1rs --port 27018
      --setParameter logComponentVerbosity='{sharding: {verbosity: 3}}'
      --setParameter orphanCleanupDelaySecs=0
      --bind_ip_all
    ports:
      - "27218:27018"
    volumes:
      - shard1-data:/data/db
    networks:
      - cm-net

  mongos:
    image: mongo:8
    container_name: cm-mongos
    hostname: mongos
    command: >
      mongos --configdb configrs/configsvr:27019 --port 27017
      --setParameter logComponentVerbosity='{sharding: {verbosity: 3}}'
      --bind_ip_all
    ports:
      - "27017:27017"
    depends_on:
      - configsvr
      - shard0
      - shard1
    networks:
      - cm-net

volumes:
  configsvr-data:
  shard0-data:
  shard1-data:

networks:
  cm-net:
    driver: bridge
