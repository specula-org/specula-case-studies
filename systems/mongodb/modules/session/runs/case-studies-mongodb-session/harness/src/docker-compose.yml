# 3-node replica set for session lifecycle trace validation.
# Enables test commands (prepareTransaction), high transaction/session log verbosity,
# and short session timeout for reaper testing.
services:
  mongo1:
    image: mongo:8
    container_name: session-mongo1
    hostname: mongo1
    command: >
      mongod --replSet rs0 --port 27017
      --setParameter enableTestCommands=1
      --setParameter "logComponentVerbosity={transaction: {verbosity: 3}, replication: {verbosity: 2}}"
      --setParameter localLogicalSessionTimeoutMinutes=2
      --bind_ip_all
    ports:
      - "27517:27017"
    volumes:
      - .:/scripts:ro
    networks:
      - session-net
    healthcheck:
      test: mongosh --quiet --eval "db.adminCommand('ping').ok" || exit 1
      interval: 5s
      timeout: 5s
      retries: 10

  mongo2:
    image: mongo:8
    container_name: session-mongo2
    hostname: mongo2
    command: >
      mongod --replSet rs0 --port 27017
      --setParameter enableTestCommands=1
      --setParameter "logComponentVerbosity={transaction: {verbosity: 3}, replication: {verbosity: 2}}"
      --setParameter localLogicalSessionTimeoutMinutes=2
      --bind_ip_all
    ports:
      - "27518:27017"
    volumes:
      - .:/scripts:ro
    networks:
      - session-net
    healthcheck:
      test: mongosh --quiet --eval "db.adminCommand('ping').ok" || exit 1
      interval: 5s
      timeout: 5s
      retries: 10

  mongo3:
    image: mongo:8
    container_name: session-mongo3
    hostname: mongo3
    command: >
      mongod --replSet rs0 --port 27017
      --setParameter enableTestCommands=1
      --setParameter "logComponentVerbosity={transaction: {verbosity: 3}, replication: {verbosity: 2}}"
      --setParameter localLogicalSessionTimeoutMinutes=2
      --bind_ip_all
    ports:
      - "27519:27017"
    volumes:
      - .:/scripts:ro
    networks:
      - session-net
    healthcheck:
      test: mongosh --quiet --eval "db.adminCommand('ping').ok" || exit 1
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  session-net:
    driver: bridge
