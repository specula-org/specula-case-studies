\* Hunting config: Family 5 — EndSession with prepared txn
\* Targets: EndSessionSafety
\* Strategy: EndSession + prepared txn — minimal other actions.

SPECIFICATION MCSpec

CONSTANTS
    Session = {s1, s2}
    Thread = {t1, t2, t3}
    NilThread = NilThread
    NilSession = NilSession

    \* Tight bounds: endSessions + prepared txn
    MaxBeginTxn = 2
    MaxPrepareTxn = 2
    MaxStepDown = 0
    MaxKillSession = 0
    MaxReaperRun = 0
    MaxEagerReap = 0
    MaxEndSession = 2

    \* No fault injection needed
    MaxReaperBypass = 0
    MaxReaperFail = 0
    MaxEagerReapFail = 0
    MaxKillTimeout = 0

SYMMETRY ModelSymmetry

CONSTRAINT StateConstraint

VIEW MCView

\* Core safety + endSession-targeted invariant
INVARIANTS
    SessionCheckoutExclusive
    EndSessionSafety
