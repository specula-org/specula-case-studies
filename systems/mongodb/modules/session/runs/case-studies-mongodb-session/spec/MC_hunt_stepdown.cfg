\* Hunting config: Family 2 — Step-down / session checkout deadlock
\* Targets: NoKillsRequestedLeak, StepDownTermination
\* Strategy: Enable step-down + kill timeout, prepared txns to create blocking.

SPECIFICATION MCSpec

CONSTANTS
    Session = {s1, s2}
    Thread = {t1, t2, t3}
    NilThread = NilThread
    NilSession = NilSession

    \* Tight bounds: step-down + prepared txn interaction
    MaxBeginTxn = 2
    MaxPrepareTxn = 2
    MaxStepDown = 1
    MaxKillSession = 2
    MaxReaperRun = 0
    MaxEagerReap = 0
    MaxEndSession = 0

    \* Fault injection: kill timeout models the deadlock trigger
    MaxReaperBypass = 0
    MaxReaperFail = 0
    MaxEagerReapFail = 0
    MaxKillTimeout = 2

SYMMETRY ModelSymmetry

CONSTRAINT StateConstraint

VIEW MCView

\* Core safety + step-down invariants
INVARIANTS
    SessionCheckoutExclusive
    NoKillsRequestedLeak
    ThreadSessionConsistency

\* Liveness: step-down must eventually complete
\* PROPERTIES
\*     StepDownTermination
