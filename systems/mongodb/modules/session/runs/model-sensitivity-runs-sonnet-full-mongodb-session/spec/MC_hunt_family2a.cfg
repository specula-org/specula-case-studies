    Session                = {s1, s2}
    MaxTime                = 3
    MaxKillChangeFailLimit = 0   \* separate from Family 2b
    MaxRefreshFailLimit    = 0   \* refresh irrelevant
    MaxRevivifyLimit       = 0   \* revivify irrelevant

SYMMETRY MCSymmetry

VIEW MCView

INVARIANTS
    TypeOK
    AtMostOneCheckout
    KillCheckoutRequiresToken
    NoWaitersStuckAfterKillComplete

