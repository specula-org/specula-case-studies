\*           blocked indefinitely (no second notify_all after --killsRequested)?
\*           (session_catalog.cpp:371-376)
\*
\* Setup: Need at least one normal waiter AND one kill checkout completing.
\*        Kill change fail disabled (orthogonal issue).
\*        Refresh/reap irrelevant — reduce to 0 cycles.
\*
\* Temporal property: NoLivelockAfterKill (liveness violation expected).
\* Also check safety invariant NoWaitersStuckAfterKillComplete.

SPECIFICATION MCSpec

