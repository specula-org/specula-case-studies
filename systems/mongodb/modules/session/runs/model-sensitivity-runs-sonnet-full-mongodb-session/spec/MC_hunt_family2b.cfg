\* MC_hunt_family2b.cfg — Kill Protocol: registerChange fail → orphan kill counter (Family 2 / MC-3)
\*
\* Target: NoOrphanKillRequest
\* Question: If registerChange throws after session.kill(), is the SRI permanently
\*           stuck with killsRequested > 0?
\*           (session_catalog_mongod.cpp:683-686)
\*
\* Setup: Enable kill change fail. Disable refresh/reap (irrelevant).
\*        Single session sufficient to expose the orphan.

SPECIFICATION MCSpec

CONSTANTS
    Session                = {s1}
    MaxTime                = 3
    MaxKillChangeFailLimit = 1   \* one fail is enough to create orphan kill
    MaxRefreshFailLimit    = 0   \* refresh irrelevant
    MaxRevivifyLimit       = 0   \* revivify irrelevant

\* No symmetry with single session
\*SYMMETRY MCSymmetry

VIEW MCView

INVARIANTS
    TypeOK
    AtMostOneCheckout
    NoOrphanKillRequest
