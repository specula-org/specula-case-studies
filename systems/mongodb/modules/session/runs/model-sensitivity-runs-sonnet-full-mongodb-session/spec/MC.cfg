\* MC.cfg — standard safety config for spec convergence validation.
\* Extension (bug-family) invariants are COMMENTED OUT.
\* Use MC_hunt_*.cfg for targeted bug hunting.

SPECIFICATION MCSpec

CONSTANTS
    Session              = {s1, s2}
    MaxTime              = 5
    MaxKillChangeFailLimit = 2
    MaxRefreshFailLimit    = 3
    MaxRevivifyLimit       = 2

SYMMETRY MCSymmetry

VIEW MCView

\* ---- Structural invariants (always enabled) ----
CONSTRAINT
    MCWaitersConstraint

INVARIANTS
    TypeOK
    AtMostOneCheckout
    CheckoutImpliesInCatalog
    KillCheckoutRequiresToken
    KillReleasePhaseConsistency
    DiskReapDoneConsistency

\* ---- Extension invariants (bug-family specific) — COMMENTED OUT for convergence ----
\* Uncomment individually when running hunt configs.
\*INVARIANTS
\*    TxnRecordSafeWhileLive
\*    NoWaitersStuckAfterKillComplete
\*    NoOrphanKillRequest
\*    NoDanglingImageWithoutTxnRecord
\*    NoStaleCheckoutAfterMemoryReap
