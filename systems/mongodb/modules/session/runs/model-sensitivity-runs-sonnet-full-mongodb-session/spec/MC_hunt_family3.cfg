\* MC_hunt_family3.cfg — Refresh Partial-Failure: runningOp sessions silently dropped (Family 3 / MC-4)
\*
\* Target: RunningOpSessionNotSilentlyDropped
\* Question: Can a session whose runningOpSession refresh fails expire via TTL
\*           while its operation is still running?
\*           (logical_session_cache_impl.cpp:356-398)
\*
\* The bug: After RefreshFail for a runningOp session, refreshRetryQueued stays FALSE
\* (only active sessions are backswapped at line 394-397; runningOp sessions are not).
\* This config confirms that a runningOp session CAN fail without being queued for retry.
\*
\* Negated invariant: at least one runningOp session fails refresh without being re-queued.
\* We check NoRunningOpDropped (true when drops don't happen) — violation = drop confirmed.

SPECIFICATION MCSpec

CONSTANTS
    Session                = {s1, s2}
    MaxTime                = 4
    MaxKillChangeFailLimit = 0   \* kill faults irrelevant
    MaxRefreshFailLimit    = 3   \* allow multiple refresh failures
    MaxRevivifyLimit       = 0   \* revivify irrelevant

SYMMETRY MCSymmetry

VIEW MCView

INVARIANTS
    TypeOK
    AtMostOneCheckout
    \* NoRunningOpDropped is the negation of the bug: if a session has source=runningOp
    \* and refreshFail fired for it, refreshRetryQueued[s] must be TRUE.
    \* Since the code does NOT queue runningOp failures, this will be violated.
    NoRunningOpDropped
