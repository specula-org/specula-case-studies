\* Trace.cfg — trace validation config for MongoDBSession.

SPECIFICATION TraceSpec

CONSTANTS
    Session = {s1, s2}
    MaxTime = 10

\* Safety and structural invariants that should hold on every real execution.
INVARIANTS
    TraceTypeOK
    TraceStructuralInvariants

\* Mandatory: entire trace must be consumed. Without this, TLC falsely reports success.
PROPERTIES
    TraceMatched
