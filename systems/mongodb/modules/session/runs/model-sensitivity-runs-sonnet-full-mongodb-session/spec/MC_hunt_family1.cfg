\* MC_hunt_family1.cfg — Refresh-Reap Protocol Race (Family 1 / MC-1)
\*
\* Target: TxnRecordSafeWhileLive
\* Question: Can _reap delete a config.transactions entry for a session
\*           that _refresh upserted within the same reap window?
\*           (logical_session_cache_impl.cpp:250-253, :371)
\*
\* Setup: Allow both refresh and reap workers to run concurrently.
\*        Zero out kill faults (irrelevant). Minimal revivify.
\*        RefreshFail needed to exercise the partial-failure path.

SPECIFICATION MCSpec

CONSTANTS
    Session                = {s1, s2}
    MaxTime                = 4
    MaxKillChangeFailLimit = 0   \* kill faults irrelevant for Family 1
    MaxRefreshFailLimit    = 2   \* allow some refresh failures
    MaxRevivifyLimit       = 0   \* revivify irrelevant for Family 1

SYMMETRY MCSymmetry

VIEW MCView

INVARIANTS
    TypeOK
    AtMostOneCheckout
    TxnRecordSafeWhileLive
