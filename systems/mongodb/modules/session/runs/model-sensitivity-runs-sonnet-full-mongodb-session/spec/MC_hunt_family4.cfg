\* MC_hunt_family4.cfg — Non-Atomic Two-Phase Session Reap (Family 4 / MC-5)
\*
\* Targets:
\*   NoDanglingImageWithoutTxnRecord (intermediate window: image gone, txn exists)
\*   NoStaleCheckoutAfterMemoryReap (session re-vivified with no disk records)
\*
\* Question: Can a checkout occur between memory-reap and disk-reap (phases 1 and 2)
\*           and find no config.transactions entry?
\*           (session_catalog_mongod.cpp:244-294)
\*
\* Setup: Enable revivify (the checkout between phases). No kill faults. No refresh fails.
\*        Small MaxTime (reap trigger comes from clock, not time-based TTL).

SPECIFICATION MCSpec

CONSTANTS
    Session                = {s1, s2}
    MaxTime                = 4
    MaxKillChangeFailLimit = 0   \* kill faults irrelevant
    MaxRefreshFailLimit    = 0   \* refresh failures irrelevant
    MaxRevivifyLimit       = 2   \* allow checkouts between reap phases

SYMMETRY MCSymmetry

VIEW MCView

INVARIANTS
    TypeOK
    AtMostOneCheckout
    NoDanglingImageWithoutTxnRecord
    NoStaleCheckoutAfterMemoryReap
