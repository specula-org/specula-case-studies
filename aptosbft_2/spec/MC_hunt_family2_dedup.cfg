\* MC_hunt_family2.cfg — Family 2: Order-vote vs regular-vote guard
\* asymmetry; no per-author equivocation map in pending_order_votes.
\*
\* Targets:
\*   MC-2 — A node that has regular-voted at R, then accepts a
\*          Byzantine-supplied OrderVoteProposal at R with a different
\*          block, signs an OrderVote because safe_for_order_vote
\*          doesn't consult last_voted_round.
\*   MC-3 — Two distinct li_digest order-cert quorums can both reach
\*          2f+1 in pending_order_votes at the same round because the
\*          aggregator has no per-author equivocation check.
\*
\* Mechanism that must remain enabled:
\*   - ByzEquivocateProposer + ByzEquivocateOrderVote
\*   - SignOrderVote (with NO last_voted_round guard, as in
\*     safety_rules_2chain.rs:97-119)
\*   - ReceiveOrderVote (no ensure_round_and_sync_up; no per-author dedup)

CONSTANTS
    Server = {s1, s2, s3, s4}
    Faulty = {s4}
    Honest = {s1, s2, s3}
    MaxRound = 3
    MaxEpoch = 1
    Quorum = 3
    Values = {v1, v2}
    Nil = Nil

    ProposalMsgType    = ProposalMsgType
    OptProposalMsgType = OptProposalMsgType
    VoteMsgType        = VoteMsgType
    OrderVoteMsgType   = OrderVoteMsgType
    TimeoutMsgType     = TimeoutMsgType
    CommitVoteMsgType  = CommitVoteMsgType

    Ordered    = Ordered
    Executed   = Executed
    Signed     = Signed
    Aggregated = Aggregated

    MaxTimeoutLimit            = 0
    MaxCrashLimit              = 0
    MaxDropLimit               = 0
    MaxSyncLimit               = 0
    MaxEpochChangeLimit        = 0
    MaxByzEquivProposerLimit   = 2
    MaxByzEquivOrderVoteLimit  = 2     \* MC-3 needs two distinct digests
    MaxByzReuseCertLimit       = 0
    MaxByzForgeQCLimit         = 0
    MaxByzReplayLimit          = 0
    MaxWeakEpochRxLimit        = 0
    MaxMsgBufferLimit          = 12

SPECIFICATION MCSpec

VIEW MCView

CONSTRAINT MsgBufferConstraint

\* Family 2 invariants + core safety
\* Variant: NoCrossPathSign disabled to focus the search on OrderVoteAggregatorDedup
INVARIANTS
    OrderVoteAggregatorDedup
    Agreement
    CommitSafety
    RoundPositive
    LVRBound
    HTRBound
    LastVoteShape
    PipelineMonotone
