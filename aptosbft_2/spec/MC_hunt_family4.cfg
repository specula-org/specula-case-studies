\* MC_hunt_family4.cfg — Family 4: Cross-epoch replay.
\*
\* Targets:
\*   MC-6 — A Byzantine relayer replays a real OrderVote from epoch N
\*          as an OrderVoteMsg in epoch N+1 whose inner QC remains
\*          from N, slipping past the RX-side epoch filter (which only
\*          checks order_vote.epoch).  The receiver-side
\*          verify_order_vote does not bind order_vote.epoch to
\*          inner_qc.certified_block.epoch.
\*
\* Mechanism that must remain enabled:
\*   - ByzCrossEpochReplay (takes a real cert from epoch N, claims N+1)
\*   - ReceiveOrderVoteWeakEpoch (the unbound RX-side inner-epoch path)
\*   - EpochChange (to have at least one epoch transition)

CONSTANTS
    Server = {s1, s2, s3, s4}
    Faulty = {s4}
    Honest = {s1, s2, s3}
    MaxRound = 3
    MaxEpoch = 3
    Quorum = 3
    Values = {v1, v2}
    Nil = Nil

    ProposalMsgType    = ProposalMsgType
    OptProposalMsgType = OptProposalMsgType
    VoteMsgType        = VoteMsgType
    OrderVoteMsgType   = OrderVoteMsgType
    TimeoutMsgType     = TimeoutMsgType
    CommitVoteMsgType  = CommitVoteMsgType

    Ordered    = Ordered
    Executed   = Executed
    Signed     = Signed
    Aggregated = Aggregated

    MaxTimeoutLimit            = 0
    MaxCrashLimit              = 0
    MaxDropLimit               = 0
    MaxSyncLimit               = 0
    MaxEpochChangeLimit        = 2
    MaxByzEquivProposerLimit   = 0
    MaxByzEquivOrderVoteLimit  = 0
    MaxByzReuseCertLimit       = 0
    MaxByzForgeQCLimit         = 0
    MaxByzReplayLimit          = 2
    MaxWeakEpochRxLimit        = 2
    MaxMsgBufferLimit          = 12

SPECIFICATION MCSpec

VIEW MCView

CONSTRAINT MsgBufferConstraint

\* Family 4 invariants + core safety
INVARIANTS
    OrderVoteEpochBound
    Agreement
    CommitSafety
    RoundPositive
    LVRBound
    HTRBound
    LastVoteShape
    PipelineMonotone
