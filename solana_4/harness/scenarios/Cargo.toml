[package]
name = "alpenglow-migration-harness"
version = "0.1.0"
edition = "2024"

[dependencies]
agave-votor-messages = { path = "../../../artifact/agave/votor-messages", features = ["agave-unstable-api", "dev-context-only-utils", "tla-trace"] }
solana-bls-signatures = "3.3.0"
solana-hash = "4.3.0"
solana-pubkey = "4.2.0"

[[bin]]
name = "happy-path"
path = "src/happy_path.rs"

[[bin]]
name = "startup-poh-race"
path = "src/startup_poh_race.rs"

[[bin]]
name = "panic-paths"
path = "src/panic_paths.rs"
