\* MC_hunt_drain_v2.cfg — Family 2: Drain mode races WITHOUT force reconfig
\* Target: DrainModeReconfigSafety + NeverRollbackCommitted
\* Focus: interleave reconfig between WinElection and CompleteDrain.

CONSTANTS
    Server = {s1, s2, s3}
    Leader = Leader
    Follower = Follower
    Down = Down
    Arbiter = {}

    MaxTermLimit = 4
    ForceReconfigLimit = 0
    ReconfigLimit = 3
    ShutDownLimit = 1
    ClientRequestLimit = 3
    RemoveNewlyAddedLimit = 0

SPECIFICATION MCSpec

CONSTRAINT StateConstraint

SYMMETRY ModelSymmetry

INVARIANT ElectionSafety
INVARIANT DrainModeReconfigSafety

PROPERTY NeverRollbackCommitted
