\* MC_hunt_newlyadded_v2.cfg — Family 5: newlyAdded safety WITHOUT force reconfig
\* Target: NewlyAddedSafety + NeverRollbackCommitted
\* Focus: pure newlyAdded addition/removal interactions

CONSTANTS
    Server = {s1, s2, s3}
    Leader = Leader
    Follower = Follower
    Down = Down
    Arbiter = {}

    MaxTermLimit = 3
    ForceReconfigLimit = 0
    ReconfigLimit = 3
    ShutDownLimit = 1
    ClientRequestLimit = 3
    RemoveNewlyAddedLimit = 3

SPECIFICATION MCSpec

CONSTRAINT StateConstraint

SYMMETRY ModelSymmetry

INVARIANT ElectionSafety
INVARIANT NewlyAddedSafety

PROPERTY NeverRollbackCommitted
