\* MC_hunt_heartbeat.cfg — Family 3: Heartbeat Config Propagation Asymmetry
\* Target: ConfigPropagationSafety
\* Mechanism: secondary receives config via heartbeat (no commit point update),
\* becomes primary, does reconfig with stale lastCommittedInPrevConfig.
\*
\* Tight bounds: multiple elections + reconfigs, config propagation critical.

CONSTANTS
    Server = {s1, s2, s3}
    Leader = Leader
    Follower = Follower
    Down = Down
    Arbiter = {}

    MaxTermLimit = 4
    ForceReconfigLimit = 1
    ReconfigLimit = 3
    ShutDownLimit = 0
    ClientRequestLimit = 2
    RemoveNewlyAddedLimit = 0

SPECIFICATION MCSpec

CONSTRAINT StateConstraint

SYMMETRY ModelSymmetry

\* Core safety
INVARIANT ElectionSafety

\* Family 3 target
INVARIANT ConfigPropagationSafety

\* Temporal
PROPERTY NeverRollbackCommitted
