# MongoDB 5-node replica set for MongoRaftReconfig trace collection.
# Nodes mongo1-mongo3 form the initial RS; mongo4-mongo5 available for reconfig tests.
# Replication logging at verbosity 3 captures election, config, and term events.

services:
  mongo1:
    image: mongo:8
    container_name: mongo-rs0-1
    command: >
      mongod --replSet rs0 --port 27017 --bind_ip_all
      --setParameter logComponentVerbosity='{replication: {verbosity: 3}}'
      --setParameter enableTestCommands=1
      --logpath /var/log/mongodb/mongod.log --logappend
    volumes:
      - mongo1-data:/data/db
      - mongo1-logs:/var/log/mongodb
    networks:
      - rs-net

  mongo2:
    image: mongo:8
    container_name: mongo-rs0-2
    command: >
      mongod --replSet rs0 --port 27017 --bind_ip_all
      --setParameter logComponentVerbosity='{replication: {verbosity: 3}}'
      --setParameter enableTestCommands=1
      --logpath /var/log/mongodb/mongod.log --logappend
    volumes:
      - mongo2-data:/data/db
      - mongo2-logs:/var/log/mongodb
    networks:
      - rs-net

  mongo3:
    image: mongo:8
    container_name: mongo-rs0-3
    command: >
      mongod --replSet rs0 --port 27017 --bind_ip_all
      --setParameter logComponentVerbosity='{replication: {verbosity: 3}}'
      --setParameter enableTestCommands=1
      --logpath /var/log/mongodb/mongod.log --logappend
    volumes:
      - mongo3-data:/data/db
      - mongo3-logs:/var/log/mongodb
    networks:
      - rs-net

  mongo4:
    image: mongo:8
    container_name: mongo-rs0-4
    command: >
      mongod --replSet rs0 --port 27017 --bind_ip_all
      --setParameter logComponentVerbosity='{replication: {verbosity: 3}}'
      --setParameter enableTestCommands=1
      --logpath /var/log/mongodb/mongod.log --logappend
    volumes:
      - mongo4-data:/data/db
      - mongo4-logs:/var/log/mongodb
    networks:
      - rs-net

  mongo5:
    image: mongo:8
    container_name: mongo-rs0-5
    command: >
      mongod --replSet rs0 --port 27017 --bind_ip_all
      --setParameter logComponentVerbosity='{replication: {verbosity: 3}}'
      --setParameter enableTestCommands=1
      --logpath /var/log/mongodb/mongod.log --logappend
    volumes:
      - mongo5-data:/data/db
      - mongo5-logs:/var/log/mongodb
    networks:
      - rs-net

volumes:
  mongo1-data:
  mongo1-logs:
  mongo2-data:
  mongo2-logs:
  mongo3-data:
  mongo3-logs:
  mongo4-data:
  mongo4-logs:
  mongo5-data:
  mongo5-logs:

networks:
  rs-net:
    driver: bridge
