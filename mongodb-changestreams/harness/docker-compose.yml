services:
  configsvr:
    image: mongo:8
    container_name: cs-configsvr
    command: mongod --configsvr --replSet configRS --bind_ip_all --port 27017
    networks:
      - cs-net
    healthcheck:
      test: mongosh --port 27017 --eval "db.adminCommand('ping')" --quiet
      interval: 5s
      timeout: 5s
      retries: 10

  shard1:
    image: mongo:8
    container_name: cs-shard1
    command: mongod --shardsvr --replSet shard1RS --bind_ip_all --port 27017
    networks:
      - cs-net
    healthcheck:
      test: mongosh --port 27017 --eval "db.adminCommand('ping')" --quiet
      interval: 5s
      timeout: 5s
      retries: 10

  shard2:
    image: mongo:8
    container_name: cs-shard2
    command: mongod --shardsvr --replSet shard2RS --bind_ip_all --port 27017
    networks:
      - cs-net
    healthcheck:
      test: mongosh --port 27017 --eval "db.adminCommand('ping')" --quiet
      interval: 5s
      timeout: 5s
      retries: 10

  mongos:
    image: mongo:8
    container_name: cs-mongos
    command: mongos --configdb configRS/configsvr:27017 --bind_ip_all --port 27017
    depends_on:
      configsvr:
        condition: service_healthy
    ports:
      - "${MONGOS_PORT:-27117}:27017"
    networks:
      - cs-net

networks:
  cs-net:
    driver: bridge
