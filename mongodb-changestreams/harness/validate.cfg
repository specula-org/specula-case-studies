\* Trace validation config for harness-generated traces.
\* Uses string constants (not model values) to match JSON trace data.
\* Override Shard to match the 2-shard Docker cluster.

INIT TraceInit
NEXT TraceNext

CONSTANTS
    Shard = {"s1", "s2"}
    MaxClusterTime = 100
    MaxTxnOps = 10
    Nil = "Nil"

\* Token versions
CONSTANTS
    V1 = "V1"
    V2 = "V2"

\* Token types
CONSTANTS
    HWMTokenType = 0
    EventTokenType = 128

\* Operation types
CONSTANTS
    InsertOp = "insert"
    UpdateOp = "update"
    DeleteOp = "delete"
    DropOp = "drop"
    RenameOp = "rename"
    InvalidateOp = "invalidate"

\* Stream states
CONSTANTS
    Active = "Active"
    InvalidatedState = "Invalidated"
    ClosedState = "Closed"

\* Topology modes
CONSTANTS
    NormalMode = "Normal"
    DegradedMode = "Degraded"

\* Default token version
CONSTANTS
    DefaultTokenVersion = "V2"

\* Base spec invariants checked during trace validation
INVARIANTS
    TotalOrder
    CursorPositionsValid
    StreamStateConsistency

ALIAS TraceAlias
