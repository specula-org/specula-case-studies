\* Trace validation configuration.
\* Uses INIT/NEXT (not SPECIFICATION) for deadlock-based completion checking.

INIT TraceInit
NEXT TraceNext

\* Shard identifiers — use CONSTANT DEFINITION to map to strings for JSON matching
CONSTANT Shard <- TraceShardConst
CONSTANTS
    MaxClusterTime = 100
    MaxTxnOps = 10
    Nil = "Nil"

\* Token versions
CONSTANTS
    V1 = "V1"
    V2 = "V2"

\* Token types
CONSTANTS
    HWMTokenType = 0
    EventTokenType = 128

\* Operation types
CONSTANTS
    InsertOp = "insert"
    UpdateOp = "update"
    DeleteOp = "delete"
    DropOp = "drop"
    RenameOp = "rename"
    InvalidateOp = "invalidate"

\* Stream states
CONSTANTS
    Active = "Active"
    InvalidatedState = "Invalidated"
    ClosedState = "Closed"

\* Topology modes
CONSTANTS
    NormalMode = "Normal"
    DegradedMode = "Degraded"

\* Default token version
CONSTANTS
    DefaultTokenVersion = "V2"

\* Use base spec invariants during trace validation
INVARIANTS
    TotalOrder
    CursorPositionsValid
    StreamStateConsistency

\* Alias for readable TLC output
ALIAS TraceAlias
