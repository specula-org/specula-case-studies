SPECIFICATION MCSpec

\* ============================================================
\* CONSTANTS — Shard identifiers
\* ============================================================
CONSTANTS
    Shard = {s1, s2}
    MaxClusterTime = 4
    MaxTxnOps = 2
    Nil = "Nil"

\* Token versions
CONSTANTS
    V1 = "V1"
    V2 = "V2"

\* Token types
CONSTANTS
    HWMTokenType = 0
    EventTokenType = 128

\* Operation types
CONSTANTS
    InsertOp = "insert"
    UpdateOp = "update"
    DeleteOp = "delete"
    DropOp = "drop"
    RenameOp = "rename"
    InvalidateOp = "invalidate"

\* Stream states
CONSTANTS
    Active = "Active"
    InvalidatedState = "Invalidated"
    ClosedState = "Closed"

\* Topology modes
CONSTANTS
    NormalMode = "Normal"
    DegradedMode = "Degraded"

\* Default token version
CONSTANTS
    DefaultTokenVersion = "V2"

\* ============================================================
\* COUNTER BOUNDS — convergence configuration
\* ============================================================
CONSTANTS
    MaxEvents = 3
    MaxClockAdvance = 3
    MaxVersionSwitch = 1
    MaxInvalidations = 1
    MaxTopoChanges = 1
    MaxTransactions = 1
    MaxResumes = 1
    MaxRecreates = 1
    MaxDelivered = 10

\* ============================================================
\* SYMMETRY
\* ============================================================
SYMMETRY ModelSymmetry

\* ============================================================
\* STATE CONSTRAINT
\* ============================================================
CONSTRAINT StateConstraint

\* ============================================================
\* INVARIANTS — Core safety + structural
\* ============================================================
INVARIANTS
    TotalOrder
    CursorPositionsValid
    ActiveCursorsSubset
    StreamStateConsistency
    TokenVersionsValid
    DeliveredEventsHaveTokens

\* ============================================================
\* EXTENSION INVARIANTS — commented out for convergence
\* Uncomment individually or use MC_hunt_*.cfg for bug hunting
\* ============================================================
\* INVARIANT InvalidationCompleteness
\* INVARIANT InvalidationIdempotency
\* INVARIANT NoEventLossAtSegmentBoundary
\* INVARIANT TxnOrderPreservation
\* INVARIANT NoGapOnResume
