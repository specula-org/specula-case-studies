\* MC_hunt_segment_boundary.cfg
\* Bug Family 3: Cross-Shard Event Merging & Topology Change (MC-3, MC-4, MC-6)
\* Target: NoEventLossAtSegmentBoundary + TotalOrder violations from
\*         shard add/remove, segment transitions, and merge ordering.
\* Strategy: Enable topology changes + multiple shards. Minimize invalidations, txns.

SPECIFICATION MCSpec

CONSTANTS
    Shard = {s1, s2, s3}
    MaxClusterTime = 4
    MaxTxnOps = 2
    Nil = "Nil"
    V1 = "V1"
    V2 = "V2"
    HWMTokenType = 0
    EventTokenType = 128
    InsertOp = "insert"
    UpdateOp = "update"
    DeleteOp = "delete"
    DropOp = "drop"
    RenameOp = "rename"
    InvalidateOp = "invalidate"
    Active = "Active"
    InvalidatedState = "Invalidated"
    ClosedState = "Closed"
    NormalMode = "Normal"
    DegradedMode = "Degraded"
    DefaultTokenVersion = "V2"

\* Tight bounds: focus on topology changes
CONSTANTS
    MaxEvents = 3
    MaxClockAdvance = 3
    MaxVersionSwitch = 0
    MaxInvalidations = 0
    MaxTopoChanges = 3
    MaxTransactions = 0
    MaxResumes = 1
    MaxRecreates = 0
    MaxDelivered = 12

SYMMETRY ModelSymmetry
CONSTRAINT StateConstraint

\* Target invariants
INVARIANTS
    TotalOrder
    NoEventLossAtSegmentBoundary
    NoGapOnResume
    CursorPositionsValid
