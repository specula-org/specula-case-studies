\* MC_hunt_version_transition.cfg
\* Bug Family 1: Resume Token Ordering & Version Transition (MC-1)
\* Target: TotalOrder + NoGapOnResume violations from version switch mid-stream
\* Strategy: Enable version switch, multiple events per shard, resume.
\*           Minimize invalidation and topology changes.

SPECIFICATION MCSpec

CONSTANTS
    Shard = {s1, s2}
    MaxClusterTime = 4
    MaxTxnOps = 2
    Nil = "Nil"
    V1 = "V1"
    V2 = "V2"
    HWMTokenType = 0
    EventTokenType = 128
    InsertOp = "insert"
    UpdateOp = "update"
    DeleteOp = "delete"
    DropOp = "drop"
    RenameOp = "rename"
    InvalidateOp = "invalidate"
    Active = "Active"
    InvalidatedState = "Invalidated"
    ClosedState = "Closed"
    NormalMode = "Normal"
    DegradedMode = "Degraded"
    DefaultTokenVersion = "V2"

\* Tight bounds: focus on version transition
CONSTANTS
    MaxEvents = 4
    MaxClockAdvance = 3
    MaxVersionSwitch = 2
    MaxInvalidations = 0
    MaxTopoChanges = 0
    MaxTransactions = 1
    MaxResumes = 2
    MaxRecreates = 0
    MaxDelivered = 12

SYMMETRY ModelSymmetry
CONSTRAINT StateConstraint

\* Target invariants
INVARIANTS
    TotalOrder
    NoGapOnResume
    CursorPositionsValid
