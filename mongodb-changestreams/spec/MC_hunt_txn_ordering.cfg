\* MC_hunt_txn_ordering.cfg
\* Bug Family 5: Transaction Unwinding & Event Atomicity (MC-5)
\* Target: TxnOrderPreservation + TotalOrder violations from
\*         txnOpIndex ordering and resume within transactions.
\* Strategy: Enable transactions + resume. Minimize topology, invalidations.

SPECIFICATION MCSpec

CONSTANTS
    Shard = {s1, s2}
    MaxClusterTime = 4
    MaxTxnOps = 3
    Nil = "Nil"
    V1 = "V1"
    V2 = "V2"
    HWMTokenType = 0
    EventTokenType = 128
    InsertOp = "insert"
    UpdateOp = "update"
    DeleteOp = "delete"
    DropOp = "drop"
    RenameOp = "rename"
    InvalidateOp = "invalidate"
    Active = "Active"
    InvalidatedState = "Invalidated"
    ClosedState = "Closed"
    NormalMode = "Normal"
    DegradedMode = "Degraded"
    DefaultTokenVersion = "V2"

\* Tight bounds: focus on transactions + resume
CONSTANTS
    MaxEvents = 2
    MaxClockAdvance = 3
    MaxVersionSwitch = 1
    MaxInvalidations = 0
    MaxTopoChanges = 0
    MaxTransactions = 2
    MaxResumes = 2
    MaxRecreates = 0
    MaxDelivered = 12

SYMMETRY ModelSymmetry
CONSTRAINT StateConstraint

\* Target invariants
INVARIANTS
    TotalOrder
    TxnOrderPreservation
    NoGapOnResume
    CursorPositionsValid
