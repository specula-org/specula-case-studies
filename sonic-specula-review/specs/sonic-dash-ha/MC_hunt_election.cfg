\* MC_hunt_election.cfg — Bug Family 4: Election Edge Cases
\* Targets: MC-8 (equal terms + both desired Active → livelock),
\*          MC-9 (both enter Standalone simultaneously)
\* Strategy: Enable desired state changes + health, check election convergence.

CONSTANTS
    Node = {n1, n2}
    MaxTerm = 4
    MaxRetries = 3

    \* Focus on election protocol
    MaxCrashLimit = 0
    MaxLoseLimit = 3
    MaxDeleteLimit = 0
    MaxDesiredChangeLimit = 4
    MaxHealthChangeLimit = 5
    MaxStandaloneLimit = 3

SYMMETRY ModelSymmetry

INIT MCInit
NEXT MCNext

\* Target invariants
INVARIANT NoStandaloneStandalone
INVARIANT NoDoubleInitActive

\* Core safety
INVARIANT SingleDecisionMaker
INVARIANT NoDoubleActive
INVARIANT TypeOK

CONSTRAINT MsgBufferConstraint

\* Temporal (liveness — requires fairness)
\* PROPERTY ElectionConvergence
