\* MC_hunt_crash.cfg — Bug Family 3: Crash Recovery (commit/send window)
\* Targets: MC-6 (crash between commit and send → split-brain),
\*          MC-7 (config handler swallows error)
\* Strategy: Enable CrashNode, check NoPendingWhileDeciding + SingleDecisionMaker.

CONSTANTS
    Node = {n1, n2}
    MaxTerm = 3
    MaxRetries = 2

    \* Tight bounds: focus on crash window
    MaxCrashLimit = 3
    MaxLoseLimit = 1
    MaxDeleteLimit = 0
    MaxDesiredChangeLimit = 2
    MaxHealthChangeLimit = 3
    MaxStandaloneLimit = 1

SYMMETRY ModelSymmetry

INIT MCInit
NEXT MCNext

\* Target invariant
INVARIANT NoPendingWhileDeciding

\* Core safety
INVARIANT SingleDecisionMaker
INVARIANT NoDoubleActive
INVARIANT TypeOK

CONSTRAINT MsgBufferConstraint
