\* MC_convergence.cfg — Minimal bounds for quick convergence.
\* Verifies spec is well-formed (TypeOK + structural invariants).

CONSTANTS
    Node = {n1, n2}
    MaxTerm = 2
    MaxRetries = 1

    \* No faults for convergence
    MaxCrashLimit = 0
    MaxLoseLimit = 0
    MaxDeleteLimit = 0
    MaxDesiredChangeLimit = 1
    MaxHealthChangeLimit = 2
    MaxStandaloneLimit = 1

SYMMETRY ModelSymmetry

INIT MCInit
NEXT MCNext

\* --- Structural invariants ---
INVARIANT TypeOK
INVARIANT MessageWellFormed
INVARIANT TermNonNegative
INVARIANT FaultCountersOK

CONSTRAINT MsgBufferConstraint
