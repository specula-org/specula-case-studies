\* Hunting config for Bug Family 1: MAC/FDB Age Flag State Machine
\* Targets: M1 (wrong variable), M2 (lost age notifications), M3 (ping-pong)
\* Strategy: Enable MAC operations, minimize heartbeat/warm boot/disconnect

SPECIFICATION MCSpec

CONSTANTS
    p1 = p1
    p2 = p2

    Peer = {p1, p2}
    MAC = {m1}
    MaxNodeId = 2
    MaxTimer = 2
    Nil = Nil

    Active = Active
    Standby = Standby

    MlacpInit = MlacpInit
    MlacpStage1 = MlacpStage1
    MlacpStage2 = MlacpStage2
    MlacpExchange = MlacpExchange
    MlacpError = MlacpError

    PortStateUp = PortStateUp
    PortStateDown = PortStateDown

    SysConfigMsg = SysConfigMsg
    SyncRequestMsg = SyncRequestMsg
    SyncDataDoneMsg = SyncDataDoneMsg
    HeartbeatMsg = HeartbeatMsg
    MacSyncAddMsg = MacSyncAddMsg
    MacSyncDelMsg = MacSyncDelMsg
    NAKSysConfigMsg = NAKSysConfigMsg
    NAKOtherMsg = NAKOtherMsg
    WarmBootMsg = WarmBootMsg

    \* Tight bounds: minimize non-MAC actions
    MaxDisconnectLimit = 1
    MaxLoseLimit = 1
    MaxTimerTickLimit = 0
    MaxNAKLimit = 0
    MaxPortFlapLimit = 2    \* Need port flaps for pending_local_del bugs
    MaxWarmBootLimit = 0
    MaxMsgBufferLimit = 6

    TcpDisconnect  <- MCTcpDisconnect
    MessageLoss    <- MCMessageLoss
    TimerTick      <- MCTimerTick
    MlacpSendNAK   <- MCMlacpSendNAK
    PortChannelDown    <- MCPortChannelDown
    PortChannelUp      <- MCPortChannelUp
    SendWarmBoot   <- MCSendWarmBoot

VIEW ModelView
CONSTRAINT MsgBufferConstraint

CHECK_DEADLOCK
    FALSE

\* Target invariants for Family 1
INVARIANTS
    RoleConsistency
    CorrectAgeVariableCheck
    NoPendingDelLeak
    MACConsistency
