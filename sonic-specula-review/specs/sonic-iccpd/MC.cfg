SPECIFICATION MCSpec

CONSTANTS
    p1 = p1
    p2 = p2

    Peer = {p1, p2}
    MAC = {m1}
    MaxNodeId = 3
    MaxTimer = 3
    Nil = Nil

    Active = Active
    Standby = Standby

    MlacpInit = MlacpInit
    MlacpStage1 = MlacpStage1
    MlacpStage2 = MlacpStage2
    MlacpExchange = MlacpExchange
    MlacpError = MlacpError

    PortStateUp = PortStateUp
    PortStateDown = PortStateDown

    SysConfigMsg = SysConfigMsg
    SyncRequestMsg = SyncRequestMsg
    SyncDataDoneMsg = SyncDataDoneMsg
    HeartbeatMsg = HeartbeatMsg
    MacSyncAddMsg = MacSyncAddMsg
    MacSyncDelMsg = MacSyncDelMsg
    NAKSysConfigMsg = NAKSysConfigMsg
    NAKOtherMsg = NAKOtherMsg
    WarmBootMsg = WarmBootMsg

    \* MC bounds — tuned for tractable state space with 2 peers
    MaxDisconnectLimit = 2
    MaxLoseLimit = 2
    MaxTimerTickLimit = 4
    MaxNAKLimit = 3
    MaxPortFlapLimit = 2
    MaxWarmBootLimit = 2
    MaxMsgBufferLimit = 8

    \* Action overrides (inject counter constraints via operator replacement)
    TcpDisconnect  <- MCTcpDisconnect
    MessageLoss    <- MCMessageLoss
    TimerTick      <- MCTimerTick
    MlacpSendNAK   <- MCMlacpSendNAK
    PortChannelDown    <- MCPortChannelDown
    PortChannelUp      <- MCPortChannelUp
    SendWarmBoot   <- MCSendWarmBoot

VIEW ModelView
CONSTRAINT MsgBufferConstraint

CHECK_DEADLOCK
    FALSE

\* ============================================================================
\* Core Safety Invariants
\* ============================================================================
INVARIANTS
    RoleConsistency

\* ============================================================================
\* Structural Invariants
\* ============================================================================
INVARIANTS
    MlacpStateValid
    NodeIdBound
    AgeFlagOnExistingMac
    MlacpStateMonotonic
    WaitForSyncDataValid

\* ============================================================================
\* Bug Detection Invariants
\* Enable to reproduce violations for specific bug families.
\* ============================================================================
\* INVARIANTS
\*     NoErrorState
\*     NoPendingDelLeak
\*     CorrectAgeVariableCheck
\*     NodeIdCollisionDetected
\*     WarmBootFdbConsistency
\*     NoFalseHeartbeatTimeout

\* ============================================================================
\* Temporal Properties
\* ============================================================================
\* PROPERTIES
\*     MCNodeIdEventuallyDiverge
\*     MCWarmBootEventualCleanup
