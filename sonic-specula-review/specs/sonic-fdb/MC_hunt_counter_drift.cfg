\* Hunting config: Family 5 — FDB Counter Drift & VLAN Removal Deadlock
\* Target: CounterConsistency, VlanRemovable
\* Mechanism: MOVE doesn't update vlan.m_fdb_count; static entries block removeVlan

CONSTANTS
    Port = {p1, p2}
    VLAN = {v1}
    MAC = {m1, m2}
    RemoteVTEP = {vtep1}
    NullOID = NullOID
    ORIGIN_LEARN = ORIGIN_LEARN
    ORIGIN_PROVISIONED = ORIGIN_PROVISIONED
    ORIGIN_VXLAN_ADVERTIZED = ORIGIN_VXLAN_ADVERTIZED
    ORIGIN_MCLAG_ADVERTIZED = ORIGIN_MCLAG_ADVERTIZED
    TYPE_DYNAMIC = TYPE_DYNAMIC
    TYPE_STATIC = TYPE_STATIC
    \* Focus on learn + move + provision + age
    MaxVlanMemberOps = 4
    MaxFlushOps = 1
    MaxLearnOps = 3
    MaxProvisionOps = 2
    MaxRemoveOps = 2
    MaxTunnelOps = 0
    MaxTunnelLearnOps = 0
    MaxSetPendingOps = 0

SYMMETRY ModelSymmetry

SPECIFICATION MCSpec

VIEW MCView

INVARIANTS
    CounterConsistency
    VlanRemovable
    PortFdbCountNonNeg
    VlanFdbCountNonNeg
