\* Hunting config: Family 1 — Stale Bridge Port OID
\* Target: FdbAsicConsistency, NoBridgePortRemoveWithFdb
\* Mechanism: RemoveBridgePortHW runs before HandleFlushNotification,
\*   then LEARN/AGE events are dropped due to stale OID

CONSTANTS
    Port = {p1, p2}
    VLAN = {v1}
    MAC = {m1}
    RemoteVTEP = {vtep1}
    NullOID = NullOID
    ORIGIN_LEARN = ORIGIN_LEARN
    ORIGIN_PROVISIONED = ORIGIN_PROVISIONED
    ORIGIN_VXLAN_ADVERTIZED = ORIGIN_VXLAN_ADVERTIZED
    ORIGIN_MCLAG_ADVERTIZED = ORIGIN_MCLAG_ADVERTIZED
    TYPE_DYNAMIC = TYPE_DYNAMIC
    TYPE_STATIC = TYPE_STATIC
    \* Tight bounds: focus on VLAN member add/remove + learn
    MaxVlanMemberOps = 3
    MaxFlushOps = 0
    MaxLearnOps = 2
    MaxProvisionOps = 0
    MaxRemoveOps = 0
    MaxTunnelOps = 0
    MaxTunnelLearnOps = 0
    MaxSetPendingOps = 0

SYMMETRY ModelSymmetry

SPECIFICATION MCSpec

VIEW MCView

INVARIANTS
    FdbAsicConsistency
    NoBridgePortRemoveWithFdb
    BridgePortConsistency
