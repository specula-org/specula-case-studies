SPECIFICATION MCSpec

\* Hunting config for Family 5: Shutdown Sequence / Point-of-No-Return
\*
\* Target: Failures after Phase 3 checkpoint have no automated recovery.
\* syncd init fails -> ShutdownWait -> blanket rejects all commands.
\* System stuck in unrecoverable state.
\*
\* Strategy: Enable syncd init failure and component failure, disable
\* unrelated faults.

CONSTANTS
    Component = {"orchagent", "syncd", "neighsyncd", "fdbsyncd", "teamd", "vxlanmgrd"}
    Orchagent = "orchagent"
    Syncd = "syncd"
    Neighsyncd = "neighsyncd"
    Fdbsyncd = "fdbsyncd"
    Teamd = "teamd"
    Vxlanmgrd = "vxlanmgrd"

    Key = {"k1"}
    Nil = "Nil"

    PhaseRunning = "PhaseRunning"
    PhaseSanity = "PhaseSanity"
    PhaseFreeze = "PhaseFreeze"
    PhaseCheckpoint = "PhaseCheckpoint"
    PhaseReboot = "PhaseReboot"
    PhaseBooting = "PhaseBooting"
    PhaseReconciling = "PhaseReconciling"

    CRunning = "CRunning"
    CFrozen = "CFrozen"
    CQuiescent = "CQuiescent"
    CCheckpointed = "CCheckpointed"
    CInitialized = "CInitialized"
    CRestored = "CRestored"
    CReconciled = "CReconciled"
    CFailed = "CFailed"

    SyncdNormal = "SyncdNormal"
    SyncdInitView = "SyncdInitView"
    SyncdApplyStage1 = "SyncdApplyStage1"
    SyncdApplyStage2 = "SyncdApplyStage2"
    SyncdDone = "SyncdDone"
    SyncdShutdownWait = "SyncdShutdownWait"
    SyncdCrashed = "SyncdCrashed"

    OrchRunning = "OrchRunning"
    OrchCheckingReady = "OrchCheckingReady"
    OrchReadyReplied = "OrchReadyReplied"
    OrchDraining = "OrchDraining"
    OrchFrozen = "OrchFrozen"
    OrchRestoring = "OrchRestoring"
    OrchWaitApplyView = "OrchWaitApplyView"
    OrchReconciling = "OrchReconciling"

    CacheEmpty = "CacheEmpty"
    CacheSTALE = "CacheSTALE"
    CacheSAME = "CacheSAME"
    CacheNEW = "CacheNEW"
    CacheDELETE = "CacheDELETE"

    Depends <- MCDependsConst

    MaxTimer = 2

    \* Tight bounds: syncd init failure + apply failure + component failure
    MaxEventArrivalLimit = 0
    MaxApplyFailLimit = 1
    MaxCrashLimit = 0
    MaxSyncdInitFailLimit = 1
    MaxComponentFailLimit = 1
    MaxReconcileTimeoutLimit = 1
    MaxPrematureReconcileLimit = 0

    EventArrivalAfterReady <- MCEventArrivalAfterReady
    ApplyViewStage1Fail <- MCApplyViewStage1Fail
    ApplyViewStage2Fail <- MCApplyViewStage2Fail
    CrashBetweenAsicAndRedis <- MCCrashBetweenAsicAndRedis
    SyncdInitFail <- MCSyncdInitFail
    ComponentFailDuringShutdown <- MCComponentFailDuringShutdown
    ComponentFailDuringReconciliation <- MCComponentFailDuringReconciliation
    ReconcileTimeout <- MCReconcileTimeout
    ReconcileComponentWithoutTimer <- MCReconcileComponentWithoutTimer

VIEW ModelView

INVARIANTS
    \* Core safety only
    PhaseMonotonicity
    PointOfNoReturnPermanent

    \* Target invariant
    NoStuckAfterPointOfNoReturn
