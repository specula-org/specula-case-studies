\* MC_hunt_election.cfg — Bug Family 2: Buggy log up-to-date check
\* Target: LeaderCompleteness invariant
\* Strategy: Multiple elections with log divergence, no reads/snapshots

SPECIFICATION MCSpec

CONSTANTS
    s1 = s1
    s2 = s2
    s3 = s3

    Server = {s1, s2, s3}

    MaxTermLimit        = 4
    MaxTimeoutLimit     = 5
    RequestLimit        = 3
    CrashLimit          = 1
    LoseLimit           = 3
    HeartbeatLimit      = 4
    SnapshotLimit       = 0
    ReadRequestLimit    = 0
    ConfigChangeLimit   = 0
    MaxMsgBufferLimit   = 10

    Timeout             <- MCTimeout
    ClientRequest       <- MCClientRequest
    Crash               <- MCCrash
    LoseMessage         <- MCLoseMessage
    SendHeartbeat       <- MCSendHeartbeat
    SendInstallSnapshot <- MCSendInstallSnapshot
    ClientReadRequest   <- MCClientReadRequest

    Nil = Nil
    Follower    = Follower
    Candidate   = Candidate
    Leader      = Leader
    ValueEntry  = ValueEntry
    ConfigEntry = ConfigEntry
    RequestVoteRequest      = RequestVoteRequest
    RequestVoteResponse     = RequestVoteResponse
    AppendEntriesRequest    = AppendEntriesRequest
    AppendEntriesResponse   = AppendEntriesResponse
    InstallSnapshotRequest  = InstallSnapshotRequest
    InstallSnapshotResponse = InstallSnapshotResponse

SYMMETRY Symmetry

CHECK_DEADLOCK
    FALSE

CONSTRAINT
    MsgBufferConstraint

INVARIANTS
    ElectionSafety
    LeaderCompleteness
