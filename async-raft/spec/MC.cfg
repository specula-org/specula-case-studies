SPECIFICATION MCSpec

CONSTANTS
    s1 = s1
    s2 = s2
    s3 = s3

    Server = {s1, s2, s3}

    \* Constraint limits — for simulation convergence check
    MaxTermLimit        = 4
    MaxTimeoutLimit     = 4
    RequestLimit        = 3
    CrashLimit          = 2
    LoseLimit           = 2
    HeartbeatLimit      = 5
    SnapshotLimit       = 2
    ReadRequestLimit    = 2
    ConfigChangeLimit   = 0
    MaxMsgBufferLimit   = 10

    \* Action overrides (inject counter constraints via operator replacement)
    Timeout             <- MCTimeout
    ClientRequest       <- MCClientRequest
    Crash               <- MCCrash
    LoseMessage         <- MCLoseMessage
    SendHeartbeat       <- MCSendHeartbeat
    SendInstallSnapshot <- MCSendInstallSnapshot
    ClientReadRequest   <- MCClientReadRequest

    \* Type constants
    Nil = Nil

    Follower    = Follower
    Candidate   = Candidate
    Leader      = Leader

    ValueEntry  = ValueEntry
    ConfigEntry = ConfigEntry

    RequestVoteRequest      = RequestVoteRequest
    RequestVoteResponse     = RequestVoteResponse
    AppendEntriesRequest    = AppendEntriesRequest
    AppendEntriesResponse   = AppendEntriesResponse
    InstallSnapshotRequest  = InstallSnapshotRequest
    InstallSnapshotResponse = InstallSnapshotResponse

SYMMETRY Symmetry

CHECK_DEADLOCK
    FALSE

\* ============================================================================
\* State Space Pruning
\* ============================================================================
CONSTRAINT
    MsgBufferConstraint

\* ============================================================================
\* Core Raft Safety Invariants (from base spec)
\* ============================================================================
INVARIANTS
    ElectionSafety
    LogMatching
\*    LeaderCompleteness  \* Disabled: violated by Bug Family 3 (unconditional commit_index)

\* ============================================================================
\* Structural Invariants (from MC spec)
\* ============================================================================
INVARIANTS
    CandidateVotedForSelfStructural
    LeaderTermPositiveStructural

\* ============================================================================
\* Bug Detection Invariants
\* Enable to reproduce violations for specific bug families.
\* ============================================================================
\* INVARIANTS
\*     QuorumConfirmation
\*     LinearizableRead
\*     CommitIndexSafety
\*     CommitIndexBoundStructural
\*     SnapshotConsistency
\*     JointQuorum
\*     LeaderLogCompletenessStructural

\* ============================================================================
\* Temporal Properties
\* ============================================================================
\* PROPERTIES
\*     MonotonicTermProp
\*     LeaderAppendOnlyProp
