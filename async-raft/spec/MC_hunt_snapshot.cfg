\* MC_hunt_snapshot.cfg — Bug Family 4: Snapshot state clobbering
\* Target: SnapshotConsistency invariant
\* Strategy: Elections + snapshots, minimal other actions

SPECIFICATION MCSpec

CONSTANTS
    s1 = s1
    s2 = s2
    s3 = s3

    Server = {s1, s2, s3}

    MaxTermLimit        = 3
    MaxTimeoutLimit     = 3
    RequestLimit        = 2
    CrashLimit          = 0
    LoseLimit           = 1
    HeartbeatLimit      = 4
    SnapshotLimit       = 3
    ReadRequestLimit    = 0
    ConfigChangeLimit   = 0
    MaxMsgBufferLimit   = 10

    Timeout             <- MCTimeout
    ClientRequest       <- MCClientRequest
    Crash               <- MCCrash
    LoseMessage         <- MCLoseMessage
    SendHeartbeat       <- MCSendHeartbeat
    SendInstallSnapshot <- MCSendInstallSnapshot
    ClientReadRequest   <- MCClientReadRequest

    Nil = Nil
    Follower    = Follower
    Candidate   = Candidate
    Leader      = Leader
    ValueEntry  = ValueEntry
    ConfigEntry = ConfigEntry
    RequestVoteRequest      = RequestVoteRequest
    RequestVoteResponse     = RequestVoteResponse
    AppendEntriesRequest    = AppendEntriesRequest
    AppendEntriesResponse   = AppendEntriesResponse
    InstallSnapshotRequest  = InstallSnapshotRequest
    InstallSnapshotResponse = InstallSnapshotResponse

SYMMETRY Symmetry

CHECK_DEADLOCK
    FALSE

CONSTRAINT
    MsgBufferConstraint

INVARIANTS
    ElectionSafety
    SnapshotConsistency
