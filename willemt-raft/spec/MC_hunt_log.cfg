\* MC_hunt_log.cfg — Bug Family 2: Log Consistency Under AppendEntries
\*
\* Targets:
\*   MC-5: Heartbeat (empty AE) truncates uncommitted entries
\*   MC-7: Compacted entries re-appended via AE with prev_log_idx==0
\*
\* Strategy: snapshot + message loss/dup creates stale AE messages
\* that trigger incorrect conflict resolution.

CONSTANTS
    Nil = Nil
    Follower = Follower
    Candidate = Candidate
    Leader = Leader
    RequestVoteRequest = RequestVoteRequest
    RequestVoteResponse = RequestVoteResponse
    AppendEntriesRequest = AppendEntriesRequest
    AppendEntriesResponse = AppendEntriesResponse
    InstallSnapshotRequest = InstallSnapshotRequest
    NormalEntry = NormalEntry

    Server = {s1, s2, s3}
    Value = {v1}
    MaxLogLength = 4

    \* Tight bounds for log consistency hunting
    MaxTimeoutLimit = 4
    RequestLimit = 3
    CrashLimit = 0
    LoseLimit = 3         \* Message loss creates stale AE
    DuplicateLimit = 2    \* Duplicate AE triggers dedup path
    SnapshotLimit = 1     \* Need snapshot for boundary bugs
    BroadcastLimit = 5
    MaxMsgCount = 12

SYMMETRY ModelSymmetry

SPECIFICATION MCSpec

CONSTRAINT MsgBufferConstraint

INVARIANTS
    ElectionSafety
    LogMatching
    NoCommittedEntryDeletion
