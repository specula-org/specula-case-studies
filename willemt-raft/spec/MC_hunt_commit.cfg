\* MC_hunt_commit.cfg — Bug Family 1: Commit Index Advancement
\*
\* Targets:
\*   MC-1: Single-point commit check misses higher majority index
\*   MC-2: Missing no-op after election — prior-term entries stuck
\*
\* Strategy: multiple elections + client requests to create entries
\* from different terms, then check commit advancement.

CONSTANTS
    Nil = Nil
    Follower = Follower
    Candidate = Candidate
    Leader = Leader
    RequestVoteRequest = RequestVoteRequest
    RequestVoteResponse = RequestVoteResponse
    AppendEntriesRequest = AppendEntriesRequest
    AppendEntriesResponse = AppendEntriesResponse
    InstallSnapshotRequest = InstallSnapshotRequest
    NormalEntry = NormalEntry

    Server = {s1, s2, s3}
    Value = {v1}
    MaxLogLength = 4

    \* Tight bounds for commit-focused hunting
    MaxTimeoutLimit = 5   \* Multiple elections needed
    RequestLimit = 3      \* Entries from different terms
    CrashLimit = 0        \* No crashes needed
    LoseLimit = 3         \* Message loss triggers out-of-order responses
    DuplicateLimit = 0    \* Not relevant
    SnapshotLimit = 0     \* Not relevant
    BroadcastLimit = 6    \* Need heartbeats
    MaxMsgCount = 12

SYMMETRY ModelSymmetry

SPECIFICATION MCSpec

CONSTRAINT MsgBufferConstraint

INVARIANTS
    ElectionSafety
    LeaderCompleteness
    CommitMonotonicity
