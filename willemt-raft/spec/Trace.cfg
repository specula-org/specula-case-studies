\* Trace.cfg — Trace validation config for willemt/raft
\*
\* Usage:
\*   java -jar tla2tools.jar -deadlock Trace.tla -config Trace.cfg
\*
\* Override trace file with:
\*   -DJSON=../traces/my_trace.ndjson

CONSTANTS
    Nil = Nil
    Follower = Follower
    Candidate = Candidate
    Leader = Leader
    RequestVoteRequest = RequestVoteRequest
    RequestVoteResponse = RequestVoteResponse
    AppendEntriesRequest = AppendEntriesRequest
    AppendEntriesResponse = AppendEntriesResponse
    InstallSnapshotRequest = InstallSnapshotRequest
    NormalEntry = NormalEntry

    \* Server set — must be strings matching trace node IDs
    Server = {"s1", "s2", "s3"}
    Value = {"v1"}
    MaxLogLength = 20

INIT TraceInit
NEXT TraceNext

\* Use -deadlock flag to allow termination when trace is fully consumed
\* TLC will report "deadlock" when all trace events are consumed and
\* no more actions are enabled — this is the expected success condition.

\* Invariants during trace replay
INVARIANTS
    TypeOK

\* Temporal property: entire trace was consumed
\* PROPERTIES
\*     TraceMatched
