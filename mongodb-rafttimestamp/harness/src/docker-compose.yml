# 3-node MongoDB replica set for RaftMongoReplTimestamp trace capture.
# Verbosity 3 on replication captures commit point, term, and optime updates.
# Storage journal verbosity captures journal flusher events.

services:
  mongo1:
    image: mongo:8
    container_name: rts-mongo1
    hostname: mongo1
    command: >
      mongod --replSet rtsrs --port 27017
      --setParameter enableTestCommands=1
      --setParameter "logComponentVerbosity={replication: {verbosity: 3}, storage: {journal: {verbosity: 2}}}"
      --bind_ip_all
    ports:
      - "27217:27017"
    volumes:
      - mongo1-data:/data/db
    networks:
      - rts-net

  mongo2:
    image: mongo:8
    container_name: rts-mongo2
    hostname: mongo2
    command: >
      mongod --replSet rtsrs --port 27017
      --setParameter enableTestCommands=1
      --setParameter "logComponentVerbosity={replication: {verbosity: 3}, storage: {journal: {verbosity: 2}}}"
      --bind_ip_all
    ports:
      - "27218:27017"
    volumes:
      - mongo2-data:/data/db
    networks:
      - rts-net

  mongo3:
    image: mongo:8
    container_name: rts-mongo3
    hostname: mongo3
    command: >
      mongod --replSet rtsrs --port 27017
      --setParameter enableTestCommands=1
      --setParameter "logComponentVerbosity={replication: {verbosity: 3}, storage: {journal: {verbosity: 2}}}"
      --bind_ip_all
    ports:
      - "27219:27017"
    volumes:
      - mongo3-data:/data/db
    networks:
      - rts-net

volumes:
  mongo1-data:
  mongo2-data:
  mongo3-data:

networks:
  rts-net:
    driver: bridge
