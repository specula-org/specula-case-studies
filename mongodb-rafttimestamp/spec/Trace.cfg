\* Trace.cfg — Trace validation config.
\* Run with: java -jar tla2tools.jar -deadlock Trace
\* Use -DJSON=path/to/trace.ndjson to override trace file.

CONSTANT Server = {"n1", "n2", "n3"}
CONSTANT MaxClientWriteSize = 1

SPECIFICATION TraceSpec

\* Deadlock is expected at the end of the trace (cursor exhausted).
\* Use -deadlock flag to DISABLE deadlock checking.

INVARIANT TraceNoTwoPrimariesInSameTerm
INVARIANT TraceLastAppliedBound
INVARIANT TraceLastDurableBound

\* PROPERTY TraceMatched
