\* MC.cfg — Standard model checking config for convergence testing.
\* Run with: java -jar tla2tools.jar -deadlock MC

CONSTANT Server = {n1, n2, n3}
CONSTANT MaxClientWriteSize = 1
CONSTANT MaxTerm = 2
CONSTANT MaxLogLen = 2
CONSTANT MaxRestartTimes = 1
CONSTANT MaxFailoverTimes = 1
CONSTANT MaxPrepareCount = 1
CONSTANT MaxFlusherCount = 2
CONSTANT MaxWCWriteCount = 1
CONSTANT MaxRecoveryCrashCount = 1

SPECIFICATION MCSpec
CONSTRAINT StateConstraint
SYMMETRY ServerSymmetry
VIEW View

\* --- Standard safety invariants ---
INVARIANT NoTwoPrimariesInSameTerm
INVARIANT NeverRollbackCommitted
INVARIANT CommittedSnapshotNeverRollback

\* --- Structural invariants ---
INVARIANT LastAppliedBound
INVARIANT CommitPointMonotonic
INVARIANT HolesInBounds

\* --- Extension invariants (Bug Family targets) ---
\* Uncomment during bug hunting. Kept commented for convergence.
\* INVARIANT StableNeverExceedsAllDurable
\* INVARIANT HolesBlockAllDurable
\* INVARIANT PreparedTxnPinsStable
\* INVARIANT LastDurableImpliesInOplog
\* INVARIANT LastDurableBound
\* INVARIANT AcknowledgedWriteNeverRolledBack
