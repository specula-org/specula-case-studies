\* MC_hunt_recovery.cfg — Bug Family 5: Crash recovery timestamp ordering.
\* Targets: LastDurableImpliesInOplog, LastAppliedBound, CommittedSnapshotNeverRollback
\* Strategy: maximize crashes + recovery crashes, minimize others.

