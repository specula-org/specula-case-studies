\* MC_hunt_feature_flag.cfg — Family 3: Feature Flag Gating Disables Safety
\*
\* When gTerminateSecondaryReadsUponRangeDeletion is disabled (FeatureEnabled=FALSE),
\* the query kill check at shard_role.cpp:1943-1965 is bypassed. Queries proceed
\* with invalidated RangePreservers and can read orphaned/deleted documents.
\*
\* Expected: QueryShouldReadAllDocs VIOLATED (confirms known bug pattern SERVER-87673)
\* This is a KNOWN expected violation — validates the safety boundary.

SPECIFICATION MCSpec

CONSTANT
    NumTrackers = 2
    MaxVersion = 2
    FeatureEnabled = FALSE
    Doc = {d1, d2}
    Query = {q1}
    RangeDeletion = {rd1}
    MaxStepUpLimit = 0
    RDDocs <- MCRDDocs

INVARIANT
    TypeOK
    QueryShouldReadAllDocs
