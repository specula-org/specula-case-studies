INIT TraceInit
NEXT TraceNext

CONSTANT
    NumTrackers = 2
    MaxVersion = 3
    FeatureEnabled = TRUE
    Doc = {d1, d2}
    Query = {q1}
    RangeDeletion = {rd1}
    RDDocs <- TraceRDDocs

\* Safety invariants (should hold on every real execution)
INVARIANT
    TypeOK
    QueryShouldReadAllDocs

\* TraceMatched not used — INIT/NEXT with deadlock-based completion instead
\* (temporal properties trivially fail without fairness under INIT/NEXT)
\* PROPERTIES TraceMatched
