\* ============================================================================
\* MC_hunt_persist_vote.cfg — Bug Family 3: Non-Atomic persistVote
\* ============================================================================
\* Target: VoteSafety (ElectionSafety) violations after crash recovery
\* Mechanism: persistVote writes term then votedFor in two disk operations.
\*            Crash between writes leaves inconsistent persisted state.
\*            After recovery, node may vote for a different candidate in same term.
\*
\* Tight bounds: maximize crashes, minimize irrelevant actions.
\* ============================================================================

SPECIFICATION MCSpec

CONSTANTS
    s1 = s1
    s2 = s2
    s3 = s3

    Server = {s1, s2, s3}

    \* Tight bounds for persistence bug hunting
    MaxTermLimit        = 4      \* Need enough terms for vote + crash + revote
    MaxTimeoutLimit     = 5      \* Multiple elections needed
    RequestLimit        = 1      \* Minimal client requests
    CrashLimit          = 3      \* HIGH: crashes are the bug trigger
    LoseLimit           = 2      \* Some message loss for realistic scenarios
    HeartbeatLimit      = 2      \* Minimal heartbeats
    DiskBlockLimit      = 0      \* Not needed for this family
    ConfigChangeLimit   = 0      \* Not needed for this family
    MaxMsgBufferLimit   = 8

    Timeout             <- MCTimeout
    ClientRequest       <- MCClientRequest
    Crash               <- MCCrash
    LoseMessage         <- MCLoseMessage
    SendHeartbeat       <- MCSendHeartbeat
    DiskBlock           <- MCDiskBlock
    ProposeConfigChange <- MCProposeConfigChange

    Nil = Nil
    Follower    = Follower
    Candidate   = Candidate
    Leader      = Leader
    ValueEntry  = ValueEntry
    ConfigEntry = ConfigEntry
    RequestVoteRequest      = RequestVoteRequest
    RequestVoteResponse     = RequestVoteResponse
    AppendEntriesRequest    = AppendEntriesRequest
    AppendEntriesResponse   = AppendEntriesResponse

SYMMETRY Symmetry

CHECK_DEADLOCK FALSE

CONSTRAINT MsgBufferConstraint

\* Core safety + structural invariants focused on persistence
INVARIANTS
    ElectionSafety
    LogMatching
    PersistedTermConsistencyInv
    PendingVoteStateInv
    CandidateVotedForSelfInv
