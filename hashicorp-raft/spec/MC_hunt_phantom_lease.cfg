\* ============================================================================
\* MC_hunt_phantom_lease.cfg — Bug Family 1: Leader Phantom Lease
\* ============================================================================
\* Target: NoPhantomContact and LeaseImpliesLoyalty violations
\* Mechanism: heartbeat records contact without checking resp.Term (Bug #666),
\*            combined with disk blocking (#503) to keep stale leader alive.
\*
\* Tight bounds: maximize heartbeats and disk blocks, minimize irrelevant actions.
\* ============================================================================

SPECIFICATION MCSpecDynamic

CONSTANTS
    s1 = s1
    s2 = s2
    s3 = s3

    Server = {s1, s2, s3}

    \* Tight bounds for phantom lease hunting
    MaxTermLimit        = 3      \* Need 2 terms: leader elected, then follower advances
    MaxTimeoutLimit     = 3      \* Enough elections to create term divergence
    RequestLimit        = 1      \* Minimal client requests
    CrashLimit          = 0      \* Not needed for this family
    LoseLimit           = 2      \* Lose replicate responses to force heartbeat-only contact
    HeartbeatLimit      = 8      \* HIGH: heartbeats are the bug trigger
    DiskBlockLimit      = 2      \* Disk blocking amplifies phantom lease
    ConfigChangeLimit   = 0      \* Not needed for this family
    MaxMsgBufferLimit   = 10

    Timeout             <- MCTimeout
    ClientRequest       <- MCClientRequest
    Crash               <- MCCrash
    LoseMessage         <- MCLoseMessage
    SendHeartbeat       <- MCSendHeartbeat
    DiskBlock           <- MCDiskBlock
    ProposeConfigChange <- MCProposeConfigChange

    Nil = Nil
    Follower    = Follower
    Candidate   = Candidate
    Leader      = Leader
    ValueEntry  = ValueEntry
    ConfigEntry = ConfigEntry
    RequestVoteRequest      = RequestVoteRequest
    RequestVoteResponse     = RequestVoteResponse
    AppendEntriesRequest    = AppendEntriesRequest
    AppendEntriesResponse   = AppendEntriesResponse

SYMMETRY Symmetry

CHECK_DEADLOCK FALSE

CONSTRAINT MsgBufferConstraint

\* Core safety + targeted bug-family invariants
INVARIANTS
    ElectionSafety
    LogMatching
    NoPhantomContact
    LeaseImpliesLoyalty
