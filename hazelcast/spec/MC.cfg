\* MC.cfg — Standard safety + structural invariants
\* Used during spec convergence. Extension invariants commented out.

CONSTANTS
    Server = {s1, s2, s3}
    Nil = Nil
    Follower = Follower
    Candidate = Candidate
    Leader = Leader
    ValueEntry = ValueEntry
    ConfigEntry = ConfigEntry
    PreVoteRequestMsg = PreVoteRequestMsg
    PreVoteResponseMsg = PreVoteResponseMsg
    VoteRequestMsg = VoteRequestMsg
    VoteResponseMsg = VoteResponseMsg
    AppendEntriesRequestMsg = AppendEntriesRequestMsg
    AppendSuccessResponseMsg = AppendSuccessResponseMsg
    AppendFailureResponseMsg = AppendFailureResponseMsg
    AssertsDisabled = FALSE
    MaxTimeoutLimit = 4
    MaxElectionLimit = 4
    RequestLimit = 2
    AppendEntriesLimit = 6
    CrashLimit = 1
    LoseLimit = 2
    LeaseCheckLimit = 2
    MembershipLimit = 0
    QueryLimit = 0
    MaxTermLimit = 4
    MaxMsgBuffer = 10

SPECIFICATION MCSpec

SYMMETRY ModelSymmetry

VIEW MCView

CONSTRAINT StateConstraint

\* Standard safety invariants
INVARIANTS
    ElectionSafety
    LogMatching

\* Structural invariants
INVARIANTS
    CommitIndexBound
    SingleMembershipChange
    MembershipRevertConsistency
    ConfigConsistency
    PreVoteNoTermInflation

\* Extension invariants (bug-family-specific) — enable for hunting
\* INVARIANT VoteSafety
\* INVARIANT LeaderCompleteness
\* INVARIANT NoPhantomLeaseContact
\* INVARIANT QuerySafety
