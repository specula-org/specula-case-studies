\* MC_hunt_membership.cfg — Bug Family 2: Membership Change Safety Gaps
\*
\* Targets MC-2: Pre-applied membership + leader crash before commit.
\* Targets MC-3: Slow follower receiving batch of committed membership changes.
\*
\* Enables membership changes and crashes, reduces other actions.

CONSTANTS
    Server = {s1, s2, s3}
    Nil = Nil
    Follower = Follower
    Candidate = Candidate
    Leader = Leader
    ValueEntry = ValueEntry
    ConfigEntry = ConfigEntry
    PreVoteRequestMsg = PreVoteRequestMsg
    PreVoteResponseMsg = PreVoteResponseMsg
    VoteRequestMsg = VoteRequestMsg
    VoteResponseMsg = VoteResponseMsg
    AppendEntriesRequestMsg = AppendEntriesRequestMsg
    AppendSuccessResponseMsg = AppendSuccessResponseMsg
    AppendFailureResponseMsg = AppendFailureResponseMsg
    AssertsDisabled = FALSE
    MaxTimeoutLimit = 4
    MaxElectionLimit = 4
    RequestLimit = 2
    AppendEntriesLimit = 8
    CrashLimit = 2
    LoseLimit = 2
    LeaseCheckLimit = 1
    MembershipLimit = 2
    QueryLimit = 0
    MaxTermLimit = 4
    MaxMsgBuffer = 12

SPECIFICATION MCSpec

SYMMETRY ModelSymmetry

VIEW MCView

CONSTRAINT StateConstraint

INVARIANTS
    ElectionSafety
    LogMatching
    SingleMembershipChange
    MembershipRevertConsistency
    ConfigConsistency
