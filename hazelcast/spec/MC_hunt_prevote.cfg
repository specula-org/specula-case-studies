\* MC_hunt_prevote.cfg — Bug Family 4: PreVote Protocol State Management
\*
\* Targets MC-5: Concurrent pre-vote and real election interaction.
\*               Can preCandidateState leak and block future elections?
\* Targets MC-6: Leader stickiness interaction with PreVote.
\*
\* Increases timeout/election limits to explore concurrent pre-vote scenarios.

CONSTANTS
    Server = {s1, s2, s3}
    Nil = Nil
    Follower = Follower
    Candidate = Candidate
    Leader = Leader
    ValueEntry = ValueEntry
    ConfigEntry = ConfigEntry
    PreVoteRequestMsg = PreVoteRequestMsg
    PreVoteResponseMsg = PreVoteResponseMsg
    VoteRequestMsg = VoteRequestMsg
    VoteResponseMsg = VoteResponseMsg
    AppendEntriesRequestMsg = AppendEntriesRequestMsg
    AppendSuccessResponseMsg = AppendSuccessResponseMsg
    AppendFailureResponseMsg = AppendFailureResponseMsg
    AssertsDisabled = FALSE
    MaxTimeoutLimit = 6
    MaxElectionLimit = 6
    RequestLimit = 1
    AppendEntriesLimit = 4
    CrashLimit = 0
    LoseLimit = 3
    LeaseCheckLimit = 1
    MembershipLimit = 0
    QueryLimit = 0
    MaxTermLimit = 5
    MaxMsgBuffer = 10

SPECIFICATION MCSpec

SYMMETRY ModelSymmetry

VIEW MCView

CONSTRAINT StateConstraint

INVARIANTS
    ElectionSafety
    PreVoteNoTermInflation
