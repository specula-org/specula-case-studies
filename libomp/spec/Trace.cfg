INIT TraceInit
NEXT TraceNext

CONSTANTS
    Thread = {0, 1, 2}
    Task = {"T1", "T2"}
    MaxBarriers = 10
    Nil = Nil

\* Check deadlock to verify trace is fully consumed
\* TLC will report deadlock at the last trace event if TraceNext has no enabled actions

INVARIANTS
    TypeOK

\* Enable for debugging trace validation issues:
\* INVARIANT TraceFullyConsumed

\* Temporal property to verify full trace consumption:
\* PROPERTY TraceMatched
