\* Hunting config: Serial parallel + detachable tasks (Family 6 x Family 3)
\* Target: Detachable task created in serial survives serial exit
\* The fulfill event fires after serial exit, accessing freed serial task team
\*
\* NOTE: ActiveTasksImplyActiveTeam excluded (known Direction 2 violation)

SPECIFICATION MCSpec

CONSTANTS
    Thread = {0, 1, 2}
    Task = {T1, T2}
    MaxBarriers = 2
    Nil = Nil
    MaxScheduleTaskLimit = 2
    MaxScheduleDetachLimit = 2
    MaxCancelLimit = 0
    MaxStealFromReapedLimit = 0
    MaxReapLimit = 0
    MaxSerialLimit = 2

VIEW ModelView

SYMMETRY ModelSymmetry

INVARIANTS
    TypeOK
    UnfinishedNonNegative
    ParityConsistency
    ChildCountNonNegative
    TaskCountNonNegative
    OwnershipExclusive
    SerialExitParityConsistent
    SerialTasksNotOrphaned
