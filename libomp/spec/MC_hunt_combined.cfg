\* Hunting config: Combined cross-family interaction
\* Target: All safety invariants checked simultaneously
\* Focus: cancel + task + detach interactions with larger bounds
\* Tests: task stealing during barrier wait, task cleanup at barrier completion,
\*         cancellation + task interaction

SPECIFICATION MCSpec

CONSTANTS
    Thread = {0, 1, 2}
    Task = {T1, T2}
    MaxBarriers = 3
    Nil = Nil
    MaxScheduleTaskLimit = 3
    MaxScheduleDetachLimit = 2
    MaxCancelLimit = 1
    MaxStealFromReapedLimit = 0
    MaxReapLimit = 0
    MaxSerialLimit = 0

VIEW ModelView

SYMMETRY ModelSymmetry

INVARIANTS
    TypeOK
    UnfinishedNonNegative
    ChildCountNonNegative
    TaskCountNonNegative
    CompletedTasksNoOwner
    FreeTasksNoOwner
    FinishedImpliesState
    ParityConsistency
    OwnershipExclusive
    ParityRestoredAfterCancel
