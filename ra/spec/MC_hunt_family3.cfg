\* Bug Family 3: Consistent Query Linearizability
\* Focus: heartbeat-based consistent queries across term changes
\* Tight bounds: multiple heartbeats + elections, minimal snapshots/config

SPECIFICATION MCSpec

CONSTANTS
    Server = {s1, s2, s3}
    Value = {v1}
    Nil = Nil
    NilEntry = NilEntry

    Follower = Follower
    PreVote = PreVote
    Candidate = Candidate
    Leader = Leader
    ReceiveSnapshot = ReceiveSnapshot
    AwaitCondition = AwaitCondition

    PreVoteRequest = PreVoteRequest
    PreVoteResponse = PreVoteResponse
    RequestVoteRequest = RequestVoteRequest
    RequestVoteResponse = RequestVoteResponse
    AppendEntriesRequest = AppendEntriesRequest
    AppendEntriesResponse = AppendEntriesResponse
    HeartbeatRequest = HeartbeatRequest
    HeartbeatResponse = HeartbeatResponse
    InstallSnapshotRequest = InstallSnapshotRequest
    InstallSnapshotResponse = InstallSnapshotResponse

    MemberVoter = MemberVoter
    MemberNonVoter = MemberNonVoter
    MemberPromotable = MemberPromotable

    ValueEntry = ValueEntry
    ConfigEntry = ConfigEntry
    NoopEntry = NoopEntry

    MaxTermLimit = 4
    MaxTimeoutLimit = 4
    RequestLimit = 2
    HeartbeatLimit = 8
    LoseLimit = 2
    SnapshotLimit = 0
    ConfigChangeLimit = 0
    MaxMsgBufferLimit = 12

SYMMETRY ModelSymmetry
VIEW ModelView
CONSTRAINT MsgBufferConstraint

INVARIANTS
    ElectionSafety
    ConsistentQuerySafety
    NoPhantomHeartbeatQuorum
