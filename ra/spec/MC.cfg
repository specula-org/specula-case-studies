SPECIFICATION MCSpec

CONSTANTS
    Server = {s1, s2, s3}
    Value = {v1, v2}
    Nil = Nil
    NilEntry = NilEntry

    Follower = Follower
    PreVote = PreVote
    Candidate = Candidate
    Leader = Leader
    ReceiveSnapshot = ReceiveSnapshot
    AwaitCondition = AwaitCondition

    PreVoteRequest = PreVoteRequest
    PreVoteResponse = PreVoteResponse
    RequestVoteRequest = RequestVoteRequest
    RequestVoteResponse = RequestVoteResponse
    AppendEntriesRequest = AppendEntriesRequest
    AppendEntriesResponse = AppendEntriesResponse
    HeartbeatRequest = HeartbeatRequest
    HeartbeatResponse = HeartbeatResponse
    InstallSnapshotRequest = InstallSnapshotRequest
    InstallSnapshotResponse = InstallSnapshotResponse

    MemberVoter = MemberVoter
    MemberNonVoter = MemberNonVoter
    MemberPromotable = MemberPromotable

    ValueEntry = ValueEntry
    ConfigEntry = ConfigEntry
    NoopEntry = NoopEntry

    \* Counter bounds (convergence: tight bounds for BFS completion)
    MaxTermLimit = 2
    MaxTimeoutLimit = 2
    RequestLimit = 1
    HeartbeatLimit = 0
    LoseLimit = 0
    SnapshotLimit = 0
    ConfigChangeLimit = 0
    MaxMsgBufferLimit = 3

SYMMETRY ModelSymmetry

CONSTRAINT MsgBufferConstraint

\* --- Standard safety invariants ---
INVARIANTS
    ElectionSafety
    LogMatching
    LeaderCompleteness

\* --- Structural invariants ---
INVARIANTS
    MCTermNonNegative
    MCLeaderCommitBound
    MCAppliedBound
    MCNextIndexPositive

\* --- Extension invariants (bug hunting) --- COMMENTED OUT for convergence
\* INVARIANTS
\*     CommitIndexSafety
\*     VoterOnlyElection
\*     VoterOnlyQuorum
\*     NoDuplicateVoteCounting
\*     ConsistentQuerySafety
\*     NoPhantomHeartbeatQuorum
\*     SnapshotLogConsistency
\*     OneClusterChangeAtATime
\*
\* --- Temporal properties --- COMMENTED OUT for convergence (require BFS)
\* PROPERTIES
\*     MonotonicCommitIndex
\*     MonotonicTerm
