\* MC_small.cfg — Small bounds for quick convergence check.

\* ---- Constants ----

CONSTANT Server = {s1, s2, s3}
CONSTANT MaxClientWriteSize = 1
CONSTANT Nil = Nil
CONSTANT WriteConcernMajorityShouldJournal = TRUE

\* InfOpTime defined as operator override
CONSTANT InfOpTime <- MCInfOpTime

\* Small state space bounds
CONSTANT MaxTerm = 2
CONSTANT MaxLogLen = 2

\* Counter bounds
CONSTANT MaxElections = 3
CONSTANT MaxCrashes = 1
CONSTANT MaxClientWrites = 2

\* ---- Spec ----

SPECIFICATION MCSpec
CONSTRAINT StateConstraint

\* ---- Symmetry ----

SYMMETRY ServerSymmetry

\* ---- All Invariants (convergence check) ----

INVARIANT NoTwoPrimariesInSameTerm
INVARIANT NeverRollbackCommitted
INVARIANT NeverRollbackBeforeCommitPoint
INVARIANT WriteApplyOrdering
INVARIANT DurableWriteOrdering
INVARIANT LastDurableWithinLog
INVARIANT CountersValid
INVARIANT CommitPointNeverExceedsLastWritten
INVARIANT CommitPointOnCorrectBranch
INVARIANT LastWrittenEqualsLogLen
INVARIANT LastWrittenTermConsistent
