\* MC.cfg — Standard model checking configuration for convergence testing.
\* Uses moderate bounds. Extension (bug-family) invariants are commented out.
\* Use MC_hunt_*.cfg for targeted bug hunting after convergence.

\* ---- Constants ----

CONSTANT Server = {s1, s2, s3}
CONSTANT MaxClientWriteSize = 1
CONSTANT Nil = Nil
CONSTANT WriteConcernMajorityShouldJournal = TRUE

\* InfOpTime defined as operator override (cfg can't define records)
CONSTANT InfOpTime <- MCInfOpTime

\* State space bounds
CONSTANT MaxTerm = 3
CONSTANT MaxLogLen = 3

\* Counter bounds for non-deterministic actions
CONSTANT MaxElections = 4
CONSTANT MaxCrashes = 1
CONSTANT MaxClientWrites = 4

\* ---- Spec ----

SPECIFICATION MCSpec
CONSTRAINT StateConstraint

\* ---- Symmetry ----

SYMMETRY ServerSymmetry

\* ---- Standard Safety Invariants (always checked) ----

INVARIANT NoTwoPrimariesInSameTerm
INVARIANT NeverRollbackCommitted
INVARIANT NeverRollbackBeforeCommitPoint

\* ---- Structural Invariants (always checked) ----

INVARIANT WriteApplyOrdering
INVARIANT DurableWriteOrdering
INVARIANT LastDurableWithinLog
INVARIANT CountersValid

\* ---- Extension Invariants (bug-family-specific — enable during hunting) ----
\* INVARIANT CommitPointNeverExceedsLastWritten
\* INVARIANT CommitPointOnCorrectBranch
\* INVARIANT LastWrittenEqualsLogLen
\* INVARIANT LastWrittenTermConsistent
