\* MC_hunt_family3.cfg — Hunt for election / catchup / vote persistence bugs.
\* Family 3: Election / Catchup / Stepdown Commit Point Interaction
\*
\* Key insights:
\* - MC-4: LastVote crash between in-memory update and disk persist can allow
\*   two primaries in the same term (SERVER-114780 pattern)
\* - MC-5: Catchup abort on higher term — does commit freeze work correctly?
\* - firstOpTimeOfMyTerm lifecycle must correctly block then unblock commit advancement

\* ---- Constants ----

CONSTANT Server = {s1, s2, s3}
CONSTANT MaxClientWriteSize = 1
CONSTANT Nil = Nil
CONSTANT WriteConcernMajorityShouldJournal = TRUE
CONSTANT InfOpTime <- MCInfOpTime

\* Multiple terms needed for term-change-during-catchup scenarios
CONSTANT MaxTerm = 4
CONSTANT MaxLogLen = 3

\* Maximize elections and crashes to trigger vote persistence issues
CONSTANT MaxElections = 5
CONSTANT MaxCrashes = 2
CONSTANT MaxClientWrites = 3

\* ---- Spec ----

SPECIFICATION MCSpec
CONSTRAINT StateConstraint
SYMMETRY ServerSymmetry

\* ---- Target Invariants ----

INVARIANT NoTwoPrimariesInSameTerm
INVARIANT NeverRollbackCommitted
