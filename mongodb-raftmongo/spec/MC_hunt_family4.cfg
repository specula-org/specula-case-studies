\* MC_hunt_family4.cfg — Hunt for heartbeat commit point ordering bugs.
\* Family 4: Heartbeat as Side-Channel for State Changes
\*
\* Key insight: In the implementation, heartbeat processing advances the commit
\* point BEFORE processing the term update (heartbeat.cpp:331 vs :371). The
\* abstract model uses separate actions which allows any ordering. This config
\* focuses on scenarios where commit point and term updates interact.

\* ---- Constants ----

CONSTANT Server = {s1, s2, s3}
CONSTANT MaxClientWriteSize = 1
CONSTANT Nil = Nil
CONSTANT WriteConcernMajorityShouldJournal = TRUE
CONSTANT InfOpTime <- MCInfOpTime

\* Multiple terms for cross-term commit point propagation
CONSTANT MaxTerm = 3
CONSTANT MaxLogLen = 3

CONSTANT MaxElections = 4
CONSTANT MaxCrashes = 0
CONSTANT MaxClientWrites = 4

\* ---- Spec ----

SPECIFICATION MCSpec
CONSTRAINT StateConstraint
SYMMETRY ServerSymmetry

\* ---- Target Invariants ----

INVARIANT CommitPointOnCorrectBranch
INVARIANT NeverRollbackCommitted
INVARIANT NeverRollbackBeforeCommitPoint
INVARIANT NoTwoPrimariesInSameTerm
