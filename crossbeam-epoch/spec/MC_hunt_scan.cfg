SPECIFICATION MCSpec

\* --- Constants ---
CONSTANTS
    Nil = Nil
    Sentinel = N0

    T1 = T1
    T2 = T2
    T3 = T3
    Thread = {T1, T2, T3}

    N0 = N0
    N1 = N1
    N2 = N2
    N3 = N3
    Node = {N0, N1, N2, N3}

    \* Counter bounds — reduced for tractable BFS with non-atomic scan
    MaxPushes = 2
    MaxPops = 2
    MaxPins = 3
    MaxNestedPins = 1
    MaxUnpins = 3
    MaxHandleReleases = 1
    MaxBagPushes = 2

    \* Buggy actions — DISABLED
    MaxBuggyPops = 0
    MaxNestedCollects = 0

    \* Hunt H1: Non-atomic scan — ENABLED
    MaxNonAtomicScans = 2
    \* Hunt H2-H4: DISABLED
    MaxRepins = 0
    MaxRepinsUnsafe = 0
    MaxStaleBagPushes = 0
    MaxNonAtomicFinalizes = 0

\* --- Symmetry ---
SYMMETRY MCSymmetry

\* --- State Constraint ---
CONSTRAINT MCConstraint

\* --- Invariants ---
INVARIANTS
    TypeOK
    SafeReclamation
    NoDoubleFree
    PinnedConsistency
    QueueStructure
    AccessRequiresPin
    NoOrphanedBags
    DeletedInactive
    EpochMonotonicity
    TailReachability
    FinalizeOnce
