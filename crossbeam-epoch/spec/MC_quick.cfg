\* Quick smoke test config — small bounds for fast validation

SPECIFICATION MCSpec

CONSTANTS
    Nil = Nil
    Sentinel = N0

    T1 = T1
    T2 = T2
    T3 = T3
    Thread = {T1, T2}

    N0 = N0
    N1 = N1
    N2 = N2
    N3 = N3
    Node = {N0, N1, N2}

    MaxPushes = 2
    MaxPops = 2
    MaxPins = 3
    MaxNestedPins = 1
    MaxUnpins = 3
    MaxHandleReleases = 1
    MaxBagPushes = 2

    MaxBuggyPops = 0
    MaxNestedCollects = 0

SYMMETRY MCSymmetry

CONSTRAINT MCConstraint

INVARIANTS
    TypeOK
    SafeReclamation
    NoDoubleFree
    PinnedConsistency
    QueueStructure
    AccessRequiresPin
    NoOrphanedBags
    DeletedInactive
    EpochMonotonicity
    TailReachability
    FinalizeOnce
