\* Trace validation config for crossbeam-epoch
\* Override JsonFile via: java -jar tla2tools.jar -config Trace.cfg Trace -DJON=../traces/my_trace.ndjson

SPECIFICATION TraceSpec

CONSTANTS
    Nil = Nil
    Sentinel = N0

    \* Thread mapping: implementation thread IDs -> spec constants
    \* Override per-trace based on actual thread IDs
    T1 = T1
    T2 = T2
    T3 = T3
    Thread = {T1, T2, T3}

    \* Node mapping: implementation addresses -> spec constants
    N0 = N0
    N1 = N1
    N2 = N2
    N3 = N3
    Node = {N0, N1, N2, N3}

    \* Thread/Node mappings from trace strings to spec constants
    \* These MUST be overridden per-trace in a trace-specific config
    \* Example: ThreadMapping = ("t1" :> T1 @@ "t2" :> T2 @@ "t3" :> T3)
    \* Example: NodeMapping = ("0x1000" :> N0 @@ "0x2000" :> N1 @@ ...)

INVARIANTS
    TypeOK
    SafeReclamation
    PinnedConsistency

\* Use deadlock checking to detect when trace can't be matched.
\* Deadlock at l < Len(TraceLog)+1 means the spec can't match event l.
\* Do NOT use -deadlock flag (that would disable this useful check).
