\* MC_hunt_F6_slot_reuse.cfg
\* Family 6 — Pointer/slot reuse for retired Local nodes.
\* Hunts: ValidLocalState + NoUseAfterRetire when a Local's slot is
\* reused while another thread holds a stale Shared<Entry>.

SPECIFICATION MCSpec

CONSTANTS
    Thread = {t1, t2}
    Object = {o1}
    BagCapacity = 2
    MaxEpoch = 4
    PinLimit = 4
    AdvanceLimit = 2
    BuggyRetireLimit = 0
    SkipFenceLimit = 0
    DeferLimit = 1
    RepinAfterLimit = 0
    UnprotectedDeferLimit = 0
    SlotReuseLimit = 2
    StalledIterLimit = 0

CONSTRAINT StateConstraint
SYMMETRY Symmetry
VIEW View

INVARIANTS
    MCGuardCountNonNegative
    MCValidLocalState
    MCNoUseAfterRetire

CHECK_DEADLOCK FALSE
