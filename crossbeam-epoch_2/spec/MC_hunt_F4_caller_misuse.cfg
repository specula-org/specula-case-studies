\* MC_hunt_F4_caller_misuse.cfg
\* Family 4 — Adversarial Caller / Guard misuse.
\* Hunts: defer-that-pins, repin_after, unprotected defer mixing.

SPECIFICATION MCSpec

CONSTANTS
    Thread = {t1, t2}
    Object = {o1, o2}
    BagCapacity = 2
    MaxEpoch = 4
    PinLimit = 5
    AdvanceLimit = 2
    BuggyRetireLimit = 0
    SkipFenceLimit = 0
    DeferLimit = 3              \* allow Defer with Pin/Defer/Repin bodies
    RepinAfterLimit = 1         \* enable repin_after
    UnprotectedDeferLimit = 1   \* enable unprotected defer
    SlotReuseLimit = 0
    StalledIterLimit = 0

CONSTRAINT StateConstraint
SYMMETRY Symmetry
VIEW View

INVARIANTS
    MCGuardCountNonNegative
    MCHandleCountNonNegative
    MCLocalPinnedWhenGuarded
    MCLocalEpochBoundedByGlobal
    MCFinalizeDoesNotRecurse
    MCNoUseAfterRetire

CHECK_DEADLOCK FALSE
