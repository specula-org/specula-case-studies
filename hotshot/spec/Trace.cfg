SPECIFICATION TraceSpec

CONSTANTS
    Server          = {"s1", "s2", "s3"}
    ByzServer       = {}
    MaxView         = 6
    MaxEpoch        = 2
    Leaves          = {L1, L2, L3}
    NilLeaf         = NilLeaf
    NilQC           = NilQC
    NoCert          = NoCert
    QcMsg           = QcMsg
    TcMsg           = TcMsg
    VscMsg          = VscMsg
    ProposalMsg     = ProposalMsg
    VoteMsg         = VoteMsg
    TimeoutVoteMsg  = TimeoutVoteMsg
    EvNone          = "EvNone"
    EvTimeout       = "EvTimeout"
    EvViewSync      = "EvViewSync"
    PhasePreCommit  = "PhasePreCommit"
    PhaseCommit     = "PhaseCommit"
    PhaseFinalize   = "PhaseFinalize"

INVARIANTS
    \* Safety + structural — should hold on every real execution.
    \* Fault-injection invariants (NoEpochReplayedTC, UniqueFinalizeCertPerView,
    \* ProposalEpochMatchesView) are EXCLUDED from trace validation because they
    \* require Byzantine actions to trigger; honest traces should satisfy them.
    \*
    \* TypeOK is excluded from trace validation because the trace uses concrete
    \* hex leaf commitments (e.g. "COMMIT~px3...") instead of the abstract
    \* Leaves = {L1,L2,L3} model values. Type-conformance is enforced in MC.cfg.
    ElectionSafety_HS2
    HighQCMonotonic_InMem

PROPERTIES
    TraceMatched

CHECK_DEADLOCK FALSE
