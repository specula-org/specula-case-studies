\* MC_hunt_familyA.cfg — Family A: TC / VSC epoch binding.
\* Target finding: MC1 — Byzantine validator collects TimeoutVote2 sigs in epoch E,
\* retags cert.data.epoch = E' and has it verify against verifier's stake-table
\* lookup of E'.
\*
\* Trigger setup:
\*   - TimeoutVote actions on (view, fromE)
\*   - FormTC consolidates them as epochClaim = fromE
\*   - ByzReplayTcAcrossEpoch emits a retagged TC with epochClaim = toE
\*   - The retagged TC verifies as long as signers ⊆ StakeTable(toE),
\*     because TC digest covers only (view).
\*
\* Bounds: keep timeout votes + TC replay alive, zero out unrelated fault paths.

SPECIFICATION MCSpec

CONSTANTS
    Server                = {s1, s2, s3}
    ByzServer             = {b1}
    MaxView               = 3
    MaxEpoch              = 1
    Leaves                = {L1, L2}
    NilLeaf               = NilLeaf
    NilQC                 = NilQC
    NoCert                = NoCert
    QcMsg                 = QcMsg
    TcMsg                 = TcMsg
    VscMsg                = VscMsg
    ProposalMsg           = ProposalMsg
    VoteMsg               = VoteMsg
    TimeoutVoteMsg        = TimeoutVoteMsg
    EvNone                = EvNone
    EvTimeout             = EvTimeout
    EvViewSync            = EvViewSync
    PhasePreCommit        = PhasePreCommit
    PhaseCommit           = PhaseCommit
    PhaseFinalize         = PhaseFinalize
    MaxCrash              = 0
    MaxTcReplay           = 1
    MaxDoubleVote         = 0
    MaxMisdeclaredEpoch   = 0
    MaxForceLockedAdvance = 0
    MaxTimeoutVote        = 3
    MaxRecover            = 0
    MaxQcs                = 2
    MaxTcs                = 3
    MaxVscs               = 0
    MaxProposals          = 2

SYMMETRY ServerSymmetry
VIEW MCView

INVARIANTS
    MCTypeOK
    ElectionSafety_HS2
    NoEpochReplayedTC

CHECK_DEADLOCK FALSE
