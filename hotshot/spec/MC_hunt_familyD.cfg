\* MC_hunt_familyD.cfg — Family D: Non-atomic in-mem ↔ persistent updates.
\* Target finding: MC4 — crash between handle_eqc_formed's in-memory updates and
\* storage.update_eqc await leaves a node with highQcInMem ahead of
\* highQcPersisted. After restart the older persisted high_qc seeds in-mem,
\* leading to a proposal off the wrong parent.
\*
\* Trigger setup:
\*   - UpdateHighQcPersistThenInMem branches: persist first, then in-mem;
\*     a Crash before in-mem write leaves persisted ahead of in-mem.
\*     (Other direction: in_transition_epoch path skips storage, so a Crash
\*     loses the in-mem write entirely.)
\*   - MCCrash and MCRecover combine to surface the divergence.
\*   - HighQC_PersistedConsistent expected to fail.
\*
\* Bounds: keep Crash + Recover alive, zero Byzantine actions.

