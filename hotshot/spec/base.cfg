\* base.cfg — minimal config for the base spec. The MC.cfg is the workhorse.
\* This file exists so that `tlc base.tla -config base.cfg` performs a smoke check.

SPECIFICATION Spec

CONSTANTS
    Server          = {s1, s2, s3}
    ByzServer       = {b1}
    MaxView         = 3
    MaxEpoch        = 1
    Leaves          = {L1, L2}
    NilLeaf         = NilLeaf
    NilQC           = NilQC
    NoCert          = NoCert
    QcMsg           = QcMsg
    TcMsg           = TcMsg
    VscMsg          = VscMsg
    ProposalMsg     = ProposalMsg
    VoteMsg         = VoteMsg
    TimeoutVoteMsg  = TimeoutVoteMsg
    EvNone          = EvNone
    EvTimeout       = EvTimeout
    EvViewSync      = EvViewSync
    PhasePreCommit  = PhasePreCommit
    PhaseCommit     = PhaseCommit
    PhaseFinalize   = PhaseFinalize

INVARIANTS
    TypeOK
    ElectionSafety_HS2
    HighQCMonotonic_InMem
