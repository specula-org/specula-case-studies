\* MC.cfg — standard convergence config.
\* Extension invariants are listed but commented out.
\* Enable them via MC_hunt_*.cfg for bug-family-targeted runs.

SPECIFICATION MCSpec

CONSTANTS
    Server                = {s1, s2, s3}
    ByzServer             = {b1}
    MaxView               = 3
    MaxEpoch              = 1
    Leaves                = {L1, L2}
    NilLeaf               = NilLeaf
    NilQC                 = NilQC
    NoCert                = NoCert
    QcMsg                 = QcMsg
    TcMsg                 = TcMsg
    VscMsg                = VscMsg
    ProposalMsg           = ProposalMsg
    VoteMsg               = VoteMsg
    TimeoutVoteMsg        = TimeoutVoteMsg
    EvNone                = EvNone
    EvTimeout             = EvTimeout
    EvViewSync            = EvViewSync
    PhasePreCommit        = PhasePreCommit
    PhaseCommit           = PhaseCommit
    PhaseFinalize         = PhaseFinalize
    MaxCrash              = 1
    MaxTcReplay           = 1
    MaxDoubleVote         = 1
    MaxMisdeclaredEpoch   = 1
    MaxForceLockedAdvance = 1
    MaxTimeoutVote        = 2
    MaxRecover            = 1
    MaxQcs                = 4
    MaxTcs                = 2
    MaxVscs               = 2
    MaxProposals          = 4

SYMMETRY ServerSymmetry
VIEW MCView

INVARIANTS
    \* --- Structural / type ---
    MCTypeOK
    MCFaultCtrsBounded
    QcSignersWithinStakeTable
    \* --- Standard safety ---
    ElectionSafety_HS2
    HighQCMonotonic_InMem
    \* --- Extension invariants — commented out; enable per-hunt-cfg ---
    \* NoEpochReplayedTC                  \* Family A
    \* NoEquivocationGoesUnflagged        \* Family B
    \* LockedViewBelowOrEqualHighQC       \* Family B+E composition
    \* UniqueFinalizeCertPerView          \* Family C
    \* FinalizeCertImpliesCommitCert      \* Family C
    \* HighQC_PersistedConsistent         \* Family D
    \* ProposalEpochMatchesView           \* Family E

CHECK_DEADLOCK FALSE
