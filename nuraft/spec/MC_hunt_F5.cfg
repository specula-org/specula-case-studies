\* MC_hunt_F5.cfg — Bug Family 5: Missing Guards in Response Handlers
\*
\* Target: ElectionSafety (MC-4: late vote response -> become_leader as follower)
\*         NoStaleMatchIndex (MC-3: stale AE response updates matchIndex)
\*
\* Mechanism: Delayed messages from earlier terms arriving after role/term change.
\*
\* Tight bounds: enable LoseMessage for message reordering, multiple elections.

CONSTANTS
    Server = {s1, s2, s3}
    Nil = Nil
    Follower = Follower
    Candidate = Candidate
    Leader = Leader
    ValueEntry = ValueEntry
    ConfigEntry = ConfigEntry
    PreVoteRequest = PreVoteRequest
    PreVoteResponse = PreVoteResponse
    RequestVoteRequest = RequestVoteRequest
    RequestVoteResponse = RequestVoteResponse
    AppendEntriesRequest = AppendEntriesRequest
    AppendEntriesResponse = AppendEntriesResponse

    MaxTerm = 4
    MaxLogLength = 4

    TimeoutLimit = 5
    ClientReqLimit = 2
    CrashLimit = 0
    LoseLimit = 3
    ConfigChangeLimit = 0
    BypassLimit = 0
    AdjustQuorumLimit = 0
    RestoreQuorumLimit = 0
    HeartbeatLimit = 8
    PersistLimit = 5
    MaxMsgCount = 12

INIT MCInit
NEXT MCNext

CONSTRAINT StateConstraint
SYMMETRY ModelSymmetry

INVARIANTS
    ElectionSafety
    NoStaleMatchIndex
