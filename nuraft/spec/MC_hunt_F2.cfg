\* MC_hunt_F2.cfg — Bug Family 2: Non-Atomic Term/Vote Persistence
\*
\* Target: VoteUniqueness, ElectionSafety
\* Mechanism: Crash between InitiateVote (in-memory term change) and
\*            PersistState, recovering with stale term/votedFor.
\*
\* Tight bounds: enable Crash, minimize irrelevant actions.

CONSTANTS
    Server = {s1, s2, s3}
    Nil = Nil
    Follower = Follower
    Candidate = Candidate
    Leader = Leader
    ValueEntry = ValueEntry
    ConfigEntry = ConfigEntry
    PreVoteRequest = PreVoteRequest
    PreVoteResponse = PreVoteResponse
    RequestVoteRequest = RequestVoteRequest
    RequestVoteResponse = RequestVoteResponse
    AppendEntriesRequest = AppendEntriesRequest
    AppendEntriesResponse = AppendEntriesResponse

    MaxTerm = 4
    MaxLogLength = 3

    TimeoutLimit = 4
    ClientReqLimit = 0
    CrashLimit = 2
    LoseLimit = 2
    ConfigChangeLimit = 0
    BypassLimit = 0
    AdjustQuorumLimit = 0
    RestoreQuorumLimit = 0
    HeartbeatLimit = 4
    PersistLimit = 3
    MaxMsgCount = 8

INIT MCInit
NEXT MCNext

CONSTRAINT StateConstraint
SYMMETRY ModelSymmetry

INVARIANTS
    ElectionSafety
    VoteUniqueness
