\* MC_core.cfg — Core Raft convergence check (no VHBs, no lifecycle)
\* Focuses on election safety + log replication + crash recovery

CONSTANTS
    Server = {s1, s2, s3}
    Value = {v1}
    Nil = Nil
    MaxTerm = 3
    MaxLogLen = 4

    \* Counter bounds
    MaxTimeoutCount = 3
    MaxCrashCount = 1
    MaxClientRequestCount = 2
    MaxLoseCount = 2
    MaxHeartbeatCount = 0
    MaxStopHeartbeatCount = 0
    MaxConfigChangeCount = 0
    MaxEraseCount = 0
    MaxReenrollCount = 0
    MaxDuplicateCount = 0
    MaxSnapshotCount = 0
    MaxMsgBuffer = 8

SPECIFICATION MCSpec

SYMMETRY MCSymmetry

CONSTRAINT MCStateConstraint

\* --- Standard safety invariants ---
INVARIANT ElectionSafety
INVARIANT LogMatching
INVARIANT LeaderCompleteness
INVARIANT StateMachineSafety

\* --- Structural invariants ---
INVARIANT LogTermMonotonicity
INVARIANT LogTermBound
INVARIANT CommitIndexBound
INVARIANT LeaderVotedForSelf
INVARIANT CandidateVotedForSelf
INVARIANT NoPendingStepDownOnFollower
INVARIANT VHBSenderConsistency
INVARIANT WatchdogBlockedConsistency
