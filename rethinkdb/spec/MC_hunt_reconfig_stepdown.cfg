\* MC_hunt_reconfig_stepdown.cfg — Hunting config for MC-7: Step-Down Race During Reconfig
\* Target: ElectionSafety, ConfigChangeSafety
\* Mechanism: leader step-down race when checking committed vs latest config during reconfig
\* Combines Family 2 (async step-down) + Family 3 (config change)

CONSTANTS
    Server = {s1, s2, s3}
    Value = {v1}
    Nil = Nil
    MaxTerm = 5
    MaxLogLen = 6

    \* Tight bounds: enable config changes + async step-down
    MaxTimeoutCount = 5
    MaxCrashCount = 1
    MaxClientRequestCount = 1
    MaxLoseCount = 2
    MaxHeartbeatCount = 4
    MaxStopHeartbeatCount = 2
    MaxConfigChangeCount = 2
    MaxEraseCount = 0
    MaxReenrollCount = 0
    MaxDuplicateCount = 0
    MaxSnapshotCount = 0
    MaxMsgBuffer = 10

SPECIFICATION MCSpec

SYMMETRY MCSymmetry

CONSTRAINT MCStateConstraint

\* Core safety
INVARIANT ElectionSafety
INVARIANT StateMachineSafety

\* Target invariants
INVARIANT AsyncStepDownSafety
INVARIANT ConfigChangeSafety
