    MaxCrashCount = 0
    MaxClientRequestCount = 3
    MaxLoseCount = 2
    MaxHeartbeatCount = 4
    MaxStopHeartbeatCount = 2
    MaxConfigChangeCount = 0
    MaxEraseCount = 0
    MaxReenrollCount = 0
    MaxDuplicateCount = 0
