\* MC.cfg — Standard model checking configuration for RethinkDB Raft
\* Used during spec convergence. Extension invariants commented out.

CONSTANTS
    Server = {s1, s2, s3}
    Value = {v1}
    Nil = Nil
    MaxTerm = 4
    MaxLogLen = 5

    \* Counter bounds
    MaxTimeoutCount = 5
    MaxCrashCount = 2
    MaxClientRequestCount = 3
    MaxLoseCount = 3
    MaxHeartbeatCount = 6
    MaxStopHeartbeatCount = 3
    MaxConfigChangeCount = 0
    MaxEraseCount = 0
    MaxReenrollCount = 0
    MaxDuplicateCount = 0
    MaxSnapshotCount = 2
    MaxMsgBuffer = 10

SPECIFICATION MCSpec

SYMMETRY MCSymmetry

CONSTRAINT MCStateConstraint

\* --- Standard safety invariants ---
INVARIANT ElectionSafety
INVARIANT LogMatching
INVARIANT StateMachineSafety
\* LeaderCompleteness removed: too strong with concurrent stale leaders
\* (stale leader from term T may not have entries committed by term T+1 leader)

\* --- Structural invariants ---
INVARIANT LogTermMonotonicity
INVARIANT LogTermBound
INVARIANT CommitIndexBound
INVARIANT LeaderVotedForSelf
INVARIANT CandidateVotedForSelf
INVARIANT NoPendingStepDownOnFollower
INVARIANT VHBSenderConsistency
INVARIANT WatchdogBlockedConsistency
INVARIANT SnapshotBound

\* --- Extension invariants (commented out for convergence) ---
\* INVARIANT NoStaleLeaderCommit
\* INVARIANT AsyncStepDownSafety
\* INVARIANT ConfigChangeSafety
\* INVARIANT MemberIdUniqueness
\* INVARIANT VirtualHeartbeatTermConsistency
\* INVARIANT SnapshotLogConsistency
\* INVARIANT CommitIndexMonotonicity
