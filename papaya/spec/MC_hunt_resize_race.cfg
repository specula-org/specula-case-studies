\* Hunting config for Family 1: Resize Copy/Insert Race Conditions
\* Targets: NoLostEntry, NoDuplicateEntry, CopyCompleteness
\* Strategy: maximize insert+copy interleavings, minimize irrelevant actions

CONSTANTS
    NULL = NULL
    COPYING = COPYING
    COPIED = COPIED
    BORROWED = BORROWED
    PENDING = PENDING
    ABORTED = ABORTED
    PROMOTED = PROMOTED
    META_EMPTY = META_EMPTY
    META_TOMBSTONE = META_TOMBSTONE
    Thread = {t1, t2, t3}
    Key = {k1, k2}
    Value = {v1, v2}
    Slot = {s1, s2, s3}
    MaxTables = 3
    InsertLimit = 5
    RemoveLimit = 2
    ResizeLimit = 2
    AbortLimit = 0
    EpochLimit = 0
    ParkLimit = 0

SPECIFICATION MCSpec

SYMMETRY ModelSymmetry

CONSTRAINT StateConstraint

\* Target invariants + core safety
INVARIANTS
    NoLostEntry
    NoDuplicateEntry
    CopyCompleteness
    PromotionSafety
