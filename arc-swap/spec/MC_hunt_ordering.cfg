\* ===================================================================================
\* Hunting Config: Family 1 — Cross-Variable SeqCst Ordering Gaps
\* ===================================================================================
\* Target: WriterPaysAllDebts, NoUseAfterFree
\* Mechanism: Writer's AcqRel scan misses reader's SeqCst debt (Bug #198, #200)
\*
\* Tight bounds: maximize ordering gaps, minimize irrelevant actions.

SPECIFICATION MCSpec

CONSTANTS
    Thread = {T1, T2}
    Ptr = {P1, P2, P3}
    NumFastSlots = 1
    InitPtr = P1
    NullPtr = NullPtr
    GEN_MAX = 8

    \* Tight bounds for Family 1
    MaxSwaps = 2
    MaxOrderingGaps = 2          \* KEY: allow ordering gap misses
    MaxStaleReads = 1            \* Allow stale reads on fallback
    MaxFallbacks = 1

CONSTRAINT MCStateConstraint

SYMMETRY ModelSymmetry

INVARIANTS
    NoUseAfterFree
    ReaderHoldsAlivePtr
    RefCountNonNeg
    WriterPaysAllDebts
