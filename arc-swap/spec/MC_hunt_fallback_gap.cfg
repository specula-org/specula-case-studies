\* ===================================================================================
\* Hunting Config: Fallback Stale Read + Ordering Gap → Reader Holds Freed Pointer
\* ===================================================================================
\* Target: ReaderHoldsAlivePtr via combined fallback stale + scan gap

SPECIFICATION MCSpec

CONSTANTS
    Thread = {T1, T2}
    Ptr = {P1, P2, P3}
    NumFastSlots = 1
    InitPtr = P1
    NullPtr = NullPtr
    GEN_MAX = 8

    \* Both mechanisms enabled
    MaxSwaps = 2
    MaxOrderingGaps = 1
    MaxStaleReads = 1
    MaxFallbacks = 1

CONSTRAINT MCStateConstraint

SYMMETRY ModelSymmetry

INVARIANTS
    ReaderHoldsAlivePtr
    RefCountNonNeg
