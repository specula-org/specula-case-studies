\* ===================================================================================
\* v2 Safety Hunt: All faults enabled, only REAL safety invariants
\* ===================================================================================
\* Excludes NoABAViolation (known false positive for fast path: address reuse is safe
\* because debt still protects the re-allocated pointer).

SPECIFICATION MCSpec

CONSTANTS
    Thread = {T1, T2}
    Ptr = {P1, P2, P3}
    NumFastSlots = 1
    InitPtr = P1
    NullPtr = NullPtr
    GEN_MAX = 8

    MaxSwaps = 2
    MaxOrderingGaps = 2
    MaxStaleReads = 1
    MaxFallbacks = 2
    MaxHelps = 2

CONSTRAINT MCStateConstraint

SYMMETRY ModelSymmetry

INVARIANTS
    ReaderHoldsAlivePtr
    RefCountNonNeg
    HelpReplacementAlive
    FallbackCandidateValid
    StoragePtrAlive
    DeadRefCountZero
    ValidReaderSlot
    ValidWriterOldPtr
    ReaderWriterExclusive
