\* ===================================================================================
\* Trace Validation Configuration
\* ===================================================================================
\* Run with: java -jar tla2tools.jar -deadlock Trace
\* Override trace file: -DJSON=../traces/my_trace.ndjson

SPECIFICATION TraceSpec

CONSTANTS
    Thread = {T1, T2}
    Ptr = {P1, P2, P3}
    NumFastSlots = 8
    InitPtr = P1
    NullPtr = NullPtr
    GEN_MAX = 8

\* Use deadlock checking: trace ends when l > Len(TraceLog)
\* TLC reports "deadlock" when the trace is fully consumed — this is expected.
\* -deadlock flag DISABLES deadlock checking.

INVARIANTS
    TypeOK
    NoUseAfterFree
    ReaderHoldsAlivePtr
    RefCountNonNeg
    StoragePtrAlive
