\* ===================================================================================
\* v2 Deep Hunt: 3 threads, 2 fast slots, all families
\* ===================================================================================
\* Maximum concurrency: 2 writers scanning + 1 reader in fallback.
\* 2 fast slots means a reader can hold nested debts.

SPECIFICATION MCSpec

CONSTANTS
    Thread = {T1, T2, T3}
    Ptr = {P1, P2, P3, P4}
    NumFastSlots = 2
    InitPtr = P1
    NullPtr = NullPtr
    GEN_MAX = 8

    MaxSwaps = 2
    MaxOrderingGaps = 1
    MaxStaleReads = 1
    MaxFallbacks = 1
    MaxHelps = 1

CONSTRAINT MCStateConstraint

SYMMETRY ModelSymmetry

INVARIANTS
    MCTypeOK
    ReaderHoldsAlivePtr
    RefCountNonNeg
    NoABAViolation
    HelpReplacementAlive
    FallbackCandidateValid
    StoragePtrAlive
    DeadRefCountZero
    ValidReaderSlot
    ValidWriterOldPtr
    ReaderWriterExclusive
