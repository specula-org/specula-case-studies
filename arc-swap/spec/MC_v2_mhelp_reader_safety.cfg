\* ===================================================================================
\* v2 Mandatory Help - Reader Safety Only
\* ===================================================================================
\* Tests ONLY ReaderHoldsAlivePtr: does the reader ever hold a dead pointer?
\* NoUseAfterFree and WriterPaysAllDebts are removed since the transient
\* dead-pointer-in-slot state is benign if the reader uses replacement.

SPECIFICATION MCSpec

CONSTANTS
    Thread = {T1, T2}
    Ptr = {P1, P2, P3}
    NumFastSlots = 1
    InitPtr = P1
    NullPtr = NullPtr
    GEN_MAX = 8

    MaxSwaps = 3
    MaxOrderingGaps = 0
    MaxStaleReads = 2
    MaxFallbacks = 3
    MaxHelps = 3

CONSTRAINT MCStateConstraint

SYMMETRY ModelSymmetry

INVARIANTS
    ReaderHoldsAlivePtr
    RefCountNonNeg
    StoragePtrAlive
    HelpReplacementAlive
