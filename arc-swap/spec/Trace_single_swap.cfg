\* Trace config for single_swap_load test
\* Single thread, 2 swap+load cycles.
\* Constants are strings (not model values) for identity mapping with trace.

SPECIFICATION TraceSpec

CONSTANTS
    Thread = {"T1"}
    Ptr = {"P1", "P2", "P3"}
    NumFastSlots = 8
    InitPtr = "P1"
    NullPtr = "NullPtr"
    GEN_MAX = 8

INVARIANTS
    TypeOK
    NoUseAfterFree
    ReaderHoldsAlivePtr
    RefCountNonNeg
    StoragePtrAlive
