\* ===================================================================================
\* Hunting Config: Family 3 — Generation Counter Wraparound
\* ===================================================================================
\* Target: CooldownBlocksReaders
\* Mechanism: Generation wraps → cooldown → potential panic in confirm_helping
\*
\* Tight bounds: small GEN_MAX to force wraparound, many fallbacks.

SPECIFICATION MCSpec

CONSTANTS
    Thread = {T1, T2}
    Ptr = {P1, P2, P3}
    NumFastSlots = 1
    InitPtr = P1
    NullPtr = NullPtr
    GEN_MAX = 4                  \* KEY: small to force wraparound quickly

    \* Tight bounds for Family 3
    MaxSwaps = 1
    MaxOrderingGaps = 0
    MaxStaleReads = 0
    MaxFallbacks = 3             \* KEY: need multiple fallbacks for wraparound

CONSTRAINT MCStateConstraint

SYMMETRY ModelSymmetry

INVARIANTS
    NoUseAfterFree
    RefCountNonNeg
    CooldownBlocksReaders
