\* ===================================================================================
\* Hunting Config: Family 1 — Use-After-Free via Ordering Gap
\* ===================================================================================
\* Target: NoUseAfterFree (without WriterPaysAllDebts blocking early detection)
\* Does the ordering gap lead to actual use-after-free?

SPECIFICATION MCSpec

CONSTANTS
    Thread = {T1, T2}
    Ptr = {P1, P2, P3}
    NumFastSlots = 1
    InitPtr = P1
    NullPtr = NullPtr
    GEN_MAX = 8

    \* Tight bounds for Family 1
    MaxSwaps = 2
    MaxOrderingGaps = 2
    MaxStaleReads = 1
    MaxFallbacks = 1

CONSTRAINT MCStateConstraint

SYMMETRY ModelSymmetry

INVARIANTS
    NoUseAfterFree
    ReaderHoldsAlivePtr
    RefCountNonNeg
