\* Hunting config for Bug Family 1, F1a: becomeFollower votedFor reset
\*
\* Target: ElectionSafety violation via same-term votedFor reset
\* Mechanism: Candidate receives AE from same-term leader, votedFor reset
\*            to Nil, then grants vote to a different candidate → two leaders
\*
\* Tight bounds: need 2+ elections (timeouts), 1 AE, no crashes needed
\* Reduce irrelevant actions to minimize state space

SPECIFICATION MCSpec

CONSTANTS
    s1 = s1
    s2 = s2
    s3 = s3

CONSTANTS
    Server = {s1, s2, s3}
    Follower = Follower
    Candidate = Candidate
    Leader = Leader
    Nil = Nil
    RequestVoteRequest = RequestVoteRequest
    RequestVoteResponse = RequestVoteResponse
    AppendEntriesRequest = AppendEntriesRequest
    AppendEntriesResponse = AppendEntriesResponse

\* Tight bounds: maximize elections, minimize irrelevant actions
CONSTANTS
    MaxTermLimit = 3
    MaxTimeoutLimit = 4
    MaxRequestLimit = 0
    MaxCrashLimit = 0
    MaxLoseLimit = 1
    MaxAppendLimit = 4
    MaxMsgBufferLimit = 10

Timeout <- MCTimeout
ClientRequest <- MCClientRequest
Crash <- MCCrash
LoseMessage <- MCLoseMessage
AppendEntries <- MCAppendEntries

SYMMETRY Symmetry
CONSTRAINT MsgBufferConstraint
CHECK_DEADLOCK FALSE

\* Target invariant + core safety
INVARIANTS
    ElectionSafety
