\* Hunting config for Bug Family 1, F1b: missing persist in startElection
\*
\* Target: ElectionSafety or VoteOncePerTerm violation via crash-recovery
\* Mechanism: Timeout (no persist) → crash → recover old term/votedFor
\*            → vote again in the same effective term → two leaders
\*
\* Tight bounds: need timeouts + crashes, minimal client requests

SPECIFICATION MCSpec

CONSTANTS
    s1 = s1
    s2 = s2
    s3 = s3

CONSTANTS
    Server = {s1, s2, s3}
    Follower = Follower
    Candidate = Candidate
    Leader = Leader
    Nil = Nil
    RequestVoteRequest = RequestVoteRequest
    RequestVoteResponse = RequestVoteResponse
    AppendEntriesRequest = AppendEntriesRequest
    AppendEntriesResponse = AppendEntriesResponse

CONSTANTS
    MaxTermLimit = 4
    MaxTimeoutLimit = 5
    MaxRequestLimit = 0
    MaxCrashLimit = 3
    MaxLoseLimit = 2
    MaxAppendLimit = 4
    MaxMsgBufferLimit = 10

Timeout <- MCTimeout
ClientRequest <- MCClientRequest
Crash <- MCCrash
LoseMessage <- MCLoseMessage
AppendEntries <- MCAppendEntries

SYMMETRY Symmetry
CONSTRAINT MsgBufferConstraint
CHECK_DEADLOCK FALSE

INVARIANTS
    ElectionSafety
