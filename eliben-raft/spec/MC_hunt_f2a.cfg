\* Hunting config for Bug Family 2, F2a: stale savedCurrentTerm in vote reply
\*
\* Target: ElectionSafety violation via stale vote counting
\* Mechanism: Candidate starts election T, becomes follower (F1a via AE),
\*            starts new election T+1, old reply from T arrives,
\*            handler checks reply.Term == savedCurrentTerm (T == T) → counts
\*            stale vote → becomes leader in T+1 with votes from T.
\*            Meanwhile another node becomes leader in T+1 → two leaders.
\*
\* Requires both F1a (votedFor reset enables re-election in same term window)
\* and F2a (stale comparison enables counting old votes).
\* No crashes needed — this is a live bug.

SPECIFICATION MCSpec

CONSTANTS
    s1 = s1
    s2 = s2
    s3 = s3

CONSTANTS
    Server = {s1, s2, s3}
    Follower = Follower
    Candidate = Candidate
    Leader = Leader
    Nil = Nil
    RequestVoteRequest = RequestVoteRequest
    RequestVoteResponse = RequestVoteResponse
    AppendEntriesRequest = AppendEntriesRequest
    AppendEntriesResponse = AppendEntriesResponse

\* Multiple elections needed; message loss helps create the right interleaving
CONSTANTS
    MaxTermLimit = 4
    MaxTimeoutLimit = 5
    MaxRequestLimit = 0
    MaxCrashLimit = 0
    MaxLoseLimit = 2
    MaxAppendLimit = 6
    MaxMsgBufferLimit = 12

Timeout <- MCTimeout
ClientRequest <- MCClientRequest
Crash <- MCCrash
LoseMessage <- MCLoseMessage
AppendEntries <- MCAppendEntries

SYMMETRY Symmetry
CONSTRAINT MsgBufferConstraint
CHECK_DEADLOCK FALSE

INVARIANTS
    ElectionSafety

\* Also check for term regression (F2a can cause becomeFollower with stale term)
INVARIANTS
    PersistedTermConsistencyInv
