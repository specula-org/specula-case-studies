SPECIFICATION MCSpec

\* --- Server set ---
CONSTANTS
    s1 = s1
    s2 = s2
    s3 = s3

CONSTANTS
    Server = {s1, s2, s3}

\* --- Protocol constants ---
CONSTANTS
    Follower = Follower
    Candidate = Candidate
    Leader = Leader
    Nil = Nil
    RequestVoteRequest = RequestVoteRequest
    RequestVoteResponse = RequestVoteResponse
    AppendEntriesRequest = AppendEntriesRequest
    AppendEntriesResponse = AppendEntriesResponse

\* --- Counter bounds ---
CONSTANTS
    MaxTermLimit = 3
    MaxTimeoutLimit = 3
    MaxRequestLimit = 2
    MaxCrashLimit = 1
    MaxLoseLimit = 1
    MaxAppendLimit = 4
    MaxMsgBufferLimit = 6

\* --- Action overrides ---
Timeout <- MCTimeout
ClientRequest <- MCClientRequest
Crash <- MCCrash
LoseMessage <- MCLoseMessage
AppendEntries <- MCAppendEntries

\* --- Symmetry reduction ---
SYMMETRY Symmetry

\* --- State space pruning ---
CONSTRAINT MsgBufferConstraint

\* --- Deadlock checking ---
CHECK_DEADLOCK FALSE

\* --- Core safety invariants ---
\* NOTE: Commented out for convergence because the spec intentionally models
\* known bugs (F1a, F1b, F1c, F2a) that violate these. They are checked
\* during bug hunting with targeted configs instead.
\* INVARIANT ElectionSafety
\* INVARIANT LogMatching
\* INVARIANT LeaderCompleteness

\* --- Structural invariants ---
INVARIANTS
    CandidateVotedForSelfInv
    CommitIndexBoundInv
    LeaderTermPositiveInv
    NextIndexPositiveInv

\* --- Bug-family invariants (commented out for convergence) ---
\* INVARIANT PersistedTermConsistencyInv

\* --- Temporal properties (commented out — enable selectively) ---
\* PROPERTY MonotonicTermProp
\* PROPERTY MonotonicCommitProp
