\* MC_hunt_monotonicity.cfg — Bug Family 2: CommitIndex/MatchIndex monotonicity
\* Target: out-of-order AppendEntries causes commitIndex/matchIndex regression.
\* Expected violation: MonotonicCommitIndexProp, MonotonicMatchIndexProp
SPECIFICATION MCSpec

CONSTANTS
    s1 = s1
    s2 = s2
    s3 = s3

    Server = {s1, s2, s3}

    \* Tight bounds: maximize message reordering, minimize elections
    MaxTermLimit        = 3
    MaxPreVoteLimit     = 3
    MaxTimeoutLimit     = 3
    RequestLimit        = 3
    CrashLimit          = 0
    LoseLimit           = 2
    AppendEntriesLimit  = 8
    SnapshotLimit       = 0
    TakeSnapshotLimit   = 0
    ConfigChangeLimit   = 0
    MaxMsgBufferLimit   = 12

    StartPreVote         <- MCStartPreVote
    StartVote            <- MCStartVote
    ClientRequest        <- MCClientRequest
    Crash                <- MCCrash
    LoseMessage          <- MCLoseMessage
    AppendEntries        <- MCAppendEntries
    SendInstallSnapshot  <- MCSendInstallSnapshot
    TakeSnapshot         <- MCTakeSnapshot
    ProposeConfigChange  <- MCProposeConfigChange

    Nil = Nil
    Follower      = Follower
    PreCandidate  = PreCandidate
    Candidate     = Candidate
    Leader        = Leader
    ValueEntry  = ValueEntry
    ConfigEntry = ConfigEntry
    PreVoteRequest          = PreVoteRequest
    PreVoteResponse         = PreVoteResponse
    RequestVoteRequest      = RequestVoteRequest
    RequestVoteResponse     = RequestVoteResponse
    AppendEntriesRequest    = AppendEntriesRequest
    AppendEntriesResponse   = AppendEntriesResponse
    InstallSnapshotRequest  = InstallSnapshotRequest
    InstallSnapshotResponse = InstallSnapshotResponse

SYMMETRY Symmetry

CHECK_DEADLOCK FALSE

CONSTRAINT MsgBufferConstraint

INVARIANTS
    ElectionSafety

PROPERTIES
    MonotonicCommitIndexProp
    MonotonicMatchIndexProp
