\* Hunting config: Bug Family 1 — Non-persistent safety state
\* Target: Crash resets currentTerm/votedFor, enabling double-voting -> ElectionSafety violation
\* Tight bounds: enable crash, minimize irrelevant actions

CONSTANTS
    Server = {s1, s2, s3}

    Nil = Nil
    Follower = Follower
    Candidate = Candidate
    Leader = Leader
    Snapshotting = Snapshotting
    ValueEntry = ValueEntry
    NOPEntry = NOPEntry
    RequestVoteRequest = RequestVoteRequest
    RequestVoteResponse = RequestVoteResponse
    AppendEntriesRequest = AppendEntriesRequest
    AppendEntriesResponse = AppendEntriesResponse
    SnapshotRequest = SnapshotRequest
    SnapshotRecoveryRequest = SnapshotRecoveryRequest

    \* Tight bounds for crash-recovery bug
    MaxTimeoutLimit = 4
    MaxRequestLimit = 1
    MaxCrashLimit = 2       \* KEY: enable crashes
    MaxLoseLimit = 2        \* some message loss for partition simulation
    MaxHeartbeatLimit = 0
    MaxSnapshotLimit = 0
    MaxMsgBufferLimit = 10

SPECIFICATION MCSpec

SYMMETRY MCSymmetry

VIEW MCView

INVARIANTS
    MCElectionSafety
