\* MC_hunt_family4.cfg — FIFO Pop Rollback Atomicity
\* Verify no element loss during the FIFO rollback window.
\* Disable resize/epoch to focus on rollback-specific behavior.

SPECIFICATION MCSpec

CONSTANTS
    Stealer = {s1, s2}
    MaxVal = 5
    BufferCap = 3
    MaxBatch = 2
    MaxResize = 0

CONSTANTS
    MaxResizeLimit = 0
    MaxEpochReclaimLimit = 0

\* No faults — test pure FIFO rollback
CONSTANTS
    SkipRecheckSingle = FALSE
    SkipRecheckBatchFIFO = FALSE
    SkipRecheckBatchLIFO = TRUE
    PrematureReclaimFlag = FALSE

SYMMETRY MCSymmetry
CONSTRAINT MCStateConstraint

\* Target invariants
INVARIANTS
    ConsumedWasPushed
    NoDoublePop
    DequeConsistency
    NoElementLoss
