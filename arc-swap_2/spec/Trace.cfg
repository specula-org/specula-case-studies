\* Trace.cfg — replay implementation traces against base spec.
SPECIFICATION TraceSpec

CONSTANTS
    Thread = {"t1", "t2", "t3"}
    Addr = {"a1", "a2", "a3", "a4"}
    InitAddr = "a1"
    NumFastSlots = 8
    MaxHelpGen = 8
    MaxGuardsPerThread = 2
    NullPtr = "NULL"
    NoneGid = "NONE"
    NoneSite = "NONE_SITE"

\* TraceMatched verifies the entire trace is consumed (no event left unreplayed).
\* We use it as an invariant on the form ~TraceFinished => some action enabled,
\* but in practice TLC's default deadlock detection catches the same condition:
\* if the trace ever reaches a state where no TR_* wrapper fires before
\* TraceFinished, TLC reports a deadlock.  Pair that with the invariants below.
\* PROPERTIES TraceMatched   (* requires fairness; we rely on deadlock check *)

\* Safety invariants — checked on every reachable trace state.
\* Bug-family invariants are excluded from trace validation per skill guide
\* (traces run without fault injection, so e.g. PayAllCompleteness and
\* NoUseAfterFree should hold trivially on real executions).
INVARIANTS
    TypeOK
    RefCountNonNeg
    DeadRefCountZero
    StorageLive
    AllOccupantsAllocated
    NoConcurrentNodeClaim
    \* CooldownReleaseObservesZero is too strong as a state invariant — see
    \* note in MC.cfg.  Disabled here for symmetry; the cooldown protocol's
    \* safety is enforced by CheckCooldown's action guard.
    \* CooldownReleaseObservesZero
