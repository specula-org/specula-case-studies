version: '3.8'
# Minimal sharded cluster for resharding trace collection
# 1 configsvr, 2 shards (1-member RS each), 1 mongos

services:
  configsvr:
    image: mongo:latest
    container_name: resharding-configsvr
    command: >
      mongod --configsvr --replSet configRS --port 27017
      --setParameter enableTestCommands=1
      --setParameter logComponentVerbosity='{sharding: {verbosity: 3}}'
      --bind_ip_all
      --logpath /var/log/mongodb/mongod.log --logappend
    volumes:
      - configsvr-logs:/var/log/mongodb
    networks:
      - mongo-net

  shard1:
    image: mongo:latest
    container_name: resharding-shard1
    command: >
      mongod --shardsvr --replSet shard1RS --port 27017
      --setParameter enableTestCommands=1
      --setParameter logComponentVerbosity='{sharding: {verbosity: 3}}'
      --bind_ip_all
      --logpath /var/log/mongodb/mongod.log --logappend
    volumes:
      - shard1-logs:/var/log/mongodb
    networks:
      - mongo-net

  shard2:
    image: mongo:latest
    container_name: resharding-shard2
    command: >
      mongod --shardsvr --replSet shard2RS --port 27017
      --setParameter enableTestCommands=1
      --setParameter logComponentVerbosity='{sharding: {verbosity: 3}}'
      --bind_ip_all
      --logpath /var/log/mongodb/mongod.log --logappend
    volumes:
      - shard2-logs:/var/log/mongodb
    networks:
      - mongo-net

  mongos:
    image: mongo:latest
    container_name: resharding-mongos
    command: >
      mongos --configdb configRS/configsvr:27017
      --setParameter enableTestCommands=1
      --bind_ip_all --port 27017
    depends_on:
      - configsvr
    ports:
      - "27217:27017"
    networks:
      - mongo-net

volumes:
  configsvr-logs:
  shard1-logs:
  shard2-logs:

networks:
  mongo-net:
    driver: bridge
