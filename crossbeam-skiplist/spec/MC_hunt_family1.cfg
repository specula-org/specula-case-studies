\* Hunt config: Family 1 — Reference Count Lifecycle Errors
\* Focus: insert + remove + release cycles to detect ref count leaks.
\* Tight bounds: minimize iterator and help_unlink overhead.

SPECIFICATION MCSpec

CONSTANTS
    Thread = {t1, t2}
    Key = {1, 2}
    MaxLevel = 2
    MaxNodes = 3
    MaxInsertLimit = 3
    MaxRemoveLimit = 3
    MaxHelpUnlinkLimit = 2
    MarkBeforeCASFlag = FALSE

SYMMETRY MCSymmetry

CONSTRAINT MCStateConstraint

INVARIANTS
    HeadNodeAlive
    RefCountCorrect
    NoUseAfterFinalize
