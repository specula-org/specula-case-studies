SPECIFICATION TraceSpec

CONSTANTS
    Thread = {"t1", "t2"}
    Key = {1, 2}
    MaxLevel = 2
    MaxNodes = 4
    \* markBeforeCAS is set to FALSE in TraceInit (correct code path)

\* Structural invariants
INVARIANTS
    HeadNodeAlive
    ListSorted
    MarkingOrderTopDown

\* Trace completion (inverted: violation = success for Category B)
INVARIANT TraceIncomplete
