SPECIFICATION MCSpec

CONSTANTS
    Thread = {t1, t2}
    Key = {1, 2}
    MaxLevel = 2
    MaxNodes = 4
    MaxInsertLimit = 3
    MaxRemoveLimit = 3
    MaxHelpUnlinkLimit = 4
    MarkBeforeCASFlag = FALSE

SYMMETRY MCSymmetry

CONSTRAINT MCStateConstraint

\* --- Structural invariants ---
INVARIANTS
    HeadNodeAlive
    ListSorted
    MarkingOrderTopDown

\* --- Extension invariants ---
INVARIANT RefCountCorrect
INVARIANT NoUseAfterFinalize
INVARIANT InsertGetConsistency
INVARIANT RemoveLinearizability
INVARIANT Level0Authoritative
