\* Trace validation configuration for flurry ConcurrentHashMap
\* Category B: timebox per-thread traces
\* Uses INIT/NEXT with deadlock-based completion (no temporal property needed)

CONSTANTS
    Thread = {"t1", "t2"}
    NumBins = 8
    MaxKey = 24
    MaxTableMultiplier = 32

INIT TraceInit
NEXT TraceNext

\* Safety + structural invariants (should hold on real executions)
INVARIANTS
    ResizeCoordination
    BinTypeConsistency
    CountNonNeg
    EmptyBinNoKeys
    MovedBinNoKeys
    LockStateNonNeg
    ReaderWriterMutex
