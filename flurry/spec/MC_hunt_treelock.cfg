\* Hunting config for Family 3: TreeBin Read-Write Lock Protocol
\* Tight bounds: allow tree lock ops, minimize resize/epoch

CONSTANTS
    Thread = {t1, t2, t3}
    NumBins = 4
    MaxKey = 8
    MaxTableMultiplier = 4
    MaxPuts = 6
    MaxResizes = 0
    MaxEpochAdvances = 0
    MaxTreeLockOps = 8

SPECIFICATION MCSpec

SYMMETRY ModelSymmetry

VIEW MCView

CONSTRAINT StateConstraint

\* Core safety + Family 3 targets
INVARIANTS
    CountNonNeg
    LockStateNonNeg
    ReaderWriterMutex
    WaiterSafety
