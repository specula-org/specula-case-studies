\* MC.cfg — Standard convergence config (no bug variants)
\* Used during spec validation. Bug-family invariants commented out.

CONSTANTS
    Thread = {t1, t2, t3}
    Key = {k1, k2}
    Bucket = {1, 2}
    MaxArrays = 4
    NullArray = 0
    NullKey = 0
    MaxResizes = 2
    MaxEpochAdvances = 3
    MaxBuggyActions = 0
    MaxAsyncOps = 3

SYMMETRY MCSymmetry

\* Override Next to exclude bug variants
INIT MCInit
NEXT MCNextNoBugs

\* --- Structural invariants (always checked) ---
INVARIANTS
    CounterBounds
    ArrayIdBound
    CurrentArrayExists
    NoCircularChain

\* --- Standard safety invariants ---
INVARIANTS
    EntryReachability
    EntryUniqueness
    NoLostEntryDuringResize
    EpochSafety
    NoAccessToReclaimed

\* --- Extension invariants (bug-family, commented out for convergence) ---
\* INVARIANT GuardBracketsAccess
\* INVARIANT LockBracketsAccess
\* INVARIANT NoUseAfterFree
\* INVARIANT AsyncRefValidity
\* INVARIANT F1_BugDetector
\* INVARIANT F2_BugDetector
\* INVARIANT F5_BugDetector
