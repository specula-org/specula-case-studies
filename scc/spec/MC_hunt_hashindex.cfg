\* MC_hunt_hashindex.cfg — Convergence + lock-free read correctness
\* Tests: per-entry migration + lock-free read (peek_entry) + entry removal + EBR

CONSTANTS
    Thread = {t1, t2, t3}
    Key = {k1, k2}
    MaxArrays = 3
    NullArray = 0
    MaxResizes = 1
    MaxEpochAdvances = 3
    MaxRemoves = 2
    MaxOOMFaults = 0

SYMMETRY Symmetry

\* Limit search for convergence
\* CONSTRAINT CounterConstraint

INIT Init
NEXT Next

\* --- Structural invariants ---
INVARIANTS
    CurrentArrayLive
    EntryReachability
    NoEntryInReclaimed
    EBRSafety

\* --- Lock-free read correctness ---
INVARIANTS
    LockFreeReadCompleteness
    NoRemovedVisible
    OOMSafety
