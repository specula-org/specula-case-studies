# MongoDB sharded cluster for TxnsMoveRange TLA+ trace collection.
# 2 shards (1-member replsets), 1 config server, 1 mongos.
# Sharding verbosity 3 captures migration lifecycle events.
# Transaction verbosity 3 captures router/participant events.

services:
  configsvr:
    image: mongo:8
    container_name: txnmr-configsvr
    command: >
      mongod --configsvr --replSet configRS --port 27017 --bind_ip_all
      --setParameter logComponentVerbosity='{sharding: {verbosity: 3}, transaction: {verbosity: 3}, replication: {verbosity: 2}}'
      --setParameter enableTestCommands=1
      --logpath /var/log/mongodb/mongod.log --logappend
    volumes:
      - configsvr-data:/data/db
      - configsvr-logs:/var/log/mongodb
    networks:
      - mongo-net

  shard1:
    image: mongo:8
    container_name: txnmr-shard1
    command: >
      mongod --shardsvr --replSet shard1RS --port 27017 --bind_ip_all
      --setParameter logComponentVerbosity='{sharding: {verbosity: 3}, transaction: {verbosity: 3}, replication: {verbosity: 2}}'
      --setParameter enableTestCommands=1
      --logpath /var/log/mongodb/mongod.log --logappend
    volumes:
      - shard1-data:/data/db
      - shard1-logs:/var/log/mongodb
    networks:
      - mongo-net

  shard2:
    image: mongo:8
    container_name: txnmr-shard2
    command: >
      mongod --shardsvr --replSet shard2RS --port 27017 --bind_ip_all
      --setParameter logComponentVerbosity='{sharding: {verbosity: 3}, transaction: {verbosity: 3}, replication: {verbosity: 2}}'
      --setParameter enableTestCommands=1
      --logpath /var/log/mongodb/mongod.log --logappend
    volumes:
      - shard2-data:/data/db
      - shard2-logs:/var/log/mongodb
    networks:
      - mongo-net

  mongos:
    image: mongo:8
    container_name: txnmr-mongos
    command: >
      mongos --configdb configRS/configsvr:27017 --port 27017 --bind_ip_all
      --setParameter logComponentVerbosity='{sharding: {verbosity: 3}, transaction: {verbosity: 3}}'
      --setParameter enableTestCommands=1
      --logpath /var/log/mongodb/mongos.log --logappend
    ports:
      - "27217:27017"
    depends_on:
      - configsvr
      - shard1
      - shard2
    volumes:
      - mongos-logs:/var/log/mongodb
    networks:
      - mongo-net

volumes:
  configsvr-data:
  configsvr-logs:
  shard1-data:
  shard1-logs:
  shard2-data:
  shard2-logs:
  mongos-logs:

networks:
  mongo-net:
    driver: bridge
