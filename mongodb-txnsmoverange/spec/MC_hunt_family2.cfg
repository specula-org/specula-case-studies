\* MC_hunt_family2.cfg — Family 2: placementConflictTime propagation
\* Targets: AllParticipantsSameTimestamp, CommittedTxnImpliesKeysAreVisible
\* Focus: router retry with timestamp reset + createdDatabases exemption.

SPECIFICATION MCSpec

CONSTANTS
    Shards = {s1, s2}
    Keys = {k1, k2}
    NameSpaces = {ns1}
    Txns = {t1}
    MIGRATIONS = 2
    TXN_STMTS = 2

    \* Tight bounds for Family 2
    MaxMigrations = 2
    MaxConfigFails = 0       \* No config fails (focus on retry)
    MaxStepDowns = 0
    MaxStepUps = 0
    MaxRetries = 3           \* Focus: multiple retries
    MaxCreateDbs = 1          \* Enable createdDatabases exemption
    MaxExecErrors = 0
    MaxWrongInferences = 0

SYMMETRY MCSymmetry
CONSTRAINT MsgBufferConstraint

INVARIANTS
    CommittedTxnImpliesAllStmtsSuccessful
    CommittedTxnImpliesKeysAreVisible
    AllParticipantsSameTimestamp
    MigrationPhaseConsistency
